id: NFR-02
title: 状態の変化を相手の画面に届ける速さの SLO
status: draft
version: 1
basis: inferred
basis_note: しきい値 5 秒と目標値 95% は提案。携帯の回線と本物の移動を含むので、保守的にした。測定には FRP-07 が要る。受け入れられるまで本番の SLI はなく、NFR-27 の自動テストで遅れを確かめる
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-02
kind: slo
cuj: CUJ-01
statement: 直近 28 日で、依頼と状態の変化の 95% が、起きてから 5 秒以内に相手の画面に示される。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。常時稼働し、使うのはデモの回だけ（質問 1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: 新しい依頼（FR-18）、許諾（FR-20）、取り消し（FR-07、FR-22）、探し直し（FR-22）、迎車の到着（FR-25）
slo:
  sli: SLI-02
  target: 95%
  target_status: provisional
  target_rationale: しきい値 T_deliver（5 秒）と目標値は提案。運用実績がなく、測る仕組み（FRP-07）もまだないので、保守的にした。KPI から導いていない
  window: 28-day rolling
  error_budget: 状態の変化の 5% までが、相手の画面に示されるまで 5 秒を超えてよい
  error_budget_volume: 28 日の状態の変化と相手の数の積 × 0.05（件数は未定）
  policy: EBP-01
  alerts:
  - notify: page
    long_window: 1h
    short_window: 5m
    burn_rate: 14.4
    budget_spent_at_alert: 2.1%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ。デモの回の外では呼び出しをチケットに変える
  - notify: page
    long_window: 6h
    short_window: 30m
    burn_rate: 6
    budget_spent_at_alert: 5.4%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ。デモの回の外では呼び出しをチケットに変える
  - notify: ticket
    long_window: 3d
    short_window: 6h
    burn_rate: 1
    budget_spent_at_alert: 10.7%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ
gate: null
audit: null
monitor: null
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
