acceptance_criteria:
  - 迎車中、ドライバーの現在地と乗車場所への到着予定を地図に示し、現在地が届くたびに更新する。
  - ドライバーの現在地が届かなくなったとき（ドライバーのブラウザが裏に回ったときなど）、最後に分かった位置とその時刻を示し、更新が止まっていることを示す。
