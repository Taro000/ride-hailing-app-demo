id: EBP-01
title: 配車アプリのエラーバジェット方針
status: draft
version: 1
basis: inferred
basis_note: 規則はスキルの出発点の案を、デモの運用（常時稼働、使うのはデモの回だけ。質問 1）に合わせて直した提案
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
applies_to:
- NFR-01
- NFR-02
- NFR-03
- NFR-04
- NFR-05
rules:
- when: 残りのバジェットが 50% を下回った
  action: 次のスプリントは信頼性の作業を先にする
- when: 一つの障害がバジェットの 20% 以上を使った
  action: 振り返りを書き、根本の原因を直す作業を少なくとも一つ先にする
- when: バジェットを使い切った
  action: ウィンドウの残りは、修正とセキュリティの修正だけを出す。次のデモの回を開くかは、プロダクトオーナーが決める
- when: 三つ続けたウィンドウの終わりに 50% 以上が残った
  action: SLO を厳しくするか、残りを出す速さと実験に使う
- when: データの SLO（NFR-04、NFR-05）のバジェットを使い切った
  action: 原因を直す作業と、すでに残った誤った記録を直す作業（決済のサービスの側を含む）の両方をチケットにする
- when: 28 日の有効なイベントが、1 ÷（1 − 目標値）件に満たない
  action: 1 件の悪いイベントでバジェットを使い切る。そのため、バジェットの残りで止めるのではなく、悪いイベントを 1 件ずつ振り返る
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
