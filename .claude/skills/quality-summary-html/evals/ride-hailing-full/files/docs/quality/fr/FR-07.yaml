id: FR-07
title: 乗客による取り消し
status: draft
version: 1
basis: inferred
basis_note: 乗客の取り消しは第 1 段階の QIU-01 と KPI-02 の測定量が前提にしている。受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、乗客が乗車の始まる前に配車依頼を取り消せるようにし、許諾していたドライバーに知らせる。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-13, KPI-01, KPI-02]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配の状況）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 許諾の前に乗客が取り消すと、依頼をドライバーの一覧から消し、押さえた額を解放する。
  - 許諾の後に乗客が取り消すと、ドライバーの画面と音で知らせ、押さえた額を解放する。
  - 乗車が始まった依頼を取り消そうとしたとき、取り消さず、降車場所の変更（FR-12）を案内する。
  - 誰がいつ取り消したかを記録する（FR-39）。
quality_hints:
  - 有効性 (QIU-13) - 取り消しがすぐにドライバーに届き、無駄な迎車を続けさせない
