id: FR-21
title: 走行中の依頼の操作の制限
status: draft
version: 1
basis: inferred
basis_note: QIU-14 から導いた。一覧の仕組みを残して走行中の操作を止めることは質問 1、速度を求められないときは受け付けることは質問 10 で確認済み。V_moving は第 1 段階からの要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 安全の責任者]
statement: システムは、ドライバーの速度が V_moving 以上のとき、依頼を選ぶ操作と許諾する操作を受け付けず、停車してから操作するよう示す。
origin: quality-in-use
cuj: CUJ-06
cuj_step: 配車依頼を選ぶ
traces_to: [QIU-14]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（依頼の一覧、依頼の内容）"
acceptance_criteria:
  - 現在地から求めたドライバーの速度が V_moving 以上のとき、依頼を選ぶ操作と許諾する操作を受け付けず、停車してから操作するよう示す。
  - 速度が V_moving 未満になると、操作を受け付ける。
  - 位置情報が届かず速度を求められないとき、操作を受け付け、速度が分からなかったことを記録する。
  - 受け付けなかった操作の時刻と速度を記録する（QIU-14 の測定に使う）。
quality_hints:
  - 健康・安全リスク緩和性 (QIU-14) - 走行中に依頼を操作させない
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
