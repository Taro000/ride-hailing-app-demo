proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（迎車中）"
acceptance_criteria:
  - 迎車中のドライバーが取り消すと、乗客に知らせ（FR-06）、依頼を乗客の依頼のまま、ほかのドライバーの一覧に戻す。確定した料金と押さえた額はそのまま使う。
  - 乗車が始まった依頼を取り消そうとしたとき、取り消さずその旨を示す。
  - 誰がいつ取り消したかを記録する（FR-39）。
