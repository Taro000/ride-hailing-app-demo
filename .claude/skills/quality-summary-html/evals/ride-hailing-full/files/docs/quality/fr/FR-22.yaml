id: FR-22
title: ドライバーによる取り消しと探し直し
status: draft
version: 1
basis: inferred
basis_note: ドライバーの取り消しは QIU-13 の失敗のシナリオにある。取り消された依頼をほかのドライバーに示し直すこと（QIU-01）は推定
needs_agreement: false
approver_candidates: []
statement: システムは、ドライバーが許諾した依頼を乗車の始まる前に取り消せるようにし、取り消された依頼を乗客の依頼のまま、ほかのドライバーに示し直す。
origin: quality-in-use
cuj: CUJ-06
cuj_step: 依頼を許諾する
