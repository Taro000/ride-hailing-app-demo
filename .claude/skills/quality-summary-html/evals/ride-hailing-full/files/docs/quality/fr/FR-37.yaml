id: FR-37
title: トレース ID
status: draft
version: 1
basis: inferred
basis_note: QIU-18・19 から導いた。受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、ブラウザからの要求ごとにトレース ID を付け、サーバーと外部サービスの呼び出しまで引き継いで、すべてのログに残す。
origin: quality-in-use
cuj: CUJ-10
cuj_step: ログやデータを調査する
traces_to: [QIU-18, QIU-19]
proposal: null
existing: false
extends: null
interface:
  - "API: ブラウザとサーバーの間のすべての要求"
  - "外部: 地図・経路・渋滞の情報のサービス"
  - "外部: 決済のサービス"
acceptance_criteria:
  - ブラウザの一つの操作から始まった処理のログは、どの部分のものでも同じトレース ID を持つ。
  - 外部サービスへの要求と応答のログにも、そのトレース ID を残す。
  - エラーの応答にトレース ID を含め、ブラウザのエラーの記録（FR-38）と結び付けられるようにする。
quality_hints:
  - 有効性 (QIU-18) - 手配・許諾・決済の要求を、最初から最後までたどれる
