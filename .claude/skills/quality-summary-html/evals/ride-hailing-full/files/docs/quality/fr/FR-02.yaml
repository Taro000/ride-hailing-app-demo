id: FR-02
title: 乗る場所・降りる場所の指定
status: draft
version: 2
basis: inferred
basis_note: 手順は入力。現在地を最初から入れる既定値（QIU-03）とピンの調整（QIU-06）は推定
needs_agreement: true
approver_candidates: [プロダクトオーナー]
statement: システムは、乗客が乗る場所と降りる場所を、住所や施設の名前で探すか地図のピンで指定できるようにし、乗る場所には現在地を最初から入れておく。現在地の誤差が D_pickup_accuracy を超えるときは、地図のピンで乗る場所を確かめるよう求める。
origin: cuj-step
cuj: CUJ-01
cuj_step: 乗る場所・降りる場所を決める
traces_to: [QIU-01, QIU-03, QIU-06]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配）"
  - "外部: 地図・経路・渋滞の情報のサービス"
acceptance_criteria:
  - 位置情報の利用を許可した乗客が手配の画面を開くと、現在地が乗る場所として入っている。
  - 住所や施設の名前で探すと候補を示し、選んだ場所に地図のピンを置く。乗客はピンを動かして入口などの位置に合わせられる。
  - 乗る場所に入れた現在地の誤差が D_pickup_accuracy を超えるとき、乗る場所を現在地のまま確定させず、地図のピンで確かめるよう求める。乗客がピンを確かめると、その位置を乗る場所にする。
  - 位置情報の利用が許可されていないとき、現在地を入れず、場所を探して指定するよう示す。
  - 探しても候補がないとき、その旨を示し、地図のピンで指定できるようにする。
  - 乗る場所と降りる場所の間に経路がないとき、料金の確認に進めず理由を示す。
  - 手配の画面を開いた時刻を記録する（QIU-03 の測定に使う）。
quality_hints:
  - QR-28 - 乗る場所が、乗客が実際に待つ場所を表す
  - 効率性 (QIU-03) - 場所の指定に手間取らず、T_book 秒以内に手配を終えられる
  - 有効性 (QIU-06) - 乗客が置いたピンの位置が、そのままドライバーに伝わる
changelog:
