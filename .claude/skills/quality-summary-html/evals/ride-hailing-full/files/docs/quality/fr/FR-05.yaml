id: FR-05
title: 配車の手配
status: draft
version: 2
basis: inferred
basis_note: 手順は入力。手配時に額を押さえて降車時に請求すること、未払いの乗客の手配を受け付けないことは質問 9 で確認済み。進行中の依頼があるときの扱いと二重の確定への対処は推定
needs_agreement: false
approver_candidates: []
statement: システムは、乗客が手配を確定すると、確定した料金を乗客の支払い手段で支払えることを決済の外部サービスに確かめてその額を押さえ、配車依頼を作ってドライバーに示す。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-08, QIU-16, KPI-01]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 乗客が手配を確定すると、確定した料金の額を決済のサービスで押さえ、確定した料金、示した到着予定時刻、その時点のしきい値を持つ配車依頼を作り、乗客の画面を「ドライバーを探しています」にする。
  - 支払い手段が登録されていないとき、依頼を作らず、登録を求める。
  - 決済のサービスが額を押さえられないとき（残高不足、カードの停止など）、依頼を作らず、理由と、別の支払い手段を選ぶ手段を示す。
  - 進行中の依頼がある乗客、または未払いの乗車がある乗客（FR-31）が手配しようとしたとき、依頼を作らず理由を示す。
  - 確定の操作が二度届いても、依頼は一つだけ作り、額も一度だけ押さえる。
quality_hints:
  - 有効性 (QIU-01) - 混雑時にも手配の確定が失敗しない
  - 有効性 (QIU-08) - 二重の依頼や二重の押さえが起きない
