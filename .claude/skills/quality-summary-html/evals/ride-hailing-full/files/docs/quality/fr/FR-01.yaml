id: FR-01
title: アカウントとログイン
status: draft
version: 2
basis: inferred
basis_note: CUJ-01 の手配に乗客の特定が要ることから推定。テスト用の印は QIU と KPI の測定量の絞り込みから。新規であることは運用の事実（第 1 段階の質問 17）。ログインの方式と役割ごとの権限は第 3 段階
needs_agreement: false
approver_candidates: []
statement: システムは、乗客が自分でアカウントを作れるようにし、乗客・ドライバー・運営・サポート担当がそれぞれのアカウントでログインして、自分の役割の画面を使えるようにする。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-08, QIU-11, KPI-01, KPI-02, KPI-03]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（アカウントの作成とログイン）"
  - "画面: ドライバーの Web アプリ（ログイン）"
  - "画面: 管理の画面（ログイン）"
acceptance_criteria:
  - 乗客が必要な項目を入れてアカウントを作ると、ログインして手配の画面を使える。
  - 必要な項目が欠けているとき、または同じ連絡先のアカウントがすでにあるとき、アカウントを作らず理由を示す。
  - ドライバーは運営・サポート担当が作ったアカウント（FR-48）で、運営・サポート担当はあらかじめ用意されたアカウントでログインし、それぞれの役割の画面を使う。
  - 誤った資格情報でログインしようとしたとき、ログインさせずその旨を示す。
  - アカウントにテスト用の印を付けられ、そのアカウントの出来事の記録（FR-39）にも印が残る（測定量からテスト用アカウントを除くため）。
quality_hints:
  - 有効性 (QIU-08) - 他人のアカウントで手配され、請求されることがない
