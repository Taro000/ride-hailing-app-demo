statement: しきい値を設定した乗客は、ドライバーの振る舞いと車の清潔さに満足して乗車を終えられる。
failure_scenario: しきい値を設定したのに、態度の悪いドライバーや汚い車に当たり、乗客はしきい値もサービスも当てにしなくなる。
measure:
