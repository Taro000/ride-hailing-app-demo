  denominator_needed_only: 評価された乗車だけ。評価しない乗客の満足は分からないため、評価する乗客に偏る
  contribution: しきい値を設定する乗客としない乗客は性質が違うため、同じ乗客の設定前後で比べる
  observable: true
  compared_with: null
