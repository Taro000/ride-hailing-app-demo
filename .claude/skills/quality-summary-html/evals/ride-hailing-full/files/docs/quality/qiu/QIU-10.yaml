id: QIU-10
title: しきい値を設定した乗客がドライバーと車に満足する
status: draft
version: 1
basis: inferred
basis_note: ニーズは入力。乗車後の評価を測定量に使うことと L_rating_ok は推定。乗車中の危険を対象にしないことは質問 8 で確認済み
needs_agreement: true
approver_candidates:
