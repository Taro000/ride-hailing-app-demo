  - "画面: ドライバーの Web アプリ（迎車中）"
  - "画面: 乗客の Web アプリ（迎車中）"
acceptance_criteria:
  - 迎車中、位置情報の利用を許可した乗客の現在地をドライバーの地図に示し、届くたびに更新する。
  - 乗客が許可していないとき、または現在地が届かないとき、乗車場所のピンだけを示し、乗客の現在地が分からないことを示す。
  - 乗車が始まるか依頼が終わると、乗客の現在地を示すのをやめ、乗客のブラウザからの送信も止める。
quality_hints:
