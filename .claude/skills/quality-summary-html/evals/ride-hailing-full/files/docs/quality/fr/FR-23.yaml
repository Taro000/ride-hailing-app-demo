id: FR-23
title: ドライバーへの経路の表示
status: draft
version: 1
basis: inferred
basis_note: 第 1 段階のヒント（迎車中の現在地）から。Web アプリの中で経路を示し、音声の案内はしないことは質問 2 で確認済み。受け入れ基準の細部は推定。迎車の区間はどの CUJ の手順にもないため、最も近い手順に結び付けた
needs_agreement: false
approver_candidates: []
statement: システムは、迎車中のドライバーに現在地から乗車場所までの経路を、乗車中のドライバーに降車場所までの経路を、Web アプリの中の地図に示す。
origin: quality-in-use
cuj: CUJ-07
cuj_step: 運転を始める
traces_to: [QIU-02, QIU-06, QIU-15]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（迎車中、乗車中）"
  - "外部: 地図・経路・渋滞の情報のサービス"
acceptance_criteria:
  - ドライバーが許諾すると、現在地から乗車場所までの経路と乗車場所のピンを地図に示す。
  - 運転を始めると（FR-26）、降車場所までの経路と降車場所のピンを示す。降車場所が変わると（FR-12）、経路を示し直す。
  - 外部のサービスから経路を得られないとき、乗車場所または降車場所のピンだけを示し、経路を示せないことを示す。
quality_hints:
  - 有効性 (QIU-06) - 乗客が置いたピンの位置どおりに車が着く
  - 有効性 (QIU-15) - ドライバーが乗車場所に迷わず着く
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
