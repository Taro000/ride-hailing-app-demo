id: FR-50
title: 返金
status: draft
version: 2
basis: inferred
basis_note: QIU-26 から導いた。受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当が乗車の請求の一部または全部を、返金できる残りの額の範囲で、理由を添えて返金できるようにし、同じ返金を二度行わない。
origin: quality-in-use
cuj: CUJ-16
cuj_step: null
traces_to: [QIU-26]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（請求と返金）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 運営・サポート担当が額と理由を入れて返金すると、決済のサービスで返金し、額、理由、担当、時刻を記録し、乗客の履歴（FR-44）に示す。
  - 返金できる残りの額を超える額は受け付けず、その旨を示す。
  - 返金の要求ごとに一意のキーを付け、同じ返金の操作が二度届いても返金は一度だけ行う。
  - 決済のサービスが返金に失敗したとき、返金を完了と記録せず理由を示す。やり直すときは同じキーを使う。
quality_hints:
  - 有効性 (QIU-26) - 返金しすぎや二重の返金がない
