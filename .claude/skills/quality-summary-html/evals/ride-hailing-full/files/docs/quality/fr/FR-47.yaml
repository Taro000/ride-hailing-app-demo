id: FR-47
title: ドライバーの配車の停止と再開
status: draft
version: 1
basis: inferred
basis_note: QIU-23 の失敗のシナリオ（同じドライバーが配車され続ける）から導き、質問 8 で確認済み。進行中の依頼を続けさせることは推定
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当がドライバーの配車を停止・再開できるようにし、停止中のドライバーには受付を開始させず依頼を示さない。
origin: quality-in-use
cuj: CUJ-14
cuj_step: null
traces_to: [QIU-23]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（ドライバー）"
acceptance_criteria:
  - 運営・サポート担当がドライバーの配車を停止すると、そのドライバーの受付を止め、依頼の一覧を示さない。迎車中・乗車中の依頼は、終わるまで続けられる。
  - 停止中のドライバーが受付を開始しようとしたとき、開始させない（FR-17）。
  - 再開すると、そのドライバーは受付を開始できる。
  - 停止と再開の時刻、担当、理由を記録する。
quality_hints:
  - 有効性 (QIU-23) - 停止したドライバーに新しい依頼が届かない
