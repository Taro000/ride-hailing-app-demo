system:
  name: 課題提出サービス（homework-portal）
  boundary: 生徒と講師が使う Web アプリ（課題の配布、提出、採点、返却）、塾の事務が見る月次のレポート、それらを動かすサーバーとログ。保護者向けの画面と月謝の決済は除く。
  purpose: 生徒が期限までに課題を出し、講師が早く返せるようにする
  constraints: [提出したファイルは外部のストレージに置く]
  data_producers: [外部のストレージ（提出したファイル）]
  basis: stated
kgis:
- {id: KGI-01, name: 継続率, measure: 月末に在籍している生徒 ÷ 月初に在籍していた生徒, target: 95%, basis: stated}
outcomes:
- id: OUT-01
  statement: 期限までに課題を提出する生徒を増やす
  verb: increase
  kgis: [KGI-01]
  basis: stated
- id: OUT-02
  statement: 返却の遅れについての問い合わせを減らす
  verb: decrease
  kgis: [KGI-01]
  basis: inferred
users:
- {id: USR-01, name: 生徒, category: primary, data_role: both, considered: true, exclusion_reason: null, basis: stated}
- {id: USR-02, name: 講師, category: primary, data_role: both, considered: true, exclusion_reason: null, basis: stated}
- {id: USR-03, name: 開発者, category: secondary-maintenance, data_role: consumer, considered: true, exclusion_reason: null, basis: inferred, basis_note: 障害の調査をする人として推定}
- {id: USR-04, name: 塾の事務, category: indirect, data_role: consumer, considered: true, exclusion_reason: null, basis: stated}
- {id: USR-05, name: 保護者, category: indirect, data_role: consumer, considered: false, exclusion_reason: 今期は保護者向けの画面を作らない（質問 2）, basis: confirmed}
cujs:
- id: CUJ-01
  name: 課題の提出
  users: [USR-01]
  user_goal: 期限までに、正しいファイルを迷わず提出する
  steps: [課題を開く, ファイルを添付する, 提出する]
  outcomes: [OUT-01]
  basis: stated
- id: CUJ-02
  name: 採点と返却
  users: [USR-02]
  user_goal: 提出を早く採点し、講評を付けて返す
  steps: [提出を開く, 採点する, 返却する]
  outcomes: [OUT-02]
  basis: stated
- id: CUJ-03
  name: 提出の失敗の調査
  users: [USR-03]
  user_goal: 提出できなかった原因を早く突き止めて直す
  steps: [知らせを受ける, ログをたどる, 原因を直す]
  outcomes: []
  basis: inferred
  basis_note: 手順は推定
- id: CUJ-04
  name: 月次の提出状況の確認
  users: [USR-04, USR-02]
  user_goal: 未提出の生徒を月ごとに確かめ、声をかける
  steps: [レポートを開く, 未提出の生徒を確かめる]
  outcomes: [OUT-01]
  basis: stated
hints:
- {statement: 生徒の個人情報を扱う, kind: law, source: 入力の要望書}
operational_facts:
- {fact: 提出は締め切り前の 24 時間に集まる, source: 入力の要望書}
