  rejected options' reasons from dec/*.yaml, DEC-06 included, although the stage 2 report's decisions table leaves it
  out; the final report tells the user so. Every text shows only its gist, its first sentence without bracketed asides
  (DEC-02's rationale stops before 「署名付き URL なら」). No revision notes (finding numbers, 「版 2」, the previous version,
  re-runs) reach the page. The reports' diagrams are drawn, the flow numbers on the threat diagram link to the threat
  table, and NFR-06's hop budgets are a chart against 3 seconds.
