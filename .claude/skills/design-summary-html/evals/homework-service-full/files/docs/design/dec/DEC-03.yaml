question: 受領の表示を、提出の記録とどう一致させるか
addresses:
- DRV-03
- DRV-09
options:
- name: 一つのトランザクションで記録を書き、受領を返す
  effect: 受領と記録が食い違わない
  cost: 確定が少し遅くなる
- name: 受領を先に返し、記録は後で書く
  effect: 確定が速い
  cost: 記録が欠けても受領が出る
chosen: 一つのトランザクションで記録を書き、受領を返す
rationale: 原則 DRV-09 に従う。前の版は、受領を先に示していた（FND-01）。
