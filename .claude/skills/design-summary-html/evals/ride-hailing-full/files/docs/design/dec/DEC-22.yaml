id: DEC-22
title: 地図サービスはサーバーの一つのモジュールから、決まった場面だけ呼ぶ
status: draft
version: 3
basis: inferred
basis_note: 提案（質問 11・26 は回答なし）。依頼の内容の経路は第 3 段階が足した形に合わせた。Google の規約は確かめる
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: architecture
question: Google Maps Platform をどう呼び、費用と待ち時間と失敗をどう抑えるか
addresses:
- DRV-11
- DRV-26
- DRV-06
- DRV-08
- DRV-14
- DRV-28
- FND-28
options:
- name: 場所の検索、経路、到着予定は、サーバーの地図のモジュール一つから呼ぶ（タイムアウト、回数の制限、トレースの記録をここに置く）。ブラウザは地図の表示だけを読み込む。経路は見積もりごと、依頼の内容（ドライバーから乗車場所まで。60 秒の内の許諾ではこれを使い回す）、許諾、運転の開始、降車場所の変更のときに一度ずつ求め、迎車中と乗車中の到着予定は T_eta_refresh ごとにだけ取り直し、その間は持っている経路で進める。1 日の呼び出しの上限は、Google Cloud で API ごとに設定する割り当て（Q_maps_day。DEC-21）に任せ、達したら決まった扱いに移る（DRV-11）。一覧、受ける条件、近くのドライバーの数は直線の距離で判定する。場所の検索はセッションのトークンでまとめる。Google の経路と地点の内容は依頼の間だけ持つ
  effect: 呼び出しの数が乗車ごとにほぼ決まり、失敗の扱いが一か所にそろう
  cost: 到着予定の精度が取り直しの間隔に左右される
- name: ブラウザから Places と Routes を直接呼ぶ
  effect: サーバーを通らず速い
  cost: 鍵の乱用で費用が増え、外部の呼び出しのログにトレース ID を残せない。タイムアウトと扱いが画面ごとにばらつく
- name: 位置が届くたびに経路で到着予定を求め直す
  effect: 到着予定が最も新しい
  cost: 1 乗車あたり 1 分に 6 回の呼び出しで、費用が 6 倍
chosen: 場所の検索、経路、到着予定は、サーバーの地図のモジュール一つから呼ぶ（タイムアウト、回数の制限、トレースの記録をここに置く）。ブラウザは地図の表示だけを読み込む。経路は見積もりごと、依頼の内容（ドライバーから乗車場所まで。60 秒の内の許諾ではこれを使い回す）、許諾、運転の開始、降車場所の変更のときに一度ずつ求め、迎車中と乗車中の到着予定は T_eta_refresh ごとにだけ取り直し、その間は持っている経路で進める。1 日の呼び出しの上限は、Google Cloud で API ごとに設定する割り当て（Q_maps_day。DEC-21）に任せ、達したら決まった扱いに移る（DRV-11）。一覧、受ける条件、近くのドライバーの数は直線の距離で判定する。場所の検索はセッションのトークンでまとめる。Google の経路と地点の内容は依頼の間だけ持つ
rationale: TC-11 の Google Maps Platform を、DRV-26（使った分の料金、無料の枠を優先）と DRV-11（失敗と遅れの決まった扱い）と DRV-14（一つのモジュールに閉じ込める）に合わせて使う。FR-37 AC2（DRV-28）のトレースもサーバーで残せる。精度（DRV-06）は主でなく、取り直しの間隔で調整できる。版 1 は経路を求める場面に依頼の内容を数えていなかった。FR-19 の乗車場所までの所要時間はドライバーから乗車場所までの経路が要る（第 3 段階が足した。FND-28）。版 2 は、URL を公開するので 1 日の呼び出しを数えて割り当て済みの依頼の分を取り置いた（DEC-21 版 4。FND-23）。招待制で地図を使うのはログインした人だけになったので、版 3 で数えと取り置きをやめ、1 日の上限は Google Cloud の割り当てに任せる（DEC-21 版 5）
rejected:
- option: ブラウザから Places と Routes を直接呼ぶ
  reason: DRV-26、DRV-28、DRV-29 で負ける
- option: 位置が届くたびに経路で到着予定を求め直す
  reason: DRV-26 を満たさない
gains:
- 呼び出しの数と費用が読める（デモの回 1 回で、割り当て済みの依頼とドライバーの分は多くて 198 回。計算）
- 失敗の扱いとトレースが一か所
costs:
- 到着予定の精度が取り直しの間隔に左右される
sensitive_points:
- T_eta_refresh（費用と精度の引き換え）
- 地図の呼び出しのタイムアウト
trade_offs:
- with: DRV-06
  note: 到着予定の表示は最大 1 分古くなる
assumptions:
- Google Maps Platform の規約の、内容をためておくことの制限は、経路と地点の内容を依頼の間だけ持てば守れる（確かめる）
depends_on:
- DEC-26
- DEC-21
parameters:
- name: T_eta_refresh（到着予定の取り直し）
  value: 60 秒
  basis: 到着予定は分の単位で示すので、表示が古くなるのは 1 分まで。1 乗車あたり 1 分に 1 回の呼び出し
- name: 地図の呼び出しのタイムアウト
  value: 2 秒。要求の中ではやり直さない
  basis: NFR-24 の 3 秒に 0.9 秒の余裕（計算）
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 経路を求める場面に依頼の内容（ドライバーから乗車場所まで。60 秒の内の許諾で使い回す）を足し、デモの回 1 回の見込みを 198 回にした。1 日の呼び出しを数えて割り当て済みの依頼の分を取り置くこと（DEC-21）を足した
  reason: FND-28、23 を受け入れた（第 2 段階の再実行、3 回目）。第 3 段階が足した形に合わせた
- version: 3
  date: '2026-11-03'
  change: 地図のモジュールが API ごとに 1 日の呼び出しを数えて割り当て済みの依頼の分を取り置くことをやめ、1 日の上限は Google Cloud の API ごとの割り当て（Q_maps_day）に任せることにした
  reason: 招待制（FR-01 版 3、PC-06）で地図を使うのはログインした人だけになり、DEC-21 版 5 が取り置きを外した（第 2 段階の再実行、4 回目）
