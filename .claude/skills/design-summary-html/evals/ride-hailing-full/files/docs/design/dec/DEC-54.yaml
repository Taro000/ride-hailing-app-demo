id: DEC-54
title: 知らせの形と一つ目の規則の条件
status: draft
version: 2
basis: inferred
basis_note: DEC-17（一つ目の規則の条件の形を第 3 段階に任せた）、Cloud Monitoring の指標の一覧（ラベル、60 秒ごと、120 秒の遅れ）、FND-20 の論点は入力。知らせの形と条件の値は推定
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: エンジニアへの知らせをどの形で送り、Cloud Monitoring の一つ目の規則をどんな条件にするか
addresses:
- IFC-17
- IFC-19
- DEC-17
- DEC-35
- FND-20
- FR-36
- DRV-28
- DRV-01
options:
- name: "中立の知らせの形（種類、急ぎか、件数、窓、トレース ID の例、依頼 ID、知らせの ID）。記録を書けなくても先に送る。一つ目の規則は二つの条件を持つ。5xx が 5 分で 5 件以上か、インスタンスの指標が 10 分ないときは急ぐ知らせ。429 が 5 分で 30 件以上のときは急がない知らせ（入口が返す 429 と、業務の回数の制限やログインの総当たりで返す 429 を指標で分けられないため、しきい値を高くして急ぎを下げる）。知らせの種類: server_error、external_failure、client_error、slo_burn（page か ticket。DEC-35）、reconciliation_mismatch、money_error（NFR-07）、assignment_violation（NFR-09）、daily_result、job_failed（ELM-14）、service_left_running。個人情報を持たず、ID と件数だけ"
  effect: チャットの種類が決まっても包みだけを変える。Turso に届かないときも、アプリが返す 503 を一つ目の規則が数えるので知らせが届く
  cost: サーバーの知らせと一つ目の規則が同じ出来事で二度鳴りうる
- name: 一つ目の規則を入口だけで起きた失敗に絞る
  effect: 二度鳴らない
  cost: Cloud Run の指標のラベル（response_code、response_code_class、route は空）では入口とアプリの応答を分けられない（Cloud Monitoring の指標の一覧）
- name: 一つ目の規則から 429 を外す（5xx とインスタンスの指標だけ）
  effect: 業務の回数の制限やログインの総当たりで急ぐ知らせが鳴らない
  cost: 同時の要求の枠が尽きて入口が返す 429 を拾えない
- name: 記録を書けたときだけ知らせる
  effect: 記録と知らせが必ずそろう
  cost: Turso に届かないとき何も届かない（FND-20）
chosen: '中立の知らせの形（種類、急ぎか、件数、窓、トレース ID の例、依頼 ID、知らせの ID）。記録を書けなくても先に送る。一つ目の規則は二つの条件を持つ。5xx が 5 分で 5 件以上か、インスタンスの指標が 10 分ないときは急ぐ知らせ。429 が 5 分で 30 件以上のときは急がない知らせ（入口が返す 429 と、業務の回数の制限やログインの総当たりで返す 429 を指標で分けられないため、しきい値を高くして急ぎを下げる）。知らせの種類: server_error、external_failure、client_error、slo_burn（page か ticket。DEC-35）、reconciliation_mismatch、money_error（NFR-07）、assignment_violation（NFR-09）、daily_result、job_failed（ELM-14）、service_left_running。個人情報を持たず、ID と件数だけ'
rationale: DEC-17 は一つ目の規則の条件の形を第 3 段階に任せた。指標で入口とアプリを分けられないので、条件はどちらも数える。その結果、FND-20 の「Turso に届かないときに知らせる道がない」のうち、デモの回の間の知らせはこの段で閉じる（SLI-03 の数え方は第 2 段階）
rejected:
- option: "一つ目の規則を入口だけで起きた失敗に絞る"
  reason: 指標で分けられない
- option: 記録を書けたときだけ知らせる
  reason: Turso の障害で知らせが止まる
- option: 一つ目の規則から 429 を外す（5xx とインスタンスの指標だけ）
  reason: 同時の要求の枠が尽きて入口が返す 429 を拾えない（DEC-21 の残る危険に気づけない）
gains:
- Turso に届かないときも 4〜5 分で知らせが届く（遅延の予算）
costs:
- 二度鳴ることがある（一人の運用者には読めば分かる）
sensitive_points:
- 5 分で 5 件（少ないと一時の誤りで鳴り、多いと Turso の障害で遅れる）
- 429 の 5 分で 30 件（低いと参加者の回数の制限やログインの総当たりで鳴り、高いと入口の枠が尽きたことに気づくのが遅れる）
trade_offs:
- with: DRV-26
  note: 規則の費用は条件が一つ増える分だけ（規則の数は二つのまま。C_monitoring_alert は条件ごと）
- with: DRV-28
  note: 429 の知らせは、入口の枠が尽きたときも業務の回数の制限やログインの総当たりのときも同じ形で届き、急がない印になる（指標で分けられない。FND-37）
assumptions:
- Cloud Monitoring の指標は 60 秒ごとに取られ、最大 120 秒遅れて見える（Cloud Monitoring の指標の一覧）
depends_on:
- DEC-17
- DEC-35
parameters:
- name: 一つ目の規則（a）
  value: 5xx が 5 分で 5 件以上（急ぐ知らせ）
  basis: Turso に届かないと位置の送信だけで 1 分に 12 件の 503 が出るので、30 秒ほどで超える。ふだんの一時の誤り 1〜2 件では鳴らない
- name: 一つ目の規則（b）
  value: インスタンスの数の指標が 10 分届かない
  basis: 最小 1 のインスタンスは 60 秒ごとに指標を出す。止まって入れ替わらないときを拾う
- name: 一つ目の規則（c）
  value: 429 が 5 分で 30 件以上（急がない知らせ）
  basis: 提案。参加者 2 人の業務の回数の制限で 5 分に 30 件はまず届かず、入口の枠が尽きると数秒で超える。ログインの総当たりでも鳴るが、攻撃に気づく手がかりとして急がない印で受ける
- name: 知らせをまとめる間隔
  value: 1 分（DEC-17 のまま）
  basis: NFR-33 の 5 分の内
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "一つ目の規則の条件を、5xx（5 分で 5 件、急ぐ）と 429（5 分で 30 件、急がない）に分けた。429 を外す案を足して比べ、引き換えを書いた。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。FND-37 を受け入れた"
