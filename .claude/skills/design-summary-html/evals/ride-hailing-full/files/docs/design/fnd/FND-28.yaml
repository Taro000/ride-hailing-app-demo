id: FND-28
title: DEC-03 の配信の出どころと DEC-22 の経路を求める場面が、位置、到着予定、停止、依頼の内容を数えていない
status: accepted
version: 2
basis: inferred
basis_note: DEC-03 の選んだ案と失うもの（1 秒に 1 回の読み出し、デモの回 1 回で 10,800 回）、DEC-15（座標は状態の履歴の外）、DEC-22 の経路を求める場面と 189 回、FR-10、FR-11、FR-19、FR-24、FR-47 は入力。足りない出どころと回数はこの段の計算（遅延の予算の節）
needs_agreement: false
approver_candidates: []
raised_by: architecture-to-high-level-design
raised_in: 3-high-level-design.md
to: architecture-drivers-to-architecture
targets:
- DEC-03
- DEC-22
- DEC-15
severity: minor
evidence: DEC-03 は「各インスタンスが状態の履歴の表を 1 秒ごとに追いかけ、相手が見てよい変化を送る」とし、失うものを 1 秒に 1 回の読み出し（デモの回 1 回で 10,800 回）とする。一方、迎車中と乗車中の相手の位置（FR-10、FR-11、FR-24）は DEC-15 で状態の履歴の外にあり、到着予定の 60 秒ごとの取り直し（DEC-22）とドライバーの停止（FR-47 は SSE でドライバーの画面を変える）も状態の履歴の変化ではない。そのため DEC-03 の出どころだけでは、これらは画面に届かない。この段は、ドライバーの受付の記録の追いかけと、相手の位置と到着予定の今の値の読み出しを足した（DEC-51）。インスタンスの読み出しは 1 秒に 3 回、デモの回 1 回で 32,400 回になる（計算）。また FR-19 の「乗車場所までの所要時間」はドライバーから乗車場所までの経路が要るが、DEC-22 の経路を求める場面（見積もり、許諾、運転の開始、降車場所の変更）にない。この段は依頼の内容でその経路を求め、60 秒の内の許諾で使い回すことにした。デモの回 1 回の呼び出しの見込みは 189 回から 198 回になる（計算。Q_maps_day の 1,000 回に 5.1 倍）。構造は変わらないので、第 2 段階の記述と見込みのずれだけが残る
suggestion: DEC-03 の出どころに、ドライバーの受付の記録と、相手の位置と到着予定の今の値を足し（DEC-51 を引く）、失うものの読み出しの数を 32,400 回に直す。DEC-15 の最後の位置の読める相手に、配信（位置のモジュールが役割を確かめて返す）を書く。DEC-22 の経路を求める場面に依頼の内容（60 秒は許諾で使い回す）を足し、デモの回 1 回の見込みと Q_maps_day の余裕（5.1 倍）を直す。「費用と体制」の Turso と地図の量も合わせる
resolution: 受け入れた。DEC-03（版 3）の出どころに、ドライバーの受付の記録の追いかけと、迎車中・乗車中の相手の位置と到着予定の今の値の読み出しを足し（第 3 段階の DEC-51）、失うものの読み出しを 1 秒に 3 回、デモの回 1 回で 32,400 回に直した。DEC-15（版 4）の最後の位置の読める相手に配信を足した。DEC-22（版 2）の経路を求める場面に依頼の内容（ドライバーから乗車場所まで。60 秒の内の許諾で使い回す）を足し、デモの回 1 回の見込みを 198 回（Q_maps_day に 5.05 倍）に直した。「費用と体制」の Turso と地図の量、DEC-21 の Q_maps_day のもと、DEC-35 の読み出しの割合も合わせた
