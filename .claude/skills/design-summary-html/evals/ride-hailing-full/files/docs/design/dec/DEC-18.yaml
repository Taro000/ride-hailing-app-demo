id: DEC-18
title: トレース ID をブラウザで作り、すべての記録に引き継ぐ
status: draft
version: 1
basis: inferred
basis_note: 提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: 一つの操作の記録を、ブラウザから外部の呼び出しまでどうつなぐか
addresses:
- DRV-28
- DRV-27
options:
- name: ブラウザが操作ごとにトレース ID を作って要求の見出しで送り、Cloud Run の入口のログにも同じ ID が残る形にする。サーバーはすべてのログ、外部の呼び出しのログ（Stripe の要求の ID も）、エラーの応答、状態の履歴に入れる。ブラウザのエラーの記録にも入れる
  effect: ブラウザ、入口、サーバー、外部の呼び出しのログが一つの ID でつながる
  cost: 見出しと記録の約束を全体でそろえる
- name: OpenTelemetry をブラウザとサーバーに入れ、Cloud Trace に送る
  effect: 時間の内訳まで見える
  cost: 設定と費用が増える
chosen: ブラウザが操作ごとにトレース ID を作って要求の見出しで送り、Cloud Run の入口のログにも同じ ID が残る形にする。サーバーはすべてのログ、外部の呼び出しのログ（Stripe の要求の ID も）、エラーの応答、状態の履歴に入れる。ブラウザのエラーの記録にも入れる
rationale: FR-37 と NFR-32（DRV-28）は一つの ID でたどれることを求め、時間の内訳までは求めない。CUJ-10 は今期重視しない（QR-23・24 は最低限守る線）ので、DRV-26 に軽い案を選ぶ
rejected:
- option: OpenTelemetry をブラウザとサーバーに入れ、Cloud Trace に送る
  reason: DRV-26 で負ける。CUJ-10 を重視に上げるときに考え直す
gains:
- 一つの ID で入口からアプリ、外部の呼び出しまでたどれる
costs:
- 見出しと記録の約束をそろえる手間
sensitive_points:
- Cloud Run の入口のログに同じトレース ID が残る見出しの形（第 3 段階の共通の約束事）
trade_offs: []
assumptions:
- Cloud Run の入口のログは、要求の見出しのトレース ID を記録する
depends_on: []
parameters: []
