id: IFC-29
title: エンジニアの画面
status: draft
version: 2
basis: inferred
basis_note: FR-40 と DEC-19（履歴はこの画面、ログは Logs Explorer。二つの画面に分かれる技術的負債）は入力
needs_agreement: false
approver_candidates: []
kind: screen
name: エンジニアの画面
provider: ELM-03
consumers:
- USR-03
functions:
- FR-01
- FR-40
operations:
- name: 状態の履歴の検索
  does: CUJ-10「ログやデータを調査する」。依頼 ID、トレース ID、利用者 ID、時間の範囲、エラーの種類で探す。各行から Logs Explorer をトレース ID で開く（FR-40）
- name: 依頼の位置
  does: 依頼の位置の記録と受信の記録（原因の特定）
- name: テスト用の印
  does: アカウントにテスト用の印を付ける・外す（FR-01 AC6）
format: React の SPA の画面（DEC-23）。文言は日本語（DEC-46）。WCAG 2.2 AA（DRV-24）
protocol: PC のブラウザ（ELM-16）。IFC-07 を使い、Logs Explorer（Google Cloud のコンソール）を開く
auth: エンジニアの役割で、パスキーの確かめが済んだセッション
errors:
- case: 条件に合うものがない
  signal: 空の一覧
  caller_does: その旨を示す（FR-40 AC4）
- case: 範囲が広すぎる
  signal: IFC-07 RANGE_TOO_WIDE
  caller_does: 狭めるよう示す
idempotency: 画面は操作ごとに冪等キーを一つ作り、応答が分からないときは同じキーでだけ送り直す（API の呼び出しのモジュール。DEC-48）。二度押しは同じキーにまとまる
timing:
  timeout: API の 15 秒
  ordering: null
  delivery: null
versioning: SPA の版を X-App-Version と比べ、操作の途中でないときに読み直す（DEC-49）。読み直した後は GET で今の状態を取り直す
observability: 検索の条件と件数（engineer.search のログ）
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: FR-01 の受け入れ基準の番号を版 3 に合わせた（テスト用の印は AC6）
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-01 版 3）'
