id: DRV-28
title: 一つのトレース ID で原因まで追える
status: draft
version: 3
basis: inferred
basis_note: 求めは QR-23・24・34、NFR-32・33・38 と PC-04 から（入力）。T_log_retention 28 日は第 4 段階の仮の値。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: observability
statement: 一つのトレース ID で、ブラウザ、サーバー、外部の呼び出しの記録をたどり、通知から原因まで行ける
sources: [QR-23, QR-24, QR-34, NFR-32, NFR-33, NFR-38, FR-17, FR-36, FR-37, FR-38, FR-40, PC-04]
concern_of: [USR-03]
scenario:
  source: 通知を受けたエンジニア（USR-03）
  stimulus: サーバーのエラー、外部の呼び出しの失敗、ブラウザのエラーが起きる
  artifact: 通知（FR-36）、トレース ID（FR-37）、ブラウザのエラーの記録（FR-38）、ログの検索（FR-40）
  environment: デモの回は Cloud Run、ふだんは手元。ログと監視は自前の最小構成（PC-04）。個人情報は伏せる（DRV-32）
  response: 種類、時刻、件数、トレース ID の例を添えて知らせる。一つのトレース ID で、ブラウザ、サーバー、外部の呼び出しのログを時刻順にたどれる。T_log_retention の間、ログ、状態の履歴、現在地の受信の記録を取り出せる
  measure: 試験用のエラーの通知が 5 分以内に届く（NFR-33）。NFR-27 の実行でトレース ID のないログ 0 件（NFR-32）。28 日前のログ、状態の履歴、現在地の受信の記録を探せる（NFR-38）。背景は T_rca 30 分（QIU-19）
