options:
- name: Cloud Run を東京（asia-northeast1）、Turso を東京（AWS ap-northeast-1）に置く
  effect: 参加者とサーバー、サーバーとデータベースの往復が短い
  cost: 地域ごとの値段の違い（未定の値）
- name: Cloud Run を米国の地域に置く
  effect: 値段の区分が安い地域がある（未定の値）
  cost: 参加者との往復が太平洋を越え、データベースとの往復も延びる
chosen: Cloud Run を東京（asia-northeast1）、Turso を東京（AWS ap-northeast-1）に置く
rationale: DRV-02 の 5 秒と NFR-24 の 3 秒の中で、往復の多い作り（DEC-02 の状態の読み書き、DEC-03 の追いかけ）を支える。個人情報を国内に置くのは DRV-21 に合う（法令の中身の確かめは未解決の点）
rejected:
