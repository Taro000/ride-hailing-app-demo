id: DEC-53
title: 毎日の処理の結果と運用のコマンド
status: draft
version: 2
basis: inferred
basis_note: DEC-05、DEC-17、DEC-37、data-and-conventions.md の持ち主の決まり、FND-19・22 の論点は入力。コマンドの形、終わりの符号、処理ごとの上限は推定。第 2 段階の指摘が残るままこの形で進めることは質問 1 で確認済み
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: 毎日の処理の結果を誰がどう読み、閉じる前と終える前の数えをどう行うか
addresses:
- IFC-10
- IFC-11
- DEC-37
- DEC-05
- FND-19
- FND-22
options:
- name: "日と処理ごとの記録を DAT-24 に、要約と期間を終えられるかを毎日の結果の知らせに書く。閉じる前の数え（count-open）、期間の状態（period-status）、構造の変更（migrate）、配備の記録（record-deploy）、Turso の確かめ（check-turso）は運用のコマンドで、運用のジョブ（ELM-05 の別の動かし方。第 2 段階の DEC-34）が動かし、ELM-06 はデータベースの資格情報を持たず、ジョブを起こして終わりの符号を読む。期間の終わりは毎日の処理が決め、最後の回の印があり、(A) 毎日の処理が片付けられる残り（確かめ中、状態を取り出せる確定も解放もしていない押さえ、T_request_max を過ぎた許諾のない依頼。最後のものはシステムの取り消しとして終える）と (B) 許諾の後の終わっていない依頼が 0 件なら、定時の起動と二つ目の規則を止めて期間を終えたと DAT-24 と DAT-26 に書く（第 2 段階の DEC-37 版 4）。ELM-05 は ELM-04 の実体を、同じイメージの持ち主のモジュールを通してだけ書く（報告書の「データ」の表）。ELM-04 は突き合わせの結果を読むだけ。終わりの符号: 0（0 件・終えられる）、10（残りがある・まだ）、20（Turso に届かない）、1（そのほかの失敗）。毎日の結果の知らせは成功でも送り、期間の要約（(A) と (B) の件数、最後の回の印、period_end_ready）を載せる"
  effect: 「終わっていない」の決まりがドメインのコード一か所。ELM-06 が持ち主の表に頼らない
  cost: コマンドを二つ作る
- name: ELM-06 が SQL で表を直接読む
  effect: コマンドが要らない
  cost: 決まりが手順の中の問い合わせと二つになり、表を変えると手順が壊れる
- name: ELM-06 がサーバーの API で数える
  effect: 持ち主の API
  cost: 期間を終えるときはサービスがない
chosen: '日と処理ごとの記録を DAT-24 に、要約と期間を終えられるかを毎日の結果の知らせに書く。閉じる前の数え（count-open）、期間の状態（period-status）、構造の変更（migrate）、配備の記録（record-deploy）、Turso の確かめ（check-turso）は運用のコマンドで、運用のジョブ（ELM-05 の別の動かし方。第 2 段階の DEC-34）が動かし、ELM-06 はデータベースの資格情報を持たず、ジョブを起こして終わりの符号を読む。期間の終わりは毎日の処理が決め、最後の回の印があり、(A) 毎日の処理が片付けられる残り（確かめ中、状態を取り出せる確定も解放もしていない押さえ、T_request_max を過ぎた許諾のない依頼。最後のものはシステムの取り消しとして終える）と (B) 許諾の後の終わっていない依頼が 0 件なら、定時の起動と二つ目の規則を止めて期間を終えたと DAT-24 と DAT-26 に書く（第 2 段階の DEC-37 版 4）。ELM-05 は ELM-04 の実体を、同じイメージの持ち主のモジュールを通してだけ書く（報告書の「データ」の表）。ELM-04 は突き合わせの結果を読むだけ。終わりの符号: 0（0 件・終えられる）、10（残りがある・まだ）、20（Turso に届かない）、1（そのほかの失敗）。毎日の結果の知らせは成功でも送り、期間の要約（(A) と (B) の件数、最後の回の印、period_end_ready）を載せる'
rationale: data-and-conventions.md の持ち主の決まり（ほかの要素は持ち主のインタフェースを通して読む）。FND-19 の答えがどちらでも、このコマンドの約束は変わらない。FND-22 のうち「毎日の結果に期間を終えられるかを書く」はインタフェースの形なので、この段で置く
rejected:
- option: ELM-06 が SQL で表を直接読む
  reason: 決まりが二か所になる
- option: ELM-06 がサーバーの API で数える
  reason: 期間を終えるときに使えない
gains:
- 閉じる前と終える前の確かめが毎日の処理と同じ決まりで数える
costs:
- コマンドの出力の形を守る
sensitive_points: []
trade_offs: []
assumptions:
- ELM-06 がコマンドを動かす場所と資格情報は DEC-34 のまま（FND-19 で変わりうる）
depends_on:
- DEC-05
- DEC-37
- DEC-27
parameters:
- name: 毎日の処理の処理ごとの上限
  value: 確かめ中の片付け 5 分、突き合わせ 15 分、履歴の確かめと監視 5 分、SLI の集計 10 分、保存期間 5 分、記録と知らせ 2 分（合計 42 分）
  basis: 一回の上限 45 分の内（計算）。ふだんは数分
