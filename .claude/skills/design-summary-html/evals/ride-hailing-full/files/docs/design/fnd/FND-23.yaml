id: FND-23
title: URL を公開するので DEC-21 の前提が崩れ、SSE の流れの上限と地図の割り当てを参加者でない人に使い切られうる
status: accepted
version: 3
basis: inferred
basis_note: デモの URL を発表、ブログ、動画などで示すことはレビューの質問 1 の回答（確認済み）。デモの回の最中や次のデモより前にも示すことは質問 2 の回答（確認済み）。DEC-21 の上限と前提と残る危険、DEC-03 の流れの最長 30 分、DEC-06 の URL、DEC-22 の経路を求める場面、FR-01 の乗客の登録、リポジトリが公開であること（報告書の入力）は入力。20、7、34 分、40 人はスクリプトでの計算。参加者でない人が使ったときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: architecture-drivers-to-architecture
targets:
- DEC-21
severity: major
evidence: 利用者はデモの URL を発表、ブログ、動画などで示す（レビューの質問 1 の回答）。DEC-21 は、デモの回の間の登録を止めない理由を「公開していない URL のこの規模では、多くの IP からの攻撃は起きにくい」とし、残る危険を「多くの IP とアカウントからの攻撃」に限っているが、この前提は答えと食い違う。サービスの URL は作り直しても同じ（DEC-06）なので、一度示せば次の回からも届く。計算すると、流れの全体の上限 40 本を埋めるのは 20 アカウントと 7 つの IP で、アカウントの作成の制限（IP ごとに 1 時間に 5 件）のもとでも 7 つの IP なら 34 分で作れ、アカウントは Turso に残る。攻撃でなくても、乗客は自分で登録できる（FR-01）ので、URL を見た参加者でない 40 人ほどが別々の回線で乗客の画面を開いたままにすれば埋まる（画面ごとに 1 本）。参加者の流れは 30 分ごとにつなぎ直す（DEC-03）ので、埋まると遅くとも 30 分で 429 になり、前面に開いたままのドライバーの画面には回の残りの間、変化が届かない（DRV-02）。地図の割り当て Q_maps_day（API ごとに 1 日 1,000 回）も、見積もりごとに経路を一度求める（DEC-22）ので、参加者でない人の見積もりと場所の検索で使い切られうる（デモの回 1 回の 189 回を除くと、見積もり 811 回で経路の割り当てが尽きる。計算）。使い切ると、その日の残りは地図を使う操作が決まった扱いに移り、CUJ-01 の移動時間と料金の確認で値を示せない（DRV-11）。アカウントと IP ごとの回数の制限の値はどの DEC にもない。費用は上限の和で縛られる（DEC-21）が、デモそのものは参加者でない人の利用で止まりうる（DRV-02、DRV-01、DRV-29）。リポジトリと GitHub Actions の実行のログも公開されている（報告書の入力）
suggestion: DEC-21 を、URL を公開する前提で決め直す。残る危険を計算した数（20 アカウント、7 つの IP、34 分、参加者でない 40 人ほどの利用、埋まってから 30 分の内に参加者に届かなくなること、地図の割り当てを使い切るとその日の地図が使えないこと）で書き直し、要合意の表と脅威のモデルの F2 もそろえる。参加者の流れと地図の呼び出しを先に通す形を比べる（進行中の依頼を持つアカウントの流れを全体の上限の外に置く、地図を使う操作にアカウントと IP ごとの上限を値で置く、など）。参加者でない人の登録と利用を防ぐには機能が要るので、その答え（品質チェーンへの課題 2）が出るまでの扱いを前提に書く（URL を示すのを最後のデモの最後の回の後に限るなら、その前提で危険を見積もり直せる）。前提の「公開していない URL」は外す。この事実を設計の前提に書くことは第 1 段階に任せる（FND-27）
resolution: 受け入れた（質問 20）。DEC-21（版 4）を URL を公開する前提で決め直し、前提の「公開していない URL」を外した。参加者でない人が持てない、運営・サポート担当が作ったアカウント（ドライバー、運営とエンジニア）と割り当て済みの乗客の流れは、全体が 40 本でも優先でない流れのうち最も古いものを閉じて入れる。地図は API ごとに 1 日の呼び出しを数え、割り当て済みの依頼とドライバーの分を 300 回取り置き、割り当て前の場所の検索と見積もりは残りの 700 回が尽きたら決まった扱いに移す（DEC-22 版 2）。残る危険（割り当て前の乗客は参加者でない人と流れと地図を分け合い、参加者でない 40 人で流れが埋まり、7 アカウントか 70 人の見積もりで地図の分が尽き、参加者でない人の依頼もドライバーの一覧に並ぶ）を計算した数で負債に書き、要合意にした。参加者でない人の登録と利用を防ぐ機能は、品質チェーンへの課題 9 にした（レビューの課題 2 を引き継いだ）。設計の前提にこの事実を書くのは第 1 段階（FND-27。未解決）。脅威のモデルの F1・F2、通し確認（CUJ-01・02・06、DRV-01・02・29）、要合意の表もそろえた
