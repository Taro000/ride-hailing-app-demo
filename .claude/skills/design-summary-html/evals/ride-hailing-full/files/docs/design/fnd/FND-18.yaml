id: FND-18
title: TC-07 のデモの期間の終わりに、DEC-37 による延長が書かれていない
status: accepted
version: 2
basis: confirmed
basis_note: TC-07、DRV-18、DEC-37 の文は入力。延長を残して TC-07 に足すことは第 2 段階の質問 17 の回答（2026-11-03）
needs_agreement: false
approver_candidates: []
raised_by: architecture-drivers-to-architecture
raised_in: 2-architecture.md
to: requirements-to-architecture-drivers
targets:
- TC-07
- DRV-18
severity: major
evidence: 第 1 段階の再実行（FND-02 の受け入れ）で、TC-07 はデモの期間を「一つのデモの最初の回の日から、最後の回の翌朝の処理が終わるまで。それ以外のときは Cloud Run で何も動かさない」と書くようになった。一方 DEC-37 は、最後の回の翌朝の処理が、確かめ中のお金の操作、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録したときだけ期間を終える。そうでなければ定時の起動とジョブを残し、次の実行の後にやり直すので、期間は 1〜2 日延びうる（SLI-04 は分からない請求を翌日に判定し直す）。この延長は TC-07 の文になく、延長が起きた日は交渉できない制約の文の外で Cloud Run のジョブが動く。FND-02 の根拠は、延長を含む DEC-05 の前提（「最後のデモの回の翌朝の処理が終わり、DEC-37 の条件を満たすまで」）だったが、TC-07 に写したときに延長が落ちた
suggestion: TC-07 のデモの期間の読み方に「ただし、最後の回の翌朝の処理が、確かめ中のお金の操作、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録するまで延びる（第 2 段階の DEC-37）」を足し、DRV-18 の文を合わせる。延長が起きるのはそれらが残ったときだけで、DRV-04（押さえと請求が Stripe の記録と一致する）を守るため。第 2 段階の質問 17 で、利用者は延長を残すことを選んだ
resolution: 受け入れた。TC-07 のデモの期間の読み方に「ただし、その翌朝の処理のあとに、確かめ中のお金の操作、確定も解放もしていない押さえ、終わっていない依頼が残っていれば、毎日の処理がそれらをどれも 0 件と記録するまで延びる（第 2 段階の DEC-37。延びるのはそれらが残ったときだけ）」を足した。DRV-18 を版 3 にし、文に延長を書き、DRV-04 との競合を解いたと記録した。DRV-04 を版 3 にし、同じ競合を記録した。延長に上限は置かず、強いて期間を終えることは第 2 段階の DEC-37 が受け持つ
