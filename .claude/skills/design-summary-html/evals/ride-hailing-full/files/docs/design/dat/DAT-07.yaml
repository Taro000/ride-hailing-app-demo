id: DAT-07
title: 状態の履歴
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。位置を持つのは場所で行う四つの操作だけで、得られなければ印を残すことは FR-39 版 3・SLI-05 版 2、変更の前後の降車場所を残すことは FR-12 AC6（FND-46）、システムの取り消しを記録することは FR-08 版 2。属性の名前と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 配車依頼と乗車の状態の履歴
owner: ELM-04
store: ELM-07
key_attributes:
- seq（通し番号。配信のカーソル）
- change_id（ULID。表示の記録の鍵）
- ride_id
- type（requested、accepted、driver_cancelled、relisted、cancelled、arrived、started、no_show、ended、destination_changed、destination_change_abandoned、threshold_lowered、charged、charge_failed、refunded、hold_released、not_booked）
- recorded_at
- actor_kind（passenger、driver、staff、system）と actor_id
- position_ref（DAT-08。場所で行う四つの操作 arrived、started、no_show、ended だけ）か position_unavailable の印（迎車の到着は FR-25 の unverified の印）。ほかの変化は位置を持たない（FR-39 AC2）
- destination_changed の dropoff_before_ref と dropoff_after_ref（DAT-08 の kind が dropoff_before と dropoff_after。FR-12 AC6）
- cancelled の cancelled_by（passenger、driver、system）と reason（システムの取り消しは request_timeout）
- details（額、理由）
- trace_id
- test_account
relations:
- to: DAT-06
  kind: many-to-one
  note: 依頼
- to: DAT-08
  kind: one-to-many
  note: 位置（場所で行う四つの操作は一つ、降車場所の変更は前と後の二つ）
consistency: 配車のモジュールが依頼の状態と同じトランザクションで追記するだけ（FR-39 AC3）。お金の結果（請求、返金）は DEC-12 の二つ目のトランザクションで追記する。座標を持たず位置の参照だけ（DEC-15、DRV-32）。乗車の終了で確かめ中の降車場所の変更を取りやめたら destination_change_abandoned を追記する（DEC-52）。システムの取り消しは操作した人をシステムとして追記する（FR-08 AC5）。ELM-05 は持ち主のモジュールを通して書く（DEC-53。サービスが消えた後に残った依頼の T_request_max の取り消しと、保存期間の匿名化）
retention: 変化の種類と時刻は残す。操作した人と位置の参照は T_pii_retention で消す（FR-53 AC1）。システムを終えるとき（DEC-36）
classification: personal
drivers:
- DRV-27
- DRV-31
- DRV-02
- DRV-32
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 位置を持つのを場所で行う四つの操作だけにし、得られなかったときの印を書いた（ほかの変化は位置を持たない）。destination_changed に変更の前後の降車場所の参照を、cancelled に cancelled_by と reason を持たせ、destination_change_abandoned を足した。ELM-05 は持ち主のモジュールを通して書くと書いた。FR-39 の受け入れ基準の番号を版 3 に合わせた。actor_kind の値をログの account_kind（DEC-44 版 2）とそろえて staff にした
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-08 版 2、FR-12 版 4、FR-39 版 3、SLI-05 版 2）、FND-33・39・46'
