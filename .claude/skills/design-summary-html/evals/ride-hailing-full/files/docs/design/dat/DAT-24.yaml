  change: 期間の要約を、(A) と (B) の件数、最後の回の印、period_end_ready、期間を終えた時刻にし、期間を終える条件と書く順を書いた
  reason: '第 3 段階の再実行（2026-11-04）: 第 2 段階の DEC-37 版 3・4（FND-22 の受け入れ）、DEC-53 版 2'
