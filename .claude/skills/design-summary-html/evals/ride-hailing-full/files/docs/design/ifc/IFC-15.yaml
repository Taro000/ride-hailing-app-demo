id: IFC-15
title: Google Maps のサーバーの API
status: draft
version: 1
basis: inferred
basis_note: DEC-22（地図のモジュール一つから決まった場面だけ、2 秒、要求の中で送り直さない、到着予定は 60 秒ごと）と DEC-21（1 日の割り当て、鍵の制限）は入力。computeRoutes の経路と X-Goog-FieldMask は Google の文書（2026-11-03）。Places API（New）を使うこと、依頼の内容でドライバーから乗車場所までの経路を求めることは推定（FND-28）
needs_agreement: false
approver_candidates: []
kind: http
name: Google Maps のサーバーの API（外部）
provider: ELM-11
consumers:
- ELM-04
functions:
- FR-02
- FR-03
- FR-10
- FR-12
- FR-19
- FR-23
operations:
- name: POST https://places.googleapis.com/v1/places:autocomplete
  does: 場所の候補（sessionToken でまとめる。言語は日本語、地域は日本）
- name: GET https://places.googleapis.com/v1/places/{placeId}
  does: 選んだ候補の位置と住所（X-Goog-FieldMask で欄を絞る。同じ sessionToken）
- name: POST https://routes.googleapis.com/directions/v2:computeRoutes
  does: '経路、距離、所要時間（TRAFFIC_AWARE。X-Goog-FieldMask: routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline）。見積もり、許諾、運転の開始、降車場所の変更、到着予定の取り直し、依頼の内容（60 秒は許諾で使い回す）で呼ぶ'
format: JSON
protocol: HTTPS。adapters の地図の包みからだけ呼ぶ（DEC-22）
auth: サーバーの鍵（X-Goog-Api-Key。使う API だけに限る。DEC-21）。Secret Manager
errors:
- case: 要求の誤り、鍵の制限
  signal: 400 INVALID_ARGUMENT、403 PERMISSION_DENIED
  caller_does: 設計の誤りとして知らせ、地図を使えないと扱う
- case: 1 日の割り当てに達した
  signal: 429 RESOURCE_EXHAUSTED
  caller_does: 地図を使えないと扱う（FR-03 AC5、FR-23 AC3）。その日の残りは決まった扱い（DRV-11）
- case: Google の中の誤り、タイムアウト
  signal: 5xx、2 秒で切る
  caller_does: 要求の中では送り直さず、地図を使えないと扱う（DEC-22）
- case: 経路がない
  signal: 200 で routes が空
  caller_does: NO_ROUTE（FR-02 AC6）
idempotency: 読むだけ
timing:
  timeout: 1 回 2 秒、要求の中では送り直さない（DEC-22）。到着予定の取り直しは 60 秒ごと
  ordering: null
  delivery: null
versioning: Google の v1（Places）と v2（Routes）。上げるのは adapters の包みだけ
observability: external.call のログに API、結果、時間、トレース ID。地点、検索の語、経路は書かない。NFR-28 の 1 分ごとの数（DAT-21）
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
