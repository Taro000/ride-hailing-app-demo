id: DRV-02
title: 状態の変化を相手の画面にすぐ届ける
status: draft
version: 3
basis: inferred
basis_note: シナリオは QR-02・NFR-02・SLI-02 から（入力）。対象のブラウザ（質問 10）と実行の場所（質問 1）、規模（PC-05。質問 11）は確認済み。招待制（PC-06）とシステムの取り消し（FR-08）は入力。運転の開始（FR-26）を足さず QR-02 の五つの種類のままにすることは質問 16 で確認済み。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 依頼と状態の変化を、起きてからすぐ、示すべき相手すべての画面に届け、許諾済み・取り消し済みの依頼を一覧に残さない
sources: [QR-02, NFR-02, SLI-02, FR-06, FR-07, FR-08, FR-18, FR-19, FR-20, FR-22, FR-25, FR-54, PC-05, PC-06]
concern_of: [USR-01, USR-02]
scenario:
  source: 相手の操作（ドライバーの許諾、乗客の取り消し、ドライバーの到着）とシステム（新しい依頼、探し直し、手配から T_request_max を過ぎた依頼の取り消し）
  stimulus: 依頼と状態の変化（新しい依頼、許諾、取り消し、探し直し、迎車の到着）が記録される
  artifact: 乗客とドライバーの画面（FR-06、FR-07、FR-08、FR-18、FR-19、FR-20、FR-22、FR-25）
  environment: デモの回。参加者 2 人（乗客 1 人とドライバー 1 人。PC-05）なので、示す相手はたいてい一人。URL は公開されるが、ログインして使うのは参加者とテスト用アカウントだけ（招待制。PC-06）。相手の画面は前面。iPhone の Safari、携帯の回線、参加者は移動中、短い通信の切れがある。サーバーは Cloud Run
  response: 示すべき相手すべての画面に変化が出る。許諾済み・取り消し済みの依頼はほかのドライバーの一覧から消える。裏から前面に戻ったら最新の状態を示す
  measure: 直近 28 日で、変化と相手の組の 95% が 5 秒（T_deliver）以内に相手の画面に示される（NFR-02。SLI-02 で FR-54 の表示の記録から測る）
