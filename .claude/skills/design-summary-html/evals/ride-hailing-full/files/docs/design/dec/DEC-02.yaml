id: DEC-02
title: インスタンスに状態を持たない（Cloud Run の動かし方）
status: draft
version: 3
basis: inferred
basis_note: Cloud Run の振る舞いは文書から。参加者 2 人は PC-05（入力）。最大 1 などの値と、同時の要求の枠のうち SSE に使う数は提案（質問 12・15 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: Cloud Run のインスタンスの入れ替えと増減があっても同じに動くにはどうするか
addresses:
- DRV-18
- DRV-01
- DRV-16
- DRV-02
- DRV-03
options:
- name: 状態はすべて Turso に置き、インスタンスに持たない。デモの間はインスタンス単位の課金、最小 1、最大 1
  effect: 入れ替え、上限を超えた一時のインスタンス、版の切り替えのどれでも状態が失われない
  cost: 状態の読み書きのたびにデータベースへの往復。デモの間はインスタンスが動き続ける分を払う
- name: インスタンスを一つに固定し、進行中の依頼と配信をメモリに持つ
  effect: 最も単純で速い
  cost: Cloud Run は入れ替えや急な増加のとき上限を超えてインスタンスを作る（文書）。その間にメモリの状態が分かれ、配信が漏れる
- name: 共有のキャッシュと配信の仕組み（Memorystore、Pub/Sub）を足す
  effect: 複数のインスタンスでも速く共有できる
  cost: 常に動くサービスの費用と、学んで動かす対象が増える
chosen: 状態はすべて Turso に置き、インスタンスに持たない。デモの間はインスタンス単位の課金、最小 1、最大 1
rationale: DRV-18 の競合（第 1 段階が第 2 段階に回した、インスタンスの増減と送り続ける接続・時刻で動く処理）を、状態をインスタンスの外に出して解く。案 2 は文書にある上限超えと版の切り替えで壊れ、DRV-16 も満たさない。案 3 は DRV-26（PC-01、無料の枠を優先）に反する。インスタンス単位の課金は、要求の外での見回り（DEC-04）と配信の追いかけ（DEC-03）に要り、最小のインスタンスを置くにも要る（文書）。デモの外はサービスがない（DEC-06）ので、払うのはデモの回の時間だけ。最大 1 インスタンスでは同時に扱える要求は全体で 80 で、SSE は一本を最長 30 分持つので、流れの本数を DEC-21 で 40 本までに限り、短い要求の枠を残す（FND-08）
rejected:
- option: インスタンスを一つに固定し、進行中の依頼と配信をメモリに持つ
  reason: DRV-18 を満たさない（上限超えと版の切り替えでメモリの状態が分かれる）。DRV-16 を満たさない
- option: 共有のキャッシュと配信の仕組み（Memorystore、Pub/Sub）を足す
  reason: DRV-26 を満たさない（常に動くサービスの費用）
gains:
- 版の切り替えと戻しで進行中の依頼が失われない（DRV-16）
- つなぎ直しが別のインスタンスに行っても同じに扱える
costs:
- 状態の読み書きのたびにデータベースへの往復が要る
- デモの回 1 回で 10,800 インスタンス秒を払う（計算）
- 同時の要求の枠 80 を、SSE（40 本まで）と短い要求で分け合う
sensitive_points:
- 最大のインスタンスの数（費用の上限）
- 最小 1（デモの最初の要求の立ち上がり）
- 同時の要求の枠のうち SSE に使ってよい数（DEC-21）
trade_offs:
- with: DRV-26
  note: デモの間はインスタンスが動き続ける分を払う
- with: DRV-29
  note: 同時の要求の枠は使い切られる側の資源で、乱用への備えではない。備えは DEC-21 の上限
assumptions:
- 上限を超えたインスタンスは一時のもの（Cloud Run の文書）
depends_on:
- DEC-01
- DEC-08
parameters:
- name: 最小のインスタンス
  value: 1（デモの間）
  basis: デモの最中の立ち上がりを避ける（DRV-01）。最小を置くにはインスタンス単位の課金が要る（Cloud Run の文書）
- name: 最大のインスタンス
  value: '1'
  basis: 参加者 2 人（PC-05）に足り、費用の上限を下げる。一時的に超えても状態を持たないので害はない
- name: 同時の要求の数
  value: '80'
  basis: Cloud Run の既定（最大 1,000）。最大 1 インスタンスなので全体で 80。SSE を 40 本までにして、短い要求に 40 を残す（計算）
- name: CPU とメモリ
  value: 1 vCPU、512 MiB
  basis: 仮。最初のデモの前の負荷の確かめで見直す
- name: 課金の設定
  value: インスタンス単位
  basis: 要求の外の CPU と最小のインスタンスに要る（Cloud Run の文書）
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 同時の要求の枠を SSE と短い要求で分け合うこと（SSE は 40 本まで。DEC-21）を根拠、失うもの、応答を左右する点、値の根拠に書き、枠は備えではないことを引き換えに書いた
  reason: FND-08（第 2 段階のレビュー）を受け入れた
- version: 3
  date: '2026-11-03'
  change: 規模の出どころを、第 2 段階の質問 7 から PC-05 にした
  reason: 第 1 段階が FND-03 を受け入れ、PC-05 を足した（第 2 段階の再実行、2 回目）
