id: FND-43
title: 共通の約束事からのずれが仕様書と IFC に残る（冪等キー、ID と時刻の形、一覧、クッキー、版、命名、仮の値の印）
status: accepted
version: 2
basis: inferred
basis_note: DEC-39・40・42・43・47・48・49 の選んだ案、IFC-02・03・04・06・07 の idempotency、仕様書 9 件の中身（照合はサブエージェントのスクリプト、主なものはこの会話で確かめた）は入力
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-high-level-design.md
to: architecture-to-high-level-design
targets:
- DEC-47
- DEC-48
- IFC-03
- IFC-04
- IFC-06
- IFC-07
severity: minor
evidence: DEC-48 は状態を変える要求すべてに冪等キーを付けるとするが、仕様書では状態を変える操作 49 件のうち 17 件がキーなしで、DEC-48 の例外（位置、前面と裏、記録）に当たるのは 5 件。残りは IFC が理由を書くが、estimates と destination-quotes は資源を作り（201 で est_ と quoteId）、passkeys/register は資格情報を登録する。DEC-48 は位置も ID で重複を捨てるとするが、IFC-04 と仕様書は位置に鍵を付けない。逆に IFC-03・06・07 は PUT と PATCH を自然に冪等とするが、仕様書はキーを必須にする。DEC-39 の ID の形は、経路の引数 30 か所、positionId、配信の changeId と rideId に pattern がない。DEC-40 のミリ秒と Z は、date-time の 42 欄のどれも縛らない。DEC-42 の一覧の形を PaymentMethods と PlaceCandidates が持たない（例外はドライバーの依頼の一覧だけ）。DEC-43 のクッキーの属性（HttpOnly、Secure、SameSite=Strict）と Set-Cookie が、どの仕様書にもない。DEC-49 の X-App-Version は 2xx にだけ付く。DEC-47 の経路のまとまりに /api/v1/config がなく、単数形の区切り（threshold、rating、cancellation-quote、setup-code、billing）と、経路と一対一でない route_id がある。仕様書の冒頭は仮の値に x-provisional を付けるとするが、確認コードの 10 回、パスワードの 12 文字、見積もりの期限は文だけで、DEC-42 の limit と DEC-55 のそのほかの経路の上限は仕様書にない。エラーの例 681 件のうち 72 件の文が途中で切れ、7 件の操作の x-functions に IFC の functions にない FR がある
suggestion: 例外を DEC-48 に書き足すか仕様書を直し（キーのない状態を変える操作、位置の重複、PUT と PATCH）、ID と時刻の pattern、一覧の形、クッキーの属性、エラーの応答の X-App-Version を仕様書に入れ、DEC-47 に単数の資源と /api/v1/config を足し、仮の値の印と x-functions を IFC にそろえ、切れた例の文を直す
resolution: "受け入れた。キーのない状態を変える操作（位置、前面と裏、画面の記録）を DEC-48 版 2 の例外に書き、PUT、PATCH、DELETE にもキーを求めた。ID と時刻の pattern、一覧の形、クッキーの属性、エラーの応答の X-App-Version を仕様書に入れ、DEC-47 版 2 に単数の資源と /api/v1/config を足し、仮の値の印と x-functions を IFC にそろえた"
