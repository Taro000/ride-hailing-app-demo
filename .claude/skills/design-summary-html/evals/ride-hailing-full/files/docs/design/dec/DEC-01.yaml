id: DEC-01
title: 全体の構造（一つのサーバー、三つの Web アプリ、別の入口の毎日の処理）
status: draft
version: 2
basis: inferred
basis_note: 体制、予算、技術制約、規模（PC-05）は入力。分け方は提案。毎日の処理の動かし方は質問 1 で確認済み（DEC-05）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: architecture
question: システムをどう分け、どこで動かすか
addresses:
- DRV-18
- DRV-26
- DRV-04
- DRV-27
- DRV-29
- DRV-05
- DRV-17
options:
- name: 一つのサーバーに API・配信・時刻の見回り・知らせをまとめ、役割ごとの三つの Web アプリを同じ入口から配り、毎日の処理は同じコードの別の入口にする
  effect: 配備、ログ、データベースの対象が一つ。依頼の状態とお金の記録を一つのトランザクションで書ける
  cost: すべてが一緒に配備され増減する。モジュールの境目は CI で確かめないと崩れる。一つのサービスが一つの障害の単位
- name: 機能ごとの複数のサービス（配車、決済、位置と配信、管理）
  effect: 部分ごとに配備と増減ができる
  cost: 4 つ以上のサービスを一人で作って動かす。サービスをまたぐ整合と障害
- name: 関数の実行と外部のリアルタイムのサービス
  effect: 配信を外部に任せられる
  cost: 外部サービスが増え、手元で同じ形にならない。関数ごとに一度だけの扱いと権限をそろえる
chosen: 一つのサーバーに API・配信・時刻の見回り・知らせをまとめ、役割ごとの三つの Web アプリを同じ入口から配り、毎日の処理は同じコードの別の入口にする
rationale: 上位二つの主な要求で決まる。DRV-18（TC-06〜08）は手元とデモの回で同じ形を求め、コンテナ一つならそのまま動く。DRV-26（PC-01〜03）は一人で作って動かすことを求め、サービスを増やす案は運用の対象を増やす。DRV-04・05 と原則 DRV-31 は、状態の変化と履歴とお金の記録を一か所で一つのトランザクションで書くことを求める。TC-01〜05（DRV-17）はどの案でも守れ、TC-09（DRV-20）の Web アプリだけも満たす。部分ごとに増減や障害を分ける要求はない（QR-05 は今期は対象外）
rejected:
- option: 機能ごとの複数のサービス（配車、決済、位置と配信、管理）
  reason: DRV-26 を満たさない（一人で 4 つ以上を動かす）。DRV-04 を一部しか満たさない
- option: 関数の実行と外部のリアルタイムのサービス
  reason: DRV-18 を一部しか満たさない（手元で同じ形にならない）。DRV-26 で外部サービスが増える
gains:
- 配備、ログ、データベースの対象が一つ
- 状態の変化と履歴とお金の記録を一つのトランザクションで書ける（DRV-31）
- 毎日の処理がサーバーと同じ規則のコードを使う
costs:
- すべてのモジュールが一緒に配備され増減する
- モジュールの境目は CI の依存の確かめ（DEC-26）がないと崩れる
- 一つのサービスの障害がすべてを止める
sensitive_points:
- モジュールの境目を CI で確かめ続けること
trade_offs:
- with: DRV-01
  note: 一つのサービスが一つの障害の単位。一系統・少人数のデモで受け入れる
assumptions:
- 参加者 2 人（PC-05）を一つのサーバーで処理できる
depends_on: []
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
