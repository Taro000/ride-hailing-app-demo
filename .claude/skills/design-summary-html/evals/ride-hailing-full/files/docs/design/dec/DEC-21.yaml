id: DEC-21
title: 上限を重ねて、公開した入口への乱用で予算を超えず、同時の要求の枠を使い切られないようにする
status: draft
version: 5
basis: inferred
basis_note: 規模は PC-05、URL の公開と招待制は PC-06（入力）。アカウントは運営・サポート担当が参加者にだけ作り、参加者でない人はログインより先に進めないことは FR-01 版 3・FR-48 版 2・QR-20 版 2（入力。品質チェーンへの課題 9 の答え）。招待制で参加者を先に通す仕組みとアカウントの作成の制限を外すこと、ブラウザの地図の鍵をログインした人にだけ渡すことは推定。上限の値は提案（質問 15・25・26 は回答なし）。数は計算
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 公開した入口への攻撃と鍵の乱用で、費用が予算を超えず、同時の要求の枠を使い切られないようにするにはどうするか（アカウントは参加者にだけ作り、参加者でない人はログインより先に進めない。PC-06）
addresses:
- DRV-29
- DRV-26
- DRV-01
- DRV-02
- DRV-11
- FND-23
- FND-27
options:
- name: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限ってログインした人にだけ渡す、アカウントと IP ごとの回数の制限（ログインと設定の符号は IP ごとにも）、ログインの一時の停止、GCP の予算の知らせ
  effect: 最悪の費用が上限の和で決まる。ログインできるのは参加者、担当、テスト用アカウントだけなので、流れと地図を使えるのもそれだけで、一つのアカウントと一つの IP では同時の要求の枠を使い切れず、短い要求の枠が残る
  cost: 多くの IP からの、ログインより前の入口（静的なファイル、ログイン、設定の符号）への意図した大量の要求で同時の要求の枠が埋まると、その回の間デモが止まる
- name: 上限を重ね、参加者を先に通す（版 4。流れの優先、割り当て済みの依頼の地図の取り置き、アカウントの作成の回数の制限）
  effect: 版 4 では、参加者でない人の利用で流れと地図が尽きても、運営が作ったアカウントと割り当て済みの依頼の配信と地図を守った
  cost: 招待制では参加者でない人が流れも地図も使えないので、優先と取り置きが働く場面がない。流れを開くときの優先の判定、地図の呼び出しの日ごとの数え（Turso に一行）、その確かめを一人で作る
- name: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  effect: 入口で多くの IP からの攻撃を抑える
  cost: 負荷分散の月の費用（未定の値）と設定
- name: アプリの回数の制限だけ
  effect: 単純
  cost: 多くの IP からの要求と地図の鍵の乱用に上限がない。ログインした人の流れで同時の要求の枠を使い切れる
- name: 最大のインスタンスを 2 にして枠を増やす
  effect: 同時の要求の枠が 160 に増える
  cost: 費用の上限が 2 倍になる
chosen: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限ってログインした人にだけ渡す、アカウントと IP ごとの回数の制限（ログインと設定の符号は IP ごとにも）、ログインの一時の停止、GCP の予算の知らせ
rationale: DRV-29 の「大量の要求を受けても費用は C_budget_month を超えない」と「参加者でない人はログインより先に進めない」を、DRV-26（PC-01、無料の枠を優先）の中で満たす。品質チェーンは乗客のアカウントも運営・サポート担当が作る形にした（FR-01 版 3、FR-48 版 2。課題 9 の答え）。ログインできるのは参加者 2 人、担当、テスト用アカウントだけ（PC-05、PC-06）で、流れを開くのも、地図を使う操作（場所の検索、見積もり、経路）も、ログインの後だけになった。流れの全体 40 本を埋めるには、アカウントごと 2 本の上限のもとで 20 のアカウントが要り、ログインできるアカウントの数では届かない。地図の呼び出しも、デモの回 1 回の 198 回に、盗まれた参加者のアカウント一つの見積もりの上限（1 日 100 回。DEC-55）を足して 298 回で、Q_maps_day の 1,000 回に届かない（計算）。そのため、版 4 で参加者でない人の利用に備えて足した流れの優先と地図の取り置きは働く場面がなく、乗客の登録がなくなったのでアカウントの作成の回数の制限も要らない。三つとも外し、作って確かめる量を減らす（DRV-26）。残るのは、ログインより前の入口（静的なファイル、ログイン、設定の符号）で、URL を公開するので攻撃は起きる前提で備える（DRV-29 の環境）。ここは IP ごとの回数の制限と最大のインスタンスで費用を縛る。多くの IP からの大量の要求で同時の要求の枠が埋まる危険は、Cloud Armor の月の費用（DRV-26）と引き換えに受け入れる（運用者はデモを閉じて止められる）。ブラウザの地図の鍵は、地図を示す画面がすべてログインの後なので、ログインした人にだけ渡し、参照元の制限に重ねて、参加者でない人が鍵を拾えないようにする。最大のインスタンスは費用の上限として 1 のまま保つ（DEC-02）
rejected:
- option: 上限を重ね、参加者を先に通す（版 4。流れの優先、割り当て済みの依頼の地図の取り置き、アカウントの作成の回数の制限）
  reason: 招待制で参加者でない人が流れも地図も使えず、優先と取り置きが働く場面がない。作って確かめる量だけが残る（DRV-26）
- option: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  reason: DRV-26 に反する（月の費用）
- option: アプリの回数の制限だけ
  reason: DRV-29 と DRV-01 を一部しか満たさない
- option: 最大のインスタンスを 2 にして枠を増やす
  reason: DRV-26 で負ける（費用の上限が 2 倍）
gains:
- 乱用されても最悪の費用に上限がある
- ログインした人の流れでも同時の要求の枠を使い切れない（短い要求の枠が 40 残る）
- 参加者でない人は流れも地図も使えず、参加者でない人の依頼がドライバーの一覧に並ばない
- 版 4 の優先の判定、地図の日ごとの数え、アカウントの作成の制限を作らずに済む
costs:
- 多くの IP からの、ログインより前の入口への意図した大量の要求で同時の要求の枠が埋まると、その回の間デモが止まる（Cloud Armor を置かない。運用者はデモを閉じて止められる）
- 盗まれた参加者のアカウント一つで、そのアカウントの上限まで流れと地図を使える（流れ 2 本、見積もり 1 日 100 回。DEC-55）
sensitive_points:
- Q_maps_day の値（低すぎるとデモが止まり、高すぎると上限にならない）
- 流れの本数の上限
- 回数の制限の値（第 3 段階の DEC-55。ログインと設定の符号の IP ごとの値を含む）
trade_offs:
- with: DRV-01
  note: 多くの IP からのログインより前の大量の要求で同時の要求の枠が埋まると、主要な流れも 429 になる（Cloud Armor を置かない引き換え。DRV-26）
assumptions:
- アカウントは運営・サポート担当が参加者にだけ作り、乗客が自分で作る経路はない（FR-01 版 3、FR-48 版 2、PC-06）
- 地図を示す画面と地図を使う操作は、どれもログインの後にある
- Google Maps Platform の API ごとの 1 日の割り当てを Google Cloud で設定できる
depends_on:
- DEC-02
- DEC-06
- DEC-22
- DEC-20
parameters:
- name: Q_maps_day（地図の API ごとの 1 日の割り当て）
  value: 1,000 回
  basis: デモの回 1 回の呼び出しは最大 198 回で 5.05 倍。盗まれた参加者のアカウント一つの見積もりの上限 100 回を足しても 298 回（計算）
- name: Cloud Run の最大のインスタンス
  value: '1'
  basis: DEC-02 と同じ。費用の上限として保つ
- name: SSE の流れの本数
  value: アカウントごと 2、IP ごと 6、全体 40
  basis: 参加者 2 人の流れは 2 本で、全体の上限はその 20 倍。全体は同時の要求の数 80 の半分で、短い要求に 40 を残す。全体を埋めるにはアカウントが 20、IP が 7 要り、ログインできるアカウント（参加者 2、担当とテスト用が数個）では届かない（計算）
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: SSE の流れの本数の上限とアカウントの作成の回数の制限を足し、最大 2 インスタンスの案と比べ、DRV-02 を対象に加えた。残る危険（多くの IP からの攻撃）を書いた
  reason: FND-08（第 2 段階のレビュー）を受け入れた
- version: 3
  date: '2026-11-03'
  change: 規模の出どころを、第 2 段階の質問 7 から PC-05 にした
  reason: 第 1 段階が FND-03 を受け入れ、PC-05 を足した（第 2 段階の再実行、2 回目）
- version: 4
  date: '2026-11-03'
  change: URL を公開する前提で決め直した。前提の「公開していない URL」を外し、運営が作ったアカウントと割り当て済みの乗客の流れの優先と、割り当て済みの依頼の地図の取り置き（1 日 300 回）を足した。版 3 の形と、参加者でない人の登録を防ぐ機能を案に足して比べた。残る危険（負債）を計算した数で書き直し、返すときを品質チェーンへの課題 9 の答えにした。Q_maps_day のもとを 198 回（5.05 倍）に直した
  reason: FND-23 を受け入れた（第 2 段階の再実行、3 回目）。FND-28（地図の見込み）。質問 20 の回答
- version: 5
  date: '2026-11-03'
  change: 招待制（FR-01 版 3、FR-48 版 2、PC-06）で、参加者でない人はログインより先に進めず、流れも地図も使えなくなったので、版 4 の流れの優先、地図の取り置き（R_maps_reserve）、アカウントの作成の回数の制限を外した（版 4 を退けた案に入れた）。負債（参加者でない人と流れと地図を分け合う）を返した。ブラウザの地図の鍵をログインした人にだけ渡すことと、設定の符号の IP ごとの回数の制限を足した。参加者でない人の登録を防ぐ案は、品質チェーンが機能として決めたので案から外した。残る危険を、多くの IP からのログインより前の大量の要求に書き直した
  reason: 品質チェーンへの課題 9 の答え（招待制。品質チェーンの再実行 2026-11-03）と、第 1 段階の 3 回目の再実行（PC-06、DRV-29 版 2。FND-27 の受け入れ）に追随した（第 2 段階の再実行、4 回目）
