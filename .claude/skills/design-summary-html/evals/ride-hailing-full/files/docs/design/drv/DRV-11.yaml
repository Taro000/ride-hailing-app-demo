id: DRV-11
title: 外部サービスの失敗と遅れで画面を待たせない
status: draft
version: 2
basis: inferred
basis_note: シナリオは QR-07（版 2）・QR-03 と NFR-24・27・28 から（入力）。押さえの結果が分からないときの扱いは FR-05・12（入力）。サービスの名前は質問 6、無料の枠を優先することは質問 5 で確認済み。料金の形は推定。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 外部サービス（Google Maps Platform、Stripe）が失敗したり、応答しなかったり、遅れたりしても、画面を待たせ続けずに決まった扱いへ移り、サービスが戻れば続ける
sources: [QR-07, QR-03, NFR-24, NFR-27, NFR-28, FR-02, FR-03, FR-05, FR-12, FR-23, FR-29, TC-10, TC-11, PC-01]
concern_of: [USR-01, USR-02]
scenario:
  source: Google Maps Platform、Stripe
  stimulus: 失敗する、応答しない、遅い、利用の上限に達する
  artifact: 手配（FR-02、FR-03、FR-05）、経路（FR-23）、降車場所の変更（FR-12）、請求（FR-29）
  environment: デモの回。どちらも約束（SLA、上限）は入力にない（TC-10、TC-11）。Google Maps Platform は使った分の料金がかかり、無料の枠を優先する（PC-01）
  response: 画面を待たせ続けず決まった扱いに移り（FR-03 は値を示さず理由を示す、FR-23 はピンだけを示す、FR-29 は確かめ中と示す、FR-05・FR-12 は押さえの結果が分からなければ「確かめています」と示して T_hold_wait まで確かめ、間に合わなければ手配や変更をやめる）、結果が分からない間は成功とも失敗とも示さず、サービスが戻れば続ける
  measure: 手配の画面の要求で 3 秒を超えたものが 1 時間に 5% 以下（NFR-24）。外部の呼び出しの失敗と無応答が 1 時間に 5% を超えたら知らせる（NFR-28）。失敗・無応答・戻った後の扱いの CI のゲートが通る（NFR-27。結果の分からない押さえ、押さえ直し、システムの取り消し、失敗の後の新しいキーを含む）
negotiable: null
derived_from: []
priority:
  business: medium
  business_reason: QR-07、QR-03 は最低限守る線
  difficulty: high
  difficulty_reason: 自分で決められない外部のサービスに頼る。Google Maps Platform は使った分の料金がかかり、無料の枠に収める工夫が要る。手配と降車の待ち時間と競合する
  rank: 14
primary: false
conflicts:
  - with: DRV-26
    note: Google Maps Platform は使った分の料金がかかり、呼び出しの無駄が費用になる。無料の枠を優先する（第 2 段階で呼び出しを減らし上限を置く）
  - with: DRV-04
    note: 品質チェーンで解き済み。Stripe を待つ時間とやり直しが降車の 10 秒（NFR-25）に入るが、乗客は待たずに降りる（FR-29）
  - with: DRV-08
    note: 品質チェーンで解き済み。ピンで確かめさせるのは誤差が D_pickup_accuracy を超えるときだけ（FR-02）
placeholders:
  - name: T_hold_wait
    meaning: 押さえの結果が分からないときに、確かめ続ける上限。値は設計が決める（今は第 3 段階の DEC-52 の 60 秒）
    from: FR-05、FR-12
changelog:
  - {version: 1, date: 2026-11-02, change: 作成, reason: 第 1 段階の下書き（質問 1〜10 の回答を反映）}
  - version: 2
    date: 2026-11-03
    change: 押さえの結果が分からない間は分からないと示し、T_hold_wait まで確かめて、間に合わなければ手配や変更をやめる扱いを応答に足した。測定量の NFR-27 に足された場合を書いた。T_hold_wait を未定の値に足した
    reason: 品質チェーンの再実行（FR-05 版 3、FR-12 版 4、QR-07 版 2。回答の設計 2-1・3-3）に追随した（第 1 段階の再実行、3 回目）
