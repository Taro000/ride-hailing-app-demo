id: FND-52
title: 受付中のままデモの回を閉じたドライバーが次の回に持ち越され、SLI-03 を古いと数え、最後の位置が残る
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
