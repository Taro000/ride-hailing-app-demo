severity: major
evidence: DEC-37 の閉じる前の確かめは「終わっていない依頼と確かめ中の操作」だけを数え、受付中のドライバーを数えない。デモを閉じる手順（DEC-06・27）にも、受付を終えることはない。DEC-14 はドライバーの最後の位置を「受付を止めたとき（FR-17）」にだけ消す。SLI-03 版 2 は使用中の区間を「受付と状態の記録で決め、デモの回が開いていた間に限る」とし、最初の 30 秒を除くのは受付を始めてからだけ。そのため、ブラウザを閉じて受付を止めずに終えたドライバーは、次の回が開いた時刻から受付中として数えられ、アプリを開くまで毎分古いと数える。計算すると、長い窓に N_alert_min の 10 回がたまる 10 分ほどで 6 時間と 30 分、1 時間と 5 分の呼び出しが鳴り、3 時間の回のエラーバジェット（180 × 0.05 = 9 回）も 10 分で超える。また最後の位置の座標が回と期間をまたいで残り、DEC-14 の得るもの「要らなくなった最後の位置が残らない」と DRV-21 に反する。最後の位置には保存期間の規則もない
suggestion: デモを閉じる手順（運用のジョブ）か期間の終わりで、受付中のドライバーをシステムの変化として受付の終わりにし、最後の位置を消す。または SLI-03 の数えと DEC-16 に、回をまたいだ受付をどう扱うかを決める。システムが受付を終えることが FR-17 の外なら、品質チェーンへの課題にする（この報告書の課題 3）
