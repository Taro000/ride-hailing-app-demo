id: DEC-28
title: Turso の無料の枠の復元と、手元に暗号化して置くデモの回の終わりの書き出し
status: draft
version: 3
basis: inferred
basis_note: 無料の枠と書き出し、書き出しを手元に暗号化して置くことは質問 6 で確認済み。復元の期間と書き出しの方法は Turso の文書。書き出しの流れ（だれが、どの資格情報で、いくつ置き、いつ消すか）と、手元の機械がディスクを暗号化していることは推定（質問 16 は回答なし）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 障害やまちがった書き込みのあと、記録を障害の直前までどう戻すか
addresses:
- DRV-13
- DRV-04
- DRV-26
- DRV-21
- DRV-29
options:
- name: Turso の時点を指定した復元（無料の枠で直近 24 時間）に頼り、加えてデモの回の終わりごとに、開発者が手元の手順（ELM-22）で自分の Turso のログインでデータベースを書き出し、その場でパスフレーズで暗号化して手元の書き出しの置き場所（ELM-23）に置く。置くのは最新の二つまでで、システムを終えるときにすべて消す（DEC-36）。復元は新しいデータベースとして作り、接続先を設定で替えて配備し直す
  effect: 24 時間以内に気づけば直前まで戻せ、それより後は最後のデモの回の終わりまで戻せる。書き出しに使う組織全体のログインは開発者の手元だけで、平文が残らない。デモのデータベースを読めるトークンも GCP の中のサービスアカウントだけが読む（DEC-34）
  cost: 24 時間を過ぎて気づいた障害は直前まで戻せない。個人情報を手元に持つ。書き出しは人が手元で動かす一段
- name: '有料の契約（Developer: 10 日）で復元の期間を延ばす'
  effect: 10 日まで直前に戻せる
  cost: 月の費用（未定の値）
- name: 別の場所へ写し続ける
  effect: 自分で持てる
  cost: 作る手間
- name: デモを閉じる手順が、運用のジョブで非公開の Cloud Storage に書き出す
  effect: 手で一段を動かさずに済む
  cost: 置き場所とその権限と保持を作り、全員の個人情報を読める置き場所がクラウドにもう一つ増える。質問 6 の答え（手元に置く）を変える
chosen: Turso の時点を指定した復元（無料の枠で直近 24 時間）に頼り、加えてデモの回の終わりごとに、開発者が手元の手順（ELM-22）で自分の Turso のログインでデータベースを書き出し、その場でパスフレーズで暗号化して手元の書き出しの置き場所（ELM-23）に置く。置くのは最新の二つまでで、システムを終えるときにすべて消す（DEC-36）。復元は新しいデータベースとして作り、接続先を設定で替えて配備し直す
rationale: 利用者が選んだ（質問 6）。DRV-26（PC-01、無料の枠を優先）。障害の多くはデモの最中か翌朝の毎日の処理（06:00）で見つかり、24 時間の内に入る見込み。書き出しは全員の個人情報を含むので（DRV-21、DRV-29）、資格情報は手元のログインだけにし、平文を残さず、数を限り、終えるときに消す。版 2 は案 4 を「CI に全員の個人情報を読めるトークンを渡す」として退けたが、選んだ案でも CI の手順は構造の変更のためのトークンで同じものを読めたので、退けた理由が案の違いになっていなかった（FND-19）。3 回目の再実行で手順からデータベースの資格情報を外した（DEC-34）ので、書き出す主体を運用のジョブとして比べ直した。1 回目の再実行の前は書き出しの流れも資格情報も書いていなかった（FND-09）
rejected:
- option: '有料の契約（Developer: 10 日）で復元の期間を延ばす'
  reason: DRV-26 に反する
- option: 別の場所へ写し続ける
  reason: DRV-26 で負ける
- option: デモを閉じる手順が、運用のジョブで非公開の Cloud Storage に書き出す
  reason: 質問 6 の答えを変え、全員の個人情報を読める置き場所がクラウドにもう一つ増える（DRV-21、DRV-29）
gains:
- 費用がかからない
- 書き出しに使う組織全体のログインは開発者の手元だけで、平文が残らない
costs:
- 24 時間を過ぎて気づいた障害は直前まで戻せない
- 個人情報を手元の機械に持つ
- 書き出しは人が手元で動かす一段
sensitive_points:
- 障害に気づくまでの時間
- パスフレーズの置き場所（手元の機械に置かない）
trade_offs:
- with: DRV-13
  note: 直前まで戻せるのは 24 時間の内だけ
- with: DRV-21
  note: 個人情報を手元に持つ（暗号化、最新の二つまで、終えるときに消す）
assumptions:
- 復元は新しいデータベースとして作られる（Turso の文書）
- Turso の CLI の .dump で書き出し、新しいデータベースに読み込んで戻せる（Turso の文書）
- 開発者の手元の機械はディスクを暗号化している
depends_on:
- DEC-08
- DEC-34
parameters:
- name: 復元できる期間
  value: 24 時間
  basis: Turso の無料の枠（文書）
- name: データベースの書き出し
  value: デモの回の終わりごとに一度
  basis: 24 時間を過ぎて気づいた障害に備える
- name: 書き出しを残す数
  value: 最新の二つ
  basis: 最新が壊れていたときの備え。個人情報を持つ数を少なくする
debt:
  what: 24 時間を過ぎて気づいた障害は直前まで戻せない
  why_accepted: 無料の枠を優先する（PC-01、質問 6）
  repay_when: 24 時間を過ぎて気づく障害が起きたとき、または有料の契約に移るとき
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 書き出しの流れ（開発者の手元のログイン、その場での暗号化、最新の二つまで、終えるときに消す）を書き、手順が Cloud Storage に書き出す案と比べ、DRV-21・29 を対象に加えた
  reason: FND-09（第 2 段階のレビュー）を受け入れた
- version: 3
  date: '2026-11-03'
  change: 得るものの「書き出せるのは開発者だけ」を、書き出しに使う組織全体のログインは手元だけと直した。4 つ目の案を運用のジョブが書き出す形で比べ直し、退けた理由を質問 6 と置き場所が増えることにした
  reason: FND-19 を受け入れた（第 2 段階の再実行、3 回目。DEC-34 で手順からデータベースの資格情報を外した）
