responsibility: ログインと、設定の符号で最初のパスワードを決める画面（自分でアカウントを作る画面はない）。手配、手配の状況（押さえを確かめている間の「確かめています」と取り消し、T_request_max でのシステムの取り消しの知らせ）、迎車と乗車の地図、迎車中の乗る前の案内（確認コードを伝え、画面が乗車中に変わってから乗る。乗車中はサーバーの記録した運転の開始を受けたときだけ示す。DEC-30）、降車場所の変更、評価、しきい値、報告、履歴、支払い手段の画面。位置の取得と送信（迎車中で許可したとき）、音、前面と裏の扱い、カードの入力部品、SSE の受信と最新の状態の取り直し、表示の記録とエラーの記録の一時の保存と送信
