id: DEC-17
title: 知らせはサーバーと毎日の処理から送り、サーバーが数えられないものとジョブの失敗は Cloud Monitoring
status: draft
version: 4
basis: inferred
basis_note: Cloud Monitoring の規則を置くことは質問 5、二つ目の規則（毎日の処理のジョブの失敗）を足すことは質問 14 で確認済み。ジョブの実行の結果の指標は Cloud Run の文書で確かめた。SLO のアラートをサーバーが数えること（DEC-35）は質問 18 で確認済み。一つ目の規則の役目、まとめる間隔、ジョブの一回の上限とやり直しの回数、負債を返す条件、知らせと記録の順は推定（質問 19・26 は回答なし）。指標のラベルで入口とアプリの応答を分けられないことは第 3 段階が文書で確かめた
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 異常をどうエンジニアに知らせるか
addresses:
- DRV-28
- DRV-01
- DRV-27
- DRV-04
- FND-20
options:
- name: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送ってから記録を残す。記録を Turso に書けないときも送り、記録は構造化ログに残す。送れなければメモリに持って送り直す。SLO のアラート（DEC-35）も同じ道で送る。毎日の処理は毎日の結果を送り、その日の処理を終えたと記録できないときと知らせを送れないときは失敗として終わる。Cloud Monitoring の規則を二つ置き、同じチャットに送る（一つ目はサーバーが数えられないもの、つまりアプリが止まったとき、Turso に届かないか遅いとき、入口が返した 5xx と 429 を Cloud Run のサービスの標準の指標で見てデモの回の間だけ有効にする。入口とアプリの応答は指標で分けられないので、5xx と 429 はアプリが返したものも数える。二つ目は毎日の処理のジョブの実行の失敗を見てデモの期間の間だけ有効にし、運用のジョブは見ない）
  effect: アプリが動いていてもいなくても、毎日の処理が落ちても、知らせが届く
  cost: 規則の費用（未定の値。条件ごと）
- name: すべて Cloud Monitoring のログの指標と規則にする
  effect: 作る量が少ない
  cost: トレース ID の例を添えにくい（FR-36 AC1）。規則の数だけ費用
- name: サーバーの中だけで知らせる
  effect: 外部の規則が要らない
  cost: アプリが止まると知らせられない。毎日の処理が落ちても知らせられない
- name: 8:30 に毎日の処理をもう一度動かして、終わりの記録を確かめる（二つ目の定時の起動）
  effect: Cloud Monitoring の規則を増やさない
  cost: 同じイメージと資格情報で動くので、ジョブが落ちた理由（権限、イメージ、トークン）で一緒に落ち、外から見るものがない
chosen: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送ってから記録を残す。記録を Turso に書けないときも送り、記録は構造化ログに残す。送れなければメモリに持って送り直す。SLO のアラート（DEC-35）も同じ道で送る。毎日の処理は毎日の結果を送り、その日の処理を終えたと記録できないときと知らせを送れないときは失敗として終わる。Cloud Monitoring の規則を二つ置き、同じチャットに送る（一つ目はサーバーが数えられないもの、つまりアプリが止まったとき、Turso に届かないか遅いとき、入口が返した 5xx と 429 を Cloud Run のサービスの標準の指標で見てデモの回の間だけ有効にする。入口とアプリの応答は指標で分けられないので、5xx と 429 はアプリが返したものも数える。二つ目は毎日の処理のジョブの実行の失敗を見てデモの期間の間だけ有効にし、運用のジョブは見ない）
rationale: FR-36（DRV-28）の種類、件数、トレース ID の例を添えた知らせをサーバーで作り、サーバーが止まった場合を Cloud Monitoring に任せる（質問 5）。NFR-06（DRV-04、DRV-27）の 8:30 の知らせは、ジョブの中から送る知らせだけでは、ジョブが起動した後に落ちたときに出ない（FND-06）。ジョブを黙って成功させず、失敗した実行を外の規則で見る（質問 14）。06:00 に始めて遅くとも 07:30 に終わるか失敗し、知らせは 07:35 ごろで 8:30 に間に合う（計算）。案 4 は外から見るものにならない。NFR-01〜03 の SLO のアラートは DEC-35 がサーバーで条件どおりに数え、この決定の道で送る（質問 18）。そのため一つ目の規則は NFR-01 のアラートの代わりではなく、サーバーが数えられないもの（アプリが止まったとき、Turso に届かないか遅いとき、アプリに届く前に入口が返した 5xx と 429）だけを見ればよく、粗い条件で足りる。条件の形は第 3 段階の DEC-54（5 分で 5 件以上か、インスタンスの指標が 10 分ないとき）。版 3 は一つ目の規則を「入口が返した」ものに限って書き、Turso に届かないときにアプリが返す 503 を外していたので、Turso の障害で知らせが届く道が設計の上で一つも確かでなかった。知らせを記録の後に送る形では、Turso の障害で知らせも止まる（FND-20）
rejected:
- option: すべて Cloud Monitoring のログの指標と規則にする
  reason: FR-36 AC1 を満たしにくい
- option: サーバーの中だけで知らせる
  reason: DRV-01 で、止まったときに知らせられない。DRV-04 の NFR-06 も満たさない
- option: 8:30 に毎日の処理をもう一度動かして、終わりの記録を確かめる（二つ目の定時の起動）
  reason: ジョブと同じ理由で一緒に落ち、DRV-04 の NFR-06 を満たさない
gains:
- アプリが止まっても、Turso に届かなくても、アプリに届く前に入口で失敗しても、知らせが届く（Turso に届かないと最初の 503 から 4〜5 分。第 3 段階の計算）
- 毎日の処理が落ちても、8:30 より前に知らせが届く
- 知らせにトレース ID の例が付く
- SLO のアラートも同じチャットに届く（DEC-35）
costs:
- Cloud Monitoring の規則の費用（未定の値 C_monitoring_alert。条件二つ）
- 一つ目の規則は操作とアカウントの種類を分けない（サーバーが数えられないものを見る役目なので足りる）
- 一つ目の規則はサーバーの知らせと同じ出来事で二度鳴りうる。業務の 429（回数の制限）も数えるので、参加者でない人が鳴らしうる（第 3 段階の FND-37）
- Turso に書けない間の知らせの記録は構造化ログにだけ残る
- 定時の起動そのものが止められているときは知らせない
sensitive_points:
- まとめる間隔（NFR-33 の 5 分に収める）
- ジョブの一回の上限とやり直しの回数（8:30 より前に失敗が決まること）
- ジョブが黙って成功しないこと
trade_offs:
- with: DRV-26
  note: 規則を二つ持つ
assumptions:
- チャットは Webhook で知らせを受けられる（種類は未定。質問 8）
- Cloud Run のジョブの実行の結果の指標（run.googleapis.com/job/completed_execution_count の result）で失敗した実行を数えられる。指標は 60 秒ごとに取られ、最大 120 秒遅れて見える（Cloud Run の文書）
- Cloud Run のサービスの標準の指標で、応答の符号（5xx、429）を数えられるが、入口とアプリの応答は分けられない（第 3 段階が文書で確かめた）
depends_on:
- DEC-16
- DEC-18
parameters:
- name: 知らせをまとめる間隔
  value: 1 分
  basis: NFR-33 の 5 分の内
- name: 毎日の処理のジョブの一回の上限
  value: 45 分
  basis: 06:00 に始めて 2 回で遅くとも 07:30 に終わるか失敗し、知らせは 07:35 ごろ。NFR-06 の 8:30 に 55 分の余裕（計算）。ふだんの実行は数分（乗車 2〜6 回。PC-05）
- name: 毎日の処理のジョブのやり直し
  value: 1 回
  basis: 一時の失敗を一度だけやり直し、8:30 より前に結果を決める（上の計算）
debt:
  what: 定時の起動そのものが止められているときは、どの規則も知らせない（その日の NFR-06 の 8:30 の知らせが出ない）
  why_accepted: 規則を二つで済ませる。止めるのは期間を終える手順だけにし、期間を始める手順が定時の起動を通して確かめる。止めたままでも、期間を終える手順は翌朝の処理の記録がないと進まない（DEC-37）ので、遅くとも期間の終わりには気づく
  repay_when: 止めたまま毎日の処理が抜けたことが一度でも起きたとき（三つ目の規則で、デモの期間に成功した実行が一日ないことを見る）
deferred: false
revisit_when: null
as_is: new
