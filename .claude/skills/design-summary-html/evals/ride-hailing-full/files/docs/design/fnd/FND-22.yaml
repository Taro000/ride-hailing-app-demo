id: FND-22
title: 期間を終える手順を誰がいつ動かすかと、毎日の処理では 0 件にならないものの扱いが決まっていない
status: accepted
version: 2
basis: inferred
basis_note: DEC-37 の選んだ案と根拠と負債、DEC-27 の手順、ELM-05 の責務、DEC-04 の失うもの、FR-08、TC-07 と第 1 段階の 2 回目の再実行の記述（延長に上限を置かない）、報告書の「体制」の文は入力。手で動かす手順と読んだこと、残ったときに起きることは推定
needs_agreement: false
approver_candidates: []
