- DEC-05
- DEC-27
severity: minor
evidence: DEC-37 は、最後の回の翌朝の処理が確かめ中、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録したときだけ「期間を終える」を進め、そうでなければ次の実行の後にやり直すとする。TC-07 は期間の終わりをその記録で決め、それ以外のときは Cloud Run で何も動かさないとする。一方「期間を終える」は配備の仕組み（ELM-06）の手順で、誰がいつ動かすか、0 件になったと誰に知らせるかが書かれておらず、手で動かす手順として読める。動かすのが一日遅れるごとに、ジョブは TC-07 の期間の外で一度動く。DEC-37 自身の「運用者は一人なので、確かめを人の注意に頼らず手順の中に置く」と合わず、報告書の「人が手で行うのは書き出し、保管からの戻し、システムを終えるときの削除の三つだけ」にもこの一段が入っていない。また、強いて閉じた後に残った終わっていない依頼（FR-08 は乗客が待ち続けることを許す）とその押さえは、サービスの中の見回り（DEC-04）か参加者の操作でしか終わらず、毎日の処理（ELM-05）は終えない。その場合の延長は「1〜2 日」ではなく終わりがなく、出口は強いて終えることだけになる（第 1 段階は延長に上限を置かず、長引いたときの扱いを DEC-37 に任せた）。DEC-37 の負債の repay_when「強いて進めたとき」は危険が生じるときで、返すときになっていない（DRV-18、DRV-04）
suggestion: 毎日の処理の毎日の結果に、期間を終える条件を満たしたかを書き、満たしたら「期間を終える」を動かすよう知らせる。あるいは最後の回を決めた時点で終わりを予約し、記録が 0 件になった朝に人の操作なしに定時の起動を止める形と、そのとき要る権限を比べる。条件を、毎日の処理が片付けられるもの（確かめ中、状態を取り出せる押さえ）と、サービスか参加者でしか片付かないもの（終わっていない依頼とその押さえ）に分け、後者が残るときは待たずに止まって「サービスを開いて参加者に終えてもらうか、強いて終える」と示す。「1〜2 日」は前者だけに書く。負債の返すときを「次の期間の最初の実行が確かめたとき（次の期間がなければ返せない）」などに直す
resolution: 勧めの二つ目の形で受け入れた（質問 23）。期間の終わりは毎日の処理が決める。閉じる手順が最後の回に印を残し、その後の毎日の処理が残りを (A) 毎日の処理が片付けられるもの（確かめ中、Stripe から状態を取り出せる押さえ）と (B) サービスか参加者でしか片付かないもの（終わっていない依頼とその押さえ）に分けて記録し、どちらも 0 件なら自分で定時の起動と二つ目の規則を止めて知らせる（毎日の処理のジョブに、その二つを止める権限だけを足した。DEC-34）。(A) だけが残るときは次の実行で続け（1〜2 日）、(B) が残るときは待たずに「サービスを開いて参加者に終えてもらうか、強いて終える」と毎朝知らせる。版 2 の形（人が期間を終える手順を動かす）を案に足して比べ、DRV-18 で負けると書いた。期間を終える手順（ELM-06）は強いて終えるときなどに使う。負債の返すときを「次の期間の最初の実行が確かめたとき（次の期間がなければ返せない）」に直した（DEC-37 版 3、DEC-05 版 4、DEC-27 版 3、ELM-05・06・14・19）
