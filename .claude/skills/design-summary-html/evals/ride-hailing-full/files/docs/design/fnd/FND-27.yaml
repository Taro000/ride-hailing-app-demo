id: FND-27
title: 設計の前提にデモの URL を公開することがなく、PC-05 の参加者 2 人が使う人の数の上限として使われている
status: accepted
version: 2
basis: inferred
basis_note: デモの URL を発表、ブログ、動画などで示すことはレビューの質問 1 の回答（確認済み）。PC-05、DRV-01・02・29 の環境、FR-01 の乗客の登録、DEC-02・06・21 の根拠は入力。使う人の数が 2 人に限られなくなることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: requirements-to-architecture-drivers
targets:
- PC-05
- DRV-29
- DRV-01
- DRV-02
severity: minor
evidence: 利用者はデモの URL を発表、ブログ、動画などで示す（レビューの質問 1 の回答）。設計の前提（design-context.yaml）にこの事実はない。PC-05 は参加者を 2 人とし、DRV-29 の環境は「デモの回は Cloud Run の入口がインターネットに開く」とだけ言い、DRV-01・02 の環境は参加者 2 人を前提にする。第 2 段階は PC-05 を使う人の数の上限として使っている。DEC-02 は最大 1 インスタンスを「参加者 2 人に足りる」から、DEC-21 は流れの全体の上限 40 本を「参加者 2 人の流れ 2 本の 20 倍」から、Q_maps_day 1,000 回を「デモの回 1 回の 189 回の 5.3 倍」から決めている。乗客は自分でアカウントを作れる（FR-01）ので、URL を示せば参加者でない人もデモの回に使え、この上限の前提が崩れる。サービスの URL は作り直しても同じ（DEC-06）なので、一度示せば次の回からも届く
suggestion: 設計の前提に、URL を発表、ブログ、動画で示すことと、示す時期（デモの回の最中か、最後のデモの最後の回の後か。レビューの質問 2）を書く。参加者でない人の利用を許すかは品質チェーンへの課題 2 の答えに従う。許すなら PC-05 の規模と DRV-01・02 の環境を決め直し、許さないなら DRV-29 の応答に参加者でない人の登録と利用を防ぐことを足す。どちらでも、DRV-29 の環境に、URL が公開されて攻撃の起きやすさが上がることを書く
resolution: 受け入れた（第 1 段階の再実行、3 回目、2026-11-03）。設計の前提に PC-06 を足し、デモの URL を発表、ブログ、動画で、デモの回の最中や前にも示すことと、アカウントは運営・サポート担当が参加者にだけ作り（招待制）、参加者でない人はログインより先に進めないことを書いた。参加者でない人の利用は許さない（品質チェーンへの回答の設計 2-9。品質チェーンの課題 2 の答え）ので、PC-05 の参加者 2 人は使う人の数の上限のまま使え、PC-05 にそう書いた。DRV-29（版 2）の応答に参加者でない人はログインより先に進めないことと設定の符号の扱いを、環境に URL の公開で攻撃が起きやすくなることを足した。DRV-01・02（版 3）の環境に、ログインして使うのは参加者 2 人とテスト用アカウントだけと書いた。第 2 段階の DEC-02・21 は PC-05 を上限の根拠のまま使える
