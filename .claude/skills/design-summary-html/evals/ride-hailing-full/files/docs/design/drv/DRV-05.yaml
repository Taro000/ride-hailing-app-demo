id: DRV-05
title: 配車の規則がどの経路でも守られる
status: draft
version: 3
basis: inferred
basis_note: シナリオは QR-10・11・12・16 と NFR-09・10 から（入力）。規模（PC-05）は質問 11 で確認済み。T_request_max でのシステムの取り消し（FR-08 版 2）は入力で、許諾とのぶつかりを刺激にしたのは推定。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 割り当ての一意性、しきい値、受ける条件、停止の規則を、どの経路の許諾と示し方でも同じに守る
sources: [QR-10, QR-11, QR-12, QR-16, NFR-09, NFR-10, FR-08, FR-14, FR-15, FR-16, FR-18, FR-20, FR-22, FR-33, FR-34, FR-47, FR-51, PC-05]
concern_of: [USR-01, USR-02, USR-04]
scenario:
  source: ドライバー、乗客、運営・サポート担当、評価の更新、ドライバーの移動、時刻
  stimulus: 二人のドライバーがほぼ同時に同じ依頼を許諾する。乗客が探している途中でしきい値を下げる。評価の更新で条件を満たすかが変わる。一覧を開いたままのドライバーが停止される。ドライバーが動いて乗車場所までの距離が変わる。手配から T_request_max を過ぎてシステムが依頼を取り消すのとほぼ同時に、ドライバーが許諾する
  artifact: 依頼を示す相手と割り当て（FR-08、FR-14〜16、FR-18、FR-20、FR-22、FR-33、FR-34、FR-47、FR-51）
  environment: デモの回。ドライバーは 1 人（PC-05）なので、二人の許諾がぶつかるのは CI のテスト（NFR-10）と、ドライバーのアカウントを増やしたときだけ。ほぼ同時の操作
  response: 条件を満たすドライバーだけに依頼を示し、条件を満たす一人だけに割り当てる。取り消された依頼（システムの取り消しを含む）と、迎車中・乗車中・停止中のドライバーには割り当てない。許諾のない依頼は手配から T_request_max を過ぎるとシステムが取り消し、探している状態のまま残さない。条件の変化は一覧に反映される（届く速さは DRV-02）
  measure: 規則に反する割り当ての検出が 0 件（NFR-09）。境目を含む割り当てと絞り込みの CI のゲートがすべて通る（NFR-10）
negotiable: null
