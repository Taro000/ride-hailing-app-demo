  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: attempt（押さえの試みの何回目か）と destination_change_id を足した。not_happened にする場合、5xx の後に新しいキーで送る条件、手配をやめた依頼と当てなかった変更の押さえの追い方、押さえ直しと乗車の終了の重なり、未払いの支払いの何回目か、確かめ中の返金と返金できる残りの額を書いた。ELM-05 は持ち主のモジュールを通して書くと書いた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-05 版 3、FR-12 版 4、FR-30 版 4、FR-50 版 4）、FND-30・31・33・34・38・39'
