id: DAT-13
title: お金の操作
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。押さえの結果の分け方（not_happened）、試みの番号、押さえ直しと乗車の終了の重なりは DEC-52 版 2（FND-30・33・38）、未払いの支払いの何回目かと返金のやり直しは FR-30 版 4・FR-50 版 4。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: お金の操作（押さえ、確定、押さえの取り消し、返金、未払いの支払い）
owner: ELM-04
store: ELM-07
key_attributes:
- money_op_id
- ride_id
- kind（hold、capture、cancel_hold、refund、unpaid_charge）
- seq（押さえの何番目か、未払いの支払いの何回目か）
- attempt（押さえの試みの何回目か。DEC-52）
- amount
- stripe_idempotency_key
- stripe_object_id
- status（processing、succeeded、failed、checking、not_happened）
- lease_until
- first_sent_at、last_checked_at
- error_code
- refund_request_id
- destination_change_id（押さえ直しのとき）
relations:
- to: DAT-06
  kind: many-to-one
  note: 依頼
consistency: 支払いのモジュールだけが書く。DEC-12 の三つのトランザクション（キーと処理中、Stripe、結果と依頼と履歴）。処理中が T_op_stale（30 秒）を過ぎたら確かめ中にする。確かめ中を片付けるのは、lease_until を条件付きの書き込みで取った一つだけ（見回りと毎日の処理が重なっても一つ）。手配の押さえで Stripe が実行しなかったか届かなかったと分かったら not_happened にする。押さえは、5xx の後に照らして PaymentIntent がなく first_sent_at から T_op_stale を過ぎたと確かめたときだけ、前の行を not_happened にして attempt を進めた新しい行で送る（T_hold_wait の内だけ。DEC-52）。手配をやめた依頼と当てなかった降車場所の変更の押さえは checking のまま追い、見つかれば取り消し、ないと確かめたら not_happened にする。乗車の終了と確かめ中の押さえ直しが重なったら、確定は古い押さえで行い、新しい押さえは確かめを続ける（DEC-52）。未払いの支払いの何回目かは前の試みが failed と確定したときだけ進める（FR-30 AC3）。同じ依頼で確かめ中の返金があるあいだは新しい返金を受け付けず、返金できる残りの額は成功した返金と確かめ中の返金の額を引いて計算する（FR-50 AC2）。一つの依頼で同時に動くお金の操作は種類ごとに一つまで。ELM-05 は持ち主のモジュールを通して書く（DEC-53。確かめ中の片付け、押さえの取り消し、保存期間の匿名化）
retention: 額、種類、Stripe の ID は突き合わせのために残す。依頼の匿名化と一緒に個人への結び付きを消す。システムを終えるとき
classification: payment
drivers:
- DRV-04
- DRV-30
as_is: new
