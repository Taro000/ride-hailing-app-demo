id: DEC-20
title: 認証はサーバーの中のライブラリ、管理とエンジニアはパスキーも
status: draft
version: 4
basis: inferred
basis_note: パスキーの範囲は質問 4 で確認済み。外部の認証サービスを使わないこと、ログインの失敗の上限、止める単位（アカウントと IP の組）は推定（質問 11・25 は回答なし）。止められる数と試せる数は計算。URL が作り直しで変わらないことは Cloud Run の文書で確かめた
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: 本人だけがログインでき、役割の画面を役割のアカウントだけに使わせるにはどうするか
addresses:
- DRV-29
- DRV-25
- DRV-21
- DRV-26
- FND-44
options:
- name: サーバーの中の認証のライブラリで、メールアドレスとパスワード（重い計算の関数で保存）、HttpOnly・Secure・SameSite のクッキーのセッション、ログインの回数の制限と一時の停止（アカウントと IP の組で数え、アカウント全体は止めない）を行う。管理とエンジニアの役割はパスキーも求める。役割はサーバーのデータで持ち、経路のまとまりごとに一か所で確かめ、自分の依頼かどうかは配車のモジュールで確かめる
  effect: 認証のデータが Turso にそろい、手元でも同じに動く。最も強い権限の役割は漏れたパスワードだけでは使えない
  cost: 認証とパスキーを組み込む手間
- name: 外部の認証のサービス（Firebase Authentication、Identity Platform）
  effect: 多要素の認証などを任せられる
  cost: 外部サービスが一つ増え、ブラウザとサーバーの両方に組み込む
- name: 全員パスキーだけ
  effect: 漏れたパスワードの心配がなくなる
  cost: 参加者全員の登録と、端末をなくしたときのやり直しの流れ
chosen: サーバーの中の認証のライブラリで、メールアドレスとパスワード（重い計算の関数で保存）、HttpOnly・Secure・SameSite のクッキーのセッション、ログインの回数の制限と一時の停止（アカウントと IP の組で数え、アカウント全体は止めない）を行う。管理とエンジニアの役割はパスキーも求める。役割はサーバーのデータで持ち、経路のまとまりごとに一か所で確かめ、自分の依頼かどうかは配車のモジュールで確かめる
rationale: QR-20（重視）と QR-47（DRV-25、交渉できない）を、外部サービスを増やさずに満たす（DRV-26）。漏れた資格情報の被害が最も大きい管理とエンジニアの役割だけにパスキーを足す（質問 4）。TC-06（DRV-18）の Turso と手元の libSQL で同じに動く。アカウントは運営・サポート担当が参加者にだけ作る（招待制。FR-01 版 3、FR-48 版 2、PC-06）。乗客もドライバーも、一度だけ使える設定の符号で最初のパスワードを決める。符号は出し直せ、出し直すと前の符号は使えず、新しい符号でパスワードを決めると前のパスワードは使えない（パスワードの再設定を兼ねる。FR-48 AC6）。パスワードを決め直したら、そのアカウントのほかのセッションを終える（QR-20。第 3 段階の DAT-02 はパスワードの変更でセッションを消す）。符号は推し量れない長さの乱数にし、元に戻せない形で期限とともに持つ（第 3 段階の DAT-02 は 24 時間）。設定の符号の入口もログインより前にあるので、IP ごとの回数の制限を置く（DEC-21。値は第 3 段階の DEC-55）。乗客が自分でアカウントを作る入口はなく、登録の画面がアカウントの有無を示すこともない（第 3 段階の品質チェーンへの課題 1 は消えた）。URL を公開するので、参加者のメールアドレスを知る人はログインを試せる。アカウント全体を 5 回の失敗で 15 分止めると、一つの IP から 1 時間に 6 アカウントを止め、デモの回の最中に本人を締め出せる（計算。FND-44）。止める単位をアカウントと IP の組にすれば締め出せない。待ち時間を延ばす形も本人を待たせ、デモの回の間は止めない形は、招待制でログインできるのが参加者と担当だけになっても、参加者のアカウントへの総当たりを許すので、組の形にした
rejected:
- option: 外部の認証のサービス（Firebase Authentication、Identity Platform）
  reason: DRV-26 で負け、手元で同じ形にならない
- option: 全員パスキーだけ
  reason: DRV-26 で負ける
gains:
- 役割の確かめが一か所
- 管理のアカウントは漏れたパスワードだけでは使えない
costs:
- 認証とパスキーを組み込む手間
sensitive_points:
- ログインの失敗の上限、一時の停止の長さ、止める単位（アカウントと IP の組）
- 状態を変える要求での送り元の確かめ
- サービスの名前とプロジェクトを変えないこと（パスキーとクッキーが URL に結び付く）
trade_offs:
- with: DRV-26
  note: パスキーの部分を作る
- with: DRV-29
  note: 組で止めると本人を締め出させないが、多くの IP からの総当たりは IP の数だけ試せる（一つの IP から一つのアカウントに 1 時間に 20 回、100 の IP で 2,000 回。計算）
assumptions:
- ライブラリの候補は Better Auth（第 4 段階で決める）
- ログインの停止は、すでに開いたセッションを止めない（参加者は前もってログインしておける）
- パスキーの RP ID とクッキーは、サービスの決まった形の URL の名前に結び付く。作り直しても名前、プロジェクト、地域が同じなら変わらない（DEC-06、Cloud Run の文書）。名前かプロジェクトを変えると、登録したパスキーは使えなくなる
depends_on:
- DEC-08
- DEC-06
parameters:
- name: ログインの失敗の上限
  value: 同じアカウントと同じ IP の組で 5 回続けて失敗すると、その組を 15 分止める（アカウント全体は止めない）
  basis: 提案。数回打ち間違えても止まらない。組で数えると、メールアドレスを知る人に本人を締め出させない（FND-44）
debt:
  what: ログインの停止をアカウントと IP の組で数えるので、多くの IP からの総当たりは IP の数だけ試せる（100 の IP で 1 時間に 2,000 回。計算）
  why_accepted: アカウント全体を止めると、メールアドレスを知る人が本人を締め出せる（FND-44）。管理とエンジニアの役割はパスキーで守る
  repay_when: 一つのアカウントへの失敗が多くの IP から続いたとき（そのアカウントのパスワードを変えさせ、止め方を見直す）
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: パスキーとクッキーが作り直しても変わらない URL に頼ることを前提と応答を左右する点に書き、DEC-06 に依存させた
  reason: FND-17（第 2 段階のレビュー）を受け入れた
- version: 3
  date: '2026-11-03'
  change: ログインの一時の停止を、アカウント全体ではなくアカウントと IP の組で数える形にした。アカウント全体、待ち時間、デモの回の間は止めない形と比べたことを根拠に書き、多くの IP からの総当たりを残る危険（負債）にした
  reason: FND-44 を受け入れた（第 2 段階の再実行、3 回目）
- version: 4
  date: '2026-11-03'
  change: 招待制のアカウントの作り方を根拠に書いた（乗客もドライバーも一度だけ使える設定の符号でパスワードを決める。符号は出し直せ、パスワードの再設定を兼ねる。決め直したらほかのセッションを終える。符号は推し量れない乱数で、元に戻せない形と期限で持ち、入口に IP ごとの回数の制限）。乗客の登録がアカウントの有無を示すという記述と、参加者を見分ける手段がないという記述を外した
  reason: 品質チェーンの再実行（FR-01 版 3、FR-48 版 2、QR-20 版 2。回答の設計 2-9、設計 3-1、品質チェーン第 2 段階の質問 20）と、第 1 段階の 3 回目の再実行（PC-06、DRV-29 版 2）に追随した（第 2 段階の再実行、4 回目）
