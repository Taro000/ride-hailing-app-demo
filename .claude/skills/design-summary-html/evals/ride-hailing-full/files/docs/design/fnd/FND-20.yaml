id: FND-20
title: Turso に届かないとき、SLO のアラートも一つ目の規則も知らせず、SLI-03 の確かめも残らない
status: accepted
version: 2
basis: inferred
basis_note: DEC-35 の選んだ案と「サーバーが数えられないもの」、DEC-17 の一つ目の規則の役目と「送った記録を残す」、DEC-08 の失うもの（Turso の障害でシステム全体が止まる）、DRV-01 の通し確認の残る危険、DEC-16 の版 3 と版 2（コミット 2b19941）の SLI-03 の数え方は入力。Turso に届かないときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: architecture-drivers-to-architecture
targets:
- DEC-35
- DEC-17
- DEC-16
- ELM-14
severity: major
evidence: DEC-35 は NFR-01〜03 のアラートを、サーバーが 1 分ごとの数と毎分の SLI-03 の確かめを Turso に書き、Turso から読んで数える。アラートを一度だけ送ることも Turso の条件付きの書き込みで行う。サーバーが数えられないものは「アプリが止まったとき、アプリに届く前に入口が返した 5xx と 429」とし、DEC-17 の一つ目の規則はそれだけを見る。サーバーは動いているが Turso に届かないか遅いとき（DEC-08 は Turso の障害でシステム全体が止まるとし、DRV-01 の通し確認も Turso の障害を残る危険に挙げる）は、主要な流れの要求はアプリが T_db・T_route のあとに 503 を返して失敗する。しかしその数も SLI-03 の確かめも Turso に書けず、アラートの評価は記録を読めない。アプリが返した 503 は「入口が返した」ものではないので、一つ目の規則の役目の外にある。FR-36 の知らせ（DEC-17）は「送った記録を残す」を Turso に書き、書けないときに送るかは書かれていない。そのため、デモの回の最中に Turso が落ちたとき、知らせが届く道が設計の上で一つも確かでない。加えて DEC-16 の版 3 は毎日の SLI-03 をこの確かめの記録から数えるので、Turso に届かなかった分は「古い」ではなく、確かめのない分として数えから消える。版 2 は毎日の処理が位置の受信の記録から数えていたので、受信のない分は古いと数えられた。DRV-01 と DRV-27 の通し確認は、NFR-01 のアラートと一つ目の規則でアプリが原因の失敗を知らせるとしている（DRV-01、DRV-27、DRV-03）
suggestion: DEC-35 の「サーバーが数えられないもの」に、Turso に届かないか遅いときを加え、Turso に頼らない知らせの道を一つ決める。たとえば、一つ目の規則の条件をアプリが返した 5xx（DEC-33 の決まった符号の 503）も含めて数えるものにする。または、サーバーが Turso の呼び出しの失敗が続くことをメモリの中で数え、Turso に書かずにチャットへ送る（二つのインスタンスからの重なりは受け入れる）。FR-36 の知らせは、記録を書けないときも送ることを DEC-17 に書く。SLI-03 は、参加者が使用中なのに確かめのない分（サーバーが止まった分、Turso に届かなかった分）をどう数えるかを決める（受信と状態の記録から数え直す、または見えない点として品質チェーンに返す。品質チェーンへの課題 1）。DRV-01・DRV-27 の通し確認と、設計の観点の「エラー処理と障害許容」を直す
resolution: 受け入れた（質問 24）。DEC-35（版 3）の「サーバーが数えられないもの」に、Turso に届かないか遅くて記録を読み書きできないときを足した。DEC-17（版 4）の一つ目の規則は、指標で入口とアプリの応答を分けられないので 5xx と 429 をアプリが返したものも含めて数え、Turso に届かないときにアプリが返す 503 で鳴る（第 3 段階の DEC-54。最初の 503 から 4〜5 分）。サーバーの知らせは送ってから記録を書き、Turso に書けないときも送って構造化ログに残す。二つ目の規則は運用のジョブを見ない。DEC-16（版 4）の毎日の SLI-03 は、サーバーの確かめの記録ではなく、位置の受信、受付と状態、裏にあった時間の記録から同じ規則で確かめ直し、確かめられなかった分も受信がなければ新しくないと数える。SLI-03 の数え方を書くよう品質チェーンへの課題 8 にした（レビューの課題 1 を引き継いだ）。ELM-14、通し確認（CUJ-10、DRV-01・03・27）、設計の観点の「エラー処理と障害許容」、脅威のモデルの F14 も直した
