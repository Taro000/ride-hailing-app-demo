id: FND-53
title: 乱用されたときの最悪の費用を「上限の和」とするが、外への通信の量が入っておらず、ログインより前の静的なファイルと設定の取得に IP ごとの制限がない
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定。帯域の 100 Mbps は仮定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-04-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-21
- DEC-02
- DRV-29
severity: major
evidence: DRV-29（主）の応答は「総当たりと大量の要求を抑え、費用が予算を超えない」。DEC-21 の得るものは「最悪の費用が上限の和で決まる」、報告書の「走る費用」の判定は「乱用されたときの最悪の費用は上限の和で決まる（Cloud Run は最大 1 インスタンス × 開いている時間、地図は…）」。しかし費用の表に外への通信（下りの転送量）の行がなく、インスタンス単位の課金が縛るのは CPU とメモリの時間で、転送量ではない。ELM-04 は三つの Web アプリの静的なファイルを配り、回数の制限は IP ごとではログインと設定の符号の入口だけ（DEC-21、第 3 段階の DEC-55）で、ログインより前の静的なファイルと設定の取得には制限がない。仮に 100 Mbps で 3 時間流し続けると 1 回の回で 135 GB、4 回で 540 GB（計算。帯域は仮定、値段は入力にない）。また DEC-21 は残る危険を「多くの IP からの」大量の要求に限るが、制限のない経路では一つの送り元からも 80 の同時の要求の枠を埋められる（応答 5 ms なら 1 秒に 16,000 回。リトルの法則で計算）。ログインと設定の符号は重い計算（DEC-20）を 1 vCPU で行うので、IP ごとに 1 時間 30 回でも 1 回 0.25 秒なら 480 の IP で CPU が埋まる
suggestion: 費用の表に外への通信の行と未定の値（P_egress など）を足す。静的なファイルを含むログインより前のすべての経路に IP ごとの制限を置くか、静的なファイルを別の配り方にするかを比べる。置かないなら、外への通信の費用と一つの送り元からの枠の埋まりを DEC-21 の失うもの、残る危険、要合意に書く。重い計算の前に回数を確かめる順を応答を左右する点に書く
resolution: null
