  change: 名前を「毎日の処理と運用のコマンド」にし、同じイメージを毎日の処理のジョブと運用のジョブの二つで動かすとした。運用のジョブは構造の変更、配備の記録、閉じる前と終える前の数え、Turso の確かめを行う。毎日の処理のジョブは、期間を終える条件を二つに分けて記録し、最後の回の後に残りが 0 件なら自分で定時の起動と二つ目の規則を止める。SLI-03 を確かめ直して数える。FR-41、DRV-16・29、依存に ELM-14 を足した
