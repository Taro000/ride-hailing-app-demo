name: 毎日の処理と運用のコマンド
responsibility: 同じイメージを二つの Cloud Run のジョブとして動かす（いつもサービスと同じイメージ）。毎日の処理のジョブは、デモの期間だけ毎朝 06:00 に動き、Stripe との突き合わせ（未払いの支払いを含む）、結果が分からない操作の確かめ（取り出して照らしてから送る）、保存期間の処理、履歴の確かめと SLI の集計（SLI-03 は位置の受信、受付と状態、裏にあった時間の記録から確かめ直す）、毎日の監視と知らせ、消し忘れたサービスの知らせ、終わっていない日の追いつき、手配から T_request_max を過ぎて残った許諾のない依頼の取り消しと押さえの解放（サービスが消えた後に残ったもの。配車のモジュールで行う。DEC-04、DEC-37 の (A)）、期間を終える条件の記録（毎日の処理が片付けられる残りと、サービスか参加者でしか片付かない残りに分ける）を行い、最後の回が閉じられていて残りが 0 件なら、自分で定時の起動と二つ目の規則を止めて期間を終える。処理を終えられなかったときと知らせを送れなかったときは、失敗として終わる。運用のジョブは、配備の仕組みが動かすときだけ、構造の変更、配備の記録、閉じる前と終える前の数え、Turso が答えるかの確かめを行い、終わりの符号で結果を返す（第 3 段階の IFC-10）。二つのジョブは別のサービスアカウントで動く（DEC-34）
