id: DAT-18
title: 管理の操作の記録
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 管理の操作の記録
owner: ELM-04
store: ELM-07
key_attributes:
- audit_id
- operator_id
- operation（登録、変更、停止、再開、対処、返金、設定の符号、アカウントの作成（乗客））
- target_kind、target_id
- reason
- at
- outcome
relations:
- to: DAT-01
  kind: many-to-one
  note: 担当
consistency: 管理のモジュールが操作と同じトランザクションで追記するだけ（DEC-31）。返金は一つ目のトランザクションで要求を、二つ目で結果を追記する。乗客のアカウントの作成と設定の符号の出し直しも同じトランザクションで追記する。ELM-05 は持ち主のモジュールを通して書く（DEC-53。保存期間の匿名化）
retention: 担当との結び付きは T_pii_retention で匿名にする（DEC-31）。システムを終えるとき
classification: personal
drivers:
- DRV-29
- DRV-25
as_is: new
