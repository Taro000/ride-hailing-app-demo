id: FND-08
title: 最大 1 インスタンス × 同時 80 の要求の枠を、SSE の流れで使い切れる
status: accepted
version: 2
basis: inferred
basis_note: DEC-02・03・21、FR-01 AC1、脅威のモデルの F2 の文は入力。枠を使い切る攻撃と、そのときの 429 は推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-02
- DEC-03
- DEC-21
severity: major
evidence: DEC-02 は最大のインスタンスを 1、同時の要求の数を 80 にするので、システム全体で同時に扱える要求は 80（計算）。DEC-03 の SSE は画面ごとに 1 本を最長 30 分持ち、その間ずっと枠を一つ使う。FR-01 AC1 で、乗客は自分でアカウントを作れる。脅威のモデルの F2 は「接続を大量に開く」への備えを「一人あたりの接続の数を限る（DEC-21）、同時の要求の数（DEC-02）」とするが、DEC-21 の選んだ案に接続の数の上限はなく（アカウントと IP ごとの回数の制限は要求の頻度を限る）、同時の要求の数は使い切られる側の資源で、備えではない。たとえば攻撃者がアカウントを数個作って SSE を 80 本開くと、デモの回の間、参加者の要求は 429 になる（SLI-01 では失敗）。DRV-29 の応答「総当たりと大量の要求を抑え」と DRV-01 を満たさない。DEC-21 の上限は費用を縛るためのもので、動き続けるための備えになっていない
suggestion: アカウントごとと IP ごとの SSE の本数の上限（画面ごとに 1 本など）と、ログインしていない要求が同時に使える枠の上限を DEC-21 に書く。最大のインスタンスを 2 にして費用の上限を計算し直す案とも比べる。デモの回の間に新しい登録を限ることが要るなら、機能なので品質チェーンへの課題にする。脅威のモデルの F2 の記述を DEC と合わせる
resolution: 受け入れた。DEC-21（版 2）に、SSE の流れの本数の上限（ログインした人だけ、アカウントごと 2、IP ごと 6、全体 40。全体は同時の要求の数 80 の半分）とアカウントの作成の回数の制限（IP ごとに 1 時間に 5 件）を足し、最大 2 インスタンスの案と比べて退けた。DEC-02・03（版 2）と脅威のモデルの F2 を合わせた。多くの IP からの攻撃で流れの上限を埋められる危険は残り、要合意にした。デモの回の間の新しい登録の制限は、この規模では要らないと見て品質チェーンへの課題にしていない
