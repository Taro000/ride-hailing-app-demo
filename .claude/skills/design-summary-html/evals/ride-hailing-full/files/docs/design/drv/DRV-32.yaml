id: DRV-32
title: ログに個人情報を残さず、履歴と受信の記録の位置は権限のある役割だけが読める形で持つ
status: draft
version: 3
basis: inferred
basis_note: 品質チェーンの競合の解き方（QR-23 と QR-39・41）、QR-39 の二つの道（伏せる、権限のある人だけが読める形）、NFR-40 が状態の履歴も調べること、FR-39・SLI-05 が場所で行う四つの操作の位置を求めること、FR-17 が受信の記録に位置を持ち FR-45 がそれを示すことは入力。ログとエラーの記録は伏せ、履歴に要る位置は権限のある役割だけが読める形で持つと分けたのは推定（FND-01。質問 15 は回答なし）
needs_agreement: false
approver_candidates: []
kind: principle
statement: ログとブラウザのエラーの記録には、伏せていない位置・連絡先・名前とカード情報を残さない。状態の履歴の記録にも、伏せていない位置・連絡先・名前を書かない。履歴に要る位置（場所で行う四つの操作。FR-39、SLI-05、NFR-14、NFR-45）と、現在地の受信の記録の位置（FR-17。苦情の調べ FR-45 で示す）は、権限のある役割だけが読める形で持ち、変化やアカウントに結び付ける。利用者 ID、依頼 ID、トレース ID は残す
sources: [QR-23, QR-38, QR-39, QR-41, NFR-40, FR-17, FR-38, FR-39, FR-45, SLI-05, NFR-14, NFR-45]
concern_of: [USR-01, USR-02, USR-03]
scenario: null
negotiable: false
derived_from: [DRV-21, DRV-22, DRV-28, DRV-27]
priority: null
primary: false
conflicts:
  - with: DRV-27
    note: 解いた（FND-01）。前の版は状態の履歴に伏せていない位置を残さないとし、DRV-27（SLI-05、NFR-14、NFR-45）の変化ごとの位置と食い違った。履歴の記録には座標を書かず、位置は権限のある役割だけが読める形で持って変化に結び付ける（QR-39 の二つ目の道）。第 2 段階は DEC-15 で採った
