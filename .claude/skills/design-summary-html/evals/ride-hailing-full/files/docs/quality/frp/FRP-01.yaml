id: FRP-01
title: 到着予定時刻に迎車までの時間を含める
status: accepted
version: 2
basis: inferred
basis_note: FR-03 を変えることは質問 6 で確認済み。見込みの時間の求め方は推定
needs_agreement: false
approver_candidates: []
proposed_by: functional-requirements-to-product-quality
origin: [QR-08]
changes: FR-03
reason: FR-03 は経路と渋滞の情報だけから到着予定時刻を計算するので、手配の前に示す値がいつも実際より早くなる。QR-08 はドライバーが見つかるまでと迎車の時間を含めることを求める。
suggested_statement: システムは、手配の前に示す目的地への到着予定時刻を、ドライバーが見つかるまでの見込みの時間と、ドライバーが乗車場所に着くまでの見込みの時間と、走行の時間を足して計算する。
affects: [FR-03, QR-08]
placeholders: []
resolution: FR-03 を版 2 に変えて受け入れた。到着予定時刻を、ドライバーが見つかるまで・迎車・走行の見込みの時間の和にした（第 2 段階の質問 13）
