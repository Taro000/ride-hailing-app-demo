id: NFR-01
title: 配車の主要な流れの可用性の SLO
status: draft
version: 2
basis: inferred
basis_note: 目標値 99% は提案（運用実績がないので保守的にした）。QR-01 は CUJ-01・06・07・08 にまたがる。件数が少ないため CUJ ごとに分けず一つの SLO にして、CUJ ごとの内訳を示す（推定。質問 5 は未回答）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-01
kind: slo
cuj: CUJ-01
statement: 直近 28 日で、配車の主要な流れの有効な要求の 99% が、サーバーのエラーなしに応える。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: 手配の確定（FR-05）、依頼の一覧（FR-18）、許諾（FR-20）、迎車の到着（FR-25）、運転の開始（FR-26）、乗車の終了（FR-28）
slo:
  sli: SLI-01
  target: 99%
  target_status: provisional
  target_rationale: 運用実績も負荷試験の結果もないので、新しいシステムがまず満たせる保守的な値にした。KPI から導いていない
  window: 28-day rolling
  error_budget: 有効な要求の 1% までがサーバーのエラーになってよい
  error_budget_volume: 28 日の有効な要求の件数 × 0.01（件数は未定）。全停止に換算すると 6 時間 43 分（要求が時間に均等に散らばる前提。実際はデモの回に集まるので、デモ中の停止はこれより速くバジェットを使う）
  policy: EBP-01
  alerts:
  - notify: page
    long_window: 1h
    short_window: 5m
    burn_rate: 14.4
    budget_spent_at_alert: 2.1%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ
  - notify: page
    long_window: 6h
    short_window: 30m
    burn_rate: 6
    budget_spent_at_alert: 5.4%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ
  - notify: ticket
    long_window: 3d
    short_window: 6h
    burn_rate: 1
    budget_spent_at_alert: 10.7%
    condition: 長いウィンドウに有効なイベントが N_alert_min（10）件以上あるときだけ
gate: null
audit: null
monitor: null
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: conditions.workload の「常時稼働し、使うのはデモの回だけ」を「サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く」に直した。呼び出しのアラートの condition から「デモの回の外では呼び出しをチケットに変える」を外した（回の外にはサーバーがなく、出来事も起きない）
  reason: 設計の連鎖が返した課題（常時稼働の前提）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-1）
