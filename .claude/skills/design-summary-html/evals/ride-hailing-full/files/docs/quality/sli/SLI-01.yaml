id: SLI-01
title: 配車の主要な流れの可用性
status: draft
version: 1
basis: inferred
basis_note: 測定の方法と除くものは推定。ログと監視の基盤は未定（質問 4）なので、方法は一般の名前にした
needs_agreement: true
approver_candidates:
- 開発の責任者
- プロダクトオーナー
function: OK ÷ VALID
refs:
- QR-01
- NFR-01
reshaped: 規則 2（動いていた時間の割合ではなく、要求の数で数える）、規則 3（アプリの中ではなく、アプリの前に置く入口で測る）
target_entity: 本番のサーバーが、手配の確定（FR-05）、依頼の一覧（FR-18）、許諾（FR-20）、迎車の到着（FR-25）、運転の開始（FR-26）、乗車の終了（FR-28）の要求を扱う振る舞い
purpose: 配車の主要な流れの操作が、サーバーの都合で失敗する頻度
unit_event: 入口が受けた要求 1 件
method: 入口のアクセスログ法（アプリの前に置く入口のログを 1 分ごとに集める）
elements:
  VALID:
    definition: 上の六つの操作の要求で、ログインした参加者からのもの
    exclusions: 死活の確かめ、合成の監視、負荷試験、エンジニアのテスト用アカウントの要求、計画した保守の時間
    inputs: '入口のアクセスログ: request_id、trace_id（FR-37）、操作の名前、status、elapsed、アカウントの種類（テスト用かどうか）'
    unit: requests
    counting_rule: 1 分ごとに合計する。ブラウザのやり直しは、別の request_id の要求として 1 件ずつ数える。操作の名前は、設計で決まった経路の名前と対応させる表で決める
  OK:
    definition: VALID のうち、status が 5xx でも 429 でもなく、入口の待ち時間の上限を超えて切られなかった要求（4xx は利用者の入力の誤りとして良いに数える）
    inputs: VALID と同じ
    unit: requests
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番。一系統。デモの回の要求が大半
lifecycle: 本番で測る。負荷試験の値は見込みとして別に扱う
blind_spots: 入口に届かなかった要求（携帯の回線の切れ、ブラウザの中の失敗）は見えない。請求そのもの（FR-29）はサーバーの中の処理なので、ここではなく SLI-04 で見る。ログの欠けは 0.1% 未満と仮定する
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
