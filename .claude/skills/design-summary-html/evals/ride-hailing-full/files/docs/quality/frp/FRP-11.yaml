id: FRP-11
title: デモの回を開いた時刻と閉じた時刻を記録する
status: accepted
version: 2
basis: inferred
basis_note: SLI-03 の確かめ直しを「デモの回が開いていた間」に限る回答（2026-11-03、設計 2-8）から。設計はこの記録を配備と開け閉めの記録（DAT-26）として持つが、品質チェーンの FR-41 は配備ごとの記録だけを求め、回を閉じた時刻を求めていない
needs_agreement: false
approver_candidates: []
proposed_by: product-quality-to-slo
origin:
- QR-27
changes: FR-41
reason: SLI-03 は、使用中の区間を受付と状態の記録で決め、デモの回が開いていた間に限って数える。回を閉じた後も状態の記録は受付中のまま残るので、閉じた時刻がないと、回の外の時間を新しくないと数えてしまい、二人で数えて同じ値にならない。どの FR も、回を閉じた時刻を記録しない。
suggested_statement: システムは、デモの回を開いたとき（サーバーを配備したとき）と閉じたとき（サーバーを止めたとき）に、その時刻を配備の記録（FR-41）に残す。
affects:
- SLI-03
- NFR-03
placeholders: []
resolution: FR-41 版 4 として受け入れた。受け入れ基準に、デモの回を開いたとき（サーバーを配備したとき）と閉じたとき（サーバーを止めたとき）の時刻を記録すること（閉じる操作が途中で失敗したときも記録する）を足した。設計は DAT-26（配備と開け閉めの記録）ですでに持つ
changelog:
