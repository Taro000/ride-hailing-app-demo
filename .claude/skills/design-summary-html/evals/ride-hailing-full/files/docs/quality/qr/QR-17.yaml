id: QR-17
title: 返金の額と回数の正しさ
status: draft
version: 3
basis: inferred
basis_note: 決済はテスト環境（質問 1）なので影響を 4 から 2 に下げた。返金の誤りは突き合わせ（FR-55）で見つかる。点と扱いは推定。失敗と分かった返金のやり直しを新しいキーにすること（FR-50 版 4、2026-11-03 の回答、設計 3-2）への追随は推定
needs_agreement: true
