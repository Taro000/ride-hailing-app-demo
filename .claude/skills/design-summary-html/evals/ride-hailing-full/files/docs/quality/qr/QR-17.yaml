stakeholders: [USR-04, USR-01, 決済の外部サービス]
failure_scenario: 返金できる残りの額の計算を誤り、分けて行った返金の合計が請求額を超える。答えのなかった返金を、失敗と分かる前に新しいキーで送り直し、二重に返金する。失敗と分かった返金を同じキーで送り直し、決済のサービスが同じ失敗を返して、返すべき額が返らない。
