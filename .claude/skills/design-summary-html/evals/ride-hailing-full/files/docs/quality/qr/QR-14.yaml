id: QR-14
title: 確認コードの正しさ
status: draft
version: 2
basis: inferred
basis_note: 運送は模擬（質問 1・10）なので影響を 4 から 2 に下げた。点と扱いは推定。確認コードを両方向の確かめに使うこと（乗客の画面が乗車中に変わることが、乗客にとってドライバーの確かめになる）は 2026-11-03 の回答（設計 1-5）で確認済み。乗客が画面を確かめずに乗る危険は受け入れた（FR-26 の要合意）。点は変えない
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
model: product
layer: external
characteristic: functional suitability > functional correctness
statement: システムは、確認コードを依頼ごとに（ドライバーが替われば新しく）作り、その依頼のコードと一致したときだけ運転を開始する。乗客の画面は、その依頼のコードが一致して運転が始まったときだけ乗車中に変わる。
applies_to: [FR-09, FR-26]
traces_to: [QIU-05, QIU-15]
entry_point: null
stakeholders: [USR-01, USR-02]
failure_scenario: ドライバーが替わったのに確認コードが古いまま、または別の依頼のコードでも開始でき、依頼主でない人を乗せる。コードが一致していないのに乗客の画面が乗車中に変わり、乗客は装った車を手配した車と思って乗る。
score: {impact: 2, likelihood: 2}
