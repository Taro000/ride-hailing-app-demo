id: FR-41
title: 本番への配備と配備の記録
status: draft
version: 4
basis: inferred
basis_note: QIU-20〜22・28〜30 から導いた。CUJ-11〜13 にまたがり、どれも手順がないので cuj は空。障害の記録を製品の外に残すことは質問 6 で確認済み。テストの範囲と合否の基準は第 3・4 段階。QIU-28〜30 が版 3 で「main に入って CI が通る」までを測るので、その時刻を配備の記録に加えた（第 2 段階の質問 22 で確認済み。git と CI の記録から取る）。デモの回を開いた時刻と閉じた時刻の記録は、第 4 段階の FRP-11 を受け入れて足した（質問 23。SLI-03 が使う）
needs_agreement: false
approver_candidates: []
statement: システムは、エンジニアが変更を一つの操作で本番に配備できるようにし、配備の前に自動のテストを実行して、配備ごとに版、時刻、含まれる変更とその種類（新しい機能・修正・版上げ）、各変更の最初のコミットの時刻と main に入って CI が通った時刻を記録する。デモの回を開いたとき（配備したとき）と閉じたとき（サーバーを止めたとき）にも、その時刻を記録する。
origin: quality-in-use
cuj: null
cuj_step: null
traces_to: [QIU-20, QIU-21, QIU-22, QIU-28, QIU-29, QIU-30]
proposal: null
existing: false
extends: null
interface:
  - 配備の仕組み（種類のみ）
acceptance_criteria:
  - エンジニアが配備を始めると、自動のテストを実行し、通ったときだけ本番を新しい版に替える。
  - 配備ごとに、版、時刻、含まれる変更、変更の種類（新しい機能・修正・版上げ）、各変更の最初のコミットの時刻と main に入って CI が通った時刻を記録する（QIU-20〜22・28〜30 の測定に使う）。
  - テストに通らないとき、配備せず、どのテストが失敗したかを示す。
  - デモの回を開いたとき（サーバーを配備したとき）と閉じたとき（サーバーを止めたとき）に、その時刻を記録する（第 4 段階の SLI-03 が、デモの回が開いていた間を知るのに使う）。閉じる操作が途中で失敗したときも、失敗したことと時刻を記録する。
  - 配備の途中で失敗したとき、本番は前の版のまま動き、失敗を記録してエンジニアに通知する。
quality_hints:
  - 有効性 (QIU-20, QIU-21, QIU-22) - 本番に出してから T_regression_window 日以内に既存の機能を壊さない
  - QR-27 - デモの回が開いていた間を、開け閉めの記録から欠けなく決められる（SLI-03）
  - 効率性 (QIU-28, QIU-29, QIU-30) - 最初のコミットから T_lead_feature・T_lead_fix・T_lead_upgrade（変更の種類ごと）以内に main に入って CI が通る（次のデモの回に配備できる状態になる）
