statement: 配車依頼と乗車の状態の履歴、ブラウザのエラーの記録、乗客の報告は、起きた出来事を欠かさず、乗車とドライバーに結び付いている。ドライバーが場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）の記録には、位置か、得られなかった印がある。
