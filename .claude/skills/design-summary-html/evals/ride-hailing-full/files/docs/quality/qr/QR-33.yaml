id: QR-33
title: 状態の履歴とエラーと報告の記録が欠けない
status: draft
version: 3
basis: inferred
basis_note: 失敗のシナリオ、点、扱いは推定。扱いは要合意。位置を求めるのはドライバーが場所で行う四つの操作だけで、得られなかったときは印を記録することは 2026-11-03 の回答（設計 2-5、FR-39 版 3）。点は変えない
