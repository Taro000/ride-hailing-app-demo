failure_scenario: ブラウザのエラーが送られずに消え、状態の履歴に出来事が欠け、障害の原因や苦情の乗車をたどれない。到着や乗車の終了の記録に位置も得られなかった印もなく、苦情の乗車で、ドライバーがどこで乗車を終えたかを確かめられない。
