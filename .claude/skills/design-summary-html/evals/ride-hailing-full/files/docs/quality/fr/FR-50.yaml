id: FR-50
title: 返金
status: draft
version: 4
basis: inferred
basis_note: QIU-26 から導いた。受け入れ基準は推定。失敗と分かった返金を新しいキーでやり直すことは 2026-11-03 の回答（設計 3-2）で確認済み
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当が依頼の請求（運賃、キャンセル料、不在の料金）の一部または全部を、返金できる残りの額の範囲で、理由を添えて返金できるようにし、同じ返金を二度行わない。
origin: quality-in-use
cuj: CUJ-16
cuj_step: null
traces_to: [QIU-26]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（請求と返金）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 運営・サポート担当が額と理由を入れて返金すると、決済のサービスで返金し、額、理由、担当、時刻を記録し、乗客の履歴（FR-44）に示す。
  - 返金できる残りの額を超える額は受け付けず、その旨を示す。
  - 返金の要求ごとに一意のキーを付け、同じ返金の操作が二度届いても返金は一度だけ行う。
  - 決済のサービスが返金に失敗したとき、返金を完了と記録せず理由を示す。決済のサービスが答えず送り直すときは同じキーを使う。返金に失敗したと分かった後にやり直すときは、新しい返金の要求（新しいキー）にする。
quality_hints:
  - 有効性 (QIU-26) - 返金しすぎや二重の返金がない
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
  - version: 2
    date: 2026-10-31
    change: 品質のヒントの特性を経済リスク緩和性から有効性に直した
    reason: 第 1 段階の再実行で、たどる QIU が版 2（有効性）になった
  - version: 3
    date: '2026-11-01'
    change: キャンセル料と不在の料金も返金できるようにした
    reason: FR-07 版 2 と FR-27 版 2 への追随（第 2 段階の質問 14〜17（2026-11-01））。迎車の遅れでない取り消しでも、ドライバーのせいなら苦情から返金する
  - version: 4
    date: '2026-11-03'
    change: AC4 を、答えがなく送り直すときは同じキー、失敗と分かった後のやり直しは新しい返金の要求（新しいキー）に直した
    reason: 設計の連鎖が返した課題（失敗した返金をやり直すときのキー）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 3-2）。同じキーで送り直しても、決済のサービスは同じ失敗を返す
