id: QR-20
title: アカウントは本人だけが使える
status: draft
version: 2
basis: inferred
basis_note: QIU-05・08 から導いた。セキュリティのリスク分析の分類（ログインの方式、質問 3・11）にも当たる。運送と決済は模擬（質問 1）なので影響を 5 から 3 に下げた。点と扱いは推定。乗客もドライバーも運営・サポート担当が作ったアカウントに設定の符号でパスワードを決めること（招待制）と、参加者でない人はログインより先に進めないことは 2026-11-03 の回答（設計 2-9）。デモの URL は回の最中や前にも示す（context.yaml の制約）。符号を設定の後も出し直せることは第 2 段階の質問 20。点は変えない（推定）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
model: product
layer: external
characteristic: security > authenticity
statement: システムは、乗客・ドライバー・運営・サポート担当のアカウントに、本人だけがログインできるようにする。設定の符号は本人だけが使え、一度使うか出し直すと使えなくなる。アカウントを持たない人（参加者でない人）は、ログインより先の画面を使えない。
applies_to: [FR-01, FR-48]
traces_to: [QIU-05, QIU-08]
entry_point: null
stakeholders: [USR-01, USR-02, USR-04]
failure_scenario: 漏れた資格情報で他人のアカウントにログインされ、乗客は身に覚えのない請求を受け、偽のドライバーが依頼を受ける。設定の符号が他人に知られ、本人より先にパスワードを決められてアカウントを乗っ取られる。使った符号や出し直す前の符号でパスワードを決め直せる。デモの URL を見た参加者でない人が、ログインより先の画面に入れる。
