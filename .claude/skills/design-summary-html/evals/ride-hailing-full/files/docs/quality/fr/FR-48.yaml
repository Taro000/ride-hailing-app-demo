id: FR-48
title: 参加者のアカウントの作成とドライバーと車両の登録
status: draft
version: 2
basis: inferred
basis_note: 乗客に示す車の情報（QIU-04・05）を作る機能として導いた。運営・サポート担当が登録することは質問 9 で確認済み。審査は境界の外（第 1 段階の質問 12）。乗客のアカウントも運営・サポート担当が作り、一度だけ使える設定の符号を渡すこと（招待制）は 2026-11-03 の回答（設計 2-9）で確認済み。乗客のアカウントの作成を新しい FR にせずこの FR に足したこと（同じ担当、同じ画面、同じ設定の符号の流れ）は推定。符号を設定の後も出し直せ、パスワードの再設定を兼ねることは第 2 段階の質問 20 で確認済み（設計の IFC-06 は設定の後の出し直しを断るので、設計の追随が要る）。当てはまる CUJ はない
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当が、参加者の乗客（名前、連絡先）と、審査を通ったドライバーとその車両（名前、顔写真、連絡先、車種、色、ナンバー）を登録・変更してアカウントを作り、本人に渡す一度だけ使える設定の符号を出せるようにする。
origin: quality-in-use
cuj: null
cuj_step: null
traces_to: [QIU-01, QIU-04, QIU-05, QIU-08]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（参加者のアカウント、ドライバーと車両）"
acceptance_criteria:
  - 運営・サポート担当が乗客の名前と連絡先を入れて登録すると、乗客のアカウントを作り、一度だけ使える設定の符号を示す。乗客はその符号でパスワードを決めてログインできる（FR-01）。
  - 運営・サポート担当が、審査を通ったドライバーの名前、顔写真、連絡先と、車両の車種、色、ナンバーをすべて入れて登録すると、ドライバーのアカウントを作り、一度だけ使える設定の符号を示す。ドライバーはその符号でパスワードを決めてログインできる（FR-01）。
  - 必要な項目が欠けているとき、登録せず、欠けている項目を示す。
  - 同じ連絡先のアカウントがすでにあるとき、アカウントを作らず、その旨を運営・サポート担当に示す。
  - すでに登録されたナンバーを登録しようとしたとき、登録せずその旨を示す。
  - 運営・サポート担当が設定の符号を出し直すと、前の符号は使えなくなる。参加者が新しい符号でパスワードを決めると、前のパスワードは使えなくなる（符号を失くしたときと、パスワードを忘れたとき）。
  - 車両の情報を変えると、次の依頼から新しい情報を乗客に示す（FR-09）。
quality_hints:
  - 効率性 (QIU-04) - 乗客に示す車の情報が、実際の車と一致する
  - 有効性 (QIU-08) - 設定の符号が本人にだけ渡り、他人がそのアカウントでログインできない
changelog:
