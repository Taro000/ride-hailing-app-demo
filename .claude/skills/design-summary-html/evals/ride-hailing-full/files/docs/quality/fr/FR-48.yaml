    change: 乗客のアカウントの作成を足した（名前と連絡先を入れると、一度だけ使える設定の符号を出す）。ドライバーにも設定の符号を出すと書いた。同じ連絡先の確かめを FR-01 から移した。符号の出し直し（設定の後も出し直せ、パスワードの再設定を兼ねる。質問 20）を足した。たどる先に QIU-01・08 を足した
    reason: 設計の連鎖が返した課題（参加者でない人の登録と利用）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-9）。FR-48 に足すか新しい FR にするかは第 2 段階に任された
