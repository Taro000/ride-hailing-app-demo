id: NFR-44
title: 最初のデモの前の決済の接続と突き合わせの確かめ
status: draft
version: 2
basis: inferred
basis_note: 決済は Stripe のテスト環境に決まり、仮のスタブは使わない（2026-11-03 の回答、設計 1-4）。デモに入る前の確かめにすることは第 4 段階の質問 7〜9（2026-11-01）。毎日の処理はデモの期間だけ動く（設計 1-1）ので、最初のデモの前の突き合わせは手で起こしてよい（第 4 段階の質問 11 で確認済み）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-32
- QR-09
kind: gate
cuj: CUJ-08
statement: 最初のデモの前に、決済が Stripe のテスト環境（サンドボックス）につながっていること、FR-55 が押さえ・請求・返金の記録を取り出して突き合わせられることを確かめる。満たさなければデモを始めない。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate:
  where: デモに入る前の確かめ（リリース前の確認）
  check: 本番の設定の決済の接続先が Stripe のテスト環境であること。テスト用アカウントで押さえ・請求・キャンセル料・返金を一件ずつ行い、その分を FR-55 で突き合わせた結果（翌日の実行か、手で起こした実行）がすべて一致すること
  threshold: すべて満たす
audit: null
monitor: null
