  reason: 設計の連鎖が返した課題（常時稼働の前提）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-1）。設計の連鎖が返した課題（古い記述（仮のスタブ））への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-4）
