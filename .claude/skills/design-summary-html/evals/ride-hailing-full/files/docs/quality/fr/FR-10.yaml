id: FR-10
title: 迎車の現在地の表示
status: draft
version: 2
basis: inferred
basis_note: 第 1 段階のヒント（迎車中の現在地）から。止まったら最後の位置と時刻を示すことは質問 2 で確認済み。受け入れ基準の細部は推定。許諾のときの到着予定を記録することは FRP-09（FR-07 の無料の判定と苦情の根拠に使う）
needs_agreement: false
approver_candidates: []
statement: システムは、迎車中の乗客に、ドライバーの現在地と乗車場所への到着予定を地図に示し、許諾のときに最初に示した到着予定を依頼に記録する。ドライバーの現在地が更新されなくなったときは最後に分かった位置とその時刻を示す。
origin: cuj-step
cuj: CUJ-02
cuj_step: 手配した車かどうかを確認する
traces_to: [QIU-02, QIU-04, QIU-15]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（迎車中）"
acceptance_criteria:
  - 迎車中、ドライバーの現在地と乗車場所への到着予定を地図に示し、現在地が届くたびに更新する。
  - 依頼が許諾されたとき、乗客に最初に示した乗車場所への到着予定時刻を依頼に記録する。ドライバーが替わったときは、新しいドライバーの許諾のときの値を記録し、前の値も残す。
  - 到着予定を計算できず示せないとき、その旨を示し、依頼には到着予定がないことを記録する。
  - ドライバーの現在地が届かなくなったとき（ドライバーのブラウザが裏に回ったときなど）、最後に分かった位置とその時刻を示し、更新が止まっていることを示す。
  - 現在地がまた届くようになると、更新が止まっているという表示を消す。
quality_hints:
  - 効率性 (QIU-04) - 示す迎車の位置と到着予定が、実際から遅れない
