statement: システムは、受付中のドライバーに、示してよい配車依頼（FR-16、FR-34）の一覧を、乗車場所までの距離、乗車場所、降車場所、受取額とともに示し、依頼が増えたり他のドライバーに許諾されたりするたびに更新する。
origin: cuj-step
