interface:
  - "画面: ドライバーの Web アプリ（依頼の一覧）"
acceptance_criteria:
  - 受付中のドライバーに、示してよい依頼（FR-16、FR-34）を一覧で示し、各依頼に現在地から乗車場所までの距離、乗車場所、降車場所、ドライバーの受取額を示す。
  - 新しい依頼が来ると一覧に加え、音で知らせる。
  - ほかのドライバーが許諾した依頼と、取り消された依頼は一覧から消す。
  - 示す依頼がないとき、その旨を示す。
