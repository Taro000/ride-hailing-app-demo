id: NFR-07
title: 請求の誤りと二重の請求を 1 件ごとに知らせる
status: draft
version: 3
basis: inferred
basis_note: 目標 0 件にはエラーバジェットがないので、SLO ではなく監視にした。自然な SLI は QIU-08 の測定量と同じイベントを数えるので、SLO にしなかった（推定。質問 5 は未回答）。突き合わせは FR-55（FRP-08 を受け入れた）。決済は Stripe のテスト環境で、仮のスタブは使わない（2026-11-03 の回答、設計 1-4）。料金が上がる降車場所の変更での押さえ直し（設計の DEC-11）は誤りに数えず、押さえ直しの後も古い押さえが取り消されずに残るものと、同じ押さえ直しに二つ目の押さえがあるものを誤りにする（2026-11-03 の回答、設計 2-6）。終わった依頼に残る押さえ、システムの取り消しへのキャンセル料、二度目の返金は、QR-09 版 5・QR-17 版 3 への追随（終わった依頼に翌朝の突き合わせの時点で残る押さえを誤りとすることは第 4 段階の質問 11 で確認済み）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-09
- QR-17
kind: monitor
cuj: CUJ-08
statement: 毎日の突き合わせで、確定した料金（降車場所を変えたときは乗客が承認した料金）と違う額の請求、押さえ直しの後も取り消されずに残る古い押さえ、同じ押さえ直しにある二つ目の押さえ、取り消した依頼や手配をやめた依頼に突き合わせの時点で残る押さえ、同じ乗車への二度目の請求、返金できる残りの額を超える返金と同じ返金の要求への二度目の返金、無料になるはずの取り消しとシステムが取り消した依頼（FR-08）へのキャンセル料、位置を確かめられなかった到着での不在の料金、同じ依頼への二度目のキャンセル料か不在の料金が見つかると、1 件ごとにエンジニアと運営・サポート担当にその日の朝に知らせる。目標は 0 件。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate: null
audit: null
monitor:
  signal: 突き合わせ（FR-55）の不一致の一覧と自分の記録のうち、額の違い、残った古い押さえと二つ目の押さえ（料金が上がる降車場所の変更での押さえ直しそのものは数えない）、終わった依頼に残る押さえ、二度目の請求、超過の返金と二度目の返金、請求してはいけないキャンセル料と不在の料金
  threshold: 1 件でも
  notifies: エンジニアと運営・サポート担当（その日の朝）
