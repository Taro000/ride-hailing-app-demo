    reason: 第 1 段階の再実行で、たどる QIU が版 2（有効性）になった
  - version: 3
    date: '2026-11-01'
    change: 変更後の料金も R_fare で見込みから計算することを加えた
    reason: context.yaml の制約（2026-11-01）と第 2 段階の質問 14〜17（2026-11-01）
  - version: 4
