id: FR-12
title: 乗車中の降車場所の変更
status: draft
version: 4
basis: inferred
basis_note: 第 1 段階の QIU-02・06・08 の測定量が前提にしていた機能で、質問 8 で確認済み。受け入れ基準は推定。新しい額の押さえの結果が分からないときの扱いは 2026-11-03 の回答（設計 2-1・3-3。設計の DEC-52 に、設計の指摘 FND-31 の勧めを合わせた形）で確認済み。T_hold_wait の値は設計が決める（今は DEC-52 の 60 秒）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
statement: システムは、乗車中の乗客が降車場所を変えられるようにし、変えた場合の料金と到着予定時刻を示して乗客が承認したら、ドライバーに新しい降車場所を示し、確定した料金を更新する。
origin: quality-in-use
cuj: CUJ-03
cuj_step: 正しい場所に到着したかを確認する
traces_to: [QIU-02, QIU-06, QIU-08]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（乗車中）"
  - "画面: ドライバーの Web アプリ（乗車中）"
  - "外部: 地図・経路・渋滞の情報のサービス"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 乗車中の乗客が新しい降車場所を指定すると、その場合の料金と到着予定時刻を計算して示し、乗客が承認するまで降車場所を変えない。料金は、乗車の開始から新しい降車場所までの見込みの距離と時間に R_fare を当てはめて計算する（FR-03 と同じ）。
  - 乗客が承認すると、ドライバーの画面と音で知らせて新しい降車場所のピンと経路を示し、確定した料金と押さえた額を更新する。
  - 今いる場所で降りることも、降車場所の変更として指定できる。
  - 料金を計算できないとき、または新しい額を押さえられないとき、降車場所を変えず理由を示す。
  - 新しい額の押さえの結果が分からない（決済のサービスが答えない）とき、降車場所を変えずに「確かめています」と示し、乗客が変更を取り消せるようにする。T_hold_wait までに押さえたと分かれば、降車場所を変える。分からないまま T_hold_wait を過ぎるか乗客が変更を取り消したら、降車場所を変えずにその旨を示し、新しい押さえが残っていれば解放する。解放したか新しい押さえがないと分かるまでは「新しい押さえが残っていれば解放します」と示す。「押さえていない」と示すのは、決済のサービスが答えたときだけにする。
  - 変えた時刻と、変更の前後の降車場所と料金を記録する（QIU-02、QIU-06、QIU-08 の数え方に使う）。
quality_hints:
  - 有効性 (QIU-08) - 変更後に示した料金どおりに請求される
  - 有効性 (QIU-06) - 最後に指定した降車場所で降りられる
  - 有効性 (QIU-08) - 新しい押さえの結果が分からないときも、新しい押さえを残したまま変更をやめない
