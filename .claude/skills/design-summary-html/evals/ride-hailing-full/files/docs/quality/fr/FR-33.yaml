id: FR-33
title: 受ける条件の設定
status: draft
version: 1
basis: inferred
basis_note: 手順は入力。金額の条件を受取額で比べることは質問 10 で確認済み。条件の記録（QIU-12・17 の数え分け）は推定
needs_agreement: false
approver_candidates: []
statement: システムは、ドライバーが受ける依頼の条件（受取額の下限、現在地から乗車場所までの距離の上限）を設定・解除できるようにし、条件の値と変えた時刻を記録する。
origin: cuj-step
cuj: CUJ-09
cuj_step: 配車依頼を受ける条件を設定する（金額・現在地から乗車場所までの距離）
traces_to: [QIU-12, QIU-17]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（受ける条件）"
acceptance_criteria:
  - ドライバーが受取額の下限と、現在地から乗車場所までの距離の上限を設定すると、それ以降の依頼の一覧（FR-18）にその条件を使う。
  - 条件を解除すると、条件のない一覧に戻す。
  - 負の値など、ありえない値は受け付けない。
  - 条件の値と変えた時刻を記録する（QIU-12 と QIU-17 の数え分けに使う）。
quality_hints:
  - 利用状況完全性 (QIU-17) - 条件を設定したドライバーの時間あたり受取額が、設定していないドライバーより G_condition_gap を超えて下がらない
