id: FR-55
title: 決済のサービスの記録との毎日の突き合わせ
status: draft
version: 2
basis: inferred
basis_note: 機能は FRP-08 から（NFR-04・06・07・38、SLI-04 が使う）。お金の扱いは本物どおりに作る（質問 11）ので受け入れた。決済のサービスは Stripe のテスト環境で、仮のスタブは使わない（2026-11-03 の回答、設計 1-4）。一致しない依頼を直すのは運営・サポート担当の業務。Stripe のテスト環境から押さえ・請求・返金の記録を取り出せることを前提にしている（最初のデモの前に確かめる。第 4 段階の NFR-44）
needs_agreement: false
approver_candidates: []
statement: システムは、毎日、前日の依頼の押さえ・請求・返金の記録を決済のサービスの記録と突き合わせ、一致しない依頼の一覧を記録して、エンジニアと運営・サポート担当に知らせる。
origin: proposal
cuj: null
cuj_step: null
traces_to: [QIU-08, QIU-16, QIU-26]
proposal: FRP-08
existing: false
extends: null
interface:
  - "処理: 毎日の突き合わせ"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 毎日、前日の押さえ・請求（運賃、キャンセル料、不在の料金）・返金の記録を、決済のサービスの記録と依頼ごとに突き合わせ、依頼ごとに一致したかと、一致しない項目（額、件数、片方にだけある記録）を記録する。
  - 一致しない依頼があると、その一覧をエンジニアと運営・サポート担当に知らせ、管理の画面のその依頼（FR-49）に示す。
  - 決済のサービスから記録を取り出せないとき、その日の突き合わせを終えたと記録せず、エンジニアに知らせ、次の実行で残りの日を続ける。
  - 突き合わせの結果は書き換えない。直した後にもう一度突き合わせると、新しい結果として追記する。
  - テスト用アカウントの依頼も突き合わせ、印を結果に残す（FR-01）。
quality_hints:
  - QR-32 - 自分の記録と決済のサービスの記録が一致する
  - QR-09 - 示した額どおりに一度だけ請求したことを確かめられる
  - QR-17 - 返金しすぎや二重の返金がないことを確かめられる
changelog:
