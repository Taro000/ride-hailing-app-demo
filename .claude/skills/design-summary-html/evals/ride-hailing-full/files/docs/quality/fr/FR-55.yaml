  - version: 2
    date: '2026-11-03'
    change: basis_note の仮のスタブと差し替えの記述を、Stripe のテスト環境に直した（機能と受け入れ基準は変えない）
    reason: 設計の連鎖が返した課題（古い記述（仮のスタブ））への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-4）
