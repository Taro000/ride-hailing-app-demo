interface:
  - "画面: ドライバーの Web アプリ（依頼の内容）"
acceptance_criteria:
  - ドライバーが許諾すると、依頼をそのドライバーに割り当て、ほかのドライバーの一覧から消し、乗客に知らせる（FR-06）。ドライバーの画面は迎車中に変わる。
  - 同じ依頼を二人のドライバーがほぼ同時に許諾したとき、一人だけに割り当て、もう一人にはほかのドライバーが許諾したことを示す。
  - 乗客が取り消した依頼を許諾しようとしたとき、割り当てずその旨を示す。
  - 迎車中または乗車中のドライバーが新しい依頼を許諾しようとしたとき、受け付けずその旨を示す。
quality_hints:
