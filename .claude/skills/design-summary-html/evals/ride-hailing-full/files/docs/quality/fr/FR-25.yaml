id: FR-25
title: 乗車場所への到着
status: draft
version: 2
basis: inferred
basis_note: 到着の出来事は KPI-01〜03 の測定量の境目で、CUJ-07 の手順の前にある。ドライバーが知らせる方式は推定。位置を確かめることは FRP-10、確かめられないときに受け付けて印を付けることは質問 18。D_arrival は要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー]
statement: システムは、ドライバーが乗車場所への到着を知らせると、現在地が乗る場所から D_arrival 以内であることを確かめ、その時刻と位置を記録して乗客に知らせる。
origin: cuj-step
cuj: CUJ-07
cuj_step: 依頼主かどうかを確認する
traces_to: [QIU-01, QIU-04, QIU-13, QIU-15, KPI-01, KPI-02, KPI-03]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（迎車中）"
acceptance_criteria:
  - ドライバーが乗車場所への到着を知らせたとき、現在地が乗る場所から D_arrival 以内なら、時刻と位置を記録し、乗客に知らせる（FR-06）。
  - 現在地が乗る場所から D_arrival より離れているとき、到着を受け付けず、乗車場所に近づくよう示す。
  - 現在地を得られないとき、または現在地の誤差が D_arrival より大きく距離を確かめられないとき、到着を受け付けて乗客に知らせ、「位置を確かめられなかった」という印を付けて記録する。
  - 取り消された依頼について到着を知らせようとしたとき、受け付けずその旨を示す。
quality_hints:
  - 有効性 (QIU-01) - 迎車が乗車場所に着いたことが、乗客にすぐ届く
