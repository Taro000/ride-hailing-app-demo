id: FR-32
title: ドライバーの受取額の表示
status: draft
version: 3
basis: inferred
basis_note: 振り込みを境界の外に置き、受取額と決済の状態を示すところまでにすることは質問 4 で確認済み。受取額が手数料を引いた額であることは第 1 段階の QIU-12 の測定量から。手数料がアプリ手配料（100 円）であること、キャンセル料と不在の料金（500 円）がそのままドライバーの受取額に入ることは第 2 段階の質問 14〜17（2026-11-01）
needs_agreement: false
approver_candidates: []
statement: システムは、乗車ごとに運賃から手数料（アプリ手配料）を引いたドライバーの受取額と、キャンセル料と不在の料金の受取額を、決済の状態とともに記録し、ドライバーに示す。
origin: cuj-step
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-12, QIU-16]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（受取額）"
acceptance_criteria:
  - 乗車が終わると、その乗車の運賃、手数料（アプリ手配料）、受取額、決済の状態（完了・未払い）をドライバーの画面に加える（受取額は QIU-12 の分子に使う）。
  - 許諾していた依頼が乗客に取り消されてキャンセル料を請求したとき（FR-07）、または不在で終えたとき（FR-27）、その額を受取額としてドライバーの画面に加える。迎車が遅れていてキャンセル料を請求しなかった取り消しは加えない。
  - 未払いが解消されると（FR-31）、決済の状態を完了に変える。
quality_hints:
  - 有効性 (QIU-16) - 運んだ乗車ごとに、受取額と決済の状態をドライバーが確かめられる
