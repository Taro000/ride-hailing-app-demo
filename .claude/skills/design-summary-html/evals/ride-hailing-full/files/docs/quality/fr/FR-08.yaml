id: FR-08
title: 許諾されないときの案内
status: draft
version: 2
basis: inferred
basis_note: QIU-01・QIU-11 から導いた。しきい値を下げて探し続けられることは推定。T_match_wait は要合意。手配から T_request_max を過ぎても許諾がない依頼をシステムが取り消すことは 2026-11-03 の回答（設計 2-7）で確認済み。T_request_max は仮に 30 分（T_match_wait より長い。要合意）。許諾したドライバーが取り消して探し直している依頼にも、手配からの時間で当てはめることは第 2 段階の質問 22 で確認済み。許諾の後に誰も終えない依頼は扱わない（設計の DEC-37 の、閉じる前の確かめのまま）
needs_agreement: true
approver_candidates: [プロダクトオーナー]
statement: システムは、手配から T_match_wait が過ぎても許諾されないとき、乗客に知らせて待ち続けるか取り消すかを選べるようにし、しきい値を設定している乗客には、しきい値で相手が絞られていることを示して、しきい値を下げて探し続けられるようにする。手配から T_request_max が過ぎても許諾されない依頼は、システムが取り消す。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-11]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配の状況）"
acceptance_criteria:
  - 手配から T_match_wait が過ぎても許諾がないとき、その旨を示し、「待ち続ける」と「取り消す」を選べるようにする。
  - しきい値を設定している乗客には、しきい値でドライバーが絞られていることを示し、しきい値を下げて同じ依頼のまま探し続けられるようにする。
  - しきい値を下げたとき、変更後のしきい値と変えた時刻を依頼に記録する（QIU-01 と QIU-11 の数え分けに使う）。
  - 「取り消す」を選ぶと、FR-07 と同じく依頼を取り消す。
  - 手配から T_request_max を過ぎても許諾がない依頼（許諾したドライバーが取り消して探し直している依頼を含む）は、乗客が待ち続けることを選んでいても、システムが取り消す。押さえた額をすべて解放し、キャンセル料はかけず、乗客に知らせる。取り消したのはシステムと記録する（FR-39）。
quality_hints:
  - 利用状況完全性 (QIU-11) - しきい値を設定した乗客の配車の成立率が、設定していない乗客より G_threshold_gap を超えて下がらない
  - 有効性 (QIU-01) - 誰も許諾しない依頼が、探している状態のまま残らない
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
  - version: 2
    date: '2026-11-03'
    change: 手配から T_request_max を過ぎても許諾がない依頼を、システムが取り消す受け入れ基準を足した（押さえた額をすべて解放し、キャンセル料はかけず、乗客に知らせ、取り消したのはシステムと記録する）
    reason: 設計の連鎖が返した課題（誰も終えない依頼）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-7）。今の FR-08 では依頼の状態に出口がなかった
