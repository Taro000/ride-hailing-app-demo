id: FR-05
title: 配車の手配
status: draft
version: 3
basis: inferred
basis_note: 手順は入力。手配時に額を押さえて降車時に請求すること、未払いの乗客の手配を受け付けないことは質問 9 で確認済み。進行中の依頼があるときの扱いと二重の確定への対処は推定。押さえの結果が分からないときの扱いは 2026-11-03 の回答（設計 2-1・3-3。設計の DEC-52 に、設計の指摘 FND-31 の勧めを合わせた形）で確認済み。T_hold_wait の値は設計が決める（今は DEC-52 の 60 秒）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
statement: システムは、乗客が手配を確定すると、確定した料金を乗客の支払い手段で支払えることを決済の外部サービスに確かめてその額を押さえ、配車依頼を作ってドライバーに示す。押さえの結果が分からないときは、T_hold_wait まで確かめてから、依頼を示すか手配をやめる。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-08, QIU-16, KPI-01]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 乗客が手配を確定すると、確定した料金の額を決済のサービスで押さえ、確定した料金、示した到着予定時刻、その時点のしきい値を持つ配車依頼を作り、乗客の画面を「ドライバーを探しています」にする。
  - 支払い手段が登録されていないとき、依頼を作らず、登録を求める。
  - 決済のサービスが額を押さえられないとき（残高不足、カードの停止など）、依頼を作らず、理由と、別の支払い手段を選ぶ手段を示す。
  - 押さえの結果が分からない（決済のサービスが答えない）とき、依頼をドライバーに示さず「確かめています」と示し、乗客が取り消せるようにする。T_hold_wait までに押さえたと分かれば、依頼をドライバーに示す。分からないまま T_hold_wait を過ぎるか乗客が取り消したら、手配をやめたと示し、押さえが残っていれば解放する。解放したか押さえがないと分かるまでは「押さえが残っていれば解放します」と示す。「押さえていない」と示すのは、決済のサービスが答えたときだけにする。
  - 進行中の依頼がある乗客、または未払いの乗車がある乗客（FR-31）が手配しようとしたとき、依頼を作らず理由を示す。
  - 確定の操作が二度届いても、依頼は一つだけ作り、額も一度だけ押さえる。
quality_hints:
  - 有効性 (QIU-01) - 混雑時にも手配の確定が失敗しない
  - 有効性 (QIU-08) - 二重の依頼や二重の押さえが起きない
  - 有効性 (QIU-08) - 押さえの結果が分からないときも、押さえが残りうるのに「押さえていない」と示さず、押さえを残したまま手配をやめない
