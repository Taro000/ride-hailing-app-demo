characteristic: portability > adaptability
statement: 乗客とドライバーの Web アプリは、対象とするスマートフォンのブラウザ（iOS の Safari）で、位置情報の取得、音での知らせ、前面と裏の切り替え、画面を消さない扱い（FR-52）を含めて動く。
applies_to: [FR-02, FR-06, FR-10, FR-17, FR-18, FR-21, FR-24, FR-52]
