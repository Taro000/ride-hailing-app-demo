id: QR-42
title: 対象のブラウザで動く
status: draft
version: 3
basis: inferred
basis_note: 対象のブラウザは質問 8 で確認済みだったが、設計の第 1 段階の質問 10 で iOS の Safari だけにした（2026-11-03 の回答、設計 1-3）。Android の Chrome は対象外のブラウザとして扱う（第 4 段階の NFR-21）。点は推定。対象が一つでも、そのブラウザの制約で動かない起こりやすさは同じと見て点を変えないことは第 3 段階の質問 21 で確認済み
needs_agreement: true
