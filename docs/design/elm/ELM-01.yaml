id: ELM-01
title: 乗客とドライバーの Web アプリ
status: active
basis: inferred
basis_note: Web アプリで iOS の Safari だけを対象にすることは TC-13（入力）。参加者がアプリを画面に出したままにすることは設計の第 1 段階の質問 2 の答え（QCR-02）に従う。ドライバーが受付をしている間も出したままにすること（TC-18、QCR-03）は質問 2 で、対応する iOS の版は質問 1 で確認済み。ホーム画面に加えた Web アプリの振る舞いは DAS-03 によるもので、質問 6 で確認済み（仮定のまま進め、実機での振る舞いは開発の中と NFR-15 の受け入れの試験で確かめる）。受け持つ機能の割り当ては推定
premises: [TC-13, TC-18, CON-05, DAS-03, QCR-02, QCR-03]
kind: component
name: 乗客とドライバーの Web アプリ
responsibility: 乗客とドライバーの画面を示し、利用者の操作を冪等キーとたどる ID とともに配車サーバーに送り、サーバーからの流れと Web Push で変化を示す。画面に出ている間は画面を消さずに保ち、端末が測った位置と速さを送る。カードの情報は EXT-01 の入力部品で直接 EXT-01 に渡し、地図は EXT-02 で描く。端末で起きたエラーと、相手の変化を示した時刻を、つながっていない間はためて送る。使える機能、額、状態、評価は決めず、サーバーが送ったものを示す
