changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 責務に経路と Turso の呼び出しの上限、流れの本数の上限、座標の表を読む相手の確かめを足し、DEC-33・34・37 を加えた
