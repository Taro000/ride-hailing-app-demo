name: サーバー
responsibility: API（認証と役割、配車の状態遷移、料金と到着予定、お金の操作、位置、評価、設定、苦情、管理）、SSE の配信（状態の履歴と受付の記録の追いかけ、相手の位置と到着予定の今の値。DEC-03）、時刻の見回り（T_request_max でのシステムの取り消し、T_hold_wait までの押さえの確かめを含む。DEC-04）、知らせ（送ってから記録を書く。DEC-17）、Web アプリの静的なファイルの配布、構造化ログ。SSE 以外の経路ごとの上限（乗車の終了と降車場所の変更の確定は 20 秒）と Turso の呼び出しの上限（DEC-33）、流れの本数の上限（DEC-21）、ログインと設定の符号の回数の制限とログインの停止（アカウントと IP の組。DEC-20、DEC-21）、座標の表を読む相手の確かめ（位置のモジュール。DEC-15）。SLO のアラートの毎分の評価（SLI-01 の 1 分ごとの数、SLI-03 の毎分の確かめ。後から届いた裏の記録で除き直す。DEC-35）
