  change: 責務に SLO のアラートの毎分の評価を足し、DEC-35 を加えた
  reason: DEC-35 の作り直し（第 1 段階の質問 13、第 2 段階の質問 18。第 2 段階の再実行、2 回目）
- version: 4
  date: '2026-11-03'
  change: 責務に、配信の出どころ（受付の記録、相手の位置と到着予定の今の値）、知らせを送ってから記録を書くこと、経路ごとの上限、流れの優先、地図の取り置き、ログインの停止の単位、裏の記録での除き直しを足した。依存に ELM-05（突き合わせの結果を読む。第 3 段階の IFC-10、DEC-53）を足した
  reason: FND-20、21、23、24、28、44 を受け入れた（第 2 段階の再実行、3 回目）。質問 22 の回答
- version: 5
  date: '2026-11-03'
  change: 時刻の見回りに T_request_max でのシステムの取り消しと T_hold_wait までの押さえの確かめを書いた。流れの優先と地図の日ごとの数えと取り置きを外し、設定の符号の回数の制限を足した
  reason: 品質チェーンの再実行（FR-05 版 3、FR-08 版 2、FR-12 版 4、FR-01 版 3）と DEC-04 版 3、DEC-21 版 5、DEC-22 版 3 に追随した（第 2 段階の再実行、4 回目）
