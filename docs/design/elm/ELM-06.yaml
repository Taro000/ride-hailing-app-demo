name: 配備の仕組み
responsibility: ゲートを通ったイメージを作る。データベースの資格情報を持たず、データベースに触れる段（構造の変更、配備の記録、閉じる前と終える前の数え、Turso が答えるかの確かめ）は、運用のジョブ（ELM-05）を鍵を置かない連携で動かして終わりの符号を読む（DEC-34）。デモの期間を始めるときに Turso が答えるかを確かめ、ジョブと定時の起動と規則を有効にし、定時の起動を通して一度動かす。デモを開くときに構造の変更を当て、サービスと二つのジョブを同じイメージで配備し、閉じるときは終わっていない依頼と確かめ中がないと確かめてから消す（最後の回なら印を残す）。戻しは前のイメージをサービスと二つのジョブに配備する。配備の記録を運用のジョブで残す。期間はふだん毎日の処理が終える（DEC-37）ので、期間を終える手順は強いて終えるときと、毎日の処理が止められなかったときに使う。システムを終えるときに、ジョブ二つ、定時の起動、規則、秘密、地図の鍵を消す（DEC-36）
