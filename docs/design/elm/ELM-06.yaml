responsibility: ゲートを通ったイメージを作る。デモの期間を始めるときに Turso が答えるかを確かめ、ジョブと定時の起動と規則を有効にし、定時の起動を通して一度動かす。期間を終えるときは確かめ中などが 0 件のときだけ止める（DEC-37）。デモを開くときに構造の変更を当て、サービスとジョブを同じイメージで配備し、閉じるときは終わっていない依頼と確かめ中がないと確かめてから消す。戻しは前のイメージをサービスとジョブに配備する。配備の記録に両方の版を残す。システムを終えるときに、ジョブ、定時の起動、規則、秘密、地図の鍵を消す（DEC-36）
