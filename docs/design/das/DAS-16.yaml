id: DAS-16
title: ELM-02 の呼び出しのタイムアウトと、答えのない操作の送り直し、持つ長さと数を暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-01 は、ELM-03 の操作（IFC-01、IFC-10、IFC-12、IFC-14）の答えを 15 秒待ち、答えのない状態を変える操作を 1 秒、2 秒、4 秒置いて 3 回まで自動で送り直し、409 OPERATION_IN_PROGRESS の後の送り直しを 20 回までにし、答えのない操作をタブの保存に最初に送ってから 23 時間まで、メモリに 50、タブの保存に 20 まで持つ。値は MOD-01 の parameters にある。15 秒は、ELM-03 がこれらの操作に答える期限（HND-19 で MOD-20 が決めた 5 秒）と通信の余裕 5 秒の和より長い
why_unsure: どの値も測っておらず（何も配備しない、TC-09）、ELM-03 がこれらの操作に答える期限も暫定の値（DAS-17）。担当者とエンジニアのコンピューターのつながりがどれだけ切れるかも入力にない
breadth: medium
severity: low
rating_note: MOD-01 と、ELM-03 の答えの期限を決めた MOD-20 が依存する。第 4 段階の ELM-03 の実行は HND-19 で、これらの操作に答える期限を 5 秒（外部を呼ばない操作、MOD-20）に決め、15 秒はそれと通信の余裕 5 秒の和より長い。返金の呼び出しの 15 秒（IFC-13）と流れの値（IFC-11）は第 3 段階のもので、この仮定に入らない。値を変えても、同じ冪等キーで送り直す決まりと操作の定まり方は変わらず、運用の中で直せる。時間のしきい値の SLO の道になく、利用者は送っていることを見て待つ
