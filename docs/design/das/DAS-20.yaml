id: DAS-20
title: 日々の処理の時間の上限、呼び出しの期限と再試行、終えた記録を待つ時間、一覧の 1 ページと一つの取引の行の数を暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-32 は日々の処理の時間の上限（取った実行を止まったとみなすまで）を 20 分とし、Cloud Scheduler とローカルの定期の呼び出しは期限を 25 分、失敗したら 5 回まで、5 分から倍にして 15 分まで間を置いて呼び直す。想定の本番のアラートは、予定の時刻（04:00）から 90 分のうちに終えた記録が届かなければ知らせる。MOD-44 は EXT-01 の一覧を 1 ページ 100 件で読み、MOD-68 は一つの取引で 200 行まで変えるか消す。値は MOD-32、MOD-44、MOD-68 の parameters にある
why_unsure: 日々の処理がかかる時間（EXT-01 の一覧の読み出し、結果が分からない試みの確かめ、記録の変換）は測っておらず、デモの量（OPF-02、OPF-03）から数分のうちと見込んだ
breadth: medium
severity: low
rating_note: MOD-32、MOD-44、MOD-68 が依存する。上限が短すぎると動いている実行を取り直すが、取り直された実行は書けずに止まり（DAT-27）、どの仕事も繰り返しても同じ結果になるので、害は同じものを二度読むことだけ。待つ時間が短すぎると長引いただけで知らせる。どれも運用の中で直せる
