id: DAS-10
title: EXT-01 への呼び出しのタイムアウト、同じキーでのやり直し、待ち、確かめの間隔を暫定に採る
status: open
stage: 3
kind: decision
statement: IFC-17 の timing のとおり、EXT-01 への一回の呼び出しのタイムアウト、利用者が待つ試みの同じキーでの一回のやり直しとその前の間、最初に送ってからの待ち、結果が分からない試みを確かめる間隔（処理されなかった押さえの解除と料金の請求の新しい試みも同じ間隔で、取引の ID が分かっている確定と取り消しを、取引が変わっていなければ処理されなかったとするのはその最初の確かめから）と、NFR-07 の予算の EXT-01 の押さえのホップ（DEC-46）を暫定に採り、EXT-01 のテスト環境の実際の応答の時間が分かるまで使う。値は IFC-17 と DEC-46 にある
why_unsure: EXT-01 のテスト環境が押さえ、確定、取り消し、返金、登録の読み出しにどれだけの時間で答えるかは入力になく（HND-01、QR-24 の basis_note）、測ってもいない。Stripe の文書は、キーを少なくとも 24 時間持つこと、ネットワークの誤りと 409 は同じキーで送り直し、500 は取引を読んで確かめることを書くが、応答の時間の分布は示していない
breadth: medium
severity: low
rating_note: IFC-17 と DEC-46 が依存し、第 4 段階の ELM-03 のお金を動かすモジュールが IFC-17 の値を使う。値が合わなければ結果が分からない試みが増えるか、利用者の待ちが延びるが、運用の中で直せる。確定と取り消しを処理されなかったとする最初の確かめが早すぎても、次の試みが同じ取引に向かう道（ドライバーのやり直し、期限の処理の料金と解除）では、一つの取引は確定か取り消しのどちらか一度だけなので、新しい試みが取引の状態に退けられて読み直しが増えるだけ（DEC-45）。押さえ直しで新しい取引に移る道は、取引が変わらないまま処理されなかったとした確定の要求が後で効きうる間は移らず、その間の拒否は押さえを解いて決めるので（DEC-45、FND-58）、この値によらずお金は二度動かない。最初の確かめが早すぎると、乗客が支払い方法を変えられない場面と、拒否を示す前に押さえを解く場面が増えるだけ。決済の答えの期限が T_payment_response のうちにあることは、EXT-01 の速さによらない
answer: null
