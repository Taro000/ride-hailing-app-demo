id: DAS-18
title: 前もって作る鍵の日数、鍵をメモリに持つ長さ、仮の名の長さを暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-23 は、記録した日ごとの鍵を今日から 2 日先の日まで前もって作り（起動のときと日々の処理で）、読んだ鍵をメモリに 10 分まで持ち（捨てるときはメモリからも消す）、仮の名を 12 文字にする。値は MOD-23 の parameters にある
why_unsure: 秘密の置き場所（想定の本番の Secret Manager、ローカルの鍵のファイル）が答える時間と止まる長さは測っておらず、日々の処理が何日続けて動かないかも分からない
breadth: low
severity: low
rating_note: MOD-23 だけが依存する。前もって作る日数が足りなくても、書くときに鍵がない日は一度だけ作り、名前だけで中身のない鍵もないものとして作る（MOD-23 の判断表 A）ので、作り手が途中で止まっても項目が書けなくなることはない。持つ長さは秘密の置き場所を読む回数との釣り合いで、捨てるときにメモリからも消すため、捨てた鍵では読めない
answer: null
answered_in: null
