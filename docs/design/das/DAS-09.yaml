id: DAS-09
title: 人が行うゲートの確かめと監査は開発者が行う
status: open
stage: 2b
kind: judgment
statement: 人が行うゲートの確かめ（NFR-15 の実機の受け入れ、NFR-32 と NFR-37 の完成の定義の確かめ）と、監査（NFR-16 の回復の訓練、NFR-28 の脆弱性の修正と侵入試験、NFR-48 の運賃表の照合、NFR-50 のアクセシビリティの人による確かめ）は、開発者（TEAM-01）が行う。侵入試験は無償の道具で行う
why_unsure: 品質チェーンは、ゲートの確かめと監査を誰が行うかを述べておらず、NFR-48 の照合をする役割は決まっていないとしている（品質チェーンの未解決の点）。設計の与件の体制は開発者 1 人だけ
breadth: low
severity: low
rating_note: POL-03 だけが依存する。ほかの人が行うなら、その人の確かめを記録する所と、確かめる前に知らせる相手が変わるだけ。監査は、何も配備しない間は設計の第 1 段階の決めたこと 1 のとおり実際には行わない
answer: null
answered_in: null
