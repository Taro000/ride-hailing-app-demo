id: DAS-13
title: 端末が送り直す操作は 24 時間のうちに送られるとみて、冪等キーを 24 時間持つ
status: open
stage: 3
kind: decision
statement: 端末がつながらない間に持つ送り直しの操作（DEC-17）は、最初に送ってから 24 時間のうちに送られるとみて、ELM-03 は冪等キーと最初の答えを 24 時間持つ（DEC-42）
why_unsure: 参加者がつながらないまま操作を持ち続ける長さは入力になく、端末が操作を持つ期間は第 4 段階が ELM-01 で決める
breadth: medium
severity: low
rating_note: DEC-42 が依存し、第 4 段階の ELM-02 の MOD-01 は答えのない操作をタブの保存に持つ長さ（23 時間）をこの 24 時間から決める。24 時間を過ぎて届いた送り直しは新しい操作として扱われるが、依頼の状態を条件にした書き込み（DEC-08）と、お金の操作の試みの数の決まり（DEC-45）が二重に動くことを防ぎ、ELM-02 の返金の操作は MOD-01 が 23 時間で捨てるので 24 時間を過ぎて送られない。値が変われば DEC-42 が変わり、MOD-01 はそれに従って決め直す
answer: null
answered_in: null
