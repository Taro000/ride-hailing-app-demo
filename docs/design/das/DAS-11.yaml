id: DAS-11
title: 端末、通信、自身の処理の時間と、流れ、位置、着く見込みの間隔を暫定に採る
status: open
stage: 3
kind: decision
statement: DEC-46 の予算のホップと期限（ELM-03 の自身の処理、ELM-04 の取引、端末と ELM-03 の間の片道、端末が示すまで、端末のタイムアウトに足す通信の余裕、外部を呼ばない操作の答えの期限）、IFC-11 の流れの生存の確かめ、つなぎ直しの待ち、ほかのインスタンスの出来事を読む間隔、IFC-05 の位置を送る間隔と送る位置の新しさ、IFC-19 の着く見込みを求め直す間隔を暫定に採り、測った値が分かるまで使う。値はそれぞれの項目にある
why_unsure: どの値も測っておらず（何も配備しない、TC-09）、iOS の Safari のホーム画面に加えた Web アプリの流れの保ち方、位置の測り方、モバイルの通信の遅れは、実機で確かめるまで分からない（DAS-03 と同じく、開発の中と NFR-15 の受け入れで確かめる）
breadth: medium
severity: low
rating_note: DEC-46、IFC-05、IFC-11、IFC-19 が依存する。値が合わなければ間隔とタイムアウトを直すだけで、インタフェースの形とデータは変わらない。NFR-07 と NFR-19 の予算には余裕があり、測るゲートは QCR-06 で品質チェーンに求めた
answer: null
answered_in: null
