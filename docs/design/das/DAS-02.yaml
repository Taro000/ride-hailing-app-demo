id: DAS-02
title: デモの回の間は Cloud Run のインスタンスを一つ、回の外は 0 にし、落ちたときの失敗と回を閉じた後の期限の遅れを受け入れる
status: confirmed
stage: 2
kind: decision
statement: 想定の本番では、デモの回の間は Cloud Run のインスタンスを最小も最大も 1 つにし、デモの回の外は 0 にする。その一つのインスタンスが落ちると、プラットフォームが新しいインスタンスを起こすまで、そのとき処理中の操作が失敗することを受け入れ、デモの回の間に二つ目のインスタンスを待たせておくことはしない。回を閉じて 0 にした後に期限が来た処理（回の終わりの近くの依頼の T_no_accept、結果が分からないお金の操作の確かめ）は、次の日々の呼び出しで起きたインスタンスが行い、それまで遅れることを受け入れる。外からの生存確認は回の間だけ動かす
why_unsure: 冗長さにいくら払い、一つの失敗をどこまで受け入れるか、回を閉じた後に期限が来る処理のためにインスタンスを残すかは事業の判断で、DRV-01 と DRV-16 の競合として設計の第 1 段階から第 2 段階に渡されている。入力には費用の額も、Cloud Run と Turso の値段もない
breadth: high
severity: low
rating_note: DEC-05、DEC-18、DEC-20、ELM-08 の四つに、デモの回の間を想定の本番でインスタンスが動いている間として読む第 4 段階の ELM-03 の MOD-49、MOD-66 が加わり、六つの設計の項目が依存するため、影響の広さは高（第 3 段階のレビューの E3。配置のビューと DRV-01 の通し確認も頼る。FND-05 と FND-09 も premises に挙げるが、どちらも指摘で、違っていてもやり直す設計の項目ではない）。高のため、第 3 段階のレビューの質問 2 で尋ね、このままとする答えを受けた。重大さは低のまま。何も配備しない（TC-09）ため費用は実際には生じず、DEC-06 と DEC-18 は二つ以上のインスタンスでも動くので、変えるのは設定だけで済む。回を閉じた後に残る期限は、参加者が回の中で依頼を終えれば生じず、生じても使う人のいない回の外のことで、押さえはテスト環境の上にある（CON-03）。回の外に日々の処理が動かなかったか終えなかったことは、ELM-03 を呼ばずにインスタンスを起こさないプラットフォームのアラート（DEC-20）が知らせるため、この仮定はそれを左右しない（FND-09）
answer: このままとする（下書きどおり。試行の模擬回答）
answered_in: 第 3 段階のレビューの質問 2
