id: DAS-02
title: デモの回の間は Cloud Run のインスタンスを一つだけ置き、それが落ちたときの失敗を受け入れる
status: open
stage: 2
kind: decision
statement: 想定の本番では、デモの回の間は Cloud Run のインスタンスを最小も最大も 1 つにし、デモの回の外は 0 にする。その一つのインスタンスが落ちると、プラットフォームが新しいインスタンスを起こすまで、そのとき処理中の操作が失敗することを受け入れ、デモの回の間に二つ目のインスタンスを待たせておくことはしない
why_unsure: 冗長さにいくら払い、一つの失敗をどこまで受け入れるかは事業の判断で、DRV-01 と DRV-16 の競合として設計の第 1 段階から第 2 段階に渡されている。入力には費用の額も、Cloud Run と Turso の値段もない
breadth: medium
severity: low
rating_note: DEC-05、ELM-08、配置のビュー、DRV-01 の通し確認が依存する。何も配備しない（TC-09）ため費用は実際には生じず、DEC-06 と DEC-18 は二つ以上のインスタンスでも動くので、変えるのは設定だけで済む
answer: null
answered_in: null
