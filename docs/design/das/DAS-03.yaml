id: DAS-03
title: ホーム画面に加えた Web アプリは画面に出ている間だけ位置を測って送れ、出ていない間は Web Push の知らせだけが届く
status: open
stage: 2
kind: judgment
statement: iOS 18.4 以降の Safari でホーム画面に加えた Web アプリは、画面に出ていて画面を消さずに保っている間は、位置を測り続け、サーバーとの流れを開いたまま保てる。ほかのアプリを開いているか画面を消している間は、位置の測定もページの処理も止まり、Web Push の知らせだけが届く。画面を消さない仕組みと Web Push と位置は、参加者が許せば動く
why_unsure: Web Push（iOS 16.4 から）と画面を消さない仕組み（Safari 18.4 から）はホーム画面に加えた Web アプリについて Apple と WebKit の公開の記述で確かめたが、前に出ていない間に位置と処理が止まることの Apple の公式の記述はなく（設計の第 1 段階）、この段階は実機で確かめていない
breadth: medium
severity: medium
rating_note: DEC-02、DEC-07、DEC-21、ELM-01 が依存する。違っていれば参加者への案内か位置の送り方を直すが、要素と構造は変わらない。実機での振る舞いは、NFR-15 の更新ごとの受け入れの試験（第 2b 段階が置く）でも確かめる。対応する iOS の版は質問 1 を待つ
answer: null
answered_in: null
