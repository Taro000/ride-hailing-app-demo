id: DAS-06
title: EXT-01 のテスト環境で、後で確定する押さえ、一部の確定、取り消し、返金を円で使える
status: open
stage: 2
kind: judgment
statement: このシステムが使う Stripe のテスト環境のアカウント（日本の使い手で、円で払うものとみる）で、カードの支払いを押さえて後で確定する取引（PaymentIntent の手動の確定）、押さえた額より少ない額の確定、押さえの取り消し、確定した額への一部と複数の返金、冪等キーが使え、テスト用のカードは押さえと確定に追加の本人の確かめを求めない
why_unsure: Stripe の機能は使い手の国、料金の種類、カードの種類で使えるかが変わり（押さえた額を上げる仕組みは日本の使い手の円の取引で使えない）、開発者のアカウントの国と設定は入力にない
breadth: medium
severity: medium
rating_note: DEC-09 と ELM-05 が依存する。違っていれば押さえと料金の請求の形を作り直すが、DEC-10 の記録とキーの決まりは変わらない
answer: null
