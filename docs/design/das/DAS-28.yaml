id: DAS-28
title: 異常を見つけて知らせる間隔とまとめ方の値を暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-67 は、たどる記録と境界の出来事を 30 秒ごとに読んで異常を見つけ（答えのない要求は経路の答えの期限から 1 分を過ぎたら異常にする）、SLO のアラートの条件を 1 分ごとに当て、同じまとめの鍵の異常が 10 分のうちに続けば一つにまとめ、続く間は 10 分に一度だけ知らせ直し、結果が分からないお金の試みが最初に送ってから 10 分を過ぎても分からなければ異常にする。値は MOD-67 の parameters にある
why_unsure: 異常の起き方とデモの回の間の記録の量は測っておらず、知らせが多すぎるか少なすぎるかは運用で分かる
breadth: low
severity: low
rating_note: MOD-67 だけが依存する。読む間隔 30 秒と知らせの送り（流れと Web Push）は T_alert_delay（5 分）に十分に収まり（報告の「設計上の値」）、まとめ方と知らせ直しの間を変えても、どの異常も一覧に残る（DAT-22）。運用の中で直せる
answer: null
answered_in: null
