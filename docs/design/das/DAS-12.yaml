id: DAS-12
title: 日々の処理の時刻と照合で読む期間、期限の来た処理を拾う間隔を暫定に採る
status: open
stage: 3
kind: decision
statement: 日々の処理を毎日 04:00（Asia/Tokyo）に起こし、照合は EXT-01 の取引と返金のうち 2 日前の 00:00 から当日の 00:00 までに作られたものを読み、処理を行った日の照合の値はその 2 日後の実行で決める（IFC-15）。期限の来た処理は 5 秒ごとに拾う（DEC-46）
why_unsure: デモの回の時刻（OPF-01 は回の長さと数だけを述べる）と、EXT-01 の一覧の読み出しの速さは入力になく、時刻と期間は SLI-12 の突き合わせの時点（QAS-32）に照らして推定した。拾う間隔は、ELM-04 を読む回数と知らせの遅れの釣り合いから選んだ
breadth: medium
severity: low
rating_note: IFC-15、DAT-13、DEC-46 が依存する。時刻と期間を変えても照合と日々の処理の中身は変わらず、Cloud Scheduler とローカルの定期の呼び出しの設定を直すだけ。デモの回が 04:00 にかかるなら時刻をずらす
answer: null
answered_in: null
