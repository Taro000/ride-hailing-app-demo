id: DAS-22
title: サインインに続けて失敗したときに止める回数と時間、セッションの長さ、設定の符号の有効期間と形、パスワードの長さを暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-36 は、続けて 5 回サインインに失敗したアカウントを 15 分止め、セッションを最後に使ってから 14 日（延ばすのは 1 時間に一度まで）、作ってから 30 日まで使わせ、設定の符号を Crockford の Base32 の 12 文字にして 72 時間有効にし、パスワードを 12 文字から 128 文字までとする。値は MOD-36 の parameters にある
why_unsure: 入力は止める回数と時間とセッションの長さを与えず（QR-10、DEC-14）、参加者がデモの回をまたいでサインインし直すことをどれだけ嫌うかも分からない。サインインの ID を推し量られる危険と、使いやすさの釣り合いから選んだ
breadth: low
severity: medium
rating_note: MOD-36 だけが依存する。緩すぎると、なくした端末や推し量りでアカウントが使われる時間が延び、乗車の履歴や位置に届きうるので重大さは中。値を変えても仕組みは変わらず、運用の中で直せる。止める回数と時間の境目は NFR-27 のテスト（MOD-36 の verification）が確かめる
answer: null
