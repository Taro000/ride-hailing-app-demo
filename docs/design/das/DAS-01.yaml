id: DAS-01
title: 開発者は自分で選んだ技術を使いこなし、決済、地図、iOS の Safari の位置情報の経験は見込まない
status: open
stage: 1
kind: judgment
statement: 開発者 1 人（PC-03）は、自分で選んだ TypeScript、React、Hono を使いこなす。Stripe の押さえと請求、Google Maps Platform、iOS の Safari の位置情報と知らせを使った経験は見込まない。
why_unsure: 設計の与件は人数（1 人）を述べ、その人が使いこなす技術を述べていない。選んだ技術を知っていることは、それを技術制約に挙げたことからの推し量りで、外部のサービスと iOS の Safari の経験は入力から分からない。
breadth: medium
severity: low
rating_note: PC-03 と DRV-16 が依存する。違っていれば DRV-16 の難しさの理由が変わるが、DRV-07、DRV-03、DRV-04 はほかの理由で難しさが高く、順位と主な線は変わらない
