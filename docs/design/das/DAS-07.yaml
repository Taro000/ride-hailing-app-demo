rating_note: POL-01、DEC-28、DEC-29、DEC-33 が依存する。違っていれば学ぶ時間が延びるが、納期はなく（PC-02）、どのライブラリを替えても、コンポーネントの種類ごとの組み合わせ、コードの分け方と依存の規則（POL-02）、テストの層（POL-03）は変わらない
