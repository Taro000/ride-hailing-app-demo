id: DAS-05
title: エンジニアは異常の知らせを Web アプリへの Web Push とその一覧で受け、想定の本番のプラットフォームからの知らせはメールで受ける
status: open
stage: 2
kind: judgment
statement: エンジニアへの異常の知らせ（FR-33）は、担当者とエンジニアの Web アプリに Web Push で届け、その Web アプリの一覧に残す。デモの回の間、エンジニアはその Web アプリをコンピューターで開いている。想定の本番では、デモの回の間にサーバーそのものが止まったことは外からの生存確認が、回を問わず日々の処理が動かなかったか終えなかったことはプラットフォームのアラートが、メールで開発者に知らせ、開発者はそのメールをデモの回の外も受ける
why_unsure: 誰がどの端末と手段で知らせを受けるかは運用のやり方で、入力にない（デモの回の間に知らせを受けて対応する体制は、設計の第 1 段階が範囲外とした）
breadth: medium
severity: low
rating_note: DEC-20 と、第 4 段階の ELM-03 の MOD-67 の二つが依存するため、影響の広さは中（第 3 段階のレビューの E3）。メールやチャットでも受けたいときや、回の外にメールのほかで受けたいときは、知らせる先を一つ足すだけで済む。回の外に日々の処理が動かなかったか終えなかったことを知らせる道はこのメールだけだが、この仮定が置くのは知らせを受ける手段で、知らせを受けて対応する体制は範囲外の運用の決まり（ソフトウェアは知らせることまでを受け持つ）のため、重大さは低
answer: null
answered_in: null
