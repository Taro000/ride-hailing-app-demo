id: DAS-19
title: 期限の来た処理を取る長さ、一度に取る数、失敗の後の間を暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-31 は、取った処理を 60 秒取ったままにし（その間に終わらなければほかのインスタンスが取り直せる）、一回に 20 まで取り、受け持ちが失敗した処理は 30 秒置いてやり直し、続けて失敗すると 10 分まで倍にして延ばす。拾う間隔の 5 秒は DEC-46 のもの。値は MOD-31 の parameters にある
why_unsure: 受け持ちの最悪の時間（EXT-01 の一回の呼び出し 4 秒、Web Push を送る呼び出しの最悪 11 秒）より長く、止まったインスタンスの処理を待たせすぎない値を選んだが、どれも測っていない
breadth: low
severity: low
rating_note: MOD-31 だけが依存する。取る長さが短すぎると二つのインスタンスが同じ処理を行うが、どの受け持ちも今の状態を条件に書き、お金の試みは一意の決まりと同じキーで二重にならない（MOD-42）ので、害は呼び出しが一つ増えることだけ
answer: null
answered_in: null
