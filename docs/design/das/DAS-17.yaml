id: DAS-17
title: ELM-03 が答える期限、入口の回数の限り、外からの生存確認の値を暫定に採る
status: open
stage: 4
kind: decision
statement: MOD-20 は、時間のしきい値の SLO とお金の道にない外部を呼ばない操作に 5 秒、EXT-02 を呼ぶ操作に 8 秒、生存確認に 1 秒のうちに答え、本人の確かめなしで受ける操作の回数を送り元ごとに限り、数える送り元をインスタンスごとに 10000 までにする（超えたら古いものから消す）。想定の本番の外からの生存確認は 1 分ごと、タイムアウト 10 秒で、2 分続けて失敗したら知らせる。値は MOD-20 の parameters にある
why_unsure: ELM-03 の自身の処理、ELM-04 の取引、パスワードの照らし合わせ、担当者の検索で読み解く時間、EXT-02 の答えの時間はどれも測っておらず（何も配備しない、TC-09）、入口に来る要求の数も入力にない
breadth: medium
severity: low
rating_note: MOD-20 が持ち、ELM-02 の MOD-01 のタイムアウト 15 秒（DAS-16）と ELM-01 の呼び出しのタイムアウト（HND-17）がこの期限に合わせて決まる。期限を変えても、期限を過ぎたときの答え方（503 SERVICE_UNAVAILABLE と同じキーの送り直し）と答えの形は変わらず、運用の中で直せる。ELM-02 の 15 秒は、外部を呼ばない操作の期限が 10 秒より短い間は保たれる
