id: POL-03
title: テストの層、偽物、環境と、品質チェーンのゲートの出どころと監査の置き場所
status: active
basis: assumed
basis_note: テストに Vitest を使うこと（TC-06）、試すことをローカルだけで完結させること（TC-09）、決済は Stripe のテスト環境（TC-10）、地図は Google Maps Platform（TC-12）、乗客とドライバーは iOS の Safari（TC-13）、参加者が実在の人で位置も本物であること（CON-06）、デモの参加者と配車の量（OPF-02、OPF-03）は入力。外部のシステム、時計、端末とのつながり、端末の位置と速さを試験で失敗まで差し替えること（DRV-33）と、外部のシステムをそれぞれのつなぎ口の後ろに置くこと（DEC-09〜DEC-13、DEC-21）は入力。ホーム画面に加えた Web アプリの振る舞いを開発の中と NFR-15 の受け入れの試験で実機で確かめることは設計の第 2 段階の質問 6 の答え（DAS-03）。監査を想定の本番の要求として設計し、実際には行わないことは設計の第 1 段階の決めたこと 1。層、偽物、環境、ゲートの出どころ、監査の置き場所は推定。開発者のマシンとテストに使う iPhone とそれに入れる iOS のベータ版は DAS-08、人が行う確かめと監査を開発者が行うことは DAS-09 による仮定。NFR-16 を置く場面は、その頻度の QAS-28（品質チェーンの未確認の仮定）による。Vitest 4 の Browser Mode が Playwright の WebKit で動くこと、Stripe がアカウントごとに最大 5 のサンドボックスを作れてそれぞれのデータが分かれ、ローカルの開発と CI に別のサンドボックスを勧めること、Apple が主な版の公開の前に、ふつう最後のベータ版として公開の候補の版を出すこと、Trivy がコンテナのイメージのもとの OS の部品の脆弱性を調べること、Node.js の公開のリリースの一覧が版ごとにセキュリティのリリースかを示すことは、公開の情報で確かめた（報告の「入力」）。試験の環境でブラウザの側の偽物を ELM-03 から読む値で選ぶこと（DEC-34）は FND-12、試験の環境と開発者のマシンがローカルの本番と別の外部のアカウントを使い、NFR-47 のための写しを試験の環境にだけ置くことは FND-13、NFR-15 の出どころを更新の公開の前の版でも確かめることは FND-15、EXT-01 の偽物の支払い方法の登録は FND-16、NFR-28 の置き場所のイメージの調べは FND-17、負荷の層の規則が OPF-02 と OPF-03 を ID で引くことは FND-18 を受けて変えた
premises: [TC-06, TC-09, TC-10, TC-12, TC-13, CON-06, EXT-01, EXT-02, OPF-02, OPF-03, DAS-03, DAS-08, DAS-09, QAS-28]
scope: testing
addresses: [DRV-33, DRV-12, DRV-13, DRV-02, DRV-07, DRV-14, DRV-22, DRV-24, DRV-27, QR-14]
decisions: [DEC-02, DEC-06, DEC-08, DEC-09, DEC-10, DEC-11, DEC-12, DEC-13, DEC-15, DEC-18, DEC-20, DEC-21, DEC-22, DEC-24, DEC-25, DEC-26, DEC-32, DEC-34]
rules:
  - rule: 受け入れ基準とゲートの確かめは、それを確かめられる最も下の層で確かめる。時刻、ID、外部のシステム、端末とのつながり、位置と速さに頼るものは、下の偽物で起こす
    check: 開発者が変更を main に入れる前に見るレビューで、第 4 段階のモジュールの確かめ方と照らす
  - rule: 偽物は、設計が扱うどの結果も起こせるようにする（受け付けない、理由つきの拒否、答えない、遅れて答える、答えなかった試みを読み直すと済んでいたと見せる、同じ冪等キーに一度目の結果を返す）。EXT-01 と EXT-02 の偽物は、つなぎ口の契約の層のテストで本物と照らし続ける
    check: 契約の層のテスト（リリースの手順）と、偽物を変える変更を開発者が main に入れる前に見るレビュー
  - rule: テストデータは、テストの中の作り手と、作り物の参加者と場所を入れる種の台本で作る。ローカルの本番（ELM-10）のデータは、実在の参加者の個人の情報と本物の位置を持つ（CON-06）ため、テストにも試験の環境にも写さない。本番と同じ形のデータが要るとき（NFR-42）は、作り物のデータを生成する
    check: 試験の環境がローカルの本番と別のデータベースのボリュームを使い、種の台本だけがデータを入れることを、infra/local/ の Compose のファイルを変える変更で開発者が main に入れる前に見るレビューが見る
  - rule: 端から端の層は Playwright の WebKit で iPhone の大きさの画面を使うが、iOS の Safari の代わりにはしない。ホーム画面に加えた ELM-01 だけが示すもの（画面を消さない仕組み、位置、前に出ている間の流れ、Web Push、EXT-01 の入力部品、地図、読み上げ）は、実機の受け入れの層で確かめる（DAS-03）
    check: 実機の受け入れの手順（POL-04 の device-acceptance）の台本の項目
  - rule: 負荷の層は置かない。どのゲートも求めず、デモの参加者と配車の量（OPF-02、OPF-03）は一つのインスタンスで足りる（DEC-05）
    check: null
  - rule: 監査（NFR-16、NFR-28、NFR-48、NFR-50）は、下の置き場所に想定の本番の運用として置き、何も配備しない間は、設計の第 1 段階の決めたこと 1 のとおり実際には行わない。監査を支える道具のうちパイプラインの手順で動くもの（運用の予行の層、依存の部品とイメージの脆弱性の調べ、axe-core）は実際に動く
    check: null
layers:
  - layer: 単体
    covers: 一つのモジュールの規則（判断表、計算、状態の移り変わり、境目の値）と、Web アプリの画面の部品の振る舞い
    replaces: モジュールの外のすべて（ポートの偽物、時計と ID の偽物）。Web アプリの src/platform/ の偽物はテストが渡す
    runs: 検査の手順（check）で、main に入る変更のたび。ELM-03 は Node.js の上の Vitest、ELM-01 と ELM-02 は Vitest の Browser Mode（Playwright の、ELM-01 は WebKit、ELM-02 は Chromium）
  - layer: 結合
    covers: ELM-03 を、その HTTP の境界（経路、流れ、日々の処理の入口）から、マイグレーションを当てた自身の libSQL のデータベースとともに。期限の処理の繰り返しと日々の処理を含む
    replaces: EXT-01、EXT-02、Web Push の配信サービス、時計と ID、端末とのつながり、許諾と取り消しの重なり（下の偽物）
    runs: 検査の手順（check）で、main に入る変更のたび。テストの作業ごとに libSQL のデータベースのファイルを作る
  - layer: 契約
    covers: ELM-03 の EXT-01 のつなぎ口を試験用の Stripe のサンドボックスに（鍵で届くアカウントが試験の環境の設定の名指すものであることを含む、POL-04）、EXT-02 のつなぎ口を本物の Google Maps Platform に照らす（EXT-02 は決めた少ない呼び出しだけ）
    replaces: なし
    runs: リリースの手順（release）で、試験の環境（本物の外部サービスの設定）から
  - layer: 端から端
    covers: CUJ ごとの流れとその失敗の流れを、ELM-01（WebKit の iPhone の大きさの画面）と ELM-02（Chromium）の画面から ELM-03 まで。ゲートが求める場面（NFR-11、NFR-13、NFR-22、NFR-31、NFR-33、NFR-37、NFR-47）を含む
    replaces: 偽物の設定では、EXT-01、EXT-02、Web Push の配信サービスと、Web アプリのブラウザの側の部品（EXT-01 の入力部品、地図を描く部品、Web Push の登録。ELM-03 から読む値で選ぶ、DEC-34）。NFR-47 のテストは本物の外部サービスの設定で、試験用の Stripe のサンドボックスと本物の EXT-01 の入力部品を使う
    runs: リリースの手順（release）で、試験の環境に対して。Vitest のテストから Playwright のブラウザを動かす
  - layer: 運用の予行
    covers: 配備と前の版への戻し（NFR-41）、データの移し（NFR-42）、止めて再開すること（NFR-16）、異常の知らせとたどり（NFR-38）を、本物と同じ手順で
    replaces: EXT-01、EXT-02、Web Push の配信サービス（偽物の設定）
    runs: リリースの手順（release）で、試験の環境に対して。データの移しは、前のリリースからマイグレーションが加わった版で
  - layer: 実機の受け入れ
    covers: iOS の Safari でホーム画面に加えた ELM-01 だけが示すもの（DAS-03 の振る舞い、Web Push、EXT-01 の入力部品、地図、読み上げと拡大）と、配車の手配から決済までの受け入れ（NFR-15）
    replaces: なし
    runs: 実機の受け入れの手順（device-acceptance）で、リリースの手順の中と、対応する iOS と Safari の更新のベータ版か公開の候補の版が出たとき（前もって出る版のない更新は公開されたとき）。開発者が決めた台本どおりに、試験の環境の本物の外部サービスの設定に対して行う
doubles:
  - replaces: ELM-05、EXT-01 の決済サービス（Stripe のテスト環境）
    with: 押さえ、押さえ直し、全額と一部の確定、取り消し、返金、期間の読み出し、支払い方法の登録の取引を作ることとその結果の読み直し（DEC-12）に答え、理由つきで受け付けない、答えない（結果が分からない）、遅れて答える、答えなかった試みや登録を読み直すと済んでいたと見せる、同じ冪等キーに一度目の結果を返す、押さえの期限が切れる、を起こせる偽物
    seam: ELM-03 の payments の機能のポート（DEC-09〜DEC-12 のつなぎ口）。開発者のマシンと試験の環境の偽物の設定で選ぶ。ローカルの本番の設定では選べず、選ぶと起動しない（POL-04）
  - replaces: ELM-06、EXT-02 の地図のサービス（Google Maps Platform）
    with: 場所の候補（同じ名前と似た名前を含む）、住所と位置、道の長さと移動時間に答え、失敗する、答えない、遅れて答える、を起こせる偽物
    seam: ELM-03 の places の機能のポート（DEC-13 のつなぎ口）。開発者のマシンと試験の環境の偽物の設定で選び、ローカルの本番の設定では選べない（POL-04）。ELM-01 の地図を描く部品は、偽物の設定では ELM-03 から読む値（DEC-34）で src/platform/ の地図のない部品に替える
  - replaces: ELM-07、Web Push の配信サービス
    with: 受けた知らせを記録し、受け付ける、宛先がなくなった（404 と 410）、多すぎる（429）、答えない、を返せる HTTP の偽物
    seam: ELM-03 の notifications の機能のポート（DEC-21 のつなぎ口）。試験の環境の偽物の設定では、偽物の HTTP のサーバーに送る
  - replaces: 時計
    with: テストが決めて進める時計。期限の処理の繰り返しは、テストが時計を進めて一回ずつ回す
    seam: 時刻を読むどのモジュールにも渡す時計（ELM-03 と Web アプリの src/platform/）
  - replaces: ID と乱数（冪等キー、たどる ID、確認コード、設定の符号、セッション）
    with: テストが種を決め、出る値を前もって知れる作り手
    seam: ID と乱数を作るどのモジュールにも渡す作り手（ELM-03 と Web アプリの src/platform/）
  - replaces: 端末とのつながり
    with: ELM-03 の HTTP の境界で、書き終えた後の応答を落とす、遅らせる、流れを切って最後の出来事の続きからつなぎ直させる差し込み。Web アプリでは呼び出しと流れの部品の偽物。端から端の層では Playwright でブラウザを切ってつなぎ直す
    seam: ELM-03 の src/http/ の組み立てに、テストのときだけ入れる差し込み。Web アプリの src/platform/ の呼び出しと流れ
  - replaces: 許諾と取り消しの重なり
    with: 依頼の状態を条件つきで書く直前に一つの操作を止め、テストが決めた順に放つ差し込み。何度でも同じ順で重ねる
    seam: ELM-03 の依頼の状態を書くポート（DEC-08）
  - replaces: 端末が測る位置と速さ
    with: 位置、測った時刻、確からしさ、速さ（速さがない場合を含む）を、テストが決めた順に出す偽物
    seam: ELM-03 では要求のデータとして入れる。ELM-01 では src/platform/ の位置の部品（navigator.geolocation を包む）
  - replaces: 画面を消さない仕組み、Web Push の登録、知らせの許し、EXT-01 の入力部品
    with: 許す、断る、使えない、を起こせる偽物。EXT-01 の入力部品の偽物は、ELM-03 が作った登録の取引を確かめたとだけ伝え、登録の結果は ELM-03 が EXT-01 の偽物から読み直す（DEC-12）
    seam: ELM-01 と ELM-02 の src/platform/ の部品。単体の層ではテストが渡し、端から端の層では偽物の設定で ELM-03 から読む値（DEC-34）が選ぶ。偽物は、選んだときだけ読み込む別のファイルにする
  - replaces: 秘密の置き場所（想定の本番の Secret Manager、ローカルの鍵のファイル）
    with: メモリの上の鍵の置き場所（記録した日ごとの鍵を作る、読む、写しとともに捨てる）
    seam: ELM-03 の src/platform/ の鍵の置き場所のポート
  - replaces: 日々の呼び出し（Cloud Scheduler、ローカルの定期の呼び出し）
    with: テストが、定期の呼び出しと同じ形の要求で日々の処理の入口を呼ぶ
    seam: ELM-03 の日々の処理の入口
environments:
  - name: 開発者のマシン
    runs: 開発のときの ELM-01、ELM-02、ELM-03（pnpm dev、POL-01）。ELM-04 は libSQL のデータベースのファイルで、外部のシステムは偽物。設定で、試験の環境と同じ試験用の外部のアカウントと鍵（Stripe のサンドボックス、Google Maps Platform、Web Push）に替えられ、ローカルの本番の外部のアカウントと秘密の値は使わない（POL-04）
    data: 種の台本が入れる作り物の参加者（試験用のアカウント、FR-42）と場所
  - name: 検査の手順の環境
    runs: 検査の手順（check）の単体と結合の層。開発者のマシンの上で git のフックか pnpm check が動かし、コンテナを使わず、秘密の値も外部のアカウントも受けない。ELM-03 のテストは Node.js、Web アプリのテストは Playwright の WebKit と Chromium で動く
    data: テストの中の作り手が、テストごとに作る
  - name: 試験の環境
    runs: リリースの手順（release）の端から端、運用の予行、契約、実機の受け入れの層。開発者のマシンのコンテナで、リリースの手順か pnpm acceptance が立て、終わったら止める。ELM-03 のリリースのイメージ（ELM-01 と ELM-02 のビルドを含む）、Turso と同じ libSQL のサーバー、ローカルの定期の呼び出しを動かし、mkcert の証明書の HTTPS で同じネットワークの iPhone から開ける。試験の環境の名前の設定と、ローカルの本番と別の秘密の値のディレクトリで動く（POL-04）。二つの設定を持ち、偽物の設定は EXT-01、EXT-02、Web Push の配信サービスと Web アプリのブラウザの側の部品に偽物を使い（Web アプリは ELM-03 から読む値で選ぶ、DEC-34）、本物の外部サービスの設定は、ローカルの本番と別の試験用の Stripe のサンドボックスと、Google Maps Platform と Web Push の試験用の鍵を使う
    data: 種の台本が作る作り物の参加者（試験用のアカウント）、場所、依頼と乗車の記録。データの移しの予行では、本番と同じ形の作り物のデータ（日本語のいろいろな文字を含む）を生成する。ローカルの本番のデータは写さない。NFR-47 のために ELM-03 が受けた要求の中身の写しは、試験の環境のボリュームにだけ書き、環境とともに捨てる
  - name: ローカルの本番（ELM-10）
    runs: テストは動かさない。リリースの手順が、試験の環境で確かめたものと同じイメージを、ローカルの本番の名前の設定とローカルの本番の秘密の値のディレクトリで配備する。自身の Stripe のサンドボックスと Web Push の鍵を使い、それを読むのはローカルの本番の ELM-03 だけ（POL-04）
    data: 実在の参加者のデータ（CON-06）。戻すための写しは、データベースのファイルの写しと鍵の写しで、リポジトリの外に置く（DEC-16、DEC-17）
gate_bindings:
  - nfr: NFR-09
    where: 検査の手順（check）。main に入る変更のたびに git のフックが動かし、失敗すると変更を main に入れない。リリースの手順（release）も同じ検査を初めからやり直し、通らない版は配備しない
    by: 単体の層（到着予定時刻と料金を求めるモジュールの判断表と計算）と結合の層（ELM-03 の HTTP の境界から）のテストが、NFR-09 の確かめを行う。EXT-02 の偽物で NFR-09 が挙げる EXT-02 の応えを起こし、時計の偽物で時刻を決める
  - nfr: NFR-11
    where: リリースの手順（release）の自動の確かめ。失敗するとその版を配備しない
    by: 結合の層のテスト（検査の手順でも動く）が、ELM-03 の HTTP の境界の差し込みで書き終えた後の応答を落とし、依頼の状態を書くポートの差し込みで操作を決めた順に重ねて、NFR-11 が挙げる操作と場面を何度でも同じように再現する。画面が今の状態を示すことは、端から端の層のテストが、試験の環境（偽物の設定）でブラウザを切ってつなぎ直して確かめる
  - nfr: NFR-13
    where: リリースの手順（release）の自動の確かめ。失敗するとその版を配備しない
    by: 端から端の層のテスト（試験の環境の偽物の設定で、EXT-02 の偽物が同じ名前と似た名前の候補を返す場所の組を使う）が NFR-13 の確かめを行う。契約の層のテストが、本物の EXT-02 の候補が区別に使う所在地を返し、つなぎ口がそれを渡すことを確かめる
  - nfr: NFR-15
    where: 実機の受け入れの手順（device-acceptance）。各リリースの手順（release）の中で行い、通らなければ配備しない。対応する iOS と Safari の更新ごとに、Apple がそのベータ版か公開の候補の版を出したときにそれで行い、通らなければ、NFR-15 のしきい値を保つよう、その更新が公開される前に直した版をリリースする。前もって出る版のない更新は公開されたときに行い、通るまで参加者に更新を待ってもらう（範囲外の案内）。結果は、確かめたリリースの版の記録（docs/releases/）に iOS の版とともに残す
