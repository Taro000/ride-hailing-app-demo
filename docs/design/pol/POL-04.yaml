id: POL-04
title: パイプライン、配備と戻し、静的な検査と、コードの中の約束事
status: active
basis: assumed
basis_note: 作る、試す、動かすことをローカルだけで完結させること（TC-09）、新しい版をデモの回を開くときに配備すること（TC-15）、想定の本番の置き場所（TC-08、DEC-05）、静的な検査に Oxlint、整形に Oxfmt を使うこと（TC-04、TC-05）、決済は Stripe のテスト環境、地図は Google Maps Platform であること（TC-10、TC-12）、乗客とドライバーは iOS の Safari で使うこと（TC-13）、個人の情報の扱い（CON-06）、カードの情報を通さないこと（TC-11）は入力。データの形を前の版が読める足し方で変え、戻すときは前の版を配備し直すことは DEC-26 と同じ選び方（FND-11）。パイプラインを開発者のマシンで動かすことは DEC-32 で、開発者のマシンの道具とテストに使う iPhone は DAS-08 による仮定。手順、静的な検査、エラー、ログ、設定と秘密の値、文言の約束事は推定。インタフェースが利用側に見せる約束事（エラーの形と符号、ID、時刻と額の表し方、版の扱い、冪等キーとたどる ID の受け渡し、SLI が要るログの項目、名前の付け方）は第 3 段階が決め、ここはコードがそれをどう作るかだけを決める。Web アプリが環境ごとの値を起動のときに ELM-03 から読むこと（DEC-34）と、試験だけのものをローカルの本番の設定で選べないことは FND-12 を、秘密の値と外部のアカウントを環境ごとに分けて手順ごとに受けるものを決め、NFR-47 のための写しを試験の環境にだけ許すことは FND-13 を、device-acceptance を更新の公開の前の版でも行うことは FND-15 を、deps-audit にイメージと Node.js の版の調べを加えたことは FND-17 を受けて変えた。Oxfmt がベータで --check を持つこと、Stripe がアカウントごとに最大 5 のサンドボックスを作れてそれぞれのデータと鍵が分かれること、Apple が主な版の公開の前に、ふつう最後のベータ版として公開の候補の版を出すこと、Trivy（Apache-2.0）がコンテナのイメージのもとの OS の部品の脆弱性を調べること、Node.js の公開のリリースの一覧が版ごとにセキュリティのリリースかを示すことは公開の情報で確かめた（報告の「入力」）。Trivy が Node.js の実行の部品そのものの脆弱性を見つけるかと、ダッシュボードで作るサンドボックスがそれぞれ別のアカウントの ID を持つこと（CLI の例でだけ読んだ）は確かめていない
premises: [TC-04, TC-05, TC-08, TC-09, TC-10, TC-11, TC-12, TC-13, TC-15, CON-06, PC-03, DAS-08]
scope: pipeline-and-code
addresses: [DRV-13, DRV-12, DRV-15, DRV-16, DRV-24, DRV-29, DRV-34, DRV-18, DRV-07, DRV-27]
decisions: [DEC-05, DEC-11, DEC-15, DEC-16, DEC-18, DEC-19, DEC-20, DEC-21, DEC-26, DEC-30, DEC-32, DEC-34]
rules:
  - rule: 変更は、main への直接の commit か、早送りしない merge commit（--no-ff）で main に入れる。git のフックは scripts/ に置き、pnpm install の prepare が core.hooksPath をそこに向け、main への merge を早送りしない設定にする。pre-commit と pre-merge-commit のフックが pnpm check を、commit-msg のフックが DoD の行を確かめる
    check: リリースの手順が、フックの設定（core.hooksPath と main の --no-ff）が入っていることと、前のリリースからの main の commit がどれも DoD の行の確かめを通ることを確かめ、そうでなければ配備しない
  - rule: 配備するものは、リリースの手順が版ごとに一度だけ作る ELM-03 のコンテナのイメージ（ELM-01 と ELM-02 のビルドの出力を含む）だけにし、試験の環境で確かめたものと同じイメージをローカルの本番に配備する。イメージは環境によらず、環境ごとの違いは設定と秘密の値だけにする。想定の本番では、デモの回を開くときに同じイメージを Cloud Run に配備する（TC-15。実際には動かさない、TC-09）
    check: リリースの手順が、試験の環境とローカルの本番で使うイメージの digest を比べ、違えば配備しない
  - rule: マイグレーションは、新しい版が動く前に、同じイメージの一度だけの処理（ローカルは Compose の一度だけのサービス、想定の本番は Cloud Run の一度だけの処理）が当てる。一つのマイグレーションは、動いている版と一つ前の版がそのまま読める足し方だけにし、表や列を消すのは、前の版に戻す見込みがなくなった後のリリースで行う（DEC-26）。マイグレーションは戻さない
    check: 運用の予行の層の配備と戻しの予行（NFR-41）とデータの移しの予行（NFR-42）
  - rule: リリースは、開発者が main の commit に版の印（v で始まるタグ）を付けて pnpm release を動かして始める。戻すときは、開発者が pnpm rollback で前のリリースのイメージを配備し直す（想定の本番では前の Cloud Run のリビジョンに流れを戻す）。変えた振る舞いを止めるだけなら、配備し直さずに切り替え（DEC-26）を使う
    check: 運用の予行の層の配備と戻しの予行（NFR-41）
  - rule: リリースの手順は、版ごとのリリースの記録（docs/releases/ の版の名前のファイル）に、自動の確かめの結果、実機の受け入れの結果、イメージの digest を書く。個人の情報と秘密の値は書かない
    check: リリースの手順が、記録のない版を配備しない
  - rule: 機能を加えるか直す変更は、その振る舞いを切り替え（DEC-26、FR-36）に登録し、止めると変える前の振る舞い（まったく新しい機能では利用者に示さないこと）に戻るように書く。切り替えを読むのは、その機能の application/ の入口の一か所
    check: 切り替えの登録ごとに、止めた側と動かした側を通す結合の層のテスト（登録にあってテストのない切り替えがあると失敗する）
  - rule: 静的な検査は、TypeScript 6 系の tsc（strict）、Oxlint（correctness の規則を誤りとし、typescript、import、react、jsx-a11y の規則と POL-02 の依存の規則を入れる）、Oxfmt の --check で、開発者のマシンの編集と検査の手順で同じ設定（packages/config）を使う
    check: 検査の手順が、どれかが失敗すると main に入れない
  - rule: 呼んだ側が扱う失敗（業務の規則で受け付けない、外部のシステムが拒否した、結果が分からない）は、型のある結果の値で返す。扱えない失敗は原因（cause）をつけて投げる。ELM-03 では、境界の一か所（src/http/ の onError と、@hono/zod-openapi の既定の確かめの失敗の返し方を替えたもの）が、結果の値と投げた失敗を第 3 段階の約束事のエラーの形に変え、ライブラリの既定のエラーの形（Hono と @hono/zod-openapi のもの）をそのまま返さない。捕えた失敗は扱うか、たどる ID とともにログに書いて投げ直すかのどちらかにし、黙って捨てない
    check: ELM-03 の境界のエラーの変換の単体のテスト（要求の確かめの失敗、結果の値、投げた失敗、ない経路が、第 3 段階の形になること）、Oxlint の空のブロックを禁じる規則、開発者が変更を main に入れる前に見るレビュー
  - rule: Web アプリでは、src/platform/ の呼び出しの部品が ELM-03 のエラーの形を型のある結果に変え、画面はそれを文言の鍵で示す。予期しない失敗は画面の境の一か所で受け、端末のエラーとして ELM-03 に送る（FR-52。つながっていない間はためて送る）
    check: Web アプリの単体の層のテストと、NFR-37 のテスト（POL-03）
  - rule: ELM-03 のログは pino で、一行に一つの JSON を標準出力に書く（DEC-19）。どの行も、その要求のたどる ID と、第 3 段階の約束事が求める項目を持つ。段階は、error（人が見る失敗）、warn（扱った失敗と外部のシステムの失敗）、info（境界での操作の結果と、日々の処理の結果）、debug（想定の本番とローカルの本番では出さない）。ログに渡すものは DEC-15 の隠す決まりを通してから書き、ログの部品はその決まりを通っていない項目を書かない
    check: 個人の情報（名前、連絡先、位置、乗る場所と降りる場所、連絡のメッセージ）を持つものをログに書かせ、出力にそのまま現れないことを確かめる単体の層のテスト
  - rule: 設定は環境変数から読み、コンポーネントごとに一か所（src/platform/ の設定の部品）が Zod で確かめ、欠けているか形が違えば起動しない。コードに設定の値を書かない。ELM-03 の設定は、動く環境の名前（開発、試験、ローカルの本番、想定の本番）を持つ。Web アプリは、環境ごとに違う値（EXT-01 の公開の鍵、ブラウザ用の地図の鍵、Web Push の公開の鍵、ブラウザの側の偽物を使うかどうか）をビルドに入れず、起動のときに ELM-03 の一つの操作から読む（DEC-34、HND-15）。ELM-03 はその値を自身の設定の部品が確かめた設定からだけ作り、秘密の値を入れない。Web アプリの src/platform/ の設定の部品はそれを確かめ、欠けているか形が違えば画面を始めずにそのことを示す
    check: 設定を一つずつ欠いて ELM-03 を起動し、起動しないことを確かめる結合の層のテスト。ELM-03 が Web アプリに渡す値が公開してよい値と偽物の選び方だけであることを確かめる結合の層のテストと、Web アプリの設定の部品の単体の層のテスト。ビルドに環境ごとの値が入らないことは、同じイメージを二つの設定で動かすリリースの手順の端から端の層が確かめる（本物の外部サービスの設定の NFR-47 のテストは、試験用の Stripe のサンドボックスの公開の鍵でなければ登録を通せない）
  - rule: 試験だけのもの（ELM-03 の外部のシステムのつなぎ口の偽物とその答え方を決めるもの、Web アプリに選ばせるブラウザの側の偽物、NFR-47 のために ELM-03 が受けた要求の中身を写すこと）は、設定の部品の一つの登録に並べ、開発と試験の環境の名前の設定でだけ選べるようにする（写しは試験の環境の名前だけ）。ローカルの本番か想定の本番の名前の設定でどれかを選ぶと、ELM-03 は起動しない
    check: 試験だけのものの登録から、ローカルの本番と想定の本番の名前の設定で一つずつ選んで ELM-03 を起動し、どれでも起動しないことを確かめる結合の層のテスト（登録に加えたものは、この確かめに自動で入る）。リリースの手順は、ローカルの本番に配備する設定がローカルの本番の名前を持たなければ配備しない
  - rule: 秘密の値（EXT-01 と EXT-02 の鍵、データベースへの接続、Web Push の送り手の鍵、日々の呼び出しの確かめ、記録した日ごとの鍵）は、想定の本番では Secret Manager から、ローカルでは環境ごとに分けたリポジトリとデータベースの外のディレクトリ（設定がその場所を指す）から読む。リポジトリに置かず、ログに書かない。試験の環境と開発者のマシンは試験用のディレクトリを使い、ローカルの本番のディレクトリを読むのはローカルの本番の ELM-03 だけにする。EXT-01 のサンドボックスと Web Push の送り手の鍵は、試験用（試験の環境と開発者のマシン）とローカルの本番で別のものにし、想定の本番はその本番だけのものを Secret Manager に置く。ELM-03 の設定は、使う EXT-01 のアカウントを名指す（秘密の値ではない）
    check: 検査の手順の秘密の値の調べ（secretlint）と、ログの単体の層のテスト。リリースの手順は、試験の環境とローカルの本番の設定が同じ EXT-01 のアカウントか同じ Web Push の公開の鍵を名指せば、試験の環境を立てない。契約の層のテスト（試験の環境）と、配備の前の一度だけの処理（マイグレーションを当てる処理。ローカルの本番と想定の本番）は、鍵で届く EXT-01 のアカウントが設定の名指すものであることを確かめ、違えば失敗して新しい版を動かさない
  - rule: パイプラインの手順が受ける秘密の値と外部のアカウントは次だけにする。check は受けない（偽物だけで動く）。release と device-acceptance は試験用のディレクトリのもの（偽物の設定では外部のアカウントの鍵を使わない）。ローカルの本番のディレクトリは、release の配備と rollback がローカルの本番のコンテナに渡すだけで、手順そのものは読まない。open-session と close-session は想定の本番の GCP の権限（実際には動かさない）。deps-audit は受けない
    check: 開発者が scripts/ と infra/local/ を変える変更を main に入れる前に見るレビュー
  - rule: 記録した日ごとの鍵（DEC-16）は、src/platform/ の鍵の置き場所のポートだけが作り、読み、捨てる。想定の本番では日ごとに Secret Manager の一つの秘密（捨てるときはそのすべての版を捨てる）、ローカルでは鍵のディレクトリの一つのファイルと、写しのディレクトリの一つのファイルにする。項目の暗号は node:crypto の AES-256-GCM で、どの日の鍵かを暗号の文と一緒に持つ。パスワードは node:crypto の scrypt で持つ（DEC-30）。いつ作りいつ捨てるかは、日々の処理のモジュールとして第 4 段階が決める
    check: 鍵の置き場所の偽物で、鍵を捨てた日の項目が読めなくなることを確かめる結合の層のテストと、node:crypto の import の規則（POL-02）
  - rule: 人に見せる文は、ELM-01 と ELM-02 ではアプリごとに一つの文言のファイル（日本語）に置き、画面は鍵を持つ。ELM-03 が作る知らせの短い題（DEC-21）も一つの文言のファイルに置く。日時、数、額は、アプリごとに一つの書式の部品（ja-JP、Asia/Tokyo、円）で示す
    check: Oxlint の react/jsx-no-literals（画面に文字をじかに書くことを禁じる）を、検査の手順で
  - rule: ローカルの定期の呼び出しは、試験の環境とローカルの本番の Compose の中の一つのサービスにし、Cloud Scheduler と同じ形の要求で、毎日決まった時刻に日々の処理の入口を呼ぶ。開発とテストでは、同じ要求を pnpm job:daily で手で送れる
    check: 同じ形の要求で日々の処理の入口を呼ぶ結合の層のテスト
  - rule: Web アプリのサービスワーカーは、Web Push の受け取りと、知らせを押したときの扱いだけをし、アプリのファイルを持たない。開くたびに、配備されている版のファイルを読む
    check: サービスワーカーを変える変更を、開発者が main に入れる前に見るレビュー
pipeline:
  - step: check
    when: main に入る変更のたび（main への commit と、早送りしない merge で git のフックが動かす）と、コーディングエージェントと開発者が変更を終える前（pnpm check）
    runs: ロックファイルを変えない依存の入れ方、型の確かめ、Oxlint（依存の規則を含む）、Oxfmt の --check、仕様書と api-client の型とマイグレーションを生成し直して違いを見ること、oasdiff で最後のリリースの仕様書と比べること、秘密の値の調べ（secretlint）、単体と結合の層のテスト（Web アプリは Browser Mode と axe-core を含む）、main に入れる commit の DoD の行の確かめ、check.py --skill implementation、依存の脆弱性の調べ（deps-audit、報告だけ）
    blocks: main に入れること（フックが commit と merge を止める）
  - step: release
    when: 開発者が main の commit に版の印（v で始まるタグ）を付けて pnpm release を動かしたとき
    runs: check を初めからやり直す、前のリリースからの commit の DoD の行を確かめる、ELM-03 のイメージを一度だけ作ってそのイメージに deps-audit を通す、試験の環境を偽物の設定で立ててマイグレーションを当て、端から端の層と運用の予行の層を通す、試験の環境とローカルの本番の設定が別の EXT-01 のアカウントと Web Push の公開の鍵を名指すことを確かめてから、試験の環境を本物の外部サービスの設定で立て直して契約の層と NFR-47 の確かめを通す、device-acceptance、リリースの記録を書く、同じイメージをローカルの本番に配備する（配備の前の一度だけの処理が、EXT-01 のアカウントを確かめてマイグレーションを当てる。想定の本番では、デモの回を開くときに Cloud Run に配備する。実際には動かさない）
    blocks: 配備（どれかが通らなければイメージを配備しない）
  - step: device-acceptance
    when: release の中と、対応する iOS と Safari の更新ごとに、Apple がそのベータ版か公開の候補の版を出したとき（前もって出る版のない更新は公開されたとき）。更新のときは、開発者が pnpm acceptance で試験の環境を本物の外部サービスの設定で立てる
    runs: 実機の受け入れの層（開発者が確かめる版の iPhone で台本どおりに行い、結果を確かめたリリースの版の記録に iOS の版とともに書く）
    blocks: release の中では配備。更新のときは何も止めないが、通らなければ、その更新が公開される前に直した版をリリースする（前もって出る版のない更新では、通るまで参加者に更新を待ってもらう。範囲外）
  - step: rollback
    when: 開発者が前の版に戻すと決めたとき（pnpm rollback）
    runs: 前のリリースのイメージを配備し直す（マイグレーションは戻さない）。想定の本番では、前の Cloud Run のリビジョンに流れを戻す
    blocks: 何も止めない
  - step: open-session
    when: 想定の本番でデモの回を開くとき（実際には動かさない、TC-09）
    runs: Cloud Run の最小と最大のインスタンスの数を DEC-05 の回の間の値にし、外からの生存確認を入れる（DEC-20）
    blocks: 何も止めない
  - step: close-session
    when: 想定の本番でデモの回を閉じるとき（実際には動かさない、TC-09）
    runs: Cloud Run の最小のインスタンスの数を DEC-05 の回の外の値にし、外からの生存確認を止める（DEC-20）
    blocks: 何も止めない
  - step: deps-audit
    when: check と release の中と、想定の本番の運用では週に一度
    runs: pnpm audit で依存の部品の脆弱性を調べる。release ではそのリリースのイメージを、週に一度では配備しているイメージを、もとの OS の部品の脆弱性について Trivy で調べ、そのイメージの Node.js の版より後のセキュリティのリリースがあるかを Node.js の公開のリリースの一覧で調べる。見つけたものごとに NFR-28 の記録を開く
    blocks: 何も止めない（NFR-28 の監査を支えるだけで、ゲートではない）
as_is: new
