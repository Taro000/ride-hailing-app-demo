  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 乗車中に経路を得られないときの行と、状態が許さないときの 409 の行（RIDE_CANCELLED、RIDE_NOT_ARRIVED、RIDE_NOT_IN_PROGRESS）を足した。依頼が終わって受付もしていなければ画面の点灯を解放すると書き、functions に FR-52 を足した。乗車の終了を待つ時間を 25 秒にし、確かめがついたときの示し方を書いた
  reason: '第 3 段階の再実行（2026-11-04）: DEC-50 版 2、第 2 段階の DEC-33 版 2、FND-34・47'
