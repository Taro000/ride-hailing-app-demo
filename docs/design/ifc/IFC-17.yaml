id: IFC-17
title: 決済サービスの API（EXT-01）
status: active
basis: assumed
basis_note: 押さえは後で確定する取引で行い、確定額か支払い方法が変わったら押さえ直してから前を取り消し、決済は全額、料金は一部の確定で請求することは DEC-09（入力）。試みごとに記録してその試みだけを覆うキーで送り、答えがなければ同じキーで送り直すか作った取引を読み直して確かめ、拒否された試みのやり直しは新しいキーにすることは DEC-10、結果を呼び出しの答えと読み出しで知り、知らせを受けず日々の照合を行うことは DEC-11、登録の取引を作って結果を読み直すことは DEC-12（どれも入力）。名前と連絡先を渡さず不透明な ID だけを渡すことは DEC-09、DEC-12（入力）。Stripe の API で使う機能が円で使えることは DAS-06 による仮定。Stripe が同じキーに一度目の結果を 500 も含めて返し、キーを少なくとも 24 時間持ち、ネットワークの誤りと 409 は同じキーで送り直し、500 の結果は取引を読んで確かめるよう文書で示すこと、押さえの期限が切れると取引が canceled になり、一部の確定の残りは自動で解かれ、確定は一度だけであることは Stripe の公開の文書による（報告の「入力」）。答えの分け方は DEC-45。タイムアウト、やり直し、待ち、確かめの間隔を決めて HND-05 を DEC-45、DEC-46 とともに決め、決済の答えの期限が T_payment_response のうちに収まることを確かめて HND-01 を IFC-03 とともに決めた。その値は DAS-10 による暫定の決定。確かめはインスタンスが動いている間は期限の処理が、インスタンスが 0 の間は日々の処理が行う（DEC-18）。利用者が待つ試みの待ちを、最初に送ってから 8.5 秒と、その操作の冪等キーの答えの期限から結果を書く取引の予算を引いた時刻の早い方で終えることは FND-37 を受けて DEC-42 とともに決めた。処理されなかったとする答えを、状態を変える呼び出しへの答えで EXT-01 が実行を始めていないことを示すものに限り、確かめで受けたときは結果が分からないままとし、利用者が待たない押さえの解除と料金の請求が処理されなかったら新しい試みを作ることは、FND-45 を受けて DEC-45 とともに決めた（推定）。取引の ID が分かっている確定と取り消しの試みを、500 か processing の後の読み出しで分け、待ちの後の最初の確かめからも取引が変わっていなければ処理されなかったとすることと、取引の状態が操作に合わないと退けられた確定と取り消しを取引の読み出しで決めることは、FND-55 を受けて DEC-45 とともに決めた（推定。一つの取引が確定か取り消しのどちらか一度だけになることは Stripe の文書、報告の「入力」。処理されなかったとするまでの待ちは DAS-10）。取引が変わらないまま処理されなかったとした確定の要求が後で効きうる間（その押さえを確定済みか取り消し済みと読むまで）は、その処理をほかの押さえに移さず（ordering）、同じ押さえへの次の試みのはっきりした拒否ではその処理を終えずに押さえを解いて決め、解除が確定済みに退けられればその処理の新しい試みを同じ押さえに作って済んだとすることは、FND-58 を受けて DEC-45 とともに決めた（推定）
premises: [EXT-01, TC-10, TC-11, CON-03, DAS-06, DAS-10]
kind: http
name: 決済サービスの API（Stripe のテスト環境）
provider: ELM-05
consumers: [ELM-03]
functions: [FR-29, FR-30, FR-39, FR-40, FR-46, FR-54]
operations:
  - name: POST /v1/customers
    does: 乗客ごとに一度、このシステムの不透明な ID だけを metadata に持つ EXT-01 の顧客を作る。名前と連絡先は渡さない（DEC-12）
  - name: POST /v1/setup_intents
    does: 支払い方法の登録の取引を作る（FR-46、DEC-12）
  - name: GET /v1/setup_intents/{id}
    does: 登録の取引の今の状態を読み、登録の結果を決める（FR-46 の 1、3、4）
  - name: POST /v1/payment_intents
    does: 確定額を押さえる取引を作って確かめる（後で確定する取引、登録した支払い方法、利用者がいない場面の確かめ）。依頼のときの押さえと、降りる場所の変更と支払い方法の変更の押さえ直しに使う（FR-54 の 1、4、DEC-09）
  - name: POST /v1/payment_intents/{id}/capture
    does: 押さえの全額の確定（決済、FR-29、FR-54 の 5）か、一部の確定（キャンセル料と不在の料金。残りは EXT-01 が解く、FR-54 の 6、7）
  - name: POST /v1/payment_intents/{id}/cancel
    does: 押さえを解く（許諾の前の取り消し、許諾のないまま終わった依頼、押さえ直しの後の前の押さえ、後で済んでいたと分かった押さえ、FR-54 の 3、8）
  - name: GET /v1/payment_intents/{id}
    does: 取引の今の状態と額（押さえた額、確定した額、解いた額）を読む。結果が分からない試みの確かめと照合に使う
  - name: GET /v1/payment_intents
    does: 作った期間か顧客で取引の一覧を読み、metadata の attemptId で試みに結び付ける。照合と、ID の分からない取引の確かめに使う（DEC-11）
  - name: POST /v1/refunds
    does: 確定した取引に、担当者が認めた額を返金する（FR-39）
  - name: GET /v1/refunds/{id}
    does: 返金の今の状態を読む
  - name: GET /v1/refunds
    does: 作った期間か取引で返金の一覧を読み、metadata の attemptId で試みに結び付ける（照合、NFR-24）
format: application/x-www-form-urlencoded の要求と JSON の応答（Stripe の API）。額は円の整数（円は小数のない通貨、DEC-38）。作る取引、返金、顧客の metadata に attemptId と traceId（DEC-43）とこのシステムの不透明な ID だけを入れ、名前、連絡先、場所は入れない
protocol: HTTPS の要求と応答。API の版は Stripe-Version のヘッダーで固定する（POL-05、DEC-41）。ELM-03 の payments の機能の adapters/ だけが呼ぶ（POL-02）
auth: 制限した秘密の鍵（試験用とローカルの本番で別のサンドボックス、POL-04）を ELM-03 だけが持つ
errors:
  - case: 2xx で取引が求めた状態になった（押さえは requires_capture、確定は succeeded、解くことは canceled、返金は succeeded、登録は succeeded）
    signal: 済んだ
    caller_does: 試みを済んだとして記録し、依頼、乗車、支払い方法、返金に結び付ける
  - case: カードが使えない（402 の card_error、確かめた後の requires_payment_method）、追加の本人確認を求められた（requires_action。このシステムは利用者がいない場面で扱えない）
    signal: はっきりした拒否（拒否の理由を DEC-45 の reason に分ける。requires_action の取引は解く）
    caller_does: 試みを拒否で終え、同じキーでは送らず、理由を示す。やり直しは新しい試み（DEC-45）。ただし、決済か料金の確定の試みで、取引が変わらないまま処理されなかったとした同じ処理の確定の要求がその押さえで後で効きうる間（その押さえを確定済みか取り消し済みと読むまで）は、その処理を拒否で終えず、その押さえを解く試みを作り、解除が済めばその拒否の理由で拒否とし、解除が確定済みに退けられれば済んだとする（下の取引の状態が操作に合わない誤り、DEC-45）
  - case: 取引の状態が操作に合わない（押さえの期限が切れて canceled になった取引の確定など、実行の後の 400）
    signal: はっきりした拒否（確定と取り消しは取引を読んで決める）
    caller_does: 確定と取り消しでは取引を読み、試みの求めた結果をすでに示していれば（処理されなかったとした前の試みの要求が後で効いた。一つの取引は確定か取り消しのどちらか一度だけ）済んだとし、そうでなければ拒否として扱う。どちらも異常として記録する（照合が食い違いを見る、DEC-45）。押さえを解く試みが、読んだ取引の確定済みで拒否になり、その押さえに後で効きうる確定（取引が変わらないまま処理されなかったとした決済か料金の確定の要求）があれば、それが効いたので、その処理の新しい試みを同じ押さえに作り、取引を読んで済んだとする（決済は依頼の決済が済んだ、DEC-45）
  - case: タイムアウト、つながらない、409（同じキーの要求が動いている）、429
    signal: 結果が分からない（同じキーで送り直せる）
    caller_does: 同じキーと同じ中身で送り直す（最初に送ってから 23 時間のうち）。新しいキーでは送らない
  - case: 500、502、503、504、processing の状態
    signal: 結果が分からない（同じキーの送り直しは同じ 500 を返すため、読み出しで確かめる）
    caller_does: 取引の ID が分かれば GET で、分からなければ顧客か期間の一覧から metadata の attemptId で探して確かめる。作る呼び出し（押さえ、押さえ直し、返金、登録の取引）は、見つからなければ作られていない。取引の ID が分かっている確定と取り消しは、取引が求めた結果（確定は確定した額、取り消しは canceled）なら済んだ、試みの操作をもうできない状態（確定に canceled、取り消しに確定済み）ならはっきりした拒否で異常（取り消しに確定済みで、その押さえに後で効きうる確定があれば、上の取引の状態が操作に合わない誤りと同じに、その処理の新しい試みを同じ押さえに作って済んだとする、DEC-45）、processing なら結果が分からないまま。取引が変わっていない（requires_capture のまま）ときは、待ちの後の最初の確かめの時刻（timing）より前は結果が分からないままとし、その時刻から後の確かめでも変わっていなければ処理されなかったで終え、異常にする（その要求は後で効きうるため、その押さえを確定済みか取り消し済みと読むまで、その処理をほかの押さえに移さず拒否とも決めない、DEC-45）
  - case: 実行の前に退けられた（鍵の誤りの 401、権限の 403、実行の前の形の誤りの 400。EXT-01 は実行を始めていない要求のキーに結果を残さない）
    signal: 状態を変える呼び出しへの答えなら処理されなかった。確かめの読み出しと送り直しへの答えなら、最初の呼び出しが効いたかは分からないため結果が分からないまま。実行の前か後かを見分けられない 400 は結果が分からない
    caller_does: 処理されなかった試みは何も実行されていないので済まなかったとして終え、システムの誤りとして異常にする。利用者が待つ操作には 503 PAYMENT_SERVICE_UNAVAILABLE で答え、やり直しは利用者が改めて操作したときの新しい試み（DEC-45）。利用者が待たない押さえの解除と料金の請求は、期限の処理が新しい試みを作って送る（timing）。確かめで受けたときは試みを結果が分からないまま確かめ続け、異常にする
idempotency: 状態を変えるどの呼び出しにも Idempotency-Key を付け、キーは ELM-03 がお金の操作の試みごとに一つ作る（DEC-10）。同じ試みの送り直しは同じキーと同じ中身で、最初に送ってから 23 時間のうちだけ行う（EXT-01 はキーを少なくとも 24 時間持つ）。それを過ぎた確かめと 500 の後の確かめは読み出し（GET と一覧）で行う。GET は繰り返してよい
timing:
  timeout: 一回の呼び出しのタイムアウトは 4 秒（一覧の 1 ページは 10 秒）。利用者が答えを待つ試み（押さえ、押さえ直し、決済、返金、登録の読み直し）は、結果が分からなければ 0.5 秒置いて同じキーで一度だけ送り直すか読み直し、最初に送ってから 8.5 秒か、その操作の冪等キーの答えの期限（DAT-26 の answerDueAt）から結果を書く取引の予算 0.1 秒（DEC-46）を引いた時刻の、早い方までに分からなければ（二回目の呼び出しのタイムアウトはその時刻までの残りで切る。受けたインスタンスが答えの期限までに答えるため、DEC-42）DEC-45 のとおりに答え、押さえと押さえ直しはしなかったことにし、決済、返金、登録は結果が分からないものとして持つ。結果が分からない試みは、その待ちの後 30 秒、1、2、4、8 分に、その後は 10 分ごとに確かめ、ELM-03 のインスタンスが動いている間は期限の処理が、インスタンスが 0 の間は日々の処理が確かめる（DEC-18）。取引の ID が分かっている確定と取り消しの試みは、この最初の確かめの時刻（待ちの後 30 秒。利用者が待たない試みは最初の呼び出しの後 30 秒）から後の確かめで、読んだ取引が変わっていなければ処理されなかったで終え、その時刻より前の確かめ（同じキーの送り直しが早めたものを含む）では結果が分からないままにする（DEC-45。決済の最初の確かめは最初に送ってから遅くて 38.5 秒、報告の「遅延の予算とタイムアウト」）。利用者が待たない試み（キャンセル料と不在の料金、押さえを解くこと）は期限の処理が送り、一回の呼び出しで分からなければ同じ間隔で確かめ、処理されなかったら同じ間隔で新しい試みを作って送る（DEC-45）。クライアントの部品の自動のやり直しは使わず、やり直しはここだけで行う（HND-14 の部品の選び方の枠）。押さえの有効期間はデモの依頼と乗車の長さより十分に長い（DEC-09 の想定）。値は DAS-10
  ordering: 一つの依頼の押さえ、押さえ直し、確定、解除は、前の試みが済んだか拒否か処理されなかったで終わってから次を送る。押さえ直しは新しい押さえが済んでから前の押さえを解く（DEC-09）。取引が変わらないまま処理されなかったとした確定の要求がその押さえで後で効きうる間（その押さえを確定済みか取り消し済みと読むまで）は、その処理（決済か料金の請求）をほかの押さえに移さず、押さえ直しを送らない（IFC-03 の 409 PAYMENT_PENDING_CONFIRMATION）。その間に同じ押さえへの次の確定がはっきり拒否されたら、その押さえを解く試みを送り、その結果で処理を決めてから次へ進む（DEC-45）
  delivery: null
versioning: Stripe-Version を固定し、上げるときは契約の層（POL-03）で確かめてから上げる（DEC-41）
observability: 呼び出しごとに、試みの ID、操作、キー、EXT-01 の取引の ID、答えの分け方、時間をたどる記録（DAT-18）に残す。額は残し、カードの情報は受けない（TC-11）
sli_bindings: []
spec: null
as_is: new
