id: IFC-11
title: 配備と開け閉めの手順
status: draft
version: 2
basis: inferred
basis_note: 第 2 段階の DEC-27 版 3・4（GitHub Actions の手順だけ、サービスと二つのジョブを同じイメージ、手順はデータベースの資格情報を持たずデータベースに触れる段は運用のジョブで動かす、配備の記録に残すもの）、DEC-34 版 2、DEC-36 版 2、DEC-37 版 4（期間の終わりはふだん毎日の処理が決める）は入力。手順の名前と入力、同時に一つだけ動かすこと、手順ごとの上限は推定
needs_agreement: false
approver_candidates: []
kind: batch
name: 配備と開け閉めの手順
provider: ELM-06
consumers:
- USR-03
functions:
- FR-41
- FR-42
operations:
- name: ci
  does: pull request と main への変更で CI のゲート（NFR-08、10、11、13、16、22、27、30、31、32、35、37、39、40、42）を動かす
- name: build
  does: main への変更で、ゲートを通ったイメージを作って ELM-09 に置く
- name: start-period
  does: デモの期間を始める。運用のジョブの check-turso で Turso が答えるかを確かめ、二つのジョブ（最新の配備の記録のイメージ）、定時の起動、二つ目の規則を有効にし、定時の起動を通して毎日の処理のジョブを一度動かして終わりを確かめる。record-deploy で記録を残す
- name: open-demo
  does: デモを開く。運用のジョブの migrate で構造の変更（足すだけ）を当て、サービスと二つのジョブを同じダイジェストのイメージで配備し、一つ目の規則を有効にし、record-deploy で配備の記録とデモの回を開いた時刻を残す（FR-41 AC2・4）
- name: close-demo
  does: デモを閉じる。運用のジョブの count-open が 0 のときだけ、一つ目の規則を止めてからサービスを消し、record-deploy で閉じた時刻を残す（そのデモの最後の回なら印を付ける。FR-41 AC4）。閉じる操作が途中で失敗したら、失敗したことと時刻を残す。理由を付ければ強いて閉じる（DEC-37）
- name: rollback
  does: 一つ前に配備したイメージを、サービスと二つのジョブにもう一度配備し、record-deploy で戻した時刻と理由を記録する（FR-42）
- name: end-period
  does: 期間を強いて終える（ふだんは毎日の処理が終える。DEC-37）。運用のジョブの period-status で残りを示し、理由を付けたときだけ定時の起動と二つ目の規則を止め、サービスが残っていないか確かめ、record-deploy で強いて終えた理由を残す。毎日の処理が定時の起動や規則を止められなかったときにも使う
- name: end-system
  does: システムを終える。二つのジョブ、定時の起動、規則、秘密、地図の鍵を消す（DEC-36。データベースと書き出し、Stripe のサンドボックスは IFC-12）
format: GitHub Actions の手で動かす手順（workflow_dispatch）。入力はイメージのダイジェスト（既定は最新のゲートを通ったもの）、理由、強いて進めるか、最後の回か（close-demo）。結果は実行の要約と配備の記録（DAT-26）
protocol: GitHub Actions → Google Cloud の管理の操作（IFC-21）と、運用のジョブで動く運用のコマンド（IFC-10 の migrate、record-deploy、count-open、period-status、check-turso）。手順は Turso に直接つながない
auth: main の枝の手順だけが鍵を置かない連携で GCP に入れる（DEC-27、DEC-34）。手順はデータベースの資格情報を持たない。手で動かせるのはリポジトリに書く権限を持つ人（開発者）だけ
errors:
- case: ゲートが落ちた
  signal: 手順の失敗
  caller_does: 配備せず、どのテストが落ちたかを示す（FR-41 AC3）
- case: open-demo の途中で失敗
  signal: 手順の失敗と配備の記録（失敗）
  caller_does: 本番は前の版のまま（サービスがなければないまま）。失敗を記録して知らせる（FR-41 AC5）。動かし直すと同じ結果に収まる
- case: rollback で戻せる前の版がない
  signal: 手順の失敗
  caller_does: 戻さずその旨を示す（FR-42 AC2）
- case: close-demo で count-open が 10
  signal: 手順の失敗と一覧
  caller_does: 閉じない。参加者が終えるか、見回りが片付けてから動かし直す。理由を付けて強いて閉じると配備の記録に残す（DEC-37）
- case: close-demo の途中で失敗（一つ目の規則を止めた後、サービスを消す前など）
  signal: 手順の失敗と配備の記録（閉じる操作の失敗と時刻。FR-41 AC4）
  caller_does: 動かし直す（置き換えの形なので続きから同じ結果になる）。サービスが残っていれば消すまで続ける
- case: end-period で period-status が 10（残りがある）
  signal: 手順の失敗
  caller_does: 理由を付けないと終えない。理由を付けて強いて終えると配備の記録に残す（DEC-37）
- case: Turso に届かない（20）
  signal: 手順の失敗
  caller_does: 止まり、IFC-12 の unarchive を動かすよう示す（DEC-27）
- case: 運用のジョブを起こせない、タスクの終わりの符号を読めない
  signal: その段で手順の失敗
  caller_does: 原因を直して動かし直す
- case: GCP の操作の失敗（403、409、429、5xx）
  signal: その段で手順の失敗
  caller_does: 原因を直して動かし直す（どの段も置き換えの形なので、続きから同じ結果になる）
idempotency: どの手順も定義の置き換えで、同じ入力で二度動かしても同じ状態になる。record-deploy は手順の実行と段の組で一行だけ書く。GitHub Actions の一つの concurrency の組で、同時には一つしか動かない（閉じている最中に開く、などを起こさない）
timing:
  timeout: 手順ごとに 30 分（start-period はジョブの一回の終わりを待つので 60 分）（仮）
  ordering: 同時に一つ
  delivery: null
versioning: 手順の入力は足すだけ
observability: 配備の記録（DAT-26）に版（イメージのダイジェスト）、時刻、含まれる変更とその種類（feature、fix、upgrade）、各変更の最初のコミットの時刻と main に入って CI が通った時刻（GitHub から集めて record-deploy に引数で渡す。FR-41 AC2）、デモの回を開いた時刻と閉じた時刻、閉じる操作の失敗と時刻、最後の回の印（FR-41 AC4）、戻した理由、強いて進めた理由を残す。実行のログは公開されるので、秘密と個人情報を出さない（DEC-32、DEC-44）
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 手順からデータベースの資格情報をなくし、データベースに触れる段（check-turso、migrate、record-deploy、count-open、period-status）を運用のジョブで動かしてタスクの終わりの符号を読むとした。close-demo に最後の回の印、閉じた時刻、閉じる操作の失敗の記録とそのエラーを足した。end-period を強いて終えるときだけにした。record-deploy に変更ごとの最初のコミットの時刻と main で CI が通った時刻を渡すとした。デモを開く・戻すでサービスと二つのジョブを同じイメージにし、end-system が消すジョブを二つにした。FR-41 の受け入れ基準の番号を版 4 に合わせた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-41 版 3・4）、第 2 段階の DEC-27 版 3・4、DEC-34 版 2、DEC-36 版 2、DEC-37 版 3・4'
