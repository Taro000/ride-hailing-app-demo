id: IFC-11
title: 配備と開け閉めの手順
status: draft
version: 1
basis: inferred
basis_note: DEC-27（GitHub Actions の手順だけ、サービスとジョブを同じイメージ、閉じる前と終える前の確かめ）、DEC-36、DEC-37 は入力。手順の名前と入力、同時に一つだけ動かすこと、手順ごとの上限は推定
needs_agreement: false
approver_candidates: []
kind: batch
name: 配備と開け閉めの手順
provider: ELM-06
consumers:
- USR-03
functions:
- FR-41
- FR-42
operations:
- name: ci
  does: pull request と main への変更で CI のゲート（NFR-08、10、11、13、16、22、27、30、31、32、35、37、39、40、42）を動かす
- name: build
  does: main への変更で、ゲートを通ったイメージを作って ELM-09 に置く
- name: start-period
  does: デモの期間を始める。count-open で Turso が答えるかを確かめ、ジョブ（最新の配備の記録のイメージ）、定時の起動、二つ目の規則を有効にし、定時の起動を通してジョブを一度動かして終わりを確かめる
- name: open-demo
  does: デモを開く。構造の変更（足すだけ）を当て、サービスとジョブを同じダイジェストのイメージで配備し、一つ目の規則を有効にし、配備の記録を残す（FR-41）
- name: close-demo
  does: デモを閉じる。count-open が 0 のときだけ、一つ目の規則を止めてからサービスを消す。理由を付ければ強いて閉じる（DEC-37）
- name: rollback
  does: 一つ前に配備したイメージを、サービスとジョブの両方にもう一度配備し、戻した時刻と理由を記録する（FR-42）
- name: end-period
  does: 期間を終える。period-status が終えられるときだけ、定時の起動と二つ目の規則を止め、サービスが残っていないか確かめる。理由を付ければ強いて終える
- name: end-system
  does: システムを終える。ジョブ、定時の起動、規則、秘密、地図の鍵を消す（DEC-36。データベースと書き出しは IFC-12）
format: GitHub Actions の手で動かす手順（workflow_dispatch）。入力はイメージのダイジェスト（既定は最新のゲートを通ったもの）、理由、強いて進めるか。結果は実行の要約と配備の記録（DAT-26）
protocol: GitHub Actions → Google Cloud の管理の操作（IFC-21）、Turso（構造の変更と配備の記録）、イメージのコマンド（IFC-10）
auth: main の枝の手順だけが鍵を置かない連携で GCP に入れる（DEC-27、DEC-34）。手で動かせるのはリポジトリに書く権限を持つ人（開発者）だけ
errors:
- case: ゲートが落ちた
  signal: 手順の失敗
  caller_does: 配備せず、どのテストが落ちたかを示す（FR-41 AC3）
- case: open-demo の途中で失敗
  signal: 手順の失敗と配備の記録（失敗）
  caller_does: 本番は前の版のまま（サービスがなければないまま）。失敗を記録して知らせる（FR-41 AC4）。動かし直すと同じ結果に収まる
- case: rollback で戻せる前の版がない
  signal: 手順の失敗
  caller_does: 戻さずその旨を示す（FR-42 AC2）
- case: close-demo で count-open が 10
  signal: 手順の失敗と一覧
  caller_does: 閉じない。参加者が終えるか、見回りが片付けてから動かし直す。理由を付けて強いて閉じると配備の記録に残す（DEC-37）
- case: end-period で period-status が 10
  signal: 手順の失敗
  caller_does: 終えない。翌朝の処理の後に動かし直す（DEC-37）
- case: Turso に届かない（20）
  signal: 手順の失敗
  caller_does: 止まり、IFC-12 の unarchive を動かすよう示す（DEC-27）
- case: GCP の操作の失敗（403、409、429、5xx）
  signal: その段で手順の失敗
  caller_does: 原因を直して動かし直す（どの段も置き換えの形なので、続きから同じ結果になる）
idempotency: どの手順も定義の置き換えで、同じ入力で二度動かしても同じ状態になる。GitHub Actions の一つの concurrency の組で、同時には一つしか動かない（閉じている最中に開く、などを起こさない）
timing:
  timeout: 手順ごとに 30 分（start-period はジョブの一回の終わりを待つので 60 分）（仮）
  ordering: 同時に一つ
  delivery: null
versioning: 手順の入力は足すだけ
observability: 配備の記録（DAT-26）に版（イメージのダイジェスト）、時刻、含まれる変更とその種類、各変更の最初のコミットの時刻（FR-41 AC2）、戻した理由、強いて進めた理由。実行のログは公開されるので、秘密と個人情報を出さない（DEC-32、DEC-44）
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
