id: IFC-22
title: 乗客の画面
status: active
basis: inferred
basis_note: 画面の機能と、受け入れ基準が挙げる誤りと空の状態は FR-01〜FR-16、FR-23、FR-26、FR-27、FR-31、FR-36、FR-37、FR-39、FR-46〜FR-49、FR-52〜FR-54（入力）。乗客は iOS 18.4 以降の iPhone でホーム画面に加えた Web アプリとして使い、迎車を待つ間から乗車中まで画面に出したままにすることは DEC-02、TC-13（入力）。使える機能、額、状態、評価は決めず ELM-03 が送ったものを示すことは ELM-01 と DRV-31（入力）。画面の作りの細部は、第 4 段階が ELM-01 のモジュールを確定の深さで設計するときか実装が決める。画面の移り変わりは報告の「画面」。乗る場所を決め始めた時刻と評価を始めたことを ELM-03 に送ることは FND-24 を、閾値を変えて依頼し直す道（FR-05 の 4）、場所を変えたときの見積もり直し（FR-03 の 3）、決済の結果（FR-29 の 4、5、FR-30）を functions と画面に挙げ、現在地が分からないときの信号を端末の状態に直したことは FND-30 を受けた。FR-05 と FR-45 は ELM-01 の functions にないため、FND-35 で第 2 段階に求めた。決済サービスが処理しなかった決済（結果が分からなかった決済を確かめて分かったときを含む）を示す行を加えたことは FND-55 を、決済の結果を確かめている間の支払い方法の変更への答えを加えたことは FND-57 を、決済サービスが処理しなかった決済の要求が後で効きうる間もその答えを受けることは FND-58 を受けた（DEC-45、IFC-03）
premises: [TC-13]
kind: screen
name: 乗客の画面（ELM-01）
provider: ELM-01
consumers: [USR-01]
functions: [FR-01, FR-02, FR-03, FR-04, FR-05, FR-06, FR-07, FR-08, FR-09, FR-10, FR-11, FR-12, FR-13, FR-15, FR-16, FR-23, FR-26, FR-27, FR-29, FR-30, FR-31, FR-36, FR-37, FR-39, FR-45, FR-46, FR-47, FR-48, FR-49, FR-52, FR-53, FR-54]
operations:
  - name: 使い始め
    does: サインインの ID と設定の符号でパスワードを決め、サインインする（FR-48）。ホーム画面に加える案内、知らせと位置と画面を消さない仕組みの許しを求める（DEC-02、DEC-21）。サインインしていなければどの機能も使わせない（FR-48 の 3）
  - name: 配車手配
    does: 乗る場所（現在地から、FR-02）と降りる場所を候補と地図で決め（FR-01、QR-09）、到着予定時刻と確定額になる料金を示し、どちらかの場所を変えると見積もり直し（FR-03）、依頼する（FR-04、FR-54）。この手配で乗客が乗る場所を決め始めた時刻を持ち、依頼に添える（FR-45 の 1、IFC-03）。依頼の後はドライバーを探していることと、T_wait_prompt の問い、見つからなかった知らせ、取り消しを示す（FR-04、FR-07、FR-23）。閾値を満たすドライバーが見つからなかったときは、そのことを示し、閾値を変えて（IFC-08）依頼し直せるようにする（FR-05 の 4）
  - name: 迎車
    does: 確定した配車のドライバーの名前と車の手がかり（FR-06、FR-09）、迎車の位置と着く見込み（FR-08）、確認コードと画面が乗車中に変わってから乗る案内（FR-12 の 1）、ドライバーとの連絡（FR-11）、迎車の到着（FR-10）、取り消しとキャンセル料の確かめ（FR-07）を示す
  - name: 乗車中
    does: 降りる場所と車の今いる場所（FR-13）、降りる場所の変更と料金の承認（FR-47）、到着を確認したことと場所（FR-13 の 2）を示す
  - name: 乗車後
    does: 支払った額と確定した料金と区間（FR-31 の 1）、決済が拒否されたか済んだかどうか分からないこと（FR-29 の 4、5）を示し、少ない操作で評価を送らせる（FR-15、QR-68）。評価の入力に初めて触れたら、評価を始めたことを端末からの報告で送る（FR-45 の 4、IFC-10）。一つの乗車の請求は一度だけ示す（FR-30）
  - name: 設定
    does: 評価の閾値（FR-16）と支払い方法の登録（FR-46、IFC-18 の入力部品）
  - name: 乗車の履歴
    does: 過去の乗車と料金を請求した依頼の一覧と詳しい内容（FR-31 の 2〜4、返金の額、FR-39）、苦情と返金の求めを寄せる（FR-37）
  - name: 知らせ
    does: アプリが画面に出ていない間に Web Push で示す知らせ（FR-04、FR-06、FR-10、FR-13、FR-23、FR-26、FR-31、FR-39、IFC-21）。押すと対応する画面を開き、今の状態を読み直す
format: HTML と CSS（ホーム画面に加えた Web アプリ、DEC-02）。文言は日本語で文言のファイルから引き、日時、数、額は ja-JP、Asia/Tokyo、円で示す（POL-04）
protocol: iOS 18.4 以降の Safari の、ホーム画面に加えた Web アプリ（DEC-02）。ELM-03 とは IFC-01〜IFC-11 で話す
auth: サインインしたセッション（DEC-40）。止めた機能と許されていない機能は示さない（FR-36 の 3、FR-49 の 1）
errors:
  - case: 場所が見つからない、乗る場所と降りる場所が同じ、道がない、現在地に当てはまる住所がない
    signal: IFC-02 の答え
    caller_does: そのことを示してほかの場所を求め、決めてあった場所は残し、依頼させない（FR-01 の 3、4、FR-02 の 3、FR-03 の 4）
  - case: 端末が現在地を得られない（位置の許しがない、測れない）
    signal: 端末の位置の取得の失敗（ELM-03 は呼ばない）
    caller_does: 現在地を示せないことを伝え、乗る場所を入れるよう求める（FR-02 の 3）
  - case: 地図のサービスが答えない
    signal: IFC-02 の MAP_SERVICE_UNAVAILABLE
    caller_does: 場所を探せないか、到着予定時刻と料金を示せないことを示し、依頼させない（FR-01 の 5、FR-03 の 5）
  - case: 支払い方法がない、依頼が進んでいる、押さえが拒否された、押さえの結果が分からない
    signal: IFC-03 の答え
    caller_does: 支払い方法の登録へ移る、進んでいる依頼を示す、理由を示して支払い方法を変えさせる、受け付けなかったことと押さえが済んでいたら解くことを示す（FR-04 の 4、5、FR-54 の 2、3）
  - case: 迎車の位置が分からなくなった、着く見込みを示せない
    signal: 流れの position.updated の測った時刻が古い、ride.eta_updated が示せない
    caller_does: 最後に分かった位置とその時刻を示し、今の位置が分からないことを伝える（FR-08 の 2、FR-13 の 3）
  - case: 走っているドライバーからは止まるまで返事が来ない、連絡できない場面
    signal: IFC-06 の答えと流れ
    caller_does: ドライバーが止まってから読むことを示す（DEC-27）。取り消しか乗車の後は連絡できないことを示す（FR-11 の 2）
  - case: 取り消しにキャンセル料がかかる、乗車が始まっている
    signal: IFC-03 の答え
    caller_does: キャンセル料を示して確かめさせる、取り消さない（FR-07 の 2、4）
  - case: 降りる場所を変えられない（場所か道がない、地図のサービスが答えない、押さえ直せない、到着の後）
    signal: IFC-03 の答え
    caller_does: 変えられないことと、降りる場所と確定した料金が変わらないことを示す（FR-47 の 4〜6、FR-54 の 4）
  - case: 評価できない、評価済み
    signal: IFC-09 の答え
    caller_does: そのことを示す（FR-15 の 4、5）
  - case: 履歴が空、決済が済んでいない乗車
    signal: IFC-09 の答え
    caller_does: 乗車がないことを示す。済んでいない乗車は済んでいないと分かるように示す（FR-31 の 4）
  - case: 決済が拒否された、決済の結果が分からない
    signal: 流れの ride.charge_settled（IFC-11）
    caller_does: 済んでいないことと理由を示して支払い方法の変更（IFC-07、IFC-03）へ移る、済んだかどうか分からないことを示して結果を待つ（FR-29 の 4、5）
  - case: 決済サービスが決済を処理せず、済んでいない（結果が分からなかった決済を確かめて分かったときを含む）
    signal: 流れの ride.charge_settled（IFC-11）
    caller_does: 済んでいないことを示し、ドライバーのやり直しを待つ。支払い方法は変えなくてよい（変えようとして PAYMENT_PENDING_CONFIRMATION を受けたら、やり直しの結果を待つ。FR-29 の 1、5、DEC-45）
  - case: 決済の結果がまだ定まらない間（結果を確かめている間と、決済サービスが処理しなかった決済の要求が後で効きうるため、ドライバーのやり直しで結果が決まるまで）に支払い方法を変えようとした
    signal: IFC-03 の PAYMENT_PENDING_CONFIRMATION
    caller_does: 結果が分かるまで変えられないことを示し、ride.charge_settled を待つ（FR-46 の 5、DEC-45）
  - case: 閾値を満たすドライバーが見つからずに依頼が終わった
    signal: 流れの ride.expired（閾値のため）
    caller_does: そのことを示し、閾値を変えて依頼し直せるようにする（FR-05 の 4）
  - case: 支払い方法を登録できなかった、登録できたか分からない
    signal: IFC-07 の答え
    caller_does: 理由を示して別の支払い方法を求める、分かるまでその支払い方法を使えないことを示す（FR-46 の 3、4）
  - case: 本人を確かめられない、使えない機能
    signal: IFC-01 の答え、DEC-35 の 401 と 403
    caller_does: 確かめられなかったことを示す、その機能を使えないことを示す（FR-48 の 2、FR-49 の 1）
  - case: ELM-03 とつながらない
    signal: 呼び出しのタイムアウトと流れの切れ
    caller_does: 送っていることを示し、送り直す操作を持って、つながったら同じ冪等キーで送り、今の状態を読み直す（DEC-08、QR-02）
idempotency: 画面は利用者の一回の操作ごとに冪等キーとたどる ID を作り、答えを受けるまで同じもので送り直し、その間は送っていることを示す（DEC-08、DEC-42、DEC-43）
timing:
  timeout: 相手の変化を示すまでの端末の分（画面に示すまで）は NFR-07 の予算のホップ（DEC-46）。呼び出しのタイムアウトは各 IFC。画面の細部の時間は第 4 段階が決める（HND-17）
  ordering: null
  delivery: null
versioning: 起動の値の buildId が自身の版と違えば読み直す（DEC-41）
observability: 予期しない失敗を端末のエラーとして ELM-03 に送り（FR-52、IFC-10）、相手の変化を示した時刻を送る（FR-53、IFC-10）
sli_bindings: []
spec: null
as_is: new
