id: IFC-24
title: 運営・サポートの担当者の画面
status: active
basis: inferred
basis_note: 画面の機能と、受け入れ基準が挙げる誤りと空の状態は FR-37〜FR-44、FR-48〜FR-50（入力）。作成と登録の前に入れた内容を示して担当者に確かめさせることは FR-41 の 1 と FR-43 の 1（入力）で、画面の中の確かめの段として作る（推定）。担当者がコンピューターの主なブラウザで使うことは DEC-03（入力）。見せる範囲と隠し方は決めず ELM-03 が送ったものを示すことは ELM-02（入力）。訂正、試験用の区別、設定の符号の出し直し、登録の訂正、停止と再開の相手を、探して今の内容を確かめてから選ぶことは FND-25 を受けた（推定）
premises: []
kind: screen
name: 運営・サポートの担当者の画面（ELM-02）
provider: ELM-02
consumers: [USR-04]
functions: [FR-37, FR-38, FR-39, FR-40, FR-41, FR-42, FR-43, FR-44, FR-48, FR-49, FR-50]
operations:
  - name: 使い始め
    does: サインインし、使い終える（FR-48）。異常と苦情の知らせを受ける許しを求める
  - name: 苦情と返金の求め
    does: 受けたものと終えたものを分けた一覧と、対応を終える操作（FR-37）
  - name: 乗車の照会
    does: 乗客、ドライバー、期間で探し、乗車と料金を請求した依頼の記録を示す（FR-38）
  - name: 返金
    does: 乗車の返金の一覧と返金できる残りの額、認めた額の返金とやり直し、結果（FR-39、FR-40）
  - name: アカウント
    does: 乗客かドライバーを選んで入れた内容を示して確かめてから作り、サインインの ID と設定の符号を示す。種類、名前、サインインの ID、連絡先などで探した一覧から選んだアカウントの今の内容（試験用かを含む）を示し、訂正、試験用の区別の変更、設定の符号の出し直しをそのアカウントに行う（FR-41、FR-42、DEC-14、IFC-12 の accounts/search と accounts/{accountId}）
  - name: ドライバーと車両の登録
    does: 入れた内容を示して確かめてから登録する。探した一覧から選んだドライバーの今の登録を示して訂正する。審査の日付や手がかりの入れ物を持たない（FR-43、IFC-12 の drivers/{accountId}）
  - name: ドライバーの停止と再開
    does: 探した一覧から選んだドライバーが停止しているかと進んでいる依頼を示し、停止と再開を行う（FR-44）
  - name: 操作の記録
    does: 担当者、期間、操作の種類、対象で探す（FR-50）
format: HTML と CSS。文言は日本語で文言のファイルから引く（POL-04）
protocol: コンピューターの Chrome、Edge、Firefox、Safari の今の版と一つ前の版（DEC-03）。ELM-03 とは IFC-01、IFC-10〜IFC-13 で話す
auth: 担当者のセッション（DEC-40）。許されていない機能は示さない（FR-49 の 1）
errors:
  - case: 必要な項目の欠け、形の誤り、すでにあるアカウント、登録済みのナンバー
    signal: IFC-12 の答え
    caller_does: どの項目かを示し、作成と登録をしない（FR-41 の 2、3、FR-43 の 3）
  - case: すでに停止している、停止したドライバーに進んでいる依頼がある
    signal: IFC-12 の答え
    caller_does: 停止していることを示す、進んでいる依頼を示す（FR-44 の 5、6）
  - case: 探して見つからない
    signal: IFC-12 の空の items
    caller_does: 見つからないことを示す（FR-38 の 4、FR-50 の 2）
  - case: 選んだアカウントが個人を特定できない形に変わっている
    signal: IFC-12 の状態（使えなくなった）と ACCOUNT_RETIRED
    caller_does: 訂正できないことを示し、新しいアカウントを作るよう示す（FR-51 の 4）
  - case: 返金できない、残りを超える、拒否された、結果が分からない、済んだ返金のやり直し
    signal: IFC-13 の答え
    caller_does: 受け付けないことを示す、残りの額を示す、済んでいないことと理由を示してやり直せる、分からないことを示して結果を待つ、最初の結果を示す（FR-39 の 2、4、FR-40 の 1〜3）
  - case: 本人を確かめられない、使えない機能
    signal: IFC-01 の答え、DEC-35 の 401 と 403
    caller_does: 確かめられなかったことを示す、その機能を使えないことを示す（FR-48 の 2、FR-49 の 1）
idempotency: 画面は操作ごとに冪等キーとたどる ID を作り、答えを受けるまで同じもので送り直す（DEC-42、DEC-43）
timing:
  timeout: 画面の時間は第 4 段階が決める（HND-18）。呼び出しのタイムアウトは各 IFC
  ordering: null
  delivery: null
versioning: 起動の値の buildId が自身の版と違えば読み直す（DEC-41）
observability: 予期しない失敗を ELM-03 に送る（IFC-10）
sli_bindings: []
spec: null
as_is: new
