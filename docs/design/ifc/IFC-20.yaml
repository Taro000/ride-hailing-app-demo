id: IFC-20
title: Cloud Logging の読み出し
status: draft
version: 1
basis: inferred
basis_note: DEC-16（SLI-01 は入口のログ、毎日の処理が数える。テスト用アカウントはトレース ID で結んで除く）は入力。読み出しの API、欄、結ぶ鍵（trace と spanId）は推定（最初の配備で確かめる。DEC-44）
needs_agreement: false
approver_candidates: []
kind: http
name: Cloud Logging の読み出し（外部）
provider: ELM-08
consumers:
- ELM-05
functions:
- FR-36
operations:
- name: entries.list（Logging API v2）
  does: 前日（日本時間）の入口の要求のログ（run.googleapis.com/requests）と、アプリの request.completed のログを読む
format: JSON（LogEntry）。入口のログは httpRequest（requestMethod、requestUrl、status、latency）、trace、spanId、timestamp
protocol: HTTPS（logging.googleapis.com）
auth: ジョブのサービスアカウントの、ログを読む権限
errors:
- case: 読み出しの割り当て
  signal: '429'
  caller_does: 間を置いて送り直す
- case: 5xx、タイムアウト
  signal: —
  caller_does: 3 回まで送り直す
- case: 権限がない
  signal: '403'
  caller_does: 失敗として終わる
- case: 読み終えられない
  signal: —
  caller_does: その日の SLI-01 を終えたと記録しない（DRV-33）
idempotency: 読むだけ
timing:
  timeout: 1 回 30 秒（仮）。pageToken で続けて読む
  ordering: null
  delivery: null
versioning: Logging API v2
observability: job.task のログに読んだ件数
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
