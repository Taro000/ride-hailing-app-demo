id: IFC-12
title: 手元の保守の手順
status: draft
version: 2
basis: inferred
basis_note: DEC-28（デモの回の終わりの書き出し、暗号化、最新の二つ）、DEC-36 版 2（終えるときに消す。Stripe のデモと CI のサンドボックスは最後に人の手で消す）、DEC-34（開発者の手元のログイン）は入力。コマンドの名前、ファイル名の形、書き終えてから名前を付けることは推定
needs_agreement: false
approver_candidates: []
kind: batch
name: 手元の保守の手順
provider: ELM-22
consumers:
- USR-03
functions: []
operations:
- name: export
  does: デモの回の終わりに Turso の .dump を取り、その場でパスフレーズから改ざんも見分ける暗号化をして置く。平文を残さない
- name: prune
  does: 書き出しを最新の二つだけ残す
- name: restore
  does: 書き出しか、時点を指定した復元（直近 24 時間）から新しいデータベースを作り、接続先の秘密を替える手順を示す（NFR-38 の訓練も同じ）
- name: unarchive
  does: 保管に回ったデータベースを戻す（期間を始める前）
- name: destroy
  does: システムを終えるとき、データベースと書き出しを消す（確かめの文を入れたときだけ）。最後に、Stripe のダッシュボードでデモと CI のサンドボックスを消すよう案内を示す（消すのは人の手。DEC-36 版 2）
format: 書き出しは Turso の .dump の SQL を暗号化したファイル一つ。名前は ride-demo-<データベース>-<UTC の日時>.sql.enc、中にチェックサムを持つ（道具は第 4 段階）
protocol: 開発者の手元の機械（ELM-21）で動くリポジトリの中のスクリプト（tools/maintenance）→ Turso の CLI（IFC-22）
auth: 開発者自身の Turso のログイン（組織全体。DEC-34）。パスフレーズはパスワードの管理から都度入れる
errors:
- case: 書き出しの途中で失敗
  signal: 中途のファイルを消す
  caller_does: 前の二つが残る。もう一度動かす（書き終えて確かめてから名前を付ける）
- case: 復号できない（パスフレーズの違い、改ざん）
  signal: 止まる
  caller_does: もう一つの書き出しか、時点を指定した復元を使う
- case: Turso の CLI の失敗
  signal: その段で止まる
  caller_does: 原因を直して動かし直す
- case: destroy の確かめの文が違う
  signal: 何もしない
  caller_does: —
idempotency: export は新しいファイルを作るだけ。prune は何度でも同じ。restore は新しいデータベースを作り元を変えない。destroy の二度目は「ない」で終わる
timing:
  timeout: null
  ordering: null
  delivery: null
versioning: ファイル名と中身の形に版を持つ
observability: 手元の端末に結果を出す。書き出しの日時はファイル名に、チェックサムは中に残る
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: destroy の最後に、Stripe のデモと CI のサンドボックスをダッシュボードで消す案内を示すことを足した
  reason: '第 3 段階の再実行（2026-11-04）: 第 2 段階の DEC-36 版 2（FND-26 の受け入れ）'
