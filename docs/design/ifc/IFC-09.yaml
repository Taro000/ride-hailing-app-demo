id: IFC-09
title: 乗車の履歴、評価、苦情と返金の求め
status: active
basis: inferred
basis_note: 乗車の履歴に日時、区間、支払った額、返金の額、キャンセル料と不在の料金、済んでいない決済を示すことは FR-31（入力）。評価を 1〜5 で一つの乗車に一つだけ受け、乗車が始まらなかった依頼には受けないことは FR-15（入力）。評価とまとめた評価を同じ取引で書き、新しい評価をその時から規則に使うことは DEC-24（入力）で、NFR-34 の T_rating_reflect にその取引の時間で収まる（報告の「遅延の予算とタイムアウト」）。苦情と返金の求めを自分の乗車についてだけ受けることは FR-37（入力）。操作と誤りの符号は DEC-35、DEC-42 による推定。過去の乗車の一覧の経路を DEC-44 の複数形の名詞にしたことは FND-31 を、評価を始めたことを端末からの報告（IFC-10）で受け、ここでは評価を記録したことを依頼の経過に残すことは FND-24 を受けた
premises: []
kind: http
name: 乗車の履歴、評価、苦情と返金の求め
provider: ELM-03
consumers: [ELM-01]
functions: [FR-15, FR-31, FR-37]
operations:
  - name: GET /v1/past-rides
    does: 乗客の過去の乗車と、キャンセル料か不在の料金を請求した依頼を、日時、区間、支払った額、返金の額、請求した額とその種類、決済が済んでいるかとともに新しい順に返す（FR-31 の 2〜4、DEC-39）
  - name: GET /v1/past-rides/{rideId}
    does: 一つの乗車の支払った額、確定した料金、乗った区間（降りる場所を変えたときは変えた後の区間と承認した料金）、返金、評価を返す（FR-31 の 1）
  - name: POST /v1/rides/{rideId}/rating
    does: 乗り終えた乗客の評価（1〜5、ドライバーの振る舞いと車の状態の選んだ項目、任意の短い文）を記録し、同じ取引でドライバーのまとめた評価（すべての評価の平均と件数）を書き直す（FR-15、DEC-24）
  - name: POST /v1/rides/{rideId}/complaints
    does: 乗客が自分の乗車について苦情か返金の求めを寄せる。乗車と結び付けて受け付け、担当者に流れ（IFC-11 の complaint.received）で知らせる（FR-37 の 1）
format: JSON（UTF-8）。額は DEC-38、時刻は DEC-37
protocol: HTTPS の要求と応答
auth: 乗客のセッション（DEC-40）。その乗客の乗車と依頼だけを返し、ほかは存在を明かさず 404 NOT_FOUND（FR-49 の 2、FR-37 の 3）
errors:
  - case: どの操作にも共通する誤りと、冪等キーの誤り
    signal: DEC-35 と DEC-42 の符号
    caller_does: DEC-35 と DEC-42 のとおり
  - case: 乗車が始まらなかった依頼（取り消し、乗客の不在、許諾のないまま終わった）か、終わっていない乗車を評価しようとした
    signal: 409 with code RATING_NOT_ALLOWED
    caller_does: 評価できないことを示す（FR-15 の 4）
  - case: すでに評価した乗車にもう一度評価しようとした
    signal: 409 with code ALREADY_RATED
    caller_does: 評価済みであることを示し、二つ目を記録しない（FR-15 の 5）
  - case: 評価が 1〜5 の範囲にない
    signal: 400 with code VALIDATION_FAILED (details score OUT_OF_RANGE)
    caller_does: 1〜5 で選ばせる
  - case: 自分の乗っていない乗車について寄せようとした
    signal: 404 with code NOT_FOUND
    caller_does: 受け付けないことを示す（FR-37 の 3）
  - case: 履歴が一件もない
    signal: 200 で空の items
    caller_does: 乗車がまだないことを示す
idempotency: GET は繰り返してよい。評価と苦情は冪等キー（DEC-42）を付ける。評価は一つの乗車に一つだけ記録するので、新しいキーでの二度目も ALREADY_RATED を受ける
timing:
  timeout: 評価（POST /v1/rides/{rideId}/rating）は NFR-34 の道にあり、外部を呼ばないため ELM-03 の答えの期限は 2 秒、ELM-01 のタイムアウトは 10 秒（DEC-46）。履歴と苦情は枠だけを決め、ELM-03 の期限は自身の取引の最悪より長く、ELM-01 のタイムアウトはその期限に通信の余裕を足したものより長い。値は第 4 段階が決める（ELM-01 は HND-17、ELM-03 の期限は HND-19）
  ordering: null
  delivery: null
versioning: DEC-41
observability: 境界の出来事（DAT-19）と依頼の経過（DAT-09。評価を記録したこと、FR-45 の 4。評価を始めたことは端末からの報告で IFC-10 が受ける）に残す。苦情の中身と評価の文は暗号にして持ち（DEC-16）、ログに書かない
sli_bindings: []
spec: null
as_is: new
