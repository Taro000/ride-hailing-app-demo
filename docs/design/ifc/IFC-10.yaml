id: IFC-10
title: 毎日の処理と運用のコマンド
status: draft
version: 2
basis: inferred
basis_note: DEC-05（Cloud Scheduler と Cloud Run のジョブ、毎朝 06:00、追いつき）、DEC-13（突き合わせ）、DEC-17（45 分、やり直し 1 回、黙って成功しない。二つ目の規則は運用のジョブを見ない）、第 2 段階の DEC-27 版 3・4（手順はデータベースの資格情報を持たず、データベースに触れる段は運用のジョブで動かす）、DEC-34 版 2（運用のジョブは別のサービスアカウント。毎日の処理のジョブは自分の定時の起動と二つ目の規則を止められる）、DEC-37 版 4（期間の終わりは毎日の処理が (A) と (B) を確かめて決める）は入力。処理の順、処理ごとの上限、運用のコマンドの名前と終わりの符号は推定（DEC-53 版 2）
needs_agreement: true
approver_candidates:
- 開発の責任者
kind: batch
name: 毎日の処理と運用のコマンド
provider: ELM-05
consumers:
- ELM-06
- ELM-04
functions:
- FR-08
- FR-29
- FR-30
- FR-36
- FR-41
- FR-53
- FR-55
operations:
- name: daily
  does: 'Cloud Scheduler が毎朝 06:00（日本時間）に起動する（デモの期間だけ）。期間を始めるときと手でも起動する。終わっていない日ごとに次の順で動く: (1) 手配から T_request_max を過ぎた許諾のない依頼（サービスが消えた後に残ったもの）を、配車のモジュールでシステムの取り消しとして終え（押さえの取り消しを送る。第 2 段階の DEC-37 の (A)）、確かめ中のお金の操作を片付ける、(2) Stripe との突き合わせ（FR-55）と NFR-07 の 1 件ごとの知らせ、(3) 履歴の確かめ（SLI-05）と毎日の監視（NFR-09、14、21、24、25、29、45 と消し忘れたサービス）、(4) SLI の集計（SLI-01〜05。SLI-03 は受信の記録、受付、状態の履歴、前面と裏、デモの回の開け閉めの記録から確かめ直し、DAT-21 は使わない）、(5) 保存期間の処理（FR-53）と NFR-41、(6) 期間を終える条件の記録（(A) と (B) の件数、最後の回の印）と毎日の結果の知らせ。最後の回の印があり (A) と (B) が 0 件なら、定時の起動と二つ目の規則を止め、期間を終えたと DAT-26 と DAT-24 に書いて知らせる。(B) が残れば待たずに知らせる'
- name: migrate
  does: 構造の変更（足すだけ）を当てる（デモを開く前。ELM-06 が運用のジョブで動かす）
- name: record-deploy
  does: 配備と開け閉めの記録（DAT-26）に一行書く。ELM-06 が引数で、版、段（start_period、open、close、rollback、end_period など）、変更ごとの最初のコミットの時刻と main で CI が通った時刻（GitHub から集めたもの）、デモの回を開いた時刻と閉じた時刻、閉じる操作の失敗、最後の回の印、理由、強いて進めたかを渡す（FR-41 AC2・4）
- name: count-open
  does: 終わっていない依頼、処理中と確かめ中のお金の操作、確定も解放もしていない押さえをその場で数える（デモを閉じる前。ELM-06 が運用のジョブで動かす）
- name: period-status
  does: 毎日の処理が書いた期間の要約（(A) と (B) の件数、最後の回の印、期間を終えたか）を返す（期間を強いて終える前。ELM-06 が運用のジョブで動かす）
- name: check-turso
  does: Turso が答えるかを確かめる（期間を始める前。ELM-06 が運用のジョブで動かす）
- name: 出力の表
  does: 突き合わせの結果（DAT-23）、毎日の処理の記録（DAT-24）、SLI の日ごとの値（DAT-25）、配備と開け閉めの記録（DAT-26。運用のジョブが書き、期間を終えた記録は毎日の処理が書く）。ELM-04 は DAT-23 を読むだけ（FR-49 AC3）。ELM-06 は運用のコマンドを通して DAT-24 を読み DAT-26 を書き、表を直接は読み書きしない（DEC-53）
format: 'daily は記録（DAT-23〜26）と知らせ（IFC-17）。運用のコマンドは標準出力に JSON 一つ（schema_version、数、依頼 ID と状態だけの一覧）とタスクの終わりの符号（0: 成功・0 件・終えられる、10: 残りがある・まだ、20: Turso に届かない、1: そのほかの失敗）'
protocol: 同じイメージのコマンドを二つの Cloud Run のジョブで動かす（DEC-05、第 2 段階の DEC-34）。daily は毎日の処理のジョブの実行。運用のコマンド（migrate、record-deploy、count-open、period-status、check-turso）は運用のジョブの実行で、ELM-06 が鍵を置かない連携で引数を付けて起こし、タスクの終わりの符号を読む（IFC-21。第 2 段階の DEC-27 版 3）
auth: 毎日の処理のジョブはそのサービスアカウントで Secret Manager の Stripe、Turso、チャットの資格情報を読み、自分の定時の起動と二つ目の規則を止める権限だけを足して持つ（第 2 段階の DEC-34 版 2）。運用のジョブは別のサービスアカウントで Turso のトークンだけを読む。ELM-06 はデータベースの資格情報を持たない
errors:
- case: 'daily: Stripe から記録を取り出せない'
  signal: その日の突き合わせを終えたと記録しない。終わりの符号 1
  caller_does: 知らせ、次の実行で残りの日を続ける（FR-55 AC3、DRV-33）。ジョブの失敗は ELM-14 の二つ目の規則が知らせる（DEC-17）
- case: 'daily: 確かめ中のお金の操作を片付けられない（Stripe が答えない）'
  signal: 確かめ中のまま残し、数を記録と知らせに載せる
  caller_does: 次の実行で続ける。期間を終える条件は満たさない（DEC-37）
- case: 'daily: Cloud Logging を読み終えられない'
  signal: その日の SLI-01 を終えたと記録しない
  caller_does: 次の実行で続ける
- case: 'daily: 保存期間の処理が途中で失敗'
  signal: 変えられなかった件数を記録する
  caller_does: 次の実行で残りを続ける（FR-53 AC3）
- case: 'daily: 知らせを送れない'
  signal: 終わりの符号 1（黙って成功しない。DEC-17）
  caller_does: ジョブの失敗として ELM-14 が知らせる
- case: 'daily: Turso に届かない（保管に回った、トークン）'
  signal: 何もせず終わりの符号 1
  caller_does: 同上。期間を始めるときは ELM-06 が先に止まる（check-turso の 20）
- case: 'daily: (B)（許諾の後の終わっていない依頼とその押さえ）が残っている'
  signal: 期間を終えず、毎日の結果の知らせに (B) の一覧（依頼 ID と状態だけ）を載せる
  caller_does: 運用者はサービスを開いて参加者に依頼を終えてもらうか、ELM-06 の end-period で強いて終える。人が動くまで毎朝知らせる（第 2 段階の DEC-37 版 4）
- case: 'daily: 期間を終える条件を満たしたのに、定時の起動か二つ目の規則を止められない'
  signal: 期間を終えたと記録せず終わりの符号 1
  caller_does: ジョブの失敗として ELM-14 が知らせる。次の実行でやり直すか、人が ELM-06 の end-period で止める
- case: 'migrate: 構造の変更を当てられない'
  signal: 1（Turso に届かなければ 20）
  caller_does: ELM-06 は配備せずに止まる（本番は前の版のまま。FR-41 AC5）
- case: 'record-deploy: 記録を書けない'
  signal: 1（Turso に届かなければ 20）
  caller_does: ELM-06 はその段で手順の失敗にして動かし直す（同じ記録は二度書かない）
- case: 'count-open: 残りがある'
  signal: 10 と一覧（依頼 ID と状態だけ）
  caller_does: ELM-06 はデモを閉じずに止まり、一覧を示す（DEC-37）
- case: 'period-status: 残りがある、または最後の回の印がない'
  signal: '10'
  caller_does: ELM-06 は期間を終えずに止まる。理由を付けて強いて終えるときだけ進む（第 2 段階の DEC-37 版 4）
- case: '運用のコマンド: Turso に届かない'
  signal: '20'
  caller_does: ELM-06 は止まり、手元の手順（IFC-12）で保管から戻すよう示す
idempotency: daily は日ごとと処理ごとの終わりの記録で、終わった処理を飛ばす（二度動いても数え直さない）。お金の操作の片付けはリース（DAT-13）を取った一つだけが行う（見回りと重なっても一度だけ）。システムの取り消しは条件付きの書き込みで一度だけ効く。migrate は当てた版を飛ばす。record-deploy は手順の実行と段の組で一行だけ書く。count-open、period-status、check-turso は読むだけ
timing:
  timeout: ジョブの一回 45 分、やり直し 1 回（DEC-17）。処理ごとの上限は DEC-53 の値（合計 42 分。仮）。Stripe の呼び出しは 1 回 10 秒、読むだけは 3 回まで送り直す。Cloud Logging は 1 回 30 秒。運用のコマンドは手順ごとの上限（IFC-11）の内
  ordering: 古い日から順に、日の中は上の順
  delivery: null
versioning: 記録と JSON の出力は schema_version を持つ。足すだけ
observability: 処理と運用のコマンドごとに job.task のログ。毎日の結果を知らせ（成功でも送る。DEC-17）、期間の要約（(A) と (B) の件数、最後の回の印、period_end_ready）を書く。期間を終えたら DAT-26 と DAT-24 に書いて知らせる。毎日の SLI-03 は受信の記録（DAT-09。受けた時刻だけ）、受付（DAT-04）、状態の履歴（DAT-07）、前面と裏（DAT-19）、デモの回の開け閉め（DAT-26）から確かめ直して DAT-25 に書き、サーバーの毎分の確かめ（DAT-21）はアラートだけに使う（SLI-03 版 2）。毎日の処理のジョブの実行の結果は ELM-14 の二つ目の規則が見る（運用のジョブは見ない）
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 運用のコマンドに migrate、record-deploy、check-turso を足し、五つとも運用のジョブ（別のサービスアカウント）で動かし、ELM-06 は起こしてタスクの終わりの符号を読むとした（GitHub Actions で ELM-06 の Turso のトークンを使う形をやめた）。毎日の処理が期間の終わりを決める形（最後の回の印があり (A) と (B) が 0 件なら定時の起動と二つ目の規則を止め、DAT-26 と DAT-24 に書いて知らせる。(B) は待たずに知らせる）とそのエラーを書いた。(1) に T_request_max を過ぎて残った依頼のシステムの取り消しを足した。毎日の SLI-03 を記録から確かめ直すと書いた。period-status を強いて終える前の確かめにした。functions に FR-08 と FR-41 を足した
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-08 版 2、FR-41 版 3・4、SLI-03 版 2）、第 2 段階の DEC-27 版 3・4、DEC-34 版 2、DEC-37 版 3・4（FND-19・22 の受け入れ）、DEC-53 版 2'
