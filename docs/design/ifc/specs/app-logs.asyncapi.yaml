asyncapi: 3.0.0
info:
  title: アプリの構造化ログ（IFC-09）
  version: 1.1.0
  description: ELM-04 と ELM-05 が標準出力に 1 行 1 JSON で書き、Cloud Run が Cloud Logging（ELM-08）に送る。届け方は最善の努力（欠けは 0.1% 未満と仮定。SLI-01）。順は保証しない（timestamp で並べる）。欄は DEC-44。どの行にも timestamp、severity、message、logging.googleapis.com/trace、logging.googleapis.com/spanId、client_trace_id、event、schema_version、service、app_version を書く。項目は docs/design/ifc/IFC-09.yaml
defaultContentType: application/json
servers:
  cloudrun:
    host: stdout
    protocol: stdout
    description: コンテナの標準出力（Cloud Run が Cloud Logging に送る）
channels:
  stdout:
    address: stdout
    messages:
      requestCompleted:
        $ref: '#/components/messages/requestCompleted'
      externalCall:
        $ref: '#/components/messages/externalCall'
      moneyOp:
        $ref: '#/components/messages/moneyOp'
      clientError:
        $ref: '#/components/messages/clientError'
      notification:
        $ref: '#/components/messages/notification'
      jobTask:
        $ref: '#/components/messages/jobTask'
      authEvent:
        $ref: '#/components/messages/authEvent'
      streamEvent:
        $ref: '#/components/messages/streamEvent'
      appError:
        $ref: '#/components/messages/appError'
operations:
  send_requestCompleted:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/requestCompleted'
  send_externalCall:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/externalCall'
  send_moneyOp:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/moneyOp'
  send_clientError:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/clientError'
  send_notification:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/notification'
  send_jobTask:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/jobTask'
  send_authEvent:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/authEvent'
  send_streamEvent:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/streamEvent'
  send_appError:
    action: send
    channel:
      $ref: '#/channels/stdout'
    messages:
    - $ref: '#/channels/stdout/messages/appError'
components:
  messages:
    requestCompleted:
      name: request.completed
      title: 要求ごとに一行
      payload:
        type: object
        required:
        - timestamp
        - severity
        - message
        - logging.googleapis.com/trace
        - logging.googleapis.com/spanId
        - client_trace_id
        - event
        - schema_version
        - service
        - app_version
        - route_id
        - method
        - status
        - elapsed_ms
        properties:
          timestamp:
            type: string
            format: date-time
          severity:
            type: string
            enum:
            - DEBUG
            - INFO
            - WARNING
            - ERROR
          message:
            type: string
          logging.googleapis.com/trace:
            type: string
            description: projects/<PROJECT>/traces/<X-Cloud-Trace-Context のトレース ID>
          logging.googleapis.com/spanId:
            type: string
          client_trace_id:
            type: string
            pattern: ^[0-9a-f]{32}$
          event:
            type: string
          schema_version:
            type: integer
            const: 1
          service:
            type: string
            enum:
            - server
            - batch
          app_version:
            type: string
          account_id:
            type: string
            pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
          account_kind:
            type: string
            enum:
            - participant
            - staff
            - test
            description: participant（乗客とドライバー）、staff（運営・サポート担当とエンジニア）、test（テスト用の印のあるアカウント）。SLI-01 は participant だけを数え、test を除く。staff は SLI-01 の操作を呼ばない（DEC-44）
          ride_id:
            type: string
            pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
          route_id:
            type: string
          method:
            type: string
          status:
            type: integer
          elapsed_ms:
            type: integer
        description: '書かない: 座標、連絡先、名前、場所の検索の語、自由記述（苦情、報告）、カードの情報、クッキー、トークン、秘密、Webhook の URL、要求と応答の本文、IP アドレス（入口のログには残る。DEC-44）'
    externalCall:
      name: external.call
      title: 外部の呼び出しごとに一行
      payload:
        type: object
        required:
        - timestamp
        - severity
        - message
        - logging.googleapis.com/trace
        - logging.googleapis.com/spanId
        - client_trace_id
        - event
        - schema_version
        - service
        - app_version
        - target
        - operation
        - outcome
        - elapsed_ms
        properties:
          timestamp:
            type: string
            format: date-time
          severity:
            type: string
            enum:
            - DEBUG
            - INFO
            - WARNING
            - ERROR
          message:
            type: string
          logging.googleapis.com/trace:
            type: string
            description: projects/<PROJECT>/traces/<X-Cloud-Trace-Context のトレース ID>
          logging.googleapis.com/spanId:
            type: string
          client_trace_id:
            type: string
            pattern: ^[0-9a-f]{32}$
          event:
            type: string
          schema_version:
            type: integer
            const: 1
          service:
            type: string
            enum:
            - server
            - batch
          app_version:
            type: string
          account_id:
            type: string
            pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
          account_kind:
            type: string
            enum:
            - participant
            - staff
            - test
            description: participant（乗客とドライバー）、staff（運営・サポート担当とエンジニア）、test（テスト用の印のあるアカウント）。SLI-01 は participant だけを数え、test を除く。staff は SLI-01 の操作を呼ばない（DEC-44）
          ride_id:
            type: string
            pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
          target:
            type: string
            enum:
            - stripe
            - maps
            - chat
            - cloud_logging
          operation:
            type: string
          outcome:
            type: string
            enum:
            - ok
            - error
            - timeout
          elapsed_ms:
            type: integer
          remote_request_id:
            type: string
          idempotency_key:
            type: string
        description: '書かない: 座標、連絡先、名前、場所の検索の語、自由記述（苦情、報告）、カードの情報、クッキー、トークン、秘密、Webhook の URL、要求と応答の本文、IP アドレス（入口のログには残る。DEC-44）'
