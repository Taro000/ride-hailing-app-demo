                    code: NO_ROUTE
                    detail: 乗る場所と降りる場所の間に経路がない（FR-02 AC6）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                PICKUP_NOT_CONFIRMED:
                  value:
                    type: urn:ride-hailing-demo:problem:pickup_not_confirmed
