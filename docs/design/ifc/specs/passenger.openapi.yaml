          description: 'IDEMPOTENCY_KEY_REUSED: 同じ冪等キーで中身の違う要求（DEC-48） → 画面の誤り。新しい操作として新しいキーで始める'
          x-error-codes:
          - IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    type: urn:ride-hailing-demo:problem:idempotency_key_reused
                    title: 同じ冪等キーで中身の違う要求（DEC-48）
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: 同じ冪等キーで中身の違う要求（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      x-route-id: passenger.payment_methods.delete
      x-functions:
      - FR-04
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。クッキーは __Host-rh_session（HttpOnly、Secure、SameSite=Strict、Path=/）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 操作ごとに画面が作る UUID。送り直しでも同じ（DEC-48）。失敗と分かった後のやり直し（402 の断りなど）は新しいキーで送る
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
    RideId:
      name: rideId
      in: path
      required: true
      description: 依頼の ID（ride_ と ULID。DEC-39）
      schema:
        type: string
        pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
    DestinationChangeId:
      name: destinationChangeId
      in: path
      required: true
      description: 降車場所の変更の ID（dch_ と ULID。202 DESTINATION_CHANGE_PENDING の本文で受ける。DEC-39）
      schema:
        type: string
        pattern: ^dch_[0-9A-HJKMNP-TV-Z]{26}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）。エラーを含むすべての応答に付ける
      schema:
        type: string
  schemas:
    BookingRequest:
      type: object
      properties:
        estimateId:
          type: string
          pattern: ^est_[0-9A-HJKMNP-TV-Z]{26}$
        paymentMethodId:
          anyOf:
          - type: string
            description: 省くと既定の支払い手段
          - type: 'null'
      required:
      - estimateId
    CancelRequest:
      type: object
      properties:
        expectedFee:
          $ref: '#/components/schemas/Money'
      required:
      - expectedFee
    CancellationQuote:
      type: object
      properties:
        fee:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          enum:
          - before_acceptance
          - fee_applies
          - pickup_late
          - no_pickup_eta
          description: FR-07 AC1〜4
      required:
      - fee
      - reason
    Cursor:
      anyOf:
      - type: string
        description: 不透明なカーソル（DEC-42）
        maxLength: 200
      - type: 'null'
    DefaultPaymentMethod:
      type: object
      properties:
        paymentMethodId:
          type: string
      required:
      - paymentMethodId
    DestinationChangePending:
      type: object
      properties:
        code:
          type: string
          const: DESTINATION_CHANGE_PENDING
          description: 保留の符号（DEC-38、DEC-48）
        destinationChangeId:
          type: string
          pattern: ^dch_[0-9A-HJKMNP-TV-Z]{26}$
          description: この変更の ID。変更の取り消し（POST /api/v1/passenger/rides/{rideId}/destination-changes/{destinationChangeId}/cancel）に使う
        ride:
          $ref: '#/components/schemas/PassengerRide'
      required:
      - code
      - destinationChangeId
      - ride
      description: 202 の本文（{code, ...資源}）。押さえ直しの結果が分からず、降車場所は変えていない（ride.destinationChange.state=pending）。呼ぶ側は配信（IFC-08 の ride.updated）か GET で結果を待ち、新しい冪等キーで送り直さない
    DestinationChangeRequest:
      type: object
      properties:
        quoteId:
          type: string
          pattern: ^est_[0-9A-HJKMNP-TV-Z]{26}$
      required:
      - quoteId
    DestinationQuote:
      type: object
      properties:
        quoteId:
          type: string
          pattern: ^est_[0-9A-HJKMNP-TV-Z]{26}$
        dropoff:
          $ref: '#/components/schemas/Place'
        fare:
          $ref: '#/components/schemas/FareBreakdown'
        eta:
          $ref: '#/components/schemas/Eta'
        route:
          $ref: '#/components/schemas/Route'
        expiresAt:
          type: string
          format: date-time
          description: 5 分（仮）
          x-provisional: true
      required:
      - quoteId
      - dropoff
      - fare
      - eta
      - route
      - expiresAt
    DestinationQuoteRequest:
      type: object
      properties:
        dropoff:
          $ref: '#/components/schemas/PlaceInput'
      required:
      - dropoff
    DriverCard:
      type: object
      properties:
        name:
          type: string
        photoUrl:
          type: string
          description: GET /api/v1/passenger/rides/{rideId}/driver-photo
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        confirmationCode:
          type: string
          description: 乗車の確認コード（担当ごと。FR-09、FR-26）
          pattern: ^[0-9]{4}$
      required:
      - name
      - photoUrl
      - vehicle
      - confirmationCode
    Estimate:
      type: object
      properties:
        estimateId:
          type: string
          pattern: ^est_[0-9A-HJKMNP-TV-Z]{26}$
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        fare:
          $ref: '#/components/schemas/FareBreakdown'
        eta:
          $ref: '#/components/schemas/Eta'
        durationSec:
          type: integer
          minimum: 0
        distanceM:
          type: integer
          minimum: 0
        route:
          $ref: '#/components/schemas/Route'
        expiresAt:
          type: string
          format: date-time
          description: T_estimate_valid（10 分、仮）
          x-provisional: true
      required:
      - estimateId
      - pickup
      - dropoff
      - fare
      - eta
      - durationSec
      - distanceM
      - route
      - expiresAt
    EstimateRequest:
      type: object
      properties:
        pickup:
          $ref: '#/components/schemas/PlaceInput'
        dropoff:
          $ref: '#/components/schemas/PlaceInput'
      required:
      - pickup
      - dropoff
    Eta:
      type: object
      properties:
        arrivalAt:
          type: string
          format: date-time
          description: 目的地への到着予定時刻
        components:
          type: object
          properties:
            matchSec:
              type: integer
              minimum: 0
            pickupSec:
              type: integer
              minimum: 0
            rideSec:
              type: integer
              minimum: 0
          required:
          - matchSec
          - pickupSec
          - rideSec
          description: ドライバーが見つかるまで、迎車、走行の見込み（FR-03 AC2）
      required:
      - arrivalAt
      - components
    FareBreakdown:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/Money'
        base:
          $ref: '#/components/schemas/Money'
        distance:
          $ref: '#/components/schemas/Money'
        time:
          $ref: '#/components/schemas/Money'
        pickupFee:
          $ref: '#/components/schemas/Money'
        bookingFee:
          $ref: '#/components/schemas/Money'
      required:
      - total
      - base
      - distance
      - time
      - pickupFee
      - bookingFee
      description: R_fare の内訳（FR-03 AC3）。額はサーバーだけが決める（DRV-30）
    HistoryItem:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          type: string
          enum:
          - ride
          - cancellation_fee
          - no_show_fee
        at:
          type: string
          format: date-time
        pickup:
          type: object
          properties:
            label:
              type: string
          required:
          - label
        dropoff:
          anyOf:
          - type: object
            properties:
              label:
                type: string
            required:
            - label
          - type: 'null'
        driver:
          type: object
          properties:
            name:
              type: string
          required:
          - name
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        fareShown:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        charged:
          $ref: '#/components/schemas/Money'
        refunded:
          $ref: '#/components/schemas/Money'
        unpaid:
          type: boolean
      required:
      - rideId
      - kind
      - at
      - pickup
      - driver
      - vehicle
      - charged
      - refunded
      - unpaid
    HistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
    HoldPending:
      type: object
      properties:
        code:
          type: string
          const: HOLD_PENDING
          description: 保留の符号（DEC-38、DEC-48）
        ride:
          $ref: '#/components/schemas/PassengerRide'
      required:
      - code
      - ride
      description: 202 の本文（{code, ...資源}）。手配の押さえの結果が分からない（ride.state と payment.state は hold_checking。ドライバーに示さない）。呼ぶ側は配信（IFC-08 の ride.updated）か GET で結果を待ち、新しい冪等キーで送り直さない
    HoldReleasePending:
      type: object
      properties:
        code:
          type: string
          const: HOLD_RELEASE_PENDING
          description: 保留の符号（DEC-38、DEC-48）
        ride:
          $ref: '#/components/schemas/PassengerRide'
      required:
      - code
      - ride
      description: 202 の本文（{code, ...資源}）。取り消しは済んだが、押さえ（押さえの確かめ中の依頼の押さえ、または降車場所の変更の新しい押さえ）が残っているかの確かめが続き、見つかれば取り消す（DEC-52）。呼ぶ側は配信（IFC-08 の ride.updated）か GET で結果を待ち、新しい冪等キーで送り直さない。「押さえていません」と示すのは Stripe が答えたときだけ
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: 円の整数（Stripe のゼロ小数通貨。DEC-41）
          minimum: 0
        currency:
          type: string
          enum:
          - jpy
      required:
      - amount
      - currency
    NearbyCount:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        meetingThreshold:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        radiusM:
          anyOf:
          - type: integer
            description: D_nearby_drivers（未定の値）
          - type: 'null'
          x-provisional: true
      required:
      - total
      - meetingThreshold
    NearbyCountRequest:
      type: object
      properties:
        pickup:
          $ref: '#/components/schemas/PlaceInput'
      required:
      - pickup
    PassengerRide:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        state:
          type: string
          enum:
          - booking
          - hold_checking
          - not_booked
          - searching
          - accepted
          - arrived
          - in_progress
          - ended
          - cancelled
          - no_show
          description: |-
            依頼の状態。booking は手配の処理中、hold_checking は押さえの結果を確かめている間（ドライバーに示さない。DEC-52）、not_booked は手配が成り立たなかったか、やめた（押さえの確かめが続くときは payment.state で示す）
            乗客の画面は、乗車中（in_progress）を配信の ride.updated（state=in_progress）か GET の取り直しで受けたときだけ示し、画面が先に変えない（FR-26、DEC-30）
            cancelled は cancellation に取り消した人と理由を持つ。no_show の請求は charge で示す
        version:
          type: integer
          description: 条件付きの書き込みの版。配信で古いものを捨てるのに使う
          minimum: 1
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        fare:
          type: object
          properties:
            booked:
              $ref: '#/components/schemas/Money'
            current:
              $ref: '#/components/schemas/Money'
          required:
          - booked
          - current
        eta:
          anyOf:
          - $ref: '#/components/schemas/Eta'
          - type: 'null'
        pickupEta:
          anyOf:
          - type: object
            properties:
              arrivalAt:
                type: string
                format: date-time
            required:
            - arrivalAt
          - type: 'null'
        matchWaitDeadline:
          anyOf:
          - type: string
            format: date-time
            description: T_match_wait を過ぎる時刻。過ぎても許諾がなければ FR-08 の案内を出す
          - type: 'null'
        threshold:
          anyOf:
          - type: number
          - type: 'null'
        driver:
          anyOf:
          - $ref: '#/components/schemas/DriverCard'
          - type: 'null'
        payment:
          $ref: '#/components/schemas/PaymentState'
        charge:
          anyOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - fare
                - cancellation_fee
                - no_show_fee
              amount:
                $ref: '#/components/schemas/Money'
            required:
            - kind
            - amount
          - type: 'null'
          description: |-
            請求した額（運賃、キャンセル料、不在の料金）。まだないか、請求しないときは null
            no_show の依頼は、確かめた到着なら no_show_fee の 500 円、確かめられなかった到着なら請求なし（null。押さえは取り消す）
            キャンセル料と不在の料金の請求に失敗したら、依頼は未払いになる（payment.state=unpaid、払う額は payment.unpaidAmount）
        arrival:
          anyOf:
          - type: object
            properties:
              at:
                type: string
                format: date-time
              verified:
                type: boolean
            required:
            - at
            - verified
          - type: 'null'
        cancellation:
          anyOf:
          - type: object
            properties:
              cancelledBy:
                type: string
                enum:
                - passenger
                - driver
                - system
              reason:
                anyOf:
                - type: string
                  description: 取り消しの理由の符号。request_timeout は、手配の時刻（探し直しの依頼も手配の時刻）から T_request_max（DEC-45）を過ぎてもまだ searching の依頼を、システムが取り消した（押さえを取り消し、キャンセル料はかけない。FR-08）
                - type: 'null'
            required:
            - cancelledBy
            - reason
          - type: 'null'
          description: state が cancelled のときの、取り消した人と理由（配信の ride.updated でも同じ）。ほかの状態では null
        destinationChange:
          anyOf:
          - type: object
            properties:
              destinationChangeId:
                type: string
                pattern: ^dch_[0-9A-HJKMNP-TV-Z]{26}$
              state:
                type: string
                enum:
                - pending
                - applied
                - abandoned
                description: pending は押さえ直しを確かめている間（降車場所は変えていない）。applied は T_hold_wait までに押さえたと分かり、変更を当てた（古い押さえは取り消す）。abandoned は変えずに終えた（T_hold_wait を過ぎた、乗客が取り消した、乗車の終了と重なった）。新しい押さえが残っていれば、確かめを続けて取り消す
            required:
            - destinationChangeId
            - state
          - type: 'null'
          description: 押さえ直しの結果が分からなかった降車場所の変更（202 DESTINATION_CHANGE_PENDING。FR-12、DEC-52）。なければ null。乗車の終了と重なって取りやめたときは、配信の ride.updated に state=abandoned を載せ、画面は「降車場所の変更は当てませんでした。新しい押さえが残っていれば解放します」と示す
        destinationChangePending:
          type: boolean
          description: 確かめ中の降車場所の変更があるか（destinationChange.state=pending と同じ）
        cancelRequested:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - rideId
      - state
      - version
      - pickup
      - dropoff
      - fare
      - payment
      - createdAt
      - updatedAt
      description: 乗客に見せる依頼
    PaymentMethod:
      type: object
      properties:
        paymentMethodId:
          type: string
        brand:
          type: string
        last4:
          type: string
          pattern: ^[0-9]{4}$
        expMonth:
          type: integer
          minimum: 1
          maximum: 12
        expYear:
          type: integer
        isDefault:
          type: boolean
      required:
      - paymentMethodId
      - brand
      - last4
      - expMonth
      - expYear
      - isDefault
      description: Stripe から読んだ表示だけ。システムは持たない（DAT-12）
    PaymentMethodRegister:
      type: object
      properties:
        setupIntentId:
          type: string
      required:
      - setupIntentId
    PaymentMethods:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
      description: 一覧の形（{items, nextCursor}。DEC-42）。全部を返すので nextCursor はいつも null
    PaymentPending:
      type: object
      properties:
        code:
          type: string
          const: PAYMENT_PENDING
          description: 保留の符号（DEC-38、DEC-48）
        ride:
          $ref: '#/components/schemas/PassengerRide'
      required:
      - code
      - ride
      description: 202 の本文（{code, ...資源}）。未払いの支払いの結果が分からない（payment.state は unpaid_checking）。呼ぶ側は配信（IFC-08 の ride.updated）か GET で結果を待ち、新しい冪等キーで送り直さない
    PaymentState:
      type: object
      properties:
        state:
          type: string
          enum:
          - none
          - holding
          - hold_checking
          - held
          - release_checking
          - released
          - capturing
          - checking
          - paid
          - unpaid
          - unpaid_checking
          - partially_refunded
          - refunded
          description: |-
            依頼の支払いの状態（報告書の「要素をまたぐ状態」。13 値）
            - none: 押さえも請求もない（押さえがないと Stripe の一覧で確かめた場合を含む）
            - holding: 押さえの処理中
            - hold_checking: 手配の押さえの結果が分からない間（依頼は hold_checking。DEC-52）
            - held: 押さえている。降車場所の変更の押さえ直しを確かめている間も held のまま（古い押さえが有効。新しい押さえはお金の操作で追う）
            - release_checking: 押さえの取り消しの結果が分からない間（無料の取り消し、システムの取り消し、手配をやめた依頼、確かめられなかった到着での不在）
            - released: 押さえを取り消した（Stripe が取り消しの成功を答えた）
            - capturing: 確定の処理中
            - checking: 確定（運賃、キャンセル料、不在の料金）の結果を確かめている間だけ
            - paid: 払った
            - unpaid: 請求に失敗した（未払い。払う額は unpaidAmount。キャンセル料と不在の料金の失敗を含む）
            - unpaid_checking: 未払いの支払いの結果が分からない間（202 PAYMENT_PENDING）
            - partially_refunded: 一部を返金した
            - refunded: 全額を返金した
            返金を確かめている間は paid か partially_refunded のまま（返金の操作で追い、返金できる残りの額から引く）。「押さえていません」と示すのは、Stripe が答えたとき（none、released）だけ
        unpaidAmount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reason:
          anyOf:
          - type: string
            description: 失敗の理由（人向けの文）
          - type: 'null'
      required:
      - state
    Place:
      type: object
      properties:
        label:
          type: string
        address:
          anyOf:
          - type: string
          - type: 'null'
        placeId:
          anyOf:
          - type: string
          - type: 'null'
        position:
          $ref: '#/components/schemas/Point'
      required:
      - label
      - position
    PlaceCandidates:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              placeId:
                type: string
              name:
                type: string
              address:
                type: string
            required:
            - placeId
            - name
            - address
          maxItems: 10
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
      description: 一覧の形（{items, nextCursor}。DEC-42）。候補は 10 件までを一度に返すので nextCursor はいつも null
    PlaceInput:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/Point'
        accuracyM:
          type: number
          description: source が current_location のときの誤差（m）
          minimum: 0
        placeId:
          type: string
          description: Places の候補から選んだときの place_id
        label:
          type: string
          description: 表示の名前（候補の名前か住所）
          maxLength: 200
        source:
          type: string
          enum:
          - current_location
          - search
          - pin
        pinConfirmed:
          type: boolean
          description: 誤差が D_pickup_accuracy を超えた現在地をピンで確かめたか（FR-02 AC3）
      required:
      - position
      - source
    PlaceResolveRequest:
      type: object
      properties:
        placeId:
          type: string
        sessionToken:
          type: string
          format: uuid
      required:
      - placeId
      - sessionToken
    PlaceResolved:
      type: object
      properties:
        placeId:
          type: string
        name:
          type: string
        address:
          type: string
        position:
          $ref: '#/components/schemas/Point'
      required:
      - placeId
      - name
      - address
      - position
    PlaceSearchRequest:
      type: object
      properties:
        query:
          type: string
          description: 探す語（本文で送る。DEC-16）
          minLength: 1
          maxLength: 200
        sessionToken:
          type: string
          format: uuid
        near:
          anyOf:
          - $ref: '#/components/schemas/Point'
          - type: 'null'
      required:
      - query
      - sessionToken
    Point:
      type: object
      properties:
        lat:
          type: number
          description: 緯度（小数点以下 6 桁以上を保つ。NFR-37）
          minimum: -90
          maximum: 90
        lng:
          type: number
          description: 経度
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）。任意（DEC-38）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数。429 と 503 では Retry-After の見出しと同じ。NO_SHOW_TOO_EARLY では不在で終えられるまでの残りの秒数。任意
          minimum: 0
        distanceMeters:
          type: integer
          description: 場所からの距離（m）。TOO_FAR_FROM_PICKUP、FAR_FROM_DROPOFF のとき。任意
          minimum: 0
        remainingAttempts:
          type: integer
          description: 残りの回数。CONFIRMATION_CODE_MISMATCH のとき。任意
          minimum: 0
        currentFee:
          $ref: '#/components/schemas/Money'
          description: 今の額。CANCELLATION_FEE_CHANGED のとき（この額で確かめ直す）。任意
        remainingRefundable:
          $ref: '#/components/schemas/Money'
          description: 返金できる残りの額。REFUND_EXCEEDS_REMAINING のとき。任意
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors と、場合ごとの拡張の欄（retryAfterSeconds、distanceMeters、remainingAttempts、currentFee、remainingRefundable。どれも任意）を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    RatingRequest:
      type: object
      properties:
        score:
          type: integer
          description: 1 から N_rating_levels まで
          minimum: 1
      required:
      - score
    ReportCreated:
      type: object
      properties:
        complaintId:
          type: string
          pattern: ^cmp_[0-9A-HJKMNP-TV-Z]{26}$
        reportedAt:
          type: string
          format: date-time
      required:
      - complaintId
      - reportedAt
    ReportRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - wrong_vehicle
          - driver_behavior
          - vehicle_cleanliness
          - driving
          - billing_error
          - other
        text:
          type: string
          maxLength: 1000
          description: 自由記述。ログに書かない（DEC-44）
      required:
      - type
    RideAccepted:
      type: object
      properties:
        ride:
          $ref: '#/components/schemas/PassengerRide'
      required:
      - ride
    RideThresholdRequest:
      type: object
      properties:
        threshold:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
      required:
      - threshold
    Route:
      type: object
      properties:
        encodedPolyline:
          type: string
          description: Google の経路の線（依頼の間だけ持つ。DEC-22）
        distanceM:
          type: integer
          minimum: 0
        durationSec:
          type: integer
          minimum: 0
      required:
      - encodedPolyline
      - distanceM
      - durationSec
    SetupIntentCreated:
      type: object
      properties:
        setupIntentId:
          type: string
        clientSecret:
          type: string
          description: 入力部品に渡す（IFC-14）
      required:
      - setupIntentId
      - clientSecret
    Threshold:
      type: object
      properties:
        threshold:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        minRatings:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - threshold
    UnpaidPaymentRequest:
      type: object
      properties:
        paymentMethodId:
          type: string
      required:
      - paymentMethodId
    Vehicle:
      type: object
      properties:
        model:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 50
        plateNumber:
          type: string
          maxLength: 30
      required:
      - model
      - color
      - plateNumber
