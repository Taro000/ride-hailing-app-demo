        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 10 回、1 日に 100 回

        冪等キーは要らない（DEC-48 の例外。計算して短い期限の見積もりを新しく作るだけで、繰り返しても別の見積もりができるだけ）
