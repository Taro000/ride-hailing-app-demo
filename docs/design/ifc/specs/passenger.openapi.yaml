  /api/v1/passenger/rides/{rideId}/cancel:
    post:
      operationId: passenger_rides_cancel
      summary: 見積もった額を確かめたうえで取り消す（無料なら押さえを取り消し、キャンセル料なら押さえから 500 円だけを確定する。DEC-10）
      description: |-
        見積もった額を確かめたうえで取り消す（無料なら押さえを取り消し、キャンセル料なら押さえから 500 円だけを確定する。DEC-10）

        機能: FR-07、FR-08

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）

        押さえの確かめ中（hold_checking）の依頼の取り消しは、手配をやめて依頼を not_booked にし、202 HOLD_RELEASE_PENDING を返す。押さえの確かめは続き、押さえが見つかれば取り消す（DEC-52）。確かめがついたら配信の ride.updated（payment.state が released か none）で知らせる。「押さえていません」と示すのは Stripe が答えたとき（一覧に押さえがない、取り消しが成功した）だけ

        システムが取り消した依頼（手配の時刻から T_request_max を過ぎても許諾がない。cancellation.cancelledBy=system、reason=request_timeout。FR-08）への取り消しは 409 RIDE_ALREADY_ENDED
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - $ref: '#/components/parameters/RideId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 取り消した（state=cancelled、cancellation.cancelledBy=passenger）。キャンセル料なら charge が cancellation_fee で、請求の結果は payment.state（checking なら配信で待つ。失敗なら unpaid）。無料の取り消しで押さえの取り消しの結果が分からなければ payment.state は release_checking（配信で待つ）
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideAccepted'
        '202':
          description: 'HOLD_RELEASE_PENDING: 押さえの確かめ中（hold_checking）の依頼を取り消した。依頼は not_booked、payment.state は release_checking で、押さえの確かめは続く（見つかれば取り消す）。本文は {code, ride} → 「手配をやめました。押さえが残っていれば解放します」と示し、配信（ride.updated の payment.state が released か none）か GET で待つ。新しい冪等キーで送り直さない'
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldReleasePending'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
