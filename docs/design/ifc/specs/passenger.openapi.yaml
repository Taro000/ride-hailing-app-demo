      operationId: passenger_estimates_create
      summary: 乗る場所と降りる場所から到着予定時刻、所要時間、料金を計算し、見積もりとして残す
      description: |-
        乗る場所と降りる場所から到着予定時刻、所要時間、料金を計算し、見積もりとして残す

        機能: FR-03、FR-02

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 10 回、1 日に 100 回
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '201':
          description: 見積もり
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
