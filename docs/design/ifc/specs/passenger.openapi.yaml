  /api/v1/passenger/rides:
    post:
      operationId: passenger_rides_create
      summary: 見積もりで手配を確定し、確定した料金を押さえて依頼を作る（DEC-12、DEC-52）
      description: |-
        見積もりで手配を確定し、確定した料金を押さえて依頼を作る（DEC-12、DEC-52）

        機能: FR-05

        SLI-01 の六つの操作の一つ（route_id で数える）

        回数の上限（仮。DEC-55）: アカウントごとに 1 時間に 10 回

        押さえの結果の扱い（DEC-52、DEC-48）:
        - 押さえた: 依頼を searching にして 201
        - 定まった断り（402 CARD_DECLINED、402 CARD_AUTHENTICATION_REQUIRED）: 依頼を not_booked、押さえの操作を failed にする。冪等キーの最初の結果として保つ
        - 起きていない（Stripe が実行しなかったと答えた 429、または要求が Stripe に届かなかったと分かる送る前の接続の失敗）: 二つ目のトランザクションで依頼を not_booked、押さえの操作を not_happened にし、503 PAYMENTS_UNAVAILABLE と Retry-After を返す。この 503 は冪等キーの最初の結果にしない（キーを放す）ので、同じキーの送り直しは初めからやり直す（DEC-48 の例外）
        - 結果が分からない（タイムアウト、送った後の接続の切れ、Stripe の 5xx、T_op_stale を過ぎた）: 依頼を hold_checking（ドライバーに示さない）、押さえの操作を checking にして 202 HOLD_PENDING を返す（冪等キーの最初の結果は pending）。見回りが T_hold_wait（60 秒）の内に押さえを見つけ、取り消しの求めがなければ searching にする。T_hold_wait を過ぎるか乗客が取り消したら手配をやめる（not_booked。探さない）

        409 ACTIVE_RIDE_EXISTS に数える依頼の状態: booking、hold_checking、searching、accepted、arrived、in_progress。not_booked、ended、cancelled、no_show は数えない（手配をやめた依頼の押さえを確かめている間も、新しい手配はできる）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 押さえて依頼を作った（searching）。画面を「ドライバーを探しています」にする
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideAccepted'
        '202':
          description: 'HOLD_PENDING: 押さえの結果が分からない（タイムアウト、送った後の接続の切れ、Stripe の 5xx、T_op_stale）。依頼は hold_checking（ドライバーに示さない）、payment.state は hold_checking。本文は {code, ride} → 「支払いを確かめています」と取り消しを示し、配信（IFC-08 の ride.updated）か GET で待つ。新しい冪等キーで送り直さない'
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldPending'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'UNAUTHENTICATED: ログインしていないか、セッションが切れた → ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る'
