  /api/v1/passenger/rides/{rideId}/destination-changes:
    post:
      operationId: passenger_rides_destination_change
      summary: 見積もった降車場所に変え、新しい額で押さえ直す（DEC-11）
      description: |-
        見積もった降車場所に変え、新しい額で押さえ直す（DEC-11）

        機能: FR-12

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）

        時間の上限: サーバーの中は T_route_long（20 秒。DEC-33）、ブラウザのタイムアウトは 25 秒（ほかの操作は 15 秒。DEC-50）

        押さえ直しの結果が分からないとき（FR-12、DEC-52）: 降車場所は変えず、202 DESTINATION_CHANGE_PENDING と destinationChangeId を返す。T_hold_wait までに押さえたと分かれば変更を当て、古い押さえを取り消す。分からないまま過ぎるか、乗客が POST /api/v1/passenger/rides/{rideId}/destination-changes/{destinationChangeId}/cancel で取り消したら変えず、新しい押さえが見つかれば取り消す

        乗車の終了と重なったとき: 乗車の終了は確かめ中の変更を取りやめる（当てない）。確定は古い押さえと、変更の前の確定した料金で行う。新しい押さえは確かめを続け、見つかれば取り消す。乗客には配信の ride.updated（destinationChange.state=abandoned）で「降車場所の変更は当てませんでした。新しい押さえが残っていれば解放します」と示す
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - $ref: '#/components/parameters/RideId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 変えた。ドライバーに配信する
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideAccepted'
        '202':
          description: 'DESTINATION_CHANGE_PENDING: 押さえ直しの結果が分からない（DEC-52）。降車場所は変えない（ride.destinationChange.state=pending）。本文は {code, destinationChangeId, ride} → 「確かめています」と変更の取り消しを示し、配信（IFC-08 の ride.updated）か GET で待つ。新しい冪等キーで送り直さない。取り消すときは destination-changes/{destinationChangeId}/cancel。T_hold_wait を過ぎると変えずに終わる'
          headers:
