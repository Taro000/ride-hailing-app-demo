        '422':
          description: |-
            NO_ROUTE: 乗る場所と降りる場所の間に経路がない（FR-02 AC6） → 料金の確認に進めないことと理由を示す
            PICKUP_NOT_CONFIRMED: 現在地の誤差が D_pickup_accuracy を超え、ピンで確かめていない（FR-02 AC3） → ピンで乗る場所を確かめさせる
          x-error-codes:
          - NO_ROUTE
          - PICKUP_NOT_CONFIRMED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
