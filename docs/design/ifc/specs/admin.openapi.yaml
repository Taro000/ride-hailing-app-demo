components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 操作ごとに画面が作る UUID。送り直しでも同じ（DEC-48）
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）
      schema:
        type: string
  schemas:
    ActionRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - no_action
          - warning
          - suspend
          - other
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - action
      - reason
    ActionView:
      type: object
      properties:
        action:
          type: string
        reason:
          type: string
        operatorId:
          type: string
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
        at:
          type: string
          format: date-time
      required:
      - action
      - reason
      - operatorId
      - at
    Billing:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        fareBooked:
          $ref: '#/components/schemas/Money'
        fareChanges:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              from:
                $ref: '#/components/schemas/Money'
              to:
                $ref: '#/components/schemas/Money'
            required:
            - at
            - from
            - to
        charges:
          type: array
          items:
            type: object
            properties:
              chargeId:
                type: string
                pattern: ^mop_[0-9A-HJKMNP-TV-Z]{26}$
              kind:
                type: string
                enum:
                - fare
                - cancellation_fee
                - no_show_fee
                - unpaid_settlement
              amount:
                $ref: '#/components/schemas/Money'
              state:
                type: string
                enum:
                - processing
                - succeeded
                - failed
                - checking
              at:
                type: string
                format: date-time
              refundable:
                $ref: '#/components/schemas/Money'
            required:
            - chargeId
            - kind
            - amount
            - state
            - at
            - refundable
        refunds:
          type: array
          items:
            type: object
            properties:
              refundRequestId:
                type: string
                pattern: ^rfr_[0-9A-HJKMNP-TV-Z]{26}$
              chargeId:
                type: string
                pattern: ^mop_[0-9A-HJKMNP-TV-Z]{26}$
              amount:
                $ref: '#/components/schemas/Money'
              state:
                type: string
                enum:
                - processing
                - succeeded
                - failed
                - checking
              reason:
                type: string
              operatorId:
                type: string
                pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
              at:
                type: string
                format: date-time
            required:
            - refundRequestId
            - chargeId
            - amount
            - state
            - reason
            - operatorId
            - at
        payment:
          $ref: '#/components/schemas/PaymentState'
        differences:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              expected:
                $ref: '#/components/schemas/Money'
              actual:
                $ref: '#/components/schemas/Money'
            required:
            - kind
            - expected
            - actual
          description: 請求額と確定した料金の差（FR-49 AC2）
        reconciliation:
          type: array
          items:
            type: object
            properties:
              businessDate:
                type: string
                format: date
              matched:
                type: boolean
              mismatches:
                type: array
                items:
                  type: string
            required:
            - businessDate
            - matched
            - mismatches
          description: 毎日の突き合わせの結果（DAT-23。FR-49 AC3）
      required:
      - rideId
      - fareBooked
      - fareChanges
      - charges
      - refunds
      - payment
      - differences
      - reconciliation
    ComplaintDetail:
      type: object
      properties:
        complaint:
          type: object
          properties:
            complaintId:
              type: string
              pattern: ^cmp_[0-9A-HJKMNP-TV-Z]{26}$
            type:
              type: string
            text:
              anyOf:
              - type: string
              - type: 'null'
            status:
              type: string
              enum:
              - open
              - handled
            reportedAt:
              type: string
              format: date-time
          required:
          - complaintId
          - type
          - status
          - reportedAt
        ride:
          type: object
          properties:
            rideId:
              type: string
              pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
            state:
              type: string
              enum:
              - booking
              - hold_checking
              - not_booked
              - searching
              - accepted
              - arrived
              - in_progress
              - ended
              - cancelled
              - no_show
            pickup:
              $ref: '#/components/schemas/Place'
            dropoff:
              $ref: '#/components/schemas/Place'
            fareBooked:
              $ref: '#/components/schemas/Money'
            charged:
              $ref: '#/components/schemas/Money'
            history:
              type: array
              items:
                $ref: '#/components/schemas/HistoryEntry'
            positions:
              type: array
              items:
                $ref: '#/components/schemas/PositionView'
            receipts:
              type: array
              items:
                $ref: '#/components/schemas/PositionView'
              description: T_log_retention の間の位置の受信の記録（第 2 段階の課題 3）
          required:
          - rideId
          - state
          - pickup
          - dropoff
          - fareBooked
          - charged
          - history
          - positions
          - receipts
        driver:
          type: object
          properties:
            driverId:
              type: string
              pattern: ^drv_[0-9A-HJKMNP-TV-Z]{26}$
            name:
              type: string
            vehicle:
              $ref: '#/components/schemas/Vehicle'
            rating:
              type: object
              properties:
                average:
                  anyOf:
                  - type: number
                  - type: 'null'
                count:
                  type: integer
              required:
              - average
              - count
          required:
          - driverId
          - name
          - vehicle
          - rating
        pastComplaints:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintListItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionView'
      required:
      - complaint
      - ride
      - driver
      - pastComplaints
      - actions
    ComplaintListItem:
      type: object
      properties:
        complaintId:
          type: string
          pattern: ^cmp_[0-9A-HJKMNP-TV-Z]{26}$
        type:
          type: string
          enum:
          - wrong_vehicle
          - driver_behavior
          - vehicle_cleanliness
          - driving
          - billing_error
          - other
        status:
          type: string
          enum:
          - open
          - handled
        reportedAt:
          type: string
          format: date-time
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        driverId:
          type: string
          pattern: ^drv_[0-9A-HJKMNP-TV-Z]{26}$
      required:
      - complaintId
      - type
      - status
      - reportedAt
      - rideId
      - driverId
    ComplaintPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintListItem'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
    Cursor:
      anyOf:
      - type: string
        description: 不透明なカーソル（DEC-42）
        maxLength: 200
      - type: 'null'
    DriverCreated:
      type: object
      properties:
        driverId:
          type: string
          pattern: ^drv_[0-9A-HJKMNP-TV-Z]{26}$
        accountId:
          type: string
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
        setupCode:
          type: string
          pattern: ^[A-Z0-9]{10}$
        setupCodeExpiresAt:
          type: string
          format: date-time
      required:
      - driverId
      - accountId
      - setupCode
      - setupCodeExpiresAt
    DriverPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverView'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
    DriverPatch:
      type: object
      properties:
        vehicle:
          type: object
          properties:
            model:
              type: string
              maxLength: 100
            color:
              type: string
              maxLength: 50
            plateNumber:
              type: string
              maxLength: 30
      required:
      - vehicle
    DriverRegistration:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        photo:
          type: string
          description: JPEG か PNG を base64 で（5 MB まで。サーバーが EXIF を除いて小さくする）
          contentEncoding: base64
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      required:
      - name
      - email
      - photo
      - vehicle
    DriverView:
      type: object
      properties:
        driverId:
          type: string
          pattern: ^drv_[0-9A-HJKMNP-TV-Z]{26}$
        name:
          type: string
        email:
          type: string
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        suspended:
          type: boolean
        reception:
          type: string
          enum:
          - 'off'
          - receiving
        rating:
          type: object
          properties:
            average:
              anyOf:
              - type: number
              - type: 'null'
            count:
              type: integer
          required:
          - average
          - count
        registeredAt:
          type: string
          format: date-time
        setupPending:
          type: boolean
      required:
      - driverId
      - name
      - email
      - vehicle
      - suspended
      - reception
      - rating
      - registeredAt
      - setupPending
    HistoryEntry:
      type: object
      properties:
        changeId:
          type: string
          pattern: ^chg_[0-9A-HJKMNP-TV-Z]{26}$
        type:
          type: string
        recordedAt:
          type: string
          format: date-time
        actor:
          type: object
          properties:
            kind:
              type: string
              enum:
              - passenger
              - driver
              - operator
              - system
            accountId:
              anyOf:
              - type: string
                pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
              - type: 'null'
          required:
          - kind
        positionId:
          anyOf:
          - type: string
          - type: 'null'
        noPositionReason:
          anyOf:
          - type: string
          - type: 'null'
        traceId:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - changeId
      - type
      - recordedAt
      - actor
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: 円の整数（Stripe のゼロ小数通貨。DEC-41）
          minimum: 0
        currency:
          type: string
          enum:
          - jpy
      required:
      - amount
      - currency
    PaymentState:
      type: object
      properties:
        state:
          type: string
          enum:
          - none
          - holding
          - held
          - hold_checking
          - capturing
          - paid
          - unpaid
          - checking
          - released
          - partially_refunded
          - refunded
          description: 依頼の支払いの状態（報告書の「要素をまたぐ状態」）
        unpaidAmount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reason:
          anyOf:
          - type: string
            description: 失敗の理由（人向けの文）
          - type: 'null'
      required:
      - state
    Place:
      type: object
      properties:
        label:
          type: string
        address:
          anyOf:
          - type: string
          - type: 'null'
        placeId:
          anyOf:
          - type: string
          - type: 'null'
        position:
          $ref: '#/components/schemas/Point'
      required:
      - label
      - position
    Point:
      type: object
      properties:
        lat:
          type: number
          description: 緯度（小数点以下 6 桁以上を保つ。NFR-37）
          minimum: -90
          maximum: 90
        lng:
          type: number
          description: 経度
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
    Position:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          description: 誤差（m）
          minimum: 0
        measuredAt:
          type: string
          format: date-time
          description: 端末が測った時刻
      required:
      - lat
      - lng
      - accuracyM
      - measuredAt
    PositionView:
      type: object
      properties:
        positionId:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        receivedAt:
          type: string
          format: date-time
      required:
      - positionId
      - position
      - receivedAt
      description: 位置のモジュールが役割を確かめて返す（DEC-15）
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数（429 と 503 では Retry-After の見出しと同じ）
          minimum: 0
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    RefundRequest:
      type: object
      properties:
        chargeId:
          type: string
          pattern: ^mop_[0-9A-HJKMNP-TV-Z]{26}$
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - chargeId
      - amount
      - reason
    RefundResult:
      type: object
      properties:
        refundRequestId:
          type: string
          pattern: ^rfr_[0-9A-HJKMNP-TV-Z]{26}$
        state:
          type: string
          enum:
          - succeeded
          - checking
        amount:
          $ref: '#/components/schemas/Money'
      required:
      - refundRequestId
      - state
      - amount
    Vehicle:
      type: object
      properties:
        model:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 50
        plateNumber:
          type: string
          maxLength: 30
      required:
      - model
      - color
      - plateNumber
