  /api/v1/admin/complaints/{complaintId}/actions:
    post:
      operationId: admin_complaints_action
      summary: 対処（対処しないことを含む）と理由を記録し、対処済みにする。停止を選んだら配車の停止もする
      description: |-
        対処（対処しないことを含む）と理由を記録し、対処済みにする。停止を選んだら配車の停止もする

        機能: FR-46、FR-47
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 記録した
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: 'INVALID_REQUEST: 対処の内容か理由がない（FR-46 AC2） → 入れるよう示す'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 対処の内容か理由がない（FR-46 AC2）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 対処の内容か理由がない（FR-46 AC2）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
