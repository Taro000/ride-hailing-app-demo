components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）
      schema:
        type: string
  schemas:
    Accepted:
      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
      required:
      - accepted
      - duplicates
    ClientErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              clientErrorId:
                type: string
                format: uuid
              occurredAt:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                - render
                - request
                - geolocation
                - wake_lock
                - audio
                - map
                - payment_element
                - stream
              message:
                type: string
                maxLength: 500
                description: 入力欄の値と位置を含めない（DEC-23、DEC-44）
              browser:
                type: string
                maxLength: 200
              traceId:
                type: string
                pattern: ^[0-9a-f]{32}$
              rideId:
                anyOf:
                - type: string
                  pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
                - type: 'null'
            required:
            - clientErrorId
            - occurredAt
            - kind
            - message
            - browser
            - traceId
          maxItems: 100
      required:
      - errors
    DisplayRecords:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              changeId:
                type: string
                pattern: ^chg_[0-9A-HJKMNP-TV-Z]{26}$
              displayedAt:
                type: string
                format: date-time
                description: ブラウザの時計
              afterBackground:
                type: boolean
                description: 裏から戻って示した（FR-54 AC2）
            required:
            - changeId
            - displayedAt
            - afterBackground
          maxItems: 100
      required:
      - records
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数（429 と 503 では Retry-After の見出しと同じ）
          minimum: 0
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    ScreenEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              clientEventId:
                type: string
                format: uuid
              type:
                type: string
                enum:
                - booking_screen_opened
                - rating_screen_opened
              at:
                type: string
                format: date-time
              rideId:
                anyOf:
                - type: string
                  pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
                - type: 'null'
            required:
            - clientEventId
            - type
            - at
          maxItems: 100
      required:
      - events
