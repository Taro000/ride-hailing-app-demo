components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。クッキーは __Host-rh_session（HttpOnly、Secure、SameSite=Strict、Path=/）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 操作ごとに画面が作る UUID。送り直しでも同じ（DEC-48）
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）
      schema:
        type: string
    SetSessionCookie:
      description: セッションのクッキーを付ける（DEC-43）。__Host-rh_session=<不透明な値>; HttpOnly; Secure; SameSite=Strict; Path=/
      schema:
        type: string
    ClearSessionCookie:
      description: セッションのクッキーを消す（DEC-43）。__Host-rh_session=; Max-Age=0; HttpOnly; Secure; SameSite=Strict; Path=/
      schema:
        type: string
  schemas:
    Account:
      type: object
      properties:
        accountId:
          type: string
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
        roles:
          type: array
          items:
            type: string
            enum:
            - passenger
            - driver
            - operator
            - engineer
        testAccount:
          type: boolean
      required:
      - accountId
      - roles
      - testAccount
    AccountSetup:
      type: object
      properties:
        email:
          type: string
          format: email
        setupCode:
          type: string
          pattern: ^[A-Z0-9]{10}$
          description: 運営・サポート担当が渡す一度だけの符号（24 時間。使うか出し直すと使えない。DEC-43）
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 文字以上（仮。DEC-43）
          x-provisional: true
      required:
      - email
      - setupCode
      - password
      description: 参加者（乗客とドライバー）の設定。運営・サポート担当が作ったアカウントのメールアドレスと、受けた設定の符号で、パスワードを決める（DEC-43）
    Config:
      type: object
      properties:
        appVersion:
          type: string
          description: サーバーとこの SPA の版（DEC-49）
        mapsBrowserKey:
          type: string
          description: 地図のブラウザの鍵（参照元と API で限る。DEC-21）。ログインしたセッションの要求の応答にだけ入れ、ログインしていない要求の応答には入れない（DEC-21 版 5）
        stripePublishableKey:
          type: string
          description: Stripe の公開の鍵
        locationSendIntervalSec:
          type: integer
          description: L_send（DEC-14）
        pickupAccuracyM:
          anyOf:
          - type: number
            description: D_pickup_accuracy（未定の値）
          - type: 'null'
        ratingLevels:
          anyOf:
          - type: integer
            description: N_rating_levels（未定の値）
          - type: 'null'
        minRatings:
          anyOf:
          - type: integer
            description: N_min_ratings（未定の値）
          - type: 'null'
        cancellationFee:
          $ref: '#/components/schemas/Money'
      required:
      - appVersion
      - stripePublishableKey
      - locationSendIntervalSec
      - cancellationFee
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 文字以上（仮。DEC-43）
          x-provisional: true
      required:
      - email
      - password
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: 円の整数（Stripe のゼロ小数通貨。DEC-41）
          minimum: 0
        currency:
          type: string
          enum:
          - jpy
      required:
      - amount
      - currency
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）。任意（DEC-38）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数。429 と 503 では Retry-After の見出しと同じ。NO_SHOW_TOO_EARLY では不在で終えられるまでの残りの秒数。任意
          minimum: 0
        distanceMeters:
          type: integer
          description: 場所からの距離（m）。TOO_FAR_FROM_PICKUP、FAR_FROM_DROPOFF のとき。任意
          minimum: 0
        remainingAttempts:
          type: integer
          description: 残りの回数。CONFIRMATION_CODE_MISMATCH のとき。任意
          minimum: 0
        currentFee:
          $ref: '#/components/schemas/Money'
          description: 今の額。CANCELLATION_FEE_CHANGED のとき（この額で確かめ直す）。任意
        remainingRefundable:
          $ref: '#/components/schemas/Money'
          description: 返金できる残りの額。REFUND_EXCEEDS_REMAINING のとき。任意
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors と、場合ごとの拡張の欄（retryAfterSeconds、distanceMeters、remainingAttempts、currentFee、remainingRefundable。どれも任意）を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    Session:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/Account'
        nextStep:
          type: string
          enum:
          - none
          - passkey
          - passkey_registration
          description: 役割のアカウントはパスキーの確かめが済むまで役割の経路を使えない（DEC-20、DEC-43）
      required:
      - account
      - nextStep
    StaffBootstrap:
