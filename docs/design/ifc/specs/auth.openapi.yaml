openapi: 3.1.0
info:
  title: 認証と起動の API（IFC-01）
  version: 1.1.0
  description: 第 3 段階（architecture-to-high-level-design）で決めた部分だけを書く。項目は docs/design/ifc/IFC-01.yaml。仮の値は x-provisional で示す。共通の約束事は DEC-38〜50（エラーの形、ID、時刻、お金、一覧、セッション、ログとトレース、命名、冪等キー、版、タイムアウト）。
servers:
- url: https://{service}-{projectNumber}.asia-northeast1.run.app
  description: デモの回の Cloud Run のサービス（決まった形の URL。DEC-06）
  variables:
    service:
      default: ride-demo
    projectNumber:
      default: '000000000000'
- url: http://localhost:8080
  description: 手元（DRV-18）
paths:
  /api/v1/config:
    get:
      operationId: config_get
      summary: 画面が使う設定（地図のブラウザの鍵、Stripe の公開の鍵、位置を送る間隔、未定の値のしきい値、キャンセル料、サーバー
      description: |-
        画面が使う設定（地図のブラウザの鍵、Stripe の公開の鍵、位置を送る間隔、未定の値のしきい値、キャンセル料、サーバーの版）を返す。ログインなしで読めるが、地図のブラウザの鍵（mapsBrowserKey）はログインしたセッションの要求の応答にだけ入れる（DEC-21 版 5）

        機能: FR-01
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '200':
          description: 設定。ログインしていない要求の応答には mapsBrowserKey を入れない
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: config.get
      x-functions:
      - FR-01
      security:
      - {}
      - sessionCookie: []
  /api/v1/auth/login:
    post:
      operationId: auth_login
      summary: 'メールアドレスとパスワードでログインする。役割のアカウントは nextStep: passkey を返す'
      description: |-
        メールアドレスとパスワードでログインする。役割のアカウントは nextStep: passkey を返す

        機能: FR-01

        回数の上限（仮。DEC-55）: 同じアカウントと同じ IP の組で 5 回続けて失敗すると、その組を 15 分止める（DEC-20。Turso に数える）。IP ごとに 1 時間に 30 回

        冪等キーを持たない（DEC-48 の例外。セッションを作る操作で、繰り返しても安全。新しいセッションを作り、古いものは期限で消える）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '200':
          description: ログインした。セッションのクッキーを付ける。役割のアカウントはパスキーの確かめが済むまで役割の経路を使えない
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'INVALID_CREDENTIALS: メールアドレスかパスワードが違う（FR-01 AC4） → その旨を示す（どちらが違うかは言わない）'
          x-error-codes:
          - INVALID_CREDENTIALS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_credentials
                    title: メールアドレスかパスワードが違う（FR-01 AC4）
                    status: 401
                    code: INVALID_CREDENTIALS
                    detail: メールアドレスかパスワードが違う（FR-01 AC4）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '403':
          description: 'FORBIDDEN: 送り元（Origin）がサービスの URL でない（ログインのない状態を変える操作でも確かめる。FND-42） → 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）'
          x-error-codes:
          - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:ride-hailing-demo:problem:forbidden
                    title: 送り元（Origin）がサービスの URL でない（ログインのない状態を変える操作でも確かめる。FND-42）
                    status: 403
                    code: FORBIDDEN
                    detail: 送り元（Origin）がサービスの URL でない（ログインのない状態を変える操作でも確かめる。FND-42）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: |-
            ACCOUNT_LOCKED: 続けて失敗したので一時に止めている（DEC-20） → 再開の時刻を示して待たせる
            RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ
          x-error-codes:
          - ACCOUNT_LOCKED
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ACCOUNT_LOCKED:
                  value:
                    type: urn:ride-hailing-demo:problem:account_locked
                    title: 続けて失敗したので一時に止めている（DEC-20）
                    status: 429
                    code: ACCOUNT_LOCKED
                    detail: 続けて失敗したので一時に止めている（DEC-20）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: auth.login
      x-functions:
      - FR-01
      x-rate-limit:
        value: 同じアカウントと同じ IP の組で 5 回続けて失敗すると、その組を 15 分止める（DEC-20。Turso に数える）。IP ごとに 1 時間に 30 回
        x-provisional: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/auth/passkeys/authentication-options:
    post:
      operationId: auth_passkey_options
      summary: パスキーの確かめの準備（WebAuthn の options）
      description: |-
        パスキーの確かめの準備（WebAuthn の options）

        機能: FR-01

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）

        冪等キーを持たない（DEC-48 の例外。セッションを作る流れの準備で、繰り返しても安全）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '200':
          description: options
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'UNAUTHENTICATED: ログインしていないか、セッションが切れた → ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る'
          x-error-codes:
          - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:ride-hailing-demo:problem:unauthenticated
                    title: ログインしていないか、セッションが切れた
                    status: 401
                    code: UNAUTHENTICATED
                    detail: ログインしていないか、セッションが切れた
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '403':
          description: 'FORBIDDEN: 役割が違う、または送り元（Origin）がサービスの URL でない → 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）'
          x-error-codes:
          - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:ride-hailing-demo:problem:forbidden
                    title: 役割が違う、または送り元（Origin）がサービスの URL でない
                    status: 403
                    code: FORBIDDEN
                    detail: 役割が違う、または送り元（Origin）がサービスの URL でない
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '404':
          description: 'NOT_FOUND: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29） → 画面を読み直す'
          x-error-codes:
          - NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NOT_FOUND:
                  value:
                    type: urn:ride-hailing-demo:problem:not_found
                    title: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    status: 404
                    code: NOT_FOUND
                    detail: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: auth.passkey.options
      x-functions:
      - FR-01
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
  /api/v1/auth/passkeys/authenticate:
    post:
      operationId: auth_passkey_authenticate
      summary: パスキーで確かめ、役割の経路を使えるセッションにする
      description: |-
        パスキーで確かめ、役割の経路を使えるセッションにする

        機能: FR-01

