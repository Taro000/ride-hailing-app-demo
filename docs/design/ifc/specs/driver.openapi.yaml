                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: driver.conditions.get
      x-functions:
      - FR-33
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
    put:
      operationId: driver_conditions_put
      summary: 受ける条件を設定・解除する（null で解除）。値と変えた時刻を記録する
      description: |-
        受ける条件を設定・解除する（null で解除）。値と変えた時刻を記録する

        機能: FR-33、FR-34

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 設定した
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conditions'
        '400':
          description: 'INVALID_REQUEST: 負の値など、ありえない値（FR-33 AC3） → 受け付けず、範囲を示す'
          x-error-codes:
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 負の値など、ありえない値（FR-33 AC3）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 負の値など、ありえない値（FR-33 AC3）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'UNAUTHENTICATED: ログインしていないか、セッションが切れた → ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る'
          x-error-codes:
          - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:ride-hailing-demo:problem:unauthenticated
                    title: ログインしていないか、セッションが切れた
                    status: 401
                    code: UNAUTHENTICATED
                    detail: ログインしていないか、セッションが切れた
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '403':
          description: 'FORBIDDEN: 役割が違う、または送り元（Origin）がサービスの URL でない → 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）'
          x-error-codes:
          - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:ride-hailing-demo:problem:forbidden
                    title: 役割が違う、または送り元（Origin）がサービスの URL でない
                    status: 403
                    code: FORBIDDEN
                    detail: 役割が違う、または送り元（Origin）がサービスの URL でない
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '404':
          description: 'NOT_FOUND: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29） → 画面を読み直す'
          x-error-codes:
          - NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NOT_FOUND:
                  value:
                    type: urn:ride-hailing-demo:problem:not_found
                    title: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    status: 404
                    code: NOT_FOUND
                    detail: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '409':
          description: 'OPERATION_IN_PROGRESS: 同じ冪等キーの要求がまだ動いている（DEC-48） → Retry-After（1 秒）の後に同じキーで送るか、状態を読み直す'
          x-error-codes:
          - OPERATION_IN_PROGRESS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                OPERATION_IN_PROGRESS:
                  value:
                    type: urn:ride-hailing-demo:problem:operation_in_progress
                    title: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    status: 409
                    code: OPERATION_IN_PROGRESS
                    detail: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '422':
          description: 'IDEMPOTENCY_KEY_REUSED: 同じ冪等キーで中身の違う要求（DEC-48） → 画面の誤り。新しい操作として新しいキーで始める'
          x-error-codes:
          - IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    type: urn:ride-hailing-demo:problem:idempotency_key_reused
                    title: 同じ冪等キーで中身の違う要求（DEC-48）
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: 同じ冪等キーで中身の違う要求（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: driver.conditions.put
      x-functions:
      - FR-33
      - FR-34
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conditions'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。クッキーは __Host-rh_session（HttpOnly、Secure、SameSite=Strict、Path=/）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 操作ごとに画面が作る UUID。送り直しでも同じ（DEC-48）
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）
      schema:
        type: string
  schemas:
    CompleteRequest:
      type: object
      properties:
        position:
          anyOf:
          - $ref: '#/components/schemas/Position'
          - type: 'null'
        confirmFarFromDropoff:
          type: boolean
          description: D_dropoff を超えて離れていても終える（FR-28 AC2）
      required:
      - position
      - confirmFarFromDropoff
    Conditions:
      type: object
      properties:
        minPayout:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        maxPickupDistanceM:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100000
          - type: 'null'
      required:
      - minPayout
      - maxPickupDistanceM
    Cursor:
      anyOf:
      - type: string
        description: 不透明なカーソル（DEC-42）
        maxLength: 200
      - type: 'null'
    DriverRide:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        state:
          type: string
          enum:
          - booking
          - hold_checking
          - not_booked
          - searching
          - accepted
          - arrived
          - in_progress
          - ended
          - cancelled
          - no_show
        version:
          type: integer
          minimum: 1
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        payout:
          $ref: '#/components/schemas/Money'
        routeToPickup:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
        routeToDropoff:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
          description: 降車場所までの経路。得られないときは null（運転の開始の応答でも null になりうる。FND-47）
        pickupEta:
          anyOf:
          - type: object
            properties:
              arrivalAt:
                type: string
                format: date-time
            required:
            - arrivalAt
          - type: 'null'
        passengerSharingLocation:
          type: boolean
          description: 乗客が位置を送っているか（FR-24 AC2）
        arrival:
          anyOf:
          - type: object
            properties:
              at:
                type: string
                format: date-time
              verified:
                type: boolean
            required:
            - at
            - verified
          - type: 'null'
        noShowAvailableAt:
          anyOf:
          - type: string
            format: date-time
            description: 不在で終えられる時刻（T_noshow_wait。FR-27 AC2）
          - type: 'null'
        payment:
          $ref: '#/components/schemas/PaymentState'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - rideId
      - state
      - version
      - pickup
      - dropoff
      - payout
      - payment
      - createdAt
      - updatedAt
      description: ドライバーに見せる依頼（乗客の名前と連絡先は持たない）
    DriverRideResult:
      type: object
      properties:
        ride:
          $ref: '#/components/schemas/DriverRide'
      required:
      - ride
    EarningsItem:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          type: string
          enum:
          - fare
          - cancellation_fee
          - no_show_fee
        at:
          type: string
          format: date-time
        fare:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        commission:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        payout:
          $ref: '#/components/schemas/Money'
        paymentState:
          type: string
          enum:
          - paid
          - unpaid
          - checking
      required:
      - rideId
      - kind
      - at
      - payout
      - paymentState
    EarningsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EarningsItem'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - nextCursor
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: 円の整数（Stripe のゼロ小数通貨。DEC-41）
          minimum: 0
        currency:
          type: string
          enum:
          - jpy
      required:
      - amount
      - currency
    PaymentState:
      type: object
      properties:
        state:
          type: string
          enum:
          - none
          - holding
          - hold_checking
          - held
          - release_checking
          - released
          - capturing
          - checking
          - paid
          - unpaid
          - unpaid_checking
          - partially_refunded
          - refunded
          description: |-
            依頼の支払いの状態（報告書の「要素をまたぐ状態」。13 値）
            - none: 押さえも請求もない（押さえがないと Stripe の一覧で確かめた場合を含む）
            - holding: 押さえの処理中
            - hold_checking: 手配の押さえの結果が分からない間（依頼は hold_checking。DEC-52）
            - held: 押さえている。降車場所の変更の押さえ直しを確かめている間も held のまま（古い押さえが有効。新しい押さえはお金の操作で追う）
            - release_checking: 押さえの取り消しの結果が分からない間（無料の取り消し、システムの取り消し、手配をやめた依頼、確かめられなかった到着での不在）
            - released: 押さえを取り消した（Stripe が取り消しの成功を答えた）
            - capturing: 確定の処理中
            - checking: 確定（運賃、キャンセル料、不在の料金）の結果を確かめている間だけ
            - paid: 払った
            - unpaid: 請求に失敗した（未払い。払う額は unpaidAmount。キャンセル料と不在の料金の失敗を含む）
            - unpaid_checking: 未払いの支払いの結果が分からない間（202 PAYMENT_PENDING）
            - partially_refunded: 一部を返金した
            - refunded: 全額を返金した
            返金を確かめている間は paid か partially_refunded のまま（返金の操作で追い、返金できる残りの額から引く）。「押さえていません」と示すのは、Stripe が答えたとき（none、released）だけ
        unpaidAmount:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        reason:
          anyOf:
          - type: string
            description: 失敗の理由（人向けの文）
          - type: 'null'
      required:
      - state
    Place:
      type: object
      properties:
        label:
          type: string
        address:
          anyOf:
          - type: string
          - type: 'null'
        placeId:
          anyOf:
          - type: string
          - type: 'null'
        position:
          $ref: '#/components/schemas/Point'
      required:
      - label
      - position
    Point:
      type: object
      properties:
        lat:
          type: number
          description: 緯度（小数点以下 6 桁以上を保つ。NFR-37）
          minimum: -90
          maximum: 90
        lng:
          type: number
          description: 経度
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
    Position:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          description: 誤差（m）
          minimum: 0
        measuredAt:
          type: string
          format: date-time
          description: 端末が測った時刻
      required:
      - lat
      - lng
      - accuracyM
      - measuredAt
    PositionInput:
      type: object
      properties:
        position:
          anyOf:
          - $ref: '#/components/schemas/Position'
          - type: 'null'
      required:
      - position
      description: 今の位置。得られないときは null（FR-25 AC3）
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）。任意（DEC-38）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数。429 と 503 では Retry-After の見出しと同じ。NO_SHOW_TOO_EARLY では不在で終えられるまでの残りの秒数。任意
          minimum: 0
        distanceMeters:
          type: integer
          description: 場所からの距離（m）。TOO_FAR_FROM_PICKUP、FAR_FROM_DROPOFF のとき。任意
          minimum: 0
        remainingAttempts:
          type: integer
          description: 残りの回数。CONFIRMATION_CODE_MISMATCH のとき。任意
          minimum: 0
        currentFee:
          $ref: '#/components/schemas/Money'
          description: 今の額。CANCELLATION_FEE_CHANGED のとき（この額で確かめ直す）。任意
        remainingRefundable:
          $ref: '#/components/schemas/Money'
          description: 返金できる残りの額。REFUND_EXCEEDS_REMAINING のとき。任意
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors と、場合ごとの拡張の欄（retryAfterSeconds、distanceMeters、remainingAttempts、currentFee、remainingRefundable。どれも任意）を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    Reception:
      type: object
      properties:
        status:
          type: string
          enum:
          - 'off'
          - receiving
        suspended:
          type: boolean
        since:
          type: string
          format: date-time
      required:
      - status
      - suspended
      - since
    ReceptionStartRequest:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/Position'
      required:
      - position
    RequestDetail:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/RequestListItem'
        route:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
        toPickup:
          anyOf:
          - type: object
            properties:
              distanceM:
                type: integer
              durationSec:
                type: integer
            required:
            - distanceM
            - durationSec
          - type: 'null'
        rideDurationSec:
          type: integer
          minimum: 0
      required:
      - request
      - route
      - toPickup
      - rideDurationSec
    RequestListItem:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        listedChangeId:
          type: string
          pattern: ^chg_[0-9A-HJKMNP-TV-Z]{26}$
          description: 一覧に出した変化の ID（FR-54 の表示の記録に使う）
        pickup:
          $ref: '#/components/schemas/Place'
        dropoff:
          $ref: '#/components/schemas/Place'
        distanceToPickupM:
          type: integer
          description: 直線の距離（DEC-22）
          minimum: 0
        payout:
          $ref: '#/components/schemas/Money'
        listedAt:
          type: string
          format: date-time
      required:
      - rideId
      - listedChangeId
      - pickup
      - dropoff
      - distanceToPickupM
      - payout
      - listedAt
    RequestsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestListItem'
        listHash:
          type: string
          description: 今の一覧の ID の集まりのハッシュ（位置の送信で一覧が変わったかを知るため）
      required:
      - items
      - listHash
    Route:
      type: object
      properties:
        encodedPolyline:
          type: string
          description: Google の経路の線（依頼の間だけ持つ。DEC-22）
        distanceM:
          type: integer
          minimum: 0
        durationSec:
          type: integer
          minimum: 0
      required:
      - encodedPolyline
      - distanceM
      - durationSec
    StartRequest:
      type: object
      properties:
        confirmationCode:
          type: string
          pattern: ^[0-9]{4}$
        position:
          anyOf:
          - $ref: '#/components/schemas/Position'
          - type: 'null'
      required:
      - confirmationCode
      - position
