openapi: 3.1.0
info:
  title: ドライバーの API（IFC-03）
  version: 1.1.0
  description: 第 3 段階（architecture-to-high-level-design）で決めた部分だけを書く。項目は docs/design/ifc/IFC-03.yaml。仮の値は x-provisional で示す。共通の約束事は DEC-38〜50（エラーの形、ID、時刻、お金、一覧、セッション、ログとトレース、命名、冪等キー、版、タイムアウト）。
servers:
- url: https://{service}-{projectNumber}.asia-northeast1.run.app
  description: デモの回の Cloud Run のサービス（決まった形の URL。DEC-06）
  variables:
    service:
      default: ride-demo
    projectNumber:
      default: '000000000000'
- url: http://localhost:8080
  description: 手元（DRV-18）
paths:
  /api/v1/driver/reception/start:
    post:
      operationId: driver_reception_start
      summary: 受付を始める（今の位置を一つ添える）。画面の点灯は画面が行う（FR-52）
      description: |-
        受付を始める（今の位置を一つ添える）。画面の点灯は画面が行う（FR-52）

        機能: FR-17、FR-47

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 受付中にした
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reception'
        '400':
          description: |-
            LOCATION_REQUIRED: 位置がない（FR-17 AC2。ふつうは画面が位置情報の許可で先に止める） → 位置情報の利用の許可を求める
            INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない
          x-error-codes:
          - LOCATION_REQUIRED
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOCATION_REQUIRED:
                  value:
                    type: urn:ride-hailing-demo:problem:location_required
                    title: 位置がない（FR-17 AC2。ふつうは画面が位置情報の許可で先に止める）
                    status: 400
                    code: LOCATION_REQUIRED
                    detail: 位置がない（FR-17 AC2。ふつうは画面が位置情報の許可で先に止める）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'UNAUTHENTICATED: ログインしていないか、セッションが切れた → ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る'
          x-error-codes:
          - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:ride-hailing-demo:problem:unauthenticated
                    title: ログインしていないか、セッションが切れた
                    status: 401
                    code: UNAUTHENTICATED
                    detail: ログインしていないか、セッションが切れた
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '403':
          description: |-
            DRIVER_SUSPENDED: 配車を停止されている（FR-17 AC3、FR-47 AC2） → 受付を始めさせずその旨を示す
            FORBIDDEN: 役割が違う、または送り元（Origin）がサービスの URL でない → 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）
          x-error-codes:
          - DRIVER_SUSPENDED
          - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                DRIVER_SUSPENDED:
                  value:
                    type: urn:ride-hailing-demo:problem:driver_suspended
                    title: 配車を停止されている（FR-17 AC3、FR-47 AC2）
                    status: 403
                    code: DRIVER_SUSPENDED
                    detail: 配車を停止されている（FR-17 AC3、FR-47 AC2）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                FORBIDDEN:
                  value:
                    type: urn:ride-hailing-demo:problem:forbidden
                    title: 役割が違う、または送り元（Origin）がサービスの URL でない
                    status: 403
                    code: FORBIDDEN
                    detail: 役割が違う、または送り元（Origin）がサービスの URL でない
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '404':
          description: 'NOT_FOUND: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29） → 画面を読み直す'
          x-error-codes:
          - NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NOT_FOUND:
                  value:
                    type: urn:ride-hailing-demo:problem:not_found
                    title: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    status: 404
                    code: NOT_FOUND
                    detail: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '409':
          description: 'OPERATION_IN_PROGRESS: 同じ冪等キーの要求がまだ動いている（DEC-48） → Retry-After（1 秒）の後に同じキーで送るか、状態を読み直す'
          x-error-codes:
          - OPERATION_IN_PROGRESS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                OPERATION_IN_PROGRESS:
                  value:
                    type: urn:ride-hailing-demo:problem:operation_in_progress
                    title: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    status: 409
                    code: OPERATION_IN_PROGRESS
                    detail: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '422':
          description: 'IDEMPOTENCY_KEY_REUSED: 同じ冪等キーで中身の違う要求（DEC-48） → 画面の誤り。新しい操作として新しいキーで始める'
          x-error-codes:
          - IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    type: urn:ride-hailing-demo:problem:idempotency_key_reused
                    title: 同じ冪等キーで中身の違う要求（DEC-48）
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: 同じ冪等キーで中身の違う要求（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: driver.reception.start
      x-functions:
      - FR-17
      - FR-47
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptionStartRequest'
  /api/v1/driver/reception/stop:
