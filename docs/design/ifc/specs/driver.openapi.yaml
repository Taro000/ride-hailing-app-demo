  /api/v1/driver/requests:
    get:
      operationId: driver_requests_list
      summary: 示してよい依頼の一覧（しきい値、受ける条件、停止を一か所の規則で絞る。DEC-09）
      description: |-
        示してよい依頼の一覧（しきい値、受ける条件、停止を一か所の規則で絞る。DEC-09）。しきい値の判定には、評価を送ったときにサーバーの中で計算した評価値を使う（FR-15）

        機能: FR-16、FR-18、FR-34、FR-47、FR-15

        SLI-01 の六つの操作の一つ（route_id で数える）

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '200':
          description: 一覧。ないときは items が空（FR-18 AC4）
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsPage'
        '400':
          description: 'INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない'
          x-error-codes:
