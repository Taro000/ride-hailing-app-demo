openapi: 3.1.0
info:
  title: エンジニアの API（IFC-07）
  version: 1.1.0
  description: 第 3 段階（architecture-to-high-level-design）で決めた部分だけを書く。項目は docs/design/ifc/IFC-07.yaml。仮の値は x-provisional で示す。共通の約束事は DEC-38〜50（エラーの形、ID、時刻、お金、一覧、セッション、ログとトレース、命名、冪等キー、版、タイムアウト）。
servers:
- url: https://{service}-{projectNumber}.asia-northeast1.run.app
  description: デモの回の Cloud Run のサービス（決まった形の URL。DEC-06）
  variables:
    service:
      default: ride-demo
    projectNumber:
      default: '000000000000'
- url: http://localhost:8080
  description: 手元（DRV-18）
paths:
  /api/v1/engineer/history-search:
    post:
      operationId: engineer_history_search
      summary: 依頼 ID、トレース ID、利用者 ID、時間の範囲、エラーの種類で状態の履歴とブラウザのエラーの記録を探し、各行に L
      description: |-
        依頼 ID、トレース ID、利用者 ID、時間の範囲、エラーの種類で状態の履歴とブラウザのエラーの記録を探し、各行に Logs Explorer を開く URL を付ける。読むだけの POST（条件に識別子と時刻を含むので本文で送る。DEC-16）なので冪等キーを持たない

        機能: FR-40、FR-39

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      responses:
        '200':
          description: 時刻の順。ないときは空（FR-40 AC4）
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySearchResult'
        '400':
          description: |-
            SEARCH_CONDITION_REQUIRED: 条件がない → 条件を入れるよう示す
            RANGE_TOO_WIDE: 時間の範囲が 31 日を超える → 狭めるよう示す
            INVALID_REQUEST: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身 → 欄を直す。同じものを送り直さない
          x-error-codes:
          - SEARCH_CONDITION_REQUIRED
          - RANGE_TOO_WIDE
          - INVALID_REQUEST
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                SEARCH_CONDITION_REQUIRED:
                  value:
                    type: urn:ride-hailing-demo:problem:search_condition_required
                    title: 条件がない
                    status: 400
                    code: SEARCH_CONDITION_REQUIRED
                    detail: 条件がない
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                RANGE_TOO_WIDE:
                  value:
                    type: urn:ride-hailing-demo:problem:range_too_wide
                    title: 時間の範囲が 31 日を超える
                    status: 400
                    code: RANGE_TOO_WIDE
                    detail: 時間の範囲が 31 日を超える
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                INVALID_REQUEST:
                  value:
                    type: urn:ride-hailing-demo:problem:invalid_request
                    title: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）
                    status: 400
                    code: INVALID_REQUEST
                    detail: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '401':
          description: 'UNAUTHENTICATED: ログインしていないか、セッションが切れた → ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る'
          x-error-codes:
          - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                UNAUTHENTICATED:
                  value:
                    type: urn:ride-hailing-demo:problem:unauthenticated
                    title: ログインしていないか、セッションが切れた
                    status: 401
                    code: UNAUTHENTICATED
                    detail: ログインしていないか、セッションが切れた
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '403':
          description: 'FORBIDDEN: 役割が違う、または送り元（Origin）がサービスの URL でない → 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）'
          x-error-codes:
          - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN:
                  value:
                    type: urn:ride-hailing-demo:problem:forbidden
                    title: 役割が違う、または送り元（Origin）がサービスの URL でない
                    status: 403
                    code: FORBIDDEN
                    detail: 役割が違う、または送り元（Origin）がサービスの URL でない
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '404':
          description: 'NOT_FOUND: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29） → 画面を読み直す'
          x-error-codes:
          - NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                NOT_FOUND:
                  value:
                    type: urn:ride-hailing-demo:problem:not_found
                    title: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    status: 404
                    code: NOT_FOUND
                    detail: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: engineer.history_search
      x-functions:
      - FR-40
      - FR-39
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistorySearchRequest'
