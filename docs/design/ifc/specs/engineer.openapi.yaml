  /api/v1/engineer/accounts/{accountId}:
    patch:
      operationId: engineer_accounts_patch
      summary: テスト用の印を付ける・外す。後の記録に写る（FR-01 AC5）
      description: |-
        テスト用の印を付ける・外す。後の記録に写る（FR-01 AC5）

        機能: FR-01

        回数の上限（仮。DEC-55）: アカウントごとに 1 分に 120 回（そのほかの経路）
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ClientTraceId'
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 変えた
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
          content:
            application/json:
              schema:
