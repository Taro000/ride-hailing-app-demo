                $ref: '#/components/schemas/Problem'
              examples:
                OPERATION_IN_PROGRESS:
                  value:
                    type: urn:ride-hailing-demo:problem:operation_in_progress
                    title: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    status: 409
                    code: OPERATION_IN_PROGRESS
                    detail: 同じ冪等キーの要求がまだ動いている（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '422':
          description: 'IDEMPOTENCY_KEY_REUSED: 同じ冪等キーで中身の違う要求（DEC-48） → 画面の誤り。新しい操作として新しいキーで始める'
          x-error-codes:
          - IDEMPOTENCY_KEY_REUSED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    type: urn:ride-hailing-demo:problem:idempotency_key_reused
                    title: 同じ冪等キーで中身の違う要求（DEC-48）
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: 同じ冪等キーで中身の違う要求（DEC-48）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '429':
          description: 'RATE_LIMITED: 回数の上限（DEC-55） → Retry-After まで待つ'
          x-error-codes:
          - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RATE_LIMITED:
                  value:
                    type: urn:ride-hailing-demo:problem:rate_limited
                    title: 回数の上限（DEC-55）
                    status: 429
                    code: RATE_LIMITED
                    detail: 回数の上限（DEC-55）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '500':
          description: 'INTERNAL_ERROR: 想定外の誤り → 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す'
          x-error-codes:
          - INTERNAL_ERROR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INTERNAL_ERROR:
                  value:
                    type: urn:ride-hailing-demo:problem:internal_error
                    title: 想定外の誤り
                    status: 500
                    code: INTERNAL_ERROR
                    detail: 想定外の誤り
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
        '503':
          description: |-
            ROUTE_TIMEOUT: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33） → 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
            DEPENDENCY_UNAVAILABLE: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる → ROUTE_TIMEOUT と同じ
          x-error-codes:
          - ROUTE_TIMEOUT
          - DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ROUTE_TIMEOUT:
                  value:
                    type: urn:ride-hailing-demo:problem:route_timeout
                    title: T_route（10 秒）で切った
                    status: 503
                    code: ROUTE_TIMEOUT
                    detail: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                DEPENDENCY_UNAVAILABLE:
                  value:
                    type: urn:ride-hailing-demo:problem:dependency_unavailable
                    title: Turso に届かないか遅い（T_db）
                    status: 503
                    code: DEPENDENCY_UNAVAILABLE
                    detail: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-App-Version:
              $ref: '#/components/headers/XAppVersion'
      x-route-id: engineer.accounts.patch
      x-functions:
      - FR-01
      x-rate-limit:
        value: アカウントごとに 1 分に 120 回（DEC-55 のそのほかの経路）
        x-provisional: true
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rh_session
      description: サーバーに置くセッション（DEC-43）。クッキーは __Host-rh_session（HttpOnly、Secure、SameSite=Strict、Path=/）。状態を変える要求は Origin がサービスの URL と同じであること（DEC-20）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 操作ごとに画面が作る UUID。送り直しでも同じ（DEC-48）
      schema:
        type: string
        format: uuid
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context。画面は操作ごとに必ず送る（DEC-44）
      schema:
        type: string
        pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
    ClientTraceId:
      name: X-Client-Trace-Id
      in: header
      required: false
      description: traceparent のトレース ID の写し（Cloud Run が入れ替えても残すため。DEC-44）
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
  headers:
    RetryAfter:
      description: 待つ秒数
      schema:
        type: integer
        minimum: 0
    XAppVersion:
      description: サーバーの版（DEC-49）
      schema:
        type: string
  schemas:
    Account:
      type: object
      properties:
        accountId:
          type: string
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
        roles:
          type: array
          items:
            type: string
            enum:
            - passenger
            - driver
            - operator
            - engineer
        testAccount:
          type: boolean
      required:
      - accountId
      - roles
      - testAccount
    AccountPatch:
      type: object
      properties:
        testAccount:
          type: boolean
      required:
      - testAccount
    Cursor:
      anyOf:
      - type: string
        description: 不透明なカーソル（DEC-42）
        maxLength: 200
      - type: 'null'
    HistorySearchRequest:
      type: object
      properties:
        rideId:
          anyOf:
          - type: string
            pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
        traceId:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{32}$
          - type: 'null'
        accountId:
          anyOf:
          - type: string
            pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
        from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        errorKind:
          anyOf:
          - type: string
          - type: 'null'
        cursor:
          $ref: '#/components/schemas/Cursor'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: 1〜100。既定 20（DEC-42）
          x-provisional: true
      description: どれか一つ以上の条件を入れる。時間の範囲は 31 日まで
    HistorySearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              changeId:
                type: string
                pattern: ^chg_[0-9A-HJKMNP-TV-Z]{26}$
              rideId:
                type: string
                pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
              type:
                type: string
              recordedAt:
                type: string
                format: date-time
              actor:
                type: object
                properties:
                  kind:
                    type: string
                  accountId:
                    anyOf:
                    - type: string
                      pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
                    - type: 'null'
                required:
                - kind
              traceId:
                anyOf:
                - type: string
                  pattern: ^[0-9a-f]{32}$
                - type: 'null'
              logsUrl:
                anyOf:
                - type: string
                  description: Logs Explorer をこのトレース ID で開く URL（DEC-19）
                - type: 'null'
            required:
            - changeId
            - rideId
            - type
            - recordedAt
            - actor
        clientErrors:
          type: array
          items:
            type: object
            properties:
              clientErrorId:
                type: string
                format: uuid
              kind:
                type: string
              occurredAt:
                type: string
                format: date-time
              traceId:
                type: string
                pattern: ^[0-9a-f]{32}$
              rideId:
                anyOf:
                - type: string
                  pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
                - type: 'null'
              logsUrl:
                type: string
            required:
            - clientErrorId
            - kind
            - occurredAt
            - traceId
            - logsUrl
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - clientErrors
      - nextCursor
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: 円の整数（Stripe のゼロ小数通貨。DEC-41）
          minimum: 0
        currency:
          type: string
          enum:
          - jpy
      required:
      - amount
      - currency
    Position:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyM:
          type: number
          description: 誤差（m）
          minimum: 0
        measuredAt:
          type: string
          format: date-time
          description: 端末が測った時刻
      required:
      - lat
      - lng
      - accuracyM
      - measuredAt
    Problem:
      type: object
      properties:
        type:
          type: string
          description: 問題の種類の URI。urn:ride-hailing-demo:problem:<code の小文字>（DEC-38）
          format: uri
        title:
          type: string
          description: 人向けの短い文（日本語）
        status:
          type: integer
          description: HTTP の状態の符号
        code:
          type: string
          description: プログラム向けの変わらない符号（UPPER_SNAKE_CASE。DEC-38、DEC-47）
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: 人向けの説明（日本語。個人情報を含めない）。任意（DEC-38）
        traceId:
          type: string
          description: ブラウザが作ったトレース ID（32 桁の 16 進。DEC-44）
          pattern: ^[0-9a-f]{32}$
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON Pointer
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
          description: 入力の誤りの欄ごとの中身
        retryAfterSeconds:
          type: integer
          description: 待つ秒数。429 と 503 では Retry-After の見出しと同じ。NO_SHOW_TOO_EARLY では不在で終えられるまでの残りの秒数。任意
          minimum: 0
        distanceMeters:
          type: integer
          description: 場所からの距離（m）。TOO_FAR_FROM_PICKUP、FAR_FROM_DROPOFF のとき。任意
          minimum: 0
        remainingAttempts:
          type: integer
          description: 残りの回数。CONFIRMATION_CODE_MISMATCH のとき。任意
          minimum: 0
        currentFee:
          $ref: '#/components/schemas/Money'
          description: 今の額。CANCELLATION_FEE_CHANGED のとき（この額で確かめ直す）。任意
        remainingRefundable:
          $ref: '#/components/schemas/Money'
          description: 返金できる残りの額。REFUND_EXCEEDS_REMAINING のとき。任意
      required:
      - type
      - title
      - status
      - code
      - traceId
      description: RFC 9457 の問題の詳細に code、traceId、errors と、場合ごとの拡張の欄（retryAfterSeconds、distanceMeters、remainingAttempts、currentFee、remainingRefundable。どれも任意）を足したもの（DEC-38）。content type は application/problem+json
      additionalProperties: true
    RidePositions:
      type: object
      properties:
        rideId:
          type: string
          pattern: ^ride_[0-9A-HJKMNP-TV-Z]{26}$
        positions:
          type: array
          items:
            type: object
            properties:
              changeType:
                type: string
              position:
                $ref: '#/components/schemas/Position'
            required:
            - changeType
            - position
        receipts:
          type: array
          items:
            type: object
            properties:
              receivedAt:
                type: string
                format: date-time
              position:
                $ref: '#/components/schemas/Position'
              speedMps:
                anyOf:
                - type: number
                - type: 'null'
            required:
            - receivedAt
            - position
      required:
      - rideId
      - positions
      - receipts
