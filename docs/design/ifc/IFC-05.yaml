id: IFC-05
title: 位置の受け取り
status: active
basis: assumed
basis_note: 端末が画面に出ている間に測った位置を測った時刻、確からしさ、速さとともに決まった間隔で送り、サーバーが最新の位置と受けた記録を持ち、古い位置を分からないものとして扱うことは DEC-07（入力）。迎車が乗る場所に着いたことをサーバーが受けた位置と乗る場所の距離で決めることは DEC-07 と FR-10 の 1（入力）。ドライバーは受付をしている間も画面に出したままにすることは TC-18（入力）。送る間隔と送る位置の新しさ、位置を分からないとみなす古さを決めて HND-03 を決めた。分からないとみなす古さを T_vehicle_location_lag にすることは、依頼を届ける判断に使う位置がそれより遅れないこと（QR-19）からの推定。送る間隔は DAS-11 による暫定の決定。位置の古さの予算は報告の「遅延の予算とタイムアウト」。一回の送りのタイムアウトを、送り直さない呼び出しの DEC-46 の決め方に合わせて書いたことは FND-29 を受けた
premises: [TC-18, DAS-03, DAS-11, QCR-02, QCR-03]
kind: http
name: 位置の受け取り
provider: ELM-03
consumers: [ELM-01]
functions: [FR-08, FR-10, FR-13, FR-19, FR-22, FR-24]
operations:
  - name: POST /v1/positions
    does: 画面に出ている乗客とドライバーの端末が、測った位置（緯度、経度、確からしさ、速さ、測った時刻）を送る。ELM-03 は最新の位置として持ち、受けた記録に残し、迎車が乗る場所から D_pickup_position_gap のうちに入ったら迎車の到着とし、相手に流れ（IFC-11 の position.updated と ride.pickup_arrived）で示す（FR-08、FR-10、FR-13、FR-24）
format: JSON（UTF-8）。緯度と経度は WGS84 の度、確からしさは m、速さは m/s（分からなければ null）、時刻は DEC-37 の端末の時刻の添え方
protocol: HTTPS の要求と応答
auth: セッション（DEC-40）。位置を送るのは、ドライバーは受付をしている間と迎車中と乗車中、乗客は配車が確定してから乗車が始まるまで（DEC-07、FR-24）
errors:
  - case: どの操作にも共通する誤り
    signal: DEC-35 の共通の符号
    caller_does: DEC-35 のとおり。ただし送り直さず、次の間隔で新しい位置を送る
  - case: 位置を送る場面でない（受付をしていない、依頼が確定していないか終わった）
    signal: 409 with code POSITION_NOT_NEEDED
    caller_does: 位置を送るのをやめる
  - case: 緯度と経度の範囲や時刻の形が誤っている
    signal: 400 with code VALIDATION_FAILED
    caller_does: その位置を捨て、次の間隔で新しい位置を送る
idempotency: 自然に冪等。同じ測った時刻の位置は一度だけ受け、測った時刻が今の最新より古い位置は記録に残すが最新にしない。冪等キーは付けない（DEC-42）
timing:
  timeout: 端末は 5 秒ごとに、その前の 5 秒のうちに測った位置を送る（新しい位置がなければ測り直してから送る）。一回の送りのタイムアウトは 5 秒で、次の送りで替わるため送り直さない（見捨てた送りが ELM-03 で書かれても、測った時刻の順で新しい方が残る）。ELM-03 の答えの期限は 2 秒（DEC-46）。5 秒は、送り直さない呼び出しの DEC-46 の決め方のとおり、ELM-03 の期限 2 秒と通信の往復の予算 1.0 秒の和 3.0 秒より長く、送る間隔 5 秒を超えない（つながり直しの余裕は足さない）。位置は、測った時刻（DEC-37 でサーバーの時刻に直したもの）から T_vehicle_location_lag を過ぎると分からないものとし、依頼を届ける判断、距離の条件、走っているかの判断、着く見込みに使わず、画面には最後に分かった位置と時刻として示す（FR-08 の 2、FR-13 の 3、FR-19 の 4、FR-24 の 2、HND-03）。値は DAS-11
  ordering: 参加者ごとに測った時刻の順。遅れて着いた古い位置は最新を替えない
  delivery: 最新の位置を届ければよく、失った位置は次の位置が補うため送り直さない。つながらない間に測った位置はためずに捨てる
versioning: DEC-41
observability: 受けた位置の記録（DAT-10。位置は暗号にし、測った時刻と受けた時刻と直した時刻を持つ）。境界の出来事とログには位置を書かない（DEC-15、QR-58）
sli_bindings: []
spec: null
as_is: new
