id: IFC-04
title: 位置と前面・裏の API
status: draft
version: 2
basis: inferred
basis_note: DEC-14（10 秒ごとに HTTP、裏に回った時刻を送る）、DEC-15（座標は位置のモジュールだけ）は入力。受けるたびに受信の記録に一行書くことは FR-17 版 2（AC2）。位置と前面・裏の重複をそれぞれの ID で捨てることは DEC-48 版 2 の例外（FND-43）。応答で一覧の変化と速さを返すことは推定
needs_agreement: false
approver_candidates: []
kind: http
name: 位置と前面・裏の API
provider: ELM-04
consumers:
- ELM-01
- ELM-02
functions:
- FR-10
- FR-11
- FR-17
- FR-21
- FR-24
- FR-34
- FR-51
operations:
- name: POST /api/v1/locations
  does: 現在地を一つ送る（送信の ID clientSendId を付ける）。サーバーは受けるたびに位置の受信の記録（DAT-09）に一行書く（FR-17 AC2）。応答は次に送る間隔、一覧が変わったか（ドライバー）、走行中か。回数の上限はアカウントごとに 1 分に 12 回（L_send の 2 倍）
- name: POST /api/v1/visibility-events
  does: ブラウザが裏に回った時刻と前面に戻った時刻（裏に回るときに送り、届かなければ前面に戻ったときに送り直す。DEC-14）。回数の上限はアカウントごとに 1 分に 30 回
format: JSON（UTF-8）。エラーは application/problem+json（DEC-38）。額は円の整数（DEC-41）、時刻は UTC の RFC 3339（DEC-40）
protocol: HTTPS の要求と応答。Cloud Run の入口から ELM-04 へ。三つの SPA と同じ入口なので CORS は使わない（DEC-23）
auth: 乗客かドライバーのセッション。送り手はセッションで決め、本文の ID は使わない（F3）。乗客は迎車中（accepted、arrived）で位置の利用を許可したときだけ、ドライバーは受付中か担当の依頼の間だけ受け付ける
errors:
- case: 'POST /api/v1/locations: 送る状態でない（乗客の乗車が始まったか依頼が終わった、ドライバーが受付を止めた）'
  signal: 409 NOT_SHARING_NOW
  caller_does: 送るのをやめる（FR-24 AC3）
- case: 'POST /api/v1/locations: 座標の範囲か時刻がおかしい（未来の時刻、60 秒より古い測定）'
  signal: 400 INVALID_REQUEST
  caller_does: その位置を捨て、次の位置を送る
- case: 'POST /api/v1/locations: Turso に届かない'
  signal: 503 DEPENDENCY_UNAVAILABLE
  caller_does: 送り直さず、次の時刻に新しい位置を送る
- case: '共通: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身'
  signal: 400 INVALID_REQUEST
  caller_does: 欄を直す。同じものを送り直さない
- case: '共通: ログインしていないか、セッションが切れた'
  signal: 401 UNAUTHENTICATED
  caller_does: ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る
- case: '共通: 役割が違う、または送り元（Origin）がサービスの URL でない'
  signal: 403 FORBIDDEN
  caller_does: 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）
- case: '共通: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）'
  signal: 404 NOT_FOUND
  caller_does: 画面を読み直す
- case: '共通: 同じ冪等キーの要求がまだ動いている（DEC-48）'
  signal: 409 OPERATION_IN_PROGRESS
  caller_does: Retry-After（1 秒）の後に同じキーで送るか、状態を読み直す
- case: '共通: 同じ冪等キーで中身の違う要求（DEC-48）'
  signal: 422 IDEMPOTENCY_KEY_REUSED
  caller_does: 画面の誤り。新しい操作として新しいキーで始める
- case: '共通: 回数の上限（DEC-55）'
  signal: 429 RATE_LIMITED
  caller_does: Retry-After まで待つ
- case: '共通: 想定外の誤り'
  signal: 500 INTERNAL_ERROR
  caller_does: 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す
- case: '共通: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）'
  signal: 503 ROUTE_TIMEOUT
  caller_does: 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
- case: '共通: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる'
  signal: 503 DEPENDENCY_UNAVAILABLE
  caller_does: ROUTE_TIMEOUT と同じ
idempotency: 冪等キーは付けない（DEC-48 の例外）。位置はブラウザが送るたびに作る送信の ID（clientSendId。UUIDv4）で二度目を捨て、受信の記録を増やさない。最後の位置は measuredAt が新しいときだけ上書きする（遅れて届いた古い位置で戻さない）。前面と裏の出来事は clientEventId で二度目を捨てる
timing:
  timeout: ブラウザ 15 秒。前の送信が終わっていないうちに次の時刻が来たら、前を待たず新しい位置を送る（古い位置は送り直さない）。送る間隔 L_send 10 秒（DEC-14）
  ordering: null
  delivery: null
versioning: 経路に /api/v1。v1 の中では足すだけで、知らない欄は両側とも無視する。応答の X-App-Version とブラウザの版が違えば、操作の途中でないときに画面を読み直す（DEC-49）
observability: 受信の記録（DAT-09）は、毎日の SLI-03 の確かめ直し（受けた時刻だけ。第 2 段階の DEC-16 版 5）、NFR-03 のアラートの毎分の確かめ（DAT-21。DEC-35）、苦情の調べの記録した位置（FR-45 AC3）の入力。ログには座標を書かず、受けたこと、誤差の区分、状態だけ（DEC-15、DEC-44）
spec: ifc/specs/location.openapi.yaml
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 受けるたびに受信の記録に一行書くことを書いた。位置の重複を送信の ID で捨てる形にした（DEC-48 の例外）。受信の記録の使い道（毎日の SLI-03 の確かめ直し、アラート、苦情の調べ）を書いた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-17 版 2、FR-45 版 2、SLI-03 版 2）、FND-43'
