id: IFC-08
title: 状態の変化の配信（SSE）
status: draft
version: 1
basis: inferred
basis_note: DEC-03（SSE、1 秒ごとの追いかけ、つなぎ直しは最後の通し番号から、30 分で閉じる）と DEC-21（流れの本数の上限と 429）は入力。出来事の種類、出どころ（状態の履歴、ドライバーの受付の記録、今の値の読み出し）、一覧を丸ごと送ること、断られたときの問い合わせは推定（DEC-51、FND-28）
needs_agreement: true
approver_candidates:
- 開発の責任者
kind: event
name: 状態の変化の配信
provider: ELM-04
consumers:
- ELM-01
- ELM-02
functions:
- FR-06
- FR-07
- FR-09
- FR-10
- FR-11
- FR-12
- FR-16
- FR-18
- FR-19
- FR-20
- FR-22
- FR-24
- FR-25
- FR-26
- FR-28
- FR-29
- FR-31
- FR-47
- FR-54
operations:
- name: hello
  does: つないだ直後に、サーバーの版、サーバーの時刻、カーソルを送る
- name: ride.updated
  does: 自分の依頼の状態の変化（手配、許諾、取り消し、探し直し、迎車の到着、乗車の開始、不在、乗車の終了、降車場所の変更、請求、請求の失敗、返金、押さえの解放）。changeId と依頼の今の姿（役割ごとに絞ったもの）
- name: ride.live
  does: 担当の依頼の相手の位置（乗客にはドライバー、迎車中のドライバーには許可した乗客）と到着予定。変わったときだけ、1 秒に 1 回まで
- name: driver.requests
  does: ドライバーに示してよい依頼の一覧を丸ごと（新しい依頼、ほかのドライバーの許諾、取り消し、探し直し、停止で変わったとき）
- name: driver.status
  does: ドライバーの受付と停止の変化（FR-47 の停止で画面を変える）
- name: stream.closing
  does: 30 分の区切りかインスタンスの終わりで閉じる前に送る
format: text/event-stream（UTF-8）。data は JSON で、どれも v（スキーマの版）を持つ。id はカーソル（h<状態の履歴の通し番号>-d<ドライバーの受付の記録の通し番号>）。25 秒ごとに生存確認のコメント
protocol: HTTPS の長い応答（Server-Sent Events）。GET /api/v1/stream。ブラウザは fetch で読む（traceparent と Last-Event-ID の見出しを付けるため）。サーバーの中では、インスタンスが 1 秒ごとに状態の履歴とドライバーの受付の記録を通し番号で追い、担当の依頼の相手の位置と到着予定の今の値を読み、相手ごとに見てよいものだけを送る（DEC-51）
auth: 乗客かドライバーのセッションのクッキー。流れの本数はアカウントごと 2（超えると古い流れを閉じる）、IP ごと 6、全体 40（DEC-21）
errors:
- case: ログインしていない
  signal: 401 UNAUTHENTICATED
  caller_does: ログインの画面へ
- case: 流れの本数の上限
  signal: 429 STREAM_LIMIT と Retry-After
  caller_does: 流れを開かず、15 秒ごとに GET /api/v1/passenger/rides/active（ドライバーは GET /api/v1/driver/rides/active と GET /api/v1/driver/requests）で取り直し、Retry-After の後に開き直す（DEC-51）
- case: 流れが切れた（回線の切れ、インスタンスの入れ替え、30 分の区切り、stream.closing）
  signal: 接続が終わる
  caller_does: 1 秒待ち、最後の id を Last-Event-ID に付けて開き直す。続けて失敗するときは 2、4、8 秒、最大 30 秒の間を置く
- case: 60 秒何も届かない（生存確認は 25 秒ごと）
  signal: —
  caller_does: 切れたものとみなして開き直す
- case: カーソルが読めないか古すぎる
  signal: ride.updated と driver.requests を changeId なしで丸ごと
  caller_does: 今の状態に置き換える
- case: ブラウザが裏から前面に戻った
  signal: —
  caller_does: 流れを開き直し、GET で今の状態を取り直す（FR-06 AC3、FR-17 AC4）
- case: Turso に届かない（追いかけの読み出しが T_db で切れる）
  signal: 送るものがない（生存確認だけ）
  caller_does: 待つ。サーバーは次の 1 秒でやり直す（DEC-33）
idempotency: 届け方は少なくとも一度で、つなぎ直しで同じ変化が二度届きうる。画面は changeId と依頼の version で見分け、古いものと二度目を捨てる。ride.live は最新の値だけで、取りこぼしても次の値が埋める
timing:
  timeout: 流れは 30 分で閉じる（DEC-03）。生存確認 25 秒。画面は 60 秒届かなければ開き直す
  ordering: 一本の流れの中では状態の履歴の通し番号の順（同じ依頼の変化は起きた順）。ride.live は順を持たない最新の値
  delivery: ride.updated、driver.requests、driver.status は少なくとも一度（カーソルからの送り直し）。ride.live は最新の値だけ（取りこぼしてよい）
versioning: どのメッセージも v を持つ。足すだけで、画面は知らない出来事と欄を無視する。hello の appVersion がブラウザの版と違えば、操作の途中でないときに読み直す（DEC-49）
observability: 流れを開いた、閉じた、断ったことを stream.* のログに（アカウント、本数、理由）。示した時刻は IFC-05 で記録し、SLI-02 が数える（FR-54）。ride.updated の changeId がその鍵
spec: ifc/specs/stream.asyncapi.yaml
