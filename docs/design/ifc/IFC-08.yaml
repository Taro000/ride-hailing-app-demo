- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: ride.updated に、取り消しの cancelledBy と reason（request_timeout）、運転の開始の state=in_progress（乗客の画面はこれか取り直しでだけ乗車中にする）、支払いの状態の 13 値、請求した額、降車場所の変更の保留の結果（abandoned）を書いた。流れを開く要求の見出し、ride.live の頻度、stream.closing の理由の値（max_age、replaced、shutdown）を書き、アカウントの 3 本目は古い流れを閉じて断らないとし、閉じられた側の扱いを足した。流れの優先は持たないと書いた。最初のデモの前の SLI-02 の関門を observability に書いた。functions に FR-05、FR-08、FR-27 を足した。FR-17 の受け入れ基準の番号を版 2 に合わせた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-05 版 3、FR-08 版 2、FR-17 版 2）、第 2 段階の DEC-21 版 5・DEC-30 版 2、FND-32・33・36・40・45'
