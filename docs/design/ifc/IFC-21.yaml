id: IFC-21
title: Google Cloud の管理の操作
status: draft
version: 2
basis: inferred
basis_note: 第 2 段階の DEC-27 版 3・4（鍵を置かない連携、main の枝の手順だけ、定義はリポジトリ、データベースに触れる段は運用のジョブで動かして終わりの符号を読む）、DEC-34 版 2（毎日の処理のジョブは自分の定時の起動と二つ目の規則を止められる）、DEC-37 版 4 は入力。操作の一覧と、タスクの終わりの符号の読み方は推定（第 4 段階で確かめる）
needs_agreement: false
approver_candidates: []
kind: http
name: Google Cloud の管理の操作（外部）
provider: ELM-19
consumers:
- ELM-06
- ELM-05
functions:
- FR-41
- FR-42
operations:
- name: Artifact Registry
  does: イメージを置く、読む
- name: Cloud Run の管理の API（ELM-17）
  does: サービスと二つのジョブ（毎日の処理と運用）の定義の置き換え、消す、毎日の処理のジョブの実行と終わりの待ち。運用のジョブを運用のコマンドの引数を付けて実行し（run.jobs.runWithOverrides）、終わりを待ってタスクの終わりの符号を読む（ELM-06。第 2 段階の DEC-27 版 3）
- name: Cloud Scheduler
  does: 定時の起動を作る、止める、再開する、一度動かす、消す（ELM-06）。期間の終わりに毎日の処理が自分の定時の起動を止める（ELM-05。第 2 段階の DEC-37 版 4）
- name: Cloud Monitoring
  does: 二つの規則を有効にする、止める、消す（ELM-06）。期間の終わりに毎日の処理が二つ目の規則を止める（ELM-05）
- name: Secret Manager
  does: システムを終えるときに秘密を消す（ELM-06）。ELM-06 はデータベースの資格情報を読まない（第 2 段階の DEC-34 版 2）
- name: API Keys
  does: システムを終えるときに地図の鍵を消す
format: gcloud と REST（JSON）
protocol: HTTPS
auth: ELM-06 は鍵を置かない連携（Workload Identity Federation。main の枝の手順だけ。DEC-27、DEC-34）。ELM-05 の毎日の処理のジョブはそのサービスアカウントで、自分の定時の起動と二つ目の規則を止める権限だけを持つ（第 2 段階の DEC-34 版 2）
errors:
- case: 権限がない
  signal: '403'
  caller_does: 止まる
- case: 消すものがない
  signal: '404'
  caller_does: 消えたとみなして続ける
- case: 競合
  signal: '409'
  caller_does: 置き換えで解く
- case: 回数の上限、Google の中の誤り
  signal: 429、5xx
  caller_does: gcloud の既定の送り直し。それでも失敗したら止まる
- case: 運用のジョブのタスクが 0 でない終わりの符号で終わった
  signal: 実行の失敗とタスクの終わりの符号（10、20、1）
  caller_does: ELM-06 は符号ごとの扱い（IFC-10、IFC-11）で止まる
- case: 毎日の処理が定時の起動か二つ目の規則を止められない
  signal: 403、5xx
  caller_does: ELM-05 は期間を終えたと記録せず、失敗として終わる（IFC-10）。次の実行でやり直すか、人が ELM-06 の end-period で止める
idempotency: 定義の置き換え（gcloud run services replace など）なので、同じ入力は同じ結果。止める操作も二度目は同じ（止まったまま）
timing:
  timeout: 手順ごとの上限（IFC-11）
  ordering: null
  delivery: null
versioning: gcloud の版は手順で固める
observability: GitHub Actions の実行のログ（秘密を出さない）と配備の記録（DAT-26）。毎日の処理が止めたことは job.task のログと DAT-24、DAT-26
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 運用のジョブを引数を付けて実行し（run.jobs.runWithOverrides）、終わりを待ってタスクの終わりの符号を読む操作を足した。期間の終わりに毎日の処理が定時の起動と二つ目の規則を止める操作を足し、consumers に ELM-05 を加えた。ELM-06 が Secret Manager から Turso のトークンを読むことをやめた。この二つのエラーを足した
  reason: '第 3 段階の再実行（2026-11-04）: 第 2 段階の DEC-27 版 3・4、DEC-34 版 2、DEC-37 版 3・4（FND-19・22 の受け入れ）'
