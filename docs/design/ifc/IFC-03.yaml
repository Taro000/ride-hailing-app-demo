id: IFC-03
title: ドライバーの API
status: draft
version: 2
basis: inferred
basis_note: FR の受け入れ基準、DEC-09（条件付きの書き込み）、DEC-12（降車の確定は同じキーで 2 回まで）、DEC-29（疑わしい到着の印）、第 2 段階の DEC-30 版 2（運転の開始は担当のドライバーのアカウントだけ）と DEC-33 版 2（乗車の終了は T_route_long）は入力。状態が許さないときの符号は FND-34、確かめ中の降車場所の変更と乗車の終了の重なりは DEC-52 版 2（FND-33）。経路、エラーの符号、確認コードの回数の上限、依頼の内容の経路（FND-28）は推定
needs_agreement: true
approver_candidates:
- 開発の責任者
kind: http
name: ドライバーの API
provider: ELM-04
consumers:
- ELM-02
functions:
- FR-15
- FR-16
- FR-17
- FR-18
- FR-19
- FR-20
- FR-21
- FR-22
- FR-23
- FR-25
- FR-26
- FR-27
- FR-28
- FR-29
- FR-31
- FR-32
- FR-33
- FR-34
- FR-47
operations:
- name: POST /api/v1/driver/reception/start
  does: 受付を始める（今の位置を一つ添える）。画面の点灯は画面が行う（FR-52）。冪等キーが要る
- name: POST /api/v1/driver/reception/stop
  does: 受付を止める。最後の位置を消す（DEC-14）。冪等キーが要る
- name: GET /api/v1/driver/requests
  does: 示してよい依頼の一覧（しきい値と評価値（FR-15）、受ける条件、停止を一か所の規則で絞る。押さえの確かめ中の依頼は含めない。DEC-09、DEC-52）。SLI-01 の操作
- name: GET /api/v1/driver/requests/{rideId}
  does: 依頼の内容（ピン、経路、受取額、乗車場所までの距離と所要時間、乗車の所要時間）
- name: POST /api/v1/driver/requests/{rideId}/accept
  does: 許諾する。まだ誰にも割り当てられていなければ、このドライバーに割り当てる（DEC-09）。乗客の取り消しや T_request_max でのシステムの取り消しと重なったら、条件付きの書き込みで一方だけが効く。速さが分からないときは受け付け、分からなかったことを記録する（FR-21 AC3）。冪等キーが要る。SLI-01 の操作
- name: GET /api/v1/driver/rides/active
  does: 担当の進行中の依頼
- name: POST /api/v1/driver/rides/{rideId}/cancel
  does: 乗車の前に取り消し、依頼を乗客の依頼のまま、ほかのドライバーに示し直す（押さえはそのまま）。冪等キーが要る
- name: POST /api/v1/driver/rides/{rideId}/arrive
  does: 乗車場所への到着を知らせる。位置が D_arrival 以内かを確かめる。冪等キーが要る。SLI-01 の操作
- name: POST /api/v1/driver/rides/{rideId}/start
  does: その依頼の担当のドライバーのアカウントだけが、乗客から聞いた確認コードを送り、一致したときだけ運転を始めて in_progress にする（ほかのアカウントは 404 NOT_FOUND。第 2 段階の DEC-30 版 2）。降車場所までの経路を求める（得られなければ routeToDropoff は null。FR-23 AC3）。冪等キーが要る。SLI-01 の操作
- name: POST /api/v1/driver/rides/{rideId}/no-show
  does: 到着から T_noshow_wait を過ぎたら不在で終える。位置を確かめた到着なら押さえから 500 円を確定し、確かめられなかった到着なら押さえを取り消す。冪等キーが要る
- name: POST /api/v1/driver/rides/{rideId}/complete
  does: 乗車を終え、確定した料金を押さえから確定する（DEC-12。同じキーで 2 回まで送り直す）。確かめ中の降車場所の変更があれば取りやめ（当てない）、確定は古い押さえと変更の前の確定した料金で行う（新しい押さえは確かめを続け、見つかれば取り消す。DEC-52）。経路の上限は T_route_long（20 秒。第 2 段階の DEC-33）。冪等キーが要る。SLI-01 の操作
- name: GET /api/v1/driver/earnings
  does: 受取額（運賃、手数料、受取額、決済の状態。キャンセル料と不在の料金を含む）
- name: GET /api/v1/driver/conditions
  does: 受ける条件の今の値
- name: PUT /api/v1/driver/conditions
  does: 受ける条件を設定・解除する（null で解除）。値と変えた時刻を記録する。冪等キーが要る
format: JSON（UTF-8）。エラーは application/problem+json（DEC-38）。額は円の整数（DEC-41）、時刻は UTC の RFC 3339（DEC-40）
protocol: HTTPS の要求と応答。Cloud Run の入口から ELM-04 へ。三つの SPA と同じ入口なので CORS は使わない（DEC-23）
auth: ドライバーの役割のセッションのクッキー。経路のまとまり /api/v1/driver で役割を一度確かめる（DEC-20）。依頼の操作は担当のドライバーだけ（ほかは 404。運転の開始も同じ。第 2 段階の DEC-30 版 2）。登録されたドライバーだけ（QR-37）
errors:
- case: 'POST /api/v1/driver/reception/start: 配車を停止されている（FR-17 AC4、FR-47 AC2）'
  signal: 403 DRIVER_SUSPENDED
  caller_does: 受付を始めさせずその旨を示す
- case: 'POST /api/v1/driver/reception/start: 位置がない（FR-17 AC3。ふつうは画面が位置情報の許可で先に止める）'
  signal: 400 LOCATION_REQUIRED
  caller_does: 位置情報の利用の許可を求める
- case: 'GET /api/v1/driver/requests: 受付中でない（停止されたときを含む）'
  signal: 409 NOT_RECEIVING
  caller_does: 受付の画面へ
- case: 'GET /api/v1/driver/requests/{rideId}: 速さが V_moving 以上（FR-21 AC1）'
  signal: 409 DRIVER_MOVING
  caller_does: 停車してから操作するよう示す
- case: 'GET /api/v1/driver/requests/{rideId}: ほかのドライバーが許諾したか、乗客かシステムが取り消した（FR-19 AC2）'
  signal: 409 REQUEST_NO_LONGER_AVAILABLE
  caller_does: その旨を示して一覧に戻る
- case: 'POST /api/v1/driver/requests/{rideId}/accept: ほかのドライバーが許諾した（FR-20 AC2）'
  signal: 409 ALREADY_TAKEN
  caller_does: その旨を示して一覧に戻る
- case: 'POST /api/v1/driver/requests/{rideId}/accept: 乗客が取り消したか、T_request_max でシステムが取り消した（FR-20 AC3、FR-08 AC5）'
  signal: 409 RIDE_CANCELLED
  caller_does: その旨を示して一覧に戻る
- case: 'POST /api/v1/driver/requests/{rideId}/accept: 迎車中か乗車中（FR-20 AC4）'
  signal: 409 DRIVER_BUSY
  caller_does: 受け付けなかった旨を示す
- case: 'POST /api/v1/driver/requests/{rideId}/accept: しきい値か評価の件数を満たさない（一覧を見た後に評価値が下がったなど。FR-16 AC2）'
  signal: 409 NOT_ELIGIBLE
  caller_does: 割り当てなかった旨を示して一覧に戻る
- case: 'POST /api/v1/driver/requests/{rideId}/accept: 速さが V_moving 以上（FR-21 AC1）'
  signal: 409 DRIVER_MOVING
  caller_does: 停車してから操作するよう示す
- case: 'POST /api/v1/driver/requests/{rideId}/accept: 停止された（QR-16）'
  signal: 403 DRIVER_SUSPENDED
  caller_does: 受付の画面へ
- case: 'POST /api/v1/driver/rides/{rideId}/cancel: 乗車が始まっている（FR-22 AC2）'
  signal: 409 RIDE_ALREADY_STARTED
  caller_does: 取り消さずその旨を示す
- case: 'POST /api/v1/driver/rides/{rideId}/cancel: 乗客がもう取り消した（FND-34）'
  signal: 409 RIDE_CANCELLED
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/arrive: 乗る場所から D_arrival より離れている（FR-25 AC2）'
  signal: 409 TOO_FAR_FROM_PICKUP
  caller_does: 受け付けず、乗車場所に近づくよう示す（距離を添える）
- case: 'POST /api/v1/driver/rides/{rideId}/arrive: 取り消された依頼（FR-25 AC4）'
  signal: 409 RIDE_CANCELLED
  caller_does: 受け付けずその旨を示す
- case: 'POST /api/v1/driver/rides/{rideId}/start: 確認コードが一致しない（FR-26 AC2）。残りの回数を添える'
  signal: 422 CONFIRMATION_CODE_MISMATCH
  caller_does: 運転を始めさせず、依頼主かどうか確かめるよう示す
- case: 'POST /api/v1/driver/rides/{rideId}/start: 一つの割り当てで 10 回違った（仮。DEC-55）'
  signal: 429 CONFIRMATION_ATTEMPTS_EXCEEDED
  caller_does: 乗客と確かめて、取り消すよう示す
- case: 'POST /api/v1/driver/rides/{rideId}/start: 乗客が取り消した（FND-34）'
  signal: 409 RIDE_CANCELLED
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/start: まだ到着を知らせていない（FND-34）'
  signal: 409 RIDE_NOT_ARRIVED
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/no-show: T_noshow_wait を過ぎていない（FR-27 AC2）。残りの秒数を添える'
  signal: 409 NO_SHOW_TOO_EARLY
  caller_does: 受け付けず、あとどれだけ待つかを示す
- case: 'POST /api/v1/driver/rides/{rideId}/no-show: 乗客が取り消した（FND-34）'
  signal: 409 RIDE_CANCELLED
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/no-show: まだ到着を知らせていない（FND-34）'
  signal: 409 RIDE_NOT_ARRIVED
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/complete: 最後に指定した降車場所から D_dropoff を超えて離れている（FR-28 AC2）。距離を添える'
  signal: 409 FAR_FROM_DROPOFF
  caller_does: 'ドライバーに確かめ、confirmFarFromDropoff: true で新しい冪等キーで送る'
- case: 'POST /api/v1/driver/rides/{rideId}/complete: 乗車中でない（FND-34）'
  signal: 409 RIDE_NOT_IN_PROGRESS
  caller_does: 読み直して今の状態を示す
- case: 'POST /api/v1/driver/rides/{rideId}/complete: T_route_long（20 秒）で切った。乗車は終わっていて、確定が動いていることがある（第 2 段階の DEC-33、FND-21）'
  signal: 503 ROUTE_TIMEOUT
  caller_does: 同じ冪等キーで送り直すか、依頼を読み直す。配信で結果を待つ
- case: 'PUT /api/v1/driver/conditions: 負の値など、ありえない値（FR-33 AC3）'
  signal: 400 INVALID_REQUEST
  caller_does: 受け付けず、範囲を示す
- case: '共通: 要求の形が違う（欄の不足、範囲の外、冪等キーがない）。errors に欄ごとの中身'
  signal: 400 INVALID_REQUEST
  caller_does: 欄を直す。同じものを送り直さない
- case: '共通: ログインしていないか、セッションが切れた'
  signal: 401 UNAUTHENTICATED
  caller_does: ログインの画面へ。操作の途中なら、ログインの後に同じ冪等キーで送る
- case: '共通: 役割が違う、または送り元（Origin）がサービスの URL でない'
  signal: 403 FORBIDDEN
  caller_does: 送り直さない（画面の誤りとしてブラウザのエラーの記録に残す）
- case: '共通: ない、または自分のものでない（他人の依頼も 404 にする。DRV-29）'
  signal: 404 NOT_FOUND
  caller_does: 画面を読み直す
- case: '共通: 同じ冪等キーの要求がまだ動いている（DEC-48）'
  signal: 409 OPERATION_IN_PROGRESS
  caller_does: Retry-After（1 秒）の後に同じキーで送るか、状態を読み直す
- case: '共通: 同じ冪等キーで中身の違う要求（DEC-48）'
  signal: 422 IDEMPOTENCY_KEY_REUSED
  caller_does: 画面の誤り。新しい操作として新しいキーで始める
- case: '共通: 回数の上限（DEC-55）'
  signal: 429 RATE_LIMITED
  caller_does: Retry-After まで待つ
- case: '共通: 想定外の誤り'
  signal: 500 INTERNAL_ERROR
  caller_does: 読むだけの要求は間を置いて送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す
- case: '共通: T_route（10 秒）で切った。中の処理は続いていることがある（DEC-33）'
  signal: 503 ROUTE_TIMEOUT
  caller_does: 結果が分からないとして扱う。読むだけの要求は送り直す。状態を変える要求は同じ冪等キーで送り直すか、状態を読み直す。新しいキーでは送らない
- case: '共通: Turso に届かないか遅い（T_db）。状態を変えたかどうかは、一つ目のトランザクションを書けたかによる'
  signal: 503 DEPENDENCY_UNAVAILABLE
  caller_does: ROUTE_TIMEOUT と同じ
idempotency: 状態を変える POST と PUT はすべて Idempotency-Key（DEC-48）。不在と乗車の終了はお金を動かすので DEC-12 の三つのトランザクション。許諾は、同じドライバーが同じ依頼をもう一度許諾すると今の状態を返す。PUT conditions もキーを求める（同じ値の二度目も同じ結果）
timing:
  timeout: ブラウザ 15 秒（乗車の終了は 25 秒。DEC-50）。サーバーの中は T_route 10 秒（乗車の終了は T_route_long 20 秒。第 2 段階の DEC-33）。乗車の終了は要求の中で最悪 9.35 秒（Turso が遅いと 15.05 秒。T_route_long で 503 を返しても処理は続く。FND-21）。地図 2 秒、Stripe 1 回 2.5 秒、Turso 1 回 T_db 2 秒（DEC-50）
  ordering: null
  delivery: null
versioning: 経路に /api/v1。v1 の中では足すだけで、知らない欄は両側とも無視する。応答の X-App-Version とブラウザの版が違えば、操作の途中でないときに画面を読み直す（DEC-49）
observability: request.completed のログ。依頼の一覧、許諾、迎車の到着、運転の開始、乗車の終了は SLI-01 の六つの操作（route_id は「測定点」の表）。走行中で断った操作は時刻と速さを DAT-19 に（FR-21 AC4。座標は書かない）
spec: ifc/specs/driver.openapi.yaml
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 運転の開始を担当のドライバーのアカウントだけとし（ほかは 404）、経路を得られなければ routeToDropoff が null と書いた。状態が許さないときの 409 を足した（start と no-show に RIDE_CANCELLED と RIDE_NOT_ARRIVED、complete に RIDE_NOT_IN_PROGRESS、cancel に RIDE_CANCELLED）。乗車の終了が確かめ中の降車場所の変更を取りやめ、古い押さえと変更の前の料金で確定することを書いた。乗車の終了の 503 ROUTE_TIMEOUT を T_route_long（20 秒）にし、タイムアウトを DEC-50 の値に直した。システムの取り消しと許諾の重なりを書いた。functions に FR-15 を足し、一覧の絞り込みで評価値を使うと書いた。PUT もキーを求めると直した。FR-17 の受け入れ基準の番号を版 2 に合わせた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-08 版 2、FR-17 版 2、FR-26 版 2）、第 2 段階の DEC-30 版 2・DEC-33 版 2、FND-33・34・43・47・48'
