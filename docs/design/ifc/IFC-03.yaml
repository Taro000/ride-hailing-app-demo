    fields: [traceId, resend, route, actorKind, ridePhase, testAccount, environment, receivedAt, respondedAt, httpStatus, errorCode, outcome, failureOrigin]
    method: 境界の出来事（DAT-19）を、最初の要求を受けたときの依頼の状態で絞り、DEC-43 の決まりで操作にまとめて数える
  - sli: SLI-03
    events: 乗客が ELM-03 の入口に送った GET /v1/rides/current のうち、最初の要求を受けたときの依頼が乗車中（ridePhase が riding）のもの。操作へのまとめ方と数え方は SLI-01 と同じ（DEC-43）
    fields: [traceId, resend, route, actorKind, ridePhase, testAccount, environment, receivedAt, respondedAt, httpStatus, errorCode, outcome, failureOrigin]
    method: 境界の出来事（DAT-19）を、最初の要求を受けたときの依頼の状態で絞り、DEC-43 の決まりで操作にまとめて数える
  - sli: SLI-05
    events: ドライバーが ELM-03 の入口に送った GET /v1/rides/current のうち最初の要求を受けたときの依頼が迎車中か迎車が着いた状態のものと、POST /v1/rides/{rideId}/boarding。操作へのまとめ方と数え方は SLI-01 と同じ（DEC-43）
    fields: [traceId, resend, idempotencyKey, route, actorKind, ridePhase, testAccount, environment, receivedAt, respondedAt, httpStatus, errorCode, outcome, failureOrigin]
    method: 境界の出来事（DAT-19）を DEC-43 の決まりで操作にまとめて数える。CONFIRMATION_CODE_MISMATCH と CONFIRMATION_CODE_LOCKED は受け付けない入力の知らせとして GOOD。500 か答えのない要求を一つでも含む操作は GOOD でない（QCR-07）
  - sli: SLI-06
    events: ドライバーが ELM-03 の入口に送った POST /v1/rides/{rideId}/arrival と POST /v1/rides/{rideId}/payment。操作へのまとめ方と数え方は SLI-01 と同じ（DEC-43）
    fields: [traceId, resend, idempotencyKey, route, actorKind, ridePhase, testAccount, environment, receivedAt, respondedAt, httpStatus, errorCode, outcome, failureOrigin]
    method: 境界の出来事（DAT-19）を DEC-43 の決まりで操作にまとめて数える。PAYMENT_DECLINED は決済サービスが支払いを受け付けなかった知らせとして、PAYMENT_METHOD_CHANGE_REQUIRED は受け付けない入力の知らせとして GOOD。PAYMENT_PENDING か PAYMENT_SERVICE_UNAVAILABLE（failureOrigin が EXT-01）か 500 か答えのない要求を一つでも含む操作は GOOD でない（QCR-07）
