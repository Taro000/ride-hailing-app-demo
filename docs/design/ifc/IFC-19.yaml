id: IFC-19
title: Cloud Monitoring の規則
status: draft
version: 1
basis: inferred
basis_note: DEC-17（二つの規則、役目、開け閉めの手順）は入力。指標の名前、ラベル（response_code_class、response_code、result）、60 秒ごとに取られ最大 120 秒遅れて見えることは Cloud Monitoring の指標の一覧（2026-11-03）。一つ目の規則の条件の形と値は推定（DEC-54。DEC-17 が第 3 段階に任せた）
needs_agreement: true
approver_candidates:
- 開発の責任者
kind: event
name: Cloud Monitoring の規則（外部）
provider: ELM-14
consumers:
- USR-03
functions:
- FR-36
operations:
- name: 一つ目の規則（デモの回の間だけ有効）
  does: (a) run.googleapis.com/request_count の response_code_class が 5xx か response_code が 429 の数が 5 分で 5 件以上。(b) run.googleapis.com/container/instance_count が 10 分届かない。ラベルでは入口とアプリの応答を分けられないので、アプリが返した 503（Turso に届かないときを含む）も数える
- name: 二つ目の規則（デモの期間だけ有効）
  does: run.googleapis.com/job/completed_execution_count の result が failed のものが 1 件以上
format: Cloud Monitoring の通知（チャットへの通知の経路。チャットを選んでから決める）
protocol: Cloud Monitoring → 通知先
auth: 通知先は Cloud Monitoring の設定にだけ置く（DEC-34）
errors:
- case: チャットが止まっている
  signal: 届かない
  caller_does: 残る危険（第 2 段階の F16）
idempotency: 条件が続く間は一度。外れたら閉じる（30 分で自動で閉じる）
timing:
  timeout: null
  ordering: null
  delivery: 指標は 60 秒ごとに取られ最大 120 秒遅れて見えるので、知らせまで 4〜5 分（遅延の予算）
versioning: 規則の定義は infra に置き、手順だけが変える（DEC-27）
observability: Cloud Monitoring が出来事を残す
spec: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
