id: DEC-45
title: EXT-01 の答えを四つに分け、押さえは結果が分からなければしなかったことにし、決済と返金と登録は結果が分からないと答えて確かめ続け、処理されなかった試みは済まなかったとして新しい試みでやり直す
status: active
basis: inferred
basis_note: お金の操作を試みごとに記録してその試みだけを覆うキーで送り、答えがなければ結果が分からない状態として持って同じキーで確かめ、拒否された試みのやり直しは新しいキーにすること、押さえは待ちのうちに分からなければ依頼を受け付けず後で済んでいれば解くこと、決済は分からないことを示して確かめ続けることは DEC-10（入力）。押さえ直しで降りる場所も支払い方法も変えないことは DEC-09、DEC-10（入力）。依頼のときの押さえが答えなければ依頼を受け付けないことは FR-54 の 3、決済と返金と登録が分からないことを示すことは FR-29 の 5、FR-39 の 2、FR-46 の 4（入力）。結果が分からない呼び出しが結果をどう分け、利用側にどの符号で答えるかは第 3 段階の確定の種類（推定）。EXT-01 が 500 の答えを同じキーに繰り返し返し、ネットワークの誤りと 409 は同じキーで送り直せることは Stripe の文書による（報告の「入力」）。待ちの値は IFC-17（DAS-10）。受けたインスタンスが答える前に止まり、答えの期限を過ぎて同じキーの送り直しを受けたときの答え方は、FND-22 を受けて DEC-42 とともに決めた（推定）。処理されなかった試みの出口（済まなかったとして終え、利用者が改めて操作したときと、利用者が待たない押さえの解除と料金の請求では期限の処理が、新しい試みを作る）と、処理されなかったとする答えの範囲は FND-45 を受けて決めた。処理されなかった試みは EXT-01 が実行を始める前に退けたもので、DEC-10 の二つの分け方では結果が分からないものでなく終わった試みに当たり、新しい試みを作っても済んだか結果が分からない試みは一つまでのまま（推定）。取引の ID が分かっている状態を変える呼び出し（確定と取り消し）の試みを、500 か processing の後の読み出しで、取引が求めた結果なら済んだ、試みの操作をもうできない状態ならはっきりした拒否、待ちの後の最初の確かめからも変わっていなければ処理されなかったと分けること、結果が分からなかった決済が処理されなかったと分かれば依頼を到着した状態に戻すこと、新しい試みが取引の状態に退けられたときは取引を読んで決めることは、FND-55 を受けて決めた。EXT-01 の一つの取引が確定か取り消しのどちらか一度だけになることは Stripe の文書による（報告の「入力」。推定）。取引が変わらないまま処理されなかったとした確定の要求を、その押さえを確定済みか取り消し済みと読むまで後で効きうる確定とし、その間はその処理をほかの押さえに移さず（依頼の支払い方法の変更を 409 PAYMENT_PENDING_CONFIRMATION で受け付けない）、拒否とも決めない（同じ押さえへの次の試みがはっきり拒否されたら押さえを解いて決め、解除が確定済みに退けられればその確定をその処理の結果とする）ことは、FND-58 を受けて決めた（推定。結果が分からない要求は同じ相手で決着させてからほかを試す）
premises: [EXT-01]
stage: high-level-design
question: EXT-01 の答えをどう分け、結果が分からないお金の操作に利用側へどの状態と符号で答え、試みをいくつまで持つか
addresses: [DRV-07, DRV-32, DRV-01, DRV-02, FR-29, FR-30, FR-39, FR-40, FR-46, FR-50, FR-54, FND-22, FND-45, FND-55, FND-58]
options:
  - name: 答えを済んだ、はっきりした拒否、結果が分からない、処理されなかったの四つに分け、押さえと押さえ直しは待ちのうちに分からなければしなかったことにして 503 で、決済、返金、登録は 202 で答えて確かめ続ける
    effect: 利用者を待ちの長さより長く待たせず、分からない押さえで依頼や降りる場所を進めず、分からない決済を失敗とも成功とも示さない
    cost: 確かめ続ける処理と、後で見つかった押さえを解く処理を持つ
  - name: どのお金の操作も、結果が分かるまで利用者を待たせる
    effect: 利用者はいつも結果を受ける
    cost: EXT-01 が答えない間、ドライバーと乗客が T_payment_response を超えて待ち、端末の時間切れが新しい送り直しを生む
  - name: 結果が分からないものは失敗として示し、やり直させる
    effect: 作りが単純
    cost: 済んでいた決済を失敗と示し、やり直しで二重に請求しうる
chosen: ELM-03 は EXT-01 の答えを、済んだ、はっきりした拒否、結果が分からない、処理されなかった（EXT-01 が実行を始める前に退けた鍵や形の誤りと、取引の ID が分かっている確定と取り消しで待ちの後の最初の確かめからも取引が変わっていないもの）の四つに分け（分け方は IFC-17、答えの一つ一つを分ける判断表は第 4 段階）。処理されなかったとするのは、状態を変える呼び出しへの答えが、EXT-01 が実行を始めていないこと（そのキーに結果を残さないこと）を示すときと、取引の ID が分かっている状態を変える呼び出し（決済と料金の確定、押さえの取り消し）の試みで、確かめの読み出しが、待ちの後（利用者が待たない試みは最初の呼び出しの後）の最初の確かめの時刻（IFC-17）から後に、取引が変わっていない（requires_capture のまま）ことを示したとき（その要求はそれまでに効いていない。後で効きうることは下のとおり扱う）だけで、見分けられない答えは結果が分からないとする。確かめの読み出しと送り直しが処理されなかったときは、最初の呼び出しが効いたかは分からないため、試みを結果が分からないまま確かめ続ける。取引の ID が分かっている呼び出しの確かめ（500 か processing の後と、最初に送ってから 23 時間の後は読み出しで行う、IFC-17）は、取引が試みの求めた結果を示せば（確定は確定した額、取り消しは canceled）済んだ、試みの操作をもうできない状態を示せば（確定に canceled、取り消しに確定済み）はっきりした拒否として異常にし、processing か、最初の確かめの時刻より前に変わっていないなら（同じキーの送り直しが早めた確かめを含む）結果が分からないままにする。EXT-01 の一つの取引は確定か取り消しのどちらか一度だけになるので、処理されなかったとした試みの要求が後で EXT-01 で効いても、次の試みが同じ取引に向かう限り、お金は二度動かない。そのときは次の試みが、取引の状態が操作に合わないとして退けられるので、取引を読み、試みの求めた結果をすでに示していれば済んだとする（新しい試みのないまま効いたものは毎日の照合が見つける、DAT-13）。そのため、取引が変わらないまま処理されなかったとした確定（決済と料金の請求）の要求は、その押さえを確定済みか取り消し済みと読むまで後で効きうる確定とし、その間はその処理をほかの押さえに移さず、拒否とも決めない。決済では依頼の支払い方法の変更（押さえ直し）を 409 PAYMENT_PENDING_CONFIRMATION で受け付けず（IFC-03）、ドライバーのやり直しは同じ押さえへの新しい試みのまま。その間に同じ押さえへの決済か料金の次の試みが、押さえを取り消し済みと読まずにはっきり拒否されたら（カードの拒否など）、その処理を拒否で終えずに、その押さえを解く試みを作り（期限の処理が送り、処理されなかったら同じ間隔で新しい試みを作る）、決済は依頼を payment_pending にして 202 PAYMENT_PENDING で答える。解除が済めば、押さえは取り消されて後で効きうる確定はもう効かないので、その処理をその拒否の理由で拒否として終え（決済は payment_declined で、乗客が支払い方法を変えてからやり直す）、解除が押さえの確定済みに退けられれば後で効きうる確定が効いたので、その処理の新しい試みを同じ押さえに作り、取引を読んで済んだとする（決済は completed）。押さえ直しで新しい取引に移るのは、前の押さえに後で効きうる確定がないか、前の押さえを取り消し済みと読んだ後だけで、前の押さえへの確定と新しい押さえの確定は重ならない。利用側には次のとおり答える。押さえと押さえ直し（依頼、降りる場所の変更の承認、依頼の支払い方法の変更）は、最初に送ってから IFC-17 の待ちのうちに分からなければしなかったことにして、503 の HOLD_UNCONFIRMED か REHOLD_UNCONFIRMED で答え、依頼を受け付けず、降りる場所と支払い方法を変えず、押さえが済んでいたと後で分かればそれを解く。決済、返金、支払い方法の登録は、待ちのうちに分からなければ 202 の PAYMENT_PENDING、REFUND_PENDING、PAYMENT_METHOD_PENDING で答え、確かめ続け、分かったら流れ（IFC-11）で知らせ、同じ冪等キーの送り直しにはそのときの結果を答える（DEC-42）。料金の請求（キャンセル料と不在の料金）と押さえを解くことは利用者が待たず、期限の処理が送り、分からなければ確かめ続ける。処理されなかった試みは EXT-01 で何も実行されていないか効いていないため済まなかったとして終え、システムの誤りとして異常にする。利用者が待つ操作には 503 PAYMENT_SERVICE_UNAVAILABLE で答え、押さえと押さえ直しは依頼を受け付けなかったか変えなかったとし、決済は依頼を到着したままにして済んでいないことをドライバーと乗客に示し、返金は済まなかった（refund_failed）として理由を示し、登録を始める操作は登録の取引を作らなかったとする。結果が分からないと 202 で答えた決済が、確かめで処理されなかったと分かったときは、依頼を到着した状態に戻し、流れ（IFC-11）で済んでいないことをドライバーと乗客に知らせ、同じ冪等キーの送り直しには 503 PAYMENT_SERVICE_UNAVAILABLE で答える。この 503 はキーの答えなので、同じ冪等キーの送り直しは同じ答えを受け、利用側は今の状態を読み直して従う（DEC-35）。し直すのは利用者が改めて操作したときで、依頼、承認、支払い方法の変更、登録はその操作を新しいキーで、決済はドライバーのやり直しで、返金は担当者のやり直し（IFC-13 の retry）で、新しい試みを作る。利用者が待たない押さえの解除と料金の請求が処理されなかったときは、期限の処理が結果が分からない試みと同じ間隔（IFC-17）で新しい試みを作って送り、どれかが済むか拒否で終わるまで依頼のお金の精算を終えない（DAT-07）。どの場合も、拒否か取引がないことを EXT-01 が示すまでは、請求していない、押さえていない、とは示さない。一つの乗車の決済、一つの依頼のキャンセル料か不在の料金、担当者が認めた一つの返金は、済んだか結果が分からない試みを一つまでしか持たず（DEC-10）、新しい試みはそれまでの試みがどれもはっきり拒否か処理されなかったで終わったときだけ作る。乗車の決済の新しい試みは、はっきり拒否の後は乗客が依頼の支払い方法を変えて押さえ直したときだけ（FR-29 の 4）、処理されなかった後はドライバーがやり直したときと、後で効きうる確定が効いたと押さえの解除で分かったときに作る。受けたインスタンスが答える前に止まり、その操作の答えの期限を過ぎて同じキーの送り直しを受けたとき（DEC-42）も、試みの状態から同じに答える。押さえと押さえ直しは、試みの結果が依頼、降りる場所の変更、支払い方法の変更に書かれていなければしなかったことにし（はっきり拒否されていれば 402 PAYMENT_DECLINED、処理されなかったなら 503 PAYMENT_SERVICE_UNAVAILABLE、ほかは 503 の HOLD_UNCONFIRMED か REHOLD_UNCONFIRMED）、依頼を受け付けなかったか変えなかったとし、押さえが済んでいたと分かれば解く。決済、返金、登録の読み直しは試みの今の結果（済んだ、はっきりした拒否、処理されなかった、分からなければ 202 の PENDING。決済は、後で効きうる確定のために押さえを解いて決めている間は、試みが拒否でも 202 の PAYMENT_PENDING）で答え、登録を始める操作は EXT-01 の同じキーで送り直して同じ登録の取引を返す（作りかけの登録の取引ではお金は動かない）。試みを書く前に止まっていれば、キーの記録がなく、送り直しは新しい操作として行われる。押さえ中のまま残った依頼は、送り直しがなくても、期限の処理が押さえの試みを待ちの後に確かめて受け付けなかったとする（DAT-11）
rationale: 三つ目は済んでいた決済を失敗と示してやり直させ、二重に請求しうるため DRV-32 を破る。受けたインスタンスが止まったときも同じ答えにするのは、端末は止まったことを知らず、送り直しの答えが受けたインスタンスの答えと同じ決まりに従えば、どちらの答えを受けても次の操作を同じに決められるため（DRV-02）。二つ目は EXT-01 が答えない間、決済で T_payment_response（QR-24、NFR-29）を超えて待たせ、端末の時間切れの後の送り直しが重なる。一つ目は DEC-10 の原則を利用側の答えに移したもの。押さえと押さえ直しをしなかったことにするのは、依頼を受け付けるのは押さえられたときだけ（FR-54 の 1）で、分からないまま依頼を届けるとドライバーが許諾した後に押さえがないことが分かりうるため。決済、返金、登録を 202 にするのは、それぞれの目的（請求、返金、使える支払い方法）がその後も続き、分かったときに示せば FR-29 の 5、FR-39 の 2、FR-46 の 4 を満たすため。503 と 202 を分けるのは、利用側が 503 なら操作をし直せ（新しいキー）、202 なら送り直さずに待つ（同じキー）と状態の組で決められるため（DEC-35）。EXT-01 は 500 を同じキーに繰り返し返すため、結果が分からない試みは同じキーの送り直しだけでなく取引の読み出しで確かめる（IFC-17）。処理されなかった試みを済まなかったとして終え、新しい試みでやり直すのは、EXT-01 が実行を始めていない試みはお金を動かしておらず、一度だけ動くことを済んだか結果が分からない試みの数で守るまま（DEC-10）、返金（FR-39 の 2、FR-50 の 3）、決済（FR-29 の 1）、押さえの解除と料金の請求（FR-54 の 6〜8）を先に進められるため。終えたまま出口を持たないと、返金と決済は済みも済まなかったとも示されず、押さえは解かれない（FND-45）。処理されなかった決済で乗客に支払い方法を変えさせないのは、乗客のカードは拒否されておらず、変えても同じ誤りが続くため。見分けられない答えと、確かめの読み出しと送り直しの処理されなかったを結果にしないのは、効いたかもしれない試みを済まなかったと示さないため（DRV-32）。誤って処理されなかったとした試みが EXT-01 で処理されていれば、毎日の照合が片方にしかない処理として見つける（DAT-13）。取引の ID が分かっている確定と取り消しで、待ちの後の確かめでも取引が変わっていない試みを処理されなかったとするのは、EXT-01 は同じキーに同じ 500 を返し続け、作る呼び出しのように見つからなければ作られていないとも言えないため、結果が分からないままでは新しい試みを作れず、決済は payment_pending から出られず、料金は請求されず、押さえは解かれない（FR-29 の 5、FR-54 の 6〜8、FND-55）。はっきりした拒否とすれば、乗客に要らない支払い方法の変更を求め（FR-29 の 4）、料金を請求しないまま精算を終える。EXT-01 の一つの取引は確定か取り消しのどちらか一度だけになるので、この場合に処理されなかったとして新しい試みを作っても、同じ取引に向かう限りお金は二度動かない。待ちの後の最初の確かめまで待つのは、まだ動いているかもしれない要求を処理されなかったとしないため。それでも要求が後で効きうることは残るので、その押さえを確定済みか取り消し済みと読むまで、その処理をほかの押さえに移さない。一つの取引が一度だけ確定することが守るのは同じ取引への次の試みだけで、押さえ直した新しい取引の確定とは重なり、前の取引への確定が効けば二度請求する（FND-58、DRV-32）。決済で支払い方法の変更を受け付けないのは、その決済では乗客のカードは拒否されておらず変える要がなく、ドライバーのやり直しが同じ押さえで結果を決めるため。変更を受け付けて、前の押さえを解き終えるまで新しい押さえを確定させない案もお金を二度動かさないが、到着した依頼を結果待ちに戻す移り変わりと知らせが要り、前の押さえが確定済みと分かれば新しい押さえを解く手間も加わる。その間の同じ押さえへの次の試みのはっきりした拒否で、拒否と示さずに先に押さえを解くのは、結果が分からない要求を同じ相手で決着させてからほかを試すため。拒否と示せば、後で効きうる確定が効いていても乗客が支払い方法を変えて新しい押さえの確定へ進み、何も請求していないと EXT-01 が確かめていないのに済んでいないと示すことになる（DRV-32）。料金の請求も同じにするのは、後で効きうる確定が効いたのに請求できなかったと示さないため
rejected:
  - option: どのお金の操作も、結果が分かるまで利用者を待たせる
    reason: EXT-01 が答えない間 T_payment_response を超えて待たせ、端末の時間切れの後の送り直しが重なる（QR-24、DRV-01）
  - option: 結果が分からないものは失敗として示し、やり直させる
    reason: 済んでいた決済を失敗と示し、やり直しで二重に請求しうる（DRV-32、DRV-07）
gains:
  - 利用者を待ちの長さより長く待たせない
  - 分からない押さえで依頼や降りる場所を進めず、分からない決済を失敗とも成功とも示さない
costs:
  - 結果が分からない試みを確かめ続け、後で見つかった押さえを解く処理を持つ
  - 鍵の誤りのように処理されない原因が続く間は、利用者のやり直しも期限の処理の新しい試みもどれも処理されず、異常が続く
  - 取引の ID が分かっている確定と取り消しは、取引が変わっていなくても待ちの後の最初の確かめまで処理されなかったと決めないため、その間は決済のやり直しも料金と解除の新しい試みも待つ
  - 取引が変わらないまま処理されなかったとした決済の後は、その押さえを確定済みか取り消し済みと読むまで乗客は依頼の支払い方法を変えられず、その間の同じ押さえへの決済か料金がはっきり拒否されても、押さえを解き終えるまで拒否を示せない
sensitive_points:
  - 処理されなかったとする答えの範囲。広すぎると、実行が始まっていたかもしれない試みを済まなかったとしてやり直し、お金が二重に動きうる。狭すぎると、何も実行されていない試みを結果が分からないとして確かめ続け、利用者に結果を示せない（答えの一つ一つの分け方は第 4 段階の判断表）
  - 取引の ID が分かっている確定と取り消しを、取引が変わっていなければ処理されなかったとするまでの待ち（待ちの後の最初の確かめの時刻、値は IFC-17）。短いと、まだ動いている要求を処理されなかったとして新しい試みを作り、その試みが取引の状態に退けられて読み直しが増える（お金は二度動かない）。長いと、決済のやり直し、料金の請求、押さえの解除がそれだけ遅れる
trade_offs:
  - with: DRV-01
    note: 待ちのうちに分からない押さえと決済は、SLI-01 と SLI-06 の悪いイベントになる（DEC-10 の引き換えのまま）
assumptions:
  - EXT-01 は、拒否をネットワークの誤りや 500 と見分けられる答え（402 か、拒否を示す取引の状態）で返す（ELM-05）
  - EXT-01 は、実行を始める前に退けた要求（鍵、権限、形の誤り）の答えを実行の後の拒否と見分けられる形で返し、そのキーに結果を残さない（Stripe の文書、報告の「入力」）
  - EXT-01 の一つの取引は、確定（全額か一部）か取り消しのどちらか一度だけになり、終わった取引への確定と取り消しを、取引の状態が操作に合わない誤りで退ける（Stripe の文書、報告の「入力」）
depends_on: [DEC-09, DEC-10, DEC-35, DEC-42]
