id: DEC-45
title: EXT-01 の答えを四つに分け、押さえは結果が分からなければしなかったことにし、決済と返金と登録は結果が分からないと答えて確かめ続ける
status: active
basis: inferred
basis_note: お金の操作を試みごとに記録してその試みだけを覆うキーで送り、答えがなければ結果が分からない状態として持って同じキーで確かめ、拒否された試みのやり直しは新しいキーにすること、押さえは待ちのうちに分からなければ依頼を受け付けず後で済んでいれば解くこと、決済は分からないことを示して確かめ続けることは DEC-10（入力）。押さえ直しで降りる場所も支払い方法も変えないことは DEC-09、DEC-10（入力）。依頼のときの押さえが答えなければ依頼を受け付けないことは FR-54 の 3、決済と返金と登録が分からないことを示すことは FR-29 の 5、FR-39 の 2、FR-46 の 4（入力）。結果が分からない呼び出しが結果をどう分け、利用側にどの符号で答えるかは第 3 段階の確定の種類（推定）。EXT-01 が 500 の答えを同じキーに繰り返し返し、ネットワークの誤りと 409 は同じキーで送り直せることは Stripe の文書による（報告の「入力」）。待ちの値は IFC-17（DAS-10）
premises: [EXT-01]
stage: high-level-design
question: EXT-01 の答えをどう分け、結果が分からないお金の操作に利用側へどの状態と符号で答え、試みをいくつまで持つか
addresses: [DRV-07, DRV-32, DRV-01, FR-29, FR-30, FR-39, FR-40, FR-46, FR-54]
options:
  - name: 答えを済んだ、はっきりした拒否、結果が分からない、処理されなかったの四つに分け、押さえと押さえ直しは待ちのうちに分からなければしなかったことにして 503 で、決済、返金、登録は 202 で答えて確かめ続ける
    effect: 利用者を待ちの長さより長く待たせず、分からない押さえで依頼や降りる場所を進めず、分からない決済を失敗とも成功とも示さない
    cost: 確かめ続ける処理と、後で見つかった押さえを解く処理を持つ
  - name: どのお金の操作も、結果が分かるまで利用者を待たせる
    effect: 利用者はいつも結果を受ける
    cost: EXT-01 が答えない間、ドライバーと乗客が T_payment_response を超えて待ち、端末の時間切れが新しい送り直しを生む
  - name: 結果が分からないものは失敗として示し、やり直させる
    effect: 作りが単純
    cost: 済んでいた決済を失敗と示し、やり直しで二重に請求しうる
chosen: ELM-03 は EXT-01 の答えを、済んだ、はっきりした拒否、結果が分からない、処理されなかった（EXT-01 が実行を始める前に退けた鍵や形の誤り）の四つに分け（分け方は IFC-17、答えの一つ一つを分ける判断表は第 4 段階）、利用側に次のとおり答える。押さえと押さえ直し（依頼、降りる場所の変更の承認、依頼の支払い方法の変更）は、最初に送ってから IFC-17 の待ちのうちに分からなければしなかったことにして、503 の HOLD_UNCONFIRMED か REHOLD_UNCONFIRMED で答え、依頼を受け付けず、降りる場所と支払い方法を変えず、押さえが済んでいたと後で分かればそれを解く。決済、返金、支払い方法の登録は、待ちのうちに分からなければ 202 の PAYMENT_PENDING、REFUND_PENDING、PAYMENT_METHOD_PENDING で答え、確かめ続け、分かったら流れ（IFC-11）で知らせ、同じ冪等キーの送り直しにはそのときの結果を答える（DEC-42）。料金の請求（キャンセル料と不在の料金）と押さえを解くことは利用者が待たず、期限の処理が送り、分からなければ確かめ続ける。処理されなかったときは、システムの誤りとして異常にし、利用側には 503 PAYMENT_SERVICE_UNAVAILABLE で答える。どの場合も、拒否か取引がないことを EXT-01 が示すまでは、請求していない、押さえていない、とは示さない。一つの乗車の決済、一つの依頼のキャンセル料か不在の料金、担当者が認めた一つの返金は、済んだか結果が分からない試みを一つまでしか持たず（DEC-10）、新しい試みはそれまでの試みがどれもはっきり拒否で終わったときだけ作る。乗車の決済の新しい試みは、拒否の後に乗客が依頼の支払い方法を変えて押さえ直したときだけ作る（FR-29 の 4）
rationale: 三つ目は済んでいた決済を失敗と示してやり直させ、二重に請求しうるため DRV-32 を破る。二つ目は EXT-01 が答えない間、決済で T_payment_response（QR-24、NFR-29）を超えて待たせ、端末の時間切れの後の送り直しが重なる。一つ目は DEC-10 の原則を利用側の答えに移したもの。押さえと押さえ直しをしなかったことにするのは、依頼を受け付けるのは押さえられたときだけ（FR-54 の 1）で、分からないまま依頼を届けるとドライバーが許諾した後に押さえがないことが分かりうるため。決済、返金、登録を 202 にするのは、それぞれの目的（請求、返金、使える支払い方法）がその後も続き、分かったときに示せば FR-29 の 5、FR-39 の 2、FR-46 の 4 を満たすため。503 と 202 を分けるのは、利用側が 503 なら操作をし直せ（新しいキー）、202 なら送り直さずに待つ（同じキー）と状態の組で決められるため（DEC-35）。EXT-01 は 500 を同じキーに繰り返し返すため、結果が分からない試みは同じキーの送り直しだけでなく取引の読み出しで確かめる（IFC-17）
rejected:
  - option: どのお金の操作も、結果が分かるまで利用者を待たせる
    reason: EXT-01 が答えない間 T_payment_response を超えて待たせ、端末の時間切れの後の送り直しが重なる（QR-24、DRV-01）
  - option: 結果が分からないものは失敗として示し、やり直させる
    reason: 済んでいた決済を失敗と示し、やり直しで二重に請求しうる（DRV-32、DRV-07）
gains:
  - 利用者を待ちの長さより長く待たせない
  - 分からない押さえで依頼や降りる場所を進めず、分からない決済を失敗とも成功とも示さない
costs:
  - 結果が分からない試みを確かめ続け、後で見つかった押さえを解く処理を持つ
sensitive_points: []
trade_offs:
  - with: DRV-01
    note: 待ちのうちに分からない押さえと決済は、SLI-01 と SLI-06 の悪いイベントになる（DEC-10 の引き換えのまま）
assumptions:
  - EXT-01 は、拒否をネットワークの誤りや 500 と見分けられる答え（402 か、拒否を示す取引の状態）で返す（ELM-05）
depends_on: [DEC-09, DEC-10, DEC-35, DEC-42]
parameters: []
