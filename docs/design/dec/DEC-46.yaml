id: DEC-46
title: 時間のしきい値の SLO はホップごとに裾の分け前で予算を割り、タイムアウトは呼ばれる側の最悪の待ちより長くし、端末は ELM-03 の期限に通信の余裕を足す
status: active
basis: assumed
basis_note: 時間のしきい値の SLO は NFR-07（SLI-14）、NFR-19（SLI-10）、NFR-34（SLI-13）で、それぞれのしきい値と目標は入力（NFR-07 の T_dispatch_propagation と目標は QAS-25 による品質チェーンの暫定の決定）。決済の答えを T_payment_response のうちに示すことは QR-24 と NFR-29（入力、値は QAS-33 による品質チェーンの暫定の決定）。タイムアウトの順（端末の待ちは ELM-03 の期限より長く、その期限は外部を待つ時間とやり直しの和より長い）は DEC-08、DEC-10、DEC-13（入力）。予算の割り方とタイムアウトの決め方は推定。予算のホップと期限の値は、測っていない暫定の値で DAS-11、EXT-01 の押さえのホップは DAS-10、期限の来た処理を拾う間隔は DAS-12 による暫定の決定。期限の処理を拾う間隔は HND-11 を、流れの予算は HND-04 を IFC-11 とともに決める。計算は報告の「遅延の予算とタイムアウト」のスクリプトによる。流れで送ったのに示した時刻が届かない相手に Web Push で知らせる道を NFR-07 の予算に加え、その配信のホップを置いたことは FND-26 を（値は DAS-15）、送り直さずに次の送りが替わる呼び出し（位置）のタイムアウトの決め方を書いたことは FND-29 を受けた。流れの後の Web Push の道は、相手の端末が示した時刻を送ること（FR-53）があって働き、FR-53 を今期作ることは QAS-54 による品質チェーンの暫定の決定で、第 3 段階のレビューの質問 1 で成り立つと答えを受けた（QCR-08 が品質チェーンに運ぶ。当てられるまで QAS-54 を前提に残す）。QAS-54 を前提に挙げたことは FND-38 を受けた
premises: [DAS-10, DAS-11, DAS-12, DAS-15, QAS-25, QAS-33, QAS-54]
stage: high-level-design
question: 時間のしきい値の SLO（NFR-07、NFR-19、NFR-34）とお金の道で、各ホップにどれだけの時間を割り当て、呼び出しのタイムアウト、待ち、どの呼び出しにも属さない間隔をどう決めるか
addresses: [NFR-07, NFR-19, NFR-34, NFR-29, DRV-03, DRV-04, DRV-07, DRV-01, FND-26, FND-29]
options:
  - name: 直列の n のホップに、1 − (1 − 目標) ÷ n のパーセンタイルの予算を割り、和と余裕がしきい値に収まるかを確かめ、タイムアウトは予算とは別に、呼ばれる側の健全なときの遅い裾と最悪の待ちより長くする
    effect: どのホップも予算を超える頻度が裾の分け前のうちなら、流れ全体が目標の割合でしきい値に収まり、健全な呼び出しがタイムアウトにならない
    cost: ホップの値は測るまで暫定で、測る仕組みは品質チェーンのゲートに頼る（QCR-06）
  - name: ホップの 99 パーセンタイルを足して予算にし、タイムアウトを予算から決める
    effect: 計算が短い
    cost: パーセンタイルは足せず、一つのホップのまれな遅れで和を超え、予算から決めたタイムアウトは健全な遅い呼び出しを失敗と結果が分からない操作に変える
  - name: SLO のしきい値をタイムアウトにする
    effect: 決める値が少ない
    cost: しきい値で決済を見捨てると、見捨てた決済が後で請求されうる
chosen: 直列の n のホップに 1 − (1 − 目標) ÷ n のパーセンタイルの予算を割り、和と余裕がしきい値に収まるかをスクリプトで確かめる（報告の「遅延の予算とタイムアウト」）。タイムアウトは予算から決めず、呼ばれる側の健全なときの遅い裾より長く、呼ぶ側のタイムアウトはその呼び出しが待つ最悪（確かめの待ちを含む）より長くする。ELM-01 と ELM-02 の、時間のしきい値の SLO とお金の道の上の呼び出しのタイムアウトは、その操作に ELM-03 が答える期限に通信の余裕を足したものより長くする。ただし、送り直さずに次の送りが替わる呼び出し（IFC-05 の位置）は、つながり直しを待たないため余裕を足さず、ELM-03 の期限と通信の往復の予算の和より長く、送る間隔を超えない長さにする。NFR-07 の予算は、流れで送ったのに示した時刻が届かない相手に Web Push でも知らせる道（IFC-11 の待ちの後、IFC-21）も確かめる。呼び出しに属する値は各 IFC の timing に、どの呼び出しにも属さない値は下の parameters に置く。ほかの呼び出しは各 IFC が枠だけを持ち、値は第 4 段階が決める（HND-17、HND-18、HND-19、HND-07）
rationale: 三つ目は NFR-29 の 10 秒で決済を見捨て、後で請求されうる（DRV-32）。二つ目はパーセンタイルを足すため、一つのホップのまれな遅れで流れが和を超え、予算から決めたタイムアウトは健全な遅い呼び出しを結果が分からない操作に変える（DRV-07）。一つ目では、NFR-07 の最も長い流れ（依頼から、EXT-01 の押さえを含めてドライバーの一覧に示すまで）が 7 ホップの 99.29 パーセンタイルで 4.10 秒と余裕 0.90 秒で 5 秒に収まり、NFR-19 の位置の古さは 4 ホップの 98.75 パーセンタイルで 10.7 秒と余裕 19.3 秒で 30 秒に収まり、NFR-34 は一つの取引で収まる。決済の ELM-03 の答えの期限 8.8 秒は、NFR-29 がシステムの境界で数える T_payment_response の 10 秒のうちにある。端末のタイムアウトは 15 秒（8.8 秒と余裕 5 秒の和より長い）と 10 秒（2 秒と余裕 5 秒の和より長い）で、位置の送りは 5 秒（2 秒と往復 1.0 秒の和より長く、送る間隔 5 秒を超えない）。位置は失っても次の送りが替わり、待ってつながり直す意味がないため、余裕を足して送る間隔より長くすると、送りが重なるだけになる。流れで送ったのに示した時刻が届かない相手への Web Push の道は、自身の処理、取引、記録を読む間隔、待ち 2 秒、Web Push の配信、示すまでで 4.5 秒と余裕 0.5 秒で 5 秒に収まる
rejected:
  - option: ホップの 99 パーセンタイルを足して予算にし、タイムアウトを予算から決める
    reason: パーセンタイルは足せず、予算から決めたタイムアウトが健全な遅い呼び出しを結果が分からない操作に変え、DRV-07 と DRV-01 を弱める
  - option: SLO のしきい値をタイムアウトにする
    reason: 見捨てた決済が後で請求されうり、DRV-32 を破る
gains:
  - 予算がしきい値に収まるかと、どの呼ぶ側も呼ばれる側の最悪より長く待つことを、計算で確かめられる
costs:
  - ホップの値は測るまで暫定のまま
sensitive_points:
  - EXT-01 の押さえのホップ。NFR-07 の依頼の流れの余裕は 0.90 秒で、押さえが予算の 2 秒を超えることが続くと依頼の変化がドライバーに示されるのが 5 秒を超える（値は DAS-10）
trade_offs:
  - with: DRV-03
    note: 依頼の変化は EXT-01 の押さえの後にドライバーに届くため、押さえが遅いと示すのも遅れる。押さえる前に届けないのは FR-54 の 1 のため
assumptions:
  - ELM-03 のインスタンスが二つ以上でも、ほかのインスタンスの書いた出来事を読む間隔が予算のホップに入る（DEC-06）
depends_on: [DEC-06, DEC-08, DEC-10, DEC-13, DEC-18, DEC-45]
parameters:
  - name: ELM-03 の一つの操作の自身の処理（予算）
    value: 0.1 秒
    basis: 測っていない暫定の値（DAS-11）
  - name: ELM-04 の一つの取引（予算と期限の計算）
    value: 0.1 秒
    basis: 東京の Cloud Run と Turso（DEC-05）の間の一つの取引を見込んだ暫定の値（DAS-11）
  - name: ELM-03 から端末までの流れの片道と、端末から ELM-03 までの片道（モバイルの通信）
    value: 0.5 秒
    basis: 測っていない暫定の値（DAS-11）
  - name: 端末が受けた変化を画面に示すまで
    value: 0.3 秒
    basis: 測っていない暫定の値（DAS-11）
  - name: 端末のタイムアウトに足す通信の余裕
    value: 5 秒
    basis: モバイルの通信の往復の遅れと、つながり直し一回分を見込んだ暫定の値（DAS-11）
  - name: 時間のしきい値の SLO とお金の道の上の、外部のシステムを呼ばない操作に ELM-03 が答える期限
    value: 2 秒
    basis: 自身の処理と一つの取引の予算 0.2 秒に、取引の待ちの遅い裾を見込んだ暫定の値（DAS-11）
  - name: Web Push を送ってから相手の端末に届くまで（配信サービスを通る、NFR-07 の予算）
    value: 1.0 秒
    basis: 測っていない暫定の値（DAS-15）
  - name: 期限の来た処理を拾う間隔
    value: 5 秒
    basis: 結果が分からない試みを確かめる最も短い間隔（IFC-17 の 30 秒）より短く、T_wait_prompt と T_no_accept の知らせと終わりを遅らせない長さ（HND-11、DAS-12）
debt: null
as_is: new
