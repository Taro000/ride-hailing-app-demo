id: DEC-53
title: 毎日の処理の結果と運用のコマンド
status: draft
version: 1
basis: inferred
basis_note: DEC-05、DEC-17、DEC-37、data-and-conventions.md の持ち主の決まり、FND-19・22 の論点は入力。コマンドの形、終わりの符号、処理ごとの上限は推定。第 2 段階の指摘が残るままこの形で進めることは質問 1 で確認済み
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: 毎日の処理の結果を誰がどう読み、閉じる前と終える前の数えをどう行うか
addresses:
- IFC-10
- IFC-11
- DEC-37
- DEC-05
- FND-19
- FND-22
options:
- name: 日と処理ごとの記録を DAT-24 に、要約と期間を終えられるかを毎日の結果の知らせに書く。閉じる前の数えと期間の状態はイメージのコマンドが返し、ELM-06 は表を直接読まない。ELM-04 は突き合わせの結果を読むだけ
  effect: 「終わっていない」の決まりがドメインのコード一か所。ELM-06 が持ち主の表に頼らない
  cost: コマンドを二つ作る
- name: ELM-06 が SQL で表を直接読む
  effect: コマンドが要らない
  cost: 決まりが手順の中の問い合わせと二つになり、表を変えると手順が壊れる
- name: ELM-06 がサーバーの API で数える
  effect: 持ち主の API
  cost: 期間を終えるときはサービスがない
chosen: '日と処理ごとの記録を DAT-24 に、要約と期間を終えられるかを毎日の結果の知らせに書く。閉じる前の数えと期間の状態はイメージのコマンドが返し、ELM-06 は表を直接読まない。ELM-04 は突き合わせの結果を読むだけ。終わりの符号: 0（0 件・終えられる）、10（残りがある・まだ）、20（Turso に届かない）、1（そのほかの失敗）。毎日の結果の知らせは成功でも送り、期間の要約（終わっていない依頼、確かめ中、確定も解放もしていない押さえの数と period_end_ready）を載せる'
rationale: data-and-conventions.md の持ち主の決まり（ほかの要素は持ち主のインタフェースを通して読む）。FND-19 の答えがどちらでも、このコマンドの約束は変わらない。FND-22 のうち「毎日の結果に期間を終えられるかを書く」はインタフェースの形なので、この段で置く
rejected:
- option: ELM-06 が SQL で表を直接読む
  reason: 決まりが二か所になる
- option: ELM-06 がサーバーの API で数える
  reason: 期間を終えるときに使えない
gains:
- 閉じる前と終える前の確かめが毎日の処理と同じ決まりで数える
costs:
- コマンドの出力の形を守る
sensitive_points: []
trade_offs: []
assumptions:
- ELM-06 がコマンドを動かす場所と資格情報は DEC-34 のまま（FND-19 で変わりうる）
depends_on:
- DEC-05
- DEC-37
- DEC-27
parameters:
- name: 毎日の処理の処理ごとの上限
  value: 確かめ中の片付け 5 分、突き合わせ 15 分、履歴の確かめと監視 5 分、SLI の集計 10 分、保存期間 5 分、記録と知らせ 2 分（合計 42 分）
  basis: 一回の上限 45 分の内（計算）。ふだんは数分
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
