id: DEC-03
title: 状態の変化を SSE と状態の履歴の追いかけで届ける
status: draft
version: 3
basis: inferred
basis_note: T_deliver 5 秒は NFR-02（入力）。Hono のタイムアウトのミドルウェアが流れに使えないことは文書から。方式と値は提案（質問 10・15 は回答なし）。出どころに受付の記録と相手の位置と到着予定の今の値を足すことは、第 3 段階の DEC-51 に合わせた
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: 状態の変化を、示すべき相手の画面に T_deliver（5 秒）以内にどう届けるか
addresses:
- DRV-02
- DRV-18
- DRV-12
- DRV-27
- FND-28
options:
- name: 画面ごとに SSE の流れを一本開く。各インスタンスは状態の履歴の表とドライバーの受付の記録（どちらも追記だけ、通し番号付き）を P_tail ごとに追いかけ、迎車中・乗車中の相手の位置と到着予定は今の値を P_tail ごとに読み（位置のモジュールが相手と状態を確かめて返す。DEC-15）、相手が見てよい変化だけを送る。つなぎ直しでは最後に受けた通し番号から送り直し、前面に戻ったときとつなぎ直したときは最新の状態を取り直す
  effect: インスタンスがいくつでも、入れ替わっても届く。漏れはつなぎ直しで埋まる
  cost: 各インスタンスが 1 秒ごとにデータベースを読む。流れは要求のタイムアウトの前に閉じてつなぎ直す
- name: WebSocket で同じことをする
  effect: 双方向に使える
  cost: 双方向は要らない（位置は HTTP で送る。DEC-14）。つなぎ直しと送り直しを自作する
- name: 画面が数秒ごとに問い合わせる
  effect: 最も単純で、インスタンスに縛られない
  cost: 5 秒の 95% には 2 秒ほどの間隔が要り、端末の通信と要求の数が増える
- name: Web Push で裏の画面にも知らせる
  effect: 裏に回った乗客にも知らせられる
  cost: ホーム画面に入れた Web アプリでしか使えず、許可と Service Worker が要る。前面の速さには効かない
chosen: 画面ごとに SSE の流れを一本開く。各インスタンスは状態の履歴の表とドライバーの受付の記録（どちらも追記だけ、通し番号付き）を P_tail ごとに追いかけ、迎車中・乗車中の相手の位置と到着予定は今の値を P_tail ごとに読み（位置のモジュールが相手と状態を確かめて返す。DEC-15）、相手が見てよい変化だけを送る。つなぎ直しでは最後に受けた通し番号から送り直し、前面に戻ったときとつなぎ直したときは最新の状態を取り直す
rationale: DRV-02 を Cloud Run の上（DRV-18、DEC-02）で満たす。追いかけ 1 秒なら、残り 3.95 秒を携帯の回線と表示に使える（計算）。SSE にはブラウザのつなぎ直しと最後の ID の送り直しがある。状態の履歴の表を配信のもとにすると、状態を変えたら必ず履歴を残すこと（DRV-31）と、配信の漏れのなさが同じ仕組みになる。問い合わせは間隔を短くすると DRV-12 と DRV-26 で負け、長くすると DRV-02 を満たさない。開発者は送り続ける仕組みを作った経験がある（PC-03）。流れを開けるのはログインした人だけで、本数の上限と優先は DEC-21 が受け持つ。版 2 は出どころを状態の履歴だけにしていたが、相手の位置（FR-10、11、24）、到着予定の取り直し（DEC-22）、ドライバーの停止（FR-47）は状態の履歴の変化ではない（DEC-15）ので、画面に届かなかった。第 3 段階が DEC-51 で受付の記録と今の値を足した形に合わせた（FND-28）
rejected:
- option: WebSocket で同じことをする
  reason: 双方向は要らず、つなぎ直しと送り直しを自作する分だけ DRV-26 で負ける
- option: 画面が数秒ごとに問い合わせる
  reason: DRV-02 と DRV-12 を同時に満たせない
- option: Web Push で裏の画面にも知らせる
  reason: TC-09（DRV-20）で裏の制約を受け入れており、前面の速さに効かない。TC-09 を見直すときに考え直す（先送りした決定ではない）
gains:
- インスタンスの数と入れ替えに左右されない
- 届かなかった変化をつなぎ直しで埋められる
- 配信のもとが状態の履歴と同じ（DRV-27、DRV-31）
costs:
- インスタンスごとに 1 秒に 3 回の読み出し（状態の履歴、受付の記録、今の値。デモの回 1 回で 32,400 回。計算。版 2 は 10,800 回と見込んでいた）
- 流れを 30 分ごとにつなぎ直す
- 生存確認の分だけ端末の通信が増える
- 要求のタイムアウトはサービスに一つなので、SSE のための 3,600 秒が短い要求にもかかる（短い要求の上限は DEC-33）
sensitive_points:
- 追いかけの間隔 P_tail
- 生存確認の間隔
- iOS の Safari で前面に戻ったときのつなぎ直し
- 流れの本数の上限と優先（DEC-21）
trade_offs:
- with: DRV-12
  note: 25 秒ごとの生存確認の通信。位置の送信（10 秒ごと）より少ない
- with: DRV-26
  note: 読み出しが Turso の使用量に入る
- with: DRV-01
  note: 要求のタイムアウト 3,600 秒はサービスに一つで、短い要求にもかかる。短い要求と Turso の呼び出しの上限はサーバーの中で置く（DEC-33）
assumptions:
- Cloud Run は流し続ける応答をためずに送る
- iOS の Safari の EventSource は前面でつなぎ直す（NFR-20 の確かめで見る）
- Hono のタイムアウトのミドルウェアは流れに使えないので、流れは自分のタイマーで 30 分で閉じる（Hono の文書）
depends_on:
- DEC-02
- DEC-08
- DEC-09
- DEC-21
- DEC-15
parameters:
- name: P_tail（状態の履歴の追いかけの間隔）
  value: 1 秒
  basis: T_deliver 5 秒（NFR-02）から、回線と表示に 3.95 秒を残す（計算）
- name: SSE の生存確認の間隔
  value: 25 秒
  basis: 提案。つないだままにしつつ、位置の送信（10 秒）より通信を増やさない
- name: SSE の一本の流れの最長
  value: 30 分
  basis: Cloud Run の要求のタイムアウトの最大 60 分（文書）の半分
- name: Cloud Run の要求のタイムアウト
  value: 3,600 秒
  basis: 文書の最大。30 分の流れを途中で切らない。サービスに一つなので、短い要求の上限はサーバーの中で置く（DEC-33）
- name: つなぎ直しの待ち
  value: 1 秒
  basis: T_deliver の 5 秒の内に収める
debt: null
deferred: false
revisit_when: null
as_is: new
