id: DEC-37
title: 時刻は UTC で表し、日で数えるものは Asia/Tokyo の日付で数え、端末の時刻は送った時刻と往復の時間からサーバーの時刻に直す
status: active
basis: inferred
basis_note: インタフェースが見せる時刻の約束事は、第 3 段階の確定の種類（推定）。サービスが日本で円で使われること（CON-08、OPF-01）から事業の時間帯を Asia/Tokyo とした（推定）。保存期間を記録した日から数えること（QR-59）と SLI を日ごとに数えること（SLI-01〜SLI-14 の数え方の規則）は入力。端末の時計とサーバーの時計の差を示した時刻を比べられる程度にそろえることは DEC-23 の想定で、そのそろえ方をここで決めた（推定）
premises: []
stage: high-level-design
question: インタフェースとデータで時刻をどう表し、日で数えるものをどの時間帯で数え、端末が測った時刻をサーバーの時刻とどう比べるか
addresses: [DRV-26, DRV-27, DRV-04, DRV-21, SLI-10, SLI-14]
options:
  - name: UTC で表し、日は Asia/Tokyo で数え、端末の時刻は sentAt と直前の往復の時間からサーバーの時刻に直して、直す前の値とともに持つ
    effect: 端末の時計がずれていても、示した時刻と位置の古さを通信の片道の分まで含めてサーバーの時刻で比べられる
    cost: 端末はどの報告にも送った時刻と往復の時間を添える
  - name: UTC で表し、端末の時刻はそのまま使う
    effect: 作る手間がない
    cost: 端末の時計のずれがそのまま SLI-14 の区間と SLI-10 の古さに入る
  - name: 端末の時刻を使わず、サーバーが受けた時刻だけを使う
    effect: 時計のずれがない
    cost: 示した時刻（FR-53）と測った時刻（SLI-10）はサーバーが知れず、SLI の数え方の規則を満たせない
chosen: インタフェースの時刻は RFC 3339 の UTC（Z とミリ秒まで）で表し、ELM-04 にも UTC で持つ。長さは単位を名前に含む整数（etaSeconds、elapsedMs など）。日で数えるもの（SLI の日、日々の処理の時刻、保存期間を数える記録した日、記録した日ごとの鍵の日）は Asia/Tokyo の日付で数える。端末が測った時刻（位置の測った時刻、相手の変化を示した時刻、エラーの起きた時刻）は端末の時計のエポックミリ秒で送り、どの報告にも sentAt（送るときの端末の時計）と lastRoundTripMs（その端末の直前の ELM-03 への呼び出しの往復の時間）を添える。ELM-03 は受けた時刻 receivedAt から、端末の時刻 t をサーバーの時刻 t + (receivedAt − sentAt − lastRoundTripMs ÷ 2) に直し、直す前の値とともに持つ
rationale: 三つ目は FR-53 の示した時刻と SLI-10 の測った時刻を得られず、SLI-14 と SLI-10 の数え方の規則を満たせない。二つ目は端末の時計のずれが区間と古さにそのまま入る。一つ目は、往復の時間の半分を片道とみて時計の差を見積もるため、位置の古さには通信の片道の時間が含まれ（直さなければ片道の分だけ新しく見える）、示した時刻も片道の分の偏りなくサーバーの時刻にそろう。片道が往復の半分でないときの誤差は片道と復路の差の半分までで、SLI-14 の 5 秒と SLI-10 の 30 秒に比べて小さい。Asia/Tokyo は、参加者とデモの回の日付が日本の日付で、保存期間とデモの日を同じ日付で数えるため
rejected:
  - option: UTC で表し、端末の時刻はそのまま使う
    reason: 端末の時計のずれが SLI-14 の区間と SLI-10 の古さにそのまま入り、数え方の規則どおりに数えられない
  - option: 端末の時刻を使わず、サーバーが受けた時刻だけを使う
    reason: FR-53 の示した時刻と SLI-10 の測った時刻が得られず、SLI-14 と SLI-10 を数えられない
gains:
  - 端末の時計がずれていても、示した時刻と位置の古さをサーバーの時刻で比べられる
costs:
  - 端末はどの報告にも送った時刻と直前の往復の時間を添える
sensitive_points: []
trade_offs: []
assumptions:
  - 端末と ELM-03 の間の片道の時間は、往復の時間の半分とみてよい
depends_on: [DEC-23]
parameters: []
debt: null
as_is: new
