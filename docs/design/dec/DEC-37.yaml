id: DEC-37
title: デモを閉じる前と期間を終える前に、終わっていない依頼とお金の操作を確かめる
status: draft
version: 2
basis: inferred
basis_note: 押さえの期限（7 日）と SLI-04 の判定し直しは入力。期間を延ばすこと（TC-07 の文にはない）は質問 17 で確認済みで、TC-07 への追記は FND-18。確かめの仕方は提案（質問 15 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: デモの回を閉じるときと期間を終えるときに、終わっていない依頼、確かめ中のお金の操作、確定も解放もしていない押さえを残さないにはどうするか
addresses:
- DRV-04
- DRV-33
- DRV-18
- DRV-27
options:
- name: 手順が自分で確かめる。デモを閉じる手順は、終わっていない依頼と確かめ中の操作を Turso から数え、あれば一覧を示して止まる。期間を終える手順は、最後の回の翌朝の処理が、確かめ中の操作、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録したときだけ進み、そうでなければ定時の起動を残して次の実行の後にやり直す。どちらも、理由を付けて強いて進めると配備の記録に残す
  effect: 押さえが Stripe の側で 7 日で取り消されて記録と食い違うまま、確かめる実行がない、ということが起きない
  cost: 期間が 1〜2 日延びることがある。終わらない依頼があると閉じられない
- name: 今のまま（デモを閉じるとサービスを消し、期間は時刻で終える）
  effect: 手間がない
  cost: 残った押さえは 7 日で Stripe の側で取り消され、記録と食い違い、突き合わせる実行がない
- name: デモを閉じるときに、システムが終わっていない依頼を取り消す
  effect: 手順が止まらない
  cost: 品質チェーンにない機能（システムによる取り消し）になる。FR-08 は乗客が待ち続けることを許す
chosen: 手順が自分で確かめる。デモを閉じる手順は、終わっていない依頼と確かめ中の操作を Turso から数え、あれば一覧を示して止まる。期間を終える手順は、最後の回の翌朝の処理が、確かめ中の操作、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録したときだけ進み、そうでなければ定時の起動を残して次の実行の後にやり直す。どちらも、理由を付けて強いて進めると配備の記録に残す
rationale: DRV-04 は押さえと請求が Stripe の記録と一致することを、原則 DRV-33 は止まった分を抜けなく続けることを求める。サービスを消すと見回り（DEC-04）がなく、期間を終えると毎日の処理（DEC-05）もない。その前に 0 件を確かめれば、どちらの仕組みも働くうちに片付く。運用者は一人なので、確かめを人の注意に頼らず手順の中に置く（FND-05）。案 3 は機能を足すので、品質チェーンへの課題 7 にした。TC-07 はデモの期間を「最後の回の翌朝の処理が終わるまで」とし、この延長を書いていない。延長は確かめ中などが残ったときだけ起き、DRV-04 を守るので残す（質問 17）。TC-07 に足すよう第 1 段階に FND-18 を出した
rejected:
- option: 今のまま（デモを閉じるとサービスを消し、期間は時刻で終える）
  reason: DRV-04 と DRV-33 を満たさない
- option: デモを閉じるときに、システムが終わっていない依頼を取り消す
  reason: 品質チェーンにない機能を設計で足すことになる
gains:
- 押さえと確かめ中が、確かめる仕組みのない所に残らない
- 人が一段飛ばしても手順が止まる
costs:
- 期間が延びることがある
- 終わらない依頼があると閉じられない（強いて進めると記録に残る）
sensitive_points:
- 強いて進めたとき（残った押さえは次の期間の最初の実行が確かめる。次の期間がなければ誰も確かめない）
trade_offs:
- with: DRV-26
  note: 期間が延びた日の分、定時の起動とジョブが動く
assumptions:
- 参加者は、デモを閉じる前に自分の依頼を終えるか取り消せる（FR-07、FR-28）
- 第 1 段階が TC-07 に延長を足す（FND-18）。足すまでは、延長が起きた日は TC-07 の文の外で定時の起動とジョブが動く
depends_on:
- DEC-04
- DEC-05
- DEC-06
- DEC-12
- DEC-13
parameters: []
debt:
  what: 強いて閉じた・終えたときに残った押さえは、次の期間がなければ誰も確かめない
  why_accepted: 参加者の依頼が終わらないときに、手順を止めたままにしない
  repay_when: 強いて進めたとき（配備の記録に残る）
deferred: false
revisit_when: null
as_is: new
