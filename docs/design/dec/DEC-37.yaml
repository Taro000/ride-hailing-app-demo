  date: '2026-11-03'
  change: 期間の終わりを毎日の処理が決め、最後の回の印があって残りが 0 件なら自分で定時の起動と二つ目の規則を止めることにした。残りを毎日の処理が片付けられるもの (A) と、サービスか参加者でしか片付かないもの (B) に分け、(B) は待たずに知らせる。閉じる前の数えは運用のジョブで行う。版 2 の形（人が動かす）を案に足して比べ直した。負債の返すときを「次の期間の最初の実行が確かめたとき」に直した。TC-07 に延長が入ったので、前提から「足すまでは TC-07 の外で動く」を外した
