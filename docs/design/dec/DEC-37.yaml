id: DEC-37
title: デモを閉じる前に確かめ、期間の終わりは毎日の処理が残りを確かめて決める
status: draft
version: 4
basis: inferred
basis_note: 押さえの期限（7 日）と SLI-04 の判定し直しは入力。手配から T_request_max を過ぎた許諾のない依頼をシステムが取り消すことは FR-08 版 2（入力）で、それを毎日の処理が (A) として片付けるのは DRV-33 版 3（第 1 段階の質問 16 で確認済み）から。期間を延ばすことは質問 17 で確認済みで、TC-07 に入った（第 1 段階が FND-18 を受け入れた）。期間の終わりを毎日の処理が決めて定時の起動を止めることは質問 23 で確認済み。確かめの仕方の残り（残りの分け方、最後の回の印、知らせ方）は提案（質問 15 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: デモの回を閉じるときと期間を終えるときに、終わっていない依頼、確かめ中のお金の操作、確定も解放もしていない押さえを残さないにはどうするか
addresses:
- DRV-04
- DRV-33
- DRV-18
- DRV-27
- FND-22
options:
- name: 手順と毎日の処理が自分で確かめる。デモを閉じる手順は、運用のジョブで終わっていない依頼と確かめ中の操作を数え（ドメインのコード一か所。第 3 段階の count-open）、あれば一覧を示して止まり、そのデモの最後の回なら「最後の回」と配備の記録に残す。期間の終わりは毎日の処理が決める。毎朝、残りを (A) 毎日の処理が片付けられるもの（確かめ中の操作、Stripe から状態を取り出せる確定も解放もしていない押さえ、手配から T_request_max を過ぎた許諾のない依頼。最後のものは毎日の処理がシステムの取り消しとして終え、押さえを解放する。DEC-04）と (B) サービスか参加者でしか片付かないもの（許諾の後の終わっていない依頼とその押さえ）に分けて記録し、最後の回が閉じられていて (A) も (B) も 0 件なら、自分で定時の起動と二つ目の規則を止め、期間を終えたと記録して知らせる。(A) だけが残るときは次の実行で続ける。(B) が残るときは待たずに「サービスを開いて参加者に依頼を終えてもらうか、強いて終える」と知らせ、人が動くまで毎朝知らせる。閉じる手順も期間を終える手順（ELM-06）も、理由を付けて強いて進めると配備の記録に残す
  effect: 押さえが Stripe の側で 7 日で取り消されて記録と食い違うまま、確かめる実行がない、ということが起きない。期間の終わりが人の動きに頼らないので、TC-07 の期間を越えてジョブが動かない
  cost: 期間が延びることがある（(A) だけなら 1〜2 日、(B) は人が動くまで）。終わらない依頼があると閉じられない。毎日の処理のジョブに定時の起動と二つ目の規則を止める権限が要る
- name: 手順が確かめ、期間を終える手順は人が動かす（毎日の結果が終えられると知らせる。版 2 の形）
  effect: 毎日の処理のジョブの権限が増えない
  cost: 誰がいつ動かすかが人の注意に頼る。動かすのが一日遅れるごとに、ジョブが TC-07 の期間の外で一度動く。(B) が残ると延長に終わりがない
- name: 今のまま（デモを閉じるとサービスを消し、期間は時刻で終える）
  effect: 手間がない
  cost: 残った押さえは 7 日で Stripe の側で取り消され、記録と食い違い、突き合わせる実行がない
- name: デモを閉じるときに、システムが許諾の後の終わっていない依頼も取り消す
  effect: 手順が止まらない
  cost: 品質チェーンにない機能になる。FR-08 版 2 がシステムに取り消させるのは許諾のない依頼だけで、許諾の後の依頼は扱わない（閉じる前の確かめのまま）
chosen: 手順と毎日の処理が自分で確かめる。デモを閉じる手順は、運用のジョブで終わっていない依頼と確かめ中の操作を数え（ドメインのコード一か所。第 3 段階の count-open）、あれば一覧を示して止まり、そのデモの最後の回なら「最後の回」と配備の記録に残す。期間の終わりは毎日の処理が決める。毎朝、残りを (A) 毎日の処理が片付けられるもの（確かめ中の操作、Stripe から状態を取り出せる確定も解放もしていない押さえ、手配から T_request_max を過ぎた許諾のない依頼。最後のものは毎日の処理がシステムの取り消しとして終え、押さえを解放する。DEC-04）と (B) サービスか参加者でしか片付かないもの（許諾の後の終わっていない依頼とその押さえ）に分けて記録し、最後の回が閉じられていて (A) も (B) も 0 件なら、自分で定時の起動と二つ目の規則を止め、期間を終えたと記録して知らせる。(A) だけが残るときは次の実行で続ける。(B) が残るときは待たずに「サービスを開いて参加者に依頼を終えてもらうか、強いて終える」と知らせ、人が動くまで毎朝知らせる。閉じる手順も期間を終える手順（ELM-06）も、理由を付けて強いて進めると配備の記録に残す
rationale: DRV-04 は押さえと請求が Stripe の記録と一致することを、原則 DRV-33 は止まった分を抜けなく続けることを求める。サービスを消すと見回り（DEC-04）がなく、期間を終えると毎日の処理（DEC-05）もない。その前に 0 件を確かめれば、どちらの仕組みも働くうちに片付く。運用者は一人なので、確かめを人の注意に頼らず手順の中に置く（FND-05）。版 2 は期間を終える手順を人が動かす形で、DRV-18（TC-07、交渉できない）を人の動きで越えうるうえ、(B) が残ると「1〜2 日」の延長に終わりがなかった（FND-22）。毎日の処理が自分で止める形は、DRV-18 で版 2 の形に勝つ（質問 23）。品質チェーンは課題 7 に答え、手配から T_request_max を過ぎた許諾のない依頼をシステムが取り消す機能を足した（FR-08 版 2）。そのため (B) は許諾の後の依頼だけに縮み、許諾のない依頼は (A) に入る（DRV-33 版 3）。案 4（許諾の後の依頼も取り消す）は、品質チェーンが扱わないと決めた範囲なので取らない。TC-07 は、確かめ中などが残れば毎日の処理が 0 件と記録するまで期間が延びると書いている（第 1 段階が FND-18 を受け入れた。質問 17）
rejected:
- option: 手順が確かめ、期間を終える手順は人が動かす（毎日の結果が終えられると知らせる。版 2 の形）
  reason: DRV-18 を一部しか満たさない（人の動きが遅れると TC-07 の期間の外でジョブが動く）。利用者は第 1 の案を選んだ（質問 23）
- option: 今のまま（デモを閉じるとサービスを消し、期間は時刻で終える）
  reason: DRV-04 と DRV-33 を満たさない
- option: デモを閉じるときに、システムが許諾の後の終わっていない依頼も取り消す
  reason: 品質チェーンにない機能を設計で足すことになる（FR-08 版 2 は許諾のない依頼だけを扱う）
gains:
- 押さえと確かめ中が、確かめる仕組みのない所に残らない
- 人が一段飛ばしても手順が止まる
- 期間の終わりが人の動きに頼らない
costs:
- 期間が延びることがある（(A) だけなら 1〜2 日、(B) は人が動くまで）
- 終わらない依頼があると閉じられない（強いて進めると記録に残る）
- 毎日の処理のジョブに、定時の起動と二つ目の規則を止める権限を足す（DEC-34）
sensitive_points:
- 最後の回の印（閉じる手順で付け忘れると、毎日の処理は期間を終えない。毎日の結果がそれを知らせる）
- 強いて進めたとき（残った押さえは次の期間の最初の実行が確かめる。次の期間がなければ誰も確かめない）
trade_offs:
- with: DRV-26
  note: 期間が延びた日の分、定時の起動とジョブが動く
- with: DRV-29
  note: 毎日の処理のジョブの権限が少し増える（定時の起動と二つ目の規則を止める）
assumptions:
- 参加者は、デモを閉じる前に自分の依頼を終えるか取り消せる（FR-07、FR-28）
- TC-07 は延長を書いている（第 1 段階の 2 回目の再実行。FND-18）
- (B) が残るのは、閉じる手順を強いて進めたときだけ（ふだんは閉じる前の確かめで 0 件になる）。強いて閉じたときに残った許諾のない依頼は、翌朝の毎日の処理が T_request_max で取り消す（(A)）
depends_on:
- DEC-04
- DEC-05
- DEC-06
- DEC-12
- DEC-13
- DEC-34
parameters: []
debt:
  what: 強いて閉じた・終えたときに残った許諾の後の依頼の押さえは、次の期間がなければ誰も確かめない
  why_accepted: 参加者の依頼が終わらないときに、手順を止めたままにしない
  repay_when: 次の期間の最初の実行が確かめたとき（次の期間がなければ返せず、危険が残る）
deferred: false
revisit_when: null
as_is: new
