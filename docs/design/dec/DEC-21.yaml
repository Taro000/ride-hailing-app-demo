id: DEC-21
title: 乗客とドライバーへの知らせは、画面に出ていれば流れで、出ていなければ Web Push で届け、中身に個人の情報を入れない
status: active
basis: inferred
basis_note: 乗客とドライバーへの知らせ（FR-04、FR-06、FR-10、FR-13、FR-18、FR-22、FR-23、FR-26、FR-31、FR-39、FR-44、FR-47 の通知）は入力。iOS の Safari の Web アプリの知らせはホーム画面に加えた Web アプリでしか届かないこと（DRV-14）は入力で、iOS 16.4 から届くことは WebKit の公開の記述による。乗客とドライバーが迎車を待つ間、迎車中、乗車中にアプリを画面に出したままにすることは、設計の第 1 段階の質問 2 の答え（QCR-02）に従う。ドライバーが受付をしている間も出したままにする（届いた依頼は流れで一覧に示す）ことは質問 2 で確認済み（TC-18。QCR-03 は回答済みで、品質チェーンが反映するまで前提に残す）。画面に出ていない間は Web Push だけが届くことは DAS-03 によるもので、質問 6 で確認済み（仮定のまま進め、実機での振る舞いは開発の中と NFR-15 の受け入れの試験で確かめる）。届け方は推定
premises: [TC-13, TC-18, DAS-03, QCR-02, QCR-03]
stage: architecture
question: 乗客とドライバーに、アプリが画面に出ていない間も変化を知らせるには
addresses: [DRV-03, DRV-14, DRV-29, DRV-34]
options:
  - name: 画面に出ていれば流れ（DEC-06）で示し、出ていない端末にはブラウザの提供元の配信サービスを通す Web Push で知らせる
    effect: 画面に出ていない参加者にも、依頼が届いたこと、取り消し、決済の結果、返金が届く
    cost: 参加者が知らせを許し、端末ごとの宛先を持つ
  - name: 流れだけで示し、画面に出ていない端末には知らせない
    effect: 外の配信サービスに頼らない
    cost: 画面に出ていない参加者は、次にアプリを開くまで変化に気づかない
  - name: SMS かメールを送るサービスで知らせる
    effect: アプリを入れていなくても届く
    cost: 外部のサービスと費用が増え、電話番号かメールアドレスをそのサービスに渡す
chosen: 画面に出ていれば流れ（DEC-06）で示し、出ていない端末にはブラウザの提供元の配信サービスを通す Web Push で知らせる
rationale: 二つ目は、許諾のない依頼の知らせ（FR-04）や返金の知らせ（FR-39）のように画面に出ていない間の変化を届けられず DRV-03 を満たさない。三つ目は外部のサービスと費用（DRV-16）と、連絡先を外へ渡すこと（DRV-29）で劣る。一つ目で配信サービス（ELM-07）が加わり、その中身は暗号にして送るため配信サービスは読めない。知らせの中身は短い題だけにし、名前、場所、額は入れず、詳しくはアプリを開いて示す（DRV-34）。端末ごとの宛先はデータベースに置き、届かなくなった宛先は外す。参加者が知らせを許す案内は範囲外
rejected:
  - option: 流れだけで示し、画面に出ていない端末には知らせない
    reason: 画面に出ていない間の変化が届かず、DRV-03 を満たさない
  - option: SMS かメールを送るサービスで知らせる
    reason: 外部のサービスと費用が増え（DRV-16）、連絡先を外へ渡す（DRV-29）
gains:
  - 画面に出ていない参加者にも変化が届く
costs:
  - 配信サービスが届けるまでの時間は、このシステムが決められない
sensitive_points: []
trade_offs: []
assumptions:
  - ホーム画面に加えた Web アプリは、画面に出ていない間も Web Push の知らせを受ける（DAS-03）
depends_on: [DEC-02, DEC-06, DEC-15]
parameters: []
debt: null
as_is: new
