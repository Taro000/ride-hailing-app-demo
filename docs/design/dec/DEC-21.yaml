id: DEC-21
title: 上限を重ねて、乱用で予算を超えず、同時の要求の枠を使い切られないようにする
status: draft
version: 2
basis: inferred
basis_note: 規模は質問 7 で確認済み。上限の値は提案（質問 15 は回答なし）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 公開した入口への攻撃と地図の鍵の乱用で、費用が予算を超えず、同時の要求の枠を使い切られないようにするにはどうするか
addresses:
- DRV-29
- DRV-26
- DRV-01
- DRV-02
options:
- name: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントの作成とアカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ
  effect: 最悪の費用が上限の和で決まる。一人と一つの IP では同時の要求の枠を使い切れず、短い要求の枠が残る
  cost: 上限に達するとデモの途中でも地図が使えなくなる。多くの IP からの攻撃では流れの上限を埋められる
- name: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  effect: 入口で守る
  cost: 負荷分散の月の費用（未定の値）と設定
- name: アプリの回数の制限だけ
  effect: 単純
  cost: 多くの IP からの要求と地図の鍵の乱用に上限がない。流れで同時の要求の枠を使い切れる
- name: 最大のインスタンスを 2 にして枠を増やす
  effect: 同時の要求の枠が 160 に増える
  cost: 費用の上限が 2 倍になる。流れの本数の上限がなければ 160 本でも埋まる
chosen: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントの作成とアカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ
rationale: DRV-29 の「大量の要求を受けても費用は C_budget_month を超えない」を、DRV-26（PC-01、無料の枠を優先）の中で満たす。最大 1 インスタンスでは同時に扱える要求は全体で 80 で、SSE は一本を最長 30 分持つので、流れの本数を限らないと、自分で作れるアカウント（FR-01 AC1）から流れを開いて枠を使い切り、主要な流れを 429 にできる（DRV-01。FND-08）。Cloud Armor は月の費用がかかる。最大 2 インスタンスは費用の上限を倍にしても、流れの上限がなければ埋まる
rejected:
- option: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  reason: DRV-26 に反する
- option: アプリの回数の制限だけ
  reason: DRV-29 と DRV-01 を一部しか満たさない
- option: 最大のインスタンスを 2 にして枠を増やす
  reason: DRV-26 で負け、流れの上限がなければ DRV-01 を守れない
gains:
- 乱用されても最悪の費用に上限がある
- 流れで同時の要求の枠を使い切れない（短い要求の枠が 40 残る）
costs:
- 上限に達すると地図が使えなくなる（DRV-11 の扱い）
- 多くの IP とアカウントからの攻撃では、流れの上限を埋められる
sensitive_points:
- Q_maps_day の値（低すぎるとデモが止まり、高すぎると上限にならない）
- 流れの本数の上限（低すぎると参加者の画面が配信を受けられず、高すぎると短い要求の枠が足りない）
trade_offs:
- with: DRV-01
  note: 上限に達すると地図を使う操作が決まった扱いに移る
- with: DRV-02
  note: 多くの IP とアカウントから流れの上限を埋められると、参加者の画面は前面に戻ったときの取り直しまで変化が届かない
assumptions:
- Google Maps Platform の API ごとの 1 日の割り当てを Google Cloud で設定できる
- デモの回の間に新しい登録を止める機能は要らない（公開していない URL のこの規模では、多くの IP からの攻撃は起きにくいと見る）
depends_on:
- DEC-02
- DEC-06
- DEC-22
parameters:
- name: Q_maps_day（地図の API ごとの 1 日の割り当て）
  value: 1,000 回
  basis: デモの回 1 回の経路と到着予定の呼び出しは最大 189 回（計算）で、5.3 倍の余裕
- name: Cloud Run の最大のインスタンス
  value: '1'
  basis: DEC-02 と同じ
- name: SSE の流れの本数
  value: アカウントごと 2、IP ごと 6、全体 40
  basis: 参加者 2 人の流れは 2 本で、全体の上限はその 20 倍。全体は同時の要求の数 80 の半分で、短い要求に 40 を残す。全体を埋めるにはアカウントが 20、IP が 7 要る（計算）
- name: アカウントの作成の回数の制限
  value: IP ごとに 1 時間に 5 件
  basis: 提案。参加者とエンジニアのテスト用アカウントを作るのに足りる
debt:
  what: 多くの IP とアカウントからの攻撃で SSE の流れの上限を埋められると、変化の配信が落ちる
  why_accepted: Cloud Armor は月の費用がかかる（DRV-26）。デモの回の間に新しい登録を止める機能はない
  repay_when: 攻撃を受けたとき（デモを閉じて止め、Cloud Armor か登録の制限を考え直す）
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: SSE の流れの本数の上限とアカウントの作成の回数の制限を足し、最大 2 インスタンスの案と比べ、DRV-02 を対象に加えた。残る危険（多くの IP からの攻撃）を書いた
  reason: FND-08（第 2 段階のレビュー）を受け入れた
