id: DEC-21
title: 費用の上限を重ねて、乱用で予算を超えないようにする
status: draft
version: 1
basis: inferred
basis_note: 規模は質問 7 で確認済み。上限の値は提案
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 公開した入口への攻撃と地図の鍵の乱用で、費用が予算を超えないようにするにはどうするか
addresses:
- DRV-29
- DRV-26
- DRV-01
options:
- name: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ
  effect: 最悪の費用が上限の和で決まる
  cost: 上限に達するとデモの途中でも地図が使えなくなる
- name: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  effect: 入口で守る
  cost: 負荷分散の月の費用（未定の値）と設定
- name: アプリの回数の制限だけ
  effect: 単純
  cost: 多くの IP からの要求と地図の鍵の乱用に上限がない
chosen: 上限を重ねる。デモの外はサービスがない、Cloud Run の最大のインスタンス、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ
rationale: DRV-29 の「大量の要求を受けても費用は C_budget_month を超えない」を、DRV-26（PC-01、無料の枠を優先）の中で満たす。Cloud Armor は月の費用がかかる
rejected:
- option: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  reason: DRV-26 に反する
- option: アプリの回数の制限だけ
  reason: DRV-29 を一部しか満たさない
gains:
- 乱用されても最悪の費用に上限がある
costs:
- 上限に達すると地図が使えなくなる（DRV-11 の扱い）
sensitive_points:
- Q_maps_day の値（低すぎるとデモが止まり、高すぎると上限にならない）
trade_offs:
- with: DRV-01
  note: 上限に達すると地図を使う操作が決まった扱いに移る
assumptions:
- Google Maps Platform の API ごとの 1 日の割り当てを Google Cloud で設定できる
depends_on:
- DEC-02
- DEC-06
- DEC-22
parameters:
- name: Q_maps_day（地図の API ごとの 1 日の割り当て）
  value: 1,000 回
  basis: デモの回 1 回の経路と到着予定の呼び出しは最大 189 回（計算）で、5.3 倍の余裕
- name: Cloud Run の最大のインスタンス
  value: '1'
  basis: DEC-02 と同じ
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
