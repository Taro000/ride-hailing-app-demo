id: DEC-21
title: 上限を重ね、参加者を先に通して、乱用と参加者でない人の利用で予算を超えずデモが止まらないようにする
status: draft
version: 4
basis: inferred
basis_note: 規模は PC-05（入力）。デモの URL を発表、ブログ、動画で示し、デモの回の最中や前にも示すことは第 2 段階のレビューの質問 1・2 の回答（入力）。参加者を先に通す案を選ぶことは質問 20 で確認済み。上限の値、取り置き 300 回、優先の範囲は提案（質問 15・25・26 は回答なし）。攻撃と利用に要る数は計算
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 公開した入口への攻撃、地図の鍵の乱用、参加者でない人の利用で、費用が予算を超えず、同時の要求の枠を使い切られず、参加者の配信と地図が止まらないようにするにはどうするか
addresses:
- DRV-29
- DRV-26
- DRV-01
- DRV-02
- DRV-11
- FND-23
options:
- name: 上限を重ね、参加者を先に通す。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントの作成とアカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ。加えて、運営・サポート担当が作ったアカウント（ドライバー、運営とエンジニア）と割り当て済み（迎車中・乗車中）の依頼の乗客の流れは、全体に達していても優先でない流れのうち最も古いものを閉じて入れる。地図は API ごとに 1 日の呼び出しを数え、割り当て済みの依頼とドライバーの分を取り置き、割り当て前の乗客の場所の検索と見積もりは取り置きの外が尽きたら決まった扱いに移す
  effect: 最悪の費用が上限の和で決まる。一人と一つの IP では同時の要求の枠を使い切れず、短い要求の枠が残る。参加者でない人の利用や攻撃で流れと地図が尽きても、ドライバー、運営、割り当て済みの乗客の配信と、割り当て済みの依頼の到着予定と経路は止まらない
  cost: 割り当て前の乗客（参加者を含む）は、参加者でない人と流れ、場所の検索、見積もりを分け合う。参加者でない人の依頼はドライバーの一覧に並ぶ。流れを開くときの優先の判定と、地図の呼び出しの日ごとの数えを作る
- name: 上限を重ねる（版 3 の形。優先と取り置きなし）
  effect: 最悪の費用が上限の和で決まる
  cost: 流れの全体の 40 本は、参加者でない 40 人が乗客の画面を開くだけで、攻撃なら 20 アカウントと 7 つの IP で 34 分で埋まり、参加者の流れも 30 分の内のつなぎ直しで 429 になる。地図の割り当ても参加者でない人の見積もり 802 回で尽き、その日は割り当て済みの依頼の到着予定も決まった扱いに移る（計算）
- name: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  effect: 入口で多くの IP からの攻撃を抑える
  cost: 負荷分散の月の費用（未定の値）と設定。参加者でない人の正しい利用は止めない
- name: アプリの回数の制限だけ
  effect: 単純
  cost: 多くの IP からの要求と地図の鍵の乱用に上限がない。流れで同時の要求の枠を使い切れる
- name: 最大のインスタンスを 2 にして枠を増やす
  effect: 同時の要求の枠が 160 に増える
  cost: 費用の上限が 2 倍になる。流れの本数の上限がなければ 160 本でも埋まる
- name: 参加者でない人の登録と利用を防ぐ（乗客の登録を招待制にする、デモの回の間は登録を閉じる）
  effect: 参加者でない人がアカウントを持てず、今の上限で足りる
  cost: 品質チェーンにない機能（FR-01 は乗客が自分で登録できるとする）
chosen: 上限を重ね、参加者を先に通す。デモの外はサービスがない、Cloud Run の最大のインスタンス、SSE の流れの本数（ログインした人だけが開け、アカウントごと、IP ごと、全体で限る。全体は同時の要求の数の半分）、Google Maps Platform の API ごとの 1 日の割り当て、サーバーの鍵は外に出さず使う API だけに限る、ブラウザの地図の鍵は参照元と Maps JavaScript API だけに限る、アカウントの作成とアカウントと IP ごとの回数の制限、ログインの一時の停止、GCP の予算の知らせ。加えて、運営・サポート担当が作ったアカウント（ドライバー、運営とエンジニア）と割り当て済み（迎車中・乗車中）の依頼の乗客の流れは、全体に達していても優先でない流れのうち最も古いものを閉じて入れる。地図は API ごとに 1 日の呼び出しを数え、割り当て済みの依頼とドライバーの分を取り置き、割り当て前の乗客の場所の検索と見積もりは取り置きの外が尽きたら決まった扱いに移す
rationale: DRV-29 の「大量の要求を受けても費用は C_budget_month を超えない」を、DRV-26（PC-01、無料の枠を優先）の中で満たす。最大 1 インスタンスでは同時に扱える要求は全体で 80 で、SSE は一本を最長 30 分持つので、流れの本数を限らないと枠を使い切られる（DRV-01。FND-08）。版 3 は、デモの回の間の登録を止めない理由を「公開していない URL のこの規模では、多くの IP からの攻撃は起きにくい」としたが、URL は発表、ブログ、動画で示し、デモの回の最中や前にも示す（第 2 段階のレビューの質問 1・2）。乗客は自分で登録できる（FR-01）ので、上限は費用を縛っても、デモそのものは守らなかった（FND-23）。参加者でない人が持てないのは、運営・サポート担当が作るアカウント（FR-48、FR-01 AC3）と、そのドライバーに割り当てられた依頼だけなので、そこを先に通す。DRV-26 は版 3 の形と同じに満たし、DRV-02 で勝つ。参加者でない人の登録を防ぐ案は DRV-02・29 を最もよく満たすが、機能は品質チェーンが決める（課題 9）。Cloud Armor は月の費用がかかり、正しい利用は止めない。最大 2 インスタンスは費用の上限を倍にしても、流れの上限がなければ埋まる。最大のインスタンスは、参加者でない人が使っても費用の上限として 1 のまま保つ（DEC-02）。利用者はこの案で進めると決めた（質問 20）
rejected:
- option: 上限を重ねる（版 3 の形。優先と取り置きなし）
  reason: DRV-02 と DRV-01 を一部しか満たさない（参加者の流れと、割り当て済みの依頼の地図も、参加者でない人の利用で尽きる）
- option: 外部の HTTPS の負荷分散と Cloud Armor を前に置く
  reason: DRV-26 に反する
- option: アプリの回数の制限だけ
  reason: DRV-29 と DRV-01 を一部しか満たさない
- option: 最大のインスタンスを 2 にして枠を増やす
  reason: DRV-26 で負け、流れの上限がなければ DRV-01 を守れない
- option: 参加者でない人の登録と利用を防ぐ（乗客の登録を招待制にする、デモの回の間は登録を閉じる）
  reason: 品質チェーンにない機能を設計で足すことになる（品質チェーンへの課題 9）
gains:
- 乱用されても最悪の費用に上限がある
- 流れで同時の要求の枠を使い切れない（短い要求の枠が 40 残る）
- ドライバー、運営とエンジニア、割り当て済みの乗客の流れは、参加者でない人で埋まっても開ける
- 割り当て済みの依頼の到着予定と経路は、地図の取り置きで守る（デモの回 1 回の 198 回に対して 300 回）
costs:
- 割り当て前の乗客（参加者を含む）は、参加者でない人と流れ、場所の検索、見積もりを分け合う。参加者でない 40 人で優先でない流れが埋まると 15 秒ごとの問い合わせになり、取り置きの外の 700 回は見積もりの上限のアカウント 7 つか一人 10 回の 70 人で尽きる（計算）
- 参加者でない人の依頼がドライバーの一覧に並び、参加者でない人の出来事も SLI に参加者として数えられる
- 多くの IP とアカウントからの攻撃では、優先でない流れの上限を埋められる
- 流れを開くときの優先の判定と、地図の呼び出しの日ごとの数え（Turso に一行）を作る
sensitive_points:
- Q_maps_day と R_maps_reserve の値（低すぎるとデモが止まり、高すぎると上限にならない）
- 流れの本数の上限と、優先の範囲（運営が作ったアカウントと割り当て済みの乗客。割り当て前の乗客は参加者でない人と見分けられないので優先しない）
- 回数の制限の値（第 3 段階の DEC-55）
trade_offs:
- with: DRV-01
  note: 取り置きの外が尽きると、割り当て前の場所の検索と見積もりが決まった扱いに移る（その日の残りは参加者の乗客も料金と移動時間を示せない）
- with: DRV-02
  note: 割り当て前の乗客の流れは断られうる（15 秒ごとの問い合わせで、許諾の知らせが最大 15 秒遅れる）
assumptions:
- デモの URL は発表、ブログ、動画で示し、デモの回の最中や次のデモより前にも示す（第 2 段階のレビューの質問 1・2）。乗客は自分で登録できる（FR-01）ので、参加者でない人もデモの回に登録して手配できる。設計の前提にこの事実を書くのは第 1 段階（FND-27）
- 参加者でない人の登録と利用を防ぐ機能はない（品質チェーンへの課題 9）
- ドライバーと運営・エンジニアのアカウントは運営・サポート担当が作る（FR-48、FR-01 AC3）ので、参加者でない人は持てない
- Google Maps Platform の API ごとの 1 日の割り当てを Google Cloud で設定できる
depends_on:
- DEC-02
- DEC-06
- DEC-22
- DEC-20
parameters:
- name: Q_maps_day（地図の API ごとの 1 日の割り当て）
  value: 1,000 回
  basis: デモの回 1 回の割り当て済みの依頼とドライバーの呼び出しは最大 198 回（第 3 段階で依頼の内容の経路を足した。計算）で、5.05 倍
- name: R_maps_reserve（割り当て済みの依頼とドライバーの分の取り置き）
  value: API ごとに 1 日 300 回
  basis: 割り当て済みの依頼とドライバーの分 198 回の 1.5 倍。割り当て前の場所の検索と見積もりには 700 回が残る（計算）
- name: Cloud Run の最大のインスタンス
  value: '1'
  basis: DEC-02 と同じ。参加者でない人が使っても、費用の上限として保つ
- name: SSE の流れの本数
  value: アカウントごと 2、IP ごと 6、全体 40。優先の流れ（運営が作ったアカウント、割り当て済みの乗客）は、全体に達していれば優先でない流れのうち最も古いものを閉じて入れる
  basis: 参加者 2 人の流れは 2 本で、全体の上限はその 20 倍。全体は同時の要求の数 80 の半分で、短い要求に 40 を残す。全体を埋めるにはアカウントが 20、IP が 7 要る。優先の流れはデモの規模で多くて 8 本（計算）
- name: アカウントの作成の回数の制限
  value: IP ごとに 1 時間に 5 件
  basis: 提案。参加者とエンジニアのテスト用アカウントを作るのに足りる
debt:
  what: URL を公開するので、割り当て前の乗客（参加者を含む）は参加者でない人と流れ、場所の検索、見積もりを分け合う。参加者でない 40 人で優先でない流れが埋まり、7 つのアカウントか 70 人の見積もりで割り当て前の地図の分が尽きる。参加者でない人の依頼もドライバーの一覧に並ぶ（計算）
  why_accepted: 参加者を見分ける機能がない（品質チェーンへの課題 9）。Cloud Armor は月の費用がかかり、正しい利用は止めない（DRV-26）
  repay_when: 品質チェーンが課題 9 に答えたとき（乗客の登録を招待制にするか、デモの回の間は登録を閉じるか、参加者でない人の利用を許して規模を決め直すか）。攻撃を受けたときは、デモを閉じて止める
deferred: false
revisit_when: null
as_is: new
