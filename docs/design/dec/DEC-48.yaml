id: DEC-48
title: 冪等キーと送り直し
status: draft
version: 2
basis: inferred
basis_note: interfaces.md の決まり（お金を動かす操作はいつも冪等、送り直しは道ごとに一か所）、DEC-12、FND-21 の論点は入力。鍵の範囲と 7 日は推定、30 秒は計算から決めた
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: どの要求を冪等にし、誰がどこで送り直すか
addresses:
- IFC-01
- IFC-02
- IFC-03
- IFC-06
- DEC-12
- FND-21
- DRV-04
- DRV-30
options:
- name: "状態を変える要求すべてに Idempotency-Key（位置、前面と裏、記録は、それぞれの ID で重複を捨てる）。最初の結果を 7 日保つ。送り直すのはブラウザの API の呼び出しのモジュールだけ。同じキーで同じ中身: 最初の結果（状態の符号と本文）を返す。動いている間: 409 OPERATION_IN_PROGRESS と Retry-After: 1。結果が分からない（202 の HOLD_PENDING など）: pending として 202 を返し、確定したら最初の結果を確定したものに替える。同じキーで違う中身: 422 IDEMPOTENCY_KEY_REUSED。一つ目のトランザクションを書けなかったとき（Turso に届かない）は何も残らず、同じキーで送り直すと初めからやり直す。手配の押さえで Stripe が実行しなかった（429）か届かなかったと分かったときの 503 PAYMENTS_UNAVAILABLE も、キーの最初の結果にせず（キーを放す）、同じキーの送り直しは初めからやり直す（DEC-52）。キーを持たない操作は次の三つの組。位置の送信（clientSendId）、前面と裏の出来事、画面の記録（clientEventId、clientErrorId）は、それぞれの ID で重複を捨てる。ログイン、パスキーの options と authenticate、ログアウトは、繰り返してもセッションを作るか終えるだけなので送り直してよい。見積もり（estimates、destination-quotes）は計算で、二度目は新しい短い見積もりを作るだけ。PUT、PATCH、DELETE はキーを求める。設定の符号を示す操作（乗客の作成、ドライバーの登録、符号の出し直し）の最初の結果には符号を保たず、同じキーの送り直しは符号を伏せた結果を返し、画面は出し直しを案内する（符号はハッシュだけを持つ。DAT-02、DAT-14）。サーバーはブラウザの要求を送り直さない。サーバーから Stripe への送り直しは DEC-12 のとおり一か所"
  effect: どの操作も画面の扱いが一つになる。乗車の終了、取り消し、不在のような、DEC-12 の (a) にない操作の送り直しも最初の結果を受ける
  cost: 要求ごとにキーの表を一度書く
- name: お金の操作の手配と返金だけに鍵（DEC-12 の (a) のまま）
  effect: 書く量が少ない
  cost: 取り消し、不在、乗車の終了がタイムアウトで切られたとき、送り直した画面が何を受けるか決まらない（FND-21）
- name: 鍵を持たず、状態の条件だけで二度目を拒む
  effect: 表が要らない
  cost: 送り直した画面は 409 を受け、最初の結果を知れない
chosen: '状態を変える要求すべてに Idempotency-Key（位置、前面と裏、記録は、それぞれの ID で重複を捨てる）。最初の結果を 7 日保つ。送り直すのはブラウザの API の呼び出しのモジュールだけ。同じキーで同じ中身: 最初の結果（状態の符号と本文）を返す。動いている間: 409 OPERATION_IN_PROGRESS と Retry-After: 1。結果が分からない（202 の HOLD_PENDING など）: pending として 202 を返し、確定したら最初の結果を確定したものに替える。同じキーで違う中身: 422 IDEMPOTENCY_KEY_REUSED。一つ目のトランザクションを書けなかったとき（Turso に届かない）は何も残らず、同じキーで送り直すと初めからやり直す。手配の押さえで Stripe が実行しなかった（429）か届かなかったと分かったときの 503 PAYMENTS_UNAVAILABLE も、キーの最初の結果にせず（キーを放す）、同じキーの送り直しは初めからやり直す（DEC-52）。キーを持たない操作は次の三つの組。位置の送信（clientSendId）、前面と裏の出来事、画面の記録（clientEventId、clientErrorId）は、それぞれの ID で重複を捨てる。ログイン、パスキーの options と authenticate、ログアウトは、繰り返してもセッションを作るか終えるだけなので送り直してよい。見積もり（estimates、destination-quotes）は計算で、二度目は新しい短い見積もりを作るだけ。PUT、PATCH、DELETE はキーを求める。設定の符号を示す操作（乗客の作成、ドライバーの登録、符号の出し直し）の最初の結果には符号を保たず、同じキーの送り直しは符号を伏せた結果を返し、画面は出し直しを案内する（符号はハッシュだけを持つ。DAT-02、DAT-14）。サーバーはブラウザの要求を送り直さない。サーバーから Stripe への送り直しは DEC-12 のとおり一か所'
rationale: interfaces.md の「お金を動かす操作はいつも冪等にする」と「送り直しは呼び出しの道ごとに一か所」。FND-21 が挙げた「操作キーのない操作が T_route で切られたとき」をこの段で閉じる
rejected:
- option: "お金の操作の手配と返金だけに鍵（DEC-12 の (a) のまま）"
  reason: お金を動かすほかの操作（取り消し、不在、乗車の終了、降車場所の変更、未払いの支払い）が守られない
- option: "鍵を持たず、状態の条件だけで二度目を拒む"
  reason: 最初の結果を返せない
gains:
- どの状態を変える要求も、同じキーの送り直しで最初の結果を受ける
- 画面の送り直しの決まりが一つ
costs:
- 要求ごとに冪等キーの表に一行（DAT-14）
sensitive_points:
- T_op_stale（短いと動いている操作を確かめ始め、長いとインスタンスが止まった操作の確かめが遅れる）
trade_offs:
- with: DRV-02
  note: 一つ目のトランザクションに行が一つ増える（Turso の書き手は一つ。DEC-08）
assumptions:
- お金の操作の Stripe へのキーは DEC-12 の表のまま（未払いの支払いは FND-29）
depends_on:
- DEC-12
- DEC-33
parameters:
- name: T_idem_keep（最初の結果を保つ期間）
  value: 7 日
  basis: Stripe のキーの 24 時間より長く、デモ（1〜2 日）の送り直しをすべて覆う。T_pii_retention より短い
- name: T_op_stale（処理中を確かめ中とみなすまで）
  value: 30 秒
  basis: T_route で切られても続く処理の最長 13.0 秒（遅延の予算の計算）の 2.3 倍（DEC-12 が第 3 段階に任せた値）
- name: ブラウザの送り直し
  value: ネットワークの誤り、タイムアウト、500、503 のときだけ、同じキーで 3 回まで（1、2、4 秒の間）
  basis: 409 OPERATION_IN_PROGRESS は Retry-After に従う。それでも分からなければ状態を読み直す
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "例外を書いた。手配の押さえの 503 PAYMENTS_UNAVAILABLE はキーの最初の結果にしない。キーを持たない操作（位置、前面と裏、画面の記録はそれぞれの ID で重複を捨てる。ログイン、パスキー、ログアウト、見積もりは繰り返しても害がない）。PUT、PATCH、DELETE はキーを求める。設定の符号を示す操作の最初の結果に符号を保たない。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。FND-30・43 を受け入れた"
