id: DEC-36
title: 最後の期間を終えるときに、システムを終える手順でデータベースと書き出しを消す
status: draft
version: 1
basis: inferred
basis_note: 選んだ案は質問 13 で確認済み。Turso の保管と削除の振る舞いは文書から。手順の中身（秘密と地図の鍵も消すこと）は推定
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 最後のデモの期間を終えた後、個人情報を T_pii_retention（3 年）より長く残さないにはどうするか
addresses:
- DRV-21
- DRV-18
- DRV-33
options:
- name: システムを終える手順を置く。最後の期間を終えるとき、配備の仕組み（ELM-06）がジョブ、定時の起動、規則、秘密、地図の鍵を消し、開発者が手元の手順（ELM-22）で Turso のデータベースと手元の書き出し（ELM-23）を消す。ログは Cloud Logging の保持（30 日）で消える
  effect: 最後の期間の後に個人情報が残らない
  cost: 記録がすべてなくなる。最後かどうかの見込みを誤ると、次のデモはデータなしで始まる
- name: データを残し、保存期間の処理（FR-53）と NFR-41 の監視だけを週に一度動かし続ける
  effect: 記録を残したまま DRV-21 を守る
  cost: TC-07 から外れ、定時の起動、ジョブ、Turso のトークン、チャットを 3 年保つ。Turso の無料の枠は 10 日使われないデータベースを保管に回すので、週に一度より間を空けられない
- name: 最後に、個人情報をすべて特定できない形に変えて記録を残す
  effect: 匿名の記録が残る
  cost: FR-53 は T_pii_retention を過ぎた記録だけを変える。前倒しは機能の変更で、品質チェーンが決める
- name: 何もしない
  effect: 手間がない
  cost: データベースは保管に回るだけで消えず、3 年を過ぎた個人情報が残る
chosen: システムを終える手順を置く。最後の期間を終えるとき、配備の仕組み（ELM-06）がジョブ、定時の起動、規則、秘密、地図の鍵を消し、開発者が手元の手順（ELM-22）で Turso のデータベースと手元の書き出し（ELM-23）を消す。ログは Cloud Logging の保持（30 日）で消える
rationale: 利用者が選んだ（質問 13）。DRV-21 は交渉できない。案 2 は TC-07（DRV-18、交渉できない）から外れ、3 年の間、資格情報と無料の枠の条件を保つ。案 3 は機能の変更で品質チェーンが決める。案 1 は機能ではなく、デモの回ごとにサービスを消す DEC-06 と同じ種類のインフラの片付けで、デモのデータは本物のお金を含まない（TC-10）。前回は「個人情報をすべて消す処理」に頼ったが、その処理はどの FR にもなかった（FND-10）
rejected:
- option: データを残し、保存期間の処理（FR-53）と NFR-41 の監視だけを週に一度動かし続ける
  reason: DRV-18（TC-07）を満たさず、DRV-26 で負ける
- option: 最後に、個人情報をすべて特定できない形に変えて記録を残す
  reason: 品質チェーンにない機能の変更になる
- option: 何もしない
  reason: DRV-21 を満たさない
gains:
- 最後の期間の後に個人情報が残らない
- 定時の起動も資格情報も残さない
costs:
- 記録がすべてなくなる
- 最後の期間を「最後」と判断する一段を人が担う
sensitive_points:
- 最後の期間を「最後」と決めること（決めずに終えると、この手順は動かない）
trade_offs:
- with: DRV-18
  note: TC-06 の「データはデモとデモの間も残す」は、最後の期間の後には当てはまらないと読む
assumptions:
- 無料の枠で消したデータベースは戻せないものとして扱う（文書は有料の枠で 5 日まで戻せるとだけ書く）
- イメージには個人情報がない
depends_on:
- DEC-05
- DEC-27
- DEC-28
- DEC-34
parameters: []
debt:
  what: 最後の期間を「最後」と決めずに終えると、システムを終える手順が動かず、個人情報が残る。気づかせる仕組みはない
  why_accepted: 定時の起動を残さない（TC-07）
  repay_when: 最後の期間を終えるとき。遅くとも最後のデモの回から T_pii_retention（3 年）の内
deferred: false
revisit_when: null
as_is: new
changelog:
