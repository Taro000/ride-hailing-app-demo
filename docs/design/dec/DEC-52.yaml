id: DEC-52
title: 押さえの結果が分からないときの手配と降車場所の変更
status: draft
version: 2
basis: inferred
basis_note: 押さえの結果が分からないときの扱い（「確かめています」と示して取り消せるようにし、T_hold_wait まで確かめ、間に合わなければ手配をやめ、押さえが残っていれば解放する。「押さえていない」は決済のサービスが答えたときだけ）は FR-05 版 3・FR-12 版 4（入力。品質チェーンへの回答の設計 2-1・3-3）。T_hold_wait の値はこの段が決める（質問 2 で選んだ案は確認済み）。429 と届かなかったときを起きていないと扱うこと（FND-30）、手配の終わりと押さえの確かめを分けること（FND-31）、5xx の後に新しいキーで試すこと（FND-38）は推定。乗車の終了で保留の変更を取りやめること（FND-33）は第 3 段階の質問 6 で確認済み
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: high-level-design
question: 手配の押さえか、降車場所の変更の押さえ直しの結果が分からないとき、乗客に何を返し、いつまで確かめ、Stripe が答えないときや乗車が終わったときにどうするか
addresses:
- DRV-04
- DRV-11
- DRV-30
- FND-30
- FND-31
- FND-33
- FND-38
options:
- name: "手配の押さえの結果を三つに分ける。定まった断り（402 CARD_DECLINED、402 CARD_AUTHENTICATION_REQUIRED）は依頼を not_booked にする。Stripe が実行しなかったと答えた（429）か、要求が Stripe に届かなかったと分かる（送る前の接続の失敗）ときは起きていないと扱い、依頼を not_booked、押さえの操作を not_happened にして 503 PAYMENTS_UNAVAILABLE を返す（この 503 は操作キーの最初の結果にしない。DEC-48 の例外）。タイムアウト、送った後の接続の切れ、Stripe の 5xx、T_op_stale は結果が分からないとし、依頼を hold_checking（ドライバーに示さない）、押さえの操作を checking にして 202 HOLD_PENDING を返す。見回りは P_sweep ごとに Stripe の一覧で照らし、見つかり T_hold_wait（60 秒）の内で取り消しの求めがなければ searching にする。見つからなければ、保たれた失敗がなければ同じキーで、Stripe の 5xx の後は PaymentIntent がなく最初の送信から T_op_stale を過ぎたと確かめてから試みの番号を進めた新しいキーで送る（どちらも T_hold_wait の内だけ）。T_hold_wait を過ぎるか乗客が取り消したら手配をやめ（not_booked。取り消しの応答は 202 HOLD_RELEASE_PENDING）、押さえの確かめはお金の操作の checking のまま見回りと毎日の処理が続け、見つかれば取り消す。乗客には解放したか押さえがないと分かるまで「押さえが残っていれば解放します」と示し、「押さえていない」は Stripe が答えたときだけ示す。降車場所の変更も同じで、変更を保留して 202 DESTINATION_CHANGE_PENDING（destinationChangeId）を返し、乗客は変更を取り消せる。間に合わなければ変えず、新しい押さえが見つかれば取り消す。保留の間に乗車が終わったら変更を取りやめ、古い押さえと変更の前の料金で確定する"
  effect: "どの結果にも出口がある。Stripe が答えた断りと実行しなかったものはすぐ乗客に返り、分からないものは T_hold_wait で手配が必ず終わる。押さえが残りうる間は「押さえていない」と言わない。5xx の後も、起きていないと確かめれば一度は新しいキーで試せる"
  cost: "見回りに確かめの処理と試みの番号が増える。手配をやめた後も押さえの確かめが続き、乗客の画面に「押さえが残っていれば解放します」が出続けうる"
- name: "確かめがつくまで待つ（乗客は取り消せる）"
  effect: "押さえが分かってから決められる"
  cost: "Stripe が止まると終わりがない"
- name: "失敗として返す"
  effect: "単純"
  cost: "押さえが残りうるのに「押さえていない」と言う（FR-05 版 3 に反する）"
- name: "429 と届かなかったときもタイムアウトと同じに扱い、202 HOLD_PENDING にする"
  effect: "扱いが一つで済む"
  cost: "Stripe が実行しなかったと答えたのに乗客を最長 60 秒待たせ、見回りに要らない送り直しをさせる"
chosen: "手配の押さえの結果を三つに分ける。定まった断り（402 CARD_DECLINED、402 CARD_AUTHENTICATION_REQUIRED）は依頼を not_booked にする。Stripe が実行しなかったと答えた（429）か、要求が Stripe に届かなかったと分かる（送る前の接続の失敗）ときは起きていないと扱い、依頼を not_booked、押さえの操作を not_happened にして 503 PAYMENTS_UNAVAILABLE を返す（この 503 は操作キーの最初の結果にしない。DEC-48 の例外）。タイムアウト、送った後の接続の切れ、Stripe の 5xx、T_op_stale は結果が分からないとし、依頼を hold_checking（ドライバーに示さない）、押さえの操作を checking にして 202 HOLD_PENDING を返す。見回りは P_sweep ごとに Stripe の一覧で照らし、見つかり T_hold_wait（60 秒）の内で取り消しの求めがなければ searching にする。見つからなければ、保たれた失敗がなければ同じキーで、Stripe の 5xx の後は PaymentIntent がなく最初の送信から T_op_stale を過ぎたと確かめてから試みの番号を進めた新しいキーで送る（どちらも T_hold_wait の内だけ）。T_hold_wait を過ぎるか乗客が取り消したら手配をやめ（not_booked。取り消しの応答は 202 HOLD_RELEASE_PENDING）、押さえの確かめはお金の操作の checking のまま見回りと毎日の処理が続け、見つかれば取り消す。乗客には解放したか押さえがないと分かるまで「押さえが残っていれば解放します」と示し、「押さえていない」は Stripe が答えたときだけ示す。降車場所の変更も同じで、変更を保留して 202 DESTINATION_CHANGE_PENDING（destinationChangeId）を返し、乗客は変更を取り消せる。間に合わなければ変えず、新しい押さえが見つかれば取り消す。保留の間に乗車が終わったら変更を取りやめ、古い押さえと変更の前の料金で確定する"
rationale: "FR-05 版 3・FR-12 版 4 は、押さえの結果が分からないときに依頼を示さず確かめ、T_hold_wait までに分からなければやめ、押さえが残っていれば解放し、「押さえていない」と示すのは決済のサービスが答えたときだけ、と求める（DRV-04 版 4、DRV-11 版 2）。Stripe は、実行を始めなかった要求（429、同時の要求の衝突）には冪等の結果を保たず、同じキーで送り直せる（Stripe の文書）。そのため 429 は Stripe が答えた「起きていない」で、待たせずに返す（FND-30。案 4 はこれを待たせる）。送る前に接続できなかった要求も Stripe に届いていない。5xx は保たれるので、同じキーの送り直しは同じ 5xx を受けるだけになる（FND-38）。第 2 段階の DEC-12 の (d) のとおり、起きておらず動いてもいないと確かめてから試みの番号を進めた新しいキーで送る。最初の要求が動いていないと言えるのは T_op_stale（30 秒）を過ぎてからなので、T_hold_wait（60 秒）の内に一度は試せる。手配を終えることとお金を確かめることを分けたので（FND-31）、手配は T_hold_wait で必ず終わり、押さえは確かめがつくまで追う。乗車の終了は降車の 10 秒（NFR-25）の中にあるので、保留の変更を待たせず取りやめる（FND-33。待たせる形は乗車の終了を最長 60 秒止める）。QIU-03 の T_book（30 秒）を考えると、乗客が待てるのは長くて 1 分ほど"
rejected:
- option: "確かめがつくまで待つ（乗客は取り消せる）"
  reason: Stripe が止まると終わりがない
- option: "失敗として返す"
  reason: 押さえが残りうるのに「押さえていない」と言う（FR-05 版 3 に反する）
- option: "429 と届かなかったときもタイムアウトと同じに扱い、202 HOLD_PENDING にする"
  reason: Stripe が実行しなかったと答えたのに乗客を待たせる（FND-30）
gains:
- 確かめ中の手配と変更に必ず出口がある（状態遷移図）
- 押さえが残りうる間に「押さえていない」と言わない（FR-05 版 3）
- 5xx の後も、起きていないと確かめれば一度は新しいキーで試せる
costs:
- 見回りに確かめの処理と試みの番号が増える
- 手配をやめた後も押さえの確かめが続き、画面に「押さえが残っていれば解放します」が出続けうる（Stripe の障害の間）
- 手配をやめた依頼の押さえを確かめている間に新しい手配をすると、押さえが一時に二つになりうる（古い方は見つけしだい取り消し、残れば突き合わせが知らせる。NFR-07 版 3）
sensitive_points:
- T_hold_wait（短いと押さえられた手配もやめ、長いと乗客を待たせる）
- T_op_stale（5xx の後に新しいキーで試せるようになるまで）
- 429 と送る前の接続の失敗だけを起きていないと扱うこと（送った後の切れは分からないに入れる）
trade_offs:
- with: DRV-11
  note: 決まった扱いに移るまで最長 60 秒待たせる
assumptions:
- 確かめは Stripe の一覧（顧客と作った時刻で絞り、メタデータの依頼の ID、押さえの何番目か、試みの何回目かで照らす）で行い、Search は使わない（書いた直後の読み出しに向かない。Stripe の文書）
- Stripe は実行を始めなかった要求に冪等の結果を保たない（Stripe の文書）
depends_on:
- DEC-12
- DEC-04
- DEC-48
parameters:
- name: T_hold_wait
  value: 60 秒
  basis: T_book（30 秒）の 2 倍。見回り（5 秒）で 10 回ほど確かめられ、T_op_stale（30 秒）の後に新しいキーで一度は試せる
