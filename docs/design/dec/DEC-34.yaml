id: DEC-34
title: Web アプリは環境ごとの値を起動のときに ELM-03 から読み、端から端の層のブラウザの側の偽物はその値で src/platform/ に差し込む
status: active
basis: inferred
basis_note: FND-12 と FND-13 を受けて加えた。配備するものを版ごとに一度だけ作り、試験の環境で確かめたものと同じイメージをローカルの本番に配備すること（POL-04）と、試験の環境を偽物の設定と本物の外部サービスの設定で動かすこと（POL-03）はこの段階の方針。カードの情報を EXT-01 の入力部品で入れ、登録の結果をサーバーが EXT-01 から読み直すことは DEC-12 と TC-11、二つの Web アプリの静的なファイルを ELM-03 が配ることは DEC-01 と DEC-04、Web アプリが ELM-03 を生成した型で呼ぶことは DEC-33、額と結果を決めるのはサーバーだけであることは DRV-31（入力）。作ることと試すことをローカルだけで完結させることは TC-09、決済は Stripe のテスト環境で地図は Google Maps Platform であることは TC-10 と TC-12（入力）。比べ方と選び方は推定
premises: [TC-09, TC-10, TC-11, TC-12]
stage: technical-policy
question: 一度だけ作るイメージを、試験の環境の偽物の設定と本物の外部サービスの設定とローカルの本番で動かすとき、Web アプリ（ELM-01、ELM-02）は、環境ごとに違う値（外部のサービスの公開の鍵と、ブラウザの側で偽物を使うかどうか）をどう受け取るか
addresses: [DRV-07, DRV-16, DRV-13, DRV-33, FND-12, FND-13]
options:
  - name: ELM-03 が、自身の設定の部品が確かめた設定から Web アプリの環境ごとの値を一つの操作で渡し、Web アプリは起動のときに src/platform/ の設定の部品でそれを読む。端から端の層のブラウザの側の偽物は、その値で src/platform/ の差し替え口に差し込む
    effect: 一つのイメージを、環境ごとの外部のアカウントと偽物の選び方で動かせ、試験の環境で確かめたものをそのまま配備できる。偽物は Web アプリ自身のポートに差し込み、単体の層と同じ偽物を使う。偽物を選べるかどうかを ELM-03 の設定の部品の一か所が決める
    cost: ELM-03 に Web アプリの値を渡す操作が一つ加わり、Web アプリは起動のときにそれを読むのを待つ。ブラウザの側の偽物がリリースのビルドに入る（選んだときだけ読み込む別のファイルにする）
  - name: Web アプリは環境ごとの値をビルドのときに読み、試験の環境の二つの設定とローカルの本番のために、Web アプリを環境ごとにビルドしてそれぞれのイメージを作る
    effect: Web アプリが実行のときの設定を持たない
    cost: 試験の環境で確かめたイメージと、ローカルの本番に配備するイメージが違い、確かめていないビルドを配備する。ビルドとイメージを三つ保つ
  - name: Web アプリのビルドには環境によらない値だけを入れ、端から端の層では、Playwright がブラウザの通信の層で Stripe.js と地図の部品の読み込みを偽物に差し替える
    effect: Web アプリに偽物を入れない
    cost: Stripe.js と地図の部品の振る舞いを通信の層で真似る偽物を作って保つ。外部のサービスの公開の鍵は環境ごとに変えられず、試験の環境とローカルの本番が同じ EXT-01 のサンドボックスを使う
chosen: ELM-03 が、自身の設定の部品が確かめた設定から Web アプリの環境ごとの値を一つの操作で渡し、Web アプリは起動のときに src/platform/ の設定の部品でそれを読む。端から端の層のブラウザの側の偽物は、その値で src/platform/ の差し替え口に差し込む
rationale: 三つ目は、公開の鍵が環境ごとに変わらないため、試験の環境の取引がローカルの本番の EXT-01 のサンドボックスに入って日々の照合（DEC-11）と DRV-07 の測定量（NFR-26 の SLI-12、NFR-24）を乱し（FND-13）、Stripe.js と地図の部品を真似る偽物の手間が DRV-16 で劣る。二つ目は環境ごとの鍵を持てるが、試験の環境で確かめていないビルドをローカルの本番に配備し、配備と戻しの予行（NFR-41）とデータの移しの予行（NFR-42）が確かめたものと動くものが違って DRV-13 を外し、三つのビルドを保つ手間が DRV-16 で劣る。一つ目は、一度だけ作ったイメージを環境ごとの設定で動かし（POL-04）、試験の環境とローカルの本番がそれぞれの外部のアカウントを使える（DRV-07）。偽物は Web アプリの src/platform/ のポートに差し込むため、単体の層と端から端の層が同じ偽物を使い（DRV-33、DRV-16）、偽物を選べるかどうかは ELM-03 の設定の部品の一か所が決めて、ローカルの本番の設定では選べない（POL-04）。端末が渡された値を書き換えて偽物を選んでも、額と結果を決めるのはサーバーで（DRV-31）、登録の結果はサーバーが EXT-01 から読み直す（DEC-12）ため、本番の結果は変わらない
rejected:
  - option: Web アプリは環境ごとの値をビルドのときに読み、試験の環境の二つの設定とローカルの本番のために、Web アプリを環境ごとにビルドしてそれぞれのイメージを作る
    reason: 確かめていないビルドを配備して DRV-13 を外し、三つのビルドを保つ手間が DRV-16 で劣る
  - option: Web アプリのビルドには環境によらない値だけを入れ、端から端の層では、Playwright がブラウザの通信の層で Stripe.js と地図の部品の読み込みを偽物に差し替える
    reason: 公開の鍵を環境ごとに分けられず DRV-07 の測定量を乱し（FND-13）、外部の部品を真似る偽物の手間が DRV-16 で劣る
gains:
  - 試験の環境で確かめたイメージを、そのまま配備できる
  - 環境ごとに外部のアカウントを分けられる
  - 単体の層と端から端の層が、Web アプリの同じ差し替え口と偽物を使う
costs:
  - Web アプリの起動のときに、ELM-03 から値を読む待ちが一つ加わる
  - ブラウザの側の偽物がリリースのビルドに入る
