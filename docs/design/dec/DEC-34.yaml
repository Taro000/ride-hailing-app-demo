id: DEC-34
title: 資格情報を使うものごとに分け、権限を絞る
status: draft
version: 1
basis: inferred
basis_note: Turso のトークンの範囲（一つのデータベース、読むだけ、期限）は Turso の文書から。分け方とトークンに期限を付けないことは提案（質問 15 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: Stripe、Turso、地図、チャット、GCP の資格情報を、だれがどの権限で持つか
addresses:
- DRV-29
- DRV-21
- DRV-22
- DRV-18
options:
- name: 使うものごとに分け、要る権限だけにする。サーバーと毎日の処理は、それぞれのサービスアカウントで Secret Manager から別の資格情報を読む。Stripe はデモのサンドボックスの制限付きの鍵（PaymentIntent、返金、顧客、SetupIntent と一覧だけ）。Turso はデモのデータベースだけに限ったトークン（サーバーとジョブは読み書き、配備の手順は構造の変更）。地図のサーバーの鍵は使う API だけ（DEC-21）。チャットの Webhook の URL も秘密として持つ。配備の手順は鍵を置かない連携で main の枝の手順だけ（DEC-27）。CI の Stripe の鍵は別のサンドボックスの制限付きの鍵で GitHub の秘密に置き、フォークからの pull request の手順には渡さない（DEC-25）。組織全体の Turso の資格情報（保管からの戻し、データベースの作成と削除、書き出し）は CI に置かず、開発者の手元のログインだけで使う（ELM-22）
  effect: 一つの資格情報が漏れても、できることがその用途に限られる。CI から組織全体のデータベースを消せない
  cost: 資格情報の数が増え、作り直しと入れ替えの手間がかかる。Turso の保管からの戻しは手作業
- name: サーバーとジョブと CI で、権限の広い資格情報を一組ずつ共有する
  effect: 管理が楽
  cost: 一つ漏れるとすべての操作ができる。公開のリポジトリの CI から本番のデータに触れうる
- name: CI に組織全体の Turso の資格情報を置き、保管からの戻しとトークンの作り直しも手順にする
  effect: 手で戻す手間がなく、トークンを毎回作り直せる
  cost: 公開のリポジトリの CI から、組織のすべてのデータベースを消せる資格情報を使う
chosen: 使うものごとに分け、要る権限だけにする。サーバーと毎日の処理は、それぞれのサービスアカウントで Secret Manager から別の資格情報を読む。Stripe はデモのサンドボックスの制限付きの鍵（PaymentIntent、返金、顧客、SetupIntent と一覧だけ）。Turso はデモのデータベースだけに限ったトークン（サーバーとジョブは読み書き、配備の手順は構造の変更）。地図のサーバーの鍵は使う API だけ（DEC-21）。チャットの Webhook の URL も秘密として持つ。配備の手順は鍵を置かない連携で main の枝の手順だけ（DEC-27）。CI の Stripe の鍵は別のサンドボックスの制限付きの鍵で GitHub の秘密に置き、フォークからの pull request の手順には渡さない（DEC-25）。組織全体の Turso の資格情報（保管からの戻し、データベースの作成と削除、書き出し）は CI に置かず、開発者の手元のログインだけで使う（ELM-22）
rationale: DRV-29 の守るものに秘密が入り（脅威のモデル）、リポジトリは公開（GitHub）なので CI の秘密の扱いが要る。漏れたときの被害を用途に閉じ込める。案 3 で減る手間は期間の始めの一度の手作業（保管からの戻し）だけで、組織全体の資格情報を公開のリポジトリの CI に置く危険に見合わない。前回は脅威のモデルの表に制限付きの鍵とデータベースを限ったトークンを書きながら、指す DEC にその決まりがなかった（FND-13）
rejected:
- option: サーバーとジョブと CI で、権限の広い資格情報を一組ずつ共有する
  reason: DRV-29 を満たさない
- option: CI に組織全体の Turso の資格情報を置き、保管からの戻しとトークンの作り直しも手順にする
  reason: DRV-29 と DRV-21 を一部しか満たさない
gains:
- 漏れたときの被害が用途に限られる
- 全員の個人情報を書き出せるのは開発者の手元のログインだけ
costs:
- 資格情報の数と、作り直しと入れ替えの手間
- Turso の保管からの戻しは手作業
sensitive_points:
- Turso のトークンに期限を付けるか（付けると期間の途中で切れてジョブが落ちうる。落ちれば DEC-17 の規則が知らせる）
trade_offs:
- with: DRV-26
  note: 資格情報を作って入れ替える手間
assumptions:
- Stripe は制限付きの鍵と、一つのアカウントに複数のサンドボックスを持てる
- Turso のトークンは一つのデータベースに限れ、読むだけにも期限付きにもできる（Turso の文書）
- GitHub はフォークからの pull request の手順に秘密を渡さない（既定）
depends_on:
- DEC-25
- DEC-27
- DEC-32
parameters:
- name: Turso のトークンの期限
  value: 付けない（漏れを疑ったら作り直す）
  basis: 提案。期限で期間の途中にジョブが落ちるのを避ける
