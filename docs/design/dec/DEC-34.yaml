id: DEC-34
title: 資格情報を使うものごとに分けて絞り、データベースのトークンは GCP の中だけに置く
status: draft
version: 2
basis: inferred
basis_note: Turso のトークンの範囲（一つのデータベース、読むだけ、表と操作ごと、期限）と、データベースのトークンをまとめてしか無効にできないことは Turso の文書から。Cloud Run のジョブを実行ごとに引数を替えて動かせ、タスクの終わりの符号を読めることは Cloud Run の文書から。配備の仕組みからデータベースの資格情報をなくし、運用のジョブに移すことは質問 21 で確認済み。ほかの分け方と、トークンに期限を付けないことは提案（質問 15・26 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: Stripe、Turso、地図、チャット、GCP の資格情報を、だれがどの権限で持つか
addresses:
- DRV-29
- DRV-21
- DRV-22
- DRV-18
- FND-19
options:
- name: 使うものごとに分け、要る権限だけにする。サーバー、毎日の処理のジョブ、運用のジョブ（ELM-05 の運用のコマンドを動かす Cloud Run のジョブ）は、それぞれのサービスアカウントで Secret Manager から別の資格情報を読む。Stripe はデモのサンドボックスの制限付きの鍵（PaymentIntent、返金、顧客、SetupIntent と一覧だけ）。Turso はデモのデータベースだけに限ったトークン（サーバー、毎日の処理、運用のジョブ。どれも読み書き）。配備の仕組み（ELM-06）はデータベースの資格情報を持たず、鍵を置かない連携（main の枝の手順だけ。DEC-27）で運用のジョブを起こしてタスクの終わりの符号だけを読む。毎日の処理のジョブのサービスアカウントには、自分の定時の起動と二つ目の規則を止める権限だけを足す（DEC-37）。地図のサーバーの鍵は使う API だけ（DEC-21）。チャットの Webhook の URL も秘密として持つ。CI の Stripe の鍵は別のサンドボックスの制限付きの鍵で GitHub の秘密に置き、フォークからの pull request の手順には渡さない（DEC-25）。組織全体の Turso の資格情報（保管からの戻し、データベースの作成と削除、書き出し）は CI に置かず、開発者の手元のログインだけで使う（ELM-22）
  effect: 一つの資格情報が漏れても、できることがその用途に限られる。公開のリポジトリの CI に、データを読める資格情報がない。CI の環境が漏れても使えるのは実行ごとに短い期限の連携のトークンで、データを読むにはコードを配備しなければならず、配備は記録に残る
  cost: 資格情報の数が増え、作り直しと入れ替えの手間がかかる。運用のジョブの定義とサービスアカウントが一つずつ増え、手順の一段ごとにジョブの実行を待つ（数十秒）。Turso の保管からの戻しは手作業
- name: サーバーとジョブと CI で、権限の広い資格情報を一組ずつ共有する
  effect: 管理が楽
  cost: 一つ漏れるとすべての操作ができる。公開のリポジトリの CI から本番のデータに触れうる
- name: CI に組織全体の Turso の資格情報を置き、保管からの戻しとトークンの作り直しも手順にする
  effect: 手で戻す手間がなく、トークンを毎回作り直せる
  cost: 公開のリポジトリの CI から、組織のすべてのデータベースを消せる資格情報を使う
- name: 配備の仕組みに、構造の変更のためのデモのデータベースのトークン（読み書き）を置き、構造の変更、配備の記録、閉じる前と終える前の数えを手順の中で動かす（版 1 の形）
  effect: ジョブを足さずに済む
  cost: 読み書きのトークンはすべての表を読めるので、公開のリポジトリの CI が全員の個人情報を読める。CI の環境が漏れる（たとえば手順が使う外部のアクションが乗っ取られ、秘密を公開の実行のログに出す）と、トークンがそのまま使え、データベースのトークンをまとめて無効にするまで効く
chosen: 使うものごとに分け、要る権限だけにする。サーバー、毎日の処理のジョブ、運用のジョブ（ELM-05 の運用のコマンドを動かす Cloud Run のジョブ）は、それぞれのサービスアカウントで Secret Manager から別の資格情報を読む。Stripe はデモのサンドボックスの制限付きの鍵（PaymentIntent、返金、顧客、SetupIntent と一覧だけ）。Turso はデモのデータベースだけに限ったトークン（サーバー、毎日の処理、運用のジョブ。どれも読み書き）。配備の仕組み（ELM-06）はデータベースの資格情報を持たず、鍵を置かない連携（main の枝の手順だけ。DEC-27）で運用のジョブを起こしてタスクの終わりの符号だけを読む。毎日の処理のジョブのサービスアカウントには、自分の定時の起動と二つ目の規則を止める権限だけを足す（DEC-37）。地図のサーバーの鍵は使う API だけ（DEC-21）。チャットの Webhook の URL も秘密として持つ。CI の Stripe の鍵は別のサンドボックスの制限付きの鍵で GitHub の秘密に置き、フォークからの pull request の手順には渡さない（DEC-25）。組織全体の Turso の資格情報（保管からの戻し、データベースの作成と削除、書き出し）は CI に置かず、開発者の手元のログインだけで使う（ELM-22）
rationale: DRV-29 の守るものに秘密が入り（脅威のモデル）、リポジトリは公開（GitHub）なので CI の秘密の扱いが要る。漏れたときの被害を用途に閉じ込める。DRV-18 と DRV-26 は四つの案が同じに満たし、DRV-29 と DRV-21（交渉できない）で第 1 の案が勝つ。版 1 は配備の仕組みに構造の変更のための読み書きのトークンを渡しながら、得るものに「全員の個人情報を書き出せるのは開発者の手元のログインだけ」と書いていた（FND-19）。運用のコマンドは第 3 段階が IFC-10 で決めたもので、ジョブで動かしても約束は変わらない。案 3 で減る手間は期間の始めの一度の手作業（保管からの戻し）だけで、組織全体の資格情報を公開のリポジトリの CI に置く危険に見合わない。利用者は第 1 の案を選んだ（質問 21）。1 回目の再実行の前は、脅威のモデルの表に制限付きの鍵とデータベースを限ったトークンを書きながら、指す DEC にその決まりがなかった（FND-13）
rejected:
- option: サーバーとジョブと CI で、権限の広い資格情報を一組ずつ共有する
  reason: DRV-29 を満たさない
- option: CI に組織全体の Turso の資格情報を置き、保管からの戻しとトークンの作り直しも手順にする
  reason: DRV-29 と DRV-21 を一部しか満たさない
- option: 配備の仕組みに、構造の変更のためのデモのデータベースのトークン（読み書き）を置き、構造の変更、配備の記録、閉じる前と終える前の数えを手順の中で動かす（版 1 の形）
  reason: DRV-29 と DRV-21 を一部しか満たさない（公開のリポジトリの CI が全員の個人情報を読める）。利用者は第 1 の案を選んだ（質問 21）
gains:
- 漏れたときの被害が用途に限られる
- 全員の個人情報を読めるトークンは GCP の中の三つのサービスアカウントだけが読み、公開のリポジトリの CI にはない
- 書き出しに使える組織全体のログインは開発者の手元だけ
costs:
- 資格情報の数と、作り直しと入れ替えの手間（Turso のトークンはまとめてしか無効にできないので、漏れを疑ったら三つとも作り直す）
- 運用のジョブの定義とサービスアカウントが一つずつ増え、手順の一段ごとにジョブの実行を待つ
- Turso の保管からの戻しは手作業
- 毎日の処理のジョブに、定時の起動と二つ目の規則を止める権限を足す
sensitive_points:
- Turso のトークンに期限を付けるか（付けると期間の途中で切れてジョブが落ちうる。落ちれば DEC-17 の規則が知らせる）
- 配備できる者は、サービスアカウントで動くコード（データを読むコードも）を配備できる。連携は main の枝の手順だけにし、手順が使う外部のアクションはコミットで固定し、配備するのはゲートを通ったダイジェストだけにする（DEC-27）。配備は Cloud Audit Logs に残る
trade_offs:
- with: DRV-26
  note: 資格情報を作って入れ替える手間と、運用のジョブを一つ持つ手間
assumptions:
- Stripe は制限付きの鍵と、一つのアカウントに複数のサンドボックスを持てる
- Turso のトークンは一つのデータベースに限れ、読むだけ、表と操作ごと、期限付きにできる。無効にするのは、データベース（とそのグループ）のトークンをまとめて（Turso の文書）
- Cloud Run のジョブは、実行ごとに引数と環境変数を替えて動かせ（run.jobs.runWithOverrides の権限）、タスクの結果に終わりの符号が残る（Cloud Run の文書）
- GitHub はフォークからの pull request の手順に秘密を渡さない（既定）
- 毎日の処理のジョブのサービスアカウントに、定時の起動を止める権限と、通知の規則を止める権限だけを持つ役割を与えられる（第 3 段階で確かめる）
depends_on:
- DEC-25
- DEC-27
- DEC-32
- DEC-37
parameters:
- name: Turso のトークンの期限
  value: 付けない（漏れを疑ったら、データベースのトークンをまとめて無効にし、サーバー、毎日の処理、運用のジョブの三つを作り直す）
  basis: 提案。期限で期間の途中にジョブが落ちるのを避ける。Turso はトークンを一つずつは無効にできない（Turso の文書）
