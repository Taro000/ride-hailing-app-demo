id: DEC-35
title: SLO のバーンレートのアラートは、サーバーが毎分 Turso の記録から数えて知らせる
status: draft
version: 4
basis: inferred
basis_note: アラートの条件（窓、バーンレート、N_alert_min、呼び出しとチケット）は NFR-01〜03、規模は PC-05、品質チェーンを直さないことは第 1 段階の質問 13（入力）。窓に入る件数は計算（乗車ごとの要求の数と乗客の迎車中の長さは見込み）。サーバーで数える案は質問 18 で確認済み。評価の間隔、送り直さない決まり、呼び出しとチケットの送り分け、後から届いた裏の記録での除き直しは推定（質問 19・26 は回答なし）。回の始めのしきい値は計算
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: architecture
question: NFR-01〜03 の SLO のバーンレートのアラート（1 時間と 5 分、6 時間と 30 分の呼び出し、3 日と 6 時間のチケット）を、どこでどう数えて知らせるか
addresses:
- DRV-27
- DRV-01
- DRV-02
- DRV-03
- FND-20
- FND-24
options:
- name: サーバーが毎分、NFR-01〜03 のアラートの表に従って Turso の記録から数え、条件を満たしたら DEC-17 の知らせの道でチャットに送る。SLI-01 はサーバーの応答を操作とアカウントの種類ごとに 1 分ごとに数えて書き、SLI-02 は表示の記録（FR-54）を、SLI-03 は毎分 0 秒に行って書く確かめを使う。呼び出しは急ぐ印を付けてすぐ送り、チケットは急がない印で送って次の毎日の結果にも載せる。後から届いた裏の記録でその間の確かめを除き直し、条件が外れれば外れたと送る。サーバーが数えられないもの（アプリが止まったとき、Turso に届かないか遅くて記録を読み書きできないとき、アプリに届く前に入口が返した 5xx と 429）は DEC-17 の一つ目の規則が見る（5xx と 429 は入口とアプリを分けずに数えるので、Turso に届かないときにアプリが返す 503 も入る）
  effect: NFR-01〜03 の条件（テスト用アカウントを除くことを含む）をそのまま作れる。手元でも同じに動き、時計を差し替えて CI で確かめられる。アラートと SLI-03 の毎日の値が同じ規則（ドメインの一つの計算）から出る
  cost: 窓の計算と 1 分ごとの記録を作る。SLI-01 のアラートは入口ではなくサーバーで数えるので、入口だけで起きた失敗は一つ目の規則に任せる。サーバーが止まるか Turso に届かないとアラートも止まる（同じく一つ目の規則が見る）
- name: Cloud Monitoring のログの指標とアラートの規則（9 件）にする。SLI-01 は入口のログ、SLI-02・03 はサーバーが出す構造化ログから
  effect: 窓の計算を作らずに済む。SLI-01 を入口で数えられ、サーバーが止まっても動く
  cost: 規則 9 件とログの指標の費用（未定の値）。入口のログにはアカウントの種類がなく、SLI-01 でテスト用アカウントを除けない（NFR-01 の条件と違う）。手元で動かず、CI で確かめられない。毎日の SLI と定義が二つになり、値がずれうる
- name: 先送りを続ける（測るための記録と毎日の集計だけを作る）
  effect: 手間と費用がない
  cost: 第 1 段階の質問 13（NFR の量を受け入れ、品質チェーンを直さない）に反し、NFR-01〜03 のアラートがない。SLI-03 のアラートはこの規模でも位置が止まったことを見分ける（計算）
chosen: サーバーが毎分、NFR-01〜03 のアラートの表に従って Turso の記録から数え、条件を満たしたら DEC-17 の知らせの道でチャットに送る。SLI-01 はサーバーの応答を操作とアカウントの種類ごとに 1 分ごとに数えて書き、SLI-02 は表示の記録（FR-54）を、SLI-03 は毎分 0 秒に行って書く確かめを使う。呼び出しは急ぐ印を付けてすぐ送り、チケットは急がない印で送って次の毎日の結果にも載せる。後から届いた裏の記録でその間の確かめを除き直し、条件が外れれば外れたと送る。サーバーが数えられないもの（アプリが止まったとき、Turso に届かないか遅くて記録を読み書きできないとき、アプリに届く前に入口が返した 5xx と 429）は DEC-17 の一つ目の規則が見る（5xx と 429 は入口とアプリを分けずに数えるので、Turso に届かないときにアプリが返す 503 も入る）
rationale: 先送りの見直しの条件（品質チェーンが第 1 段階の課題 2 に答えたとき）は、第 1 段階の質問 13 で満たされた。答えは「NFR の量を受け入れて進み、品質チェーンは直さない」なので、NFR-01〜03 のアラートは今の形のまま求められ、案 3 はこれに反する。前の版は三つのアラートをまとめて「知らせが出ないか、1 件の失敗で出て何も見分けない」としたが、SLI ごとに数えると違った（計算）。SLI-03 は 1 時間に 62〜75 回の確かめがあり、位置の送信が止まったことを見分ける。SLI-01 は 1〜3 件のサーバーのエラーで鳴り、FR-36 の知らせと重なる。SLI-02 は、ふつうの乗車だけなら窓が N_alert_min に届かず鳴らない。案 1 と案 2 では、DRV-18（1）で案 1 が勝つ（手元でも同じに動く）。DRV-26（2）でも、規則の費用がなく、アラートの表を引数にした一つの計算で 9 件を作れる案 1 が勝つ。案 2 は、テスト用アカウントを除けないので NFR-01 の条件も満たさない。利用者は案 1 を選んだ（質問 18）。版 2 は「サーバーが数えられないもの」から Turso に届かないときを落としていた。数えも評価も二重に送らないための条件付きの書き込みも Turso で行うので、Turso に届かなければアラートは動かない。そのときは一つ目の規則が知らせる（第 3 段階の DEC-54。FND-20）。裏に回った時刻が遅れて届くと、それまでの確かめは古いと記録されるので、届いたときに除き直す（FND-24）
rejected:
- option: Cloud Monitoring のログの指標とアラートの規則（9 件）にする。SLI-01 は入口のログ、SLI-02・03 はサーバーが出す構造化ログから
  reason: DRV-18 と DRV-26 で負ける。入口のログではテスト用アカウントを除けず、NFR-01 の条件と違う
- option: 先送りを続ける（測るための記録と毎日の集計だけを作る）
  reason: 第 1 段階の質問 13 の決めに反する。SLI-03 のアラートはこの規模でも位置が止まったことを見分ける（DRV-03）
gains:
- NFR-01〜03 のアラートが、規則の費用なしに条件どおり動く
- 位置の送信が止まったとき（SLI-03）に、デモの最中に知らせが届く
- アラートと SLI-03 の毎日の値が同じ規則（ドメインの一つの計算）から出る（DRV-27。毎日の値は DEC-16 の確かめ直し）
costs:
- 窓の計算、1 分ごとの数、毎分の確かめを作る（一人の量に足される）
- SLI-01 のアラートは入口ではなくサーバーで数える。入口だけで起きた失敗は DEC-17 の一つ目の規則が粗く見る
- インスタンスが入れ替わると、その分の 1 分の数が落ちうる
- Turso に届かないときは数えも評価もできない（一つ目の規則が見る）
- NFR-02 のアラートは、ふつうの乗車だけなら鳴らない。NFR-01 のアラートは FR-36 の知らせと重なる（品質チェーンは直さないと決まった）
sensitive_points:
- 評価の間隔（1 分。いちばん短い窓 5 分を見分けられる細かさ）
- 表示の記録（FR-54）は通信が切れている間ブラウザに残るので遅れて届き、短い窓に間に合わない分は次の評価で入る
- 二つのインスタンスが重なったとき、確かめは参加者と分ごとに一つ、アラートは一度だけになること（条件付きの書き込み。DEC-04 と同じやり方）。1 分ごとの数はインスタンスごとに書いて足し合わせる
- 裏に回った時刻が遅れて届くこと（届くまでの確かめは古いと記録され、呼び出しが鳴りうる。届いたら除き直し、条件が外れれば外れたと送る）
- 回の始めは窓が回の分しか埋まらないので、少ない古い確かめで鳴る（SLI-03 の 6 時間と 30 分の呼び出しは、回の始めから 10 分の後に位置が止まると 5 回、30 分の後で 13 回、60 分の後で 26 回。1 時間と 5 分は 26 回、44 回、44 回。チケットは 1 回、2 回、4 回。ドライバー 1 人の確かめで、窓を毎分滑らせて計算）
trade_offs:
- with: DRV-26
  note: 窓の計算と記録を作る。規則の費用は増えない
- with: DRV-27
  note: SLI-01 のアラートはサーバーの数で、毎日の SLI-01（入口のログ）とずれうる。ずれるのは入口だけで起きた失敗で、一つ目の規則が見る。SLI-03 はサーバーが確かめられなかった分がアラートに入らず、毎日の値（DEC-16 の確かめ直し）には入る
assumptions:
- 呼び出しとチケットは同じチャットに送り、印で分ける。チケットの仕組みは持たない（PC-04）
- サーバーはデモの回にしか動かず、デモの回の外には出来事がない。品質チェーンも NFR-01〜03 の版 2 でアラートの条件から「デモの回の外では呼び出しをチケットに変える」を外した（品質チェーンへの回答の設計 1-1）
- 窓に入る件数は PC-05 と、乗車ごとの要求の数と乗客の迎車中の長さの見込みによる（計算。最初のデモの前の確かめで数えて見直す）
- NFR-02 のアラートは、この規模では鳴らなくても条件どおりに作る（一つの計算で 9 件を作るので手間は小さい）
depends_on:
- DEC-17
- DEC-16
- DEC-08
- DEC-02
parameters:
- name: アラートの評価の間隔
  value: 1 分（毎分 0 秒。SLI-03 の確かめと同時）
  basis: SLI-01 の数え方（1 分ごと）、SLI-03 の確かめ（毎分 0 秒）、いちばん短い窓（5 分）を見分ける細かさ
- name: 同じアラートの送り直し
  value: 条件が続く間は送り直さず、外れたら外れたと送る
  basis: 提案。一人の運用者に同じ知らせを毎分送らない
debt: null
deferred: false
revisit_when: null
as_is: new
