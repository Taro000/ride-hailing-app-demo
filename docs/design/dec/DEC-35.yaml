chosen: 先送りする。測るための記録と毎日の集計（DEC-16、DEC-05）は作り、アラートの規則は作らない
rationale: 案 2 は作っても、この規模では応答が良くならない。主な要求の応答はこの決定に頼っていない（作っても知らせが出ない）。記録と集計は作るので、品質チェーンが第 1 段階の課題 2（この段の課題 4）に答えてから足しても、保存した記録と公開したインタフェースは変わらない。先送りの条件を満たす
