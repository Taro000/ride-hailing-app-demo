id: DEC-08
title: Turso 一つに置き、状態と履歴を一つのトランザクションで書く
status: draft
version: 1
basis: inferred
basis_note: Turso は TC-06（入力）。書く単位と持ち主の規則は提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: データをどこに置き、どの単位で書くか
addresses:
- DRV-31
- DRV-04
- DRV-05
- DRV-13
- DRV-27
- DRV-18
options:
- name: Turso のデータベース一つに置く。表ごとに書くモジュールを一つに決め、状態と履歴、お金の記録とその履歴、管理の操作とその記録を、それぞれ一つのトランザクションで書く。履歴、支払いの出来事、管理の操作の記録、突き合わせの結果は追記だけ
  effect: 片方だけが残ることがない。手元でも libSQL で同じ形
  cost: 一つのデータベースが一つの障害の単位
- name: 個人情報の表と、そのほかの表を別のデータベースに分ける
  effect: 個人情報の範囲を狭められる
  cost: データベースをまたぐトランザクションがなく、状態の変化と履歴を一度に書けない
chosen: Turso のデータベース一つに置く。表ごとに書くモジュールを一つに決め、状態と履歴、お金の記録とその履歴、管理の操作とその記録を、それぞれ一つのトランザクションで書く。履歴、支払いの出来事、管理の操作の記録、突き合わせの結果は追記だけ
rationale: 原則 DRV-31 は、状態を変えたら必ず履歴を残し、片方だけが残らないことを求め、一つのトランザクションでしか確実に満たせない。TC-06（DRV-18）の Turso と手元の libSQL で同じ形になる。個人情報の範囲は DEC-15 と権限で狭め、DRV-21 を守る
rejected:
- option: 個人情報の表と、そのほかの表を別のデータベースに分ける
  reason: DRV-27 と DRV-31 を満たさない
gains:
- 状態と履歴が必ずそろう（NFR-05）
- お金の記録とその履歴が必ずそろう
costs:
- Turso の障害でシステム全体が止まる（Turso の約束は入力にない）
sensitive_points:
- 一つのトランザクションに入れる範囲（第 3 段階で実体ごとに決める）
trade_offs:
- with: DRV-01
  note: Turso の障害がそのまま失敗になる
assumptions:
- libSQL のクライアントでトランザクションを使える
depends_on:
- DEC-01
