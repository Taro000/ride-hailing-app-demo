id: DEC-08
title: Turso 一つに置き、状態と履歴を一つのトランザクションで書く
status: draft
version: 2
basis: inferred
basis_note: Turso は TC-06（入力）。保管の振る舞いは Turso の文書。書く単位、トランザクションの決まり、持ち主の規則は提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: データをどこに置き、どの単位で書くか
addresses:
- DRV-31
- DRV-04
- DRV-05
- DRV-13
- DRV-27
- DRV-18
- DRV-02
- DRV-03
options:
- name: Turso のデータベース一つに置く。表ごとに書くモジュールを一つに決め、状態と履歴、お金の記録とその履歴、管理の操作とその記録を、それぞれ一つのトランザクションで書く。トランザクションは外部の呼び出しをまたがず、短く書く。履歴、支払いの出来事、管理の操作の記録、突き合わせの結果は追記だけ
  effect: 片方だけが残ることがない。書き込みが外部の呼び出しを待たない。手元でも libSQL で同じ形
  cost: 一つのデータベースが一つの障害の単位。お金の操作は三つに分けて書く
- name: 個人情報の表と、そのほかの表を別のデータベースに分ける
  effect: 個人情報の範囲を狭められる
  cost: データベースをまたぐトランザクションがなく、状態の変化と履歴を一度に書けない
chosen: Turso のデータベース一つに置く。表ごとに書くモジュールを一つに決め、状態と履歴、お金の記録とその履歴、管理の操作とその記録を、それぞれ一つのトランザクションで書く。トランザクションは外部の呼び出しをまたがず、短く書く。履歴、支払いの出来事、管理の操作の記録、突き合わせの結果は追記だけ
rationale: 原則 DRV-31 は、状態を変えたら必ず履歴を残し、片方だけが残らないことを求め、一つのトランザクションでしか確実に満たせない。TC-06（DRV-18）の Turso と手元の libSQL で同じ形になる。個人情報の範囲は DEC-15 と権限で狭め、DRV-21 を守る。Turso（SQLite）は書き手が一つで、書くトランザクションの間ほかの書き込みを待たせるので、Stripe の呼び出し（最大 2.5 秒）をまたぐと位置と状態の変化の書き込みが止まる（DRV-02、DRV-03）。そのためトランザクションは外部の呼び出しをまたがず、お金の操作は、操作キーと処理中を書く、呼ぶ、結果と状態と履歴を書く、の三つに分ける（DEC-12。FND-15）
rejected:
- option: 個人情報の表と、そのほかの表を別のデータベースに分ける
  reason: DRV-27 と DRV-31 を満たさない
gains:
- 状態と履歴が必ずそろう（NFR-05）
- お金の記録とその履歴が必ずそろう
- 位置と状態の書き込みが外部の呼び出しを待たない
costs:
- Turso の障害でシステム全体が止まる（Turso の約束は入力にない）
sensitive_points:
- 一つのトランザクションに入れる範囲（第 3 段階で実体ごとに決める）
- 書くトランザクションの長さ（書き手が一つなので、長いと位置と状態の書き込みが待つ）
trade_offs:
- with: DRV-01
  note: Turso の障害がそのまま失敗になる
assumptions:
- libSQL のクライアントでトランザクションを使える
- Turso の無料の枠では、10 日使われないデータベースは保管に回る。データは残り、turso group unarchive で戻す（Turso の文書）。期間の間は毎日の処理が毎日使うので保管に回らない。問い合わせで自動で戻るかは文書になく、手で戻す前提にする（DEC-27、ELM-22）
depends_on:
- DEC-01
