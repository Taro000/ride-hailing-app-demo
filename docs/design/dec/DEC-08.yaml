id: DEC-08
title: 依頼の状態はサーバーだけが条件つきの書き込みで変え、端末の操作は一つずつ冪等にする
status: active
basis: inferred
basis_note: 依頼の状態と割り当てを一つに保ち、途切れた操作を失わず二重にもしないことは QR-02、QR-03、QR-17（入力）。状態を決めるのはサーバーだけであることは DRV-31（入力）。仕組みは推定
premises: [OPF-01]
stage: architecture
question: 操作が重なっても、通信が途切れても、サーバーが止まって再開しても、一つの依頼の状態と割り当てを一つに保つには
addresses: [DRV-02, DRV-31, DRV-03, DRV-01]
options:
  - name: サーバーだけが依頼を書き、状態を変えるたびに今の状態を条件にして一つの取引で書き、端末の状態を変える操作には利用者の一回の操作ごとの冪等キーを付ける
    effect: 重なった操作は先に書けた一つだけが通り、送り直した操作は一度目の結果を返す
    cost: どの操作にもキーと、同じキーの結果を返す仕組みが要る
  - name: 依頼ごとの状態をサーバーのメモリで動かし、ときどきデータベースに写す
    effect: 一つのインスタンスの中では速く、書き込みが少ない
    cost: インスタンスが落ちると写す前の状態を失い、インスタンスが二つになると状態が分かれる
  - name: 端末がそれぞれ状態を持ち、互いに合わせる
    effect: つながっていない間も操作を進められる
    cost: 二つの端末が別の状態を決めうる
chosen: サーバーだけが依頼を書き、状態を変えるたびに今の状態を条件にして一つの取引で書き、端末の状態を変える操作には利用者の一回の操作ごとの冪等キーを付ける
rationale: 二つ目は止まった後に状態を失い（QR-17）、三つ目は端末が状態を決めて DRV-31 を破るため、DRV-02 を満たすのは一つ目だけ。依頼とその割り当てを書くのは ELM-03 だけで、状態の変化は今の状態を条件にした書き込みと出来事の記録（DEC-06）を一つの取引で行う。重なった操作は先に書けたものが通り、後のものは書かずに今の状態を受け取る（FR-21）。端末から状態を変えるどの操作（依頼、取り消し、許諾、乗車の開始、到着の確認、決済、降りる場所の変更、不在として終える、評価）も冪等にし、キーは利用者の一回の操作を覆う。キーは端末が操作のときに作り、答えを受けるまで同じキーで送り直し、同じキーの二度目は一度目の結果を返す。端末は答えを受けるまで送っていることを示し、つなぎ直したら今の状態を受け直す（QR-02）。他の要素への呼び出しをまたぐ取引は作らない（お金の操作は DEC-10）。呼び出しの時間切れは、端末が答えを待つ時間をサーバーがその操作に答える期限より長くし、その期限を、中で外部のサービスを待つ時間とやり直しの和より長くする。操作ごとのキー、エラーの決まりとやり直しは第 3 段階、値は第 3 段階か第 4 段階が決める
rejected:
  - option: 依頼ごとの状態をサーバーのメモリで動かし、ときどきデータベースに写す
    reason: 止まると写す前の状態を失い、QR-17 と DRV-02 を満たさない
  - option: 端末がそれぞれ状態を持ち、互いに合わせる
    reason: 端末が依頼の状態を決め、DRV-31 を破る
gains:
  - 許諾と取り消しが重なっても、割り当ては一つに定まる
  - 途切れて送り直した操作が二重にならない
costs:
  - 端末とサーバーの両方に、キーを作り、同じキーの結果を返す手間がかかる
sensitive_points: []
trade_offs:
  - with: DRV-03
    note: 途切れた操作は答えを受けるまで同じキーで送り直すため、相手に示すまでが延びうる。途切れたときは失わないことを先にする（品質チェーンが QR-02 と QR-06 に書いた扱い）
assumptions: []
depends_on: [DEC-01]
parameters: []
debt: null
as_is: new
