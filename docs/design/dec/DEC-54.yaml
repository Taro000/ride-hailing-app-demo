id: DEC-54
title: 知らせの形と一つ目の規則の条件
status: draft
version: 1
basis: inferred
basis_note: DEC-17（一つ目の規則の条件の形を第 3 段階に任せた）、Cloud Monitoring の指標の一覧（ラベル、60 秒ごと、120 秒の遅れ）、FND-20 の論点は入力。知らせの形と条件の値は推定
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: エンジニアへの知らせをどの形で送り、Cloud Monitoring の一つ目の規則をどんな条件にするか
addresses:
- IFC-17
- IFC-19
- DEC-17
- DEC-35
- FND-20
- FR-36
- DRV-28
- DRV-01
options:
- name: 中立の知らせの形（種類、急ぎか、件数、窓、トレース ID の例、依頼 ID、知らせの ID）。記録を書けなくても先に送る。一つ目の規則は 5xx と 429 を 5 分で 5 件以上か、インスタンスの指標が 10 分ないとき
  effect: チャットの種類が決まっても包みだけを変える。Turso に届かないときも、アプリが返す 503 を一つ目の規則が数えるので知らせが届く
  cost: サーバーの知らせと一つ目の規則が同じ出来事で二度鳴りうる
- name: 一つ目の規則を入口だけで起きた失敗に絞る
  effect: 二度鳴らない
  cost: Cloud Run の指標のラベル（response_code、response_code_class、route は空）では入口とアプリの応答を分けられない（Cloud Monitoring の指標の一覧）
- name: 記録を書けたときだけ知らせる
  effect: 記録と知らせが必ずそろう
  cost: Turso に届かないとき何も届かない（FND-20）
chosen: '中立の知らせの形（種類、急ぎか、件数、窓、トレース ID の例、依頼 ID、知らせの ID）。記録を書けなくても先に送る。一つ目の規則は 5xx と 429 を 5 分で 5 件以上か、インスタンスの指標が 10 分ないとき。知らせの種類: server_error、external_failure、client_error、slo_burn（page か ticket。DEC-35）、reconciliation_mismatch、money_error（NFR-07）、assignment_violation（NFR-09）、daily_result、job_failed（ELM-14）、service_left_running。個人情報を持たず、ID と件数だけ'
rationale: DEC-17 は一つ目の規則の条件の形を第 3 段階に任せた。指標で入口とアプリを分けられないので、条件はどちらも数える。その結果、FND-20 の「Turso に届かないときに知らせる道がない」のうち、デモの回の間の知らせはこの段で閉じる（SLI-03 の数え方は第 2 段階）
rejected:
- option: 一つ目の規則を入口だけに絞る
  reason: 指標で分けられない
- option: 記録を書けたときだけ知らせる
  reason: Turso の障害で知らせが止まる
gains:
- Turso に届かないときも 4〜5 分で知らせが届く（遅延の予算）
costs:
- 二度鳴ることがある（一人の運用者には読めば分かる）
sensitive_points:
- 5 分で 5 件（少ないと一時の誤りで鳴り、多いと Turso の障害で遅れる）
trade_offs:
- with: DRV-26
  note: 規則の費用は増えない（規則の数は二つのまま）
assumptions:
- Cloud Monitoring の指標は 60 秒ごとに取られ、最大 120 秒遅れて見える（Cloud Monitoring の指標の一覧）
depends_on:
- DEC-17
- DEC-35
parameters:
- name: 一つ目の規則（a）
  value: 5xx か 429 が 5 分で 5 件以上
  basis: Turso に届かないと位置の送信だけで 1 分に 12 件の 503 が出るので、30 秒ほどで超える。ふだんの一時の誤り 1〜2 件では鳴らない
- name: 一つ目の規則（b）
  value: インスタンスの数の指標が 10 分届かない
  basis: 最小 1 のインスタンスは 60 秒ごとに指標を出す。止まって入れ替わらないときを拾う
- name: 知らせをまとめる間隔
  value: 1 分（DEC-17 のまま）
  basis: NFR-33 の 5 分の内
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
