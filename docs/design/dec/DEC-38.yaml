id: DEC-38
title: 額は円の整数と通貨の符号で表し、端数を丸めるのは料金を求めるときの一度だけにする
status: active
basis: inferred
basis_note: インタフェースが見せる額の約束事は、第 3 段階の確定の種類（推定）。料金が円で、市場が一つであることは CON-08 と CON-01（入力）。料金を模擬の運賃表で求めることは QR-61（入力）で、その中の丸め方は運賃表の決まりとして第 4 段階が料金を求めるモジュールで決める
premises: [CON-01, CON-08]
stage: high-level-design
question: インタフェース、データ、EXT-01 への受け渡しで額をどう表し、どこで丸めるか
addresses: [DRV-07, DRV-31, SLI-11, SLI-12]
options:
  - name: "{ amount, currency } の形で、amount は円の整数、currency は JPY。丸めるのは料金を求めるときの一度だけ"
    effect: 押さえた額、示した額、請求した額、解いた額が整数の足し引きでそろい、EXT-01 にもそのまま渡せる
    cost: 将来ほかの通貨を扱うときは、最小の単位を通貨ごとに決める
  - name: 額を小数の数で表す
    effect: 書き方が短い
    cost: 浮動小数点の誤差で、示した額と請求した額がずれうる
chosen: "額は { amount, currency } の形で表し、amount は円の整数、currency は JPY だけ（市場は一つ、CON-08）。小数と浮動小数点は使わない。端数を丸めるのは料金を求めるとき（模擬の運賃表の決まり、QR-61、第 4 段階）の一度だけで、ほかの所は確定額、CON-08 の料金、押さえた額、請求した額、解いた額、返金できる残りの額の整数の足し引きだけを行い、求め直さない。EXT-01 に渡す額も円の整数（円は小数のない通貨）"
rationale: 二つ目は浮動小数点の誤差で、SLI-11 が数える示した額と請求した額の一致を崩しうる。一つ目は、整数だけを足し引きするので額は一度決まれば変わらず（DRV-07）、決めるのはサーバーの料金を求める所だけ（DRV-31）。通貨の符号を持つのは、EXT-01 に渡す形と同じにし、額を読むどの所も通貨を取り違えないため
rejected:
  - option: 額を小数の数で表す
    reason: 浮動小数点の誤差で示した額と請求した額がずれうり、DRV-07 と SLI-11 を弱める
gains:
  - 押さえた額、示した額、請求した額、解いた額が整数でそろう
costs:
  - ほかの通貨を加えるときに最小の単位を決め直す
