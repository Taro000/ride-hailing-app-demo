id: DEC-38
title: エラーの形
status: draft
version: 1
basis: inferred
basis_note: RFC 9457 は標準。interfaces.md のエラーの決まり（変わらない符号、人向けの文、要求の ID）と FR-37 AC3（エラーの応答にトレース ID）は入力。形の選び方は推定（質問 3 は回答なし）
needs_agreement: false
approver_candidates: []
stage: high-level-design
question: すべてのインタフェースで、エラーをどの形で返すか
addresses:
- IFC-01
- IFC-02
- IFC-03
- IFC-04
- IFC-05
- IFC-06
- IFC-07
- DRV-28
options:
- name: RFC 9457 の問題の詳細に code、traceId、errors を足す
  effect: 標準の content type（application/problem+json）で、プログラム向けの変わらない符号、人向けの文、トレース ID、欄ごとの誤りを一つの形で返す
  cost: 拡張の欄を決めて守る
- name: 独自の {code, message, traceId, details}
  effect: 同じ中身を返せる
  cost: 標準の形ではなく、道具が読めない
- name: HTTP の状態の符号と文だけ
  effect: 作る量が最も少ない
  cost: 同じ 409 の中の違い（間に合わなかった、取り消された）を画面が見分けられない
chosen: 'RFC 9457 の問題の詳細に code、traceId、errors を足す。形: {type, title, status, code, detail, traceId, errors?, retryAfterSeconds?}。title と detail は日本語で個人情報を含めない。code は UPPER_SNAKE_CASE。429 と 503 には Retry-After の見出しも付ける。符号の一覧は packages/contracts に置き、画面はそこの文を示す（DEC-46）'
rationale: 画面がエラーの場合ごとに違う扱いをする（interfaces.md のエラーの決まり）には変わらない符号が要る。トレース ID は FR-37 AC3 の求め。標準の形は OpenAPI と道具がそのまま扱える
rejected:
- option: 独自の {code, message, traceId, details}
  reason: 中身は同じで、標準でない分だけ道具の助けを失う
- option: HTTP の状態の符号と文だけ
  reason: 画面が場合を見分けられず、送り直してはいけないものを送り直す
gains:
- どのインタフェースも同じ形で誤りを返す
- 符号の一覧（packages/contracts）を画面とサーバーが共有する
costs:
- 拡張の欄（code、traceId、errors、retryAfterSeconds）を守る
sensitive_points:
- code を変えないこと（変えると画面の扱いが変わる）
trade_offs: []
assumptions:
- type は urn:ride-hailing-demo:problem:<code の小文字>（参照できない URI でよい。RFC 9457）
depends_on:
- DEC-26
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
