id: DEC-29
title: サーバーで位置の列を確かめ、疑わしい到着に印を付ける
status: draft
version: 2
basis: inferred
basis_note: 位置の偽りを扱うことは第 1 段階の質問 8 で確認済み。確かめ方と、料金を止めないことは推定（質問 10 は回答なし）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: ドライバーが端末の位置を偽って到着を知らせることに、どう備えるか
addresses:
- DRV-29
- DRV-04
- DRV-20
options:
- name: サーバーで受けた位置の列を確かめ（あり得ない速さの飛び、誤差の不自然な値、到着の位置とそれまでの道筋の食い違い）、疑わしい到着に印を付けて NFR-45 の毎日の一覧で運営・サポート担当に示す。料金は FR-25・27 の規則のまま
  effect: 偽りの多くを後から見つけられる
  cost: 一貫した偽りの道筋は見分けられない
- name: 端末の確かめ（App Attest など）
  effect: 偽りを防げる
  cost: Safari の Web アプリでは使えない
- name: 何もしない
  effect: 手間がない
  cost: DRV-29 の応答「疑わしい位置での到着を見分ける」を満たさない
chosen: サーバーで受けた位置の列を確かめ（あり得ない速さの飛び、誤差の不自然な値、到着の位置とそれまでの道筋の食い違い）、疑わしい到着に印を付けて NFR-45 の毎日の一覧で運営・サポート担当に示す。料金は FR-25・27 の規則のまま
rationale: TC-09（DRV-20、交渉できない）のもとでは端末を確かめる手段がなく、見分けて後から見つけるところまでが道（第 1 段階の実現の判定）。料金の扱いは品質チェーンが決めた。疑わしい印の付いた到着にも規則どおりに請求し、運営・サポート担当が毎日の一覧（NFR-45 版 2。印と、ドライバーごとの疑わしい到着の件数を示す）で見て、偽りと判断したら返金する（QR-49 版 3、FR-50。課題 2 は決着）。自動で無料にすると、位置の誤差で誤って印が付いたとき、ドライバーが正しい料金を失い取り戻す手段がないため（品質チェーンへの回答の設計 2-2）
rejected:
- option: 端末の確かめ（App Attest など）
  reason: DRV-20 に反する
- option: 何もしない
  reason: DRV-29 を満たさない
gains:
- 疑わしい到着を後から見つけられる
costs:
- 確かめの規則を作る手間
sensitive_points:
- 疑わしいとみなす境目（速さ、誤差）
trade_offs:
- with: DRV-08
  note: 建物の近くなどで誤差が大きい正しい到着も疑わしく見えうる
assumptions: []
depends_on:
- DEC-14
- DEC-15
parameters: []
debt:
  what: 一貫した偽りの道筋は見分けられない
  why_accepted: Safari の Web アプリでは端末を確かめられない（DRV-20）
  repay_when: ネイティブアプリを考えるとき
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 疑わしい到着の料金の扱い（規則どおりに請求し、担当が毎日の一覧で見て偽りなら返金する）を根拠に書き、品質チェーンへの課題 2 を決着にした
  reason: 品質チェーンの再実行（QR-49 版 3、NFR-45 版 2。回答の設計 2-2）と、第 1 段階の 3 回目の再実行（DRV-29 版 2、DRV-04 版 4）に追随した（第 2 段階の再実行、4 回目）
