id: DEC-43
title: ログインのセッション
status: draft
version: 2
basis: inferred
basis_note: DEC-20（クッキーのセッション、パスキー、送り元の確かめ）、DEC-06（決まった形の URL）、公開のサフィックスの一覧（*.run.app）は入力。セッションの長さ、最初の役割のアカウントとドライバーの初回の設定の作り方は推定（質問 3・4 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: ログインの状態をどう持ち、どれだけ保ち、どう切るか
addresses:
- IFC-01
- DRV-29
- DRV-25
- DEC-20
options:
- name: "サーバーに置くセッションと __Host- のクッキー（HttpOnly、Secure、SameSite=Strict）。状態を変える要求は Origin を確かめる。クッキーの名前は __Host-rh_session。最初の運営・エンジニアのアカウントは、役割のアカウントが一つもないときだけ、Secret Manager の一度だけの秘密で作る（IFC-01 staff-bootstrap）。乗客とドライバーのアカウントは運営・サポート担当が作り（招待制。乗客が自分で作る入口はない）、本人が一度だけ使える設定の符号でパスワードを決める（管理者はパスワードを知らない）。符号は設定を済ませた後も出し直せ、出し直すと前の符号は使えず、新しい符号でパスワードを決め直すと前のパスワードは使えず、そのアカウントのほかのセッションを終える（パスワードの再設定を兼ねる）"
  effect: ログアウトと停止ですぐ切れる。サービスの URL に結び付く（DEC-06）
  cost: セッションの表を持つ
- name: ブラウザに持たせる署名付きのトークン（JWT）
  effect: サーバーの表が要らない
  cost: 期限まで切れない。保存場所によってはスクリプトから読める
- name: SameSite=Lax のクッキー
  effect: 外のリンクから開いたときもクッキーが付く
  cost: API は同じ入口の SPA からだけ呼ぶので要らない
chosen: サーバーに置くセッションと __Host- のクッキー（HttpOnly、Secure、SameSite=Strict）。状態を変える要求は Origin を確かめる。クッキーの名前は __Host-rh_session。最初の運営・エンジニアのアカウントは、役割のアカウントが一つもないときだけ、Secret Manager の一度だけの秘密で作る（IFC-01 staff-bootstrap）。乗客とドライバーのアカウントは運営・サポート担当が作り（招待制。乗客が自分で作る入口はない）、本人が一度だけ使える設定の符号でパスワードを決める（管理者はパスワードを知らない）。符号は設定を済ませた後も出し直せ、出し直すと前の符号は使えず、新しい符号でパスワードを決め直すと前のパスワードは使えず、そのアカウントのほかのセッションを終える（パスワードの再設定を兼ねる）
rationale: DEC-20 のクッキーのセッション。run.app は公開のサフィックスの一覧に *.run.app として載る（publicsuffix.org、2026-11-03）ので、サービスのホスト名がそのまま一つのサイトになり、同じ地域のほかの Cloud Run のサービスは別のサイトになる。Strict と __Host- でほかのサイトからの要求とクッキーの書き換えを防げる
rejected:
- option: "ブラウザに持たせる署名付きのトークン（JWT）"
  reason: ログアウトと停止ですぐ切れない
- option: SameSite=Lax のクッキー
  reason: 広げる理由がない
gains:
- ログアウト、パスワードの変更、停止ですぐ切れる
costs:
- 要求ごとにセッションを一度読む（Turso 1 回）
sensitive_points:
- セッションの長さ（短いと参加者が回の途中でログインし直す）
trade_offs:
- with: DRV-02
  note: セッションの読み出しが手配の確定の最悪に 0.1 秒足される（遅延の予算）
assumptions:
- パスキーの RP ID はサービスのホスト名（DEC-20、DEC-06）
depends_on:
- DEC-20
- DEC-06
parameters:
- name: 乗客とドライバーのセッション
  value: 最後に使ってから 24 時間、長くても 7 日
  basis: デモの回（3 時間）とデモ（1〜2 日）の間にログインし直さない
- name: 運営とエンジニアのセッション
  value: 最後に使ってから 1 時間、長くても 8 時間。ログインごとにパスキー
  basis: 役割の操作の重さ（DEC-20）
- name: パスワードの長さ
  value: 12 文字以上
  basis: 提案（NIST SP 800-63B の考え方）
- name: ドライバーの設定の符号
  value: 英数 10 文字、24 時間、一度だけ
  basis: 運営・サポート担当が直接渡す
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "乗客のアカウントも運営・サポート担当が作り、乗客もドライバーも設定の符号でパスワードを決める形にした。符号は設定の後も出し直せ、決め直すとほかのセッションを終える。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。品質チェーンの再実行（FR-01 版 3、FR-48 版 2。品質チェーン第 2 段階の質問 20）、第 2 段階の DEC-20 版 4"
