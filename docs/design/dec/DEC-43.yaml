id: DEC-43
title: 端末は操作ごとのたどる ID を X-Trace-Id で、送り直しの別を X-Resend で、ELM-03 は要求ごとの ID を X-Request-Id で渡し、ログのどの行も SLI と調べに要る項目を持つ
status: active
basis: inferred
basis_note: 端末が操作ごとにたどるための ID を作り、サーバーがそれを各段階と EXT-01、EXT-02 への呼び出しに引き継ぐことは DEC-19（入力）。ログを pino で一行に一つの JSON で標準出力に書き、どの行もたどる ID と第 3 段階の約束事が求める項目を持つことは POL-04（入力）。ログに個人の情報を書かないことは QR-58 と DEC-15（入力）。境界で送り直しかどうかが見えることは DRV-25（入力）。SLI-01〜SLI-06 が応えを待たずに送り直したものを一つと数えることは、それぞれの数え方の規則（入力）。ヘッダーの名前、ログの項目、送り直しの別、境界の出来事から一つの操作を作る決まりは第 3 段階の確定の種類（推定）。送り直しの別を足し、答えを受けた後の送り直しを別の操作とする決まりは FND-23 を受けた。一つの操作のどれかの要求にシステムが答えなかったか自身の誤りを返したときに GOOD に数えないことは、GOOD の定義を要求ごとに読んだもので、その読み方を QCR-07 で品質チェーンに確かめる
premises: [QCR-07]
stage: high-level-design
question: 一件の操作をたどる ID と要求の ID と送り直しの別をどのヘッダーで渡し、ELM-03 のログのどの行がどの項目を持ち、境界の SLI の一つの操作を要求からどう作るか
addresses: [DRV-24, DRV-25, DRV-29, FR-34, FR-52, SLI-01, SLI-02, SLI-03, SLI-04, SLI-05, SLI-06, FND-23]
options:
  - name: 端末が操作ごとに作るたどる ID を X-Trace-Id で、送り直しのときは前の要求に答えを受けたかを X-Resend で、ELM-03 が要求ごとに作る ID を X-Request-Id で渡し、ログのどの行も決めた項目を持つ
    effect: 送り直しを含む一つの操作を一つの ID でたどり、要求ごとの違いも見分け、答えを受ける前の送り直しと受けた後の送り直しを分けて数えられる
    cost: 端末も操作ごとに ID を作り、送り直すときに前の要求に答えを受けたかを持つ
  - name: 端末が答えを受けた後に送り直すときは、たどる ID を作り直す
    effect: 同じたどる ID の要求がそのまま SLI の一つの操作になる
    cost: 利用者の一回の操作が二つのたどる ID に分かれ、エンジニアが一件をたどるとき冪等キーでつなぎ直す
  - name: W3C Trace Context の traceparent を使う
    effect: 分散トレースの道具と同じ形
    cost: 親の span の決まりが要るが、このシステムには分散トレースの道具がなく（DEC-19 が退けた）、端末の送り直しを一つにする決まりは別に要る
chosen: 端末（ELM-01、ELM-02）は利用者の一回の操作ごとに UUID v4 のたどる ID を作り、その操作のどの要求（送り直しを含む）にも X-Trace-Id のヘッダーで付ける。ない要求（日々の呼び出し、生存確認、期限の処理）には ELM-03 が作る。端末は同じ操作を送り直すときだけ X-Resend のヘッダーを付け、前に送った要求に答えを受けていなければ no_answer、409 OPERATION_IN_PROGRESS を受けていれば in_progress、ほかの答え（500 や 503 など）を受けた後に同じ冪等キーで送り直すなら after_answer とする。ELM-03 は HTTP の要求ごとに要求の ID（ULID）を作り、X-Request-Id の応答のヘッダーと誤りの本文（DEC-35）に返す。たどる ID は、ELM-03 の中のどの段階、境界の出来事（DAT-19。X-Resend の値も写す）、たどる記録（DAT-18）、ログ、EXT-01 に作る取引の metadata（traceId と attemptId）に引き継ぐ。ELM-03 のログのどの行も、time、level、msg、env（環境の名前）、buildId、requestId、traceId、route（操作の名前で、OpenAPI の operationId）、actorKind（passenger、driver、operator、engineer、system、anonymous）、testAccount、outcome（ok、refused、client_error、dependency_failed、system_error、pending、unconfirmed）、errorCode、failureOrigin（none、system、EXT-01、EXT-02、ELM-07、ELM-04）、durationMs、rideId（依頼にかかわるとき）を持ち、名前、連絡先、場所、位置、メッセージと苦情の中身は持たない（DEC-15 の決まりを通す、QR-58）。境界の SLI（SLI-01〜SLI-06）の一つの操作は、同じたどる ID の要求のうち、X-Resend のない要求か after_answer の要求で始まり、それに続く no_answer と in_progress の要求を含む（応えを待たずに送り直したものを一つと数える規則）。その操作は、どの要求にも ELM-03 が答え（409 OPERATION_IN_PROGRESS は答えに数えない）、どの答えもシステム自身の誤り（outcome が system_error）と外部の失敗（dependency_failed、unconfirmed、pending）でなく、最後の答えがその操作の結果（受け付けない入力、確かめられなかった本人、拒否の知らせを含む）のときに GOOD で、答えのない要求か、そのような答えを一つでも含むものは GOOD でない（QCR-07）。操作は最初の要求を受けた日（Asia/Tokyo、DEC-37）に数える
rationale: 三つ目は分散トレースの道具のための形で、DEC-19 がその道具を持たないと決めており、端末の送り直しを一つにまとめる決まりは結局別に要る。二つ目は、利用者の一回の操作が答えの後に二つのたどる ID に分かれ、DRV-24 の一件のたどりを冪等キーでつなぎ直すことになる。一つ目は、送り直しても変わらないたどる ID で一件の操作を端末から EXT-01 までたどらせ（DRV-24、FR-34）、要求の ID で要求ごとの答えを見分け、X-Resend で端末が答えを受ける前の送り直しと受けた後の送り直しを分ける。SLI-01〜SLI-06 の規則が一つと数えるのは応えを待たずに送り直したものだけなので、答えを受けた後の送り直し（after_answer）は別の操作の始まりとし、500 の後に送り直して済んだ操作の誤りを数えから消さない。409 OPERATION_IN_PROGRESS は最初の要求がまだ動いていることを示すだけで操作の答えではないため、その後の送り直しは同じ操作に含める。答えのない要求と、端末が受けなかったシステム自身の誤りは、GOOD の定義の「システムが応えなかったもの」「システム自身の誤りを返したもの」を要求ごとに読み、後の送り直しが結果を受けても GOOD に数えない。規則はこの場合を述べていないので、その読み方を QCR-07 で品質チェーンに確かめ、それまでは数えが良く見えない側で数える。どちらの読み方でも境界の出来事の同じ項目から数えられる。outcome と failureOrigin は、GOOD がシステム自身の誤りと EXT-01、EXT-02 の失敗を分けて数えるために持つ。testAccount は試験用のアカウントを数えから外すため（FR-42、QR-47）
rejected:
  - option: 端末が答えを受けた後に送り直すときは、たどる ID を作り直す
    reason: 利用者の一回の操作が二つのたどる ID に分かれ、DRV-24 の一件のたどりを弱める
  - option: W3C Trace Context の traceparent を使う
    reason: 分散トレースの道具を持たない（DEC-19）ため形だけが増え、端末の送り直しをまとめる決まりは別に要る
gains:
  - 送り直しを含む一つの操作を一つの ID でたどれる
  - 答えを受ける前の送り直しだけを一つと数え、答えの後の送り直しとシステム自身の誤りを数えから消さない
  - ログの行から SLI の数え方に要る項目が分かる
costs:
  - 端末が操作ごとにたどる ID を作り、送り直しまで持ち、前の要求に答えを受けたかを添える
sensitive_points: []
trade_offs: []
assumptions:
  - 端末は、送り直す前の要求に答えを受けたかどうかを正しく知る（タイムアウトか切れた接続なら受けていない）
depends_on: [DEC-19, DEC-23, DEC-15, DEC-37]
parameters: []
