id: DEC-16
title: 保存する個人の情報はサーバーが記録した日ごとの鍵で暗号にし、鍵はデータベースの外に置き、保存期間を過ぎた日の鍵は写しとともに捨てる
status: active
basis: inferred
basis_note: 記録が写されても持ち出されても、許された人のほかには個人の情報を読めないこと（QR-36）は入力で、どう読めなくするかは QR-36 が設計に任せている。止まった後に戻すために残すものにも保存期間を過ぎた個人の情報を残さないことは、品質チェーンが QR-17 と QR-59 の競合に書いたもの（DRV-21 と DRV-02、DRV-07 の競合）。鍵を記録した日ごとに分け、保存期間を過ぎた日の鍵を写しとともに捨てて戻すための写しの中のものも読めなくするやり方は、FND-07 を受けて決めた。暗号にする置き方は推定。どの項目を暗号にするかは、第 3 段階が各データの実体の扱いの区分で決める
premises: [CON-06, TC-07]
stage: architecture
question: 記録が写されても持ち出されても、許された人のほかに個人の情報を読めないようにし、戻すために残した写しの中の保存期間を過ぎた個人の情報も読めないようにするには
addresses: [DRV-29, DRV-21, DRV-34]
options:
  - name: 名前、連絡先、顔写真、乗る場所と降りる場所、位置、操作した人などの個人の情報を、サーバーが記録した日ごとの鍵で項目ごとに暗号にして書き、鍵は秘密の置き場所（想定の本番は Secret Manager、ローカルはリポジトリとデータベースの外のファイル）に置き、保存期間を過ぎた日の鍵は日々の処理が鍵の写しとともに捨てる
    effect: データベースの写しや持ち出した結果だけでは個人の情報を読めず、鍵を捨てた日の個人の情報は、戻すために残したどの写しからも読めない
    cost: 暗号にした項目ではデータベースの中で探せず、サーバーが読み解いてから絞る。記録した日ごとに鍵を持ち、捨てる
  - name: 個人の情報を、サーバーが一つの鍵で項目ごとに暗号にして書く
    effect: データベースの写しや持ち出した結果だけでは個人の情報を読めず、鍵の扱いが簡単
    cost: 戻すために残した写しの中の、保存期間を過ぎた個人の情報は、鍵がある限り読める
  - name: データベースの置き場所の暗号に任せる
    effect: 作る手間がない
    cost: 問い合わせで取り出した結果は読めるまま写される
  - name: 暗号にせず、見られる人を権限で絞る
    effect: 作る手間がない
    cost: 写しが許された人のほかにも読める
chosen: 名前、連絡先、顔写真、乗る場所と降りる場所、位置、操作した人などの個人の情報を、サーバーが記録した日ごとの鍵で項目ごとに暗号にして書き、鍵は秘密の置き場所（想定の本番は Secret Manager、ローカルはリポジトリとデータベースの外のファイル）に置き、保存期間を過ぎた日の鍵は日々の処理が鍵の写しとともに捨てる
rationale: 三つ目はファイルと戻しの写しを守るが、問い合わせで取り出した写しを守らず、四つ目は写しを守らない。QR-36 を満たすのは一つ目と二つ目。二つ目は、Turso の時点を指定した戻しとローカルのファイルの写し（DEC-17）に残った保存期間を過ぎた個人の情報を、写しを書き換えずに読めなくする手立てがなく、QR-59 と QR-17 の扱い（DRV-21）を満たさない。一つ目は、日々の処理（DEC-18）が保存期間を過ぎた記録を FR-51 のとおりに変えた後に、その日の鍵を写しとともに捨てるので、どの写しの中のその日の個人の情報も読めなくなる。鍵の日は個人の情報を記録した日で、保存期間は記録した日から数える（QR-59）ため、写しの中のものも日々の処理と同じ日に読めなくなる。読み解けるのはサーバーだけで、読み解いたものは DEC-15 の決まりを通してだけ外へ出す。量は小さい（OPF-02、OPF-03）ため、暗号にした項目で探すときはサーバーが読み解いてから絞り、鍵は個人の情報を記録した日の分だけできる。鍵を失うとデータを読めなくなるため、鍵の写しを持ち、鍵の読み方、作り方、捨て方は第 2b 段階が決める
rejected:
  - option: 個人の情報を、サーバーが一つの鍵で項目ごとに暗号にして書く
    reason: 戻すために残した写しの中の、保存期間を過ぎた個人の情報を読めなくできず、QR-59 と QR-17 の扱い（DRV-21、交渉できない）を満たさない
  - option: データベースの置き場所の暗号に任せる
    reason: 問い合わせで取り出した写しが読めるまま残り、QR-36 を満たさない
  - option: 暗号にせず、見られる人を権限で絞る
    reason: 写しが読め、QR-36 を満たさない
gains:
  - データベースの写しや持ち出しから個人の情報が漏れない
  - 戻すために残した写しも、保存期間を過ぎた個人の情報を読ませない
costs:
  - 暗号にした項目では、データベースの中で探したり並べたりできない
  - 鍵を失うと、暗号にした個人の情報を読めなくなる
  - 記録した日ごとの鍵と、その写しを作り、保存期間を過ぎたら捨てる
sensitive_points: []
trade_offs:
  - with: DRV-24
    note: エンジニアがデータベースを直接見ても個人の情報は読めず、調査は担当者とエンジニアの画面で行う
assumptions: []
depends_on: [DEC-15, DEC-17]
parameters: []
debt: null
as_is: new
