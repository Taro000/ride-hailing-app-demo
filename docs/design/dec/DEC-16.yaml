id: DEC-16
title: 入口とアプリのログは Cloud Logging、業務の出来事は Turso に残し、URL に個人情報を入れない
status: draft
version: 4
basis: inferred
basis_note: 選んだ案と PC-04 の読み方は質問 2 で確認済み。SLO のアラートのための数えをサーバーが書くこと（DEC-35）は質問 18 で確認済み。Cloud Logging の既定の保持 30 日は確かめる前提。毎日の SLI-03 を受信と状態の記録から確かめ直すことは質問 24 で確認済み。URL の決まりは提案
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: 測定点の出来事とログをどこに残し、だれが数えるか
addresses:
- DRV-27
- DRV-28
- DRV-21
- DRV-32
- DRV-26
- DRV-18
- FND-20
- FND-24
options:
- name: 入口の要求のログは Cloud Run が書く Cloud Logging のもの。アプリのログは標準出力の構造化ログ（Cloud Run では Cloud Logging、手元では端末とファイル）。状態の履歴、表示の記録、位置の受信の記録、裏にあった時間、ブラウザのエラー、突き合わせの結果、処理の終わり、知らせの記録は Turso。SLI と毎日の監視は毎日の処理が両方を読んで数える。SLO のアラートのための数え（SLI-01 の六つの操作へのサーバーの応答の 1 分ごとの数、SLI-03 の毎分の確かめ）はサーバーが Turso に書き（DEC-35）、アラートだけに使う。毎日の SLI-03 は、毎日の処理が位置の受信の記録（受けた時刻だけ）、受付と状態の記録、裏にあった時間の記録から、毎分 0 秒の確かめを同じ規則で確かめ直して数える（使用中の区間はデモの回の開いていた間に限る。サーバーが確かめられなかった分も、受信がなければ新しくないと数え、後から届いた裏の記録も除く）。毎日の SLI-01 は入口のログから数える。URL（経路と問い合わせの文字列）には位置、連絡先、名前、場所の検索の語を入れず、要求の本文で送る
  effect: SLI-01 をアプリの前の入口で測れる。ログの保存と検索を作らずに済む。入口のログに個人情報が残らない
  cost: 置き場所が二つ。SLI-01 のテスト用アカウントの除外は、入口のログとアプリのログをトレース ID で結んで行う
- name: アプリがすべての記録とアクセスのログを Turso に書く
  effect: 置き場所が一つで、手元でも同じ
  cost: アプリに届かなかった要求が見えず、SLI-01 の測定点を満たさない
- name: 外部の監視のサービスに送る
  effect: 検索と通知がそろう
  cost: PC-04 に合わず、外部サービスが増える
chosen: 入口の要求のログは Cloud Run が書く Cloud Logging のもの。アプリのログは標準出力の構造化ログ（Cloud Run では Cloud Logging、手元では端末とファイル）。状態の履歴、表示の記録、位置の受信の記録、裏にあった時間、ブラウザのエラー、突き合わせの結果、処理の終わり、知らせの記録は Turso。SLI と毎日の監視は毎日の処理が両方を読んで数える。SLO のアラートのための数え（SLI-01 の六つの操作へのサーバーの応答の 1 分ごとの数、SLI-03 の毎分の確かめ）はサーバーが Turso に書き（DEC-35）、アラートだけに使う。毎日の SLI-03 は、毎日の処理が位置の受信の記録（受けた時刻だけ）、受付と状態の記録、裏にあった時間の記録から、毎分 0 秒の確かめを同じ規則で確かめ直して数える（使用中の区間はデモの回の開いていた間に限る。サーバーが確かめられなかった分も、受信がなければ新しくないと数え、後から届いた裏の記録も除く）。毎日の SLI-01 は入口のログから数える。URL（経路と問い合わせの文字列）には位置、連絡先、名前、場所の検索の語を入れず、要求の本文で送る
rationale: SLI-01 は「アプリの前に置く入口のログ」を求め、Cloud Run ではその入口のログが Cloud Logging に自動で残る。PC-04 の保存は Cloud Logging が担い、数えるのと知らせるのは自前で行う（質問 2 で確認済み）。既定の保持（30 日）は T_log_retention（28 日、仮）を超え、T_pii_retention を超えない（DRV-21）。入口のログは URL をそのまま残し、アプリでは伏せられないので、入口のログで DRV-32 を守る手立ては URL の決まりだけ（FND-13）。この決まりは第 3 段階の共通の約束事にする。SLO のアラートは毎分数えるので毎日の処理では間に合わず、サーバーが数えて Turso に書く（DEC-35、質問 18）。版 3 は毎日の SLI-03 をサーバーの確かめの記録から数えたので、サーバーが Turso に届かなかった分は「古い」ではなく数えから消え、位置が届いていないのに値が良く見えた（FND-20）。後から届いた裏の記録も除けなかった（FND-24）。SLI-03 の inputs は受信の記録と受付・状態の記録なので、それから同じ規則（ドメインの一つの計算）で確かめ直し、アラートと値を規則でそろえる（DRV-27。質問 24）。サーバーが確かめられなかった分の扱いは SLI-03 に書かれていないので、品質チェーンへの課題 8 にした
rejected:
- option: アプリがすべての記録とアクセスのログを Turso に書く
  reason: DRV-27 の SLI-01 の測定点を満たさない
- option: 外部の監視のサービスに送る
  reason: PC-04 に合わない
gains:
- SLI-01 をアプリの前で測れる
- ログの保存と検索を作らない
- 入口のログに個人情報が残らない
costs:
- 置き場所が二つ
- 入口のログとアプリのログを結ぶ集計の手間
- 毎日の処理が SLI-03 の確かめ直しの計算を持つ（アラートと同じドメインの計算を使う）
sensitive_points:
- 入口のログに同じトレース ID を残す見出しの形（DEC-18）
- URL に個人情報を入れないこと（第 3 段階の共通の約束事）
trade_offs:
- with: DRV-18
  note: 手元にはアプリの前の入口のログがない。SLI は本番だけで測るので足りる
- with: DRV-27
  note: SLI-03 のアラート（サーバーの確かめ）と毎日の値（確かめ直し）はずれうる。ずれるのは、サーバーが確かめられなかった分と、後から届いた裏の記録
assumptions:
- Cloud Logging の既定の保持は 30 日（確かめる）
- ログの量は少量（PC-05 の規模）
- Cloud Run の入口の要求のログは URL をそのまま残す
depends_on:
