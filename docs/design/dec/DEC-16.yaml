id: DEC-16
title: 保存する個人の情報はサーバーが鍵で暗号にし、鍵はデータベースの外に置く
status: active
basis: inferred
basis_note: 記録が写されても持ち出されても、許された人のほかには個人の情報を読めないこと（QR-36）は入力で、どう読めなくするかは QR-36 が設計に任せている。暗号にする置き方は推定。どの項目を暗号にするかは、第 3 段階が各データの実体の扱いの区分で決める
premises: [CON-06]
stage: architecture
question: 記録が写されても持ち出されても、許された人のほかに個人の情報を読めないようにするには
addresses: [DRV-29, DRV-21, DRV-34]
options:
  - name: 名前、連絡先、顔写真、乗る場所と降りる場所、位置などの個人の情報を、サーバーが項目ごとに暗号にして書き、鍵は秘密の置き場所（想定の本番は Secret Manager、ローカルはリポジトリとデータベースの外のファイル）に置く
    effect: データベースの写しや持ち出した結果だけでは、個人の情報を読めない
    cost: 暗号にした項目ではデータベースの中で探せず、サーバーが読み解いてから絞る
  - name: データベースの置き場所の暗号に任せる
    effect: 作る手間がない
    cost: 問い合わせで取り出した結果は読めるまま写される
  - name: 暗号にせず、見られる人を権限で絞る
    effect: 作る手間がない
    cost: 写しが許された人のほかにも読める
chosen: 名前、連絡先、顔写真、乗る場所と降りる場所、位置などの個人の情報を、サーバーが項目ごとに暗号にして書き、鍵は秘密の置き場所（想定の本番は Secret Manager、ローカルはリポジトリとデータベースの外のファイル）に置く
rationale: 二つ目はファイルと戻しの写しを守るが、問い合わせで取り出した写しを守らず、三つ目は写しを守らない。QR-36 を満たすのは一つ目だけ。読み解けるのはサーバーだけで、読み解いたものは DEC-15 の決まりを通してだけ外へ出す。量は小さい（OPF-02、OPF-03）ため、暗号にした項目で探すときはサーバーが読み解いてから絞る。鍵を失うとデータを読めなくなるため、鍵の写しを持ち、鍵の読み方と取り替え方は第 2b 段階が決める
rejected:
  - option: データベースの置き場所の暗号に任せる
    reason: 問い合わせで取り出した写しが読めるまま残り、QR-36 を満たさない
  - option: 暗号にせず、見られる人を権限で絞る
    reason: 写しが読め、QR-36 を満たさない
gains:
  - データベースの写しや持ち出しから個人の情報が漏れない
costs:
  - 暗号にした項目では、データベースの中で探したり並べたりできない
  - 鍵を失うと、暗号にした個人の情報を読めなくなる
sensitive_points: []
trade_offs:
  - with: DRV-24
    note: エンジニアがデータベースを直接見ても個人の情報は読めず、調査は担当者とエンジニアの画面で行う
assumptions: []
depends_on: [DEC-15, DEC-17]
parameters: []
debt: null
as_is: new
