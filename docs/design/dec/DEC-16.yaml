id: DEC-16
title: 入口とアプリのログは Cloud Logging、業務の出来事は Turso に残す
status: draft
version: 1
basis: inferred
basis_note: 選んだ案と PC-04 の読み方は質問 2 で確認済み。Cloud Logging の既定の保持 30 日は確かめる前提
needs_agreement: false
approver_candidates: []
stage: architecture
question: 測定点の出来事とログをどこに残し、だれが数えるか
addresses:
- DRV-27
- DRV-28
- DRV-21
- DRV-32
- DRV-26
- DRV-18
options:
- name: 入口の要求のログは Cloud Run が書く Cloud Logging のもの。アプリのログは標準出力の構造化ログ（Cloud Run では Cloud Logging、手元では端末とファイル）。状態の履歴、表示の記録、位置の受信の記録、裏にあった時間、ブラウザのエラー、突き合わせの結果、処理の終わり、知らせの記録は Turso。SLI と毎日の監視は毎日の処理が両方を読んで数える
  effect: SLI-01 をアプリの前の入口で測れる。ログの保存と検索を作らずに済む
  cost: 置き場所が二つ。SLI-01 のテスト用アカウントの除外は、入口のログとアプリのログをトレース ID で結んで行う
- name: アプリがすべての記録とアクセスのログを Turso に書く
  effect: 置き場所が一つで、手元でも同じ
  cost: アプリに届かなかった要求が見えず、SLI-01 の測定点を満たさない
- name: 外部の監視のサービスに送る
  effect: 検索と通知がそろう
  cost: PC-04 に合わず、外部サービスが増える
chosen: 入口の要求のログは Cloud Run が書く Cloud Logging のもの。アプリのログは標準出力の構造化ログ（Cloud Run では Cloud Logging、手元では端末とファイル）。状態の履歴、表示の記録、位置の受信の記録、裏にあった時間、ブラウザのエラー、突き合わせの結果、処理の終わり、知らせの記録は Turso。SLI と毎日の監視は毎日の処理が両方を読んで数える
rationale: SLI-01 は「アプリの前に置く入口のログ」を求め、Cloud Run ではその入口のログが Cloud Logging に自動で残る。PC-04 の保存は Cloud Logging が担い、数えるのと知らせるのは自前で行う（質問 2 で確認済み）。既定の保持（30 日）は T_log_retention（28 日、仮）を超え、T_pii_retention を超えない（DRV-21）
rejected:
- option: アプリがすべての記録とアクセスのログを Turso に書く
  reason: DRV-27 の SLI-01 の測定点を満たさない
- option: 外部の監視のサービスに送る
  reason: PC-04 に合わない
gains:
- SLI-01 をアプリの前で測れる
- ログの保存と検索を作らない
costs:
- 置き場所が二つ
- 入口のログとアプリのログを結ぶ集計の手間
sensitive_points:
- 入口のログに同じトレース ID を残す見出しの形（DEC-18）
trade_offs:
- with: DRV-18
  note: 手元にはアプリの前の入口のログがない。SLI は本番だけで測るので足りる
assumptions:
- Cloud Logging の既定の保持は 30 日（確かめる）
- ログの量は少量（質問 7 の規模）
depends_on:
- DEC-18
- DEC-05
parameters:
- name: Cloud Logging の保持
  value: 30 日
  basis: Cloud Logging の既定（確かめる）。T_log_retention（28 日）以上、T_pii_retention（3 年）以下
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
