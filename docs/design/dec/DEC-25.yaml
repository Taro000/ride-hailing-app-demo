id: DEC-25
title: 外部サービス、時計、ID を差し替える口と偽物でテストする
status: draft
version: 2
basis: inferred
basis_note: 提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: 主要な流れと外部の失敗を、実時間と本物のサービスを待たずにどう自動で確かめるか
addresses:
- DRV-15
- DRV-14
- DRV-11
- DRV-04
options:
- name: 外部のサービス（Stripe、Google Maps Platform、チャット）、時計、ID の生成を差し替える口を application に置き（DEC-26）、CI では失敗、無応答、戻った後を起こせる偽物を使う。与えた位置の列を位置の送信に流す道具を作る。画面の自動テスト（Playwright）は手元のサーバーと偽物で動かす。Stripe の流れは、デモと別のテスト環境のサンドボックスでも少数のテストを動かす
  effect: NFR-08・27 のゲートを速く安定して回せる
  cost: 偽物を本物に合わせ続ける手間
- name: いつも本物のテスト環境と地図のサービスで確かめる
  effect: 偽物が要らない
  cost: 遅く不安定で、障害と無応答を起こせない。地図の費用がかかる
- name: 通信を記録して再生する
  effect: 本物に近い
  cost: 記録が古くなると壊れやすい
chosen: 外部のサービス（Stripe、Google Maps Platform、チャット）、時計、ID の生成を差し替える口を application に置き（DEC-26）、CI では失敗、無応答、戻った後を起こせる偽物を使う。与えた位置の列を位置の送信に流す道具を作る。画面の自動テスト（Playwright）は手元のサーバーと偽物で動かす。Stripe の流れは、デモと別のテスト環境のサンドボックスでも少数のテストを動かす
rationale: DRV-15（NFR-08・27 などのゲート）と DRV-04 を、TC-05（Vitest）と TC-13（足す道具）の範囲で満たす。CI の Stripe の鍵はデモと別のサンドボックスの制限付きの鍵にし、フォークからの pull request の手順には渡さず、公開のリポジトリの CI からデモの記録に触れない（DRV-29、DEC-34）。口は application に置き、偽物も本物の包みもそれを実装する（FND-16）
rejected:
- option: いつも本物のテスト環境と地図のサービスで確かめる
  reason: DRV-15 の障害の確かめができず、DRV-26 で負ける
- option: 通信を記録して再生する
  reason: DRV-26 で負ける
gains:
- 障害と無応答を起こして確かめられる
- 実時間を待たない
costs:
- 偽物を本物に合わせ続ける手間
sensitive_points:
- 偽物と本物の振る舞いのずれ（テスト環境のテストで補う）
trade_offs: []
assumptions:
- Stripe は一つのアカウントに複数のサンドボックスを持てる
- GitHub はフォークからの pull request の手順に秘密を渡さない（既定）
depends_on:
- DEC-26
