id: DEC-25
title: 確認コードは依頼ごとにサーバーが作ってその依頼の乗客にだけ示し、サーバーが試せる回数を限って照らす
status: active
basis: inferred
basis_note: 乗客が伝えたコードをドライバーが入れることは TC-14（入力）、コードがその依頼にだけ合い、ほかの人が推し量れないことは QR-18（入力）。作り方と照らし方は推定
premises: [TC-14]
stage: architecture
question: 乗車を始める前の確認コードを、どこで作り、どこで照らすか
addresses: [DRV-19, DRV-31]
options:
  - name: 依頼ごとにサーバーが推し量れないコードを作ってその依頼の乗客にだけ示し、ドライバーが入れたコードをサーバーが照らし、合わない試みを記録して回数を限る
    effect: 他の依頼のコードや当て推量では乗車を始められない
    cost: 合わない試みが続くと、正しいコードでもしばらく始められない
  - name: 乗客ごとに決まったコードを使い回す
    effect: 乗客が覚えておける
    cost: その依頼にだけ合うコードにならない
  - name: 乗客の画面のコードをドライバーのカメラで読む
    effect: 入れ間違いがない
    cost: 乗客が伝え、ドライバーが入れる TC-14 の手順と違う
chosen: 依頼ごとにサーバーが推し量れないコードを作ってその依頼の乗客にだけ示し、ドライバーが入れたコードをサーバーが照らし、合わない試みを記録して回数を限る
rationale: 三つ目は TC-14（交渉できない）の手順と違うため外し、二つ目は QR-18 のその依頼にだけ合うことを満たさない。一つ目は乗車を始めてよいかをサーバーが決め（DRV-31）、一致と合わない試みを記録する（FR-12）。合わない試みを限るのは当て推量への備え（QR-18 の失敗のシナリオ）
rejected:
  - option: 乗客ごとに決まったコードを使い回す
    reason: その依頼にだけ合うコードにならず、QR-18 を満たさない
  - option: 乗客の画面のコードをドライバーのカメラで読む
    reason: TC-14（交渉できない）の手順と違う
gains:
  - 当て推量と他の依頼のコードでは乗車が始まらない
costs:
  - 合わない試みが続くと、しばらく乗車を始められない
sensitive_points:
  - コードの長さと、合わない試みを止めるまでの回数。短いと当て推量が通り、厳しいと入れ間違いで乗車が遅れる（値は第 4 段階、HND-13）
trade_offs: []
assumptions: []
depends_on: [DEC-08]
parameters: []
debt: null
as_is: new
