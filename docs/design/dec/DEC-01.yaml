id: DEC-01
title: 一つの配車サーバー、二つの Web アプリ、一つのデータベースに分ける
status: active
basis: inferred
basis_note: 構造は、TC-01〜TC-03、TC-07〜TC-09、PC-01、PC-03、TEAM-01、OPF-02、OPF-03（入力）から、主な設計を動かす要求に照らして推定した。どの部分の停止が配車の流れを止めるか（QR-01 の basis_note が設計に確かめを求め、DRV-01 が第 2 段階に渡した点）は、この構造で確かめた。ELM-03 と ELM-04、それを動かす ELM-08 と ELM-09 が止まると流れ全体が止まる。ELM-05 が止まると依頼の押さえ、決済、キャンセル料と不在の料金が止まる。ELM-06 が止まると場所の検索と新しい見積もりが止まるが、確定した依頼と乗車は続く（DEC-13）。ELM-07 が止まると、アプリが画面に出ていない相手への知らせだけが遅れる。ELM-02 が止まっても乗客とドライバーの流れは止まらない
premises: [TC-01, TC-02, TC-03, TC-07, TC-08, TC-09, PC-01, PC-03, TEAM-01, OPF-02, OPF-03]
stage: architecture
question: システムをどの配備の単位に分け、単位どうしは何で話し、状態はどこに置くか
addresses: [DRV-16, DRV-15, DRV-01, DRV-07, DRV-03, DRV-02, DRV-12]
options:
  - name: 一つの配車サーバー（中を機能ごとの部分に分ける）、乗客とドライバーの Web アプリ、担当者とエンジニアの Web アプリ、一つのデータベース
    effect: 状態を持つのは一つのデータベースだけで、依頼の状態、出来事、お金の操作の記録を一つの取引で書ける。Web アプリとサーバーは HTTPS の要求と応答で話し、サーバーからの変化は開いたままの流れで届ける
    cost: すべてを一緒に配備し、サーバーが止まればすべて止まる。中の部分の境は、依存の規則と CI の検査がなければ崩れる
  - name: 機能ごとに分けた複数のサービス（配車、お金、現在地、運営）
    effect: 機能ごとに配備し、止まる範囲を分けられる
    cost: サービスの間の呼び出しの失敗と整合を扱い、1 人で複数のサービスを作り、動かし、見守る
  - name: 操作ごとに呼ばれる関数と、端末からの定期的な問い合わせ
    effect: 使った分だけ払い、使わない間は止まる
    cost: 最初の呼び出しが起動を待ち、変化を相手にすぐ示すには短い間隔の問い合わせが要り、時刻で進む処理に別の仕組みが要る
chosen: 一つの配車サーバー（中を機能ごとの部分に分ける）、乗客とドライバーの Web アプリ、担当者とエンジニアの Web アプリ、一つのデータベース
rationale: 開発者 1 人と個人の費用（DRV-16）、ローカルだけで動かすこと（DRV-15）、デモの回の量（OPF-02、OPF-03）では、配備の単位を増やすほど作って見守るものが増え、得るものがない。依頼の状態とお金の記録を一つの取引で書けることが DRV-07 と DRV-02 を支え、サーバーの中で書いた直後に変化を流せることが DRV-03 を支える。DRV-12 の部分の境は、配備の単位ではなくサーバーの中の部分と依存の規則で保ち、その分け方と CI の検査は第 2b 段階が決める。参加者と運営の画面を別の Web アプリにするのは、使う端末（DEC-02、DEC-03）と、見せる機能と個人の情報の範囲（DRV-29）が分かれるため。TC-01〜TC-03 の言語、画面、サーバーの技術は、どの部分も守る
rejected:
  - option: 機能ごとに分けた複数のサービス（配車、お金、現在地、運営）
    reason: DRV-16（1 人で複数のサービスを動かす）を満たさず、依頼の状態とお金の記録が別の置き場所に分かれて DRV-07 と DRV-02 の整合が難しくなる
  - option: 操作ごとに呼ばれる関数と、端末からの定期的な問い合わせ
    reason: 起動の待ちが DRV-01 を、問い合わせの間隔が DRV-03 を弱め、時刻で進む処理（DRV-23）に別の仕組みが要る
gains:
  - 作り、試し、動かすものが一つのサーバーと一つのデータベースで済む
  - 依頼の状態、出来事、お金の操作の記録を一つの取引で書ける
  - ローカルでも想定の本番でも同じ形で動く
costs:
  - サーバーが止まれば、乗客、ドライバー、担当者、エンジニアのどの機能も止まる
  - サーバーの中の部分の境を、依存の規則と検査で守り続ける手間がかかる
sensitive_points: []
trade_offs:
  - with: DRV-12
    note: 配備の単位を分けないため、一つの機能の変更がほかに及ばないことは、サーバーの中の依存の規則と自動の試験（第 2b 段階）だけで守る
assumptions:
  - デモの回の量（OPF-02、OPF-03）は、一つのサーバーと一つのデータベースで足りる
depends_on: []
parameters: []
debt: null
as_is: new
