id: DEC-30
title: 本人の確かめは認証のライブラリを使わず、Hono の仕組みと node:crypto で作る
status: active
basis: inferred
basis_note: 本人の確かめ方（担当者が渡す設定の符号で本人がパスワードを決め、以後はアカウントの ID とパスワードとサーバーのセッションで使わせる）は DEC-14 で、設計の第 2 段階の質問 3 で確認済み。外部の認証のサービスは DEC-14 が退けた。担当者が設定の符号を直接渡すことは TC-16（入力）。作る部品の比べ方と選び方は推定
premises: [TC-03, TC-16]
stage: technical-policy
question: DEC-14 の本人の確かめ（設定の符号、パスワード、サーバーのセッション）を、どの部品で作るか（セッションをどう受け渡すかは第 3 段階の約束事で、ここでは決めない）
addresses: [DRV-28, DRV-16, DRV-15, DRV-19]
options:
  - name: 認証のライブラリを使わず、パスワードは node:crypto の scrypt で持ち、セッションはデータベースに置き、セッションの受け渡しと要求の出どころの確かめは Hono の仕組みで作る（受け渡しの形は第 3 段階の約束事）
    effect: 本人の確かめの入口、表、エラーの形を、このシステムの設計（第 3 段階のインタフェースとデータの実体）が決める。サーバーの依存が増えない
    cost: パスワードの持ち方、セッションの作り方と終え方、続けて失敗したときの止め方を自分で書き、NFR-27 のテストで守る
  - name: 認証のライブラリ（Better Auth など）を使う
    effect: セッション、パスワード、管理の操作が揃っている
    cost: ライブラリ自身の入口、表、エラーの形を持ち込み、第 3 段階のインタフェースとデータの実体がそれに合わせる。担当者が渡す設定の符号（TC-16）の流れは拡張で作る
chosen: 認証のライブラリを使わず、パスワードは node:crypto の scrypt で持ち、セッションはデータベースに置き、セッションの受け渡しと要求の出どころの確かめは Hono の仕組みで作る（受け渡しの形は第 3 段階の約束事）
rationale: DEC-14 の流れは、メールも外部の認証もなく、担当者が手で渡す符号（TC-16）で始まる小さなもので、二つ目の機能の多くを使わない（DRV-16）。二つ目は自身の入口、表、エラーの形を持ち込み、第 3 段階が決めるインタフェースとデータの実体の一部をライブラリが決めてしまい、設定の符号の流れ（DRV-19）を拡張で作る。一つ目は、要る分だけを Hono（TC-03）と Node.js に入った node:crypto で作り、外部のサービスもローカルの代わりも要らない（DRV-15）。DRV-28 は、利用者の種類と本人の確かめの有無の組をすべて試す NFR-27 のテスト（POL-03）で守る
rejected:
  - option: 認証のライブラリ（Better Auth など）を使う
    reason: 自身の入口、表、エラーの形が第 3 段階の設計を縛り、使わない機能と設定の符号の拡張のために決まりが増える（DRV-16、DRV-19）
gains:
  - 本人の確かめの入口と表を、このシステムの設計が決める
  - サーバーの依存が増えない
costs:
  - パスワードとセッションの扱いを自分で書いて守る
sensitive_points: []
trade_offs: []
assumptions:
  - node:crypto の scrypt は、パスワードを持つやり方として今の指針（OWASP の Password Storage Cheat Sheet）が勧めるものの一つで、その強さの値は実装が指針に合わせて決める
depends_on: [DEC-14, DEC-15]
parameters: []
debt: null
as_is: new
