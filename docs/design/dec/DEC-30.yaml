id: DEC-30
title: ドライバーを装う人には、確認コードを両方向の確かめに使って備える
status: draft
version: 2
basis: inferred
basis_note: 脅威を扱うことは第 1 段階の質問 8 で確認済み。確認コードを両方向の確かめに使い、新しい機能を足さないこと、乗客が画面を確かめずに乗る危険を受け入れることは、品質チェーンへの回答（設計 1-5。FR-26 版 2、QR-14 版 2）の入力。乗客の画面の乗車中をサーバーの記録した運転の開始からだけ示すこと（画面が自分で変えない）は推定
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 手配したドライバーを装う人に、どう備えるか
addresses:
- DRV-29
options:
- name: 確認コードを両方向の確かめに使う。運転の開始は、その依頼の担当のドライバーのアカウントが、乗客から聞いたコードを送って一致したときだけサーバーが記録する。乗客の画面の乗車中は、サーバーが記録した運転の開始を配信か取り直しで受けたときだけ示し、画面が自分で変えない。迎車中の乗客には、コードを伝えて画面が乗車中に変わってから乗るよう示す（FR-26 版 2）
  effect: 装う人は担当のドライバーのアカウントを持たないので、乗客からコードを聞いても乗客の画面を乗車中に変えられない。乗客は画面が変わるかで手配したドライバーかを確かめられる。新しい機能を作らず、今の確認コードと配信で足りる
  cost: 乗客が画面を確かめずに乗ると防げない。乗客の流れが切れていると、正しい車でも画面が変わらず乗客が疑う
- name: 設計では備えず、残る危険として受け入れる（版 1。先送りして品質チェーンに返した）
  effect: 作るものがない
  cost: ドライバーを装う人への備えがない。品質チェーンはすでに FR-26 版 2 で確かめ方を決めた
- name: 乗客の確かめを別に作る（ドライバーの画面に乗客向けの符号を示し、乗客が自分の画面の符号と見比べるなど）
  effect: 乗客が画面の変化を待たずに確かめられる
  cost: 品質チェーンにない機能を設計で足すことになる。品質チェーンは新しい機能を足さないと決めた（設計 1-5）
chosen: 確認コードを両方向の確かめに使う。運転の開始は、その依頼の担当のドライバーのアカウントが、乗客から聞いたコードを送って一致したときだけサーバーが記録する。乗客の画面の乗車中は、サーバーが記録した運転の開始を配信か取り直しで受けたときだけ示し、画面が自分で変えない。迎車中の乗客には、コードを伝えて画面が乗車中に変わってから乗るよう示す（FR-26 版 2）
rationale: DRV-29（版 2）の応答「乗客は、確認コードをドライバーに伝え、自分の画面が乗車中に変わったことで手配したドライバーだと確かめられる」と測定量の NFR-30（違うコードでは乗客の画面も乗車中に変わらない）を、今ある仕組みで満たす。運転の開始は配車のモジュールの状態遷移で、担当のドライバーであることとコードの一致を、書き込みと同じトランザクションの中で確かめる（DEC-09、DEC-20 の資源ごとの権限）。乗客の画面に届くのは、その変化が記録されたときだけ（DEC-03）。画面が自分で乗車中に変えると、確かめにならない。品質チェーンは新しい機能を足さないと決めたので（設計 1-5）、案 3 は取らない。版 1 は品質チェーンの答えを待つ先送りだったが、答えが出たので閉じる
rejected:
- option: 設計では備えず、残る危険として受け入れる（版 1。先送りして品質チェーンに返した）
  reason: 品質チェーンが FR-26 版 2 で確かめ方を決め、DRV-29 版 2 がそれを応答に求める
- option: 乗客の確かめを別に作る（ドライバーの画面に乗客向けの符号を示し、乗客が自分の画面の符号と見比べるなど）
  reason: 品質チェーンにない機能を設計で足すことになる（品質チェーンへの回答の設計 1-5）
gains:
- 乗客が手配したドライバーかを確かめられる（DRV-29）
- 新しい機能と画面を作らずに済む（DRV-26）
costs:
- 乗客が画面を確かめずに乗ると防げない（品質チェーンへの回答の設計 1-5 で受け入れた）
- 乗客の流れが切れていると、正しい車でも乗客の画面が変わらず、乗客が疑う
sensitive_points:
- 乗客の画面が乗車中を示すのは、サーバーの記録した運転の開始を受けたときだけにすること（楽観的に先に変えない）
- 迎車中の乗客の流れを前面にある間は保ち、切れたらつなぎ直して最新の状態を取り直すこと（DEC-03）。乗客が画面を手で取り直せること
trade_offs: []
assumptions:
- 装う人は、その依頼の担当のドライバーのアカウントを持たない（アカウントの守りは DEC-20）
- 確認コードは依頼ごとに作り、ドライバーが替われば新しくする（QR-14。第 3 段階の DEC-55 は一つの割り当てで 10 回違ったら止める）
depends_on:
- DEC-09
- DEC-03
- DEC-20
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
