  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 先送りをやめた。確認コードを両方向の確かめに使い、運転の開始は担当のドライバーのアカウントがコードを送って一致したときだけ記録し、乗客の画面の乗車中はその記録を受けたときだけ示す形にした。版 1 の案を退けた案に入れ、乗客の確かめを別に作る案を比べた。乗客が画面を確かめずに乗る危険を、品質チェーンへの回答で受け入れたものとして失うものに書いた
  reason: 品質チェーンへの回答の設計 1-5（FR-26 版 2、QR-14 版 2）と、第 1 段階の 3 回目の再実行（DRV-29 版 2）に追随した（第 2 段階の再実行、4 回目）
