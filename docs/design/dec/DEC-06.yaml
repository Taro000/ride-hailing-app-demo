id: DEC-06
title: 状態の変化は出来事の記録から開いたままの流れで届け、つなぎ直したら続きから届ける
status: active
basis: inferred
basis_note: 変化を相手の画面にすぐ示すこと（QR-06）と、途切れても失わないこと（QR-02）は入力。つながっているときはすぐ示し、途切れたときは失わないことを先にする扱いは、品質チェーンが QR-02 と QR-06 に書いたもの（DRV-02 と DRV-03 の競合）。乗客とドライバーが迎車を待つ間、迎車中、乗車中にアプリを画面に出したままにすることは、設計の第 1 段階の質問 2 の答え（QCR-02）に従う。ドライバーが受付をしている間も出したままにし、一覧（FR-18）の変化も流れで受けることは質問 2 で確認済み（TC-18。QCR-03 は回答済みで、品質チェーンが反映するまで前提に残す）。iOS の Safari のホーム画面に加えた Web アプリが、画面に出ている間は流れを保ち、切れたらつなぎ直すことは DAS-03 によるもので（FND-03 を受けて前提に加えた）、質問 6 で確認済み（仮定のまま進め、実機での振る舞いは開発の中と NFR-15 の受け入れの試験で確かめる）。届け方は推定。どこで時間がかかるか（QR-06 の basis_note が設計に確かめを求める点）は、この決定で道筋を決め、第 3 段階が NFR-07 の遅延の予算で確かめる（応答を左右する点として申し送った）
premises: [TC-13, TC-18, DAS-03, QCR-02, QCR-03]
stage: architecture
question: 依頼、許諾、取り消し、迎車の到着を相手の画面にすぐ示し、つながっていない間の変化も失わないには、変化をどこからどう届けるか
addresses: [DRV-03, DRV-02, DRV-26, DRV-01]
options:
  - name: 状態の変化と同じ取引で出来事の記録に書き、その記録から開いたままの HTTPS の流れ（Server-Sent Events）で届け、つなぎ直したら最後に受けた出来事の続きから届ける
    effect: 書いた直後に相手に届き、つなぎ直すとブラウザが最後に受けた出来事を伝えて続きを受ける
    cost: サーバーが流れを開いたまま保ち、流れの生存の確かめを扱う
  - name: 出来事の記録から WebSocket で届け、続きから届ける仕組みを自分で作る
    effect: 一つのつながりで両方向に送れる
    cost: 生存の確かめ、つなぎ直し、続きの受け方、つながりの認証を自分で作る
  - name: 端末が今の状態を短い間隔で問い合わせる
    effect: サーバーは流れを持たない
    cost: T_dispatch_propagation のうちに示すには数秒ごとの問い合わせが要り、端末の電池と要求の数が増える
chosen: 状態の変化と同じ取引で出来事の記録に書き、その記録から開いたままの HTTPS の流れ（Server-Sent Events）で届け、つなぎ直したら最後に受けた出来事の続きから届ける
rationale: DRV-03 には、書いた直後に相手に届く一つ目と二つ目が合う。二つ目はつなぎ直しと続きの受け方を自分で作るため DRV-16 で劣り、一つ目はブラウザがつなぎ直しと最後の出来事の受け渡しを持つ。出来事は状態の変化と同じ取引で出来事の記録（ELM-04）に書き、届けるのはその記録からだけにするので、書けた変化は一つも失われず、つながっていない間の変化もつなぎ直したときに届く（DRV-02）。サーバーの中では書いた直後に流れに載せ、ほかのインスタンスの書いたものは記録を読んで載せるので、インスタンスの数によらない。届ける相手と中身は DEC-15 の決まりを通る。相手の位置の更新は記録に残す出来事ではなく最新の値として流れに載せ、つなぎ直したときとアプリが前に戻ったときは、最新の位置を含む今の状態を受け直す。画面に出ていない相手への知らせは DEC-21 が受け持つ。相手の画面に示した時刻の扱いは DEC-23
rejected:
  - option: 出来事の記録から WebSocket で届け、続きから届ける仕組みを自分で作る
    reason: DRV-03 では並ぶが、つなぎ直しと続きの受け方を自分で作る手間が DRV-16 で劣る
  - option: 端末が今の状態を短い間隔で問い合わせる
    reason: DRV-03 を満たすには間隔を数秒にし、端末の電池と要求が増える
gains:
  - つながっている相手には、書いた直後に変化が届く
  - つなぎ直すと、つながっていない間の変化を順に受けられる
costs:
  - サーバーは開いた流れを保ち、出来事の記録を持ち続ける
sensitive_points:
  - 流れの生存を確かめる間隔、つなぎ直しの待ち、ほかのインスタンスが出来事の記録を読む間隔。長いと T_dispatch_propagation を超え、短いと端末の電池と読み込みが増える（値は第 3 段階、HND-04）
trade_offs: []
assumptions:
  - iOS の Safari は、画面に出ている間は Server-Sent Events の流れを保ち、切れたら最後の出来事を伝えてつなぎ直す（DAS-03）
depends_on: [DEC-01, DEC-08]
parameters: []
debt: null
as_is: new
