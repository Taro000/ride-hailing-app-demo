id: DEC-15
title: 使える機能、見せる範囲、個人の情報を隠す決まりはサーバーの一か所で決め、外へ出るどの道もそこを通る
status: active
basis: inferred
basis_note: 利用者の種類ごとの機能（FR-49）、位置と乗車の記録を見られる人（QR-57）、調査とログで個人の情報を隠し伏せること（QR-34、QR-58、FR-35）、その決まりを一か所に置くこと（QR-56、DRV-34）は入力。置く場所と通し方は推定。個人の情報を隠してもたどれる扱い（DRV-24 と DRV-29 の競合）は、品質チェーンが QR-33 と QR-34 に書いたもの
premises: [CON-06]
stage: architecture
question: 利用者の種類ごとの機能、位置と乗車の記録を見せる範囲、エンジニアとログから個人の情報を隠すことを、どこで決め、どう通すか
addresses: [DRV-29, DRV-34, DRV-31, DRV-21, DRV-28, DRV-30, DRV-24]
options:
  - name: サーバーの一か所の決まりで決め、応答、流れの出来事、知らせ、ログ、たどる記録、写しのどれもそこを通し、端末は受けたものを示すだけにする
    effect: 新しい画面、記録、知らせを加えても、決まりを通らずに外へ出る道がない
    cost: どの出口もその決まりを通るよう、サーバーの中の依存を守る
  - name: 画面と操作ごとに、それぞれ確かめる
    effect: 画面ごとに決まりを書ける
    cost: 新しい画面や記録を加えるたびに確かめ漏れが生じうる
  - name: データベースの見せ方（ビューや行の権限）で決める
    effect: どこから読んでも同じ決まりになる
    cost: ELM-04 は利用者ごとの行の権限を持たず、理由を示したときだけ見せることを表せない
chosen: サーバーの一か所の決まりで決め、応答、流れの出来事、知らせ、ログ、たどる記録、写しのどれもそこを通し、端末は受けたものを示すだけにする
rationale: 三つ目は ELM-04 が表せず、二つ目は確かめ漏れを防げない（QR-56）。一つ目だけが DRV-34 を満たす。使える機能（FR-49）、位置と乗車の記録を誰がいつ見られるか（QR-57）、エンジニアに見せる画面、知らせ、たどる記録、ログで個人の情報を隠し伏せること（QR-34、QR-58）を、サーバーの一か所の決まりが決め、どの操作でもサーバーが毎回確かめる（DRV-31）。隠したままでも同じ乗客と同じドライバーと分かるよう、鍵を使った仮の名で示す（FR-35、DRV-24）。理由を示したエンジニアにだけその依頼の分を示し、誰が、いつ、どの依頼の、どの情報を、どの理由で見たかを残す（FR-35、DEC-19）。端末は許されない機能を隠して示すだけで、許すかどうかは決めない。その決まりをサーバーの中のどこに置き、どう依存を守るかは第 2b 段階と第 4 段階が決める
rejected:
  - option: 画面と操作ごとに、それぞれ確かめる
    reason: 新しい画面や記録で確かめ漏れが生じ、DRV-34 と QR-56 を満たさない
  - option: データベースの見せ方（ビューや行の権限）で決める
    reason: ELM-04 は利用者ごとの行の権限を持たず、理由を示したときだけ見せることを表せない
gains:
  - 見せる範囲と隠し方が、どの画面、知らせ、ログでも同じになる
  - 隠したままでも一件の依頼をたどれる
costs:
  - 外へ出るどの道もこの決まりを通るよう、サーバーの中の依存を検査で守る
sensitive_points: []
trade_offs:
  - with: DRV-24
    note: エンジニアは仮の名でたどり、名前、連絡先、場所は理由を示したときだけ見る。理由を示す一手間が原因の特定にかかる
assumptions: []
depends_on: [DEC-01]
parameters: []
debt: null
as_is: new
