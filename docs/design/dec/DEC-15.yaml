id: DEC-15
title: 位置を状態の履歴とログから切り離し、座標の表ごとに読める相手を決める
status: draft
version: 2
basis: inferred
basis_note: QR-39 の「権限のある人だけが読める形」は入力。分け方と読める相手は提案（質問 10・16 は回答なし）
needs_agreement: false
approver_candidates: []
stage: architecture
question: 状態の履歴に要る位置を、個人情報を守りながらどう持つか
addresses:
- DRV-21
- DRV-32
- DRV-27
- DRV-29
options:
- name: 位置は、位置の記録（履歴が参照する位置）、位置の受信の記録、最後の位置の三つの表に分けて持ち、状態の履歴は参照だけを持つ。座標を持つ表は位置のモジュールだけが読み書きし、表ごとに読める相手を決める（位置の記録は運営・サポート担当とエンジニアの役割、配車のモジュール、毎日の処理。受信の記録は運営・サポート担当とエンジニアの役割、位置の確かめ、毎日の処理。最後の位置は、ドライバーの分を配車のモジュールと迎車中・乗車中のその乗客に、乗客の分を迎車中の担当のドライバーだけに）。ログとエラーの記録には座標を書かない（書けない型にする）。保存期間を過ぎると位置の記録を消し、履歴から操作した人を消す
  effect: 履歴とログに座標がないまま、場所で起きる変化には位置がある。座標を読める相手が表ごとに一か所で決まる
  cost: 位置を読むたびに表を結ぶ。読める相手の表を保つ
- name: 位置を状態の履歴の行に入れ、読める人を API で限る
  effect: 単純
  cost: 履歴に座標が残り、DRV-32 と NFR-40 に反する
- name: 位置を丸めて（100 m ほど）履歴に入れる
  effect: 個人を特定しにくい
  cost: NFR-14（50 m）、到着の確かめ（QR-49）、SLI-05 を満たさない
chosen: 位置は、位置の記録（履歴が参照する位置）、位置の受信の記録、最後の位置の三つの表に分けて持ち、状態の履歴は参照だけを持つ。座標を持つ表は位置のモジュールだけが読み書きし、表ごとに読める相手を決める（位置の記録は運営・サポート担当とエンジニアの役割、配車のモジュール、毎日の処理。受信の記録は運営・サポート担当とエンジニアの役割、位置の確かめ、毎日の処理。最後の位置は、ドライバーの分を配車のモジュールと迎車中・乗車中のその乗客に、乗客の分を迎車中の担当のドライバーだけに）。ログとエラーの記録には座標を書かない（書けない型にする）。保存期間を過ぎると位置の記録を消し、履歴から操作した人を消す
rationale: QR-39 は「伏せるか、権限のある人だけが読める形」を許す。原則 DRV-32 は履歴に伏せていない位置を残さないことを、DRV-27（NFR-14、NFR-45）は場所で起きる変化に位置があることを求める。分けて持つと両方を満たし、DRV-21 の保存期間の処理も表を消すだけになる。前回は位置の記録の表だけを限り、受信の記録と最後の位置に読める相手の決まりがなかった（FND-12）。DRV-32 と DRV-27 の文の食い違いは FND-01 にした
rejected:
- option: 位置を状態の履歴の行に入れ、読める人を API で限る
  reason: 原則 DRV-32 に反する
- option: 位置を丸めて（100 m ほど）履歴に入れる
  reason: DRV-27 を満たさない
gains:
- 履歴とログに座標がない（NFR-40）
- 場所で起きる変化（到着、運転の開始、乗車の終わり、不在）に位置がある（NFR-14、NFR-45）
- 座標を読める相手を、位置のモジュールの一か所で確かめられる
- 保存期間の処理が単純
costs:
- 位置を読むたびに表を結ぶ
- 読める相手の表を保つ手間
sensitive_points:
- 位置を読める役割とモジュールの範囲（表ごと）
trade_offs:
- with: DRV-28
  note: ログに座標がないので、位置の問題を調べるときは位置の記録と受信の記録を役割の権限で読む
assumptions:
- 位置のない変化（システムが起こす変化、位置を許可していない乗客の手配、現在地を得られない到着）は理由を持つ。SLI-05 の「どの変化にも位置」は品質チェーンへの課題 5
depends_on:
- DEC-08
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 読める相手の決まりを座標を持つ三つの表（位置の記録、位置の受信の記録、最後の位置）に広げ、位置のモジュールだけが読み書きすることにした。「どの変化にも位置がある」を「場所で起きる変化に位置がある」に直した
  reason: FND-12（第 2 段階のレビュー）を受け入れた。レビューの品質チェーンへの課題 1
