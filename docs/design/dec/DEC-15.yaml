id: DEC-15
title: 位置を状態の履歴とログから切り離し、座標の表ごとに読める相手を決める
status: draft
version: 5
basis: inferred
basis_note: QR-39 の「権限のある人だけが読める形」と、DRV-32 の版 2（履歴の記録に座標を書かず、履歴に要る位置は権限のある役割だけが読める形で持つ）は入力。分け方と読める相手は提案（質問 10・16 は回答なし）。配信と測るモジュールを読める相手に足すことは、第 3 段階の DEC-51 と DAT-21 に合わせた
needs_agreement: false
approver_candidates: []
stage: architecture
question: 状態の履歴に要る位置を、個人情報を守りながらどう持つか
addresses:
- DRV-21
- DRV-32
- DRV-27
- DRV-29
- FND-25
- FND-28
options:
- name: 位置は、位置の記録（履歴が参照する位置）、位置の受信の記録、最後の位置の三つの表に分けて持ち、状態の履歴は参照だけを持つ。座標を持つ表は位置のモジュールだけが読み書きし、表ごとに読める相手を決める（位置の記録は運営・サポート担当とエンジニアの役割、配車のモジュール、毎日の処理の保存期間の削除。受信の記録は運営・サポート担当とエンジニアの役割、位置の確かめ、毎日の処理（SLI-03 の確かめ直しには受けた時刻だけを返す。保存期間の削除）。最後の位置は、ドライバーの分を配車のモジュールと迎車中・乗車中のその乗客に、乗客の分を迎車中の担当のドライバーだけに。配信にはこの相手と状態を確かめて返し、サーバーの測るモジュール（SLI-03 の毎分の確かめ）には座標を除いた受けた時刻だけを返す）。ログとエラーの記録には座標を書かない（書けない型にする）。保存期間を過ぎると位置の記録を消し、履歴から操作した人を消す
  effect: 履歴とログに座標がないまま、場所で起きる変化には位置がある。座標を読める相手が表ごとに一か所で決まる
  cost: 位置を読むたびに表を結ぶ。読める相手の表を保つ
- name: 位置を状態の履歴の行に入れ、読める人を API で限る
  effect: 単純
  cost: 履歴に座標が残り、DRV-32 と NFR-40 に反する
- name: 位置を丸めて（100 m ほど）履歴に入れる
  effect: 個人を特定しにくい
  cost: NFR-14（50 m）、到着の確かめ（QR-49）、SLI-05 を満たさない
chosen: 位置は、位置の記録（履歴が参照する位置）、位置の受信の記録、最後の位置の三つの表に分けて持ち、状態の履歴は参照だけを持つ。座標を持つ表は位置のモジュールだけが読み書きし、表ごとに読める相手を決める（位置の記録は運営・サポート担当とエンジニアの役割、配車のモジュール、毎日の処理の保存期間の削除。受信の記録は運営・サポート担当とエンジニアの役割、位置の確かめ、毎日の処理（SLI-03 の確かめ直しには受けた時刻だけを返す。保存期間の削除）。最後の位置は、ドライバーの分を配車のモジュールと迎車中・乗車中のその乗客に、乗客の分を迎車中の担当のドライバーだけに。配信にはこの相手と状態を確かめて返し、サーバーの測るモジュール（SLI-03 の毎分の確かめ）には座標を除いた受けた時刻だけを返す）。ログとエラーの記録には座標を書かない（書けない型にする）。保存期間を過ぎると位置の記録を消し、履歴から操作した人を消す
rationale: QR-39 は「伏せるか、権限のある人だけが読める形」を許す。原則 DRV-32 は、履歴の記録に伏せていない位置を書かず、履歴に要る位置は権限のある役割だけが読める形で持って変化に結び付けることを求め、DRV-27（NFR-14、NFR-45）は場所で起きる変化に位置があることを求める。分けて持つと両方を満たし、DRV-21 の保存期間の処理も表を消すだけになる。前回は位置の記録の表だけを限り、受信の記録と最後の位置に読める相手の決まりがなかった（FND-12）。DRV-32 の版 1 は伏せることだけを書き、DRV-27 と食い違っていた。第 1 段階が FND-01 を受け入れて DRV-32 を版 2 にし、今はこの分け方と同じことを求める。版 3 は、2 回目の再実行で足した SLI-03 の毎分の確かめ（DEC-35）を読める相手に入れておらず、受信の記録の「毎日の処理（SLI-03）」は DEC-16 の版 3 と合っていなかった（FND-25）。配信は第 3 段階の DEC-51 が相手の位置を読む形にした（FND-28）
rejected:
- option: 位置を状態の履歴の行に入れ、読める人を API で限る
  reason: 原則 DRV-32 に反する
- option: 位置を丸めて（100 m ほど）履歴に入れる
  reason: DRV-27 を満たさない
gains:
- 履歴とログに座標がない（NFR-40）
- 場所で起きる変化（到着、運転の開始、乗車の終わり、不在）に位置がある（NFR-14、NFR-45）
- 座標を読める相手を、位置のモジュールの一か所で確かめられる
- 保存期間の処理が単純
costs:
- 位置を読むたびに表を結ぶ
- 読める相手の表を保つ手間
sensitive_points:
- 位置を読める役割とモジュールの範囲（表ごと）
trade_offs:
- with: DRV-28
  note: ログに座標がないので、位置の問題を調べるときは位置の記録と受信の記録を役割の権限で読む
assumptions:
- 位置を持つのは、ドライバーが場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）の履歴だけで、現在地を得られなかったときは得られなかった印を持つ。ほかの変化（手配、許諾、取り消し、降車場所の変更、請求、返金、システムが起こす変化）は位置を持たない（FR-39 版 3、SLI-05 版 2。品質チェーンへの課題 5 は決着）。位置の受信の記録（FR-17 版 2）は、T_log_retention の間、苦情の調べで記録した位置として示す（FR-45 版 2。DRV-32 版 3）
depends_on:
- DEC-08
