id: DEC-51
title: 配信の出来事と出どころ
status: draft
version: 2
basis: inferred
basis_note: DEC-03、DEC-15、DEC-22、FR-10・11・24・47 は入力。出どころを足すこと、一覧を丸ごと送ること（質問 4 は回答なし）、断られたときの問い合わせは推定。予算の数は計算
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: high-level-design
question: SSE で何を送り、それをインスタンスがどこから知るか
addresses:
- IFC-08
- DRV-02
- DRV-03
- DEC-03
- DEC-15
- FND-28
options:
- name: "状態の履歴とドライバーの受付の記録を通し番号で追い、相手の位置と到着予定は 1 秒ごとの今の値の読み出しで送る。ドライバーの一覧は変化のたびに丸ごと送る。出来事: hello、ride.updated、ride.live、driver.requests、driver.status、stream.closing。カーソルは h<履歴の通し番号>-d<受付の記録の通し番号>。つなぎ直しは Last-Event-ID から。読めないカーソルには今の状態を丸ごと送る。ride.updated は、取り消しなら cancelledBy（passenger、driver、system）と reason（T_request_max は request_timeout）を、運転の開始なら state=in_progress を運ぶ（乗客の画面はこれか GET でだけ乗車中にする。第 2 段階の DEC-30 版 2）。流れの優先は持たない（第 2 段階の DEC-21 版 5）"
  effect: インスタンスがいくつでも、入れ替わっても同じに届く（DEC-02、DEC-03）。新しい依頼が一覧に出るまでの予算に 1.35 秒の余りがある（計算）
  cost: 1 秒に 3 回読む（第 2 段階の見込みの 3 倍）
- name: 位置も追記の表で追う
  effect: 出どころが一つ
  cost: 10 秒ごとに参加者ごとの行が増え、追う量も増える
- name: 一覧は知らせだけ送り、画面が取り直す
  effect: 一覧の規則が一か所
  cost: 往復が一つ増え、5 秒の予算の余りが 0.30 秒になる（計算）
chosen: '状態の履歴とドライバーの受付の記録を通し番号で追い、相手の位置と到着予定は 1 秒ごとの今の値の読み出しで送る。ドライバーの一覧は変化のたびに丸ごと送る。出来事: hello、ride.updated、ride.live、driver.requests、driver.status、stream.closing。カーソルは h<履歴の通し番号>-d<受付の記録の通し番号>。つなぎ直しは Last-Event-ID から。読めないカーソルには今の状態を丸ごと送る。ride.updated は、取り消しなら cancelledBy（passenger、driver、system）と reason（T_request_max は request_timeout）を、運転の開始なら state=in_progress を運ぶ（乗客の画面はこれか GET でだけ乗車中にする。第 2 段階の DEC-30 版 2）。流れの優先は持たない（第 2 段階の DEC-21 版 5）'
rationale: DEC-03 の出どころは状態の履歴だけだが、位置（FR-10、11、24）、到着予定の取り直し（DEC-22）、ドライバーの停止（FR-47）は状態の履歴にない（DEC-15）。第 2 段階の構造のまま足りるので、この段で出どころを足し、第 2 段階の記述と見込みのずれは FND-28 にした
rejected:
- option: 位置も追記の表で追う
  reason: 書く量と追う量が増え、座標の表を位置のモジュールだけが読む決まり（DEC-15）を配信の追いかけに広げる
- option: 一覧は知らせだけ送り、画面が取り直す
  reason: NFR-02 の余りが少ない
gains:
- 配信のもとが記録そのものなので、記録に残った変化は必ず届く（DRV-31）
costs:
- Turso の読み出しがデモの回 1 回で 32,400 回（第 2 段階の見込みは 10,800 回）
sensitive_points:
- 一覧の規則（FR-16、FR-34）は配車のモジュールの一つの読み出しにして、API の一覧と同じものを使う（DEC-09）
trade_offs:
- with: DRV-26
  note: Turso の読み出しが増える（無料の枠の量には小さい）
assumptions:
- 位置のモジュールが、相手に見せてよい位置だけを役割と状態で確かめて返す（DEC-15）
depends_on:
- DEC-03
- DEC-15
- DEC-09
parameters:
- name: SLI-02 の実機の確かめ（最初のデモの前の関門）
  value: iPhone 2 台の実機で、変化と相手の組の 95% が 5 秒以内（NFR-02）。届かなければ、追いかけの間隔と区間を見直してからデモを始める
  basis: 携帯の回線の区間の値が入力になく仮の値のため（遅延の予算）。通らないまま始めるかは要合意
- name: 流れを断られたときの問い合わせ
  value: 15 秒ごと
  basis: NFR-02 の 5 秒には届かないが、迎車と到着の流れを止めない最小の間隔として提案
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "ride.updated が運ぶもの（取り消した者と理由、運転の開始）と、流れの優先を持たないことを書いた。最初のデモの前に実機で SLI-02 を測る関門を設計上の値に入れた。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。FND-36 を受け入れた。品質チェーンの再実行（FR-08 版 2、FR-26 版 2）、第 2 段階の DEC-21 版 5・DEC-30 版 2"
