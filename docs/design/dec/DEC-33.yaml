id: DEC-33
title: ELM-03 の HTTP の仕様書は Zod の経路の定義から生成し、二つの Web アプリはそれから生成した型で ELM-03 を呼ぶ
status: active
basis: assumed
basis_note: どのインタフェースも両側を同じ開発者が作ること（TEAM-01）は入力。二つの Web アプリと ELM-03 を一緒に配備し、前の版に戻すときは前の版を配備し直すこと（DEC-05、DEC-26）は入力。比べ方と選び方は推定。@hono/zod-openapi が経路の定義から OpenAPI 3.1 の文書を生成することは、その README で確かめた（報告の「入力」）。開発者が Zod、@hono/zod-openapi、openapi-fetch を使いこなすか学べることは DAS-07 による仮定。openapi-typescript と openapi-fetch、oasdiff の今の版は確かめていない
premises: [TEAM-01, DAS-07]
stage: technical-policy
question: ELM-03 が提供する HTTP の操作と流れの出来事の仕様書をどう作り、二つの Web アプリは ELM-03 をどの型で呼ぶか
addresses: [DRV-12, DRV-13, DRV-16]
options:
  - name: "@hono/zod-openapi の経路の定義（Zod のスキーマ）から OpenAPI 3.1 の文書を生成してコミットし、Web アプリは openapi-typescript でその文書から生成した型と openapi-fetch で呼ぶ"
    effect: 要求の確かめと仕様書が一つのスキーマから出る。Web アプリは ELM-03 のコードを import せず、生成した型が変わると型の確かめで失敗する。前のリリースの文書と比べて、壊す変更を見つけられる
    cost: 生成の手順が二つあり、生成した文書と型をコミットする
  - name: Web アプリは Hono の RPC（hc）で ELM-03 の経路の型を直接使い、仕様書は作らない
    effect: 生成の手順がない
    cost: Web アプリが ELM-03 のコードの型を import してコンポーネントの境をまたぎ、比べる文書がないため、前のリリースとの違いを見つけられない
  - name: OpenAPI の文書を手で書き、サーバーとクライアントのコードをそれから生成する
    effect: 文書が先に決まる
    cost: 両側を同じ開発者が作るのに、コードの二つ目の写しを手で保ち、ずれる
chosen: "@hono/zod-openapi の経路の定義（Zod のスキーマ）から OpenAPI 3.1 の文書を生成してコミットし、Web アプリは openapi-typescript でその文書から生成した型と openapi-fetch で呼ぶ"
rationale: 三つ目は、両側を同じ開発者が作る（TEAM-01）のに写しを手で保ち、ずれる（DRV-16）。二つ目は、コンポーネントの間で import しない規則（POL-02、DRV-12）を破り、比べる文書がない。前の版に戻すとき（DEC-26）、画面を開いたままの Web アプリが前の版の ELM-03 と話すため、版をまたいで壊す変更を見つける比較が要る（DRV-13）。一つ目は、要求の確かめと文書を一つのスキーマから作り、検査の手順が、生成し直した文書の違いと、最後のリリースの文書と比べた壊す変更を見つける（POL-05）
rejected:
  - option: Web アプリは Hono の RPC（hc）で ELM-03 の経路の型を直接使い、仕様書は作らない
    reason: コンポーネントの間の import の規則（DRV-12）を破り、前のリリースと比べる文書がない（DRV-13）
  - option: OpenAPI の文書を手で書き、サーバーとクライアントのコードをそれから生成する
    reason: 同じ開発者が作る両側に、手で保つ写しを足し、ずれる（DRV-16）
gains:
  - 要求の確かめ、仕様書、Web アプリの型が一つのスキーマから出る
  - 前のリリースと比べて壊す変更を見つけられる
costs:
  - 生成の手順と、生成したファイルのコミットが要る
sensitive_points: []
trade_offs: []
assumptions:
  - "@hono/zod-openapi は、流れ（Server-Sent Events）の出来事のスキーマも、同じ文書の部品として入れられる"
  - 開発者は Zod、@hono/zod-openapi、openapi-fetch を使いこなすか、学ぶ時間を取れる（DAS-07）
depends_on: [DEC-01, DEC-26, DEC-31]
parameters: []
debt: null
as_is: new
