id: DEC-33
title: SSE 以外の経路と Turso の呼び出しに、サーバーの中で上限を置く
status: draft
version: 2
basis: inferred
basis_note: Cloud Run の要求のタイムアウトがサービスに一つであること、Hono のタイムアウトのミドルウェアが流れに使えないこと、libSQL のクライアントの timeout が手元のファイルにだけ効くことは文書から。経路ごとの上限（乗車の終了と降車場所の変更の確定は 20 秒）は質問 22 で確認済み。ほかの案と値は提案（質問 15 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: 一つのサービスの要求のタイムアウト（SSE のための 3,600 秒）のもとで、SSE 以外の要求と Turso の呼び出しが長く待たされないようにするにはどうするか
addresses:
- DRV-01
- DRV-11
- DRV-27
- DRV-02
- DRV-04
- FND-21
options:
- name: サーバーの中に経路ごとの上限を置く。SSE 以外の経路は上限を過ぎたら 503 と決まった符号を返す（Hono のタイムアウトのミドルウェア。SSE の経路には付けない）。上限はふだん T_route、Stripe を要求の中で二度以上呼ぶ乗車の終了と降車場所の変更の確定の経路だけは T_route_long にし、どの経路も要求の中で待つ最悪（Turso が T_db で止まったとき）より長くする。Turso の呼び出しは libSQL のクライアントに渡す fetch に中止のタイマーを付けて 1 回 T_db で切る。経路を切っても進めていたお金の操作は止めず、結果は操作キーに残す。画面のタイムアウトは経路の上限より長くする
  effect: 待たされた要求は T_route で失敗として返り、SLI-01 が数える。Turso が遅くても乗客は 60 分待たない
  cost: 経路ごとの上限を保ち、SSE の経路を外す決まりが要る
- name: SSE を別の Cloud Run のサービスに分け、API のサービスの要求のタイムアウトを短くする
  effect: Cloud Run の入口が短い要求を切る
  cost: 負荷分散がない（DEC-21）ので別の入口になり、クッキーの認証と同じ入口（DEC-23）が崩れる。回ごとに作って消すサービスが二つになる（DEC-06）
- name: 今のまま（Stripe と地図の呼び出しにだけ上限）
  effect: 手間がない
  cost: Turso が遅いと要求は最大 60 分待ち、60 分の内に答えれば SLI-01 は良いに数える
- name: サーバーの中に上限を置き、SSE 以外の経路はすべて T_route（10 秒）一つにする（版 1 の形）
  effect: 上限が一つで単純
  cost: 乗車の終了は要求の中の最悪 9.35 秒で上限との差が 0.65 秒、Turso が遅いと 15.05 秒で超えて 503 になる（処理は続き、同じキーの送り直しで最初の結果を受けるが、SLI-01 は失敗に数える）。降車場所の変更の確定も遅いと 13.05 秒で超える
- name: サーバーの中に上限を置き、要求の中で Stripe を呼ぶのは一度までにして、降車のときの確定のやり直しと押さえ直しの後の古い押さえの取り消しを応答の後に続ける（上限は T_route 一つ）
  effect: 要求の中の最長が Turso が遅くても 8.55 秒で T_route に収まり、乗車の終了の応答が速い
  cost: ドライバーの画面は配信で確定の結果を待つ。第 3 段階の乗車の終了の操作と流れを作り直す。応答の後の処理がインスタンスの入れ替えで切れたときは T_op_stale の後の確かめに任せる
chosen: サーバーの中に経路ごとの上限を置く。SSE 以外の経路は上限を過ぎたら 503 と決まった符号を返す（Hono のタイムアウトのミドルウェア。SSE の経路には付けない）。上限はふだん T_route、Stripe を要求の中で二度以上呼ぶ乗車の終了と降車場所の変更の確定の経路だけは T_route_long にし、どの経路も要求の中で待つ最悪（Turso が T_db で止まったとき）より長くする。Turso の呼び出しは libSQL のクライアントに渡す fetch に中止のタイマーを付けて 1 回 T_db で切る。経路を切っても進めていたお金の操作は止めず、結果は操作キーに残す。画面のタイムアウトは経路の上限より長くする
rationale: DRV-01 の応答（入口の待ち時間の上限で切られずに応える）と SLI-01 の OK（5xx でも 429 でもなく、切られなかった要求）は、待たされた要求を失敗に数えて初めて意味を持つ。Turso へは公開のインターネットをまたぐ（脅威のモデルの F14）。案 2 は DRV-26 と DEC-23（同じ入口、クッキー、CORS なし）を崩す。案 3 は DRV-01 と DRV-27 を満たさない（FND-07）。版 1 は上限を T_route 一つにし、そのもとを手配の確定と返金の 2.7 秒の 3.7 倍とした。同じ上限がかかる乗車の終了（9.35 秒、Turso が遅いと 15.05 秒）と降車場所の変更の確定（5.45 秒、13.05 秒）を見ていなかった（FND-21）。経路ごとの上限と、要求の中で Stripe を一度までにする形を比べ、利用者は経路ごとの上限を選んだ（質問 22）
rejected:
- option: SSE を別の Cloud Run のサービスに分け、API のサービスの要求のタイムアウトを短くする
  reason: DRV-26 を満たさず、DEC-23 の同じ入口とクッキーの認証が崩れる
- option: 今のまま（Stripe と地図の呼び出しにだけ上限）
  reason: DRV-01 と DRV-27 を満たさない
- option: サーバーの中に上限を置き、SSE 以外の経路はすべて T_route（10 秒）一つにする（版 1 の形）
  reason: DRV-01 と DRV-27 を一部しか満たさない（Turso が遅いと乗車の終了が 503 になり、SLI-01 が失敗に数える）
- option: サーバーの中に上限を置き、要求の中で Stripe を呼ぶのは一度までにして、降車のときの確定のやり直しと押さえ直しの後の古い押さえの取り消しを応答の後に続ける（上限は T_route 一つ）
  reason: 利用者は経路ごとの上限を選んだ（質問 22）
gains:
- 待たされた要求が T_route で失敗として返り、SLI-01 が数える
- Turso が遅いときも、要求と書き込みが積み上がらない
costs:
- 経路ごとの上限を保つ手間
- 切った後も動いているお金の操作を、操作キーで扱う
- 上限が経路ごとに二つになり、画面のタイムアウトもそれに合わせる
sensitive_points:
- T_route と T_route_long（どちらも、その経路の要求の中の最悪より上で、待たせすぎない値）
- T_db（ふだんの遅い呼び出しを切らない値）
trade_offs:
- with: DRV-04
  note: 切られた操作は、同じキーで送り直すと最初の結果を受ける（第 3 段階の DEC-48）
- with: DRV-01
  note: 乗車の終了と降車場所の変更の確定は、待たされると最長 20 秒、同時の要求の枠を一つ使う
assumptions:
- Hono のタイムアウトのミドルウェアは流れに使えない（Hono の文書）
- libSQL の TypeScript のクライアントは fetch を差し替えられ、timeout の設定は手元のファイルにだけ効く（libSQL の文書）
depends_on:
- DEC-01
- DEC-03
- DEC-08
- DEC-12
parameters:
- name: T_route（SSE 以外の経路の上限）
  value: 10 秒
  basis: この上限の経路の要求の中の最悪（Stripe を一度呼ぶお金の操作）はふだん 2.85 秒で、その 3.5 倍。Turso が T_db で止まっても 8.55 秒で、1.45 秒短い（計算）
- name: T_route_long（乗車の終了と降車場所の変更の確定の経路の上限）
  value: 20 秒
  basis: 乗車の終了の要求の中の最悪 9.35 秒、Turso が T_db で止まると 15.05 秒（余り 4.95 秒）。降車場所の変更の確定は 5.45 秒と 13.05 秒（計算）。値は質問 22 の選択肢で確認済み
- name: T_db（Turso の呼び出しの上限）
  value: 1 回 2 秒
  basis: データベースの仮の見込み 0.1 秒の 20 倍。手配の確定のセッションの読み出しと二つのトランザクションが T_db で止まっても 8.55 秒で、T_route より先に切れる（計算）
debt: null
deferred: false
revisit_when: null
as_is: new
