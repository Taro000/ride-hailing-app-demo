id: DEC-10
title: お金の操作は試みごとに記録してからその試みだけを覆うキーで送り、答えがなければ結果が分からない状態として持って同じキーで確かめ、拒否された試みのやり直しは新しいキーで送る
status: active
basis: inferred
basis_note: お金が一度だけ動き、結果が分からない操作を確かめてから進むことは QR-04、QR-29、QR-45、FR-30、FR-40、FR-54 と DRV-32（入力）。EXT-01 が答えないときは分からないことを先に示し、結果が分かってから示し直す扱いは、品質チェーンが QR-04 と QR-24 の競合に書いたもの。EXT-01 が受け付けなかった決済と返金をやり直せること（FR-29 と FR-39 の受け入れ基準）に合わせ、拒否された試みを終わったものとして新しいキーでやり直し、一度だけ動くことを済んだか結果が分からない試みの数で守る扱いは、FND-01 を受けて加えた。仕組みは推定
premises: [EXT-01, TC-10]
stage: architecture
question: EXT-01 が答えない、遅れて答える、受け付けないときも、お金を一度だけ動かし、結果が分からない操作を確かめてから進み、受け付けられなかった決済と返金をやり直せるには
addresses: [DRV-07, DRV-32, DRV-01]
options:
  - name: お金の操作の試みごとに先に記録を書き、その一つの試みだけを覆う冪等キーで EXT-01 に送り、答えがなければ結果が分からない状態として持って同じキーで送り直すか作った取引を読み直して確かめ、EXT-01 がはっきり拒否した試みは終わったものとして、やり直しは新しいキーの新しい試みにする
    effect: 何度送り直しても EXT-01 で一度しか動かず、結果が分からない操作が失敗として扱われず、拒否された決済と返金をやり直せる
    cost: 試みの記録、キー、確かめ続ける処理を持つ
  - name: 時間切れになったら新しいキーで送り直す
    effect: 作りが単純になる
    cost: 一度目が EXT-01 で済んでいれば、二重に押さえるか請求する
  - name: 時間切れになったら、このシステムの ID で EXT-01 を探してから送り直す
    effect: キーを持たずに済む
    cost: EXT-01 の探す仕組みは処理の直後の取引を見つけられないことがあり、その間に送り直すと二重になる
chosen: お金の操作の試みごとに先に記録を書き、その一つの試みだけを覆う冪等キーで EXT-01 に送り、答えがなければ結果が分からない状態として持って同じキーで送り直すか作った取引を読み直して確かめ、EXT-01 がはっきり拒否した試みは終わったものとして、やり直しは新しいキーの新しい試みにする
rationale: 二つ目は二重の請求を生んで DRV-07 と DRV-32 を破り、三つ目は探す仕組みの遅れで二重になりうる。一つ目だけが DRV-32 を満たす。お金の操作（押さえ、押さえ直し、全額の確定、料金の確定、取り消し、返金）は、試みごとに EXT-01 に送る前に記録を書き、EXT-01 への呼び出しをまたぐ取引は作らない。キーは一つのお金の操作の一つの試みだけを覆い、同じ試みの送り直しは同じキーで送る。EXT-01 がはっきり拒否した試み（答えが拒否で、結果が分からないものではない）は終わったものとし、同じキーでは送り直さない（EXT-01 は同じキーに一度目の拒否を返す）。新しいキーの新しい試みは、機能がやり直しを求める所（乗客が支払い方法を変えた後の決済、FR-29。担当者がやり直す返金、FR-39）と、確定額か支払い方法が変わった後の押さえ直し（DEC-09）でだけ作る。一度だけ動くことは試みの数ではなく、済んだか結果が分からない試みの数で守る。一つの乗車の決済、一つの依頼のキャンセル料か不在の料金、担当者が認めた一つの返金は、それぞれ済んだか結果が分からない試みを一つまでしか持てず、新しい試みはそれまでの試みがどれもはっきり拒否されたときだけ作る（FR-30、FR-40、FR-54）。済んだ決済と返金をもう一度行うと最初の結果を返し（FR-30、FR-40）、結果が分からない試みのやり直しは同じキーで確かめる。返金の合計は、済んだか結果が分からない返金で数えて支払われた額までに限る（FR-40）。時間切れは失敗ではなく、結果が分からない状態として持ち、待ちは最初に送った時から数える。分かるまで同じキーで送り直すか作った取引を読み直し、新しいキーでは送らない。待ちのうちに分からないとき、依頼のときの押さえは依頼を受け付けずに乗客に伝え、後で押さえが済んでいたと分かれば取り消す。押さえ直しは降りる場所も支払い方法も変えず、後で済んでいたと分かれば取り消す。決済は T_payment_response のうちに分からないことを示し、乗車を決済の結果待ちにして確かめ続け、分かったら示す（FR-29）。料金の確定、取り消し、返金も分かるまで確かめ続け、返金は担当者に分からないことを示す（FR-39、FR-40）。EXT-01 の答えを拒否と結果が分からないものに分ける決まりは第 3 段階が決める。時間切れは、ドライバーの端末が決済の答えを待つ時間をサーバーが答える期限（T_payment_response のうち）より長くし、その期限を EXT-01 への一回の呼び出しの時間切れとやり直しの和より長くする
rejected:
  - option: 時間切れになったら新しいキーで送り直す
    reason: 二重に押さえるか請求し、DRV-07 と DRV-32 を破る
  - option: 時間切れになったら、このシステムの ID で EXT-01 を探してから送り直す
    reason: 探す仕組みに処理の直後の取引が現れないことがあり、DRV-32 を確かには満たさない
gains:
  - EXT-01 が答えなくても、お金は二重に動かない
  - 結果が分からない操作が、必ず結果に合わせられる
  - EXT-01 が受け付けなかった決済と返金を、二重に動かさずにやり直せる
costs:
  - 結果が分からない操作を確かめ続ける処理を持つ
  - 一つの決済、料金、返金が試みを二つ以上持ちうり、記録と照合がそれをまとめる
sensitive_points:
  - EXT-01 への呼び出しの時間切れ、同じキーでのやり直しの回数と間隔、押さえと押さえ直しを済まなかったとみなすまでの待ち、結果が分からない操作を確かめに行く間隔。長いと T_payment_response を超え、短いと結果が分からない操作が増える（値は第 3 段階、HND-05）
trade_offs:
  - with: DRV-01
    note: 待ちのうちに結果が分からない決済と押さえは、SLI-01 と SLI-06 の悪いイベントに数えられる。期限のうちに同じキーで送り直して減らすが、EXT-01 が答えない間はなくせない
assumptions:
  - EXT-01 は、同じ冪等キーの送り直しに一度目の結果を返す
  - EXT-01 は、受け付けない操作に拒否とその理由を答え、その答えは結果が分からない答え（時間切れ、EXT-01 の側の失敗）と見分けられる
depends_on: [DEC-08, DEC-09]
parameters: []
debt: null
as_is: new
