id: DEC-10
title: お金の操作は一つずつ記録してからその操作だけを覆うキーで送り、答えがなければ結果が分からない状態として持って同じキーで確かめる
status: active
basis: inferred
basis_note: お金が一度だけ動き、結果が分からない操作を確かめてから進むことは QR-04、QR-29、QR-45、FR-30、FR-40、FR-54 と DRV-32（入力）。EXT-01 が答えないときは分からないことを先に示し、結果が分かってから示し直す扱いは、品質チェーンが QR-04 と QR-24 の競合に書いたもの。仕組みは推定
premises: [EXT-01, TC-10]
stage: architecture
question: EXT-01 が答えない、遅れて答えるときも、お金を一度だけ動かし、結果が分からない操作を確かめてから進むには
addresses: [DRV-07, DRV-32, DRV-01]
options:
  - name: お金の操作ごとに先に操作の記録を書き、その一つの操作だけを覆う冪等キーで EXT-01 に送り、答えがなければ結果が分からない状態として持ち、同じキーで送り直すか作った取引を読み直して確かめる
    effect: 何度送り直しても EXT-01 で一度しか動かず、結果が分からない操作が失敗として扱われない
    cost: 操作の記録、キー、確かめ続ける処理を持つ
  - name: 時間切れになったら新しいキーで送り直す
    effect: 作りが単純になる
    cost: 一度目が EXT-01 で済んでいれば、二重に押さえるか請求する
  - name: 時間切れになったら、このシステムの ID で EXT-01 を探してから送り直す
    effect: キーを持たずに済む
    cost: EXT-01 の探す仕組みは処理の直後の取引を見つけられないことがあり、その間に送り直すと二重になる
chosen: お金の操作ごとに先に操作の記録を書き、その一つの操作だけを覆う冪等キーで EXT-01 に送り、答えがなければ結果が分からない状態として持ち、同じキーで送り直すか作った取引を読み直して確かめる
rationale: 二つ目は二重の請求を生んで DRV-07 と DRV-32 を破り、三つ目は探す仕組みの遅れで二重になりうる。一つ目だけが DRV-32 を満たす。お金の操作（押さえ、押さえ直し、全額の確定、料金の確定、取り消し、返金）は、EXT-01 に送る前に操作の記録を書き、EXT-01 への呼び出しをまたぐ取引は作らない。キーは一つの依頼（返金は一つの返金の記録）の一つのお金の操作だけを覆い、同じ操作の送り直しは同じキーで、新しい操作（確定額が変わった後の押さえ直し、別に認めた二つ目の返金）は新しいキーで送る。一つの乗車の決済と、一つの依頼のキャンセル料か不在の料金は、それぞれ操作の記録を一つしか持てない（FR-30、FR-54）。時間切れは失敗ではなく、結果が分からない状態として持ち、待ちは最初に送った時から数える。分かるまで同じキーで送り直すか作った取引を読み直し、新しいキーでは送らない。待ちのうちに分からないとき、依頼のときの押さえは依頼を受け付けずに乗客に伝え、後で押さえが済んでいたと分かれば取り消す。押さえ直しは降りる場所を変えず、後で済んでいたと分かれば取り消す。決済は T_payment_response のうちに分からないことを示し、乗車を決済の結果待ちにして確かめ続け、分かったら示す（FR-29）。料金の確定、取り消し、返金も分かるまで確かめ続け、返金は担当者に分からないことを示す（FR-39、FR-40）。時間切れは、ドライバーの端末が決済の答えを待つ時間をサーバーが答える期限（T_payment_response のうち）より長くし、その期限を EXT-01 への一回の呼び出しの時間切れとやり直しの和より長くする
rejected:
  - option: 時間切れになったら新しいキーで送り直す
    reason: 二重に押さえるか請求し、DRV-07 と DRV-32 を破る
  - option: 時間切れになったら、このシステムの ID で EXT-01 を探してから送り直す
    reason: 探す仕組みに処理の直後の取引が現れないことがあり、DRV-32 を確かには満たさない
gains:
  - EXT-01 が答えなくても、お金は二重に動かない
  - 結果が分からない操作が、必ず結果に合わせられる
costs:
  - 結果が分からない操作を確かめ続ける処理を持つ
sensitive_points:
  - EXT-01 への呼び出しの時間切れ、同じキーでのやり直しの回数と間隔、押さえと押さえ直しを済まなかったとみなすまでの待ち、結果が分からない操作を確かめに行く間隔。長いと T_payment_response を超え、短いと結果が分からない操作が増える（値は第 3 段階、HND-05）
trade_offs:
  - with: DRV-01
    note: 待ちのうちに結果が分からない決済と押さえは、SLI-01 と SLI-06 の悪いイベントに数えられる。期限のうちに同じキーで送り直して減らすが、EXT-01 が答えない間はなくせない
assumptions:
  - EXT-01 は、同じ冪等キーの送り直しに一度目の結果を返す
depends_on: [DEC-08, DEC-09]
parameters: []
debt: null
as_is: new
