id: DEC-10
title: Stripe で手動で確定する押さえを使う
status: draft
version: 3
basis: inferred
basis_note: Stripe の振る舞いは文書から。流れは提案。Stripe のアカウントが日本で円であることは推定（質問 9 は回答なし）。Stripe に内部の ID だけを送ることは、第 3 段階の IFC-13 に合わせた。無料の取り消しにシステムの取り消し（FR-08 版 2）と、押さえの結果が分からないまま手配をやめた依頼（FR-05 版 3）が入ることは入力
needs_agreement: false
approver_candidates: []
stage: architecture
question: 押さえ、請求、キャンセル料、不在の料金、返金を Stripe でどう行うか
addresses:
- DRV-04
- DRV-30
- DRV-22
- DRV-11
- DRV-26
- DRV-21
- FND-26
options:
- name: 手配のときに、登録した支払い手段で確定した料金の額を押さえる（手動で確定する PaymentIntent）。乗車の終わりに確定し、キャンセル料と不在の料金は押さえから 500 円だけを確定して残りを解放し、無料の取り消し（許諾の前の取り消し、迎車の遅れ、T_request_max でのシステムの取り消し）と、押さえの結果が分からないまま手配や変更をやめたときに残っていた押さえは取り消す。返金は確定した支払いへの返金。カードは Stripe の入力部品で登録する（SetupIntent）。Webhook は使わない。Stripe に送る個人の情報は内部の ID だけにする（顧客にはアカウントの ID だけを入れ、メールアドレスと名前を送らない。メタデータは依頼の ID とお金の操作の ID だけ。カードの入力部品は請求先の名前、メールアドレス、住所を集めない）
  effect: 一つの押さえは一回しか確定できない（Stripe が保証）ので、同じ押さえへの二重の請求が仕組みとして起きない。額はサーバーが決める
  cost: 押さえは既定で 7 日で取り消されるので、確定はその前に終える
- name: 押さえずに、乗車の終わりに請求する
  effect: 単純
  cost: FR-05（手配のときに押さえる）を満たさない
- name: 支払いごとに Stripe のホストされた支払いの画面を出す
  effect: カードの扱いを任せられる
  cost: 降車のときに乗客の操作が要り、FR-29 を満たさない
chosen: 手配のときに、登録した支払い手段で確定した料金の額を押さえる（手動で確定する PaymentIntent）。乗車の終わりに確定し、キャンセル料と不在の料金は押さえから 500 円だけを確定して残りを解放し、無料の取り消し（許諾の前の取り消し、迎車の遅れ、T_request_max でのシステムの取り消し）と、押さえの結果が分からないまま手配や変更をやめたときに残っていた押さえは取り消す。返金は確定した支払いへの返金。カードは Stripe の入力部品で登録する（SetupIntent）。Webhook は使わない。Stripe に送る個人の情報は内部の ID だけにする（顧客にはアカウントの ID だけを入れ、メールアドレスと名前を送らない。メタデータは依頼の ID とお金の操作の ID だけ。カードの入力部品は請求先の名前、メールアドレス、住所を集めない）
rationale: DRV-04 と原則 DRV-30 を Stripe の仕組みで支える。DRV-22 は入力部品で満たし、カード情報はサーバーを通らない。決済の組み込みは初めて（PC-03、DRV-26）なので、Stripe の標準の流れに寄せ、Webhook を受ける入口を作らない（DEC-13）。TC-10 のテスト環境で動く。Stripe に送るものを内部の ID だけにすると、データベースを消した後の Stripe の記録は誰にも結び付かない（DRV-21。DEC-36）。版 1 は顧客に何を入れるかを決めていなかった（FND-26）
rejected:
- option: 押さえずに、乗車の終わりに請求する
  reason: FR-05 と DRV-04 を満たさない
- option: 支払いごとに Stripe のホストされた支払いの画面を出す
  reason: FR-29 を満たさない
gains:
- 同じ押さえへの二重の確定が起きない
- カード情報がシステムを通らない
- Stripe の記録は内部の ID にしか結び付かない
costs:
- 押さえの期限（既定で 7 日）の前に確定を終える必要がある
sensitive_points:
- 押さえの期限（7 日）
- 応答のない確定の扱い（DEC-12）
trade_offs: []
assumptions:
- Stripe のアカウントは日本で、請求は円
- テスト環境のカードで押さえと確定ができる
- カードの入力部品は、請求先の名前、メールアドレス、住所を集めない設定にできる（第 3 段階で確かめる）
depends_on:
- DEC-08
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: Stripe に送る個人の情報を内部の ID だけにした（顧客にメールアドレスと名前を送らず、入力部品は請求先の情報を集めない）。DRV-21 を対象に加えた
  reason: FND-26 を受け入れた（第 2 段階の再実行、3 回目）。第 3 段階の IFC-13 に合わせた
- version: 3
  date: '2026-11-03'
  change: 押さえを取り消す場合に、T_request_max でのシステムの取り消しと、押さえの結果が分からないまま手配や変更をやめたときに残っていた押さえを足した
  reason: 品質チェーンの再実行（FR-05 版 3、FR-08 版 2、FR-12 版 4、QR-09 版 5）と、第 1 段階の 3 回目の再実行（DRV-04 版 4）に追随した（第 2 段階の再実行、4 回目）
