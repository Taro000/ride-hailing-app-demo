id: DEC-23
title: 境界の SLI はサーバーの入口で、利用者の側の SLI は相手の端末の知らせで、データの SLI は保存した記録で出来事を見る
status: active
basis: inferred
basis_note: SLI-01〜SLI-06 の見る位置（システムの境界）、SLI-14 の見る位置（利用者の側）と FR-53、SLI-08〜SLI-13 の見る位置（データ）、試験用のアカウントと模擬の利用を分けて数えること（QR-47、FR-42）は入力。見る場所の置き方は推定。各 SLI をどのインタフェースかデータに結び付けるかは第 3 段階が決める
premises: [OPF-01]
stage: architecture
question: 品質チェーンの SLI が数える出来事を、それぞれの見る位置でどこから得るか
addresses: [DRV-25, DRV-26, DRV-27]
options:
  - name: サーバーが入口で操作と知らせごとに結果、失敗の出どころ、端末の冪等キー、試験用のアカウントか模擬の利用かを記録し、相手の端末は変化を示した時刻と示せなかったことを送り、データの SLI は保存した記録の時刻と値から数える
    effect: ローカルでも想定の本番でも、どの SLI も定義どおりの出来事を得る
    cost: 入口で記録し、端末が示した時刻を送る仕組みを作る
  - name: 境界の SLI をプラットフォームのロードバランサーの記録で数える
    effect: 入口で記録する仕組みを持たない
    cost: 失敗の出どころ、送り直しかどうか、試験用かを記録できず、ローカルにない
  - name: 模擬の利用で外から確かめる
    effect: 利用者がいなくても数えられる
    cost: どの SLI の見る位置とも違う
chosen: サーバーが入口で操作と知らせごとに結果、失敗の出どころ、端末の冪等キー、試験用のアカウントか模擬の利用かを記録し、相手の端末は変化を示した時刻と示せなかったことを送り、データの SLI は保存した記録の時刻と値から数える
rationale: 三つ目は SLI の見る位置と違い、二つ目は SLI-01〜SLI-06 の数え方の規則（失敗の出どころ、送り直し、試験用）を満たせずローカルにない（DRV-15）。一つ目の境界の出来事は、失敗の出どころをシステム自身、EXT-01、EXT-02 に分け、同じキーの送り直しを一つにまとめられる（DRV-25）。相手の端末は、変化を画面、一覧、知らせに示した時刻を、つながっていない間はためて送り、サーバーはつながっていない相手へ示せなかったことを記録する（FR-53、DRV-26）。データの SLI は、位置と測った時刻（DEC-07）、お金の操作（DEC-10）、評価とまとめた評価（DEC-24）、依頼の経過（FR-45）の記録から数える（DRV-27）。どの記録も、その時点で試験用のアカウントによるものかを残す（FR-42）
rejected:
  - option: 境界の SLI をプラットフォームのロードバランサーの記録で数える
    reason: SLI-01〜SLI-06 の数え方の規則を満たせず、ローカルにない（DRV-15）
  - option: 模擬の利用で外から確かめる
    reason: SLI の見る位置と違う
gains:
  - どの SLI も、定義どおりの出来事をこのシステムの記録から得る
costs:
  - 入口の記録と、端末が示した時刻の送り返しを作る
sensitive_points: []
trade_offs: []
assumptions:
  - 相手の端末の時計とサーバーの時計の差は、示した時刻を比べられる程度にそろえられる
depends_on: [DEC-06, DEC-19]
parameters: []
debt: null
as_is: new
