id: DEC-27
title: GitHub Actions の手順だけで配備し、データベースに触れる段は運用のジョブで動かし、手順の中で確かめる
status: draft
version: 4
basis: inferred
basis_note: TC-14 は入力。期間の開け閉めは質問 1 の答えから、システムを終える手順は質問 13 の答えから。データベースに触れる段を運用のジョブで動かすことは質問 21、期間の終わりを毎日の処理が決めることは質問 23 で確認済み。手順のほかの部分と確かめは提案（質問 15 は回答なし）
needs_agreement: false
approver_candidates: []
stage: architecture
question: 変更をどう出し、どう戻し、データベースの構造をどう変えるか
addresses:
- DRV-16
- DRV-15
- DRV-18
- DRV-17
- DRV-04
- DRV-29
options:
- name: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める、デモを開く・閉じる、戻す、期間を強いて終える、システムを終える（DEC-36）を手順にする。手順はデータベースの資格情報を持たず、データベースに触れる段（構造の変更、配備の記録、閉じる前と終える前の数え、Turso が答えるかの確かめ）は、同じイメージの運用のコマンドを運用のジョブ（DEC-34）で動かし、鍵を置かない連携で起こしてタスクの終わりの符号を読む。サービスのイメージを替える手順（デモを開く、戻す）は、同じ実行で毎日の処理のジョブと運用のジョブも同じイメージに替え、配備の記録に残す。期間を始める手順は Turso が答えるかを確かめ、定時の起動を通してジョブを一度動かす。閉じる手順は DEC-37 の確かめを通ってから進み、最後の回なら印を残す。期間の終わりはふだん毎日の処理が決める（DEC-37）。配備の記録には、版、時刻、含まれる変更とその種類、各変更の最初のコミットの時刻と main に入って CI が通った時刻（FR-41 版 3。QIU-28〜30 の測り終わり）、デモの回を開いた時刻と閉じた時刻（閉じる操作が途中で失敗したときはそのことと時刻。FR-41 版 4。SLI-03 が使う）を残す。配備の記録が指すイメージ（今と一つ前）は消さない。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入り、手順が使う外部のアクションはコミットで固定し、配備するのはゲートを通ったダイジェストだけにする
  effect: 手作業のない配備と、版をまたいで動く構造。サービスとジョブの版がずれない。人が一段飛ばしても手順が止まる。公開のリポジトリの CI がデータを読めない
  cost: 手順と確かめを作る手間。データベースに触れる段ごとにジョブの実行を待つ
- name: Cloud Build の起動
  effect: GCP の中で完結
  cost: CI が二か所に分かれる
- name: 手元から配備のコマンドを打つ
  effect: 手軽
  cost: 配備の前のテストと記録と確かめを人が守ることになり、NFR-36 に反しやすい
chosen: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める、デモを開く・閉じる、戻す、期間を強いて終える、システムを終える（DEC-36）を手順にする。手順はデータベースの資格情報を持たず、データベースに触れる段（構造の変更、配備の記録、閉じる前と終える前の数え、Turso が答えるかの確かめ）は、同じイメージの運用のコマンドを運用のジョブ（DEC-34）で動かし、鍵を置かない連携で起こしてタスクの終わりの符号を読む。サービスのイメージを替える手順（デモを開く、戻す）は、同じ実行で毎日の処理のジョブと運用のジョブも同じイメージに替え、配備の記録に残す。期間を始める手順は Turso が答えるかを確かめ、定時の起動を通してジョブを一度動かす。閉じる手順は DEC-37 の確かめを通ってから進み、最後の回なら印を残す。期間の終わりはふだん毎日の処理が決める（DEC-37）。配備の記録には、版、時刻、含まれる変更とその種類、各変更の最初のコミットの時刻と main に入って CI が通った時刻（FR-41 版 3。QIU-28〜30 の測り終わり）、デモの回を開いた時刻と閉じた時刻（閉じる操作が途中で失敗したときはそのことと時刻。FR-41 版 4。SLI-03 が使う）を残す。配備の記録が指すイメージ（今と一つ前）は消さない。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入り、手順が使う外部のアクションはコミットで固定し、配備するのはゲートを通ったダイジェストだけにする
rationale: TC-14 の CI に配備と開け閉めをまとめ、DRV-16（NFR-34〜36）と DRV-15 を満たす。DEC-05・06 の開け閉め（DRV-18）も同じ手順に置ける。鍵を置かない連携で、公開のリポジトリに長く使える鍵を置かない（DRV-29）。版 2 は構造の変更のための読み書きのトークンを手順に渡していたので、公開のリポジトリの CI が全員の個人情報を読めた。データベースに触れる段を運用のジョブに移すと、トークンは GCP の中のサービスアカウントだけが読む（DEC-34。FND-19、質問 21）。「終わっていない依頼」の決まりもドメインのコード一か所に置ける（第 3 段階の DEC-53）。ジョブとサービスは同じコードで同じ表を書くので、版を一緒に替える（NFR-35 は一つ前の版だけを確かめる。FND-14）。運用者は一人なので、閉じる前の確かめ（DEC-37）と、期間を始めるときの確かめは手順の中に置き、期間の終わりは毎日の処理が決める（FND-05、06、22）
rejected:
- option: Cloud Build の起動
  reason: DRV-26 で負ける（CI が二か所）
- option: 手元から配備のコマンドを打つ
  reason: DRV-16 の NFR-36 に反しやすく、DRV-04 の確かめを人が守ることになる
gains:
- 手作業のない配備
- 戻しが一つの操作
- 開け閉めが手順になり、確かめが手順の中にある
- サービスとジョブの版がずれない
- 手順がデータベースの資格情報を持たない
costs:
- 手順と確かめを作る手間
- データベースに触れる段ごとに運用のジョブの実行を待つ
sensitive_points:
- 構造の変更を二つの版に分けること（NFR-35）
- サービスと二つのジョブのイメージを一緒に替えること
- 配備の記録が指すイメージを消さないこと（消すとジョブが起動できない。DEC-17 の規則が知らせる）
- 運用のコマンドの終わりの符号（0 は済み、10 は残りがある、20 は Turso に届かない、1 はそのほかの失敗。第 3 段階の IFC-10）
- 配備できる者は、サービスアカウントで動くコード（データを読むコードも）を配備できる。連携の条件（main の枝だけ）、外部のアクションの固定、ダイジェストだけの配備で抑え、残りは危険として持つ
trade_offs:
- with: DRV-26
  note: 運用のジョブの実行を待つ分だけ、手順が長くなる
assumptions:
- Workload Identity Federation で GitHub Actions から GCP に入れる
- Cloud Scheduler の起動を手順から一度動かせる
- Cloud Run のジョブは実行ごとに引数を替えて動かせ、タスクの終わりの符号を読める（Cloud Run の文書）
- Turso の保管からの戻しは開発者の手元のログインで行う（ELM-22、DEC-34）
