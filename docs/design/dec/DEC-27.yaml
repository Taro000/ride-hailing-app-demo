id: DEC-27
title: 乗客とドライバーの連絡は、配車が確定してから乗車が始まるまで、サーバーを通るアプリの中のメッセージで行う
status: active
basis: inferred
basis_note: 配車が確定してから乗車が始まるまで、その依頼の乗客とドライバーがシステムを通じて連絡でき、取り消しか乗車の後は連絡できないこと（FR-11）は入力。手段は FR-11 の basis_note と設計の第 1 段階が第 2 段階に任せた点で、推定
premises: [CON-06]
stage: architecture
question: 乗客とドライバーが、合流のためにシステムを通じて連絡を取り合う手段を何にするか
addresses: [FR-11, DRV-29, DRV-34]
options:
  - name: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れる
    effect: 互いの連絡先を知らずに連絡でき、取り消しか乗車の後はサーバーが送らない
    cost: 運転中のドライバーがメッセージを読むことになる
  - name: 互いの電話番号を示す
    effect: 電話ですぐ話せる
    cost: 連絡先が相手に残り、乗車の後も連絡できる
  - name: 番号を隠して電話をつなぐ外部のサービスを使う
    effect: 連絡先を知らずに電話で話せる
    cost: 外部のサービスと費用が増える
chosen: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れる
rationale: 二つ目は連絡先を相手に渡し、乗車の後も連絡でき、FR-11 と QR-57 に反する。三つ目は外部のサービスと費用が増える（DRV-16）。一つ目はサーバーが送れる期間を決め（FR-11）、メッセージは流れ（DEC-06）で届き、見せる範囲は DEC-15 の決まりによる。メッセージは個人の情報を含みうるため、保存では暗号にする（DEC-16）
rejected:
  - option: 互いの電話番号を示す
    reason: 連絡先が相手に残り、FR-11 の連絡できなくなることと QR-57 に反する
  - option: 番号を隠して電話をつなぐ外部のサービスを使う
    reason: 外部のサービスと費用が増え、DRV-16 で劣る
gains:
  - 互いの連絡先を知らずに合流のための連絡ができる
costs:
  - 運転中の読み書きを避けるよう、決まった短い文で済むようにする
sensitive_points: []
trade_offs: []
assumptions: []
depends_on: [DEC-06, DEC-15]
parameters: []
debt: null
as_is: new
