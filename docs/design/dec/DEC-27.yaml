id: DEC-27
title: GitHub Actions の手順だけで配備し、期間とデモを開け閉めする
status: draft
version: 1
basis: inferred
basis_note: TC-14 は入力。期間の開け閉めは質問 1 の答えから。手順は提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: 変更をどう出し、どう戻し、データベースの構造をどう変えるか
addresses:
- DRV-16
- DRV-15
- DRV-18
- DRV-17
options:
- name: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める・終える、デモを開く・閉じる、戻すを手順にする。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入る
  effect: 手作業のない配備と、版をまたいで動く構造
  cost: 手順を作る手間
- name: Cloud Build の起動
  effect: GCP の中で完結
  cost: CI が二か所に分かれる
- name: 手元から配備のコマンドを打つ
  effect: 手軽
  cost: 配備の前のテストと記録を人が守ることになり、NFR-36 に反しやすい
chosen: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める・終える、デモを開く・閉じる、戻すを手順にする。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入る
rationale: TC-14 の CI に配備と開け閉めをまとめ、DRV-16（NFR-34〜36）と DRV-15 を満たす。DEC-05・06 の開け閉め（DRV-18）も同じ手順に置ける。鍵を置かない連携で、公開のリポジトリに長く使える鍵を置かない（DRV-29）
rejected:
- option: Cloud Build の起動
  reason: DRV-26 で負ける（CI が二か所）
- option: 手元から配備のコマンドを打つ
  reason: DRV-16 の NFR-36 に反しやすい
gains:
- 手作業のない配備
- 戻しが一つの操作
- 開け閉めが手順になる
costs:
- 手順を作る手間
sensitive_points:
- 構造の変更を二つの版に分けること（NFR-35）
trade_offs: []
assumptions:
- Workload Identity Federation で GitHub Actions から GCP に入れる
