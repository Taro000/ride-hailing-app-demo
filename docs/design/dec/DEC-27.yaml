id: DEC-27
title: 乗客とドライバーの連絡は、配車が確定してから乗車が始まるまで、サーバーを通るアプリの中のメッセージで行い、車が走っている間はドライバーに送らせず中身も示さない
status: active
basis: inferred
basis_note: 配車が確定してから乗車が始まるまで、その依頼の乗客とドライバーがシステムを通じて連絡でき、取り消しか乗車の後は連絡できないこと（FR-11）は入力。手段は FR-11 の basis_note と設計の第 1 段階が第 2 段階に任せた点で、推定。迎車のために運転しているドライバーにメッセージを読み書きさせる安全のリスクを比べに加え、車が走っている間はドライバーに送らせず中身も示さない案を下書きしたのは FND-02 による。そのリスクの扱い（事業の判断）は、走っている間はドライバーからは送れず、中身は止まってから示し、乗客にはそのことを示すと質問 4 で確認済み（下書きどおり）。走っている間の連絡を止めることは FR-11 の連絡できる場面を狭めるため、品質チェーンに QCR-04 で求める（回答済みで、品質チェーンが反映するまで前提に残す）
premises: [CON-06, QCR-04]
stage: architecture
question: 乗客とドライバーが、合流のためにシステムを通じて連絡を取り合う手段を何にし、迎車のために運転しているドライバーにどう使わせるか
addresses: [FR-11, DRV-29, DRV-34]
options:
  - name: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れ、車が走っている間（DEC-22 と同じサーバーの判断）は、ドライバーからは送れず、ドライバーの画面には届いたことだけを示して中身は止まってから示す
    effect: 互いの連絡先を知らずに連絡でき、迎車のために運転しているドライバーにメッセージを読み書きさせない
    cost: 走っている間のドライバーからは返事が来ず、乗客は止まるまで待つ
  - name: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れ、走っている間もドライバーが読み書きできる
    effect: ドライバーはいつでもすぐに返事ができる
    cost: 運転中のドライバーがメッセージを読み書きし、前への注意がそれる
  - name: 互いの電話番号を示す
    effect: 電話ですぐ話せる
    cost: 連絡先が相手に残り、乗車の後も連絡できる
  - name: 番号を隠して電話をつなぐ外部のサービスを使う
    effect: 連絡先を知らずに電話で話せ、ドライバーは画面を読まずに話せる
    cost: 外部のサービスと費用が増える
chosen: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れ、車が走っている間（DEC-22 と同じサーバーの判断）は、ドライバーからは送れず、ドライバーの画面には届いたことだけを示して中身は止まってから示す
rationale: 二つ目は迎車のために運転しているドライバーにメッセージを読み書きさせ、QIU-17 が依頼を選ぶ操作と許諾について挙げた危険（走りながら画面を見て操作し、前への注意がそれる）を連絡で生む。品質チェーンはその危険を FR-22 で依頼を選ぶ操作と許諾について止めている。三つ目は連絡先を相手に渡し、乗車の後も連絡でき、FR-11 と QR-57 に反する。四つ目は外部のサービスと費用が増える（DRV-16）。一つ目は、サーバーが送れる期間を決め（FR-11）、車が走っている間はドライバーからのメッセージを受け付けず、ドライバーの画面に中身を示さない。走っているかは DEC-22 と同じくサーバーが端末の速さと位置から決め、分からなければ走っているものとする。乗客には、ドライバーが止まってから読むことを示す。合流のための連絡が要るのは乗る場所の近くで、車は止まっているか遅くなっているため、FR-11 の連絡はそこで取れる（FR-11 の品質のヒントは QIU-08）。迎車の到着はサーバーが位置から決めて知らせる（DEC-07）ため、ドライバーが走りながら着いたことを伝える必要はない。メッセージは流れ（DEC-06）で届き、見せる範囲は DEC-15 の決まりによる。メッセージは個人の情報を含みうるため、保存では暗号にする（DEC-16）
rejected:
  - option: サーバーを通るアプリの中のメッセージ（決まった短い文を含む）で、配車が確定してから乗車が始まるまでだけ送れ、走っている間もドライバーが読み書きできる
    reason: 運転中のドライバーにメッセージを読み書きさせ、走っている間の操作を止める扱い（FR-22、QIU-17）と同じ危険を受け入れることになる
  - option: 互いの電話番号を示す
    reason: 連絡先が相手に残り、FR-11 の連絡できなくなることと QR-57 に反する
  - option: 番号を隠して電話をつなぐ外部のサービスを使う
    reason: 外部のサービスと費用が増え、DRV-16 で劣る
gains:
  - 互いの連絡先を知らずに合流のための連絡ができる
  - 迎車のために運転しているドライバーに、メッセージを読み書きさせない
costs:
  - 走っている間のドライバーからは返事が来ず、乗客は止まるまで待つ
  - 走っているかの判断（DEC-22）が誤って止まっているとすると、走っている間に中身が示される
sensitive_points:
  - 走っているかの判断に使う速さと位置の新しさと、速さがないときの扱い。緩いと走り出した直後に中身を示し、厳しいと止まっているのに送れない（値は第 4 段階、HND-09）
trade_offs: []
assumptions:
  - ドライバーの端末は、迎車中もアプリが画面に出ている間、位置と速さを測ってサーバーに送れる（DEC-07、DEC-22）
depends_on: [DEC-06, DEC-15, DEC-22]
parameters: []
debt: null
as_is: new
