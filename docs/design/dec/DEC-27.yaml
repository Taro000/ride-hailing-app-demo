id: DEC-27
title: GitHub Actions の手順だけで配備し、期間とデモを開け閉めし、手順の中で確かめる
status: draft
version: 2
basis: inferred
basis_note: TC-14 は入力。期間の開け閉めは質問 1 の答えから、システムを終える手順は質問 13 の答えから。手順と確かめは提案（質問 15 は回答なし）
needs_agreement: false
approver_candidates: []
stage: architecture
question: 変更をどう出し、どう戻し、データベースの構造をどう変えるか
addresses:
- DRV-16
- DRV-15
- DRV-18
- DRV-17
- DRV-04
options:
- name: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める・終える、デモを開く・閉じる、戻す、システムを終える（DEC-36）を手順にする。サービスのイメージを替える手順（デモを開く、戻す）は、同じ実行でジョブも同じイメージに替え、配備の記録に両方を残す。期間を始める手順は Turso が答えるかを確かめ、定時の起動を通してジョブを一度動かす。閉じる手順と期間を終える手順は DEC-37 の確かめを通ってから進む。配備の記録が指すイメージ（今と一つ前）は消さない。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入る
  effect: 手作業のない配備と、版をまたいで動く構造。サービスとジョブの版がずれない。人が一段飛ばしても手順が止まる
  cost: 手順と確かめを作る手間
- name: Cloud Build の起動
  effect: GCP の中で完結
  cost: CI が二か所に分かれる
- name: 手元から配備のコマンドを打つ
  effect: 手軽
  cost: 配備の前のテストと記録と確かめを人が守ることになり、NFR-36 に反しやすい
chosen: GitHub Actions の手順（ELM-06）だけで配備する。main への変更ごとにゲートを通ったイメージを作って Artifact Registry に置く。期間を始める・終える、デモを開く・閉じる、戻す、システムを終える（DEC-36）を手順にする。サービスのイメージを替える手順（デモを開く、戻す）は、同じ実行でジョブも同じイメージに替え、配備の記録に両方を残す。期間を始める手順は Turso が答えるかを確かめ、定時の起動を通してジョブを一度動かす。閉じる手順と期間を終える手順は DEC-37 の確かめを通ってから進む。配備の記録が指すイメージ（今と一つ前）は消さない。構造の変更は二つの版に分け、一つ前の版の自動テストを新しい構造で動かす。GCP へは鍵を置かない連携で入る
rationale: TC-14 の CI に配備と開け閉めをまとめ、DRV-16（NFR-34〜36）と DRV-15 を満たす。DEC-05・06 の開け閉め（DRV-18）も同じ手順に置ける。鍵を置かない連携で、公開のリポジトリに長く使える鍵を置かない（DRV-29）。ジョブとサービスは同じコードで同じ表を書くので、版を一緒に替える（NFR-35 は一つ前の版だけを確かめる。FND-14）。運用者は一人なので、閉じる前と終える前の確かめ（DEC-37）と、期間を始めるときの確かめは、手順の中に置く（FND-05、06）
rejected:
- option: Cloud Build の起動
  reason: DRV-26 で負ける（CI が二か所）
- option: 手元から配備のコマンドを打つ
  reason: DRV-16 の NFR-36 に反しやすく、DRV-04 の確かめを人が守ることになる
gains:
- 手作業のない配備
- 戻しが一つの操作
- 開け閉めが手順になり、確かめが手順の中にある
- サービスとジョブの版がずれない
costs:
- 手順と確かめを作る手間
sensitive_points:
- 構造の変更を二つの版に分けること（NFR-35）
- サービスとジョブのイメージを一緒に替えること
- 配備の記録が指すイメージを消さないこと（消すとジョブが起動できない。DEC-17 の規則が知らせる）
trade_offs: []
assumptions:
- Workload Identity Federation で GitHub Actions から GCP に入れる
- Cloud Scheduler の起動を手順から一度動かせる
- Turso の保管からの戻しは開発者の手元のログインで行う（ELM-22、DEC-34）
depends_on:
- DEC-05
- DEC-06
- DEC-17
- DEC-37
