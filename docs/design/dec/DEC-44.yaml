  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "account_kind の値に staff を足し、SLI-01 での扱いを書いた。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。FND-41 を受け入れた（ログの仕様書と値をそろえた）"
