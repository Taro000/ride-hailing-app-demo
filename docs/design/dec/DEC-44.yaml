id: DEC-44
title: ログとトレース
status: draft
version: 2
basis: inferred
basis_note: DEC-18、DEC-16、Cloud Run の文書（X-Cloud-Trace-Context の値で入口のログに結ぶ方法、traceparent が要求に入ること）は入力。ブラウザのトレース ID を入口のログが使うかは文書にない。見出しを二つ送る形と欄は推定
needs_agreement: false
approver_candidates: []
stage: high-level-design
question: 一つの操作の記録をどうつなぎ、ログに何を書き、何を書かないか
addresses:
- IFC-09
- IFC-20
- DEC-18
- DEC-16
- DRV-28
- DRV-27
- DRV-32
options:
- name: "ブラウザが traceparent と X-Client-Trace-Id を送り、サーバーは Cloud Run が渡す X-Cloud-Trace-Context を logging.googleapis.com/trace と spanId に、ブラウザの ID を client_trace_id に書く。どの行にも: timestamp、severity、message、logging.googleapis.com/trace、logging.googleapis.com/spanId、client_trace_id、event、schema_version、service（server か batch）、app_version。要求の行（request.completed）に: route_id、method、status、elapsed_ms、account_id、account_kind（participant、staff、test。SLI-01 は participant だけを数え、test を除く。staff は SLI-01 の操作を呼ばない）、ride_id。書かない: 座標、連絡先、名前、場所の検索の語、自由記述（苦情、報告）、カードの情報、クッキー、トークン、秘密、Webhook の URL、要求と応答の本文、IP アドレス（入口のログには残る）。重さ: DEBUG、INFO、WARNING、ERROR（知らせの対象は ERROR）"
  effect: Cloud Run がブラウザのトレース ID を入口のログに使っても使わなくても、入口のログ、アプリのログ、ブラウザの記録を結べる
  cost: 見出しが一つ増える
- name: traceparent だけに頼る
  effect: 見出しが一つ
  cost: Cloud Run がブラウザのトレース ID を入口のログに使うことは文書に書かれていない（文書は traceparent が入ることだけを書く）。使わなければ結べない
- name: 独自の見出しだけ
  effect: 思いどおりの ID
  cost: 入口のログには残らず、SLI-01 のテスト用アカウントの除外ができない
chosen: 'ブラウザが traceparent と X-Client-Trace-Id を送り、サーバーは Cloud Run が渡す X-Cloud-Trace-Context を logging.googleapis.com/trace と spanId に、ブラウザの ID を client_trace_id に書く。どの行にも: timestamp、severity、message、logging.googleapis.com/trace、logging.googleapis.com/spanId、client_trace_id、event、schema_version、service（server か batch）、app_version。要求の行（request.completed）に: route_id、method、status、elapsed_ms、account_id、account_kind（participant、staff、test。SLI-01 は participant だけを数え、test を除く。staff は SLI-01 の操作を呼ばない）、ride_id。書かない: 座標、連絡先、名前、場所の検索の語、自由記述（苦情、報告）、カードの情報、クッキー、トークン、秘密、Webhook の URL、要求と応答の本文、IP アドレス（入口のログには残る）。重さ: DEBUG、INFO、WARNING、ERROR（知らせの対象は ERROR）'
rationale: DEC-18 の応答を左右する点（入口のログに同じトレース ID が残る見出しの形）を、文書で確かめられない部分があっても成り立つ形にした。Cloud Run の文書はコンテナのログを X-Cloud-Trace-Context の値で入口の要求のログに結ぶ方法を示す
rejected:
- option: traceparent だけに頼る
  reason: 確かめられない前提に頼る
- option: 独自の見出しだけ
  reason: 入口のログと結べない
gains:
- 入口、サーバー、外部の呼び出し、ブラウザの記録が同じ ID でたどれる（FR-37）
- SLI-01 の除外を (trace, spanId) で結べる（DEC-16）
costs:
- 最初の配備で、入口のログの trace がブラウザの ID と同じかを確かめる
sensitive_points:
- 書かないものの一覧を CI で確かめること（NFR-40）
trade_offs: []
assumptions:
- Cloud Run の入口の要求のログは trace と spanId を持つ（最初の配備で確かめる）
depends_on:
- DEC-18
- DEC-16
parameters: []
debt: null
deferred: false
revisit_when: 最初の配備で、入口のログの trace がブラウザの ID と違ったとき（違えば client_trace_id で結ぶ）
as_is: new
changelog:
