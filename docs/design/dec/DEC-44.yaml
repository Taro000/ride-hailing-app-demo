id: DEC-44
title: 経路は /v1/ の後の kebab-case の複数形の名詞、項目は camelCase、符号は UPPER_SNAKE_CASE とし、個人の情報は経路と問い合わせに入れない
status: active
basis: inferred
basis_note: インタフェースの名前の付け方は、第 3 段階の確定の種類（推定）。個人の情報をログと URL に残さないことは QR-58 と DEC-15（入力）からの推定
premises: []
stage: high-level-design
question: 経路、項目、列挙の値、符号、流れの出来事の種類、操作の名前をどう名付け、個人の情報をどこに置くか
addresses: [DRV-12, DRV-29, DRV-34]
options:
  - name: 経路は kebab-case の複数形の名詞と名詞の下位の資源、項目は camelCase、列挙は lower_snake_case、符号は UPPER_SNAKE_CASE、出来事は「資源.出来事」
    effect: 生成した型（DEC-33）が TypeScript の書き方にそろい、経路から操作の対象が読める
    cost: 動詞の操作も名詞の資源として名付ける
  - name: 経路を動詞で名付ける（/v1/cancelRide など）
    effect: 操作がそのまま読める
    cost: 資源と操作の区別がなくなり、同じ資源の読み書きが散らばる
chosen: 経路は /v1/ の後に小文字の kebab-case の複数形の名詞を置き、操作は名詞の下位の資源（/cancellation、/acceptance、/payment）で表す。担当者とエンジニアの操作は /v1/console/ の下、日々の呼び出しは /internal/ の下、生存確認は /healthz に置く。JSON の項目は camelCase、列挙の値は lower_snake_case、誤りの符号は UPPER_SNAKE_CASE、流れの出来事と Web Push の種類は「資源.出来事」の lower_snake_case（ride.accepted、offer.removed）、操作の名前（operationId）は camelCase の動詞から始める。個人の情報（名前、連絡先、場所、位置、探す文字）は経路にも問い合わせの文字列にも入れず、本文で送る
rationale: 二つ目は資源の読み書きが散らばり、依頼の状態の変化（DEC-08）が経路から読めない。一つ目は、依頼の状態の変化を依頼の下位の資源として並べ、生成した型（DEC-33、POL-05）が TypeScript の書き方とそろう。個人の情報を経路と問い合わせに入れないのは、アクセスのログ、ブラウザの履歴、プラットフォームの要求のログに残らないようにするため（DRV-29、QR-58）
rejected:
  - option: 経路を動詞で名付ける（/v1/cancelRide など）
    reason: 資源と操作の区別がなくなり、依頼の状態の変化が経路から読めず DRV-12 の変更のとどめ方を弱める
gains:
  - 経路から操作の対象が読め、生成した型が書き方にそろう
  - 個人の情報が URL とアクセスのログに残らない
costs:
  - 動詞の操作も名詞の資源として名付ける
sensitive_points: []
trade_offs: []
assumptions: []
depends_on: [DEC-15, DEC-33]
parameters: []
debt: null
as_is: new
