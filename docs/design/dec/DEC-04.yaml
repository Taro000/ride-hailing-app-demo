id: DEC-04
title: 時刻で決まる規則を、期限の時刻と見回りで判定する
status: draft
version: 1
basis: inferred
basis_note: 期限の名前は FR-07・08・27（入力）。判定の仕方と見回りの間隔は提案
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: 時刻で決まる規則（T_match_wait、T_noshow_wait、T_cancel_grace、受付中の古さ、結果が分からない操作の確かめ）をどこで判定するか
addresses:
- DRV-05
- DRV-04
- DRV-18
- DRV-33
- DRV-15
options:
- name: 期限は依頼に時刻として持ち、操作と読み出しのときにその場で判定し、加えてサーバーが P_sweep ごとに見回る。時刻で起きる変化もほかの変化と同じ条件付きの書き込み（DEC-09）にし、二度起きても一度だけ効く
  effect: サーバーが止まっていても次の操作か見回りで正しく判定される。インスタンスが二つでも安全
  cost: 見回りのためにインスタンス単位の課金が要る
- name: 期限ごとに Cloud Tasks の遅らせた呼び出しを置く
  effect: 決まった時刻に呼ばれ、やり直しもある
  cost: 呼び出し先のサービスはデモの回にしかない（DEC-06）。サービスと権限が増える
- name: 画面の時計で判定する
  effect: サーバーが要らない
  cost: ブラウザは信用できず（DRV-29）、キャンセル料の判定を任せられない
chosen: 期限は依頼に時刻として持ち、操作と読み出しのときにその場で判定し、加えてサーバーが P_sweep ごとに見回る。時刻で起きる変化もほかの変化と同じ条件付きの書き込み（DEC-09）にし、二度起きても一度だけ効く
rationale: お金と割り当てに関わる期限はサーバーで判定する（DRV-29、原則 DRV-30）。判定のもとを時刻にしておけば、サーバーが止まっていた間の分も次の判定で正しくなる（原則 DRV-33、TC-08）。見回りと操作が同じ変化を同時に起こしても条件付きの書き込みで一度だけになる（DRV-05）。時計を差し替えれば実時間を待たずに確かめられる（DRV-15、DEC-25）
rejected:
- option: 期限ごとに Cloud Tasks の遅らせた呼び出しを置く
  reason: 呼び出し先がデモの回にしかなく（TC-07）、サービスと権限が増える（DRV-26）
- option: 画面の時計で判定する
  reason: DRV-29 と DRV-30 に反する
gains:
- サーバーが止まっていても期限の判定が正しい
- 二つのインスタンスで見回りが重なっても安全
costs:
- 見回りのための CPU（インスタンス単位の課金。DEC-02）
sensitive_points:
- 見回りの間隔 P_sweep
trade_offs: []
assumptions:
- 期限の値（T_match_wait など）は分の単位（値は第 1 段階から未定）
depends_on:
- DEC-02
- DEC-09
parameters:
- name: P_sweep（時刻の見回りの間隔）
  value: 5 秒
  basis: 期限は分の単位（FR-07、08、27）で、5 秒のずれは小さい
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
