id: DEC-24
title: 依頼を届ける相手の規則は、届けるとき、示すとき、許諾を受けるときのどれでも、その時点の値でサーバーが当てる
status: active
basis: inferred
basis_note: 規則の中身は FR-05、FR-17、FR-19、FR-44、QR-63（入力）、規則と評価のまとめ方を一か所に置きどの時点でも同じ規則を使うことは DRV-35（入力）。当てる時点は推定。ドライバーの現在地から乗車場所までの距離は直線の距離として下書きし、道のりか直線かは QCR-01（未回答）を待つ。答えが来るまでは品質チェーンの今の要求のとおりに進める
premises: [QCR-01, OPF-03]
stage: architecture
question: 依頼をどのドライバーに届け、示し、許諾させるかの規則を、いつ、どの値で当てるか
addresses: [DRV-08, DRV-35, DRV-20, DRV-31]
options:
  - name: 届けるとき、一覧と内容を示すとき、許諾を受けるときに、受付、停止、登録、評価とその件数、乗客の閾値、ドライバーの条件と新しい現在地を、その時点の値でサーバーの一つの規則に当て、評価を受けた取引でまとめた評価も書き直す
    effect: 停止や条件の変更が、届いた後の一覧と許諾にもすぐ効く
    cost: 示すときと許諾のときにも規則を当てる
  - name: 届けるときだけ規則を当て、一覧と許諾はそれに従う
    effect: 規則を当てる回数が少ない
    cost: 届いた後に停止されたドライバーが許諾できる
  - name: 一覧は端末が規則に当てて絞る
    effect: サーバーの処理が少ない
    cost: 届けてよいかを端末が決める
chosen: 届けるとき、一覧と内容を示すとき、許諾を受けるときに、受付、停止、登録、評価とその件数、乗客の閾値、ドライバーの条件と新しい現在地を、その時点の値でサーバーの一つの規則に当て、評価を受けた取引でまとめた評価も書き直す
rationale: 二つ目は停止の前に一覧に届いた依頼を許諾させて QR-49 を破り、三つ目は端末が決めて DRV-31 を破る。一つ目は DRV-35 のとおり一つの規則をどの時点でも当てる。停止はその時から効き、一覧から除く出来事を流し、許諾のときにもう一度当てる（QR-49）。距離はドライバーの新しい現在地（DEC-07）から乗車場所までの直線の距離で、現在地が古ければ距離の条件のある依頼を届けない（FR-19）。QCR-01 の答えで道のりになれば、EXT-02 のつなぎ口（DEC-13）に求める。まとめた評価は受けたすべての評価の平均（FR-15）で、評価を書く取引で書き直すため、新しい評価はその時から規則に使われる（SLI-13）。規則の判断表は第 4 段階が決める
rejected:
  - option: 届けるときだけ規則を当て、一覧と許諾はそれに従う
    reason: 停止の後に許諾でき、QR-49 と DRV-08 を満たさない
  - option: 一覧は端末が規則に当てて絞る
    reason: 端末が届けてよいかを決め、DRV-31 を破る
gains:
  - 停止と条件の変更が、どの時点でもすぐ効く
  - 新しい評価がその時からマッチに使われる
costs:
  - 一覧を示すたびに規則を当てる
sensitive_points: []
trade_offs: []
assumptions:
  - ドライバーの条件の距離は、乗車場所までの直線の距離で足りる（QCR-01）
depends_on: [DEC-07, DEC-08, DEC-15]
parameters: []
debt: null
as_is: new
