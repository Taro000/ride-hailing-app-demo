id: DEC-18
title: 時刻で進む処理は期限をデータベースに書いてサーバーが繰り返し拾い、日々の処理はプラットフォームの定期の呼び出しで起こす
status: active
basis: assumed
basis_note: 時刻が来れば誰も操作していなくても、止まって再開した後でも処理が進むこと（FR-04、FR-23、FR-26、FR-51）は入力。想定の本番の Cloud Run は要求を受けている間に処理する基盤で、時刻で働く処理に別の仕組みが要ること（DRV-23 の難しさの理由）は入力。仕組みは推定。拾う間隔は、結果が分からないお金の操作の確かめも拾うためお金の道にあり、第 3 段階に送った（FND-04）。デモの回を閉じてインスタンスを 0 にした後に期限が来た処理を、次の日々の呼び出しが拾い、それまで遅れることを受け入れるのは DAS-02 による暫定の決定（FND-05）。日々の処理が保存期間を過ぎた日の鍵を捨てることは、FND-07 を受けて DEC-16 と DEC-17 に合わせて加え、日々の処理の書き方から FR-51 の期間の言い直しを外した（FND-08）
premises: [TC-08, OPF-01, CON-06, DAS-02]
stage: architecture
question: 誰も操作していなくても、サーバーが止まって再開した後でも、時刻が来た処理を一度だけ行うには
addresses: [DRV-23, DRV-21, DRV-01]
options:
  - name: 期限のある処理を期限とともにデータベースに書き、サーバーの中の繰り返しが期限の来たものを一つずつ取って行い、日々の処理は想定の本番では Cloud Scheduler が毎日サーバーを呼んで起こす
    effect: 止まって再開しても期限を失わず、インスタンスが 0 の間も日々の処理が起きる
    cost: サーバーが CPU を常に持ち、期限を拾う繰り返しを回す
  - name: 期限ごとに Cloud Tasks で呼び出しを予約する
    effect: 期限の時刻ちょうどにサーバーが呼ばれる
    cost: 別のサービスとそのローカルの代わりが要る
  - name: Cloud Scheduler が 1 分ごとにサーバーを呼び、そのたびに期限の来たものを行う
    effect: サーバーは CPU を常に持たなくてよい
    cost: 処理が最大 1 分遅れ、デモの回の外も 1 分ごとに起こす
chosen: 期限のある処理を期限とともにデータベースに書き、サーバーの中の繰り返しが期限の来たものを一つずつ取って行い、日々の処理は想定の本番では Cloud Scheduler が毎日サーバーを呼んで起こす
rationale: DRV-23 はどの案でも満たせる。二つ目は別のサービスとそのローカルの代わり（DRV-15、DRV-16）が要り、三つ目は知らせが最大 1 分遅れる。一つ目は期限をデータベースに書くので、止まって再開したサーバーは残った期限から続ける。期限の処理（許諾のない依頼の知らせと終わり、結果が分からないお金の操作の確かめ）は、取ったことをデータベースに書いてから行い、インスタンスが二つになっても一度だけ行う。時刻を過ぎたら許す操作（乗客の不在として終える、FR-26）は期限の処理を作らず、操作のときに記録した時刻と比べて決める。日々の処理（保存期間を過ぎた記録とデータを FR-51 のとおりに変えてその日の鍵を捨てること（DEC-16、DEC-17）、EXT-01 との照合、記録の欠けと取り出せる期間の確かめ）は、インスタンスが 0 の間も Cloud Scheduler が起こす。日々の処理は、インスタンスが 0 の間に期限を過ぎた処理も拾う。デモの回を閉じてインスタンスを 0 にした後に期限が来た処理（回の終わりの近くの依頼の T_no_accept、結果が分からないお金の操作の確かめ）は、それまで遅れる（DEC-05、DAS-02）。ローカルでは、日々の呼び出しをローカルの定期の呼び出しで代える（第 2b 段階が環境として決める）
rejected:
  - option: 期限ごとに Cloud Tasks で呼び出しを予約する
    reason: 別のサービスとそのローカルの代わりが要り、DRV-15 と DRV-16 で劣る
  - option: Cloud Scheduler が 1 分ごとにサーバーを呼び、そのたびに期限の来たものを行う
    reason: 知らせと終わりが最大 1 分遅れ、DRV-23 の時刻どおりに行うことを弱める
gains:
  - 止まって再開しても、待っている期限を失わない
  - 日々の処理が、デモの回の外でも行われる
costs:
  - デモの回の間、サーバーが CPU を常に持つ
  - デモの回を閉じた後に期限が来た処理は、次の日々の呼び出しまで遅れる
sensitive_points:
  - サーバーが期限の来た処理を拾う間隔。長いと T_wait_prompt と T_no_accept の知らせと終わりが遅れ、結果が分からないお金の操作を確かめる間隔（HND-05）を守れない（値は第 3 段階、HND-11）
trade_offs: []
assumptions:
  - Cloud Scheduler は、インスタンスが 0 のサービスも呼んで起こせる
depends_on: [DEC-05, DEC-17]
parameters: []
debt: null
as_is: new
