id: DEC-14
title: 担当者が渡す設定の符号で本人がパスワードを決め、サーバーのセッションで使わせる
status: active
basis: inferred
basis_note: 担当者が設定の符号を参加者に直接渡すことは TC-16（入力）。本人であることを確かめた人だけが使えることは QR-10 と FR-48（入力）。確かめ方（設定の符号で本人がパスワードを決め、以後はアカウントの ID とパスワードとサーバーのセッションで使わせる）は質問 3 で確認済み（下書きどおり。セキュリティのリスク分析の「ログインの方式」はほかの方式を求めない）。失敗が続いたときに止めることと、アカウントの ID を名前や連絡先でない値にすることは推定
premises: [TC-16, TC-13]
stage: architecture
question: 乗客、ドライバー、担当者、エンジニアが、そのアカウントの本人であることをどう確かめるか
addresses: [DRV-28, DRV-19, DRV-14, DRV-16, DRV-15]
options:
  - name: 担当者がアカウントを作ると一度だけ使える設定の符号ができ、担当者が本人に渡す。本人はその符号でパスワードを決め、以後はアカウントの ID とパスワードで使い始め、サーバーがセッションを持つ
    effect: どの iPhone とブラウザでも同じ手順で使い始められ、外部のサービスに頼らない
    cost: パスワードを持つ仕組み、失敗が続いたときに止める仕組み、符号の出し直しを作る
  - name: 設定の符号で端末にパスキーを登録させ、以後はパスキーで使い始める
    effect: 盗み見や使い回しに強い
    cost: ホーム画面に加えたアプリでのパスキーと、参加者の iPhone のパスワードの同期の設定に頼る
  - name: 外部の認証のサービスに任せ、設定の符号でこのシステムのアカウントと結び付ける
    effect: 確かめる仕組みを作らずに済む
    cost: 外部のサービスがもう一つ増え、ローカルではその代わりが要り、メールのリンクはホーム画面に加えたアプリでなく Safari で開く
chosen: 担当者がアカウントを作ると一度だけ使える設定の符号ができ、担当者が本人に渡す。本人はその符号でパスワードを決め、以後はアカウントの ID とパスワードで使い始め、サーバーがセッションを持つ
rationale: DRV-28 はどの案でも満たせる。二つ目は参加者の端末の設定に頼り（DRV-14）、三つ目は外部のサービスとそのローカルの代わり（DRV-15、DRV-16）と、メールのリンクがアプリの外で開く流れ（DRV-14）で弱い。一つ目は TC-16 の手で渡す符号をそのまま使い始めの手順にし、パスワードを忘れたときも担当者が符号を出し直す（DRV-19）。セッションはサーバーが持ち、使い終える操作でその場で終え（FR-48）、失敗が続くとそのアカウントを止める（総当たりへの備え）。アカウントの ID は名前や連絡先でない値にする。使える機能の区別は DEC-15
rejected:
  - option: 設定の符号で端末にパスキーを登録させ、以後はパスキーで使い始める
    reason: 参加者の iPhone の設定に頼り、使い始められない参加者が出うる（DRV-14）
  - option: 外部の認証のサービスに任せ、設定の符号でこのシステムのアカウントと結び付ける
    reason: 外部のサービスとそのローカルの代わりが要り（DRV-15、DRV-16）、メールのリンクがアプリの外で開く（DRV-14）
gains:
  - どの対象の端末でも同じ手順で使い始められる
  - 設定の符号を手で渡す手順（TC-16）がそのまま使い始めと出し直しになる
costs:
  - パスワードを持ち、失敗が続いたときに止める仕組みを作る
sensitive_points:
  - 失敗が続いたときに止めるまでの回数と止める時間、セッションの長さ、設定の符号の有効期間（値は第 4 段階、HND-12）
trade_offs: []
assumptions:
  - セキュリティのリスク分析の「ログインの方式」は、特定の方式を求めていない（質問 3 で確認済み）
depends_on: [DEC-01, DEC-15]
parameters: []
debt: null
as_is: new
