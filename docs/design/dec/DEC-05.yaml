id: DEC-05
title: 毎日の処理を Cloud Run のジョブにし、デモの期間だけ動かす
status: draft
version: 4
basis: inferred
basis_note: 動かし方（Cloud Scheduler と Cloud Run のジョブ、デモの期間だけ有効）は質問 1 で確認済みで、TC-07 に書かれた。デモの期間の読み方は TC-07（第 1 段階の質問 12 で確認済み）。期間の終わりの延長（DEC-37）を残すことは質問 17 で確認済みで、TC-07 に入った（第 1 段階が FND-18 を受け入れた）。期間の終わりを毎日の処理が決めて定時の起動を止めることは質問 23 で確認済み。起動の時刻は推定（質問 12 は回答なし）。期間を終える条件は DEC-37、最後の期間の後の扱いは DEC-36（質問 13 で確認済み）、ジョブの失敗の知らせは DEC-17（質問 14 で確認済み）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: architecture
question: 毎日の処理（突き合わせ、保存期間の処理、履歴の確かめ、SLI の集計、毎日の監視）を、サーバーがデモの回にしか動かないなかで、いつどこで動かすか
addresses:
- DRV-33
- DRV-04
- DRV-21
- DRV-27
- DRV-18
- DRV-26
options:
- name: サーバーと同じイメージを毎日の処理のコマンドで Cloud Run のジョブとして動かし、デモの期間だけ Cloud Scheduler が毎朝起動する。期間を始める手順は定時の起動を通して一度動かして確かめ、手でも動かせる。日ごとの終わりの記録を持ち、終わっていない日をすべて続ける。処理を終えられなかったときは失敗として終わる。期間を終えるのは DEC-37 の条件を満たしたときで、毎日の処理が自分で定時の起動を止める
  effect: デモの翌朝に突き合わせと知らせが終わる。ジョブが落ちても 8:30 より前に知らせが届く。秘密は Secret Manager、ログは Cloud Logging に置ける
  cost: 期間の始めと終わりに有効にして止める手順が要る。期間の外は動かない
- name: 同じコードの別の入口を GitHub Actions の定時実行で毎朝動かす
  effect: サーバーなしで毎朝動き、TC-14 の CI を使える
  cost: 本番の資格情報を公開のリポジトリの GitHub に置き、実行のログが誰でも読める。定時実行は遅れうるし、動きがないと止まる
- name: サーバーが動くときだけ（デモを開くときと閉じるとき）追いつく
  effect: 新しい仕組みが要らない
  cost: 次のデモまで動かず、確定できなかった押さえが期限（7 日）で消えうる。NFR-06 の朝の締めに間に合わない
- name: 開発者の手元の機械の定時実行
  effect: 資格情報を新しい場所に置かない
  cost: 機械が動いていないと動かない
chosen: サーバーと同じイメージを毎日の処理のコマンドで Cloud Run のジョブとして動かし、デモの期間だけ Cloud Scheduler が毎朝起動する。期間を始める手順は定時の起動を通して一度動かして確かめ、手でも動かせる。日ごとの終わりの記録を持ち、終わっていない日をすべて続ける。処理を終えられなかったときは失敗として終わる。期間を終えるのは DEC-37 の条件を満たしたときで、毎日の処理が自分で定時の起動を止める
rationale: 利用者が選んだ（質問 1）。DRV-04 の押さえの期限（Stripe の既定で 7 日）より前に、結果が分からない確定を確かめられ、NFR-06 の締め（8:30）に 2 時間 30 分の余裕がある（計算）。原則 DRV-33 は日ごとの終わりの記録と追いつきで満たす。TC-07（DRV-18）は、毎日の処理のジョブと定時の起動をデモの期間だけ有効にすると書いている（第 1 段階が FND-02 を受け入れた）。期間の終わりの延長（DEC-37）も TC-07 に入った（第 1 段階が FND-18 を受け入れた）。期間の終わりは人が動かす手順に頼らず、毎日の処理が自分で定時の起動を止める（FND-22、質問 23）。サーバー（TC-08）は常時動かさないまま。ジョブは黙って成功せず、失敗した実行は DEC-17 の規則が知らせる（FND-06）。期間を終えるのは、確かめ中と押さえが 0 件と記録されたときだけ（DEC-37。FND-05）。最後の期間の後は DEC-36 で扱う（FND-10）。案 2 は DRV-29 で負ける（公開のリポジトリに本番の資格情報）。案 3 は DRV-04 を満たさない
rejected:
- option: 同じコードの別の入口を GitHub Actions の定時実行で毎朝動かす
  reason: 本番の資格情報を公開のリポジトリに置き、ログが公開される（DRV-29）。利用者は第 1 案を選んだ（質問 1）
- option: サーバーが動くときだけ（デモを開くときと閉じるとき）追いつく
  reason: 押さえの期限と朝の締めに間に合わない（DRV-04）
- option: 開発者の手元の機械の定時実行
  reason: 機械が動いていないと動かない（DRV-33）
gains:
- デモの翌朝に突き合わせ（FR-55）と知らせ（NFR-07）が終わる
- ジョブが落ちても、遅くとも 07:35 ごろに知らせが届く（計算。DEC-17）
- 秘密とログを GCP の中に置ける
- Cloud Scheduler が時刻どおりに起動する（起動した後の失敗は DEC-17 の規則が知らせる）
costs:
- 期間の始めに、ジョブと定時の起動を有効にする手順が要る。終わりは毎日の処理が止めるので、そのジョブに定時の起動と二つ目の規則を止める権限が要る（DEC-34）
- 期間の外では毎日の処理が動かず、保存期間の処理（FR-53）と NFR-41 の監視も止まる
- Cloud Scheduler の費用（未定の値 C_scheduler）
- 期間が延びることがある（DEC-37。毎日の処理が片付けられるものだけなら 1〜2 日）
sensitive_points:
- 期間を終える条件と最後の回の印（DEC-37）
- 起動の時刻と NFR-06 の 8:30 の間
- ジョブの一回の上限とやり直しの回数（DEC-17）
trade_offs:
- with: DRV-21
  note: 期間の外は保存期間の処理が止まる。期間と期間の間は次の期間の最初の実行で追いつき、最後の期間の後は DEC-36 で消す
- with: DRV-26
  note: 定時の起動という管理されたサービスが一つ増える。期間が延びた日の分も動く
assumptions:
- デモの期間は、一つのデモの最初の回の日から、最後の回の翌朝の処理が終わるまで（TC-07。第 1 段階の質問 12 で確認済み）。翌朝の処理が DEC-37 の条件を満たさなければ延びる（質問 17 で確認済み。TC-07 に入った）
- デモは全体で 1〜2 回で終わる（PC-05）
- ジョブのイメージはいつもサービスと同じ（DEC-27）
- ジョブの失敗は DEC-17 の規則が知らせる（DEC-17 は DEC-16 を通して DEC-05 に頼るので、依存には書かない）
depends_on:
- DEC-01
- DEC-08
parameters:
- name: 毎日の処理の起動
  value: デモの期間だけ毎日 06:00（日本時間）
  basis: 前日が終わってから。NFR-06 の 8:30 まで 2 時間 30 分（計算）
debt:
  what: デモの期間の外では保存期間の処理（FR-53）と NFR-41 の監視が動かない
  why_accepted: デモの期間だけジョブを有効にする（質問 1）。期間と期間の間は、次の期間の最初の実行で追いつく（T_pii_retention は 3 年）
  repay_when: 最後の期間を終えるとき（DEC-36）
deferred: false
revisit_when: null
as_is: new
