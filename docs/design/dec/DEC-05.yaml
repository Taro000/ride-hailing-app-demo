id: DEC-05
title: 想定の本番は東京の一つの Cloud Run のサービスと Turso に置き、実際に動かすのは開発者のマシンだけ
status: active
basis: assumed
basis_note: Cloud Run と Turso を想定の本番とし、実際に作って動かすのはローカルだけとすることは TC-07〜TC-09（入力、設計の第 1 段階の質問 1 で確認済み）。新しい版はデモの回を開くときに配備する（TC-15）。東京に置くことは、料金を円で定める CON-08 と日本語の利用者からの推定。インスタンスの数と、一つのインスタンスが落ちたときに処理中の操作が失敗することを受け入れることは、DAS-02 による暫定の決定。一つの置き場所で開発者に知らせる作りと費用のかかる冗長さの比較（DRV-01 と DRV-16 の競合として設計の第 1 段階が渡したもの）は、この決定で決めた。回を閉じて 0 にした後に期限が来た処理を次の日々の呼び出しまで遅らせることと、外からの生存確認を回の間だけ動かすことは、FND-05 を受けて加えた（遅れを受け入れることは DAS-02 による暫定の決定）
premises: [TC-07, TC-08, TC-09, TC-15, CON-08, OPF-01, OPF-02, OPF-03, DAS-02]
stage: architecture
question: 想定の本番とローカルで、各要素をどこに、いくつ置くか
addresses: [DRV-01, DRV-15, DRV-16, DRV-23]
options:
  - name: 東京の一つの Cloud Run のサービス（CPU を常に割り当て、デモの回の間はインスタンス 1、ほかは 0）、日々の呼び出しは Cloud Scheduler、データベースは東京の Turso
    effect: デモの回の間は最初の操作から起動を待たせず、サーバーの中で流れと時刻の処理を回せる
    cost: インスタンスが落ちると、プラットフォームが新しいインスタンスを起こすまで、処理中の操作が失敗する
  - name: 要求のある間だけ CPU を割り当てていつも 0 まで減らし、時刻の処理は Cloud Tasks の呼び出しで起こす
    effect: 使った分だけ払う
    cost: デモの回の最初の操作が起動を待ち、時刻の処理のために別のサービスとそのローカルの代わりが要る
  - name: デモの回の間はインスタンスを 2 つ別のゾーンに置く
    effect: 一つが落ちても、もう一つが操作を受ける
    cost: インスタンスの費用が倍になる
chosen: 東京の一つの Cloud Run のサービス（CPU を常に割り当て、デモの回の間はインスタンス 1、ほかは 0）、日々の呼び出しは Cloud Scheduler、データベースは東京の Turso
rationale: DRV-01 は一つ目と三つ目のどちらも、判断できる限り満たす。二つ目は最初の操作の起動の待ちと時刻の処理の仕組みで弱い。一つ目と三つ目は DRV-01 で並ぶため、下の DRV-16 で選び、費用の小さい一つ目にした。DEC-06 と DEC-18 は二つ以上のインスタンスでも動くので、三つ目に移るのは設定を変えるだけで済む。CPU を常に割り当てるのは、要求の外でも流れと期限の処理（DEC-18）を回すため。日々の処理は、インスタンスが 0 の間も Cloud Scheduler がサービスを起こして行う。デモの回を閉じてインスタンスを 0 にした後に期限が来た処理（回の終わりの近くの依頼の T_no_accept、結果が分からないお金の操作の確かめ）は、次の日々の呼び出しで起きたインスタンスが拾い、それまで遅れる（DEC-18、DAS-02）。秘密の値は Secret Manager に置く。サーバーそのものの停止は Cloud Monitoring の外からの生存確認で見て、確かめるたびにインスタンスを起こさないよう、生存確認はデモの回の間だけ動かす（DEC-20）。データベースはサーバーの近くに置くため東京の Turso にする。実際に作って動かすのは開発者のマシン（ELM-10）だけで、そこでは同じコンテナか同じランタイムでサーバーを動かし、libSQL のデータベースを使う。参加者の iPhone は同じネットワークから HTTPS で、または同じマシンの iOS のシミュレーターから使い、ローカルのサーバーはインターネットに公開しない。Cloud Scheduler の代わりのローカルの定期の呼び出しと、ローカルの HTTPS の証明書は、第 2b 段階が環境として決める
rejected:
  - option: 要求のある間だけ CPU を割り当てていつも 0 まで減らし、時刻の処理は Cloud Tasks の呼び出しで起こす
    reason: デモの回の最初の操作が起動を待って DRV-01 を弱め、別のサービスとそのローカルの代わり（DRV-15、DRV-16）が要る
  - option: デモの回の間はインスタンスを 2 つ別のゾーンに置く
    reason: DRV-01 では一つ目と並び、DRV-16 の費用で劣る。要るとなれば設定を変えるだけで移れる
gains:
  - デモの回の間は起動を待たずに応える
  - 想定の本番とローカルで同じコードと同じ形のデータベースを使う
costs:
  - デモの回の間に一つのインスタンスが落ちると、そのとき処理中の操作が失敗する
  - デモの回を開くときと閉じるときに、インスタンスの数を変え、外からの生存確認を入れて止める
  - デモの回を閉じた後に期限が来た処理は、次の日々の呼び出しまで遅れる
sensitive_points: []
trade_offs:
  - with: DRV-01
    note: 待たせておく二つ目のインスタンスを持たないため、インスタンスが落ちたときに処理中の操作が悪いイベントになる。DRV-16 の費用を先にした（DAS-02）
assumptions:
  - Cloud Run はインスタンスが落ちると新しいインスタンスを起こす
  - Turso は東京の近くに置け、データを複製して持つ
depends_on: [DEC-01, DEC-04]
parameters:
  - name: デモの回の間の Cloud Run の最小と最大のインスタンス数
    value: 1
    basis: 参加者は乗客 1 人とドライバー 1 人（OPF-03）、配車はデモ 1 回で 2〜3 回（OPF-02）で、一つのインスタンスで足りる。最小を 1 にして、デモの回の最初の操作が起動を待たないようにする
  - name: デモの回の外の Cloud Run の最小のインスタンス数
    value: 0
    basis: 使われるのはデモの回の間だけ（OPF-01）で、日々の処理と、回を閉じた後に期限が来た処理は、Cloud Scheduler が呼んだときに起きればよい（DAS-02）
debt: null
as_is: new
