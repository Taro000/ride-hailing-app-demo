id: DEC-05
title: 毎日の処理を Cloud Run のジョブにし、デモの期間だけ動かす
status: draft
version: 1
basis: inferred
basis_note: 動かし方（Cloud Scheduler と Cloud Run のジョブ、デモの期間だけ有効）は質問 1 で確認済み。デモの期間の読み方、起動の時刻、最後の期間の消去は推定（質問 12 は回答なし）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: architecture
question: 毎日の処理（突き合わせ、保存期間の処理、履歴の確かめ、SLI の集計、毎日の監視）を、サーバーがデモの回にしか動かないなかで、いつどこで動かすか
addresses:
- DRV-33
- DRV-04
- DRV-21
- DRV-27
- DRV-18
- DRV-26
options:
- name: サーバーと同じイメージを毎日の処理のコマンドで Cloud Run のジョブとして動かし、デモの期間だけ Cloud Scheduler が毎朝起動する。期間を始める手順の中と手でも動かせる。日ごとの終わりの記録を持ち、終わっていない日をすべて続ける
  effect: デモの翌朝に突き合わせと知らせが終わる。秘密は Secret Manager、ログは Cloud Logging に置ける
  cost: 期間の始めと終わりに有効にして止める手順が要る。期間の外は動かない。TC-07 の文と食い違う
- name: 同じコードの別の入口を GitHub Actions の定時実行で毎朝動かす
  effect: サーバーなしで毎朝動き、TC-14 の CI を使える
  cost: 本番の資格情報を公開のリポジトリの GitHub に置き、実行のログが誰でも読める。定時実行は遅れうるし、動きがないと止まる
- name: サーバーが動くときだけ（デモを開くときと閉じるとき）追いつく
  effect: 新しい仕組みが要らない
  cost: 次のデモまで動かず、確定できなかった押さえが期限（7 日）で消えうる。NFR-06 の朝の締めに間に合わない
- name: 開発者の手元の機械の定時実行
  effect: 資格情報を新しい場所に置かない
  cost: 機械が動いていないと動かない
chosen: サーバーと同じイメージを毎日の処理のコマンドで Cloud Run のジョブとして動かし、デモの期間だけ Cloud Scheduler が毎朝起動する。期間を始める手順の中と手でも動かせる。日ごとの終わりの記録を持ち、終わっていない日をすべて続ける
rationale: 利用者が選んだ（質問 1）。DRV-04 の押さえの期限（Stripe の既定で 7 日）より前に、結果が分からない確定を確かめられ、NFR-06 の締め（8:30）に 2 時間 30 分の余裕がある（計算）。原則 DRV-33 は日ごとの終わりの記録と追いつきで満たす。TC-07（DRV-18）は「デモの回と確かめの間だけ配備する」だが、質問 1 の回答で毎日の処理のジョブをデモの期間だけ有効にすることを確認した（文の直しは FND-02）。サーバー（TC-08）は常時動かさないまま。案 2 は DRV-29 で負ける（公開のリポジトリに本番の資格情報）。案 3 は DRV-04 を満たさない
rejected:
- option: 同じコードの別の入口を GitHub Actions の定時実行で毎朝動かす
  reason: 本番の資格情報を公開のリポジトリに置き、ログが公開される（DRV-29）。利用者は第 1 案を選んだ（質問 1）
- option: サーバーが動くときだけ（デモを開くときと閉じるとき）追いつく
  reason: 押さえの期限と朝の締めに間に合わない（DRV-04）
- option: 開発者の手元の機械の定時実行
  reason: 機械が動いていないと動かない（DRV-33）
gains:
- デモの翌朝に突き合わせ（FR-55）と知らせ（NFR-07）が終わる
- 秘密とログを GCP の中に置ける
- Cloud Scheduler が時刻どおりに起動し、失敗をやり直す
costs:
- 期間の始めと終わりに、ジョブと定時の起動を有効にして止める手順が要る
- 期間の外では毎日の処理が動かず、保存期間の処理（FR-53）も止まる
- Cloud Scheduler の費用（未定の値 C_scheduler）
sensitive_points:
- 期間を終える時刻（最後のデモの回の翌朝の処理が終わってから）
- 起動の時刻と NFR-06 の 8:30 の間
trade_offs:
- with: DRV-21
  note: 期間の外は保存期間の処理が止まる。最後の期間を終えるときに個人情報をすべて消す処理で補う
- with: DRV-26
  note: 定時の起動という管理されたサービスが一つ増える
assumptions:
- デモの期間は、最初のデモの回の日から、最後のデモの回の翌朝の処理が終わるまで（質問 1 の回答からの推定）
- デモは 1〜2 回で終わる（質問 7）
depends_on:
- DEC-01
- DEC-08
parameters:
- name: 毎日の処理の起動
  value: デモの期間だけ毎日 06:00（日本時間）
  basis: 前日が終わってから。NFR-06 の 8:30 まで 2 時間 30 分（計算）
debt:
  what: デモの期間の外では保存期間の処理（FR-53）が動かず、T_pii_retention を過ぎた個人情報が残りうる
  why_accepted: デモの期間だけジョブを有効にする（質問 1）。デモは 1〜2 回で終わる（質問 7）
  repay_when: 最後のデモの期間を終えるとき（個人情報をすべて消す処理を動かす）
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
