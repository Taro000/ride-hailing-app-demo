id: DEC-02
title: 乗客とドライバーは iOS 18.4 以降の iPhone で、ホーム画面に加えた Web アプリとして使う
status: active
basis: inferred
basis_note: Web アプリで iOS の Safari だけを対象にすることは TC-13（入力、設計の第 1 段階の質問 2 で確認済み）。乗客とドライバーが迎車を待つ間、迎車中、乗車中にアプリを画面に出したままにすることは、設計の第 1 段階の質問 2 の答え（QCR-02）に従う。ドライバーが受付をしている間も出したままにすることは質問 2 で確認済み（TC-18。QCR-03 は回答済みで、品質チェーンが反映するまで前提に残す）。ホーム画面に加えて iOS 18.4 以降の iPhone で使うことは、質問 1 で確認済み（下書きどおり）。ホーム画面に加えた Web アプリで Web Push が届くのは iOS 16.4 から、画面を消さない仕組み（Screen Wake Lock）が動くのは Safari 18.4 からであることは、Apple と WebKit の公開の記述による（報告の「入力」）。前に出ていない間と画面を消している間に位置と処理が止まることは DAS-03 によるもので、質問 6 で確認済み（仮定のまま進め、実機での振る舞いは開発の中と NFR-15 の受け入れの試験で確かめる）
premises: [TC-13, TC-18, CON-05, DAS-03, QCR-02, QCR-03]
stage: architecture
question: 乗客とドライバーの端末で、Web アプリをどの形で、どの iOS の版から動かすか
addresses: [DRV-14, DRV-04, DRV-03, DRV-22]
options:
  - name: iOS 18.4 以降の iPhone で、ホーム画面に加えた Web アプリとして使う
    effect: アプリが自分で画面を消さずに保ち、画面に出ていない間の変化は Web Push で知らせられる
    cost: iOS 18.4 に上げられない iPhone と、上げていない iPhone の参加者は使えない
  - name: iOS 16.4 以降の iPhone で、ホーム画面に加えた Web アプリとして使い、18.4 より前の版では参加者が自動ロックを切る
    effect: より古い iPhone でも使え、知らせも届く
    cost: 18.4 より前の版では、参加者が設定を変え忘れると画面が消え、位置の送信が止まる
  - name: ホーム画面に加えず、Safari のタブで使う
    effect: ホーム画面に加える手間がない
    cost: Web Push が届かず、画面に出ていない間の変化を知らせる手段がない
chosen: iOS 18.4 以降の iPhone で、ホーム画面に加えた Web アプリとして使う
rationale: TC-13 が Web アプリと iOS の Safari を決めており、決まっていないのは形と版だけ。DRV-04 と DRV-03 は、乗客とドライバーが迎車を待つ間から乗車中まで、ドライバーは受付をしている間もアプリを画面に出したままにすることに頼る（TC-13、TC-18、QCR-02、QCR-03）ため、アプリ自身が画面を消さずに保てる版を選んだ。ホーム画面に加えるのは、画面に出ていない間の変化を Web Push で知らせる（DEC-21）ため。版はアプリが使う仕組みが動く最も古い版とし、それより新しい版は NFR-15 の更新ごとの試験で守る。端末は CON-05 のスマートフォン（iPhone）だけで、iPad は対象にしない。DRV-22 は画面の作りで満たし、形と版の選び方によらない
rejected:
  - option: iOS 16.4 以降の iPhone で、ホーム画面に加えた Web アプリとして使い、18.4 より前の版では参加者が自動ロックを切る
    reason: DRV-04 と DRV-03 が参加者の端末の設定に頼り、変え忘れで位置と画面が止まる
  - option: ホーム画面に加えず、Safari のタブで使う
    reason: 画面に出ていない間の知らせ（FR-18、FR-31、FR-39 など）が届かず、DRV-03 を満たさない
gains:
  - アプリが画面を消さずに保ち、位置を送り続けられる
  - 画面に出ていない参加者にも変化を知らせられる
costs:
  - 参加者は iOS 18.4 以降に上げ、アプリをホーム画面に加え、知らせと位置を許す
sensitive_points: []
trade_offs: []
assumptions:
  - 参加者の iPhone は iOS 18.4 以降にする（質問 1 で確認済み）
  - ホーム画面に加えた Web アプリは、画面に出ている間は位置を測って送り続けられ、出ていない間は止まる（DAS-03）
depends_on: [DEC-01]
parameters: []
debt: null
as_is: new
