id: DEC-11
title: EXT-01 の結果はこのシステムから読みに行き、EXT-01 からの知らせは受けず、日々の照合で食い違いを見つける
status: active
basis: inferred
basis_note: 記録が EXT-01 の処理と食い違わないこと（QR-30、NFR-26、SLI-12）と、食い違いを知らせること（NFR-24）は入力。EXT-01 からの知らせもローカルで受けなければならないこと（DRV-15 の難しさの理由）は、知らせを受けない作りにして避けた。結果を EXT-01 から来たと確かめること（QR-31）は今期は対象外だが、この作りは結果をこのシステムの呼び出しの答えからだけ受ける。支払い方法が変わった依頼と決済を EXT-01 が受け付けなかった依頼も取引を二つ以上持つこと（DEC-09）は、FND-01 を受けて照合のまとめ方に加えた。仕組みは推定
premises: [EXT-01, TC-09, TC-10]
stage: architecture
question: EXT-01 が処理した押さえ、請求、解除、返金の結果を、どう知って記録に結び付け、食い違いをどう見つけるか
addresses: [DRV-07, DRV-15, DRV-27, DRV-32]
options:
  - name: 結果はこのシステムの呼び出しの答え、同じキーでの送り直し、作った取引の読み直しで知り、EXT-01 からの知らせ（Webhook）は受けず、日々、期間の取引と返金を EXT-01 から読んで記録と突き合わせる
    effect: ローカルでも想定の本番でも同じ形で結果を知り、外から呼ばれる入口を持たない
    cost: このシステムが起こしていない EXT-01 の側の変化は、照合のときまで分からない
  - name: EXT-01 からの知らせを受け（ローカルでは EXT-01 の転送の道具で受け）、日々の照合もする
    effect: EXT-01 の側の変化をすぐ知る
    cost: 外から呼ばれる入口とその確かめを持ち、ローカルでは転送の道具を動かし続ける
  - name: EXT-01 からの知らせだけに頼る
    effect: 照合の処理を持たない
    cost: 届かなかった知らせの食い違いが見つからない
chosen: 結果はこのシステムの呼び出しの答え、同じキーでの送り直し、作った取引の読み直しで知り、EXT-01 からの知らせ（Webhook）は受けず、日々、期間の取引と返金を EXT-01 から読んで記録と突き合わせる
rationale: DRV-07 は一つ目と二つ目のどちらも満たし、三つ目は届かなかった知らせの食い違いを見落とす。一つ目はローカルに転送の道具が要らず（DRV-15）、外から呼ばれる入口がないので偽の知らせという脅威がない。このシステムが起こしていない EXT-01 の側の変化（押さえの期限切れなど）は、日々の照合が見つけ、NFR-24 と SLI-12 のもとになる。照合はサーバーの日々の処理（DEC-18）が行い、確定額か支払い方法が変わったか決済を EXT-01 が受け付けなかったために取引が二つ以上ある依頼も、一つにまとめて突き合わせる
rejected:
  - option: EXT-01 からの知らせを受け（ローカルでは EXT-01 の転送の道具で受け）、日々の照合もする
    reason: DRV-07 では並び、外から呼ばれる入口とローカルの転送の道具が DRV-15 と DRV-16 で劣る
  - option: EXT-01 からの知らせだけに頼る
    reason: 届かなかった知らせの食い違いが見つからず、DRV-07 を満たさない
gains:
  - 外から呼ばれる入口を持たない
  - ローカルでも想定の本番でも同じ形で結果を知る
costs:
  - EXT-01 の側でだけ起きた変化は、次の照合まで分からない
sensitive_points:
  - 照合を行う時刻と読む期間。SLI-12 が突き合わせる時点より遅いと、その日の値に入らない（値は第 3 段階、HND-06）
trade_offs: []
assumptions:
  - EXT-01 は、期間を指定して取引と返金を読み出せる
depends_on: [DEC-09, DEC-10, DEC-18]
parameters: []
debt: null
as_is: new
