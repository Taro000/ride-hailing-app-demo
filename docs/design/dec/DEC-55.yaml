id: DEC-55
title: 回数の制限の値
status: draft
version: 2
basis: inferred
basis_note: DEC-21（回数の制限を置くが値がない）、DEC-20（ログインの失敗の上限）、FND-23 の論点は入力。経路ごとの値と、メモリで数えること（質問 5 は回答なし）は推定
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
stage: high-level-design
question: 経路ごとの回数の制限をいくつにし、どこで数えるか
addresses:
- IFC-01
- IFC-02
- IFC-03
- IFC-04
- IFC-05
- IFC-08
- DEC-21
- DEC-20
- FND-23
options:
- name: "経路ごとの値。ふだんはインスタンスのメモリで数え、ログインの失敗と設定の符号だけ Turso で数える。429 には Retry-After を付ける。流れの本数（アカウントごと 2、IP ごと 6、全体 40）は DEC-21 のまま"
  effect: 一人と一つの IP の乱用を抑え、Turso に書く量を増やさない。守りの肝（作成とログイン）は入れ替わっても続く
  cost: インスタンスが入れ替わるとメモリの数は戻る
- name: すべて Turso で数える
  effect: 入れ替わっても続く
  cost: 要求ごとに書き込みが増え、Turso が落ちると制限も落ちる
- name: 制限を置かない
  effect: 作らない
  cost: DEC-21 の上限が欠ける
chosen: 経路ごとの値。ふだんはインスタンスのメモリで数え、ログインの失敗と設定の符号だけ Turso で数える。429 には Retry-After を付ける。流れの本数（アカウントごと 2、IP ごと 6、全体 40）は DEC-21 のまま
rationale: DEC-21 は回数の制限を置くとしたが値がなかった（FND-23 の指摘）。インタフェースの回数の上限は interfaces.md がこの段に求める。インスタンスのメモリの数は正しさに関わらず、失っても上限が一時に緩むだけなので、DEC-02 の「インスタンスに状態を持たない」の目的に反しない
rejected:
- option: すべて Turso で数える
  reason: 書く量が増え、Turso の障害で守りも止まる
- option: 制限を置かない
  reason: DEC-21 に反する
gains:
- 一つのアカウントか IP が地図の割り当てを使い切れない
costs:
- 多くのアカウントと IP からの利用は抑えられない（FND-23 は第 2 段階で決め直す）
sensitive_points:
- 場所の検索と見積もりの値（低いと参加者の操作が止まり、高いと地図の割り当てを守れない）
trade_offs:
- with: DRV-29
  note: 一人あたりの上限まで
- with: DRV-01
  note: 参加者が上限に当たると 429 で SLI-01 の失敗に数える
assumptions:
- URL を公開することへの備え（参加者でない人）は第 2 段階が FND-23 で決め直す
depends_on:
- DEC-21
- DEC-20
parameters:
- name: 設定の符号
  value: IP ごとに 1 時間に 10 回（参加者全員。Turso に数える）
  basis: 提案。参加者が打ち間違えても足り、符号の推し量りを遅くする（符号は推し量れない長さの乱数。第 2 段階の DEC-20 版 4）
- name: ログイン
  value: 同じアカウントと同じ IP の組で 5 回続けて失敗すると、その組を 15 分止める（第 2 段階の DEC-20 版 3・4）。IP ごとに 1 時間に 30 回
  basis: 第 2 段階と提案
- name: 場所の検索
  value: アカウントごとに 1 分に 30 回、1 日に 300 回
  basis: 打つたびに呼ぶので 0.3 秒の間を置く。一回の手配で 20〜40 回
- name: 見積もり
  value: アカウントごとに 1 分に 10 回、1 日に 100 回
  basis: 場所を変えるたびに計算し直す（FR-03 AC4）
- name: 手配の確定
  value: アカウントごとに 1 時間に 10 回
  basis: デモの回の乗車は 1〜3 回（PC-05）
- name: 位置
  value: アカウントごとに 1 分に 12 回
  basis: L_send 10 秒の 2 倍
- name: 記録
  value: アカウントごとに 1 分に 60 回
  basis: まとめて送るので十分
- name: 確認コード
  value: 一つの割り当てで 10 回違ったら止める
  basis: 4 桁の符号を当て推量で当てられないように
- name: そのほかの経路
  value: アカウントごとに 1 分に 120 回
  basis: 提案
debt: null
deferred: false
revisit_when: 第 2 段階が FND-23 で DEC-21 を決め直したとき
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: "アカウントの作成の制限を外し（招待制で乗客の登録がない）、設定の符号の IP ごとの制限を参加者全員に足した。ログインの止め方を第 2 段階の DEC-20 のアカウントと IP の組の形にした。選んだ案と案の名前の書き方をそろえた"
  reason: "第 3 段階の再実行（2026-11-04）。品質チェーンの再実行（FR-01 版 3、FR-48 版 2）、第 2 段階の DEC-20 版 3・4（FND-44）、DEC-21 版 5"
