id: DEC-22
title: 走っているかは端末が測った速さと位置からサーバーが決め、分からなければ受け付けない
status: active
basis: inferred
basis_note: 速さで依頼を選ぶ操作と許諾を受け付けるかを決めることは FR-22、QR-28（入力）。走っているかどうかをどこで確かめるか（QIU-17 の basis_note が設計に確かめを求め、DRV-11 が第 2 段階に渡した点）は、この決定でサーバーと決めた。ドライバーの端末から得られる速さの確からしさ（QR-28 の basis_note）は、この段階では実機で確かめられず、判断の値とともに第 4 段階が ELM-03 の実行で確かめる（応答を左右する点として申し送った）。分からないときに受け付けないのは、走っている間の操作を受け付けないことを先にする扱い（品質チェーンの QR-28 と QIU-16 の扱い）による
premises: [TC-13]
stage: architecture
question: 車が V_moving_lock 以上の速さで動いているかを、どこで、何から決めるか
addresses: [DRV-11, DRV-31, DRV-33]
options:
  - name: 端末が測った速さと最近の位置をサーバーが受け、サーバーが決め、新しい値がないか速さが分からないときは受け付けずに止まってから操作するよう示す
    effect: 判断は一か所にあり、試験で速さと位置を与えて境目まで確かめられる
    cost: 端末の速さが粗いと、止まっているのに受け付けないことがある
  - name: 端末が速さを見て操作を止める
    effect: サーバーに位置が届かなくても止められる
    cost: 判断が端末に入り、書き換えた端末では止まらず、試験で端末を動かす
  - name: 端末の動きのセンサー（加速度）で走っているかを決める
    effect: 位置の測定がなくても動きが分かる
    cost: 参加者にもう一つ許しを求め、車の揺れと歩きを区別する仕組みが要る
chosen: 端末が測った速さと最近の位置をサーバーが受け、サーバーが決め、新しい値がないか速さが分からないときは受け付けずに止まってから操作するよう示す
rationale: DRV-31 は端末から受けるのを位置と速さだけとし、判断はサーバーが持つため二つ目を外した。三つ目は参加者の許しと区別の仕組みが増える。一つ目は判断を一か所に置き（QR-55）、試験で速さと位置を差し替えて境目まで確かめられる（DRV-33、NFR-21）。端末は同じ値で画面の操作を止めて見せるが、受け付けるかはサーバーが毎回決める。位置は DEC-07 が送る
rejected:
  - option: 端末が速さを見て操作を止める
    reason: 判断が端末に入り、DRV-31 を破る
  - option: 端末の動きのセンサー（加速度）で走っているかを決める
    reason: 参加者の許しと車の揺れの区別の仕組みが増え、DRV-11 の確からしさを上げる根拠が入力にない
gains:
  - 走っている間の許諾を、端末によらずサーバーが止める
costs:
  - 速さが分からないとき、止まっていても受け付けない
sensitive_points:
  - 判断に使う速さと位置の新しさ、使う位置の数、速さがないときの扱い。緩いと走り出した直後の許諾を受け付け、厳しいと止まっているのに受け付けない（値は第 4 段階、HND-09）
trade_offs: []
assumptions:
  - ドライバーの端末は、画面に出ている間、位置と速さを測ってサーバーに送れる
depends_on: [DEC-07]
parameters: []
debt: null
as_is: new
