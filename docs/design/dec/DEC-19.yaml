id: DEC-19
title: 一件の依頼の経過と、後から書き換えられない操作の記録を、依頼に結び付けてサーバーがデータベースに残す
status: active
basis: inferred
basis_note: 一件の依頼を端末から外部のサービスとのやり取りまでたどること（QR-41、QR-33、QR-53、FR-34、FR-52）、担当者とエンジニアの特別な操作と料金にかかわる操作を一人ずつ後から書き換えられない形でたどること（QR-44、QR-35、QR-12、NFR-32）は入力。何をどこに残しどう集めるか（FR-34、FR-52、QR-53 の basis_note が設計に任せた点）は推定
premises: [OPF-01, CON-06]
stage: architecture
question: エンジニアが一件の依頼を端末から外部のサービスまでたどり、担当者とエンジニアの操作を一人ずつたどれるには、何をどこに残すか
addresses: [DRV-24, DRV-30, DRV-27, DRV-34]
options:
  - name: 端末が操作ごとにたどるための ID を作り、サーバーはそれを各段階と EXT-01、EXT-02 への呼び出しに引き継いで、行ったことと結果を依頼に結び付けたたどる記録としてデータベースに書き、特別な操作と料金にかかわる操作は足すだけの操作の記録に残す
    effect: ローカルでも想定の本番でも、担当者とエンジニアの画面から一件の依頼を時刻の順にたどれる
    cost: たどる記録と操作の記録がデータベースに増える
  - name: プラットフォームのログ（Cloud Logging）に書き、そこを探す
    effect: 書く仕組みを持たずに済む
    cost: ローカルにはない仕組みで、依頼に結び付けて探す画面を別に作る
  - name: 分散トレースの仕組みと、その置き場所を加える
    effect: 呼び出しの時間を細かく見られる
    cost: 要素と、そのローカルの代わりが増える
chosen: 端末が操作ごとにたどるための ID を作り、サーバーはそれを各段階と EXT-01、EXT-02 への呼び出しに引き継いで、行ったことと結果を依頼に結び付けたたどる記録としてデータベースに書き、特別な操作と料金にかかわる操作は足すだけの操作の記録に残す
rationale: DRV-24 は一つ目と三つ目が満たし、二つ目はローカルにない（DRV-15）。三つ目は要素とそのローカルの代わりを増やす（DRV-16）。一つ目では、端末のエラーはつながっていない間は端末にため、つながったら依頼と画面とともに送る（FR-52）。たどる記録とログの個人の情報は、DEC-15 の決まりで伏せてから書く（QR-58）。担当者の操作（FR-50）、エンジニアが隠した情報を見た操作（FR-35）、乗客が料金を確かめて依頼、承認、取り消ししたこと、ドライバーが乗客の不在として終えたことと到着を確認したこと（QR-12）は、足すだけで直しも消しもしない操作の記録に残し、一つ前の記録のハッシュを含めて、書き換えれば分かるようにする。たどる記録は N_trace_retention_days の間取り出せるよう持つ（QR-37、DEC-17）。プラットフォームのログ（標準出力）は運用の補いで、調査はこの記録で行う
rejected:
  - option: プラットフォームのログ（Cloud Logging）に書き、そこを探す
    reason: ローカルにない仕組みで、DRV-15 を満たさない
  - option: 分散トレースの仕組みと、その置き場所を加える
    reason: 要素とローカルの代わりが増え、DRV-16 で一つ目に劣る
gains:
  - 端末、サーバー、EXT-01、EXT-02 の出来事を一件の依頼に結び付けて時刻の順にたどれる
  - 操作の記録の書き換えが分かる
costs:
  - 端末も操作ごとにたどる ID を作り、エラーをためて送る
sensitive_points: []
trade_offs: []
assumptions: []
depends_on: [DEC-15, DEC-17]
parameters: []
