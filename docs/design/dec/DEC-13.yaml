id: DEC-13
title: 地図のサービスの場所、住所、道と時間はサーバーの一つのつなぎ口から使い、端末は地図を描くためだけに使う
status: active
basis: inferred
basis_note: 場所の名前、住所と位置、道と移動時間の見込みは EXT-02 が作ること（EXT-02、TC-12）、EXT-02 が失敗しても答えなくても進んでいる配車を続けること（QR-65）、料金は模擬の運賃表に従うこと（QR-61）は入力。つなぎ方は推定
premises: [EXT-02, TC-12]
stage: architecture
question: EXT-02 の場所、住所、道と移動時間をどこから使い、EXT-02 が失敗するか答えないときに何を止め何を続けるか
addresses: [DRV-10, DRV-06, DRV-05, DRV-31, DRV-33, DRV-24, DRV-20, DRV-01]
options:
  - name: サーバーの EXT-02 のつなぎ口だけが場所の候補、住所、道と移動時間を求め、到着予定時刻と料金はサーバーが求め、端末は地図を描くためだけに EXT-02 を使う
    effect: 料金と到着予定時刻はサーバーが EXT-02 から得た値で決まり、EXT-02 とのやり取りがすべてサーバーに残る
    cost: 場所の候補を求めるたびに、端末とサーバーの間の往復が一つ増える
  - name: 端末が場所の候補と道を EXT-02 に直接求め、その結果をサーバーに送る
    effect: 場所の候補の応えが速い
    cost: 料金のもとになる道を端末が送り、サーバーはそれを確かめられない
  - name: 道と時間はサーバーが求め、場所の候補は端末が EXT-02 に直接求める
    effect: 場所の候補の応えが速く、料金はサーバーが決める
    cost: EXT-02 とのやり取りと失敗が端末とサーバーの二か所に分かれる
chosen: サーバーの EXT-02 のつなぎ口だけが場所の候補、住所、道と移動時間を求め、到着予定時刻と料金はサーバーが求め、端末は地図を描くためだけに EXT-02 を使う
rationale: 二つ目は料金のもとを端末が決めて DRV-31 を破る。一つ目は三つ目より、EXT-02 の失敗を一か所で扱い（DRV-10）、やり取りを依頼に結び付けて残し（DRV-24）、試験で一つのつなぎ口を差し替えられる（DRV-33、NFR-09）。料金は、サーバーが EXT-02 から求めた道の長さと時間に、エンジニアが入れた模擬の運賃表を当てて求め（QR-61、DRV-20）、依頼のときに確定額として持つ（CON-01）。EXT-02 が失敗するか答えないとき、場所の検索と見積もりはそのことを示して依頼させず（FR-01、FR-03）、迎車の着く見込みと依頼の内容のうち EXT-02 によるものは示せないことを示す（FR-06、FR-08、FR-20）。確定した依頼と乗車は EXT-02 なしで進み、確定額は変わらない（DRV-10）。乗車中に降りる場所を変えるときに EXT-02 が答えなければ、降りる場所を変えない（FR-47）。迎車中と乗車中の着く見込みは、サーバーが新しい位置から決まった間隔で求め直す。端末が地図を描くために EXT-02 に送るのは、表示の範囲だけ。時間切れは、端末が答えを待つ時間をサーバーがその操作に答える期限より長くし、その期限を EXT-02 への呼び出しの時間切れとやり直しの和より長くする
rejected:
  - option: 端末が場所の候補と道を EXT-02 に直接求め、その結果をサーバーに送る
    reason: 料金のもとを端末が決め、DRV-31 を破る
  - option: 道と時間はサーバーが求め、場所の候補は端末が EXT-02 に直接求める
    reason: EXT-02 の失敗とやり取りが二か所に分かれ、DRV-10 と DRV-24 で一つ目に劣る
gains:
  - 料金と到着予定時刻を EXT-02 なしで試せる一つのつなぎ口
  - EXT-02 の失敗が確定した依頼と乗車を止めない
costs:
  - 場所の候補の応えに、サーバーを通る往復が加わる
sensitive_points:
  - 迎車中と乗車中の着く見込みを求め直す間隔。長いと示す見込みが車の位置から遅れ（QR-19）、短いと EXT-02 の呼び出しが増える（値は第 3 段階、HND-08）
  - EXT-02 への呼び出しの時間切れとやり直しの回数。長いと場所の候補と見積もりの応えが遅れ（QR-07）、短いと EXT-02 の失敗として扱う呼び出しが増える（値は第 4 段階、HND-07）
trade_offs:
  - with: DRV-01
    note: EXT-02 が失敗するか答えない間、場所の検索と見積もりは SLI-01 の悪いイベントになる。確定した依頼と乗車の操作は止めない
assumptions:
  - EXT-02 は、場所の候補、住所と位置、二つの場所の間の道の長さと移動時間を、サーバーから求められる
depends_on: [DEC-01, DEC-07]
parameters: []
debt: null
as_is: new
