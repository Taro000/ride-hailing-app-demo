id: DEC-12
title: カードの情報は EXT-01 が用意する入力部品から直接 EXT-01 に渡し、サーバーは登録の結果を EXT-01 から読む
status: active
basis: inferred
basis_note: カードの情報を決済のサービスが用意する入力部品で入れ、このシステムを通さないことは TC-11、CON-04（入力）。システムが受けるのは EXT-01 が返す登録の結果だけであることは FR-46（入力）。入力部品の置き方と結果の確かめ方は推定
premises: [TC-11, CON-04, EXT-01]
stage: architecture
question: 乗客の支払い方法の登録で、カードの情報をどう入れ、登録の結果をどう知るか
addresses: [DRV-18, DRV-31, DRV-29]
options:
  - name: 乗客の Web アプリの中に、EXT-01 のドメインから読み込みその枠の中で動く EXT-01 の入力部品を置き、サーバーが作った登録の取引を端末から EXT-01 に直接確かめさせ、サーバーは結果を EXT-01 から読み直してから使える支払い方法にする
    effect: カードの情報は端末から EXT-01 にだけ届き、ホーム画面に加えたアプリを離れずに登録できる
    cost: 端末が伝えた結果をサーバーが EXT-01 で読み直す手間がかかる
  - name: EXT-01 が用意する支払いの画面に移して登録させ、アプリに戻す
    effect: カードの画面を EXT-01 が全部持つ
    cost: ホーム画面に加えたアプリから別のドメインの画面に移り、戻るときに流れが切れうる
  - name: このシステムの画面でカードの情報を受け、端末から EXT-01 に送る
    effect: 画面を自由に作れる
    cost: カードの情報がこのシステムの部品を通る
chosen: 乗客の Web アプリの中に、EXT-01 のドメインから読み込みその枠の中で動く EXT-01 の入力部品を置き、サーバーが作った登録の取引を端末から EXT-01 に直接確かめさせ、サーバーは結果を EXT-01 から読み直してから使える支払い方法にする
rationale: 三つ目は TC-11（交渉できない）を破るため外した。二つ目はホーム画面に加えたアプリを離れて戻る流れが DRV-14 で弱い。一つ目はカードの情報がこのシステムのサーバー、ログ、データを通らず（DRV-18、QR-60）、登録できたかはサーバーが EXT-01 から読み直して決める（DRV-31）。EXT-01 が答えないときは、分かるまでその支払い方法を使える支払い方法にしない（FR-46）。EXT-01 の顧客は、名前と連絡先を渡さず、このシステムの不透明な ID で作る（DRV-29）
rejected:
  - option: EXT-01 が用意する支払いの画面に移して登録させ、アプリに戻す
    reason: ホーム画面に加えたアプリから別の画面に移って戻る流れが切れうり、DRV-14 で弱い
  - option: このシステムの画面でカードの情報を受け、端末から EXT-01 に送る
    reason: TC-11（交渉できない）を破る
gains:
  - カードの情報がこのシステムのどこも通らない
  - 端末が伝えた結果を信じずに、EXT-01 の結果で支払い方法を使う
costs:
  - 端末の入力部品は EXT-01 の作りに従う
sensitive_points: []
trade_offs: []
assumptions:
  - EXT-01 の入力部品は、ホーム画面に加えた iOS の Safari の Web アプリの中で動く
depends_on: [DEC-02, DEC-09]
parameters: []
debt: null
as_is: new
