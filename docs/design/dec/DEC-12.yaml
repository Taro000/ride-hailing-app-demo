id: DEC-12
title: お金の操作を三重の仕組みで一度だけにする
status: draft
version: 2
basis: inferred
basis_note: Stripe の冪等キーの振る舞い（少なくとも 24 時間保つ、5xx も含めて同じ応答を返す、動いている間は 409、新しいキーを使う前に起きておらず動いてもいないと確かめる）と返金の振る舞いは文書から。仕組みと値は提案（質問 16 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: お金の操作を、二度届いても、応答がなくても、一度だけにするにはどうするか
addresses:
- DRV-30
- DRV-04
- DRV-11
options:
- name: 三重にする。ブラウザの操作キーと最初の結果の記録（キーと処理中を書くトランザクションと、結果を書くトランザクションを分け、Stripe の呼び出しをまたがない）、お金の操作ごとに決まる Stripe へのキー（押さえは依頼と押さえの何番目か、確定と取り消しは押さえごと、返金は返金の要求ごと。操作の ID をメタデータにも入れる）、応答がないときは要求の中では同じキーでだけ送り直し、確かめ中は見回りと毎日の処理が Stripe の状態を取り出して照らしてから送る
  effect: 二度の送信、応答のない呼び出し、同じ依頼の何度もの返金、24 時間を過ぎた確かめのどれでも二度動かない
  cost: 記録の表と確かめの処理の手間。キーの決め方を操作ごとに保つ
- name: Stripe の冪等キーだけに頼る
  effect: 手間が少ない
  cost: キーは少なくとも 24 時間しか保たれず（文書）、デモの後の確かめで二重に返金しうる。ブラウザの二度の送信で依頼が二つできうる
- name: 一意の制約だけで二度目を拒む
  effect: 依頼の二重は防げる
  cost: 二度目にエラーを返し（FR-05 AC5 は依頼を一つ作ることを求める）、返金の二重は防げない
chosen: 三重にする。ブラウザの操作キーと最初の結果の記録（キーと処理中を書くトランザクションと、結果を書くトランザクションを分け、Stripe の呼び出しをまたがない）、お金の操作ごとに決まる Stripe へのキー（押さえは依頼と押さえの何番目か、確定と取り消しは押さえごと、返金は返金の要求ごと。操作の ID をメタデータにも入れる）、応答がないときは要求の中では同じキーでだけ送り直し、確かめ中は見回りと毎日の処理が Stripe の状態を取り出して照らしてから送る
rationale: 原則 DRV-30 を、DEC-10 で確定が一回に限られることと合わせて満たす。サーバーはデモの回にしか動かず（TC-08）、確かめが 24 時間を超えうる（DEC-05）ので、キーだけに頼らない。返金は一つの依頼に何度も起きうる（FR-50、QR-17）ので、キーは依頼と操作の種類からではなく、操作そのもの（返金の要求の ID）から決める（FND-04）。Stripe は動き始めた要求の応答を 5xx も含めて同じキーに返すので、要求の中で状態を取り出してから送り直す必要はなく、取り出しは要求の外（見回り、毎日の処理）に置く（Stripe の文書。FND-11）。トランザクションは Stripe の呼び出しをまたがない（DEC-08。FND-15）。Stripe の呼び出しは 1 回 2.5 秒で切り、降車のときは同じキーで 2 回までやり直して、データベースを含めて最悪 9.2 秒で NFR-25 の 10 秒に収まる（計算）
rejected:
- option: Stripe の冪等キーだけに頼る
  reason: 24 時間を過ぎた確かめで DRV-30 を満たさない
- option: 一意の制約だけで二度目を拒む
  reason: FR-05 AC5 と FR-50 AC3 を満たさない
gains:
- 二度の送信と応答のない呼び出しでも一度だけ
- 同じ依頼の二度目の返金も、一度ずつ起きる
- デモの後の確かめでも安全
- 要求の中で待つのは Stripe の呼び出しだけ（降車のときの確定は最悪 9.2 秒）
costs:
- 操作キーの記録の表と確かめの処理の手間
- キーの決め方を操作ごとに保つ
sensitive_points:
- Stripe の呼び出しのタイムアウトとやり直しの回数（NFR-25 の 10 秒に収める）
- Stripe のタイムアウトと、Stripe の正常なときの応答時間の差（入力にない。最初のデモの前に測る）
- 処理中のまま確かめ中とみなすまでの時間（第 3 段階で決める。最悪の 9.2 秒より長く）
trade_offs:
- with: DRV-11
  note: 応答のない確定は確かめ中として残り、乗客は待たずに降りる（FR-29）
- with: DRV-26
  note: キーの表と確かめの規則を作って保つ
assumptions:
- Stripe の一覧と取り出しの API で、押さえの状態と、PaymentIntent ごとの返金をメタデータとともに確かめられる（Stripe の文書）
- Stripe は動き始めた要求の応答を 5xx も含めて少なくとも 24 時間保ち、同じキーには同じ応答を返し、同じキーの要求が動いている間は 409 を返す（Stripe の文書）
depends_on:
- DEC-08
- DEC-10
parameters:
- name: Stripe の呼び出しのタイムアウト
  value: 1 回 2.5 秒
  basis: 手配の確定は、データベースの二つのトランザクションを含めて最悪 2.7 秒で NFR-24 の 3 秒の内（計算）。NFR-24 から決めた仮の値で、Stripe の応答時間は入力にない。最初のデモの前にテスト環境で測って見直す
- name: 降車のときの確定のやり直し
  value: 同じキーで 2 回（0.5 秒と 1 秒の待ち）
  basis: Stripe は最悪 9.0 秒、データベースの二つのトランザクションを含めて 9.2 秒で NFR-25 の 10 秒の内（計算）
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: Stripe へのキーをお金の操作ごとに決め（返金は返金の要求ごと）、要求の中では同じキーでだけ送り直し、取り出しを見回りと毎日の処理に移した。最悪の時間を 9.2 秒（データベースを含む）に直し、2.5 秒の根拠と測ることを書いた。キーと結果を別のトランザクションで書く
  reason: FND-04、11、15（第 2 段階のレビュー）を受け入れた
