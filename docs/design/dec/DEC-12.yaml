id: DEC-12
title: お金の操作を三重の仕組みで一度だけにする
status: draft
version: 4
basis: inferred
basis_note: Stripe の冪等キーの振る舞い（少なくとも 24 時間保つ、5xx も含めて同じ応答を返す、動いている間は 409、新しいキーを使う前に起きておらず動いてもいないと確かめる）と返金の振る舞いは文書から。お金を動かす操作すべてに操作キーを付けることは第 3 段階の DEC-48 に合わせた。乗車の終了と降車場所の変更の確定を要求の中に残し、その経路の上限を 20 秒にすることは質問 22 で確認済み（DEC-33）。押さえの結果が分からないときの扱い（FR-05 版 3、FR-12 版 4）、失敗と分かった後の払い直しと返金のやり直しを新しい操作にすること（FR-30 版 4、FR-50 版 4、DRV-30 版 2）は入力で、キーの決め方はもとからそれと同じ。仕組みと値の残りは提案（質問 16 は回答なし）
needs_agreement: true
approver_candidates:
- 開発の責任者
stage: architecture
question: お金の操作を、二度届いても、応答がなくても、一度だけにするにはどうするか
addresses:
- DRV-30
- DRV-04
- DRV-11
- FND-21
- FND-29
options:
- name: 三重にする。お金を動かす操作（手配、押さえ直し、取り消し、不在、乗車の終了、未払いの支払い、返金）すべての操作キーと最初の結果の記録（キーと処理中を書くトランザクションと、結果を書くトランザクションを分け、Stripe の呼び出しをまたがない）、お金の操作ごとに決まる Stripe へのキー（押さえは依頼と押さえの何番目か、確定と取り消しは押さえごと、未払いの支払いは依頼と何回目か、返金は返金の要求ごと。操作の ID をメタデータにも入れる）、応答がないときは要求の中では同じキーでだけ送り直し（やり直すのは降車のときの確定だけ。ほかは要求の中で一度ずつ送る）、確かめ中は見回りと毎日の処理が Stripe の状態を取り出して照らしてから送る
  effect: 二度の送信、応答のない呼び出し、同じ依頼の何度もの返金、24 時間を過ぎた確かめのどれでも二度動かない
  cost: 記録の表と確かめの処理の手間。キーの決め方を操作ごとに保つ
- name: Stripe の冪等キーだけに頼る
  effect: 手間が少ない
  cost: キーは少なくとも 24 時間しか保たれず（文書）、デモの後の確かめで二重に返金しうる。ブラウザの二度の送信で依頼が二つできうる
- name: 一意の制約だけで二度目を拒む
  effect: 依頼の二重は防げる
  cost: 二度目にエラーを返し（FR-05 AC5 は依頼を一つ作ることを求める）、返金の二重は防げない
chosen: 三重にする。お金を動かす操作（手配、押さえ直し、取り消し、不在、乗車の終了、未払いの支払い、返金）すべての操作キーと最初の結果の記録（キーと処理中を書くトランザクションと、結果を書くトランザクションを分け、Stripe の呼び出しをまたがない）、お金の操作ごとに決まる Stripe へのキー（押さえは依頼と押さえの何番目か、確定と取り消しは押さえごと、未払いの支払いは依頼と何回目か、返金は返金の要求ごと。操作の ID をメタデータにも入れる）、応答がないときは要求の中では同じキーでだけ送り直し（やり直すのは降車のときの確定だけ。ほかは要求の中で一度ずつ送る）、確かめ中は見回りと毎日の処理が Stripe の状態を取り出して照らしてから送る
rationale: 原則 DRV-30（版 2。結果が分からないときのやり直しは同じ操作、失敗と分かった後のやり直しは新しい操作）を、DEC-10 で確定が一回に限られることと合わせて満たす。未払いの支払いは前の試みが失敗と確定したときだけ何回目かを進め、返金のやり直しは新しい返金の要求にするので、失敗と分かった後のやり直しは新しいキーになり（FR-30 版 4、FR-50 版 4）、結果が分からないときは同じキーのまま確かめる。押さえの結果が分からない手配と降車場所の変更は、依頼をドライバーに示さず（降車場所を変えず）確かめ中にし、見回りが T_hold_wait まで Stripe の状態を取り出して照らし、押さえたと分かれば進め、分からないまま過ぎるか乗客が取り消したらやめて、押さえが残っていれば取り消す。「押さえていない」と示すのは Stripe が答えたときだけ（FR-05 版 3、FR-12 版 4。DEC-04）。サーバーはデモの回にしか動かず（TC-08）、確かめが 24 時間を超えうる（DEC-05）ので、キーだけに頼らない。返金は一つの依頼に何度も起きうる（FR-50、QR-17）ので、キーは依頼と操作の種類からではなく、操作そのもの（返金の要求の ID）から決める（FND-04）。Stripe は動き始めた要求の応答を 5xx も含めて同じキーに返すので、要求の中で状態を取り出してから送り直す必要はなく、取り出しは要求の外（見回り、毎日の処理）に置く（Stripe の文書。FND-11）。トランザクションは Stripe の呼び出しをまたがない（DEC-08。FND-15）。Stripe の呼び出しは 1 回 2.5 秒で切り、降車のときは同じキーで 2 回までやり直して、データベースを含めて最悪 9.2 秒で NFR-25 の 10 秒に収まる（計算）。版 2 はやり直しの回数を降車のときの確定にだけ書き、ほかの操作は一度だけ送る前提で計算していた。乗車の終了（要求の中の最悪 9.35 秒、Turso が遅いと 15.05 秒）と押さえ直し（5.45 秒、13.05 秒）にも T_route（10 秒）がかかっていた。操作ごとの回数と最悪を報告書の表に書き、この二つの経路の上限を T_route_long（20 秒）にした（DEC-33。FND-21、質問 22）。操作キーは手配と返金だけにあり、T_route で切られた乗車の終了、取り消し、不在を送り直した画面が何を受けるかが決まっていなかったので、お金を動かす操作すべてに広げた（第 3 段階の DEC-48 は状態を変える要求すべてに広げた）。FR-31 AC2 の未払いの支払い（自動で確定する PaymentIntent）がキーの表になかったので足した（FND-29）
rejected:
- option: Stripe の冪等キーだけに頼る
  reason: 24 時間を過ぎた確かめで DRV-30 を満たさない
- option: 一意の制約だけで二度目を拒む
  reason: FR-05 AC5 と FR-50 AC3 を満たさない
gains:
- 二度の送信と応答のない呼び出しでも一度だけ
- 同じ依頼の二度目の返金も、一度ずつ起きる
- デモの後の確かめでも安全
- 要求の中で待つのは Stripe の呼び出しだけ（降車のときの確定は最悪 9.2 秒）
- どのお金の操作も、同じ操作キーの送り直しで最初の結果を受ける
- 一つの依頼の未払いの支払いは、何度試しても成功は一度
costs:
- 操作キーの記録の表と確かめの処理の手間
- キーの決め方を操作ごとに保つ
sensitive_points:
- Stripe の呼び出しのタイムアウトとやり直しの回数（NFR-25 の 10 秒に収める）
- Stripe のタイムアウトと、Stripe の正常なときの応答時間の差（入力にない。最初のデモの前に測る）
- 処理中のまま確かめ中とみなすまでの時間 T_op_stale（処理が続きうる最長、つまり降車のときの確定で二つのトランザクションが T_db で止まったときの 13.0 秒より長く。第 3 段階の DEC-48 は 30 秒）
- 押さえの結果が分からない手配と降車場所の変更を確かめる上限 T_hold_wait（第 3 段階の DEC-52 で 60 秒）。短すぎると押さえられていた手配までやめ、長すぎると乗客を待たせる
trade_offs:
- with: DRV-11
  note: 応答のない確定は確かめ中として残り、乗客は待たずに降りる（FR-29）
- with: DRV-26
  note: キーの表と確かめの規則を作って保つ
assumptions:
- Stripe の一覧と取り出しの API で、押さえの状態と、PaymentIntent ごとの返金をメタデータとともに確かめられる（Stripe の文書）
- Stripe は動き始めた要求の応答を 5xx も含めて少なくとも 24 時間保ち、同じキーには同じ応答を返し、同じキーの要求が動いている間は 409 を返す（Stripe の文書）
- 未払いの支払いは、顧客の PaymentIntent の一覧からメタデータの依頼の ID と何回目かで照らせる
depends_on:
- DEC-08
- DEC-10
- DEC-33
parameters:
- name: Stripe の呼び出しのタイムアウト
  value: 1 回 2.5 秒
  basis: 手配の確定は、セッションの読み出しとデータベースの二つのトランザクションを含めて最悪 2.85 秒で NFR-24 の 3 秒の内（計算。第 3 段階の遅延の予算と同じ）。NFR-24 から決めた仮の値で、Stripe の応答時間は入力にない。最初のデモの前にテスト環境で測って見直す
- name: 降車のときの確定のやり直し
  value: 同じキーで 2 回（0.5 秒と 1 秒の待ち。要求の中）。ほかのお金の操作は要求の中でやり直さない
  basis: Stripe は最悪 9.0 秒、データベースの二つのトランザクションを含めて 9.2 秒で NFR-25 の 10 秒の内（計算）
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: Stripe へのキーをお金の操作ごとに決め（返金は返金の要求ごと）、要求の中では同じキーでだけ送り直し、取り出しを見回りと毎日の処理に移した。最悪の時間を 9.2 秒（データベースを含む）に直し、2.5 秒の根拠と測ることを書いた。キーと結果を別のトランザクションで書く
  reason: FND-04、11、15（第 2 段階のレビュー）を受け入れた
- version: 3
  date: '2026-11-03'
  change: お金を動かす操作すべてに操作キーを付けた。要求の中のやり直しは降車のときの確定だけと書き、操作ごとの要求の中の Stripe の呼び出しと最悪の時間を報告書の表にした（乗車の終了と押さえ直しの経路の上限は DEC-33 の T_route_long）。キーの表に未払いの支払い（依頼と何回目か）を足した。T_op_stale のもとを 13.0 秒に直した。手配の確定の最悪をセッションの読み出しを含めた 2.85 秒に直した
  reason: FND-21、29 を受け入れた（第 2 段階の再実行、3 回目）。第 3 段階の DEC-48 に合わせた。質問 22 の回答
- version: 4
  date: '2026-11-03'
  change: 根拠に、押さえの結果が分からない手配と降車場所の変更の扱い（示さずに確かめ中にし、T_hold_wait まで確かめ、間に合わなければやめて残った押さえを取り消す。「押さえていない」は Stripe が答えたときだけ）と、失敗と分かった後のやり直しが新しいキーになることを書いた。T_hold_wait を応答を左右する点に足した。報告書のキーの表の押さえの取り消しに、システムの取り消しと手配をやめたときの解放を足した
  reason: 品質チェーンの再実行（FR-05 版 3、FR-12 版 4、FR-30 版 4、FR-50 版 4。回答の設計 2-1・3-2・3-3）と、第 1 段階の 3 回目の再実行（DRV-04 版 4、DRV-30 版 2）に追随した。品質チェーンへの課題 1 は決着した（第 2 段階の再実行、4 回目）
