id: DEC-09
title: 押さえは後で確定する決済の取引で行い、確定額が変わったら押さえ直し、料金は押さえの一部の確定で請求する
status: active
basis: assumed
basis_note: 押さえ、決済、キャンセル料と不在の料金、解除、返金を EXT-01 で行うことは FR-54、FR-29、FR-39、CON-01、CON-03、CON-08、TC-10（入力）。押さえた額を上げる操作が EXT-01 でどうできるか（DRV-07 を書いた設計の第 1 段階が第 2 段階に確かめを求めた点）は、Stripe の公開の文書で確かめた。押さえた額を上げる仕組み（incremental authorization）は IC+ の料金の使い手向けで、日本の使い手の円の取引は対象外とされる（報告の「入力」）。そのため新しい額で押さえ直して前の押さえを解く形にした。後で確定する取引、一部の確定、取り消し、返金を円で使えることは DAS-06 による仮定
premises: [TC-10, CON-01, CON-03, CON-08, EXT-01, DAS-06]
stage: architecture
question: 依頼のときの押さえ、乗車中の押さえ直し、決済、キャンセル料と不在の料金、解除、返金を、EXT-01 のどの操作で行うか
addresses: [DRV-07, DRV-18, DRV-32]
options:
  - name: 依頼ごとに確定額を後で確定する決済の取引で押さえ、決済は全額の確定、料金は押さえの一部の確定、無料の終わりは取り消しで解き、確定額が変わったら新しい取引で押さえ直してから前の取引を取り消す
    effect: 押さえた額がいつも確定額と同じで、料金を請求すると残りは EXT-01 が解く
    cost: 確定額が変わるたびに取引が一つ増え、照合で取引を依頼に結び付ける
  - name: 押さえた額を上げる仕組みで、一つの取引の額を上げる
    effect: 一つの依頼に取引が一つで済む
    cost: IC+ の料金と対応するカードが要り、日本の使い手の円の取引では使えず、額を下げることはできない
  - name: 押さえずに、到着の後に確定額を請求する
    effect: EXT-01 の操作が少ない
    cost: 依頼のときに押さえる FR-54 を満たさない
chosen: 依頼ごとに確定額を後で確定する決済の取引で押さえ、決済は全額の確定、料金は押さえの一部の確定、無料の終わりは取り消しで解き、確定額が変わったら新しい取引で押さえ直してから前の取引を取り消す
rationale: 三つ目は FR-54 を満たさず、二つ目は日本の円の取引で使えないうえ、確定額が下がったときに押さえた額を確定額に合わせられない（SLI-11 は押さえ直した額が承認した料金と等しいことを数える）。一つ目は押さえた額をいつも確定額にそろえる（DRV-07）。決済は押さえの全額の確定、許諾の後の取り消しと乗客の不在は CON-08 の料金だけの確定で、残りの押さえは EXT-01 が解く。許諾の前の取り消しと許諾のない終わりは取り消しで全部解く。確定額が変わるときは、新しい額の押さえができてから前の押さえを取り消し、新しい押さえができなければ降りる場所を変えない（FR-54）。返金は確定した取引への返金で、合計は EXT-01 も確定した額までに限る。EXT-01 には名前も連絡先も渡さず、このシステムの不透明な ID だけを渡す（DRV-29）。操作ごとのキーと結果が分からないときの扱いは DEC-10、結果の知り方は DEC-11
rejected:
  - option: 押さえた額を上げる仕組みで、一つの取引の額を上げる
    reason: 日本の使い手の円の取引で使えず（DRV-18 の Stripe のテスト環境）、確定額が下がったときに押さえた額を合わせられない（DRV-07）
  - option: 押さえずに、到着の後に確定額を請求する
    reason: FR-54 を満たさず、DRV-07 の押さえの場面を欠く
gains:
  - 押さえた額、請求した額、解いた額が確定額と CON-08 の料金にそろう
  - 料金の請求と残りの解除が一つの操作で済む
costs:
  - 確定額が変わった依頼は取引を二つ以上持ち、照合でそれを一つの依頼にまとめる
sensitive_points: []
trade_offs: []
assumptions:
  - EXT-01 のテスト環境で、後で確定する取引、一部の確定、取り消し、返金を円で使える（DAS-06）
  - カードの押さえは、依頼してから決済するまでの時間より長く保たれる
depends_on: [DEC-01]
parameters: []
debt: null
as_is: new
