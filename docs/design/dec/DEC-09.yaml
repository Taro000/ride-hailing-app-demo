id: DEC-09
title: 配車の状態は配車のモジュールだけが条件付きの書き込みで変える
status: draft
version: 2
basis: inferred
basis_note: 原則 DRV-31 と QR-45 は入力。T_request_max でのシステムの取り消し（FR-08 版 2）、押さえを確かめるまで依頼を示さないこと（FR-05 版 3）、運転の開始は担当のドライバーのコードの一致でだけ起きること（FR-26 版 2、QR-14 版 2）は入力。仕組みは提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: 配車依頼の状態を、どの経路でも規則どおりに一か所で変えるにはどうするか
addresses:
- DRV-05
- DRV-31
- DRV-04
- DRV-01
- DRV-23
options:
- name: 配車のモジュールだけが状態を変える。許される変化を一つの状態遷移表で定め、変化はすべて「今の状態と版が想定どおりのときだけ書く」条件付きの書き込みにし、割り当ての条件を同じトランザクションで確かめ直す。データベースの一意の制約を守りの二段目にする
  effect: 同時の許諾、取り消しとのぶつかり、評価や停止の変化のどれでも一人だけに割り当てる
  cost: 状態遷移表と条件付きの書き込みの手間
- name: 機能ごとの処理がそれぞれ状態を書き、データベースの一意の制約で守る
  effect: 早く作れる
  cost: 規則が散らばり、QR-45 と NFR-11 を満たさない
- name: 依頼ごとにメモリで一つずつ処理する
  effect: ぶつかりがなくなる
  cost: インスタンスが二つになると壊れる（DEC-02）
chosen: 配車のモジュールだけが状態を変える。許される変化を一つの状態遷移表で定め、変化はすべて「今の状態と版が想定どおりのときだけ書く」条件付きの書き込みにし、割り当ての条件を同じトランザクションで確かめ直す。データベースの一意の制約を守りの二段目にする
rationale: DRV-05（規則に反する割り当て 0 件）と原則 DRV-31（一か所で変える）を同時に満たす。参加者は 2 人なので、条件付きの書き込みのやり直しはほとんど起きない。受付できるのは登録したドライバーだけ（DRV-23、QR-37）という条件も同じ所で確かめる。案 3 は DEC-02 の理由（DRV-18）で落とす
rejected:
- option: 機能ごとの処理がそれぞれ状態を書き、データベースの一意の制約で守る
  reason: 原則 DRV-31 を満たさない
- option: 依頼ごとにメモリで一つずつ処理する
  reason: DRV-18 を満たさない
gains:
- 同時の操作でも規則どおり
- 状態遷移表のすべての組をテストできる（NFR-11）
costs:
- 状態遷移表と条件付きの書き込みを作る手間
sensitive_points:
- 割り当ての条件を書き込みと同じトランザクションで確かめ直すこと
- 状態遷移表に、押さえを確かめている間（ドライバーに示さない）、T_request_max でのシステムの取り消し（許諾とほぼ同時でも一方だけが効く）、担当のドライバーのアカウントとコードの一致を条件にした運転の開始を入れること（FR-05 版 3、FR-08 版 2、FR-26 版 2。DEC-04、DEC-30）
trade_offs: []
assumptions: []
depends_on:
- DEC-08
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 応答を左右する点に、状態遷移表に入れる三つ（押さえを確かめている間、T_request_max でのシステムの取り消しと許諾のぶつかり、担当のドライバーのコードの一致を条件にした運転の開始）を足した
  reason: 品質チェーンの再実行（FR-05 版 3、FR-08 版 2、FR-26 版 2）と、第 1 段階の 3 回目の再実行（DRV-05 版 3、DRV-29 版 2）に追随した（第 2 段階の再実行、4 回目）
