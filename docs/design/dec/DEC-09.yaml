id: DEC-09
title: 押さえは後で確定する決済の取引で行い、確定額か支払い方法が変わったら押さえ直し、決済は押さえの全額の確定、料金は一部の確定で請求する
status: active
basis: assumed
basis_note: 押さえ、決済、キャンセル料と不在の料金、解除、返金を EXT-01 で行うことは FR-54、FR-29、FR-39、CON-01、CON-03、CON-08、TC-10（入力）。押さえた額を上げる操作が EXT-01 でどうできるか（DRV-07 を書いた設計の第 1 段階が第 2 段階に確かめを求めた点）は、Stripe の公開の文書で確かめた。押さえた額を上げる仕組み（incremental authorization）は IC+ の料金の使い手向けで、日本の使い手の円の取引は対象外とされる（報告の「入力」）。そのため新しい額で押さえ直して前の押さえを解く形にした。押さえの後に支払い方法が変わったとき（依頼の途中の変更と、決済を EXT-01 が受け付けなかった後の変更）に、新しい支払い方法で押さえ直してから前の押さえを解き、ドライバーのやり直しはその押さえを確定する扱いは、FND-01 を受けて加えた（推定）。新しい支払い方法の押さえを EXT-01 が受け付けないか結果が分からない間は支払い方法の変更を済ませない扱いは、FR-46 の受け入れ基準（受け付けないときは別の支払い方法を求め、分かるまでは使える支払い方法として扱わない）に合わせた。確定額が CON-08 の料金を下回らず、料金を押さえから請求できること（FND-06 を受けて想定に加えた）は質問 5 で確認済み（模擬の運賃表の最も安い料金は 500 円以上。QCR-05 は回答済みで、品質チェーンが反映するまで前提に残す）。後で確定する取引、一部の確定、取り消し、返金を円で使えることは DAS-06 による仮定
premises: [TC-10, CON-01, CON-03, CON-08, EXT-01, DAS-06, QCR-05]
stage: architecture
question: 依頼のときの押さえ、乗車中の押さえ直し、押さえの後の支払い方法の変更、決済と EXT-01 が受け付けなかった決済のやり直し、キャンセル料と不在の料金、解除、返金を、EXT-01 のどの操作で行うか
addresses: [DRV-07, DRV-18, DRV-32]
options:
  - name: 依頼ごとに確定額を後で確定する決済の取引で押さえ、確定額か支払い方法が変わったら新しい取引で押さえ直してから前の取引を取り消し、決済はその時の押さえの全額の確定、料金は押さえの一部の確定、無料の終わりは取り消しで解く
    effect: 押さえた額と支払い方法がいつも確定額と決済に使う支払い方法にそろい、料金を請求すると残りは EXT-01 が解く。押さえられない支払い方法は、変えたときに分かる
    cost: 確定額か支払い方法が変わるたびに取引が一つ増え、照合で取引を依頼に結び付ける
  - name: 押さえた額を上げる仕組みで、一つの取引の額を上げる
    effect: 一つの依頼に取引が一つで済む
    cost: IC+ の料金と対応するカードが要り、日本の使い手の円の取引では使えず、額を下げることはできない
  - name: 押さえずに、到着の後に確定額を請求する
    effect: EXT-01 の操作が少ない
    cost: 依頼のときに押さえる FR-54 を満たさない
  - name: 押さえは依頼のときの支払い方法のままにし、支払い方法が変わったときと決済を EXT-01 が受け付けなかったときは、決済で前の押さえを取り消して新しい支払い方法から直接請求する
    effect: 乗車中に支払い方法を変えても EXT-01 の操作が増えない
    cost: 押さえていない支払い方法から請求するため、使えないことが降車のときに初めて分かり、押さえた額、請求した額、解いた額がそろわない
chosen: 依頼ごとに確定額を後で確定する決済の取引で押さえ、確定額か支払い方法が変わったら新しい取引で押さえ直してから前の取引を取り消し、決済はその時の押さえの全額の確定、料金は押さえの一部の確定、無料の終わりは取り消しで解く
rationale: 三つ目は FR-54 を満たさず、二つ目は日本の円の取引で使えないうえ、確定額が下がったときに押さえた額を確定額に合わせられない（SLI-11 は押さえ直した額が承認した料金と等しいことを数える）。四つ目は押さえていない支払い方法から請求するため、押さえた依頼の決済が済むこと（FR-54）を守れず、変えた支払い方法が使えないことが降車のときに初めて分かってドライバーを待たせ（FR-29）、解いた額が押さえた額から請求した額を引いた額とそろわない（SLI-11）。一つ目は、依頼の押さえをいつも確定額と乗客の今の支払い方法にそろえる（DRV-07）。確定額が変わったとき（FR-47）も、乗客が支払い方法を変えたとき（FR-46）も、新しい押さえができてから前の押さえを取り消す。新しい押さえを EXT-01 が受け付けなければ、降りる場所は変えず（FR-54）、支払い方法の変更は済ませずに理由を示して別の支払い方法を求める（FR-46）。新しい押さえの結果が分からない間は、どちらも変えない（DEC-10）。決済はその時の押さえの全額の確定で、EXT-01 が受け付けなかったときは、済んでいないことと理由を示し、乗客が支払い方法を変えるとその支払い方法で依頼を押さえ直し、ドライバーのやり直しはその新しい押さえを確定する（FR-29、FR-46）。許諾の後の取り消しと乗客の不在は CON-08 の料金だけの確定で、残りの押さえは EXT-01 が解く。許諾の前の取り消しと許諾のない終わりは取り消しで全部解く。返金は確定した取引への返金で、合計は EXT-01 も確定した額までに限る。EXT-01 には名前も連絡先も渡さず、このシステムの不透明な ID だけを渡す（DRV-29）。お金の操作の試みごとのキーと、拒否されたときと結果が分からないときの扱いは DEC-10、結果の知り方は DEC-11
rejected:
  - option: 押さえた額を上げる仕組みで、一つの取引の額を上げる
    reason: 日本の使い手の円の取引で使えず（DRV-18 の Stripe のテスト環境）、確定額が下がったときに押さえた額を合わせられない（DRV-07）
  - option: 押さえずに、到着の後に確定額を請求する
    reason: FR-54 を満たさず、DRV-07 の押さえの場面を欠く
  - option: 押さえは依頼のときの支払い方法のままにし、支払い方法が変わったときと決済を EXT-01 が受け付けなかったときは、決済で前の押さえを取り消して新しい支払い方法から直接請求する
    reason: 押さえた依頼の決済が済むこと（FR-54）を守れず、使えない支払い方法が降車のときに分かり（FR-29）、押さえた額と解いた額が DRV-07 の応答と SLI-11 の数え方にそろわない
gains:
  - 押さえた額、請求した額、解いた額が確定額と CON-08 の料金にそろう
  - 料金の請求と残りの解除が一つの操作で済む
  - 押さえられない支払い方法は、降車のときではなく変えたときに分かる
costs:
  - 確定額か支払い方法が変わった依頼と、決済を EXT-01 が受け付けなかった依頼は取引を二つ以上持ち、照合でそれを一つの依頼にまとめる
sensitive_points: []
trade_offs: []
assumptions:
  - EXT-01 のテスト環境で、後で確定する取引、一部の確定、取り消し、返金を円で使える（DAS-06）
  - カードの押さえは、依頼してから決済するまでの時間より長く保たれる
  - 確定額は CON-08 の料金を下回らず、料金は押さえから請求できる（質問 5 で確認済み、QCR-05）
depends_on: [DEC-01]
parameters: []
debt: null
as_is: new
