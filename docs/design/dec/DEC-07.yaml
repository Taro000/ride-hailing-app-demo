id: DEC-07
title: 端末は画面に出ている間、測った現在地を決まった間隔で送り、サーバーは古い現在地を分からないものとして扱う
status: active
basis: inferred
basis_note: 位置のもとが乗客とドライバーの端末だけであることは QR-19 と TC-13（入力）。乗客とドライバーが迎車を待つ間、迎車中、乗車中にアプリを画面に出したままにすることは、設計の第 1 段階の質問 2 の答え（QCR-02）に従う。ドライバーが受付をしている間も画面に出したままにすることは質問 2 で確認済み（下書きどおり。TC-18。QCR-03 は回答済みで、品質チェーンが反映するまで前提に残す）。端末が前に出ていない間は位置を送れないことは DAS-03 によるもので、質問 6 で確認済み（仮定のまま進め、実機での振る舞いは開発の中と NFR-15 の受け入れの試験で確かめる）。ドライバーの端末からの位置がどれだけ早く届くか（QR-19 の basis_note が設計に確かめを求める点）は、画面に出ている間は測った位置を間隔ごとに送ることで決まり、その間隔と遅れの予算は第 3 段階が NFR-19 の中で決める（応答を左右する点として申し送った）
premises: [TC-13, TC-18, OPF-01, QCR-02, QCR-03, DAS-03]
stage: architecture
question: 車と乗客の現在地を、実際の位置から T_vehicle_location_lag を超えて遅らせずに持ち、示し、依頼を届ける判断に使うには、位置をどう集めるか
addresses: [DRV-04, DRV-14, DRV-03, DRV-11, DRV-05, DRV-27]
options:
  - name: 画面に出ている間、アプリが画面を消さずに保ち、端末が測った位置を測った時刻、確からしさ、速さとともに決まった間隔で送る
    effect: 画面に出している間は、システムの持つ位置が測った位置に追い付き続ける
    cost: 端末の電池を使い、参加者はアプリを画面に出したままにする
  - name: 画面に出ている間に決まった間隔で送り、画面を消さないことは参加者の端末の設定に任せる
    effect: アプリは画面を保つ仕組みを持たずに済む
    cost: 参加者が設定を変え忘れると画面が消え、位置が止まる
  - name: 後ろでも位置を送れるネイティブのアプリにする
    effect: 画面に出ていなくても位置を送れる
    cost: TC-13 が使わないと決めたネイティブのアプリになる
chosen: 画面に出ている間、アプリが画面を消さずに保ち、端末が測った位置を測った時刻、確からしさ、速さとともに決まった間隔で送る
rationale: 三つ目は TC-13（交渉できない）を破るため外した。DRV-04 には、アプリ自身が画面を保つ一つ目が、参加者の設定に頼る二つ目より合う。送る場面は、ドライバーは受付をしている間（TC-18）、迎車中、乗車中、乗客は許諾されてから乗車が始まるまで（FR-24）。サーバーは参加者ごとに最新の位置を、端末が測った時刻と受けた時刻とともに持ち、受けた位置を記録に残す（DRV-27）。迎車が乗る場所に着いたこと（FR-10）は、サーバーが受けた新しい位置と乗る場所の距離で決め、着いたとみなした時刻を残す（DRV-03）。測ってから決まった時間を過ぎた位置は、依頼を届けるかの判断では分からないものとし（FR-19）、画面には最後に分かった位置と時刻として示す（FR-08、FR-13、FR-24）。端末の速さは DEC-22 が使う。誰が誰の位置を見られるかは DEC-15 の決まりによる
rejected:
  - option: 画面に出ている間に決まった間隔で送り、画面を消さないことは参加者の端末の設定に任せる
    reason: DRV-04 が参加者の設定に頼り、変え忘れで位置が止まる
  - option: 後ろでも位置を送れるネイティブのアプリにする
    reason: TC-13（交渉できない）を破る
gains:
  - 画面に出ている間は、位置と着く見込みが実際の位置に追い付く
  - 古い位置で依頼を届けることがない
costs:
  - 参加者の端末の電池を使う
  - アプリが画面に出ていない間の位置は分からない
sensitive_points:
  - 端末が位置を送る間隔と、サーバーが位置を分からないとみなす古さ。間隔と通信の時間の和が T_vehicle_location_lag を超えると NFR-19 を外し、短すぎると端末の電池が減る（値は第 3 段階、HND-03）
trade_offs:
  - with: DRV-14
    note: 位置はアプリが画面に出ている間だけ届く。画面に出ていない間の遅れは、参加者がアプリを画面に出したままにすること（TC-13、TC-18、QCR-02、QCR-03）で避ける
assumptions:
  - 端末の位置は、画面に出ている間は測り続けられる（DAS-03）
depends_on: [DEC-02, DEC-06]
parameters: []
debt: null
as_is: new
