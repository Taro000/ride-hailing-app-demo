id: DEC-31
title: コードは一つのリポジトリでコンポーネントごとに分け、その中を業務の機能ごとに、機能の中を規則、流れ、つなぎ口に分け、境を Oxlint で守る
status: active
basis: inferred
basis_note: 配車サーバーの中を機能ごとの部分に分け、部分の境を依存の規則と CI の検査で保つことは DEC-01 が選び、その分け方と検査は第 2b 段階に任せている（この段階の確定の種類のため、FND-11 で第 2 段階にこの段階に任せるよう求めた）。静的な検査に Oxlint を使うことは TC-04（入力）。外部のシステムをそれぞれのつなぎ口の後ろに置くことは DEC-09〜DEC-13、DEC-21、届ける相手の規則を一か所に置くことは DEC-24、隠す決まりを一か所に置くことは DEC-15（入力）。分け方の比べ方と選び方は推定。Oxlint が no-restricted-imports（patterns と regex）、import/no-cycle、import/no-relative-parent-imports、no-restricted-globals、no-restricted-properties と、ファイルの場所ごとの overrides を持つことは Oxlint の文書で確かめた（報告の「入力」）
premises: [TC-04, TEAM-01]
stage: technical-policy
question: 一つのリポジトリの中で三つのコンポーネントのコードをどこに置き、コンポーネントの中のコードをどう分け、その境を何で守るか
addresses: [DRV-12, DRV-33, DRV-35, DRV-34, DRV-16]
options:
  - name: コンポーネントごとに apps/ の下に置き、その中を業務の機能ごとのディレクトリに分け、機能の中を domain/（業務の規則）、application/（操作の流れとポート）、adapters/（経路、表、外部のつなぎ口）に分ける。機能の間は index.ts からだけ使い、Oxlint の規則で守る
    effect: 一つの機能の変更がその機能のディレクトリにとどまる。外部のシステムのつなぎ口は adapters/ に、時計と ID は土台の src/platform/ にあり、ポートに偽物を差し込める。依頼を届ける相手の規則と、使える機能と隠す決まりが、それぞれ一つの機能のディレクトリにまとまる
    cost: ディレクトリと Oxlint の規則が多く、ディレクトリをまたぐ import は package.json の imports の別名で書く
  - name: コンポーネントの中を技術の層ごと（経路、サービス、データの読み書き）に分ける
    effect: 小さなうちは置き場所が分かりやすい
    cost: 一つの機能の変更がすべての層に及び、機能の間の境を import の規則で確かめられない
  - name: 業務の機能ごとに workspace のパッケージにし、パッケージの依存の宣言で境を守る
    effect: pnpm の依存の宣言と package.json の exports が境を強く守る
    cost: パッケージの数だけ設定、型の確かめ、テストの組み立てがあり、1 人で保つ手間が大きい
chosen: コンポーネントごとに apps/ の下に置き、その中を業務の機能ごとのディレクトリに分け、機能の中を domain/（業務の規則）、application/（操作の流れとポート）、adapters/（経路、表、外部のつなぎ口）に分ける。機能の間は index.ts からだけ使い、Oxlint の規則で守る
rationale: DRV-12 は一つの機能の変更がその部分にとどまることを、その測定量の NFR-40 は部分の間の依存の決まりの検査を求める。二つ目は機能の境を検査できず、これを満たさない。三つ目は境を最も強く守るが、機能ごとのパッケージを 1 人で保つ手間が DRV-16 で劣る。一つ目は、機能の境を検査の手順の Oxlint の規則（POL-02）が守り、業務の規則をフレームワーク、データベース、外部のシステムから離して、偽物を差し込むポートを application/ に置く（DRV-33）。依頼を届ける相手の規則（DRV-35）と、使える機能と隠す決まり（DRV-34）は、それぞれ一つの機能のディレクトリに置き、ほかの機能はその index.ts を呼ぶ。DEC-01 が選んだ中の分け方と同じ
rejected:
  - option: コンポーネントの中を技術の層ごと（経路、サービス、データの読み書き）に分ける
    reason: 機能の境を検査できず、DRV-12 と NFR-40 の依存の検査を満たさない
  - option: 業務の機能ごとに workspace のパッケージにし、パッケージの依存の宣言で境を守る
    reason: 機能ごとのパッケージの設定と組み立てを 1 人で保つ手間が DRV-16 で劣る
gains:
  - 一つの機能の変更がそのディレクトリにとどまり、境が検査で守られる
  - 外部のシステム、時計、ID の偽物を、ポートに差し込める
costs:
  - Oxlint の規則が多く、機能を加えるたびに規則の overrides を足す
  - ディレクトリをまたぐ import に別名を使う
sensitive_points: []
trade_offs: []
assumptions:
  - Oxlint の no-restricted-imports と overrides で、ディレクトリごとに import してよいものを書き分けられる
depends_on: [DEC-01, DEC-15, DEC-24]
parameters: []
debt: null
as_is: new
