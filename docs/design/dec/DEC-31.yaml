id: DEC-31
title: 管理の操作は同じトランザクションで追記だけの表に残す
status: draft
version: 1
basis: inferred
basis_note: QR-22 と NFR-18 は入力。仕組みは提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: 管理の画面の操作を担当一人ひとりにたどれるよう、どう残すか
addresses:
- DRV-29
- DRV-25
- DRV-21
options:
- name: 管理の操作（登録、停止と再開、対処、返金）ごとに、担当のアカウント、時刻、対象、理由を、操作と同じトランザクションで追記だけの表に書く
  effect: 操作と記録の片方だけが残らない。保存期間の内はたどれる
  cost: 表と書き込みの手間
- name: ログに残す
  effect: 作る量が少ない
  cost: 操作が通っても記録が落ちうる。30 日で消える
- name: Turso の監査ログに頼る
  effect: 作らなくてよい
  cost: データベースの操作の記録で、誰が何をしたかの意味がない。保持が短い
chosen: 管理の操作（登録、停止と再開、対処、返金）ごとに、担当のアカウント、時刻、対象、理由を、操作と同じトランザクションで追記だけの表に書く
rationale: QR-22（DRV-29）と NFR-18 はすべての管理の操作に担当の記録を求め、記録が落ちてはならない。DEC-08 と同じく一つのトランザクションで書く。保存期間（DRV-21）で担当を匿名化できる
rejected:
- option: ログに残す
  reason: 記録が落ちうるうえ 30 日で消え、DRV-29 を一部しか満たさない
- option: Turso の監査ログに頼る
  reason: DRV-29 を満たさない
gains:
- 管理の操作と記録が必ずそろう
costs:
- 表と書き込みの手間
