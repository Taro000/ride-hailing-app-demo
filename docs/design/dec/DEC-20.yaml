id: DEC-20
title: サーバーが異常を見つけて記録し、担当者とエンジニアの Web アプリに Web Push で知らせ、想定の本番ではサーバーの停止を外から見張る
status: active
basis: assumed
basis_note: 異常を漏れなく T_alert_delay のうちに知らせること（QR-33、FR-33、NFR-38）と、監視の非機能要件（NFR-10、NFR-14、NFR-17、NFR-18、NFR-24、NFR-29、NFR-30、NFR-35、NFR-39、NFR-43〜NFR-46）とアラート（NFR-01〜NFR-07）は入力。何を異常とみなしどう見つけるか（FR-33 の basis_note が設計に任せた点）は推定。エンジニアが Web Push と一覧で受けることは DAS-05 による仮定。デモの回、SLO、監視は想定の本番の要求として設計し、実際には行わない（設計の第 1 段階の質問 1）
premises: [OPF-01, DAS-05]
stage: architecture
question: 機能の異常やエラーを、どこで見つけ、どうエンジニアに知らせるか
addresses: [DRV-24, DRV-25, DRV-01]
options:
  - name: サーバーが操作の失敗、外部のサービスの失敗、監視の条件、SLO のアラートを自身の記録から見つけて異常として記録し、担当者とエンジニアの Web アプリに Web Push で知らせて一覧に示し、想定の本番では Cloud Monitoring の外からの生存確認がサーバーの停止をメールで知らせる
    effect: ローカルでも同じ知らせ方を試せ、サーバーそのものが止まっても想定の本番では知らせが出る
    cost: 異常の見つけ方と監視の条件をサーバーの中に作る
  - name: プラットフォームの監視（ログからの指標と Cloud Monitoring のアラート）だけで知らせる
    effect: サーバーの中に見つける仕組みを作らない
    cost: ローカルにない仕組みで、知らせとたどりのリリース前の確認（NFR-38）をローカルで行えない
  - name: 外部のエラーを集めるサービスに送って知らせる
    effect: 見つけ方と画面をそのサービスが持つ
    cost: 外部のサービスが増え、個人の情報を伏せた記録をそこへ送る
chosen: サーバーが操作の失敗、外部のサービスの失敗、監視の条件、SLO のアラートを自身の記録から見つけて異常として記録し、担当者とエンジニアの Web アプリに Web Push で知らせて一覧に示し、想定の本番では Cloud Monitoring の外からの生存確認がサーバーの停止をメールで知らせる
rationale: 二つ目はローカルにない（DRV-15）、三つ目は外部のサービスを増やし個人の情報の記録を外へ出す（DRV-16、DRV-29）。一つ目は、境界の出来事の記録（DEC-23）とたどる記録（DEC-19）から異常と SLO のアラートを見つけるので、見つけたものから一件の依頼をたどれる（FR-34）。同じ異常が続くときは続いていることが分かるようにまとめる（FR-33）。知らせの中身は DEC-15 の決まりで個人の情報を伏せる。サーバーそのものが止まると自身では知らせられないため、想定の本番は外からの生存確認で補う。ローカルでは、開発者が自分のマシンで止まったことを見る
rejected:
  - option: プラットフォームの監視（ログからの指標と Cloud Monitoring のアラート）だけで知らせる
    reason: ローカルにない仕組みで、DRV-15 を満たさず、NFR-38 をローカルで確かめられない
  - option: 外部のエラーを集めるサービスに送って知らせる
    reason: 外部のサービスが増え（DRV-16）、伏せた記録でも外へ出す（DRV-29）
gains:
  - 異常の知らせから、その依頼の経過をすぐたどれる
  - ローカルでも想定の本番でも同じ知らせ方を試せる
costs:
  - 監視の条件と SLO のアラートをサーバーの中で求める
sensitive_points:
  - 異常とみなす条件と、監視と SLO のアラートを確かめる間隔。長いと T_alert_delay を超える（値は第 4 段階、HND-10）
trade_offs: []
assumptions:
  - デモの回の間、エンジニアは担当者とエンジニアの Web アプリを開いている（DAS-05）
depends_on: [DEC-19, DEC-21, DEC-23]
parameters: []
debt: null
as_is: new
