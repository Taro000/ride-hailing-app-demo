id: DEC-20
title: サーバーが異常を見つけて記録し、担当者とエンジニアの Web アプリに Web Push で知らせ、想定の本番ではサーバーの停止と日々の処理が終わらないことをプラットフォームから見張る
status: active
basis: assumed
basis_note: 異常を漏れなく T_alert_delay のうちに知らせること（QR-33、FR-33、NFR-38）と、監視の非機能要件（NFR-10、NFR-14、NFR-17、NFR-18、NFR-24、NFR-29、NFR-30、NFR-35、NFR-39、NFR-43〜NFR-46）とアラート（NFR-01〜NFR-07）は入力。何を異常とみなしどう見つけるか（FR-33 の basis_note が設計に任せた点）は推定。エンジニアが Web Push と一覧で受け、プラットフォームからのメールをデモの回の外も受けることは DAS-05 による仮定。デモの回、SLO、監視は想定の本番の要求として設計し、実際には行わない（設計の第 1 段階の質問 1）。外からの生存確認をデモの回の間だけ動かし、その流れを脅威のモデルに加えたのは FND-05 による。日々の処理が動かなかったか終えなかったことを、ELM-03 を呼ばずにプラットフォームのアラートが回を問わずメールで知らせること、そのために比べた二つの案、知らせのメールの流れを脅威のモデルに加えたことは FND-09 による。Cloud Monitoring と Cloud Scheduler の働きは公開の文書による（報告の「入力」）。回の外のインスタンスを 0 とすることは DAS-02 による暫定の決定
premises: [TC-08, TC-09, OPF-01, DAS-02, DAS-05]
stage: architecture
question: 機能の異常やエラーを、どこで見つけ、どうエンジニアに知らせるか。サーバーそのものが止まったときと、デモの回の外に日々の処理だけが動くときも含めて
addresses: [DRV-24, DRV-25, DRV-01]
options:
  - name: サーバーが操作の失敗、外部のサービスの失敗、監視の条件、SLO のアラートを自身の記録から見つけて異常として記録し、担当者とエンジニアの Web アプリに Web Push で知らせて一覧に示し、想定の本番では、デモの回の間は Cloud Monitoring の外からの生存確認がサーバーの停止を、回を問わず Cloud Monitoring のアラートが日々の処理が動かなかったか終えなかったことを、メールで知らせる
    effect: ローカルでも同じ知らせ方を試せ、想定の本番では、サーバーそのものが止まっても、回の外に日々の処理が動かなくても、回の外にインスタンスを起こさずに知らせが出る
    cost: 異常の見つけ方と監視の条件をサーバーの中に作り、日々の処理を終えた記録と、それを見張るアラートを想定の本番に置く
  - name: 一つ目と同じだが、外からの生存確認をデモの回の外も動かし、日々の処理は見張らない
    effect: 回の外も、サーバーが起きられないことが分かる
    cost: 回の外も確かめるたびにインスタンスを起こし、サーバーが応えても日々の処理が動いて終えたかは分からない
  - name: 一つ目と同じだが、回の外は見張らない（外からの生存確認は回の間だけで、日々の処理は見張らない）
    effect: 想定の本番に置く見張りが生存確認だけで済む
    cost: 回の外に日々の処理が起きられないか、知らせる前に止まっても、誰にも知らせない
  - name: プラットフォームの監視（ログからの指標と Cloud Monitoring のアラート）だけで知らせる
    effect: サーバーの中に見つける仕組みを作らない
    cost: ローカルにない仕組みで、知らせとたどりのリリース前の確認（NFR-38）をローカルで行えない
  - name: 外部のエラーを集めるサービスに送って知らせる
    effect: 見つけ方と画面をそのサービスが持つ
    cost: 外部のサービスが増え、個人の情報を伏せた記録をそこへ送る
chosen: サーバーが操作の失敗、外部のサービスの失敗、監視の条件、SLO のアラートを自身の記録から見つけて異常として記録し、担当者とエンジニアの Web アプリに Web Push で知らせて一覧に示し、想定の本番では、デモの回の間は Cloud Monitoring の外からの生存確認がサーバーの停止を、回を問わず Cloud Monitoring のアラートが日々の処理が動かなかったか終えなかったことを、メールで知らせる
rationale: 四つ目はローカルにない（DRV-15）、五つ目は外部のサービスを増やし個人の情報の記録を外へ出す（DRV-16、DRV-29）。一つ目から三つ目は、境界の出来事の記録（DEC-23）とたどる記録（DEC-19）から異常と SLO のアラートを見つけるので、見つけたものから一件の依頼をたどれる（FR-34）。同じ異常が続くときは続いていることが分かるようにまとめる（FR-33）。知らせの中身は DEC-15 の決まりで個人の情報を伏せる。サーバーそのものが止まるか起きられないと自身では知らせられないため、想定の本番は ELM-03 を通らない見張りで補う。デモの回の間は外からの生存確認がサーバーの停止を見る（回を開く手順で入れ、閉じる手順で止める）。生存確認が呼ぶ入口は、生きていることだけを返し、何も変えない（脅威のモデルの F13）。回の外はインスタンスが 0 なのが正しい状態で（DEC-05、DAS-02）、動くのは日々の処理（DEC-18）だけになる。二つ目は、確かめるたびにインスタンスを起こして費用の見積もり（回の間の時間）を外れ（DRV-16）、サーバーが応えても日々の処理が動いて終えたかは分からない。三つ目では、日々の処理が行う FR-51 の変換と保存期間を過ぎた日の鍵を捨てること（DEC-16、DEC-17。交渉できない DRV-21 を守る仕組み）、EXT-01 との照合、NFR-39 と NFR-46 の確かめが止まっても誰も気づかず、DRV-24 の環境（デモの回の後の N_trace_retention_days）で異常が漏れなく知らされない（FND-09）。一つ目では、日々の処理は、すべての仕事を終えたらそのことを個人の情報を含まない記録（日付と結果）としてプラットフォームのログに書く。Cloud Monitoring のアラートは、Cloud Scheduler が日々の呼び出しを失敗と記録したときと、予定の時刻から決まった時間のうちに終えた記録が届かないときに、開発者にメールで知らせる。仕事の一つが失敗して終えた記録が書かれないときも、同じに知らせる。この見張りは Cloud Scheduler の呼び出しの結果と ELM-03 のログを読むだけで ELM-03 を呼ばないため、回の外にインスタンスを起こさず、インスタンスの時間を増やさない（DRV-16）。デモの回の間も同じに動き、回を開く手順と閉じる手順を要しない。知らせのメールには個人の情報を入れない（脅威のモデルの F14）。どちらの見張りも想定の本番だけの補いで、ローカルの作りは変わらない（DRV-15）。ローカルでは、開発者が自分のマシンで、止まったことと日々の処理の結果を見る
rejected:
  - option: 一つ目と同じだが、外からの生存確認をデモの回の外も動かし、日々の処理は見張らない
    reason: 回の外も確かめるたびにインスタンスを起こして費用の見積もりを外れ（DRV-16、DAS-02）、サーバーが応えても日々の処理が動いて終えたかは分からず、DRV-24 の回の外の応答を一部しか満たさない
  - option: 一つ目と同じだが、回の外は見張らない（外からの生存確認は回の間だけで、日々の処理は見張らない）
    reason: 回の外に日々の処理が動かなくても誰にも知らせず、DRV-24 の回の外の応答を満たさず、FR-51 の変換と鍵を捨てること（DRV-21）が止まったまま気づかれない
  - option: プラットフォームの監視（ログからの指標と Cloud Monitoring のアラート）だけで知らせる
    reason: ローカルにない仕組みで、DRV-15 を満たさず、NFR-38 をローカルで確かめられない
  - option: 外部のエラーを集めるサービスに送って知らせる
    reason: 外部のサービスが増え（DRV-16）、伏せた記録でも外へ出す（DRV-29）
gains:
  - 異常の知らせから、その依頼の経過をすぐたどれる
  - ローカルでも想定の本番でも同じ知らせ方を試せる
  - 想定の本番では、回の外に日々の処理が動かないか終えないことも、インスタンスを起こさずに知らせる
costs:
  - 監視の条件と SLO のアラートをサーバーの中で求める
  - 想定の本番に、日々の処理を終えた記録を見張るアラートを置き、その料金（P_monitoring_month）がかかる
  - 回の外にサーバーが起きられなくなったことは、次の日々の呼び出しまで分からない
sensitive_points:
  - 異常とみなす条件と、監視と SLO のアラートを確かめる間隔。長いと T_alert_delay を超える（値は第 4 段階、HND-10）
  - 見張りが日々の処理を終えた記録を待つ、日々の呼び出しの予定の時刻からの時間。短いと日々の処理が長引いただけで知らせ、長いと動かなかったことを知るのが遅れる（値は第 4 段階、HND-10）
trade_offs:
  - with: DRV-16
    note: 想定の本番に、日々の処理を見張るアラートの料金（P_monitoring_month）が加わる。インスタンスの時間は増えない
assumptions:
  - デモの回の間、エンジニアは担当者とエンジニアの Web アプリを開いている（DAS-05）
  - 開発者は、プラットフォームからの知らせのメールを、デモの回の外も受ける（DAS-05）
  - Cloud Monitoring は、ELM-03 を呼ばずに、Cloud Scheduler の呼び出しの結果と ELM-03 がログに書いた記録から、記録が決まった時間のうちに届かないことも含めて条件を確かめ、メールで知らせられる
depends_on: [DEC-18, DEC-19, DEC-21, DEC-23]
parameters: []
debt: null
as_is: new
