id: DEC-17
title: 知らせはサーバーと毎日の処理から送り、止まったときは Cloud Monitoring
status: draft
version: 1
basis: inferred
basis_note: Cloud Monitoring の規則を置くことは質問 5 で確認済み。速い条件のアラートを作らないことと、まとめる間隔は推定（質問 12 は回答なし）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 異常をどうエンジニアに知らせるか
addresses:
- DRV-28
- DRV-01
- DRV-27
options:
- name: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送った記録を残し、送れなければ送り直す。毎日の処理は毎日の結果を送る。アプリが止まったときのために、Cloud Run の標準の指標に Cloud Monitoring の規則を一つ置き、同じチャットに送る。SLO の速い条件のアラートは作らない
  effect: アプリが動いていてもいなくても知らせが届く
  cost: 規則の費用（未定の値）
- name: すべて Cloud Monitoring のログの指標と規則にする
  effect: 作る量が少ない
  cost: トレース ID の例を添えにくい（FR-36 AC1）。規則の数だけ費用
- name: サーバーの中だけで知らせる
  effect: 外部の規則が要らない
  cost: アプリが止まると知らせられない
chosen: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送った記録を残し、送れなければ送り直す。毎日の処理は毎日の結果を送る。アプリが止まったときのために、Cloud Run の標準の指標に Cloud Monitoring の規則を一つ置き、同じチャットに送る。SLO の速い条件のアラートは作らない
rationale: FR-36（DRV-28）の種類、件数、トレース ID の例を添えた知らせをサーバーで作り、サーバーが止まった場合だけを Cloud Monitoring に任せる（質問 5）。SLO の速い条件のアラート（NFR-01〜03 のページ）は、参加者 2 人と乗車 2〜3 回（質問 7）では窓の中の出来事が N_alert_min（10 件）に届かないか、届いても何も見分けないので作らない。測るための記録と毎日の集計（DEC-16、DEC-05）は作るので、あとから足しても記録の形は変わらない
rejected:
- option: すべて Cloud Monitoring のログの指標と規則にする
  reason: FR-36 AC1 を満たしにくい
- option: サーバーの中だけで知らせる
  reason: DRV-01 で、止まったときに知らせられない
gains:
- アプリが止まっても知らせが届く
- 知らせにトレース ID の例が付く
costs:
- Cloud Monitoring の規則の費用（未定の値 C_monitoring_alert）
- 止まったときの知らせの条件は粗い
sensitive_points:
- まとめる間隔（NFR-33 の 5 分に収める）
trade_offs:
- with: DRV-26
  note: 規則を一つ持つ
assumptions:
- チャットは Webhook で知らせを受けられる（種類は未定。質問 8）
depends_on:
- DEC-16
- DEC-18
parameters:
- name: 知らせをまとめる間隔
  value: 1 分
  basis: NFR-33 の 5 分の内
debt:
  what: アプリが止まったときの知らせは、SLI-01 の六つの操作やテスト用アカウントを分けない粗い条件。SLO の速い条件のアラート（NFR-01〜03 のページ）は作らない
  why_accepted: 規則を一つで済ませる。参加者 2 人と乗車 2〜3 回（質問 7）では速い条件のアラートが何も見分けない
  repay_when: 品質チェーンが第 1 段階の課題 2（この段の課題 4）に答えたとき
deferred: false
revisit_when: 品質チェーンが第 1 段階の課題 2（この段の課題 4）に答えたとき
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
