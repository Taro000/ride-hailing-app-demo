id: DEC-17
title: 知らせはサーバーと毎日の処理から送り、止まったときと失敗したときは Cloud Monitoring
status: draft
version: 2
basis: inferred
basis_note: Cloud Monitoring の規則を置くことは質問 5、二つ目の規則（毎日の処理のジョブの失敗）を足すことは質問 14 で確認済み。ジョブの実行の結果の指標は Cloud Run の文書で確かめた。まとめる間隔、ジョブの一回の上限とやり直しの回数は推定
needs_agreement: true
approver_candidates:
- プロダクトオーナー
stage: architecture
question: 異常をどうエンジニアに知らせるか
addresses:
- DRV-28
- DRV-01
- DRV-27
- DRV-04
options:
- name: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送った記録を残し、送れなければ送り直す。毎日の処理は毎日の結果を送り、その日の処理を終えたと記録できないときと知らせを送れないときは失敗として終わる。Cloud Monitoring の規則を二つ置き、同じチャットに送る（アプリが止まったときを Cloud Run のサービスの標準の指標で見てデモの回の間だけ有効にし、毎日の処理のジョブの実行の失敗を見てデモの期間の間だけ有効にする）
  effect: アプリが動いていてもいなくても、毎日の処理が落ちても、知らせが届く
  cost: 規則の費用（未定の値。条件ごと）
- name: すべて Cloud Monitoring のログの指標と規則にする
  effect: 作る量が少ない
  cost: トレース ID の例を添えにくい（FR-36 AC1）。規則の数だけ費用
- name: サーバーの中だけで知らせる
  effect: 外部の規則が要らない
  cost: アプリが止まると知らせられない。毎日の処理が落ちても知らせられない
- name: 8:30 に毎日の処理をもう一度動かして、終わりの記録を確かめる（二つ目の定時の起動）
  effect: Cloud Monitoring の規則を増やさない
  cost: 同じイメージと資格情報で動くので、ジョブが落ちた理由（権限、イメージ、トークン）で一緒に落ち、外から見るものがない
chosen: サーバーがサーバーのエラー、外部の呼び出しの失敗、ブラウザから届いたエラーを種類ごとに 1 分まとめ、種類、時刻、件数、トレース ID の例を付けてチャットに送り、送った記録を残し、送れなければ送り直す。毎日の処理は毎日の結果を送り、その日の処理を終えたと記録できないときと知らせを送れないときは失敗として終わる。Cloud Monitoring の規則を二つ置き、同じチャットに送る（アプリが止まったときを Cloud Run のサービスの標準の指標で見てデモの回の間だけ有効にし、毎日の処理のジョブの実行の失敗を見てデモの期間の間だけ有効にする）
rationale: FR-36（DRV-28）の種類、件数、トレース ID の例を添えた知らせをサーバーで作り、サーバーが止まった場合を Cloud Monitoring に任せる（質問 5）。NFR-06（DRV-04、DRV-27）の 8:30 の知らせは、ジョブの中から送る知らせだけでは、ジョブが起動した後に落ちたときに出ない（FND-06）。ジョブを黙って成功させず、失敗した実行を外の規則で見る（質問 14）。06:00 に始めて遅くとも 07:30 に終わるか失敗し、知らせは 07:35 ごろで 8:30 に間に合う（計算）。案 4 は外から見るものにならない。SLO の速い条件のアラートは DEC-35 に分けた（FND-17）
rejected:
- option: すべて Cloud Monitoring のログの指標と規則にする
  reason: FR-36 AC1 を満たしにくい
- option: サーバーの中だけで知らせる
  reason: DRV-01 で、止まったときに知らせられない。DRV-04 の NFR-06 も満たさない
- option: 8:30 に毎日の処理をもう一度動かして、終わりの記録を確かめる（二つ目の定時の起動）
  reason: ジョブと同じ理由で一緒に落ち、DRV-04 の NFR-06 を満たさない
gains:
- アプリが止まっても知らせが届く
- 毎日の処理が落ちても、8:30 より前に知らせが届く
- 知らせにトレース ID の例が付く
costs:
- Cloud Monitoring の規則の費用（未定の値 C_monitoring_alert。条件二つ）
- 止まったときの知らせの条件は粗い
- 定時の起動そのものが止められているときは知らせない
sensitive_points:
- まとめる間隔（NFR-33 の 5 分に収める）
- ジョブの一回の上限とやり直しの回数（8:30 より前に失敗が決まること）
- ジョブが黙って成功しないこと
trade_offs:
- with: DRV-26
  note: 規則を二つ持つ
assumptions:
- チャットは Webhook で知らせを受けられる（種類は未定。質問 8）
- Cloud Run のジョブの実行の結果の指標（run.googleapis.com/job/completed_execution_count の result）で失敗した実行を数えられる。指標は 60 秒ごとに取られ、最大 120 秒遅れて見える（Cloud Run の文書）
depends_on:
- DEC-16
- DEC-18
parameters:
- name: 知らせをまとめる間隔
  value: 1 分
  basis: NFR-33 の 5 分の内
- name: 毎日の処理のジョブの一回の上限
  value: 45 分
  basis: 06:00 に始めて 2 回で遅くとも 07:30 に終わるか失敗し、知らせは 07:35 ごろ。NFR-06 の 8:30 に 55 分の余裕（計算）。ふだんの実行は数分（乗車 2〜6 回）
- name: 毎日の処理のジョブのやり直し
  value: 1 回
  basis: 一時の失敗を一度だけやり直し、8:30 より前に結果を決める（上の計算）
debt:
  what: アプリが止まったときの知らせは、SLI-01 の六つの操作やテスト用アカウントを分けない粗い条件。定時の起動そのものが止められているときは、どの規則も知らせない
  why_accepted: 規則を二つで済ませる。期間を始める手順が定時の起動を通して確かめ、止めるのは期間を終える手順だけにする
  repay_when: 第 1 段階の課題 2 でアラートの形が決まったとき
deferred: false
revisit_when: null
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 2 段階の下書き（質問 1〜12 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 毎日の処理のジョブの失敗を見る二つ目の規則と、ジョブが黙って成功しない決まり、ジョブの上限とやり直しの値を足し、8:30 に動かし直す案と比べた。SLO の速い条件のアラートの先送りを DEC-35 に分け、revisit_when を外した
  reason: FND-06、17（第 2 段階のレビュー）を受け入れた。質問 14 の回答
