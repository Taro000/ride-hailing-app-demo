id: DEC-17
title: システムのデータは一つのデータベースに置いて配車サーバーだけが書き、保存期間を過ぎた個人の情報は日々の処理で変え、戻すための写しの中のものは鍵を捨てて読めなくする
status: active
basis: inferred
basis_note: システムが止まっても確定した依頼と決済の結果を失わないこと（QR-17）、保存期間を過ぎた記録とデータの扱い（QR-59、FR-51）、取り出せる日数（QR-37、QR-42）、カードの情報を持たないこと（TC-11）、審査の結果と免許の期限を記録しないこと（TC-17）は入力。止まった後に戻すために残すもの、たどる記録、経過の記録にも保存期間を過ぎた個人の情報を残さない扱いは、品質チェーンが QR-17、QR-37、QR-15 と QR-59 の競合に書いたもの（DRV-02、DRV-07、DRV-24、DRV-27 と DRV-21 の競合）。戻すために残す写し（Turso の時点を指定した戻しとローカルのファイルの写し）の中の個人の情報を、記録した日ごとの鍵を捨てて読めなくするやり方（DEC-16）は FND-07 を受けて決めた。名前と理由から FR-51 の期間と扱いの言い直しを外し、ID で引くようにしたのは FND-08 による。置き方は推定。種類ごとの保持期間の値は第 3 段階が各データの実体で決める
premises: [CON-06, TC-07, TC-11, TC-17]
stage: architecture
question: どの種類のデータをどこに置き、誰が書き、どれだけ持ち、保存期間を過ぎたら、戻すために残す写しの中のものも含めてどうするか
addresses: [DRV-02, DRV-07, DRV-21, DRV-27, DRV-30, DRV-29, DRV-13, DRV-01]
options:
  - name: 一つのデータベース（ELM-04）に、アカウントと本人の確かめ、登録と顔写真、依頼と乗車、出来事、位置、お金の操作、評価、苦情、連絡のメッセージ、操作の記録、たどる記録、異常、切り替え、模擬の運賃表、知らせの宛先を置き、書くのは ELM-03 だけにする
    effect: 依頼の状態、出来事、お金の操作を一つの取引で書け、守りと戻しも一つで済む
    cost: たどる記録と顔写真もデータベースの大きさに入る
  - name: データベースに加え、顔写真をオブジェクトの置き場所に、たどる記録をログの置き場所に置く
    effect: データベースが小さく保たれる
    cost: 置き場所が三つになり、ローカルの代わりも三つ要り、たどる記録の保持と隠し方を二か所で守る
  - name: 機能ごとにデータベースを分ける
    effect: 機能ごとに大きさと守りを分けられる
    cost: 依頼の状態とお金の操作を一つの取引で書けない
chosen: 一つのデータベース（ELM-04）に、アカウントと本人の確かめ、登録と顔写真、依頼と乗車、出来事、位置、お金の操作、評価、苦情、連絡のメッセージ、操作の記録、たどる記録、異常、切り替え、模擬の運賃表、知らせの宛先を置き、書くのは ELM-03 だけにする
rationale: 三つ目は依頼の状態とお金の操作を一つの取引で書けず DRV-02 と DRV-07 を弱め、二つ目は置き場所とそのローカルの代わりを増やす（DRV-15、DRV-16）。量は小さい（OPF-02、OPF-03）ため、一つ目で大きさは問題にならない。カードの情報は EXT-01 にだけあり（DEC-12）、審査の結果と免許の期限はどこにも持たない（TC-17）。端末は、つながっていない間の端末のエラー、相手に示した時刻、送り直す操作だけを一時に持ち、送れたら消し、個人の情報を残さない。想定の本番は Turso が持つ複製と時点を指定した戻しで守り、ローカルはデータベースのファイルの写しで守る（戻しの訓練は NFR-16 で、第 2b 段階が置く）。種類ごとの保持期間は、取り出せる日数（QR-37、QR-42）以上、QR-59 の保存期間以下にし、保存期間を過ぎた記録とデータは、サーバーの日々の処理（DEC-18）が FR-51 のとおりに変える。戻すために残すものも同じに扱う。複製は変えた記録をそのまま写し、時点を指定した戻しとファイルの写しは書き換えられないため、その中の個人の情報は、日々の処理が記録した日ごとの鍵を写しとともに捨てて読めなくする（DEC-16）。そのため写しを持つ期間は、保存期間の扱いを左右しない（QR-17 と QR-59 の扱い）。模擬の運賃表は、エンジニアが開発の作業として版をつけて入れるデータで、利用者の操作では変わらない（QR-61、QR-62）
rejected:
  - option: データベースに加え、顔写真をオブジェクトの置き場所に、たどる記録をログの置き場所に置く
    reason: 置き場所とローカルの代わりが増え（DRV-15、DRV-16）、たどる記録の保持と隠し方を二か所で守る
  - option: 機能ごとにデータベースを分ける
    reason: 依頼の状態とお金の操作を一つの取引で書けず、DRV-02 と DRV-07 を弱める
gains:
  - 依頼、出来事、お金の操作を一つの取引で書き、止まっても失わない
  - 守り、戻し、保存期間を過ぎた個人の情報の扱いが一か所で済む
costs:
  - 一つのデータベースが止まると、すべての機能が止まる
sensitive_points: []
trade_offs: []
assumptions:
  - Turso は複製と時点を指定した戻しで、確定したデータを失わない
depends_on: [DEC-01, DEC-08]
parameters: []
