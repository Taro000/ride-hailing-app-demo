id: DEC-42
title: 状態を変える要求は Idempotency-Key に操作ごとの UUID を付け、同じキーには最初の答えを返し、外部を呼ばない操作は結果とキーを一つの取引で書き、外部を呼ぶ操作は答えの期限の後に試みから答える
status: active
basis: assumed
basis_note: 端末の状態を変える操作を一回の操作ごとのキーで冪等にし、答えを受けるまで同じキーで送り直すことは DEC-08（入力）。お金の操作の試みを呼ぶ前に書き、呼び出しをまたぐ取引を作らないことは DEC-10（入力）。インスタンスが落ちると処理中の操作が失敗しうることは DEC-05（入力）。キーを運ぶヘッダー、範囲、答え方、キーの記録の書き方は第 3 段階の確定の種類（推定）。キーの記録を外部を呼ぶかで分けて書き、受けたインスタンスが答える前に止まっても同じキーの送り直しが答えを受けるようにしたことは FND-22 を受けた（推定）。結果が分からないお金の操作の送り直しの答えは DEC-45。キーを持つ 24 時間は DAS-13、動いているキーへの送り直しに待たせる時間は DAS-14 による暫定の決定で、その値を parameters に置いたことは FND-33 を受けた。受けたインスタンスが EXT-01 の待ちを答えの期限から結果を書く取引の分を引いた時刻までに終えて期限までに答え、結果を書く取引が遅れた残りの重なりを失うものと応答を左右する点に書いたことは FND-37 を、最初の答えを示すヘッダーを DEC-44 の名付けの決まりにそろえて X-Idempotent-Replayed にしたことは FND-39 を受けた（推定）。セッションの印が同じ origin のどのタブにも付くクッキーである（DEC-40）ため、キーをそれを最初に受けたアカウントと操作に結び付け、ほかのアカウントか操作で受けたキーを行わずに 422 IDEMPOTENCY_KEY_REUSED で答え、利用側はそれを受け付けなかった答えとして読み直すことは FND-50 を受けた（推定。キーが UUID v4 でアカウントと操作をまたいで重ならないことは DEC-36）
premises: [DAS-13, DAS-14]
stage: high-level-design
question: 状態を変える要求に冪等キーをどう付け、同じキー、動いているキー、中身の違うキー、ほかのアカウントか操作で受けたキーにどう答え、受けたインスタンスが答える前に止まったときに同じキーの送り直しにどう答え、キーをどれだけ持つか
addresses: [DRV-02, DRV-07, DRV-32, FR-30, FR-40, FND-22, FND-37, FND-39, FND-50]
options:
  - name: Idempotency-Key のヘッダーに端末が操作ごとに作る UUID v4 を付ける。外部を呼ばない操作は結果とキーと答えを一つの取引で書いて動いている印を持たず、外部を呼ぶ操作は呼ぶ前の取引で試みとともにキーを動いているとして書き、その操作の答えの期限を過ぎても答えがなければ送り直しに試みから答える
    effect: 重なった要求と送り直した操作は一度だけ効き、受けたインスタンスが答える前に止まっても、送り直しは答えを受ける
    cost: 外部を呼ぶ操作の送り直しは、答えの期限まで 409 を受けて待つ
  - name: Idempotency-Key のヘッダーで、どの操作も処理の前に動いている印を書き、答えの期限に余裕を足した時刻を過ぎた印は止まったとみなして取り直す
    effect: どの操作も一つの決まりで扱える
    cost: 状態を変えるどの操作も処理の前に取引が一つ増え、止まったとみなすまでの余裕を別に決める
  - name: 本文の項目で操作ごとの ID を送る
    effect: ヘッダーを使わない
    cost: 操作ごとに項目の名前と扱いが分かれ、境界の一か所で扱えない
chosen: 状態を変える要求（POST、PUT、PATCH、DELETE）は Idempotency-Key のヘッダーに、端末が利用者の一回の操作ごとに作る UUID v4 を付け、答えを受けるまで同じキーで送り直す（DEC-08）。このキーはアカウントと操作をまたいで重ならない（DEC-36）ので、ELM-03 はキーをそれを最初に受けたアカウントと操作（経路）に結び付けて持ち、どのアカウントと操作でもキーは一つと数える。最初に受けたのと同じアカウントの同じ操作の同じ要求（方法、経路、本文のハッシュ）には最初の答え（状態と本文）を X-Idempotent-Replayed の true のヘッダーとともに返す（DEC-44）。ただし、結果が分からないと 202 で答えたお金の操作（DEC-45）の送り直しには、そのときの結果を答え、EXT-01 への確かめを早める。ほかのアカウントか操作で受けたキーと、同じアカウントの同じ操作で中身が違う要求は、行わずに 422 IDEMPOTENCY_KEY_REUSED で答える。そのため、一つの操作の要求とその送り直しの間に、同じブラウザのほかのタブのサインインでセッションのアカウントが替わっても（DEC-40 のクッキーは同じ origin のどのタブの要求にも付く）、送り直しがほかのアカウントの新しい操作として行われることはない。利用側は 422 IDEMPOTENCY_KEY_REUSED を受け付けなかった答えとして、今の状態を読み直して示し、し直すのは利用者が改めて操作したときで、新しいキーで送る。キーの記録（DAT-26）の書き方は、操作が外部のシステムを呼ぶかで分ける。外部を呼ばない操作は、操作の結果とキーと答えを一つの取引で書き（キーは一つ）、その前に動いている印を書かない。同じキーの要求が重なれば、先に取引を終えた一つだけが効き、ほかはその答えを返す。答える前に受けたインスタンスが止まれば、その取引は終わっておらず何も効いていないため、同じキーの送り直しはその操作を初めから行う。外部を呼ぶ操作（お金の操作と支払い方法の登録。IFC-03、IFC-07、IFC-13）は、呼ぶ前の取引で試み（DAT-11）とともにキーを動いているとして、その操作に ELM-03 が答える期限の時刻とともに書き、結果を書く取引で答えを書く。受けたインスタンスは EXT-01 の待ちを、この期限から結果を書く取引の予算（DEC-46）を引いた時刻までに終える（IFC-17）ので、結果を書く取引が予算のうちならこの期限までに答えを書く。期限のうちの同じキーの送り直しには 409 OPERATION_IN_PROGRESS（Retry-After は 1 秒）を返し、利用側は待って同じキーで送り直す。期限を過ぎても答えがなければ（受けたインスタンスが止まったか遅れた）、送り直しを受けた ELM-03 が試みの状態から DEC-45 のとおりに答え、その答えをキーに書く。答えを書く取引は、キーがまだ動いているときだけ答えを書く（遅れたインスタンスは、ほかが書いた答えを上書きしない）。キーと最初の答えは最初に受けてから 24 時間持つ（DAS-13）。キーを付けないのは、読むだけの操作（GET と、探すか求めるだけの POST。場所の検索、位置で探す住所、見積もり、降りる場所の変更の見積もり、照会と記録の検索、たどる記録の検索）と、送り直しても害のない操作（サインインと使い終える操作、位置、端末からの報告、知らせの宛先）だけで、キーが要る操作で欠けていれば 400 VALIDATION_FAILED（details の field は Idempotency-Key）
rationale: 三つ目は操作ごとに受け取り方が分かれ、境界の一か所（POL-04 の src/http/）で扱えない。二つ目は、許諾と取り消し（NFR-07 の道）を含むどの操作にも処理の前の取引を一つ足し、止まったとみなすまでの余裕という値を増やす。一つ目は、外部を呼ばない操作では結果とキーを一つの取引で書くため、その取引が終わる前に止まった操作は何も効いておらず、送り直しが初めから行っても二重にならない。止まった印が残らないので、送り直しが答えを受けられないこともない（DRV-02）。外部を呼ぶ操作では、呼んだ後に止まると EXT-01 で効いたかもしれないため、送り直しで初めから行うと二度目の試みになる。そのため試みとともにキーを動いているとし、DEC-45 が使うその操作の答えの期限（IFC-03、IFC-07、IFC-13）を過ぎたら、試みの状態から答える。受けたインスタンスは EXT-01 の待ちをその期限から結果を書く取引の分を引いた時刻までに終えるので、自身の処理と取引 A が予算を超えて EXT-01 に送るのが遅れても期限までに答え、止まったとみなすための余裕は要らない（余裕を足すと、受けたインスタンスが止まったときの送り直しの待ちが延び、値も一つ増える）。結果を書く取引そのものが予算を超えて期限を過ぎ、その間に送り直しが届いて重なっても、キーがまだ動いているときだけ答えを書くので答えは一つに定まる。ヘッダーの名前は IETF の Idempotency-Key と、EXT-01 が同じ名前で同じ答え方をすること（IFC-17）にそろう。中身の違う要求に最初の答えを返さないのは、取り違えた操作の結果を別の操作の結果として示さないため。キーを最初に受けたアカウントと操作に結び付け、ほかのアカウントか操作で受けたキーを行わないのは、セッションの印が同じ origin のどのタブの要求にも付くクッキーで（DEC-40）、一つの操作の要求とその送り直しの間にほかのタブのサインインでアカウントが替わりうるため。範囲をアカウントで分けると、その送り直しは替わったアカウントの新しい操作として行われ、最初の要求が済んでいれば二度目の返金か操作になる（DRV-32、FND-50）。端末が要求のたびにアカウントを確かめても、確かめてから送るまでの間に替わりうるため、一度だけ効くことは ELM-03 が守る。キーは UUID v4 で、正しく作った操作のキーがほかのアカウントか操作と重なることはないため、422 で退けても正しい操作を退けない。結果が分からないお金の操作の送り直しにそのときの結果を答えるのは、FR-30 の 2 と FR-40 の 3（やり直すと済んだかどうかを示す）を満たすため。読むだけの操作と位置などは送り直しても一度目と同じに効くか害がないので、キーを求めない
rejected:
  - option: Idempotency-Key のヘッダーで、どの操作も処理の前に動いている印を書き、答えの期限に余裕を足した時刻を過ぎた印は止まったとみなして取り直す
    reason: 外部を呼ばない操作は一つの取引で結果とキーを書けば足りるのに、NFR-07 の道の操作を含むどの操作にも取引を一つ足し、止まったとみなす余裕という値を増やす（DRV-16）
  - option: 本文の項目で操作ごとの ID を送る
    reason: 操作ごとに扱いが分かれ、境界の一か所で扱えず DRV-02 の漏れを生みうる
gains:
  - 途切れて送り直した操作も、重なった同じ操作も、一度だけ効く
  - 受けたインスタンスが答える前に止まっても、同じキーの送り直しは答えを受ける
  - 一つの操作の送り直しの間にセッションのアカウントが替わっても、その操作はほかのアカウントで行われない
  - 冪等キーの扱いが境界の一か所で済む
costs:
  - ELM-03 はキーと最初の答えを 24 時間持つ
  - 外部を呼ぶ操作の送り直しは、受けたインスタンスが止まると答えの期限まで待つ
  - 外部を呼ぶ操作の結果を書く取引が予算を超えて答えの期限を過ぎ、その間に同じキーの送り直しが届くと、送り直しが試みから書いた答えが残る。押さえと押さえ直しは受け付けなかったか変えなかったと示され、遅れたインスタンスが得た押さえは解く（お金は二重に動かない）
sensitive_points:
  - キーと最初の答えを持つ期間。短いと、つながらない間に持った操作を後で送ったときに新しい操作として扱われる（値は DAS-13）
  - 外部を呼ぶ操作の結果を書く取引の遅い裾。答えの期限の直前に予算（DEC-46 の 0.1 秒）を超えると、遅れたインスタンスの答えを送り直しの答えが置き換えうる（済むはずの依頼が受け付けなかったと示され、SLI-01 の悪いイベントになる）
trade_offs: []
assumptions:
  - 端末が送り直す操作は、最初に送ってから 24 時間のうちに送られる（DAS-13）
depends_on: [DEC-08, DEC-10, DEC-35, DEC-36, DEC-40, DEC-45]
parameters:
  - name: 冪等キーと最初の答えを持つ期間
    value: 24 時間
    basis: 端末がつながらない間に持つ送り直しの操作（DEC-17）が送られるまでを見込んだ暫定の値（DAS-13）。EXT-01 がキーを持つ 24 時間とそろう
  - name: 外部を呼ぶ操作の動いているキーへの同じキーの送り直しに返す Retry-After
    value: 1 秒
    basis: 答えの期限（8.8 秒、IFC-03、IFC-13）のうちに数回だけ送り直させ、期限を過ぎたらすぐ答えを受けられる長さとして選んだ暫定の値（DAS-14）
debt: null
as_is: new
