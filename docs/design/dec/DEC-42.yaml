id: DEC-42
title: 状態を変える要求は Idempotency-Key に操作ごとの UUID を付け、同じキーには最初の答えを、動いている間は 409 を、中身の違う要求には 422 を返す
status: active
basis: assumed
basis_note: 端末の状態を変える操作を一回の操作ごとのキーで冪等にし、答えを受けるまで同じキーで送り直すことは DEC-08（入力）。キーを運ぶヘッダー、範囲、答え方は第 3 段階の確定の種類（推定）。結果が分からないお金の操作の送り直しの答えは DEC-45。キーを持つ 24 時間は DAS-13 による暫定の決定
premises: [DAS-13]
stage: high-level-design
question: 状態を変える要求に冪等キーをどう付け、同じキー、動いているキー、中身の違うキーにどう答え、どれだけ持つか
addresses: [DRV-02, DRV-07, DRV-32, FR-30, FR-40]
options:
  - name: Idempotency-Key のヘッダーに端末が操作ごとに作る UUID v4 を付け、範囲はアカウント、操作、キーの組で、同じものには最初の答え、動いている間は 409、中身が違えば 422 を返す
    effect: 送り直した操作は一度だけ効き、どの操作も同じ決まりで扱える
    cost: ELM-03 は答えを 24 時間持つ
  - name: 本文の項目で操作ごとの ID を送る
    effect: ヘッダーを使わない
    cost: 操作ごとに項目の名前と扱いが分かれ、境界の一か所で扱えない
chosen: 状態を変える要求（POST、PUT、PATCH、DELETE）は Idempotency-Key のヘッダーに、端末が利用者の一回の操作ごとに作る UUID v4 を付け、答えを受けるまで同じキーで送り直す（DEC-08）。キーの範囲はアカウント、操作（経路）、キーの組。同じ範囲の同じ要求（方法、経路、本文のハッシュ）には最初の答え（状態と本文）を Idempotent-Replayed の true のヘッダーとともに返す。ただし、結果が分からないと 202 で答えたお金の操作（DEC-45）の送り直しには、そのときの結果を答え、EXT-01 への確かめを早める。最初の要求が動いている間は 409 OPERATION_IN_PROGRESS（Retry-After は 1 秒）で、利用側は待って同じキーで送り直す。同じ範囲で中身が違う要求は 422 IDEMPOTENCY_KEY_REUSED で、利用側は新しい操作として新しいキーで送る。キーと最初の答えは最初に受けてから 24 時間持つ（DAS-13）。キーを付けないのは、読むだけの操作（GET と、探すか求めるだけの POST。場所の検索、現在地の住所、見積もり、照会と記録の検索、たどる記録の検索）と、送り直しても害のない操作（サインインと使い終える操作、位置、端末からの報告、知らせの宛先）だけで、キーが要る操作で欠けていれば 400 VALIDATION_FAILED（details の field は Idempotency-Key）
rationale: 二つ目は操作ごとに受け取り方が分かれ、境界の一か所（POL-04 の src/http/）で扱えない。一つ目は IETF の Idempotency-Key のヘッダーの名前と、EXT-01 が同じ名前で同じ答え方をすること（IFC-17）にそろい、ELM-03 の入口の一か所で、記録（DAT-26）と照らしてどの操作にも当てられる。中身の違う要求に最初の答えを返さないのは、取り違えた操作の結果を別の操作の結果として示さないため。結果が分からないお金の操作の送り直しにそのときの結果を答えるのは、FR-30 の 2 と FR-40 の 3（やり直すと済んだかどうかを示す）を満たすため。読むだけの操作と位置などは送り直しても一度目と同じに効くか害がないので、キーを求めない
rejected:
  - option: 本文の項目で操作ごとの ID を送る
    reason: 操作ごとに扱いが分かれ、境界の一か所で扱えず DRV-02 の漏れを生みうる
gains:
  - 途切れて送り直した操作は一度だけ効く
  - 冪等キーの扱いが境界の一か所で済む
costs:
  - ELM-03 はキーと最初の答えを 24 時間持つ
sensitive_points:
  - キーと最初の答えを持つ期間。短いと、つながらない間に持った操作を後で送ったときに新しい操作として扱われる（値は DAS-13）
trade_offs: []
assumptions:
  - 端末が送り直す操作は、最初に送ってから 24 時間のうちに送られる（DAS-13）
depends_on: [DEC-08, DEC-10, DEC-35]
parameters:
  - name: 冪等キーと最初の答えを持つ期間
    value: 24 時間
    basis: 端末がつながらない間に持つ送り直しの操作（DEC-17）が送られるまでを見込んだ暫定の値（DAS-13）。EXT-01 がキーを持つ 24 時間とそろう
debt: null
as_is: new
