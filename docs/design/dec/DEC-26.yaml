id: DEC-26
title: 一つのリポジトリをパッケージに分け、依存の規則を CI で確かめる
status: draft
version: 2
basis: inferred
basis_note: 提案
needs_agreement: false
approver_candidates: []
stage: architecture
question: コードをどう分け、どの依存を許すか
addresses:
- DRV-14
- DRV-31
- DRV-26
- DRV-17
- DRV-15
- DRV-10
- DRV-23
options:
- name: 一つのリポジトリの中を、ドメインの規則、ユースケース、外部サービスの包み、API の約束、サーバー、毎日の処理、三つの Web アプリ、共通の画面の部品、手元の保守の手順に分け、依存の向き（外部サービス、時計、ID の生成の口は application に置き、adapters がそれを実装し、server と batch が組み立てる。application は adapters を読み込まない）と「状態を書くのは配車のモジュールだけ」「座標の表を読み書きするのは位置のモジュールだけ」「Stripe と地図のライブラリは包みだけ」「位置情報と画面の点灯は端末のモジュールだけ」を CI の依存の確かめで守る
  effect: NFR-11・42 を CI で確かめられる。変更の範囲が見える。外部サービスを替えても口は変わらない
  cost: 規則を書いて保つ手間
- name: 一つのパッケージの中でフォルダーだけで分ける
  effect: 手軽
  cost: 境目を確かめる手段が弱く、崩れやすい
- name: リポジトリを分ける
  effect: 境目がはっきりする
  cost: 一人で複数のリポジトリと版を合わせる手間
chosen: 一つのリポジトリの中を、ドメインの規則、ユースケース、外部サービスの包み、API の約束、サーバー、毎日の処理、三つの Web アプリ、共通の画面の部品、手元の保守の手順に分け、依存の向き（外部サービス、時計、ID の生成の口は application に置き、adapters がそれを実装し、server と batch が組み立てる。application は adapters を読み込まない）と「状態を書くのは配車のモジュールだけ」「座標の表を読み書きするのは位置のモジュールだけ」「Stripe と地図のライブラリは包みだけ」「位置情報と画面の点灯は端末のモジュールだけ」を CI の依存の確かめで守る
rationale: DRV-14（NFR-42）と原則 DRV-31（NFR-11）を CI で確かめられる形にする。TC-01・04（DRV-17）の TypeScript と Oxlint の上に、依存の確かめの道具を足す（TC-13）。一人（DRV-26）なのでリポジトリは一つ。料金（R_fare、DRV-23）と評価値の計算（DRV-10）はドメインの規則の一か所に置き、変えるときはそこだけが変わる。安定した部分（application）が変わりやすい部分（外部サービスの包み）に依存しないよう、口を application に置く（FND-16）。座標の表の読み手を一つのモジュールに閉じる（DEC-15）
rejected:
- option: 一つのパッケージの中でフォルダーだけで分ける
  reason: DRV-14 と DRV-31 を確かめにくい
- option: リポジトリを分ける
  reason: DRV-26 で負ける
gains:
- 依存の規則を CI で確かめられる
- 変更の範囲が見える
- 外部サービスの版を上げても口は変わらない
costs:
- 規則を書いて保つ手間
sensitive_points:
- 依存の規則を CI で落とすこと
- application が adapters を読み込まないこと
trade_offs: []
assumptions:
- 依存の確かめの道具の候補は dependency-cruiser（第 4 段階で決める）
depends_on: []
parameters: []
debt: null
deferred: false
revisit_when: null
as_is: new
