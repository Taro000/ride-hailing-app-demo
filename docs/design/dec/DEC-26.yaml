id: DEC-26
title: 変えた振る舞いはデータベースの切り替えで止め、保存するデータの形は前の版が読める足し方で変え、戻すときは前の版を配備し直す
status: active
basis: inferred
basis_note: システムを動かしたまま変えた振る舞いを止めること（FR-36）、前の版に戻しても進んでいる依頼と記録を使い続けること（QR-39）、データを移しても失わないこと（QR-40）、新しい版の配備はデモの回を開くときで止めずに入れ替えることは求めないこと（TC-15）は入力。どう切り替えるか（FR-36 の basis_note が設計に任せた点）は推定
premises: [TC-15]
stage: architecture
question: 問題のある変更を動かしたまま止め、前の版に戻しても依頼と記録を使い続けるには、切り替えとデータの形の変え方をどうするか
addresses: [DRV-13, DRV-12]
options:
  - name: 切り替えをデータベースに置いてエンジニアの画面から変え、サーバーは操作ごとに読み、Web アプリには流れで伝え、データの形は一つの版の中では足すだけにして前の版が新しい版の書いたデータを読めるようにし、戻すときは前の版を配備し直す
    effect: 動かしたまま振る舞いを止められ、前の版に戻しても新しい版の書いたデータを読める
    cost: 消す変更を後の版に回し、切り替えの残りを片付ける手間がかかる
  - name: 切り替えを設定の値にし、変えるときにサーバーを起動し直す
    effect: 切り替えを読む仕組みが単純になる
    cost: 止めるたびにサーバーを起動し直し、動かしたまま止められない
  - name: 外部の切り替えのサービスを使う
    effect: 切り替えの画面と仕組みをそのサービスが持つ
    cost: 外部のサービスと費用が増え、ローカルの代わりが要る
chosen: 切り替えをデータベースに置いてエンジニアの画面から変え、サーバーは操作ごとに読み、Web アプリには流れで伝え、データの形は一つの版の中では足すだけにして前の版が新しい版の書いたデータを読めるようにし、戻すときは前の版を配備し直す
rationale: 二つ目は FR-36 の動かしたまま止めることを満たさず、三つ目は外部のサービスとローカルの代わりが増える（DRV-15、DRV-16）。一つ目は切り替えを変えたときから振る舞いが戻り、進んでいる依頼と乗車は途中で失われない（FR-36）。データの形を足すだけで変えるので、前の版に戻しても新しい版の書いた依頼と記録を読める（QR-39）。消す変更は、前の版に戻す見込みがなくなった後の版で行う。前の版への戻しは、想定の本番では Cloud Run の前の版に流れを戻し、ローカルでは前の版を動かし直す。配備と戻しの手順とその自動化、データの形を変える道具は第 2b 段階が決める
rejected:
  - option: 切り替えを設定の値にし、変えるときにサーバーを起動し直す
    reason: 動かしたまま止められず、FR-36 を満たさない
  - option: 外部の切り替えのサービスを使う
    reason: 外部のサービスとローカルの代わりが増え、DRV-15 と DRV-16 で劣る
gains:
  - 問題のある振る舞いを動かしたまま止められる
  - 前の版に戻しても、新しい版の書いたデータを読める
costs:
  - データの形を消す変更は、二つの版に分けて行う
sensitive_points: []
trade_offs: []
assumptions: []
depends_on: [DEC-05, DEC-06, DEC-17]
parameters: []
debt: null
as_is: new
