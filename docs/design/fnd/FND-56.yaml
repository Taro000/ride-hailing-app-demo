evidence: DEC-12 のキーの表で、未払いの支払いには「確かめ中か成功の試みがあれば新しい試みを受けない」という守りがあるが、返金の行（キーは返金の要求ごと、返金できる残りの額の範囲で何度でも）にはない。FR-50 版 4 は失敗と分かった後のやり直しを新しい返金の要求にする。結果が分からない返金が実は成功していたとき、それを残りの額に数えずに新しい要求を受けると、二度返金しうる（NFR-07 が翌朝に見つける）。第 3 段階には「確かめ中の返金があるあいだは 409 REFUND_IN_PROGRESS」があるが、それを縛る第 2 段階の決めがない
suggestion: DEC-12 に、確かめ中の返金があるあいだは同じ依頼の新しい返金の要求を受けない（または確かめ中の額を残りの額から引く）と書く
