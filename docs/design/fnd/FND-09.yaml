id: FND-09
title: 想定の本番のデモの回の外では、日々の処理が動かなかったことを誰にも知らせない
status: accepted
basis: inferred
basis_note: DEC-05、DEC-18、DEC-20 の決め方、DRV-24 の環境と測定量、NFR-39 と NFR-46 の確かめ方、DAS-05 の statement、第 2 段階の報告の CUJ-10 と DRV-24 の通し確認は入力。デモの回の外のインスタンスを 0 とすることは DAS-02 による決定（第 3 段階のレビューの質問 2 で確認済み）で、この指摘はそれに頼る。回の外に日々の処理が起きられないか知らせる前に止まると、どの仕組みも知らせないことはこのレビューの推定
premises: [DAS-02]
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-20]
severity: major
evidence: FND-05 を受けて、DEC-20 は外からの生存確認をデモの回の間だけ動かすことにした（回を開く手順で入れ、閉じる手順で止める）。回の外は ELM-03 のインスタンスが 0 で（DEC-05、DAS-02）、日々の処理（DEC-18）だけが Cloud Scheduler の呼び出しで動く。その日々の処理が、FR-51 の変換と DEC-16 の保存期間を過ぎた日の鍵を捨てること（FND-07 を受けて加わった）、EXT-01 との照合、記録の欠けと取り出せる期間の確かめ（NFR-39 は、たどる記録と乗車の記録を取り出せることを毎日確かめ、取り出せなければ知らせる）を行い、NFR-46 などの監視の条件も、回の外はそのときにしか確かめられない。日々の呼び出しで ELM-03 が起きられないか、知らせを出す前に止まったとき、異常を知らせるのは ELM-03 自身（DEC-20 の選んだ案）なので知らせは出ず、外からの生存確認も回の外は止まっているため、エンジニアには何も届かない。DRV-24（主な要求）の環境は「デモの回の間と、その後 N_trace_retention_days の間」、応答は「異常は漏れなく知らされ」、測定量は NFR-39 の監視を含むため、回の外では一部しか満たされない。DEC-20 は生存確認を回の間だけにする理由を費用の見積もり（DRV-16）だけに結び付け、それが弱める DRV-24 も回の外の日々の処理も、失うものと引き換えに書いていない。第 2 段階の報告の DRV-24 の行は残るリスクに「生存確認（デモの回の間だけ動く）だけが知らせる」と書くが、CUJ-10 の「異常・エラーの通知受取」の行は欠けなしで「サーバーそのものの停止は、想定の本番では外からの生存確認が知らせる」とし、DAS-05 の statement も回を問わずメールで知らせるとしたまま。回の外の日々の処理が止まっても気づかないリスクは、DAS-02 にも第 2 段階の決めたことにもない
suggestion: 回の外にインスタンスを起こさないまま、日々の処理が動かなかったか終わらなかったことをエンジニアに知らせる仕組みを決めて DEC-20 に書く。たとえば、Cloud Scheduler の呼び出しの失敗か、日々の処理が終わったという記録が決まった時刻までに来ないことを、生存確認と同じく想定の本番だけの補いとしてプラットフォームからメールで知らせる。その費用を DRV-16 に照らし、DRV-24 と CUJ-10 の通し確認と DAS-05 をそれに合わせる。仕組みを置かずに受け入れるなら、DRV-24 の応答と、FR-51（QR-59、法令）の変換と鍵を捨てることが止まったまま気づかれないリスクを受け入れる事業の判断になり、個人の情報の害で重大さが高いため、利用者に尋ねる
resolution: 受け入れ。DEC-20 に、想定の本番で日々の処理が動かなかったか終えなかったことを、ELM-03 を呼ばずに Cloud Monitoring のアラートが回を問わず開発者にメールで知らせる仕組みを決めた。日々の処理はすべての仕事を終えたらそのことを個人の情報を含まない記録としてプラットフォームのログに書き、アラートは Cloud Scheduler が日々の呼び出しを失敗と記録したときと、予定の時刻から決まった時間のうちに終えた記録が届かないときに知らせる。生存確認を回の外も動かす案と、回の外を見張らない案を比べて退けた。DRV-16 に照らすと、インスタンスの時間は増えず、アラートの料金（P_monitoring_month）だけが加わり、DEC-20 の引き換えに書いた。ELM-08 にアラートとログを、HND-10 に記録を待つ時間を、脅威のモデルに知らせのメールの流れ F14 を加え、DAS-05 の statement を合わせ、DRV-24、DRV-16、DRV-15 と CUJ-10 の通し確認、配置と外部との関係のビューを直した。DAS-02 は評価の注だけを直し、決めたことは変えていない
