id: FND-50
title: 冪等キーの範囲はアカウントを含むが、セッションのクッキーは同じ origin のどのタブと二つの Web アプリにも共通で、端末は一つの操作のどの要求も同じアカウントで送ることを確かめられても保てない
status: accepted
basis: inferred
basis_note: DEC-40、DEC-42 の中身と、ELM-01 と ELM-02 が ELM-03 と同じ origin から配られること（DEC-40 の想定）は入力。同じ origin のタブがクッキーを共有することはブラウザの決まり。確かめの後にも重なりが残ることは第 4 段階の ELM-02 の推定
premises: []
raised_by: high-level-design-to-detailed-design
raised_in: 4-detailed-design/ELM-02.md
to: architecture-to-high-level-design
targets: [DEC-42]
severity: minor
evidence: DEC-42 は冪等キーの範囲をアカウント、経路、キーの組とし、範囲の外の同じキーを新しい操作として行う。DEC-40 の本人の確かめの印は __Host-session のクッキーだけで、同じ origin のどのタブの要求にも自動で付き、ELM-01 と ELM-02 は同じ origin から配られる（DEC-40 の想定）。そのため、一つの操作の最初の要求と送り直しの間に、ほかのタブ（ELM-01 のタブを含む）でほかのアカウントがサインインすると、送り直しはそのアカウントの範囲の新しい操作になる。返金なら、最初の要求が済んでいたときに二度目の返金になる（DRV-32）。第 4 段階の ELM-02 は FND-44 を受けて、MOD-01 が冪等キーのある操作の要求を出す直前に GET /v1/me でセッションのアカウントを確かめ、ELM-02 のタブの間でアカウントの変化を知らせるようにしたので、残るのは、確かめの答えを受けてから要求を出すまでの間（ミリ秒の幅）に、ほかのタブのサインインの答えがクッキーを替えたときだけになった。起きるには、同じブラウザで二つの担当者のアカウントが重なってサインインし、その答えがその幅に届く必要があり、ふつうには起きないので軽微とした。それでも DEC-42 の一度だけの約束は、端末が保てない前提（範囲のアカウントが一つの操作の要求の間で変わらない）に頼ったまま残る。ELM-01 の操作（IFC-03 の決済のやり直しなど）も同じ決まりの下にあり、第 4 段階の ELM-01 の実行も同じ確かめを要する
suggestion: ELM-03 が、すでに持つ冪等キーをほかのアカウントか経路の範囲で受けたら、行わずに 422 IDEMPOTENCY_KEY_REUSED で答えると DEC-42 に加える（キーは利用者の一回の操作ごとに端末が作る UUID v4 で、アカウントをまたいで重ならない、DEC-36）。そうすれば一度だけの約束は端末の確かめによらず、ELM-01 と ELM-02 は要求ごとにアカウントを確かめる要求を省ける。ELM-02 の MOD-02 は 422 IDEMPOTENCY_KEY_REUSED を今も受け付けなかった答えとして扱い、一覧を読み直す
resolution: 受け入れ。DEC-42 は、キーをそれを最初に受けたアカウントと操作に結び付け、ほかのアカウントか操作で受けたキーを行わずに 422 IDEMPOTENCY_KEY_REUSED で答え、利用側はそれを受け付けなかった答えとして今の状態を読み直し、し直すのは利用者が改めて操作したときに新しいキーで送るとした。DAT-26 の整合の取り方も同じにした。一度だけ効くことは端末の確かめによらなくなり、ELM-01 と ELM-02 は要求ごとにアカウントを確かめる要求を要しない（第 4 段階が ELM-02 の次の実行で取り上げる）
