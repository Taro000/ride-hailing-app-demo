id: FND-50
title: 確かめ中の押さえの片付け（DEC-12 の (d)）が T_hold_wait と乗客の取り消しで止まらず、やめた依頼に押さえを作りうる
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-04-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-12
- DEC-04
- DEC-11
severity: major
evidence: DEC-12 の (d)（報告書の DEC-12 の節）は、確かめ中の操作を見回りと毎日の処理が「起きていなければ、最初の送信から 24 時間の内で、保たれた失敗がないときは同じキーで送る。そうでなければ、試みの番号を進めた新しいキーで送る」とし、操作の種類で分けていない。一方で DEC-12 の根拠と DEC-11 の選んだ案は、押さえの結果が分からないときは「T_hold_wait までに押さえたと分かれば進め、分からないまま過ぎるか乗客が取り消したらやめて、押さえが残っていれば取り消す」とする（FR-05 版 3、FR-12 版 4 の AC5）。(d) を字のとおり読むと、T_hold_wait を過ぎた後や乗客が取り消した後も 24 時間の内は押さえを送り直せ、やめた依頼に新しい押さえができる。押さえが見つかったときも (d) は「記録する」だけで、取り消すとは書いていない。また (d) の「試みの番号」は、キーの表では未払いの支払いにしかない（押さえは「依頼の ID と押さえの何番目か」、確定と取り消しは「PaymentIntent の ID と『確定』/『取り消し』」）。さらに版 4 で足したシステムが始めるお金の操作（T_request_max での解放、手配や変更をやめたときの解放、見回りが押さえ直しを遅れて確かめたときの古い押さえの取り消し）は、操作キーの一覧（「画面が操作ごとにキーを作り」）にも処理中の記録の扱いにも出てこない。第 3 段階の DEC-52 は送り直しを「T_hold_wait の内だけ」に限っているが、それを縛る第 2 段階の決めがない（DRV-04 は主な要求）
suggestion: (d) を操作の種類で分ける。押さえ（手配と押さえ直し）の送り直しは T_hold_wait の内で、依頼がまだ確かめ中のときだけにし、それを過ぎたか乗客が取り消したら送らず、見つかった押さえは取り消す。どのキーに試みの番号があるかを表に書く。システムが始めるお金の操作ごとに、どこで動くか、キー、処理中の記録を書くかを表に足す
