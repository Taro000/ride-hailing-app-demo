id: FND-44
title: ほかのタブでほかのアカウントがサインインすると、このタブに残った答えのない返金が、そのアカウントでキーの範囲の外として送られ、二度返金されうる
status: accepted
basis: inferred
basis_note: DEC-40、DEC-42、MOD-01、MOD-02 の中身は入力。同じ origin のタブがクッキーを共有することはブラウザの決まり。二度返金される流れはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-02.md
to: high-level-design-to-detailed-design
targets: [MOD-01, MOD-02]
severity: major
evidence: DEC-40 のセッションの印は __Host-session のクッキーだけで、Web アプリは読まず、同じ origin のどの要求にも自動で付く。同じブラウザのタブはこのクッキーを共有する。一方、MOD-01 はアカウントの変化を同じタブの MOD-09 の useAccount からだけ知り、定まっていない操作とタブの保存（sessionStorage）はタブごとにある。MOD-02 は答えのない返金の操作をやめさせず、同じキーの「もう一度送る」だけを受け付け、その理由を、冪等キーの範囲はアカウントを含む（DEC-42）ので同じアカウントだけが送れ、ほかのアカウントがサインインすれば MOD-01 が操作を捨てる、とする。しかし、タブ 1 に担当者 A の答えのない返金の操作（キー K1。一度目の要求は ELM-03 で済んでいた）が残る間に、ほかのタブで A が使い終えて担当者 B がサインインすると（A のセッションが切れてほかのタブで B がサインインした場合も）、タブ 1 の MOD-01 は A のまま操作を持ち、その送りには B のクッキーが付く。流れ（MOD-03）がつなぎ直すときに B がサインインしていれば B のセッションで開くので、タブ 1 は 401 を受けず、使い始めにも移らない。担当者がタブ 1 で「もう一度送る」を押すと、ELM-03 には（B、経路、K1）の記録がないため新しい返金として行い、支払われた額に残りがあれば、一度だけ認めた返金が二度済む（QR-45 の失敗のシナリオ、交渉できない DRV-32）。操作の記録も B が認めたとして残る。MOD-01 の不変条件「前のアカウントの操作を、ほかのアカウントのサインインの後に送らない」は、ほかのタブのサインインでは守られない。同じ理由で、タブ 1 は B のセッションで動きながら A の画面と読んだもの（MOD-18 で理由を示して見た情報を含む）を示し続ける。確かめ方にも、二つのタブでアカウントを替える場面がない
suggestion: ほかのタブのサインインと使い終えることを MOD-01 と MOD-09 が知る道を決め（同じ origin のタブが共有する知らせ。BroadcastChannel など）、アカウントが変わったらどのタブでも前のアカウントの操作、タブの保存、読んだものを捨てる。加えて、残した操作を送り直す前に、サインインしているアカウントが操作のアカウントと同じかを GET /v1/me で確かめ、違えば送らずに捨てて一覧で確かめるよう示す。ELM-03 の側で確かめる道（状態を変える要求に操作を始めたアカウントを添え、セッションのアカウントと違えば受け付けない）を選ぶなら、IFC と共通の約束事の変更が要るので、第 3 段階に指摘を出す。端から端の層に、二つのタブでアカウントを替えてから答えのない返金を送り直す場面を加える
resolution: 受け入れ。MOD-01 は、冪等キーのあるサインインした後の操作のどの要求も、出す直前に GET /v1/me がその操作のアカウントと答えたときだけ出し、ほかのアカウントなら出さずに操作を捨ててタブのアカウントを替え（dropped の accountChanged）、サインインしていなければ出さずにサインイン待ちにする（状態遷移図のアカウントを確かめている）。useAccount で替えたアカウントを同じ origin の ELM-02 のほかのタブに知らせ（BroadcastChannel）、ほかのタブの知らせとタブが前に出たときの GET /v1/me でも、そのアカウントのものでない操作、タブの保存、サインインの前の操作を捨てて onAccount で知らせる。MOD-09 はそれを受けて me を読み直し、MOD-10 は読んだものを消して新しいアカウントの始めの画面に移り、MOD-03 は流れを開き直し、MOD-02 の返金の画面は終わる。端から端の層に、二つのタブでアカウントを替えてから答えのない返金を送り直そうとする場面を加えた。確かめの答えを受けてから要求を出すまでの間に、ほかのタブ（ELM-01 を含む）のサインインがクッキーを替える残りの重なりは端末では閉じられないため、ELM-03 で閉じる道を FND-50 で第 3 段階に出し、GET /v1/me が本人のアカウントの ID を返すことを FND-51 で第 3 段階に確かめる
