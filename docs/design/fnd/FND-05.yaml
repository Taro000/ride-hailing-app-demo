id: FND-05
title: デモの回の外にインスタンスを置かないこと（DEC-05）に、期限の処理（DEC-18）と外からの生存確認（DEC-20）が合っていない
status: accepted
basis: inferred
basis_note: デモの回の外のインスタンスを 0 とすることは DAS-02 による決定（第 3 段階のレビューの質問 2 で確認済み）で、この指摘はそれに頼る。期限の処理がインスタンスの中の繰り返しだけで動くことと、外からの確かめが呼ばれるたびにインスタンスを起こすことはこのレビューの推定
premises: [DAS-02]
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-05, DEC-18, DEC-20]
severity: minor
evidence: DEC-05 はデモの回の外の最小のインスタンス数を 0 とし、報告の「費用と体制」はインスタンスの時間を回の間の 3〜12 時間だけ数える。DEC-18 の期限の処理は動いているインスタンスの中の繰り返しだけが拾うため、回を閉じた後に来る期限（回の終わりの近くの依頼の T_no_accept、結果が分からないお金の操作の確かめ）は、次に何かがインスタンスを起こすまで（日々の Cloud Scheduler の呼び出し）行われない。DEC-18 は日々の処理がインスタンス 0 の間も起きることだけを述べる。DEC-20 の外からの生存確認は、回の外も動くならそのたびにインスタンスを起こし、費用の見積もりと合わない。どの決定も生存確認がいつ動くかを書いておらず、その流れ（配置のビューの Cloud Monitoring から ELM-03）は脅威のモデルにもない
suggestion: 回を閉じるときに、終わっていない依頼と結果が分からない操作がなくなるまでインスタンスを残すか、残った期限を次の日々の呼び出しで行うことを受け入れるかを決めて、DEC-05 か DEC-18 に書く。外からの生存確認は回の間だけ動かすか、回の外の呼び出しを費用に数える。生存確認を残すなら、その流れを脅威のモデルに加える
resolution: 受け入れ。デモの回を閉じてインスタンスを 0 にした後に期限が来た処理は、次の日々の呼び出しで起きたインスタンスが拾い、それまで遅れることを受け入れると決め（DEC-05、DEC-18。暫定の決定として DAS-02 に加えた）、日々の処理がインスタンスが 0 の間に期限を過ぎた処理も拾うことにした。外からの生存確認はデモの回の間だけ動かして回の外にインスタンスを起こさないこと（DEC-20、ELM-08）と、その流れ F13 を脅威のモデルに加えた。費用の見積もりは回の間の時間のままで合う
