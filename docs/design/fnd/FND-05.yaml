id: FND-05
title: デモの回を閉じるときと期間を終えるときに、進行中の依頼の押さえと確かめ中の確定が残りうる
status: accepted
version: 2
basis: inferred
basis_note: DEC-04・05・06・10・27、ELM-06、SLI-04 の文は入力。残ったときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-05
- DEC-06
- DEC-27
- DEC-04
severity: major
evidence: 「デモを閉じる」はサービスを消すだけで（DEC-27、ELM-06）、進行中の依頼や確かめ中の操作があるかを見ない。T_match_wait と T_noshow_wait の判定と、結果が分からない操作の確かめを行う見回り（DEC-04）は、サービスの中でしか動かない。デモの期間は「最後のデモの回の翌朝の処理が終わるまで」と時刻で終わり（DEC-05）、確かめ中や解放していない押さえが残っていないことを条件にしない。押さえは既定で 7 日で取り消される（DEC-10）。SLI-04 は結果の分からない請求を翌日に判定し直し、2 日続けて分からなければ不一致とする。たとえば最後の回の終わりに、乗客の依頼が「ドライバーを探しています」のまま押さえを持つか、降車の確定が確かめ中のままサービスを消すと、翌朝のジョブが一度動いて期間が終わる。押さえは 7 日目に Stripe の側で取り消され、記録は押さえたまま、または確かめ中のまま残り、それを突き合わせる実行はもうない。NFR-07 の 0 件と NFR-04 の一致は確かめられず、乗客の依頼は終わらない（DRV-04、原則 DRV-33、FR-08、FR-29）。DRV-04 の通し確認は「期間を早く終えると」の危険だけを挙げ、回を閉じるときを挙げていない
suggestion: 「デモを閉じる」の前に、進行中の依頼と確かめ中の操作の一覧を出し、ないことを確かめてから消す。あれば期限の判定と確かめを一度動かし、残るものは取り消すか知らせる。「期間を終える」は、毎日の処理が確かめ中と解放していない押さえを 0 件と記録したことを条件にし、そうでなければ期間を延ばす。条件を DEC-05・06 の応答を左右する点と DEC-27 の手順に書き、DRV-04 の通し確認に加える
resolution: 受け入れた。DEC-37 を新設した。デモを閉じる手順は、終わっていない依頼と確かめ中の操作があれば一覧を示して止まり、期間を終える手順は、最後の回の翌朝の処理が確かめ中、確定も解放もしていない押さえ、終わっていない依頼をどれも 0 件と記録したときだけ進む。強いて進めると配備の記録に残る（残る危険は要合意）。DEC-04・05・06・27（版 2）と ELM-05・06 に書き、DRV-04 の通し確認に加えた。システムによる取り消しは機能なので、品質チェーンへの課題 7 にした
