id: FND-40
title: 報告の DRV-01 の流れが、乗車の開始と到着の確認の端末のタイムアウトを 10 秒と描くが、IFC-03 はその値を第 4 段階に送っている
status: accepted
basis: inferred
basis_note: 第 3 段階の報告の DRV-01 の流れ、IFC-03、IFC-04、IFC-09 の timing、DEC-46、HND-17 は入力
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [IFC-03]
severity: minor
evidence: FND-22 を受けて描き直した報告の DRV-01 の流れは、外部を呼ばない操作（取り消し、許諾、乗車の開始、到着の確認、評価）の送り直しを「タイムアウト（10 秒）の後」と描く。10 秒は、時間のしきい値の SLO とお金の道の上の外部を呼ばない操作の端末のタイムアウト（DEC-46。IFC-03 の取り消しと不在、IFC-04 の許諾、IFC-09 の評価）。IFC-03 の timing は、乗車の開始と到着の確認をそれらの道にない操作として枠だけを決め、値を第 4 段階に送る（ELM-01 は HND-17）。流れと IFC-03 が、二つの操作の値で食い違う
suggestion: DRV-01 の流れの 10 秒を取り消し、許諾、評価の値として書き分け、乗車の開始と到着の確認は HND-17 で決まる端末のタイムアウトの後に送り直すと描く
resolution: "受け入れ。報告の DRV-01 の流れの外部を呼ばない操作の送り直しを、取り消し、許諾、評価は端末のタイムアウト 10 秒の後、乗車の開始と到着の確認は第 4 段階が HND-17 で決めるタイムアウトの後と書き分けた。IFC-03 の timing は変えず、basis_note にこの指摘を引いた"
