id: FND-06
title: 毎日の処理が起動しなかったとき、8:30 に知らせるものがない
status: accepted
version: 2
basis: inferred
basis_note: NFR-06、FR-55 AC3、DEC-05・17 の文は入力。Cloud Scheduler のやり直しが起動した後のジョブの失敗を拾わないことは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-17
- DEC-05
severity: major
evidence: NFR-06 は、前日分の突き合わせ（FR-55）と履歴の確かめが 8:30 に終わっていなければエンジニアに知らせることを求め、DRV-04 と DRV-27 の測定量に入っている。DEC-05 と DEC-17 の知らせは毎日の処理の中から送る（「毎日の処理は毎日の結果を送る」、FR-55 AC3）。外の仕組みは Cloud Monitoring の規則一つで、Cloud Run の標準の指標でサービスが止まったときを見る粗い条件とされている（DEC-17 の負債）。ジョブが起動しないか、知らせる前に落ちたとき（定時の起動が有効になっていない、Secret Manager の権限、ELM-09 から消した古いイメージ、Turso のトークンの期限など）は、8:30 に何も知らせない。DEC-05 の得るもの「Cloud Scheduler が時刻どおりに起動し、失敗をやり直す」は起動の呼び出しのことで、起動した後のジョブの失敗や、知らせる前の落ちを拾うものではない
suggestion: ジョブの外で終わりを確かめる手立てを決める。たとえば、期間の間だけ有効にする Cloud Monitoring の規則（8:30 までにジョブの成功の記録がない）を足す。デモの回の日は、サーバーが朝の終わりの記録を確かめて知らせる手もある。規則を足すと第 2 段階の質問 5 の「規則を一つ」から変わるので、要合意にする
resolution: 受け入れた（質問 14 で確認済み）。DEC-17（版 2）に、毎日の処理のジョブの実行の失敗（run.googleapis.com/job/completed_execution_count の result）を見る二つ目の Cloud Monitoring の規則を足し、期間の間だけ有効にする。ジョブはその日の処理を終えたと記録できないときと知らせを送れないときに失敗として終わる。一回の上限 45 分・やり直し 1 回で、遅くとも 07:35 ごろに知らせる（計算）。定時の起動そのものが止められたときは拾わず、期間を始める手順が定時の起動を通して一度動かして確かめる（負債として要合意）。DEC-05・27（版 2）を合わせた
