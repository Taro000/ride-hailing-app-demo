evidence: FR-05 の 4 は、閾値を満たすドライバーが見つからなかったことを乗客に伝え、閾値を変えて依頼し直せるようにすることを求め、乗客の画面（IFC-22、提供側は ELM-01）がそれを示して依頼し直させる。FR-45 の 1 と 4 は、乗客が乗る場所を決め始めたことと評価を始めたことを時刻とともに記録することを求め、どちらも乗客の端末の中で起きるため、乗客の画面がその時刻を ELM-03 に送る（IFC-03 の POST /v1/rides の pickupPlanningStartedAt、IFC-10 の評価を始めた報告）。ELM-01 の functions は FR-05 も FR-45 も持たないため、IFC-22 の functions がその提供側にない機能を持つ（scripts/check.py の allocation）。どちらも ELM-03 には割り当てられており、振る舞いは欠けていないが、割り当ての記録が ELM-01 の責務と合わない
suggestion: ELM-01 の functions に FR-05 と FR-45 を加え、責務に、乗る場所を決め始めた時刻と評価を始めたことを ELM-03 に送ることを書く
resolution: null
