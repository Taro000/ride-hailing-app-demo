id: FND-35
title: ELM-01 の functions に、乗客の画面が担う FR-05 と FR-45 がない
status: open
basis: inferred
basis_note: ELM-01 の functions、FR-05 の 4、FR-45 の 1 と 4 の受け入れ基準は入力。乗客の画面（IFC-22）がこの二つを担うことは、第 3 段階が FND-24 と FND-30 を受けて決めた
premises: []
raised_by: architecture-to-high-level-design
raised_in: 3-high-level-design.md
to: architecture-drivers-to-architecture
targets: [ELM-01]
