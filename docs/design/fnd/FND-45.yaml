id: FND-45
title: EXT-01 が実行の前に退けた返金は refunding のまま残り、済みもせず済まなかったとも示されず、担当者がやり直す道がない
status: accepted
basis: inferred
basis_note: DEC-35、DEC-42、DEC-45、IFC-13、IFC-17 と第 3 段階の報告の返金（DAT-12）とお金の操作の試み（DAT-11）の状態遷移図は入力。返金が残ることと、送り直しが進まないことはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-02.md
to: architecture-to-high-level-design
targets: [DAT-12, IFC-13, DEC-45]
severity: major
evidence: DEC-45 と IFC-17 は、EXT-01 が実行を始める前に退けた試み（鍵や形の誤り）を処理されなかったとして終え、異常にして、利用側に 503 PAYMENT_SERVICE_UNAVAILABLE で答え、DAT-11 の not_processed は終わりの状態にする。返金では、ELM-03 は EXT-01 を呼ぶ前の取引で認めた返金（DAT-12）を試みとともに refunding として書く（第 3 段階の報告の CUJ-15 の流れ、DEC-42）が、第 3 段階の報告の返金の状態遷移図は refunding の移り先を、試みが済んだ、8.5 秒のうちに分からない、はっきり拒否された、の三つだけにしており、試みが処理されなかった返金は refunding に残る。IFC-13 の retry は、済んだ、分からない、はっきり拒否、のどれでもない試みの返金にどう答えるかを決めておらず、DEC-45 は新しい試みを、それまでの試みがどれもはっきり拒否で終わったときだけ作る。そのため、その返金は済みもせず、済まなかったとも示されず、担当者がやり直す道がない（FR-39 の 2 は、EXT-01 が受け付けなかった返金を担当者がやり直せるようにし、FR-50 の 3 はそれを済まなかったこととともに記録する）。ELM-02 では、MOD-02 の判断表 A がその返金に「送っていること」と確かめるを示し続け、503 を受けた操作には判断表 B が同じキーでもう一度送ることを受け付ける（DEC-35 は冪等キーのある操作の 503 を送り直してよいとする）が、DEC-42 は同じキーの送り直しに最初の答えを返すので、送り直しは同じ 503 を受けるだけで進まない
suggestion: 返金の状態遷移図に、試みが処理されなかったときの移り先を加える（たとえば refund_failed にして理由を示し、担当者のやり直しで新しい試みを作る。何も実行されていないので二重にはならない）。DEC-45 の新しい試みを作る条件と IFC-13 の retry の答えをそれに合わせる。IFC-13 の誤りに 503 PAYMENT_SERVICE_UNAVAILABLE を挙げ、同じキーで送り直しても同じ答えになることと利用側がすること（一覧を読み直して返金の状態に従う）を書き、外部を呼ぶ操作について DEC-35 の 503 の送り直しの決まりを直す。同じ DEC-45 の決まりの下にある決済と支払い方法の登録の試みも合わせて見る
resolution: "受け入れ。DEC-45 に、処理されなかった試み（状態を変える呼び出しを EXT-01 が実行の前に退け、何も実行されていない）を済まなかったとして終える出口を決めた。返金は refunding から refund_failed に移って理由を示し、503 PAYMENT_SERVICE_UNAVAILABLE と refundId で答え、担当者の retry が返金できる残りの額を確かめ直して新しい試みを作る（IFC-13、DAT-12、報告の返金の状態遷移図と CUJ-15 の流れと画面）。新しい試みを作る条件を、それまでの試みがどれもはっきり拒否か処理されなかったで終わったときにした（DEC-45、DAT-11）。外部を呼ぶ操作が試みの結果として返す 503 はキーの答えなので、同じキーで送り直さずに今の状態を読み直すと DEC-35 の 503 の決まりを直し、IFC-03、IFC-07、IFC-13 の誤りにそれを書いた。同じ決まりの下の試みも合わせて見て、押さえは依頼を受け付けず、押さえ直しは変えず、決済は依頼を到着したままにしてドライバーがやり直せ（ride.charge_settled で乗客にも示す。IFC-03、IFC-11、DAT-07）、利用者が待たない押さえの解除と料金の請求は期限の処理が新しい試みを作り（IFC-17、DAT-07 の moneySettled。SLI-12 は試みがいくつあっても一つの処理として数える、DAT-13）、登録を始める操作は取引を作らなかったとし、登録の読み直しと確かめで受けた処理されなかったは結果が分からないままとした（IFC-07、IFC-17、DAT-11）。処理されなかったとするのは EXT-01 が実行を始めていないと答えが示すときだけで、見分けられない答えは結果が分からないとする（DEC-45、IFC-17）"
