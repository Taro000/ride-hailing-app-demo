id: FND-24
title: SLI-03 の毎分の確かめは、遅れて届く裏に回った時刻を使えず、裏の時間を古いと数えうる
status: open
version: 1
basis: inferred
basis_note: DEC-14 の送り直し、SLI-03 の除くもの、DEC-35 の確かめと窓、DEC-16 の版 3 の数え方、NFR-03 のアラートの条件は入力。5 回、13 回、9 回はスクリプトでの計算。遅れて届いたときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: architecture-drivers-to-architecture
targets:
- DEC-35
- DEC-16
- DEC-14
severity: minor
evidence: DEC-14 は、裏に回る時刻を裏に回るときに送り、届かなければ前面に戻ったときに送り直す。SLI-03 はドライバーのブラウザが裏にあった時間を除く。DEC-35 は SLI-03 の確かめを毎分 0 秒にその場で行って記録し、DEC-16 の版 3 は毎日の SLI-03 をその記録から数える。裏に回る時刻が遅れて届くと、その間の確かめは古いと記録され、後で届いた記録で除き直すかはどちらの決定にも書かれていない。アラートはその場で数えるので除けない。この規模では窓が回の分しか埋まらず、6 時間と 30 分の呼び出しは、回の始めから 10 分の後に位置が止まると 5 回、30 分の後なら 13 回の古い確かめで鳴る（計算。報告書の表は窓が埋まったときの 55 回）。ドライバーの回の確かめは 180 回で 5% は 9 回なので、送り直しで届いた 10 分の裏の時間だけで一回の回のエラーバジェットを超える（DRV-03、DRV-27）
suggestion: 毎日の SLI-03 は、後から届いた裏の記録で除き直して数えることを DEC-16 に書く。DEC-35 の応答を左右する点に、裏に回る時刻が遅れたときの古い確かめと、回の始めは少ない確かめで鳴ることを書く。要るなら、裏の記録が届かないまま古くなったドライバーの確かめを、次の位置か裏の記録が届くまで保留する形も比べる
