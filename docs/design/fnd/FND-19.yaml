id: FND-19
title: 配備の仕組みが持つ構造の変更のための Turso のトークンで全員の個人情報を読め、DEC-34・DEC-28 と脅威のモデルの記述と食い違う
status: open
version: 1
basis: inferred
basis_note: DEC-27・34・37 の選んだ案、DEC-34 の前提（Turso のトークンは一つのデータベースに限れ、読むだけにも期限付きにもできる）、DEC-28 の得るものと退けた理由、脅威のモデルの F10・F15、実行時の構成の ELM-06 → ELM-07 の矢印、リポジトリが公開であること（報告書の入力）は入力。構造を変えられるトークンがすべての表を読めることは、DEC-34 の前提からの推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: architecture-drivers-to-architecture
targets:
- DEC-34
- DEC-28
- DEC-27
- DEC-37
- ELM-06
severity: major
evidence: DEC-34 は配備の仕組み（ELM-06）に「構造の変更のための Turso のトークン（デモのデータベースだけ）」を渡す。ELM-06 はこれを、デモを開くときの構造の変更、配備の記録の書き込み、DEC-37 の閉じる前の数え（終わっていない依頼と確かめ中を Turso から数える）、期間を始めるときの Turso の確かめに使う（DEC-27、DEC-37、実行時の構成の ELM-06 → ELM-07）。DEC-34 の前提では Turso のトークンは読むだけか読み書きかで、構造を変えられるのは読み書きのトークンなので、位置、名前、連絡先を含むすべての表を読める。ELM-06 は公開のリポジトリの GitHub Actions のホストされた実行環境（ELM-20）で動く。それでも DEC-34 の得るものは「全員の個人情報を書き出せるのは開発者の手元のログインだけ」、DEC-28 の得るものは「書き出せるのは開発者だけ」とし、DEC-28 は手順が非公開の Cloud Storage に書き出す案を「CI に全員の個人情報を読めるトークンを渡す」として退けている。今の選んだ案でも CI（main の枝の手順）は同じものを読めるので、この退けた理由は案の違いになっていない。脅威のモデルの F15 は「CI には書き出せる資格情報を置かない（DEC-34）」とし、F10 の漏えいの欄は実行のログに秘密が出ることだけを挙げる。守るものの「データベースの書き出し（全員の個人情報）」と同じ中身を配備の手順が読めることは、どの流れでも確かめていない（DRV-21、DRV-29。第 2 段階の終わりの条件「信頼の境界を越えるすべての流れを六つの脅威で確かめる」）
suggestion: どちらかを選び、記述をそろえる。(a) ELM-06 からデータベースの資格情報をなくす。構造の変更、DEC-37 の数え、期間を始めるときの Turso の確かめ、配備の記録の書き込みを、同じイメージのコマンドとして Cloud Run のジョブの実行で動かし、ELM-06 は鍵を置かない連携で実行を起こして結果だけを受ける（トークンはジョブのサービスアカウントが Secret Manager から読む）。こうすると「終わっていない依頼」の定義も、手順の中の問い合わせでなくドメインのコード一か所に置ける。(b) ELM-06 にトークンを残すなら、DEC-34・DEC-28 の得るものと F15 を直し、DEC-28 の 4 つ目の案を退けた理由を比べ直す。F10 の漏えいの欄に、配備の手順がすべての表を読めることと、その備え（手順が使う外部のアクションの乗っ取りへの備え、main の枝と守った環境だけに限った連携、Turso が許すなら実行ごとに短い期限のトークン）を加える
