id: FND-19
title: NFR-15 の実機の受け入れは、一台の iPhone にベータ版か公開の候補の版を入れている間、参加者が使う公開された版を確かめない
status: open
basis: assumed
basis_note: NFR-15 の statement と gate、POL-03 の NFR-15 の出どころ、NFR-50 の置き場所と実機の受け入れの層、POL-04 の device-acceptance、報告の「ゲートの出どころ」の文は入力。テストに使う iPhone が一台で、ベータ版を入れている間のリリースの受け入れもその版で行うことは DAS-08 による。ベータ版を入れた端末は、次の公開の版が出るのを待つか、入れる前の写しから戻すほかに公開の版へ移れないことは、第 2b 段階の報告が引く Apple の文書（ベータ版の入れ方）で確かめた。そこから公開された版を確かめない間ができることは、このレビューの推定
premises: [DAS-08]
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-03, POL-04]
severity: minor
evidence: NFR-15 は、対応するスマートフォンとブラウザの更新が出るたびと各リリースの前に、受け入れの試験を更新後の版で行うことを求める。FND-15 を受けて変えた POL-03 の NFR-15 の出どころと POL-04 の device-acceptance は、前もって出る版のある更新を Apple がベータ版か公開の候補の版を出したときにその版でだけ確かめ（公開されたときに行うのは前もって出る版のない更新だけ）、リリースの受け入れを「テストに使う iPhone のそのときの版」で行う。その iPhone は一台で、ベータ版を入れている間のリリースの受け入れもその版で行う（DAS-08）。そのため一つ目に、iPhone にベータ版か公開の候補の版が入っている間のリリースは、参加者がまだ使う公開された版で確かめずに配備される。二つ目に、前もって出る版のある更新は、ベータ版で確かめたなら公開された版では確かめない。三つ目に、Apple の文書のとおりベータ版を入れた端末は次の公開の版が出るまでその版を離れられないため、次の主な版のベータ版を入れている間に参加者が受け取る今の主な版の更新は確かめられない。変える前の出どころは、更新を公開された版で、リリースをそのときの公開された版で確かめており、この三つの欠けはなかった。報告の「ゲートの出どころ」は公開の前の版「でも」確かめると書くが、項目は公開された版での確かめを公開の前の版での確かめで置き換えている。NFR-50 の人による確かめも、リリースの実機の受け入れの後に同じ iPhone で行い（POL-03）、同じ欠けを持つ
suggestion: リリースの実機の受け入れと、更新が公開されたときの受け入れは、参加者が使う公開された版の iPhone で行う。公開の前の版での確かめは、その iPhone を公開された版のまま残せる道（Xcode のベータ版の iOS のシミュレーター、二台目の端末など）で足すものにし、通らなければ公開までに直す。選んだ道に合わせて DAS-08 と NFR-50 の置き場所を直す
resolution: null
