id: FND-25
title: DEC-15 の読める相手の表に、SLI-03 の毎分の確かめ（DEC-35）がない
status: accepted
version: 2
basis: inferred
basis_note: DEC-15 の選んだ案と読める相手の表、DEC-35 の確かめ、DEC-16 の版 3 の数え方は入力。食い違いの判断は推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture-2.md
to: architecture-drivers-to-architecture
targets:
- DEC-15
- DEC-35
severity: minor
evidence: DEC-15 は座標を持つ三つの表を位置のモジュールだけが読み書きし、表ごとに読める相手を決める。2 回目の再実行で、サーバーが毎分、使用中の参加者の最後に届いた位置が 30 秒以内かを確かめるようになった（DEC-35）が、この確かめを行うサーバーの測るモジュールは、最後の位置にも位置の受信の記録にも読める相手として載っていない。逆に、位置の受信の記録の行の「毎日の処理（SLI-03 と保存期間）」は、毎日の SLI-03 を確かめの記録から数える DEC-16 の版 3 と合わない（DRV-21、DRV-27）
suggestion: 位置のモジュールが、座標を除いた最後の受信の時刻を測るモジュールに返すことを DEC-15 の表に加える。位置の受信の記録の行の毎日の処理の用途を、DEC-16 と FND-20 の答えに合わせて直す
resolution: 受け入れた。DEC-15（版 4）の最後の位置の読める相手に、配信（位置のモジュールが相手と状態を確かめて返す）と、サーバーの測るモジュール（SLI-03 の毎分の確かめ。座標を除いた受けた時刻だけを返す）を足した。受信の記録の毎日の処理の用途を、SLI-03 の確かめ直し（受けた時刻だけ。DEC-16 版 4）と保存期間の削除にした
