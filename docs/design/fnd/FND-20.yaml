id: FND-20
title: Web アプリのビルドに環境ごとの値が入らないことの検査は、試験の環境の値を入れたビルドを見つけられない
status: open
basis: inferred
basis_note: POL-04 の設定の規則とその検査、POL-01 のビルドの規則と開発者のマシンの規則、POL-03 の試験の環境、DEC-12、DEC-21 は入力。試験の環境の値を入れたビルドがリリースの手順を通り、ローカルの本番で初めて失敗することは、このレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-04]
severity: minor
evidence: FND-12 を受けて変えた POL-04 の設定の規則は、Web アプリが環境ごとの値（EXT-01 の公開の鍵、ブラウザ用の地図の鍵、Web Push の公開の鍵、偽物を使うかどうか）をビルドに入れず起動のときに ELM-03 から読むとし、ビルドにそれが入らないことは、同じイメージを二つの設定で動かすリリースの手順の端から端の層が確かめるとする（試験用の Stripe のサンドボックスの公開の鍵でなければ NFR-47 のテストが登録を通せないため。POL-01 のビルドの規則の検査もこれに任せる）。二つの設定はどちらも試験の環境のもので、偽物の設定は外部のアカウントの鍵を使わず、本物の外部サービスの設定は試験用の鍵を使う（POL-03）。そのため見つけられるのはローカルの本番の値を入れたビルドだけで、試験用の値（開発者のマシンが使うものと同じ、POL-01）を入れたビルドは、端から端の層、契約の層、NFR-47、実機の受け入れのどれも通る。そのビルドをローカルの本番に配備すると、Web アプリは試験用のサンドボックスの公開の鍵で、ELM-03 がローカルの本番のサンドボックスに作った登録の取引を確かめようとし（DEC-12）、試験用の Web Push の公開の鍵で購読する（DEC-21）ため、支払い方法の登録と知らせが参加者の端末で初めて失敗する
suggestion: リリースの手順が、イメージの中の ELM-01 と ELM-02 のビルドの出力に、どの環境の設定の公開してよい値（開発者のマシン、試験の環境、ローカルの本番、想定の本番のもの）も現れないことを確かめ、現れれば配備しない。Web アプリのビルドの設定で、環境変数をコードに渡さないようにしてもよい
resolution: null
