id: FND-01
title: 押さえの後に支払い方法が変わる決済と、拒否された決済と返金のやり直しを、DEC-09 と DEC-10 が扱えない
status: accepted
basis: inferred
basis_note: FR-29、FR-39、FR-46 の受け入れ基準と、DEC-09、DEC-10 の決め方は入力。両者が合わないことはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-09, DEC-10]
severity: major
evidence: FR-29 の受け入れ基準 4 は、EXT-01 が支払いを受け付けなかったとき、乗客が支払い方法を変えた後にドライバーが決済をやり直せることを求める。FR-46 の基準 5 は、乗客が支払い方法を変えるとその後の決済に新しい支払い方法を使うことを求める。DEC-09 は決済を「押さえの全額の確定」とし、押さえは依頼のときの支払い方法で作り、押さえ直すのは確定額が変わったときだけで、支払い方法が変わったときの扱いがない。DEC-10 は「一つの乗車の決済と、一つの依頼のキャンセル料か不在の料金は、それぞれ操作の記録を一つしか持てない」とし、同じ操作の送り直しは同じキーで送り、EXT-01 は同じキーの送り直しに一度目の結果を返すと想定する。そのため、拒否された決済は同じキーで送り直しても拒否が返り、新しい支払い方法で二つ目の決済の操作を作ることもできず、CUJ-08 の「決済を行う」は拒否の後に終えられない。FR-39 の基準 2 も、受け付けられなかった返金を担当者がやり直せることを求めるが、DEC-10 は一つの返金の記録を同じキーで送り直すため、拒否が返り続ける。第 2 段階の報告の CUJ-08 と CUJ-15 の通し確認は、どちらも欠けなしとしている
suggestion: DEC-10 で、EXT-01 がはっきり拒否した操作（結果が分からない操作ではない）は終わったものとし、そのやり直しは新しいキーの新しい試みとして許すことと、一つの乗車に一度だけ請求すること（FR-30）は済んだ請求を一つに限ることで守ることを決める。DEC-09 で、押さえの後に支払い方法が変わったとき（拒否の後と、依頼の途中の変更）に、新しい支払い方法で押さえ直してから前の押さえを解くか、新しい支払い方法で直接請求するかを決め、結果が分からないときの扱い（DEC-10）もそれに当てる。CUJ-08 と CUJ-15 の通し確認に拒否の後の流れを加える
resolution: 受け入れ。DEC-09 で、確定額か支払い方法が変わったら新しい押さえを作ってから前の押さえを取り消し、新しい押さえを EXT-01 が受け付けないか結果が分からない間は支払い方法の変更を済ませないこと（FR-46）と、決済を EXT-01 が受け付けなかったときは乗客が支払い方法を変えるとその支払い方法で押さえ直し、ドライバーのやり直しはその押さえを確定すること（FR-29）を決め、押さえていない支払い方法から直接請求する案を比べて退けた。DEC-10 で、キーはお金の操作の一つの試みだけを覆い、EXT-01 がはっきり拒否した試みは終わったものとしてやり直しを新しいキーの新しい試みにし、一度だけ動くこと（FR-30、FR-40、FR-54）は済んだか結果が分からない試みを一つに限って守ると決めた。DEC-11、HND-06、ELM-05 をそれに合わせ、報告の CUJ-01、CUJ-08、CUJ-15 と DRV-07 の通し確認に支払い方法の変更と拒否の後の流れを加えた
