id: FND-16
title: EXT-01 の偽物が、支払い方法の登録の取引とその結果の読み直しを起こせない
status: accepted
basis: inferred
basis_note: POL-03 の偽物と規則、DEC-12、DEC-09、FR-46 の受け入れ基準は入力。偽物の操作に登録がないことは、このレビューの読み取り
premises: []
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-03]
severity: minor
evidence: POL-03 の EXT-01 の偽物が答える操作は、押さえ、押さえ直し、全額と一部の確定、取り消し、返金、期間の読み出しで、DEC-12 の登録（サーバーが作る登録の取引と、EXT-01 からの結果の読み直し）がない。FR-46 の受け入れ基準 3 と 4（EXT-01 が受け付けないとき、答えないとき）はその結果に頼り、POL-03 の規則は外部のシステムに頼る受け入れ基準を下の層の偽物で起こすとし、DEC-09 の押さえ直しは支払い方法を変えたときに起きる
suggestion: EXT-01 の偽物に、登録の取引を作ることと登録の結果の読み直しを加え、受け付けない、答えない、遅れて答える、読み直すと済んでいたと見せる、を起こせるようにする
resolution: 受け入れ。POL-03 の EXT-01 の偽物に、支払い方法の登録の取引を作ることとその結果の読み直し（DEC-12）を加え、受け付けない、答えない、遅れて答える、読み直すと済んでいたと見せる、を起こせるようにした。ブラウザの側の EXT-01 の入力部品の偽物は、登録の取引を確かめたとだけ伝え、登録の結果は ELM-03 が EXT-01 の偽物から読み直す
