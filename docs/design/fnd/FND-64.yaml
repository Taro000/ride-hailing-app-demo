id: FND-64
title: ブラウザの地図の鍵の守りを言い過ぎており、Q_maps_day の見込みに地図の表示が入っていない
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
