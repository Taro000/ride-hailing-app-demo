to: architecture-drivers-to-architecture
targets:
- DEC-21
- DEC-22
severity: minor
evidence: DEC-21 は鍵を「ログインした人にだけ渡す」ことで「参加者でない人が鍵を拾えないようにする」とするが、ログインした人（参加者 2 人、担当、テスト用アカウント、盗まれたアカウント）が一度写せば、鍵はシステムを終えるまで（DEC-36）使え、参照元の制限はブラウザの外では偽れる。脅威のモデルの F7 は「公開される鍵」と書いたまま。Q_maps_day 1,000 回のもと（DEC-21、設計上の値）は経路と到着予定の 198 回と見積もり 100 回だけを数え、報告書の費用の表の「地図の表示は画面を開くごとに 1 回」を Maps JavaScript API の割り当てに対して見込んでいない。漏れた鍵で表示の割り当てを使い切ると、その日は地図が出ない
suggestion: 得るものを「参加者でない人がログインせずに鍵を得られない」に直す。デモの回 1 回の地図の表示の数を見込み、漏れた鍵で表示の割り当てが尽きうることを失うものに書く。期間ごとに鍵を替えるかを比べる
