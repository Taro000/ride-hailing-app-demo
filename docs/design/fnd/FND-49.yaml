id: FND-49
title: 報告の CUJ-08 の流れが、処理されなかった決済の後に同じ冪等キーでやり直しても新しい試みの結果を受けると描く
status: accepted
basis: inferred
basis_note: 第 3 段階の報告の CUJ-08 の流れ、IFC-03 の誤りと idempotency、DEC-35、DEC-42、DEC-45 は入力。流れと IFC-03 が同じキーの答えで食い違うことは、このレビューの読み
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [IFC-03]
severity: minor
evidence: FND-45 を受けて（890bb9f）、報告の CUJ-08 の流れの最後の opt「ドライバーがやり直した」は、「同じか新しい冪等キーの決済」に「済んでいれば最初の結果、分からなければ同じ試みを確かめた結果、処理されなかった後なら新しい試みの結果」を答えると描く。一方、IFC-03 の誤りの「EXT-01 が押さえ、押さえ直し、決済を実行の前に退けた」は、503 PAYMENT_SERVICE_UNAVAILABLE はキーの答えなので同じ冪等キーで送り直しても同じ答えを受け、し直すときは新しい冪等キーで送るとし、DEC-42 も同じキーには最初の答えを返す（202 と答えたお金の操作だけがそのときの結果）。同じ流れの「処理されなかった」の枝も「同じキーでは送り直さない」と描く。処理されなかった決済の後に同じキーで送ったときの答えが、流れでは新しい試みの結果、IFC-03 では同じ 503 になり、第 4 段階が ELM-01 のドライバーのやり直しをこの流れから読むと、同じキーで送り直して進まない作りを選びうる。お金は二重に動かない
suggestion: CUJ-08 の最後の opt の答えを冪等キーで書き分ける。同じキーには最初の答え（処理されなかった後は同じ 503 PAYMENT_SERVICE_UNAVAILABLE、202 と答えた決済はそのときの結果）、新しいキーには、済んでいれば最初の結果、分からなければ同じ試みを確かめた結果、処理されなかった後なら新しい試みの結果
resolution: 受け入れ。報告の CUJ-08 の流れの最後のやり直しを、同じ冪等キー（最初の答え。処理されなかった後は同じ 503 PAYMENT_SERVICE_UNAVAILABLE、202 と答えた決済はそのときの結果）と新しい冪等キー（済んでいれば最初の結果、分からなければ同じ試みを確かめた結果、処理されなかった後なら新しい試みの結果）に書き分け、IFC-03 の basis_note に引いた。IFC-03 と DEC-42 の答え方は変えていない
