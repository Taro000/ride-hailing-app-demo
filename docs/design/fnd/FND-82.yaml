evidence: DEC-20 と DEC-43 は役割のアカウントにパスワードとパスキーを求め、最初のアカウントは役割のアカウントが一つもないときだけ作れる（IFC-01 の staff-bootstrap）。担当のパスワードの変更、パスキーの追加や取り消し、役割のアカウントの作り直しの操作はなく（IFC-01・06）、手元の保守の手順（ELM-22、IFC-12）にもない。担当が一人（TEAM-01）で役割のアカウントが一つなので、そのパスキーを失うと（PC の買い替えなど）管理とエンジニアの画面に入れず、デモの間なら返金（CUJ-16）と苦情への対処（CUJ-14）ができない。戻すには Turso の CLI で表を直接直すしかなく、その手順も決まっていない
suggestion: '戻し方を決める。例: ELM-22 に、役割のアカウントのパスキーを消して作り直せるようにする手順を足す。ログインした担当が二つ目のパスキーを登録できるようにする（第 3 段階の IFC-01 も追随する）。または危険として受け入れ、DEC-20 の失うものと要合意に書く'
