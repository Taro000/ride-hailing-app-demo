id: FND-21
title: POL-03 と POL-04 の外部のアカウントの確かめは、Stripe のサンドボックスがそれぞれ別のアカウントの ID を持つことに確かめずに頼り、仮定がない
status: open
basis: inferred
basis_note: POL-04 の秘密の値の規則とその検査と basis_note、POL-03 の契約の層、報告の「入力」の文は入力。第 2b 段階の報告が引く Stripe の三つの文書（サンドボックス、サンドボックスの管理、CLI の sandbox）は、このレビューも読んだ。その確かめがサンドボックスごとのアカウントの ID に頼ることは、このレビューの読み取り
premises: []
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-03, POL-04]
severity: minor
evidence: FND-13 を受けて変えた POL-04 の秘密の値の規則は、試験用とローカルの本番で別の EXT-01 のサンドボックスを使い、ELM-03 の設定が使う EXT-01 のアカウントを名指すとし、リリースの手順は二つの設定が同じアカウントを名指せば試験の環境を立てず、契約の層（POL-03）と配備の前の一度だけの処理は鍵で届くアカウントが名指すものであることを確かめる。この確かめは、一つの Stripe のアカウントのダッシュボードで作る二つのサンドボックスが、それぞれ別のアカウントの ID を持つことに頼る。POL-04 の basis_note と報告の「入力」は、それを CLI の例でだけ読み、確かめていないと書く。報告が引く三つの文書のうち、サンドボックスとその管理の文書は、アカウントごとに最大 5 つ作れてデータが分かれると書くがアカウントの ID には触れず、CLI の例でアカウントの ID を持つのは、アカウントなしで作り、引き取ると一つのアカウントになるサンドボックス。違えばリリースの手順が試験の環境を立てなくなり、環境を分けて確かめる道を作り直す。確かめていないこの判断に DAS がなく、POL-03 と POL-04 の premises にも挙がらない（第 2b 段階の出口の条件の、不確かな点は尋ねたか DAS に記録したこと）
suggestion: 一つのアカウントの中にサンドボックスを二つ作り、それぞれの鍵で読んだアカウントの ID を比べて確かめ、basis_note に引く。確かめないなら DAS を書いて POL-03 と POL-04 の premises に挙げ、違ったときの道（試験用に別の Stripe のアカウントを使い、その ID で確かめるなど）をその DAS に書く
resolution: null
