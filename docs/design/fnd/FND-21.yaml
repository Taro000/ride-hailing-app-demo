id: FND-21
title: T_route の根拠が降車の確定（最悪 9.2 秒）を見ておらず、切った後の扱いは操作キーのある操作にしか書かれていない
status: open
version: 1
basis: inferred
basis_note: DEC-33 の値と根拠、DEC-12 の (a)〜(d) と値、CUJ-08・CUJ-16 の通し確認の文は入力。0.8 秒、13.0 秒、3.8 秒はスクリプトでの計算
needs_agreement: false
