- DEC-12
severity: minor
evidence: DEC-33 は T_route を「最も遅い正常な経路である手配の確定と返金の 2.7 秒の 3.7 倍」の 10 秒とする。同じ上限がかかる乗車の終了は、降車のときの確定を要求の中で 3 回まで送り、最悪 9.2 秒（DEC-12）で、T_route との差は 0.8 秒（データベースの呼び出し 8 回分。計算）。二つのトランザクションが T_db で止まると 13.0 秒になり（計算）、T_route で 503 を返した後も確定は動き続ける。DEC-33 は「切っても結果は操作キーに残り、同じキーの送り直しに返す」とし、引き換えも手配の確定と返金だけを挙げるが、操作キーを持つのは手配の確定と返金だけ（DEC-12 の (a)）で、乗車の終了、取り消し、不在のお金の操作で送り直した画面が何を受けるかは書かれていない。また CUJ-16 は返金も応答がなければ同じキーで送り直すとし、そのときの返金は 2.7 秒に収まらない（降車と同じなら 9.2 秒）。要求の中のやり直しの回数を値として書いているのは降車の確定（2 回）と地図（0 回）だけで、手配の確定と返金の 2.7 秒は 1 回だけ送る前提の計算になっている。DEC-12 の、処理中を確かめ中とみなすまでの時間は「最悪の 9.2 秒より長く」とされ、切った後も動きうる 13.0 秒より 3.8 秒短い（計算。同じキーを使うので二重には動かないが、まだ動いている操作の確かめが始まる）
suggestion: DEC-12 に、お金の操作ごと（手配、押さえ直し、取り消し、不在、降車、返金）の要求の中のやり直しの回数を書き、T_route をその中で最も長い経路から決め直す（降車の確定をドライバーへの応答の後に動かし、結果を SSE で届ける形も比べる）。操作キーのない操作が T_route で切られたときに、送り直した画面が何を受けるかを書く（操作キーをお金を動かすすべての操作に広げる案も比べる）。処理中を確かめ中とみなすまでの時間は、切った後も動きうる最長（13.0 秒）を基にする
