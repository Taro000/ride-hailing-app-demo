id: FND-42
title: Web アプリが端末の保存（localStorage、sessionStorage、IndexedDB、Cache Storage）に何を書いてよいかの決まりがなく、それを使う所を限る依存の規則もない
status: open
basis: inferred
basis_note: null
premises: []
raised_by: high-level-design-to-detailed-design
raised_in: 4-detailed-design/ELM-02.md
to: architecture-to-technical-policy
targets: [POL-02, POL-04]
severity: minor
evidence: POL-02 の依存の規則は、ブラウザの位置、画面を消さない仕組み、Web Push の登録、知らせの許し、流れのつながり、外への呼び出しを ELM-01 と ELM-02 の src/platform/ だけに使わせるが、端末の保存（localStorage、sessionStorage、IndexedDB、Cache Storage）は挙げず、POL-04 のコードの中の約束事も、Web アプリが端末に何を書いてよいかを決めていない。ELM-02 の画面は、参加者の名前、連絡先、場所（DAT-01、DAT-03、DAT-07 は個人の情報）、エンジニアが理由を示して見た隠した情報（FR-35）、担当者が渡す設定の符号（DEC-14）を受けて示す。どれかのモジュールが読んだものの記憶を端末の保存に写す書き方（TanStack Query の記憶を残す仕組みなど）を選ぶと、担当者とエンジニアのコンピューターに ELM-04 の外の写しが残り、3 年を過ぎた記録を個人を特定できない形に変えること（FR-51、QR-59）と記録した日の鍵を捨てること（DEC-16）が届かず、使い終えた後（FR-48 の 4）も同じブラウザで読める。第 4 段階の ELM-02 の実行は、端末の保存を MOD-01 の答えのない返金の操作（乗車か返金の ID、額、冪等キー、たどる ID）だけに使い、ほかのモジュールはそれぞれの契約で書かないとしたが、どの検査もそれを守らず、開発者のレビューだけが見る
suggestion: POL-02 に、Web アプリの端末の保存（localStorage、sessionStorage、indexedDB、caches）を src/platform/ だけが使う依存の規則を、Oxlint の no-restricted-globals と no-restricted-properties で加える。POL-04 に、Web アプリが端末の保存に個人の情報、設定の符号、パスワード、理由を示して見た情報を書かないこと（書いてよいのは、送り直すための操作の冪等キーとたどる ID と、個人の情報を持たない本文など）を加える。ELM-01 が端末のエラーと示した時刻の報告をためる所も、この決まりに入れる
resolution: null
