id: FND-63
title: MOD-23 の作りかけの鍵は、作り手が中身を書く前に止まると出口がなく、その日の鍵で暗号にする項目がどれも書けなくなる
status: accepted
basis: inferred
basis_note: MOD-23 の状態遷移図、判断表 A、並行性とエラーの節、ensureKeys の errors、parameters、DAS-18 の rating_note、HND-21、DEC-16、POL-04 の鍵の置き方、DEC-05 と NFR-16 のインスタンスの停止は入力。作りかけのまま残る道は、このレビューがそれらを順にたどった推定
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-03.md
to: high-level-design-to-detailed-design
targets: [MOD-23]
severity: major
evidence: MOD-23 は記録した日ごとの鍵を、置き場所に「ないときだけ作る」で名前を作ってから中身を書く（想定の本番の Secret Manager は秘密を作ってから版を足し、ローカルは排他の作り方のファイルを作ってから書く）。状態遷移図の作りかけ（Creating）の出口は、その作り手が中身を書いたときと、ほかの作り手が先に作っていたときだけで、作り手が名前を作った後に中身を書く前に止まったときの出口がない。判断表 A は、作りかけを読んだ作り手に 200 ミリ秒置いて 3 回まで読み直させ、なければ KeyStoreUnavailable を返し、ほかの作り手が「ないときだけ作る」を試みても「すでにある」で置き場所から読み直す行に戻るので、その日の鍵はいつまでも中身を持たない。ensureKeys の errors が頼る「次の起動か日々の処理が作る」も、ないときだけ作るので作りかけには効かない。項目を書くのはいつも今日の日付の鍵（報告の MOD-23 の振る舞い）なので、その日は、乗る場所と降りる場所、位置、名前と連絡先ほか、鍵で暗号にする項目を書くどの取引も止まり（呼ぶ側は 503 SERVICE_UNAVAILABLE、MOD-20）、依頼、見積もり、アカウントの作成ほかを一日受け付けない（DRV-01）。起動と日々の処理は 2 日先までの鍵を前もって作る（parameters）ので、その途中で止まると、後でその日が来たときに同じになる。インスタンスの停止は DEC-05 の回の終わりと NFR-16 の予行で起き、MOD-67 は system_error の異常として知らせるが、どの項目もその日の鍵を使えるようにする道を持たない。DAS-18 の rating_note の「書くときに鍵がない日は一度だけ作るので、項目が書けなくなることはない」とも合わない
suggestion: 作りかけに出口を加える。たとえば、決まった待ちの後も中身のない鍵を見た作り手がその鍵に中身を書けるようにし（最初に書かれた中身だけを使い、Sealed が持つ鍵の版で後から書かれた中身を使わないと不変条件を書き直す）、または名前と中身を一度に作る置き方にする（ローカルは一時のファイルに書いてから名前を付け替える、Secret Manager は版を持つ秘密だけをあるとみなすなど。名前の付け方は HND-21）。作り手が名前を作った後に止まっても、その日の鍵で書けるようになることを鍵の置き場所の偽物で確かめる
resolution: 受け入れ。MOD-23 の日ごとの鍵を、中身とともに一度に、ないときだけ見せる置き方で作るようにした（ローカルは書き終えた一時のファイルをその日の名前にハードリンクで結び、名前がすでにあれば失敗して置き換えない。想定の本番の Secret Manager は、その日の秘密に中身を版として足してから、その日の最初の版を読み直して使う）。名前だけで中身のない鍵（版のない秘密、結ばれていない一時のファイル）はないものとして扱うので、作り手が名前を作った後に止まってもほかの作り手がその日の鍵を作れる。状態遷移図の作りかけと、作りかけを待って読み直す判断表 A の行（200 ミリ秒の 3 回）をなくした。不変条件、ensureKeys の errors、DAS-18 の rating_note、HND-21 の何をと守る枠（一時のファイルの名前と片付け）を合わせ、止まった作り手の一時のファイルを置いてから書く結合の層の確かめを加えた
