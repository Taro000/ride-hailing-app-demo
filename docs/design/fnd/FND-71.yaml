- IFC-03
- IFC-06
severity: major
evidence: 活動 B3、B9。DEC-52 版 2 と IFC-13 は、5xx の後に「照らして起きていないと確かめ、試みの番号を進めた新しいキーで送る」を押さえ（手配と押さえ直し）にだけ書き、確定と取り消しのキーは押さえごと（<PaymentIntent>_capture、_cancel）で試みの番号がない。IFC-13 の 5xx の caller_does は「送り直さず、確かめ中にする」。一方、DRV-04 の毎日の処理の流れは「5xx の後なら起きていないと確かめてから新しいキー」とどの操作にも書き、CUJ-08 は「3 回とも応答がない、5xx」を一つの枝にして同じキーの送り直しに 5xx を含めうる。支払いの状態遷移図は checking → unpaid を「確定していないと確かめた」とするので、確定に 5xx が返ると、押さえ（PaymentIntent は requires_capture のまま）が有効なのに未払いになり、乗客は別の支払い手段で新しい PaymentIntent を払わされ（FR-31 AC2）、元の押さえは期限（7 日）まで残る。次の手配も UNPAID_RIDE_EXISTS で断られる。取り消しに 5xx が返ると release_checking が押さえの期限まで続き、デモの期間を終える条件の (A) が 7 日 0 にならない
suggestion: 確定・取り消し・返金の 5xx の後を、押さえと同じ形（照らして起きていないと確かめ、T_op_stale を過ぎたら試みの番号を進めた新しいキーで同じ操作をやり直す）にするか、それができないなら確かめ中のまま人に知らせるかを決め、支払いの状態遷移図（checking → unpaid は「Stripe が失敗と答えたか押さえが期限で消えた」ときだけ）、お金の操作の図、IFC-13 の errors、CUJ-08 の枝、毎日の処理の流れをそろえる。キーの形の変更が要るなら FND-72 の答えに合わせる
