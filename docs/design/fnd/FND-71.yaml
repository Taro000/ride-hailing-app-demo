id: FND-71
title: 確定・取り消し・返金で Stripe が 5xx を返した後の出口が項目ごとに違い、押さえを残したまま未払いにしうる
status: open
version: 1
basis: inferred
basis_note: 根拠に引いた項目と報告書の文は入力。そこから起きることの読みと直し方の案は推定
needs_agreement: false
approver_candidates: []
