severity: minor
evidence: DEC-15 は、位置の記録の表を読めるものを、運営・サポート担当とエンジニアの役割、配車のモジュール、毎日の処理に限る。DEC-14 の位置の受信の記録（時刻、位置、誤差。T_log_retention の間残す）と最後の位置（迎車中の乗客の位置を含む）は別の表で、読めるものの決まりがない。苦情の調べ（FR-45）は受信の記録を使う（第 2 段階の課題 3）。FR-24 AC3 は、乗車が始まるか依頼が終わると乗客の位置を示すのをやめるとするが、乗客の最後の位置をいつ消すかもない（DRV-21、QR-38）
suggestion: DEC-15 の読める範囲の決まりを、位置を持つすべての表（位置の記録、位置の受信の記録、最後の位置）に広げる。乗客の最後の位置は、FR-24 AC3 で示すのをやめるときに消す
