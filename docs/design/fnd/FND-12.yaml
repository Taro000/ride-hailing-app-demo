id: FND-12
title: Web アプリがビルドのときの値だけを読み、そのビルドを一度だけ作るため、試験の環境の偽物の設定で ELM-01 の地図と EXT-01 の入力部品を替えられない
status: open
basis: inferred
basis_note: POL-01、POL-03、POL-04 の規則、偽物、環境、パイプラインの文は入力（第 2b 段階の項目）。それらが同時には成り立たないことは、このレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-03, POL-04]
severity: major
evidence: POL-04 の設定の規則は、Web アプリがビルドのときの公開してよい値（EXT-01 の公開の鍵、ブラウザ用の地図の鍵、Web Push の公開の鍵）だけを一か所で読むとし、配備の規則は、リリースの手順が ELM-01 と ELM-02 のビルドの出力を含む ELM-03 のイメージを版ごとに一度だけ作り、試験の環境で確かめたものと同じイメージ（digest を比べる）をローカルの本番に配備するとする（POL-01 の規則も同じ）。POL-03 の試験の環境はそのリリースのイメージを偽物の設定と本物の外部サービスの設定の二つで動かし、端から端の層は偽物の設定で、ELM-01 の地図を描く部品を「設定で」地図のない部品に替え（EXT-02 の偽物の差し替え口）、EXT-01 の入力部品と Web Push の登録を src/platform/ の偽物に替える（差し替え口は単体の層と端から端の層）。Web アプリには実行のときに読む設定がないため、この切り替えはビルドのときの値でしか決まらず、一度だけ作るビルドでは、偽物の設定の端から端の層と、本物の入力部品と地図が要る NFR-47 の確かめ、実機の受け入れ（NFR-15）、ローカルの本番とを一つの値で満たせない。偽物の設定で本物の入力部品を残すと、EXT-01 の偽物を選んだ ELM-03 が作った登録の取引を本物の EXT-01 で確かめることになり、DEC-12 の登録が通らない。同じ理由で、EXT-01 の公開の鍵と Web Push の公開の鍵は、試験の環境とローカルの本番で同じものに決まる（FND-13）。二つの方針が食い違う
suggestion: 環境と設定ごとに違う値（外部のサービスの公開の鍵、偽物を使うかどうか）を、Web アプリが実行のときに一か所で読めるようにする（たとえば ELM-03 が自身の確かめた設定から配る値を、src/platform/ の設定の部品が起動のときに読む）か、端から端の層の差し替えをブラウザの通信の層（Playwright の経路の差し替え）で行い、その差し替え口を POL-03 に書く。どちらでも、ローカルの本番の設定で偽物を選べないことを、ELM-03 の偽物と同じように確かめる
resolution: null
