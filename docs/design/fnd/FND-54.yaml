id: FND-54
title: 設定の符号を参加者に渡す手段が決まっておらず、F1 は「範囲外」とするが範囲外の節にも DEC-20 の前提にもない
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-04-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-20
- DRV-29
severity: minor
evidence: 脅威のモデルの F1 は設定の符号について「渡す手段は範囲外」と書くが、報告書の「範囲外」の節にその行はなく、DEC-20 の前提にも要合意にもない。DRV-29 の刺激は「盗み見たか推し量った設定の符号で、本人より先にパスワードを決める」、応答は「設定の符号は本人だけが使え」。品質チェーンへの回答（設計 2-9）は「QR-20 で、設定の符号が本人だけに届くことなど」を設計に回している。符号をアカウントのメールアドレスに送ると、そのメールを読める人は両方を得る。出し直しにも、頼んだ人が本人かの確かめがない。推し量りは危険でない（10 文字の英数字で 36^10 ≈ 3.7 × 10^15。100 の IP が 1 日 24,000 回試して 6.6 × 10^-12。計算）
suggestion: '渡す手段を DEC-20 の前提に書く（例: 対面か、アカウントのメールとは別の道で渡し、出し直す前に本人を確かめる）。業務の手順として扱うなら範囲外の節に一行足し、DRV-29 の応答がその前提に頼ることを書く'
resolution: null
