id: FND-10
title: 最後の期間の後に個人情報を残さないことが、品質チェーンにない機能に頼っている
status: accepted
version: 2
basis: inferred
basis_note: DEC-05 の負債、ELM-05 の責務、DEC-30 の根拠、FR-53、TC-06 と報告書の品質チェーンへの課題の表は入力。消去が足されないときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-05
- ELM-05
severity: major
evidence: DEC-05 の負債は「デモの期間の外では保存期間の処理（FR-53）が動かず、T_pii_retention を過ぎた個人情報が残りうる」で、返すときは「最後のデモの期間を終えるとき（個人情報をすべて消す処理を動かす）」。ELM-05 の責務にも「最後の期間を終えるときの個人情報の消去」がある。この消去はどの FR にもない（FR-53 は T_pii_retention を過ぎた記録を特定できない形に変える）。報告書は品質チェーンへの課題の番号のない行で「FR-53 には…足すかを決める」と書くだけ。一方 DEC-30 は「機能は品質チェーンが決め、設計の段は機能を足さない」として、ドライバーを装う人への備えを先送りしている。品質チェーンが消去を足さないと決めると、最後の期間の後はジョブが止まったままで、FR-53 も NFR-41 も二度と動かず、DRV-21（交渉できない）を満たせない。それでも DRV-21 の通し確認は「満たす」とする。期間が最後かどうかの見込みを誤ると、TC-06 の「データはデモとデモの間も残す」とも食い違う
suggestion: DRV-21 の判定を、品質チェーンの答え待ちの「一部」にし、消去を番号のある品質チェーンへの課題にする。消去が足されないときの道も設計に書く（最後の期間の後も FR-53 と NFR-41 だけを動かす定時の起動を残す、データベースごと消す、など。前者は TC-07 と FND-02 にも関わる）。DEC-30 と同じ扱いにそろえる
resolution: 受け入れた（質問 13 で確認済み）。DEC-36 を新設し、最後の期間を終えるときに、システムを終える手順で Turso のデータベース、手元の書き出し、ジョブ、定時の起動、規則、秘密、地図の鍵を消す。これは機能ではなくインフラの片付けとして扱う。DEC-05（版 2）と ELM-05（版 2）から「個人情報をすべて消す処理」を外し、DRV-21 の判定を「一部（手順を動かしたときだけ満たす）」にした。「最後」と決めずに終えると個人情報が残る危険は要合意。FR-53 を直す必要はなくなった
