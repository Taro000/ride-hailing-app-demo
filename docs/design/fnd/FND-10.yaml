id: FND-10
title: 外からの生存確認の結果がアラートへ渡る流れは信頼の境界を越えるが、脅威のモデルの表にない
status: open
basis: inferred
basis_note: 脅威のモデルの図の信頼の境界と流れ、表の行、図の下の注は入力（第 2 段階の報告の「脅威のモデル」）。この流れの脅威が表のどの行にもないことはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-20]
severity: minor
evidence: FND-09 を受けて、脅威のモデルの図のシステムの中の信頼の境界に「ログと知らせのアラート（Cloud Logging と Cloud Monitoring、想定の本番だけ）」が加わり、そこへ三つの点線が引かれた。ELM-03 からの「日々の処理を終えた記録」と日々の呼び出しからの「呼び出しの結果」は、どちらもシステムの中の信頼の境界のうちにあり、図の下の注もそう書く。残る「外からの生存確認 → アラート（確かめた結果）」は、信頼の境界「外からの生存確認（Cloud Monitoring、デモの回の間だけ）」からシステムの中の信頼の境界へ入るが、番号がなく、表に六つの脅威の行もない。F13 の行は生存確認がサーバーを呼ぶ向きだけを、F14 の行はアラートから開発者のメールへの向きだけを扱い、注が境界を越えるのは F14 だけとするのも、日々の処理の記録と呼び出しの結果のやり取りについてである。確かめた結果がアラートに届かないか偽られて、デモの回の間にサーバーが止まってもメールが出ないことは、どの行にもない。DEC-20 の生存確認の知らせの道のうち、この流れだけが六つの脅威で確かめられていない
suggestion: この流れに番号を付けて、六つの脅威を当てた行を表に加える。生存確認とアラートを同じ Cloud Monitoring の中のこととみるなら、図をそのように描き直し、境界を越えない理由を注に書く
resolution: null
