id: FND-52
title: MOD-01 の kept() が、最初の変える要求の答えを待っている返金の操作を evidence が notDone のため捨て、画面を開き直すと新しい返金を受け付ける
status: open
basis: inferred
basis_note: MOD-01 の kept() と evidence の上げ方、型の Evidence、MOD-02 の「開いたときの残した操作」の表と出来事の表は入力（0347322 で FND-44、FND-46 を受けて変わった所）。書かれたとおりに作ると開き直した画面が新しい返金を受け付け、二度返金されうることはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-02.md
to: high-level-design-to-detailed-design
targets: [MOD-01, MOD-02]
severity: major
evidence: FND-46 を受けて、MOD-01 の evidence は変える要求の結末で答えの判断表のとおりに上がるとした（報告の MOD-01 の節。送っている途中であることはタブの保存の inFlight にだけ書く）。そのため、最初の変える要求の答えを待つ間（MOD-01 の状態は送っている）の操作の evidence は notDone のまま。型の Evidence は notDone を「まだ出していないか、401 NOT_SIGNED_IN と 429 だけを受けた」、unanswered を「答えを受けていない要求がある」とし、上げる時と食い違う。kept() は「evidence が notDone の操作（どの変える要求も効いていない）... は、捨てて返さない」とし、送っている途中を unanswered にするのはタブを読み直したときだけ。一方、MOD-02 は送っている間に画面を離れても操作が答えまで送られるとし（出来事の表の「画面を離れる」）、同じ乗車の返金の画面を開くと kept() で残した操作を探し、「開いたときの残した操作」の表で MOD-01 の状態が送っているものを待つ。書かれたとおりなら、担当者が返金するを押して最初の要求の答えを待つ間に画面を離れて戻ると、kept() がその操作を捨て（要求を中止し、後の答えも捨てる）、MOD-02 は残した操作がないとして一覧に移り、新しい返金を受け付ける。要求が ELM-03 に届いて返金を書く前に一覧の読みが答えれば一覧にその返金は出ず、担当者が改めて認めた返金は新しいキーの別の返金になり、最初の要求も済めば一度だけ認めた返金が二度済む（QR-45 の失敗のシナリオ、交渉できない DRV-32）。MOD-01 の確かめ方（evidence が notDone なら捨てられる）と MOD-02 の確かめ方（MOD-01 の偽物が残した操作を返す）はどちらもこの食い違いを通らず、端から端の層にも、最初の要求の答えを待つ間に画面を離れて戻る場面がない
suggestion: 答えを受けていない変える要求がある操作（状態が送っているか、inFlight が真）は、メモリでもタブを読み直したときと同じに unanswered として kept() が返し、kept() が捨てるのは答えを待つ要求のない notDone の操作だけにする（型の Evidence の定義と上げる時をそろえる）。MOD-01 の単体の層に最初の変える要求の答えを待つ間の kept() を、MOD-02 の単体の層か端から端の層に最初の返金の要求の答えを遅らせて画面を離れて戻る場面を加える
resolution: null
