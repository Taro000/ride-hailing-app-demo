id: FND-32
title: 依頼の支払いの状態遷移図に、押さえの解放・未払いの支払い・返金・押さえ直しの結果が分からない状態がなく、released を確かめないまま終わりにしうる
status: open
version: 1
basis: inferred
basis_note: 報告書の「依頼の支払いの状態」の図、結果が分からないときの約束（payment.state = checking）、IFC-02 と IFC-06 の 202 の行、仕様書の PaymentState の列挙は入力。図に従ったときに起きることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-high-level-design.md
to: architecture-to-high-level-design
targets:
- IFC-02
- IFC-03
- IFC-06
- IFC-08
severity: major
evidence: 報告書の「依頼の支払いの状態」の図は、held から released（無料の取り消し、確かめられなかった到着での不在）を直接つなぎ、released を終わりにする。押さえの取り消しの結果が分からない間の状態はない。一方でエラーの決まりは、取り消し、不在、乗車の終了で Stripe の結果が分からなければ「200 と payment.state = checking を返す」とするが、図の checking は capturing からだけ入り、出口は paid と unpaid だけ。無料の取り消しの解放が分からないまま checking にすると、確かめて解放が分かっても released に出る道がない。図に従って released にすると、結果の分からない操作を終わりの状態で隠す（活動 B9 が見るもの）。未払いの支払い（202 PAYMENT_PENDING）、返金（202 REFUND_PENDING）、押さえ直し（202 DESTINATION_CHANGE_PENDING。図は held から held の一本だけ）も、結果が分からない間の状態がない。仕様書の PaymentState の列挙（passenger.openapi.yaml ほか、同じスキーマ）も図と同じで、乗客の画面（ELM-01）、ドライバーの画面（ELM-02）、サーバー（ELM-04）は第 4 段階で別々にこの状態を解く
suggestion: 押さえの解放、未払いの支払い、返金、押さえ直しのそれぞれに、結果が分からない間の状態と出口を描く（例として releasing と release_checking、unpaid_paying、refund_checking、rehold_checking）。checking を確定の確かめだけに絞るか、checking から released への出口を足す。PaymentState の列挙と、エラーの決まりの payment.state をそれに合わせる
resolution: null
