id: FND-28
title: 着く見込みの遅れが T_vehicle_location_lag に収まるのは EXT-02 への求め直しが 8.5 秒で終わるときだけだが、IFC-19 はその枠を書かずに値を第 4 段階に送っている
status: accepted
basis: inferred
basis_note: IFC-19、HND-07、HND-08 の文と報告の計算は入力。8.5 秒はこのレビューのスクリプトによる計算
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [IFC-19]
severity: minor
evidence: HND-08 を決めた報告の計算は、位置の古さ 10.7 秒、求め直す間隔 10 秒、EXT-02 の道の時間 1.0 秒、流れと示すまで 0.8 秒の和 22.5 秒が T_vehicle_location_lag（30 秒）に収まるとする。1.0 秒は健全なときの予算で、遅い呼び出しはタイムアウトとやり直しまで待つため、収まるのは求め直しの呼び出しがやり直しを含めて 8.5 秒（30 − 10.7 − 10 − 0.8）のうちに終わるときだけ。IFC-19 はその呼び出しのタイムアウトとやり直しを第 4 段階に送り（HND-07）、枠に DEC-13 のタイムアウトの順だけを挙げる。HND-07 の bounds（DEC-13、QR-07、NFR-17、NFR-09、QR-65）にもこの限りはない
suggestion: 着く見込みを求め直す EXT-02 の呼び出しは、やり直しを含めて 8.5 秒（DAS-11 の値から求めた限り）のうちに諦めて着く見込みを示せないとすることを、IFC-19 の timing に枠として書く
resolution: IFC-19 の timing に、着く見込みを求め直す呼び出しはやり直しを含めて最初に送ってから 8.5 秒のうちに答えを得なければ諦めて着く見込みを示せないとする枠を書き、第 4 段階がこの枠の中で値を決める（HND-07）とした。報告の計算にその限りを加えた
