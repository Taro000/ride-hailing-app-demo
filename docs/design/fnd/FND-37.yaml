id: FND-37
title: 一つ目の規則が、アプリが業務の理由で返す 429 も数えるので、参加者でない人の操作で急ぎの知らせを鳴らせる
status: open
version: 1
basis: inferred
basis_note: DEC-54 の選んだ案と応答を左右する点と失うもの、IFC-01・03・08 の 429 の行、DEC-55、FND-23 の URL の公開は入力。鳴らせることは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-high-level-design.md
to: architecture-to-high-level-design
targets:
- DEC-54
- IFC-19
severity: minor
evidence: DEC-54 の一つ目の規則は「5xx か 429 が 5 分で 5 件以上」で、指標で入口とアプリの応答を分けられないため、アプリの 429 も数える。アプリは業務の理由でも 429 を返す。ACCOUNT_LOCKED（IFC-01）、CONFIRMATION_ATTEMPTS_EXCEEDED（IFC-03）、STREAM_LIMIT（IFC-08）、RATE_LIMITED（DEC-55、すべての経路）。デモの URL は公開される（FND-23）ので、誰でもログインの失敗か流れの開き直しで 5 分に 5 件を作れ、急ぎの知らせが一人の運用者（DRV-26）に届く。DEC-54 の応答を左右する点と失うものは、一時の誤りと二度鳴ることだけを挙げ、この引き換えを書いていない
suggestion: 引き換え（知らせの正しさと、Cloud Run の入口が返す 429 を拾うこと）を DEC-54 に書き、規則の条件を比べ直す（429 を外して 5xx とインスタンスの指標だけにする、429 だけしきい値を高くする、など）
resolution: null
