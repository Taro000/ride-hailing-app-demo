id: FND-37
title: 外部を呼ぶ操作のキーの answerDueAt に余裕がなく、取引が予算を超えて遅れただけのインスタンスの答えを、期限の後の送り直しが置き換える
status: open
basis: inferred
basis_note: DEC-42、DAT-26、DEC-45、DEC-46、IFC-03、IFC-13、IFC-17 の値と決まりは入力。受けたインスタンスの答えが answerDueAt の後になることはこのレビューのスクリプトの計算で、その間の送り直しが答えを置き換えることはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [DEC-42, DAT-26]
severity: minor
evidence: DEC-42 と DAT-26 は、外部を呼ぶ操作のキーを、受けた時刻にその操作の答えの期限（IFC-03 と IFC-13 は 8.8 秒、IFC-07 は 8.7 秒）を足した answerDueAt とともに動いているとして書き、answerDueAt を過ぎた同じキーの送り直しには、受けたインスタンスが止まったか遅れたとして試みの状態から DEC-45 の答えを書く。余裕を足さない理由を、答えの期限はその操作が答えるはずの時刻だから、とする（DEC-42 の rationale）。しかし 8.8 秒は、自身の処理と取引 A の 0.2 秒、EXT-01 の待ち 8.5 秒、結果の取引 0.1 秒の予算の和で、IFC-17 の待ちは最初に EXT-01 に送った時刻から数え、取引の予算は裾の分け前のパーセンタイル（DEC-46）なので超えることがある。このレビューのスクリプトでは、取引 A が 0.3 秒なら受けたインスタンスの答えは 9.0 秒、取引 A が 0.5 秒で結果の取引が 0.3 秒なら 9.4 秒で、どちらも answerDueAt の 8.8 秒より後になる。その間に届いた送り直し（つながりが切れた端末は 409 OPERATION_IN_PROGRESS の後に 1 秒ごとに送る、DEC-42、DEC-43）は、まだ分からない押さえの試みから 503 HOLD_UNCONFIRMED を答えて依頼を受け付けなかったとし、止まっていないインスタンスがその後に得た押さえは解かれる。お金は二重に動かないが、済むはずの依頼が利用者には受け付けなかったと示され（SLI-01 の悪いイベント）、このことは DEC-42 の失うものにも応答を左右する点にもない
suggestion: 受けたインスタンスが answerDueAt までに答えるよう、EXT-01 の待ちを、最初に送ってから 8.5 秒と、answerDueAt から結果の取引の分を引いた時刻の早い方で終えると DEC-42 と IFC-17 に書くか、answerDueAt に取引の遅い裾を見込んだ余裕を足して、その値を DEC-42 の parameters と仮定に入れる。どちらもとらないなら、遅れたインスタンスの答えを期限の後の送り直しが置き換えることを、DEC-42 の失うものと応答を左右する点に書く
resolution: null
