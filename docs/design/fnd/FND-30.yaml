id: FND-30
title: 受け入れ基準のたどりのいくつかの行が基準を示さない流れを指し、基準を運ぶ IFC の functions と画面の信号が欠けている
status: accepted
basis: inferred
basis_note: FR の受け入れ基準、IFC の functions、操作、誤り、報告の流れ、画面、受け入れ基準のたどりの表は入力。行ごとの照らし合わせはこのレビュー
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [IFC-03, IFC-11, IFC-22]
severity: minor
evidence: IFC-11 の functions は FR-09（ride.accepted がドライバーの名前と車の手がかりを運ぶ）と FR-22（走っているドライバーにも offer.added が届く）を挙げず、その行は IFC-11 を挙げない。IFC-22 の functions は、乗客に示す FR-05 の 4、FR-29 の 4 と 5、FR-30 を挙げない。IFC-22 は「現在地が分からない」の信号を IFC-02 の答えとするが、端末が位置を得られないときに IFC-02 が返すものはない（FR-02 の 3）。ドライバーの画面の「乗客が変えた」（画面の CUJ-08）には信号がなく、乗客が押さえ直したことを伝える出来事も、ドライバーへの GET /v1/rides/current の決済の状態もない（FR-29 の 4）。閾値を変えて依頼し直す道（FR-05 の 4）と、場所を変えると見積もり直す道（FR-03 の 3）は画面の CUJ-01 にない。流れの列は、ない節（CUJ-01 配車手配の失敗の流れ、乗車の履歴、日々の処理）や、場面の違う流れ（FR-21 の 2 の DRV-02 は取り消しと許諾の重なり、FR-24 の 3 の CUJ-03 はドライバーの画面でない）を指し、FR-11 の 2、FR-23 の 4、FR-28 の 2、FR-38 の 1、3、4、FR-41 の 4、FR-42 の 3、FR-47 の 6、FR-51 の 2、4 の符号と操作は指す流れにない。そのため報告の「どの割り当てた FR のどの受け入れ基準も、IFC と流れを通る」はこれらの行で成り立たない（FND-24 と FND-25 の基準は別）
suggestion: IFC-11 に FR-09 と FR-22 を、IFC-22 に FR-05、FR-29、FR-30 を加え、IFC-22 の FR-02 の 3 の信号を端末の状態に直し、押さえ直しが済んで決済をやり直せることをドライバーに伝える所（出来事か今の状態）を IFC-03 か IFC-11 で決め、各行が基準を示す流れを指すようにするか、欠けた道と符号を流れと画面に描く
resolution: IFC-11 の functions に FR-09 と FR-22 を、IFC-22 の functions に FR-05、FR-29、FR-30 を加え、IFC-22 の FR-02 の 3 の信号を端末の位置の取得の失敗と IFC-02 の PLACE_NOT_FOUND_AT_LOCATION に分けた。乗客が押さえ直したことをドライバーに知らせる ride.payment_method_changed を IFC-11 に加え、IFC-03 の今の状態がドライバーに決済の状態を返すようにし、IFC-23 にその信号を書いた。報告の画面の CUJ-01 に場所を変えたときの見積もり直しと閾値を変えて依頼し直す道を加え、流れと画面に欠けていた道と符号（MESSAGING_CLOSED、RIDE_ALREADY_STARTED、RIDE_NOT_STARTED、乗車の照会、アカウントの訂正と試験用の区別、RIDE_ALREADY_ARRIVED、RECORD_ANONYMIZED、ACCOUNT_RETIRED）を描き、乗車の履歴と日々の処理の流れを加え、受け入れ基準のたどりの各行が基準を示す流れを指すようにした。FR-05 は ELM-01 の functions にないため FND-35 を第 2 段階に出した
