id: FND-46
title: MOD-01 のタブの保存の項目が、kept() が返す答えの種類を不変条件で除き、答えのない送りの後に 401 を受けた操作の種類と、版が変わった後の読み方を決めていない
status: accepted
basis: inferred
basis_note: null
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-02.md
to: high-level-design-to-detailed-design
targets: [MOD-01]
severity: minor
evidence: MOD-01 の kept() はタブの保存の操作を最後に受けた答えの種類（答えがない、失敗の答え、401 だけ）とともに返し、MOD-02 は 401 だけの操作を何もしていないとして捨てる。報告の「キャッシュ」の節はタブの保存がその種類を持つとするが、MOD-01 の不変条件は書く項目をアカウントの ID、操作の名前、経路の値、本文、冪等キー、たどる ID、最初に送った時刻だけとする。種類も、答えのない送りの後に 401 を受けた操作（send の notSignedIn の前の送りが unanswered）をどう持つかを決めておらず、字のとおり最後の答えの 401 として持つと、タブの読み直しかサインインし直しの後に、ELM-03 で済んでいたかもしれない操作を MOD-02 が捨て、同じキーで続ける道を失う（一覧に返金が出るので二重にはならないが、MOD-02 の不変条件「答えのない間はタブを読み直しても同じキーで続く」が守られない）。また、DEC-41 で ELM-03 の版が変わると MOD-04 が画面を読み直してタブの保存は残るが、新しいビルドが前のビルドの書いた項目をどう読むかも決めていない
suggestion: 不変条件の項目に答えの種類を加え、種類を 401 の前の送りを含めて決める（一度でも答えのない送りがあった、失敗の答えだけ、401 だけ）。項目に形の版を持たせ、読めない項目をどう扱うか（捨てずに一覧で確かめるよう示すなど）を決める
resolution: 受け入れ。タブの保存の項目を、形の版、アカウントの ID、操作の名前、経路の値、本文、冪等キー、たどる ID、最初に送った時刻、evidence（notDone、failed、unanswered の順に上がるだけ）、最後の変える要求の答えの別（次の X-Resend のもと）、送っている途中か（変える要求を出す前に書く）とし、MOD-01 の不変条件にした。答えのない要求の後に 401 を受けた操作は evidence が unanswered のままで、タブを読み直してもサインインし直しても同じキーで続く。evidence が notDone の操作は kept() が捨て（MOD-02 の 401 だけを受けた操作を捨てる決まりはここに移した）、MOD-02 は残した操作を evidence で答えがないか失敗の答えに分ける。項目は一つ前のビルドがそのまま読める足し方だけで変え、読めない項目は消して kept() が数を返し、MOD-02 が一覧で確かめるよう示す
