id: FND-46
title: FR-12 AC5 の「変更の前後の降車場所」を残す所がなく、FR-10 AC3 の「到着予定がないこと」の残し方も書かれていない
status: accepted
version: 2
basis: inferred
basis_note: FR-12 AC5 と FR-10 AC3、DAT-05・06・07 の欄と保持期間、admin.openapi.yaml の Billing の fareChanges、DRV-32 は入力。前後の降車場所が残らないことは推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-high-level-design.md
to: architecture-to-high-level-design
targets:
- DAT-07
- DAT-06
- DAT-05
severity: major
evidence: FR-12 AC5 は、変えた時刻と、変更の前後の降車場所と料金を記録することを求める（QIU-02、06、08 の測定）。時刻は DAT-07 の destination_changed の recorded_at に、前後の料金は管理の請求の記録（Billing の fareChanges）にあるが、前後の降車場所はどこにも残らない。DAT-06 の dropoff は今の降車場所だけで、DAT-07 の details は額と理由だけ、見積もり（DAT-05）は使った後に毎日の処理が消す。DAT-07 は座標を持たず位置の参照だけを持つ（DRV-32）ので、前後の降車場所を何で持つかを決める必要がある。あわせて FR-10 AC3（到着予定を計算できないとき、依頼に到着予定がないことを記録する）は、DAT-06 の pickup_eta_at_acceptance を許諾ごとに追記するとするだけで、計算できなかったときに何を残すかが書かれていない
suggestion: DAT-07 の destination_changed（または DAT-06）に、変更の前後の降車場所を位置の参照（DAT-08）か場所の ID で持つと書き、保持期間と匿名化（FR-53）を合わせる。pickup_eta_at_acceptance には、計算できなかったときに null を追記すると書く
resolution: "受け入れた。DAT-07 の destination_changed は変更の前後の降車場所を DAT-08 の位置の参照（kind が dropoff_before と dropoff_after）で持ち、FR-53 で位置を消す（保持は T_pii_retention）。pickup_eta_at_acceptance は計算できなかったときに null を記録すると DAT-06 に書いた"
