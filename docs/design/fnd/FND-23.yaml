id: FND-23
title: 境界の SLI の出どころが、答えを受けた後の送り直しまで一つの操作にまとめて最後の答えで数え、システム自身の誤りを数えから消す
status: accepted
basis: inferred
basis_note: SLI-01〜SLI-06 の数え方の規則、IFC-01、IFC-02、IFC-03、IFC-04、IFC-06 の sli_bindings、DEC-35、DEC-43、報告の「SLI の出どころ」と DRV-01 の流れの文は入力。出どころと規則が違う数え方になることは、このレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [IFC-01, IFC-02, IFC-03, IFC-04, IFC-06]
severity: major
evidence: SLI-01〜SLI-06 の VALID の数え方の規則は、同じ利用者が同じ操作を「応えを待たずに」送り直したものを一つと数える。IFC-01、IFC-02、IFC-03、IFC-04、IFC-06 の sli_bindings（IFC-03 の SLI-02、SLI-03、SLI-05、SLI-06 は「数え方は SLI-01 と同じ」）は、同じたどる ID の送り直しを一つと数え、その操作に最後に返した答えで数える。たどる ID は送り直しを含む一つの操作のどの要求にも付き（DEC-43）、500 INTERNAL_ERROR の後は状態を変える操作を同じ冪等キーで送り直してよい（DEC-35）。そのため、ELM-03 が 500 で答え、端末がその答えを受けてから同じキーで送り直して済んだ操作は、規則では悪いイベントと別の操作の二つだが、出どころでは良い一つになり、システム自身の誤りが数えから消える（EBP-01 は悪いイベントを 1 件ずつ振り返る）。また報告は、答えずに止まった操作が「悪いイベントとして残る」（SLI の出どころ）、「SLI-01〜SLI-06 の悪いイベントになる」（DRV-01 の流れ）と書くが、同じ流れが描くとおり端末がタイムアウトの後に同じキーで送り直して答えを受ければ、出どころは最後の答えで数えるため悪いイベントにならない。項目と報告が食い違い、どちらの数え方が規則に合うかも書いていない
suggestion: 端末が答えを受ける前に送った要求と、最初の要求がまだ動いていることを示す 409 OPERATION_IN_PROGRESS の後の送り直しだけを一つにまとめ、システム自身の誤りの答え（500、failureOrigin が system の 503）を受けた後の送り直しは別の操作として数える。そのために、端末が送り直しに番号を付けて最後に受けた答えを添えるなど、答えを受けた後の送り直しかを分ける項目を DEC-43 と境界の出来事（DAT-19）に足す。答えのない要求の後に送り直して答えを受けた操作をどう数えるかを決めて報告の文をそれに合わせ、SLI-01 の規則から決められなければ品質チェーンに求める
resolution: DEC-43 に X-Resend のヘッダー（no_answer、in_progress、after_answer）を加えて境界の出来事（DAT-19 の resend）に写し、境界の SLI の一つの操作を、端末が答えを受ける前の送り直しと 409 OPERATION_IN_PROGRESS の後の送り直しだけをまとめたものとし、ほかの答えを受けた後の送り直しは新しい操作とした。答えのない要求か、システム自身の誤りか外部の失敗の答えを一つでも含む操作は GOOD でないとし、規則がこの場合を述べていないため QCR-07 で品質チェーンに確かめる（影響は低）。IFC-01、IFC-02、IFC-03、IFC-04、IFC-06 の sli_bindings をこの決まりにそろえ、報告の「SLI の出どころ」と DRV-01 の流れの文を合わせた
