id: FND-13
title: 試験の環境の本物の外部サービスの設定がローカルの本番と同じ EXT-01 のテスト環境を使い、リリースのたびの取引が日々の照合と SLI-12 を乱す
status: open
basis: inferred
basis_note: POL-03、POL-04 の環境、秘密の値、パイプラインの文と、DEC-11 の照合、SLI-12、NFR-24、NFR-26、EBP-01 の文は入力。試験の環境とローカルの本番が同じサンドボックスを使うことと、その取引が照合と SLI-12 に現れることは、このレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2b-technical-policy.md
to: architecture-to-technical-policy
targets: [POL-03, POL-04]
severity: major
evidence: POL-03 の試験の環境は、本物の外部サービスの設定で Stripe のテスト環境を使い、リリースのたびに、契約の層（EXT-01 のつなぎ口の押さえ、確定、取り消し、返金、期間の読み出し）、NFR-47 の確かめ（登録と決済）、実機の受け入れ（NFR-15 の配車の手配から決済まで）がそこに取引を作る。ローカルの本番（ELM-10）も Stripe のテスト環境を使う（TC-10）。環境ごとにどのサンドボックスと鍵を使うかは、POL-03 の環境にも、POL-04 の秘密の値の規則とパイプラインの手順にも書かれておらず、POL-04 の規則（Web アプリはビルドのときの EXT-01 の公開の鍵を読み、そのビルドを含むイメージを一度だけ作ってローカルの本番に配備する、FND-12）からは同じサンドボックスに決まる。ローカルの本番の日々の照合（DEC-11）は期間の取引と返金を EXT-01 から読んで記録と突き合わせるため、試験の環境の取引は ELM-04 に記録のない EXT-01 だけの処理として現れ、本当の食い違いと見分けられない。SLI-12 は EXT-01 だけにある処理を VALID に数えて GOOD に数えず、NFR-26 は悪いイベント 1 件で予算を使い切り（EBP-01 の最後の規則）、NFR-24 は食い違う返金を一件ごとに知らせるため、主な設計を動かす要求 DRV-07 の測定量（NFR-26、NFR-24）と、DRV-27 が求める SLI-12 を定義どおりに数えることが、リリースのたびに崩れる。また、NFR-47 の出どころは ELM-03 が受けた要求の中身を試験の環境でだけ写すとするが、偽物（POL-03 の差し替え口、POL-04 の設定の規則とその結合の層のテスト）と違い、ローカルの本番の設定でそれを選べないことを守る規則がなく、選ばれると実在の参加者の個人の情報（CON-06）が DEC-15 の隠す決まりを通らずに残る
suggestion: 試験の環境の本物の外部サービスの設定には、ローカルの本番（と想定の本番）と別の Stripe のサンドボックスとその鍵を使い、どの環境とパイプラインの手順がどの秘密の値と外部のアカウントを受けるかを POL-03 か POL-04 に書く。要求の中身を写す仕組みは、ローカルの本番の設定では選べず選ぶと起動しないようにし、偽物と同じ結合の層のテストで確かめる
resolution: null
