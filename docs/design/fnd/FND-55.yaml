id: FND-55
title: T_request_max の取り消しの対象に「探し直している依頼」がなく、サービスが消えた後に毎日の処理が取り消したときの乗客への知らせがない
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
