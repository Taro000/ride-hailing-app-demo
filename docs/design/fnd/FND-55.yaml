id: FND-55
title: 確定と解除の試みで、500 の後の読み出しが取引の変わっていないことを示すと、DEC-45 の分け方ではその試みを終えられず、決済、料金、押さえの解除が進まない
status: open
basis: inferred
basis_note: DEC-45、IFC-17、DAT-11 の中身と、第 3 段階の報告の「要素をまたぐ状態」の DAT-11 と DAT-07 の状態遷移は入力。Stripe が同じキーの 500 に同じ答えを返し、500 の後は取引を読んで確かめることは、第 3 段階の報告の「入力」の Stripe の文書。答えの一つ一つを分ける MOD-41 と MOD-42 の判断表をこの段階が書いて分かった
premises: [EXT-01]
raised_by: high-level-design-to-detailed-design
raised_in: 4-detailed-design/ELM-03.md
to: architecture-to-high-level-design
targets: [DEC-45, IFC-17]
severity: major
evidence: 決済（押さえの全額の確定）、キャンセル料と不在の料金（一部の確定）、押さえを解くこと（取り消し）は、取引の ID が分かっている状態を変える呼び出しで、500 の答えを受けると IFC-17 は取引を読んで確かめさせる。同じキーの送り直しは同じ 500 を返す（Stripe）。読み出しが、取引が変わっていない（requires_capture のまま）ことを示したとき、その要求はもう効かないが、DEC-45 は処理されなかったとするのを状態を変える呼び出しへの答えが実行の前に退けたことを示すときだけに限り、IFC-17 と DAT-11 の「見つからなければ作られていない（refused）」は作る呼び出し（押さえ、返金、登録の取引）のためのもので、確定と取り消しには当たらない。そのため、その試みは unknown のまま確かめ続けられ、同じ操作の新しい試みは「それまでの試みがどれもはっきり拒否か処理されなかったで終わったときだけ」（DEC-45）作れない。決済は payment_pending から出られず、乗客は終わらない依頼を持つので次の依頼で RIDE_ALREADY_ACTIVE を受け続け（FR-04、CUJ-01）、料金は請求されず（FR-54 の 6、7、QR-04）、押さえは解かれず、moneySettled が真にならない（FR-54 の 8）。refused とすれば、決済は payment_declined になって乗客に要らない支払い方法の変更を求め（FR-29 の 4）、料金は請求されないまま精算が終わる。どちらでも FR-29 の 5 と FR-54 が一部しか満たされない。MOD-42 は今、DEC-45 のとおり unknown のまま確かめ続け、10 分で異常にしている（MOD-67）
suggestion: 取引の ID が分かっている状態を変える呼び出し（確定と取り消し）の試みで、500 か processing の後に、待ちの後（最初に送ってから 8.5 秒より後で、確かめの最初の 30 秒の後）の読み出しが取引の変わっていない（確定なら requires_capture のまま、取り消しなら canceled でも succeeded でもない）ことを示したときは、その要求はもう効かないので、何も実行されていない試みとして処理されなかったで終え、異常にすると DEC-45 と IFC-17 に加える。そうすれば DEC-45 の処理されなかったときの出口（決済はドライバーのやり直しの新しい試み、料金と解除は期限の処理の新しい試み）にそのまま乗る。取り消しで読み出しが canceled を示せば済んだ、succeeded（確定済み）を示せばはっきりした拒否として異常にすることも、同じ判断表に書ける
resolution: null
