id: FND-61
title: 支払い方法の変更と降りる場所の変更の押さえ直しを同じ依頼に重ねて送れ、後に済んだ方が前の結果を古い確定額か古い支払い方法の押さえで置き換える
status: accepted
basis: inferred
basis_note: IFC-17 の ordering、IFC-03 の PUT …/payment-method と承認、DAT-07 と DAT-08 の consistency、DEC-09、FR-46 の 5、FR-54 の 5、DRV-07 は入力。MOD-56 の判断表 B と並行性の節と basis_note、MOD-59 の判断表 A と並行性の節、MOD-45 の判断表 C、報告の「データ」の rides の不変条件は入力。二つの押さえ直しが重なって前の結果を置き換える道は、このレビューがそれらを順にたどった推定
premises: []
raised_by: design-review
raised_in: reviews/4-detailed-design-ELM-03.md
to: high-level-design-to-detailed-design
targets: [MOD-56, MOD-59]
severity: major
evidence: IFC-17 の ordering は、一つの依頼の押さえ、押さえ直し、確定、解除を、前の試みが済んだか拒否か処理されなかったで終わってから送るとするが、MOD-56 はこの「前の試み」を同じ押さえの取引にかかわる試みと読む（MOD-56 の basis_note の推定と、報告の MOD-56 の「一つの押さえの取引への操作は、その取引の前の試みが終わってから次を送り」）。そのため乗車中（riding）の依頼に、降りる場所の変更の承認（MOD-59。取引 A で変更を reholding にし、今の支払い方法 M1 と新しい確定額 F2 で rehold_destination を送る）と、依頼の支払い方法の変更（MOD-56 の判断表 B の「searching〜riding、… ある」の行。取引 A で新しい支払い方法 M2 と今の確定額 F1 で rehold_method を送る）を重ねて送れる。MOD-59 の reholding の一意の決まりは承認どうしだけを、MOD-56 の判断表 B は決済の試みと後で効きうる確定だけを見て、押さえ直しの試みどうしを一つにする操作の鍵（MOD-42）もない。どちらの結果の取引も、取引 A で読んだ押さえ、確定額、支払い方法がまだ依頼の今のものかを確かめない（MOD-59 は riding だけを、MOD-56 は依頼が終わっておらず決済の試みがないことだけを条件にし、報告の「データ」の rides の不変条件も同じ）。降りる場所の変更が先に済むと依頼は確定額 F2 と押さえ H2（M1）になり、次に済んだ支払い方法の変更が依頼の押さえを H3（M2、額 F1）に替えて H2 を解く。決済は今の押さえの全額を確定する（MOD-56 の判断表 A）ので、確定額 F2 でなく F1 を請求する（FR-54 の 5、DRV-07、SLI-11）。逆の順では、依頼が M2 の H3 に替わった後に、降りる場所の変更の結果が依頼の押さえを M1 の H2 に替えて H3 を解くので、乗客が 200 を受けた支払い方法の変更が黙って戻り、前の支払い方法に請求する（FR-46 の 5）。起きるのは乗車中の乗客が二つの操作の待ち（それぞれ最大 8.5 秒、IFC-17）を重ねたときだけだが、主な設計を動かす要求の DRV-07 がその道で一部しか満たされない
suggestion: 一つの依頼の押さえ直しを一つずつにする。たとえば、押さえ直しの試み（rehold_destination と rehold_method）に依頼ごとの操作の鍵を持たせて開いた押さえ直しを一つまでにし、重なった二つ目の操作には今の押さえ直しが終わるのを待たせる答えを返す（IFC-03 の符号で足りなければ第 3 段階に指摘を出す）か、それぞれの結果の取引で、取引 A で読んだ押さえ、確定額、支払い方法が依頼の今のものと同じときだけ依頼を替え、違えば新しい押さえを解いて変えなかったと答える。報告の「データ」に、依頼の今の押さえの額と支払い方法が依頼の確定額と支払い方法に合うことの不変条件とそれを保つものを加え、二つの押さえ直しを差し込みで重ねる結合の層の確かめを加える
resolution: 受け入れ。依頼の押さえ直しを依頼ごとに一つずつにした。押さえ直しの取引 A（MOD-59 の承認、MOD-56 の支払い方法の変更）は、依頼の押さえ直しの印（rides の rehold_attempt_id と rehold_due_at）が答えの期限のうちのほかの押さえ直しを示せば、何も書かずに 409 OPERATION_IN_PROGRESS と Retry-After 1 秒で答え（同じキーの送り直しが、その時の押さえと確定額と支払い方法から押さえ直す）、示さなければ試みを依頼の今の押さえを替える押さえとして作って印を書く。押さえ直しの結果の取引は MOD-56 の settleRehold を通し、印がその試みで、依頼の今の押さえがその試みの替える押さえのときだけ、依頼の押さえと確定額か支払い方法を一緒に替え、ほかは依頼を変えずに新しい押さえを解く（答えの期限を過ぎた遅れた結果で、ほかの押さえ直しが先に動いたときは 503 REHOLD_UNCONFIRMED）。期限の後の答えは印を空にし、遅れた結果の取引に依頼を替えさせない。報告の「データ」の rides に、依頼の今の押さえの額と支払い方法が確定額と支払い方法に合うことと、答えの期限のうちの押さえ直しが一つまでであることの不変条件と、それを保つものを加え、二つの押さえ直しを差し込みで重ねる結合の層の確かめを MOD-56 と MOD-59 に加えた。待たせる答えは IFC-03 の符号（DEC-42 の OPERATION_IN_PROGRESS。利用側のすることがそのまま合い、MOD-59 がすでに同じ答えを使う）で足りるため第 3 段階の項目の変更は求めず、DEC-42 がこの場合を書いていない点だけを軽微な FND-74 で第 3 段階に出した
