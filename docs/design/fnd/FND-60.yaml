id: FND-60
title: DEC-42 はアカウントが替わった後の送り直しをほかのアカウントの操作として行わないとするが、ELM-03 がまだキーを受けていない要求はそのアカウントの操作として行われる
status: open
basis: inferred
basis_note: DEC-42 の chosen と gains、FND-50 の resolution（ELM-01 と ELM-02 は要求ごとにアカウントを確かめる要求を要しない）、DAT-26 の整合の取り方（キーはそれを最初に受けたアカウントと操作に結び付く）、DEC-40 のクッキー、DAS-13 の端末がつながらない間に持つ操作、FR-50 の 1、DRV-30 は入力。ELM-03 がまだ受けていないキーの要求がほかのアカウントの操作として行われる道は、第 4 段階の ELM-02 がそれらを順にたどった推定
premises: []
raised_by: high-level-design-to-detailed-design
raised_in: 4-detailed-design/ELM-02.md
to: architecture-to-high-level-design
targets: [DEC-42]
severity: minor
evidence: FND-50 を受けた DEC-42 は、ELM-03 がキーをそれを最初に受けたアカウントと操作に結び付け、ほかのアカウントで受けたキーを行わずに 422 IDEMPOTENCY_KEY_REUSED で答えるので、一つの操作の要求とその送り直しの間にセッションのアカウントが替わっても、送り直しがほかのアカウントの新しい操作として行われることはないとし（chosen）、gains にも、送り直しの間にアカウントが替わってもその操作はほかのアカウントで行われないと書く。FND-50 の resolution は、そのため ELM-01 と ELM-02 は要求ごとにアカウントを確かめる要求を要しないとする。ところが、キーを結び付けるのは ELM-03 がそれを最初に受けたとき（DAT-26）なので、それまでの要求がどれも ELM-03 に届いていない操作（最初の要求、つながらずに届かなかった要求の後の送り直し、端末がつながらない間に持って後で送る操作、DAS-13）の要求がほかのアカウントのセッションで出ると、ELM-03 はそのアカウントにキーを結び付けて、その操作をそのアカウントの操作として一度行い、記録する。お金は二度動かないが、ELM-02 では、担当者 A が認めた返金が、同じブラウザのほかのタブでサインインした担当者 B の操作として行われ、操作の記録も B とする（FR-50 の 1、DRV-30）。ELM-01 では、乗客の操作が、同じブラウザでサインインしたほかの乗客の操作として行われうる。第 4 段階の ELM-02 の MOD-01 は、そのため冪等キーのある操作のどの要求も、出す直前に GET /v1/me がその操作のアカウントと答えたときだけ出すことを続けるが、確かめの答えを受けてから要求を出すまでのミリ秒の幅にほかのタブのサインインがクッキーを替えると、ELM-03 がまだキーを受けていない要求は、なおほかのアカウントの操作として行われる。起きるには同じブラウザで二つのアカウントが重なってサインインする必要があり、ELM-02 ではその幅だけなので軽微とした。要求ごとの確かめを省いた Web アプリでは、その幅でなく、アカウントが替わった後のどの送りでも起きる
suggestion: どのアカウントの操作として行うかも ELM-03 が守るようにする。たとえば、冪等キーのある要求に、端末がその操作を始めたアカウントの ID をヘッダー（DEC-44 の名付け）で添え、ELM-03 はセッションのアカウントがそれと違えば行わずに答える（状態と符号は第 3 段階が決め、利用側はその操作を捨てて今の状態を読み直す）。そうすれば確かめから要求までの幅もなくなり、ELM-01 と ELM-02 は要求ごとの確かめを省ける。そうしないなら、DEC-42 の chosen と gains を、ELM-03 がすでにキーを受けた操作の送り直しに限ると直し、どのアカウントの操作として行うかは端末が要求ごとに確かめて守り、確かめから要求までの幅が残ると書く
resolution: null
