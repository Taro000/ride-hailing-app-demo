id: FND-60
title: '毎日の SLI-03 の確かめ直しに要る記録が三つ欠けるか合わない: 乗客の位置の許可、乗客の裏の時間、回の開け閉めの記録が欠けたとき'
status: open
version: 1
basis: inferred
basis_note: 根拠の記述は成果物から（入力）。食い違いと重さの判断は推定
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-04-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-16
- DEC-14
- DEC-27
- ELM-05
severity: minor
evidence: (1) SLI-03 版 2 は数える相手を「迎車中で位置情報の利用を許可していた乗客」とするが、DEC-16 の確かめ直しが読むのは位置の受信の記録（受けた時刻）、受付と状態、裏にあった時間だけで、乗客が許可したかの記録がない。(2) DEC-14 の節は「乗客の分も記録し、SLI-03 の見えない点を減らす」とするが、SLI-03 版 2 が除くのは「ドライバーのブラウザが裏にあった時間」だけで、見えない点に「乗客のブラウザが裏にあるかは記録がない」とある。設計が乗客の裏の時間を除くと SLI と食い違う（品質チェーンへの課題 2）。(3) 回の開け閉めの時刻は配備の記録（DEC-27 版 4）から取るが、閉じる操作が途中で失敗したときや Turso に届かず書けないとき（運用のコマンドの終わりの符号 20）に毎日の処理がどう区間を決めるかがない。閉じた記録がなければ SLI-03 版 2 は「最後の状態のまま使用中とみなして」数え続け、開いた記録がなければ回が丸ごと抜けて値は良く見える。DRV-27 の残る危険には挙がるが、どの DEC も扱わない。また DEC-16 の選んだ案と ELM-05 の責務に、配備の記録が入力として書かれていない
suggestion: 乗客が位置の共有を始めた・やめた時刻を記録するか、許可を数え方でどう読むかを決める。乗客の裏の時間を除くかを SLI-03 に合わせる。開け閉めの記録が欠けたときの区切り方（次の開け閉め、記録した失敗、サービスを消した時刻）と、その日の値を不完全として知らせることを DEC-16 か DEC-27 に書き、配備の記録を入力に足す
resolution: null
