id: FND-02
title: 迎車中に運転するドライバーが連絡のメッセージを読み書きする安全のリスクを、誰も決めていない
status: open
basis: inferred
basis_note: DEC-27 の失うもの、QIU-17 の失敗のシナリオ、報告の「設計の観点」は入力。リスクを受け入れる決定として尋ねるべきだったことはこのレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-27]
severity: major
evidence: DEC-27 は配車が確定してから乗車が始まるまでアプリの中のメッセージで連絡させ、選んだ案の失うものに「運転中のドライバーがメッセージを読むことになる」と書き、決まった短い文で済むようにするとしている。その間のドライバーは迎車のために運転している。走りながら画面を見て操作して前への注意がそれることは、品質チェーンが QIU-17（健康・安全リスク緩和性）の失敗のシナリオに挙げ、依頼を選ぶ操作と許諾については FR-22 と DEC-22 が止めている。DEC-27 の案の比べ方は DRV-16、DRV-29、FR-11 だけで運転中の操作の安全を比べておらず、報告の「設計の観点」の保証・セキュリティ・安全の行も人の安全には DEC-22 だけを挙げる。リスクを受け入れる決定は事業の判断で、安全の害は重大さが高になるため利用者に尋ねるものだが、報告の「決めたこと」にも、種類が暫定の決定の DAS にもない
suggestion: DEC-27 の比べ方に運転中の操作の安全を加え、リスクを減らす案（走っている間はドライバーの側のメッセージの入力を受け付けない（DEC-22 の判断を使う）、届いたメッセージは決まった短い文だけにする、など）を比べる。FR-11 は止まっている間の連絡で満たせる。それでも残るリスクを受け入れるなら、利用者に尋ねて「決めたこと」に記録する
resolution: null
