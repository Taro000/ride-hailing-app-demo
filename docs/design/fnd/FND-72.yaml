id: FND-72
title: DEC-12 のキーの表は確定と取り消しを押さえごとの一つのキーにし、5xx の後に新しいキーでやり直す道がない
status: open
version: 1
basis: inferred
basis_note: 根拠に引いた項目と報告書の文は入力。そこから起きることの読みと直し方の案は推定
needs_agreement: false
approver_candidates: []
