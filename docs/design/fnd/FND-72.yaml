severity: major
evidence: 第 3 段階のレビューの活動 B3 から。DEC-12 版 4 の選んだ案はキーを「確定と取り消しは押さえごと」とし、assumptions は「Stripe は動き始めた要求の応答を 5xx も含めて少なくとも 24 時間保ち、同じキーには同じ応答を返す」とする。すると確定か取り消しに 5xx が返った後、同じキーの送り直しは 24 時間同じ 5xx を受け、起きていないと確かめても新しいキーを作る決まりがない。第 3 段階は押さえだけにキーへ試みの番号を足した（DEC-52 版 2、IFC-13）が、確定と取り消しは DEC-12 の表に縛られる。結果は FND-71 のとおり（押さえを残したまま未払い、取り消しの確かめが押さえの期限まで続く）。DRV-04（お金を一度だけ）と DRV-30 版 2（失敗と分かった後のやり直しは新しい操作）にかかわる
suggestion: DEC-12 のキーの表に、確定と取り消しにも試みの何回目かを入れる（<PaymentIntent>_capture_a<n>、_cancel_a<n>）か、5xx の後は人が片付けると決めて理由と知らせを書く。決めたら第 3 段階に FND-71 の追随を伝える
