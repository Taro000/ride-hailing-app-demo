id: FND-22
title: 要求を受けたインスタンスが答える前に止まると、冪等キーと日々の処理に「動いている」印が残り、同じキーの送り直しと日々の処理の再試行が 409 を受け続ける
status: accepted
basis: inferred
basis_note: DEC-42、DAT-26、IFC-15、DAT-27 の文、報告の DRV-01 の流れ、DAS-02 と DRV-02 の文は入力。止まったインスタンスが書いた印を外す決まりがないことと、その結果は、このレビューの推定
premises: []
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [DEC-42, DAT-26, IFC-15, DAT-27]
severity: major
evidence: DEC-42 は、最初の要求が動いている間の同じキーの送り直しに 409 OPERATION_IN_PROGRESS（Retry-After は 1 秒）を返し、利用側は待って同じキーで送り直し、答えを受けるまで送り直し（DEC-08）、キーと最初の答えは 24 時間持つ（DAS-13）とする。DAT-26 は、要求を処理する前に動いているとして書き、答えたときに答えを書く。どちらも、動いていると書いた要求のインスタンスが答える前に止まったとき（DAS-02 は、デモの回の間の一つのインスタンスが落ちて処理中の操作が失敗することを受け入れている）に、その印をいつ止まったものとみなし、同じキーの送り直しに何を答えるかを決めていない。書かれたとおりなら、その送り直しは 24 時間 409 を受け続け、外部を呼ばない操作（取り消し、許諾、乗車の開始、到着の確認、評価）で結果を書く取引が終わっていなかったものは、その間同じキーでは行われない。報告の DRV-01 の流れは「最初の要求の期限を過ぎて結果がない」ときに「依頼の今の状態で答える（押さえが分からなければ 503 HOLD_UNCONFIRMED、決済なら試みを確かめた結果）」と描くが、この決まりはどの項目にもなく、お金を動かさない操作で操作をし直すのか、し直さずに何を返すのかも書いていない。DRV-02（主な設計を動かす要求）は、システムが止まって再開してもどの操作も失われないことを求める。同じ形が日々の処理にもある。IFC-15 は、その日の処理がほかの呼び出しで動いていれば 409 JOB_IN_PROGRESS を返して Cloud Scheduler に後で呼ばせ、DAT-27 は取ったことを書いてから行うため、取った実行のインスタンスが止まると、その日の再試行はどれも 409 を受け、その日の仕事を誰も行わない（終えた記録が届かずにアラートが知らせるだけ）
suggestion: 動いているという印に、それを止まったものとみなす時刻（その操作に ELM-03 が答える期限に余裕を足したもの。日々の処理はその最悪の時間に余裕を足したもの）を持たせることを DEC-42、DAT-26、DAT-27 に書き、その後の同じキーの送り直しへの答えを操作の種類ごとに決める。結果を書く取引が終わっていない外部を呼ばない操作はし直し（結果とキーの答えを同じ取引で書くため二重にならない）、お金の操作は試み（DAT-11）の状態から DEC-45 の答えを返す。IFC-15 の JOB_IN_PROGRESS も、その時刻を過ぎたら取り直して行う。報告の DRV-01 の流れをその決まりに合わせる
resolution: DEC-42 で、キーの記録の書き方を外部を呼ぶかで分けた。外部を呼ばない操作は結果とキーと答えを一つの取引で書いて動いている印を持たず、受けたインスタンスが答える前に止まれば何も効いていないので、同じキーの送り直しが初めから行う。外部を呼ぶ操作（お金の操作と支払い方法の登録）は試みとともにキーを動いているとして答えの期限とともに書き、期限を過ぎた送り直しには試みの状態から DEC-45 のとおりに答える（DEC-45 に受けたインスタンスが止まったときの答え方を加えた）。DAT-26 にその整合の取り方を、DAT-11 に期限の処理が押さえ中のまま残った依頼を受け付けなかったとすることを、DAT-07 にその出口を書いた。日々の処理は、DAT-27 と IFC-15 で、取った実行に止まったとみなす時刻（時間の上限は第 4 段階、HND-19）を持たせ、それを過ぎたら次の呼び出しが取り直して終わっていない仕事から行い、取り直された実行は書けずに止まるとした。IFC-03、IFC-07、IFC-13 の冪等性と、報告の DRV-01 と DRV-23 の流れと冪等キーの状態遷移図をこれに合わせた
