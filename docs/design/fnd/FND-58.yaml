id: FND-58
title: 取引が変わらず処理されなかったとした決済の後に乗客が支払い方法を変えると、前の取引への確定が遅れて効いたときに二度請求する
status: open
basis: inferred
basis_note: DEC-45、IFC-17、DAT-11 の処理されなかったとする決まりと、その要求が後で効きうるとすること（DEC-45 の chosen と応答を左右する点、IFC-17 の取引の状態が操作に合わない誤りの扱い）、IFC-03 の PUT …/payment-method と POST …/payment、DAT-07 の状態遷移、DEC-09 の押さえ直しの順、FR-30、FR-46 の 5 は入力。二度請求する道は、このレビューがそれらを順にたどった推定
premises: [EXT-01]
raised_by: design-review
raised_in: reviews/3-high-level-design.md
to: architecture-to-high-level-design
targets: [DEC-45, IFC-03, IFC-17]
severity: major
evidence: FND-55 を受けた変更（a5a8ee7）で、DEC-45、IFC-17、DAT-11 は、取引の ID が分かっている確定の試みが 500 を受け、待ちの後の最初の確かめ（決済は最初に送ってから遅くて 38.5 秒）でも取引が requires_capture のままなら、EXT-01 が確かめていないまま処理されなかったで終え、依頼を destination_arrived に戻す（DAT-07）。DEC-45 はその要求が後で EXT-01 で効きうるとし（応答を左右する点の「まだ動いている要求」）、お金が二度動かないことを、一つの取引は確定か取り消しのどちらか一度だけなので次の試みが取引の状態に退けられて取引を読むことに置く（DEC-45 の chosen、IFC-17 の取引の状態が操作に合わない誤り）。それが守るのは次の試みが同じ取引に向かうときだけで、ドライバーのやり直しと、期限の処理の料金と解除はそうなる。ところが destination_arrived の依頼では乗客は支払い方法を変えられ（IFC-03 の PUT …/payment-method が拒むのは決済の試みが動いているか結果が分からない間だけ。FR-46 の 5、報告の画面の CUJ-03 の「支払い方法は変えなくてよい」）、変えると新しい取引で押さえ直してから前の取引を取り消す（DEC-09）。前の取引への確定がそれまでに遅れて効いていると、取り消しの試みは取引の状態に退けられ、読んだ取引は求めた canceled でなく確定済みなので拒否として異常になる（IFC-17）だけで、どの決まりもその確定を依頼の決済とせず、新しい取引の確定も止めない。ドライバーのやり直しはその時の押さえ（新しい取引）の全額を確定し（DEC-09、IFC-03）、乗客は確定額を二度請求される（FR-30 の 2、DRV-07、DRV-32）。毎日の照合（DAT-13）が前の取引の確定を片方にしかない処理として見つけるのは、二度目の請求の後になる。起きるのは、500 を返した確定を EXT-01 が最初の確かめより後に効かせ、その間に乗客が支払い方法を変えたときだけだが、DEC-45 と IFC-17 はその遅れて効く場合を守る対象に挙げており、DRV-32 は交渉できない原則で、主な設計を動かす要求の DRV-07 と FR-30 がその道で一部しか満たされない
suggestion: DEC-45 の「お金は二度動かない」を、処理されなかったとした確定の後にほかの取引へ移る道にも成り立たせ、DEC-45、DAT-11、DAT-07、IFC-03、IFC-17 の文をそれに合わせる。たとえば次のどちらか。(1) 前の取引の取り消しの試みが取引の状態に退けられ、読んだ取引がその依頼の決済の額で確定済みなら、それを依頼の決済が済んだとして依頼を completed にし、新しい押さえは確定せずに解く。ドライバーのやり直しは IFC-17 の ordering でその取り消しの試みが終わってから送るので、それより前に新しい取引を確定しない。(2) 取引が変わらず処理されなかったとした決済の後は、前の取引が確定か取り消しで終わるまで、その依頼の支払い方法の変更を 409 で拒み（PAYMENT_PENDING_CONFIRMATION か新しい符号。IFC-03、IFC-22）、やり直しを同じ取引に向ける（DEC-45 はもともと、処理されなかった決済で乗客に支払い方法を変えさせない）
resolution: null
