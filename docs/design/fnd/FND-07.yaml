id: FND-07
title: 要求のタイムアウト 3,600 秒が同じサービスの短い要求にもかかり、Turso の呼び出しにも上限がない
status: open
version: 1
basis: inferred
basis_note: DEC-01・03・12・22、SLI-01、DRV-01、NFR-24 と報告書の「待つもの」の表は入力。Turso が遅いときに起きることは推定
needs_agreement: true
