id: FND-07
title: 戻すために残す写しに保存期間を過ぎた個人の情報を残さないやり方を、DEC-17 が決めていない
status: open
basis: inferred
basis_note: 品質チェーンが QR-17 と QR-59 に書いた扱いと、DEC-17 の守り方は入力。残した写しが日々の処理で書き換えられないことはこのレビューの推定
premises: [TC-07]
raised_by: design-review
raised_in: reviews/2-architecture.md
to: architecture-drivers-to-architecture
targets: [DEC-17]
severity: minor
evidence: 品質チェーンが QR-17 と QR-59 に書いた扱い（DRV-02 と DRV-21、DRV-07 と DRV-21 の競合）は、止まった後に戻すために残すものにも保存期間を過ぎた個人の情報を残さないことを求める。DEC-17 は想定の本番を Turso の複製と時点を指定した戻しで、ローカルをデータベースのファイルの写しで守り、「戻すために残すものも同じに扱う」とするが、残した写しの中の記録は日々の処理（DEC-18）では変えられない。写しを持つ期間も、DEC-16 の鍵で写しの中の古い個人の情報を読めなくするやり方も、どの決定にも、応答を左右する点にも、申し送りにもない
suggestion: 写しを持つ期間（時点を指定した戻しの期間とローカルの写し）を DEC-17 の応答を左右する点として名指し、保存期間の扱いと両立させるやり方（写しの期間を限る、期間ごとの鍵を捨てて写しの中の個人の情報を読めなくする、など）を決めるか、それを決める段階に申し送る。両立しないなら品質チェーンへの要求を書く
resolution: null
