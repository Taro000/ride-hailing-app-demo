id: FND-11
title: DEC-01 と DEC-26 が、第 2b 段階が確定の深さで決めるコードの分け方とリリースの戻し方を決めている
status: open
basis: inferred
basis_note: DEC-01 と DEC-26 の選んだ案と理由は入力。それが第 2b 段階の確定の種類（コンポーネントの中のコードの分け方、リリースの配備と戻し方）に当たることは、この段階の推定。この段階は同じ選び方をした（DEC-31、POL-02、POL-04）
premises: []
raised_by: architecture-to-technical-policy
raised_in: 2b-technical-policy.md
to: architecture-drivers-to-architecture
targets: [DEC-01, DEC-26]
severity: minor
evidence: DEC-01 の選んだ案は「一つの配車サーバー（中を機能ごとの部分に分ける）」で、コンポーネントの中のコードの分け方を決めている（理由は、その分け方と CI の検査を第 2b 段階に任せている）。DEC-26 の選んだ案は、データの形を一つの版の中では足すだけにし、戻すときは前の版を配備し直すと決め、リリースの戻し方とマイグレーションの足し方を決めている（理由は、配備と戻しの手順とデータの形を変える道具を第 2b 段階に任せている）。どちらも第 2b 段階の確定の種類で、この段階は同じ選び方をし（DEC-31、POL-02、POL-04）、この実行から後の段階とコードは技術方針に従う。二つの段階の項目が同じ点を決めていると、どちらか一方だけが変わったときに食い違う
suggestion: DEC-01 の選んだ案と理由は、配車サーバーの中の部分の境を技術方針の分け方と依存の規則（POL-02）で保つことだけを述べ、機能ごとに分けることはそちらに任せる。DEC-26 は、変えた振る舞いをデータベースの切り替えで止めることと、前の版に戻しても新しい版の書いたデータを読めることを保ち、マイグレーションの足し方と前の版の配備し直しは技術方針（POL-04）に任せる
resolution: null
