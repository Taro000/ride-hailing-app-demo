id: FND-11
title: 降車の確定の最悪 9.0 秒が、DEC-12 の「取り出してから送り直す」を数えていない
status: accepted
version: 2
basis: inferred
basis_note: DEC-12 の仕組みと値、NFR-24・25、Cloud Run の停止の猶予 10 秒（第 2 段階の入力）は入力。14.0 秒はスクリプトでの計算
needs_agreement: false
approver_candidates: []
raised_by: design-review
raised_in: reviews/2026-11-03-architecture.md
to: architecture-drivers-to-architecture
targets:
- DEC-12
severity: minor
evidence: DEC-12 の (c) は、応答がないときはまず Stripe の状態を取り出し、まだ起きていないときだけ同じキーで送り直すとする。最悪の時間 3 × 2.5 + 0.5 + 1.0 = 9.0 秒は確定の呼び出し 3 回だけを数える。同じく 2.5 秒で切る取り出しの呼び出し 2 回を加えると 14.0 秒になり、NFR-25 の 10 秒と、Cloud Run が止める前の猶予 10 秒を超える。また 2.5 秒は NFR-24 の 3 秒（1 時間に 5% までを許す知らせのしきい値）から決めていて、Stripe の正常なときの最も遅い応答からではない。入力に Stripe の応答時間はない。正常でも遅い押さえを 2.5 秒で切ると、結果が分からない押さえが増える（FR-05 にその扱いがないことは第 2 段階の課題 1）
suggestion: 要求の中のやり直しは 24 時間の内に保たれる冪等キーに任せて取り出しを省き、(c) は見回りと毎日の処理の確かめに限る、などと書き分けて、時間を計算し直す。タイムアウトの値は、Stripe のテスト環境で測った応答時間をもとに見直す（最初のデモの前の確かめに入れる）
resolution: 受け入れた。DEC-12（版 2）で、要求の中では応答がないときだけ同じキーで送り直し（Stripe は 5xx も含めて同じキーに同じ応答を返す）、状態の取り出しは見回りと毎日の処理に移した。最悪の時間は Stripe 9.0 秒、データベースの二つのトランザクションを含めて 9.2 秒（計算）。2.5 秒は NFR-24 から決めた仮の値と書き、最初のデモの前にテスト環境で応答時間を測って見直すことにした
