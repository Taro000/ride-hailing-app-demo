basis_note: 乗車中に乗客が降りる場所を変えて料金と到着予定の時刻を承認し、承認すると確定額が更新されることは FR-47、CON-01（入力）。新しい額で押さえ直してから前の押さえを解き、押さえ直せないか分からなければ変えないことは DEC-09、DEC-10、FR-54 の 4（入力）。属性と整合の取り方は推定
