id: DAT-02
title: セッション、パスキー、一度だけの符号
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。一度だけの符号を乗客とドライバーの両方に使い、出し直しで前の符号を無効にし、決め直したらそのアカウントのほかのセッションを終えることは FR-01 版 3・FR-48 版 2・DEC-43 版 2。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: セッション、パスキー、一度だけの符号
owner: ELM-04
store: ELM-07
key_attributes:
- session_id（推測できない乱数）
- account_id
- passkey_verified_at
- created_at、last_used_at、expires_at、revoked_at
- passkey の credential_id、public_key、sign_count
- 設定の符号（乗客とドライバー）のハッシュ、期限（24 時間）、使った時刻、出し直しで無効にした時刻
- 最初の役割のアカウントを作ったか
relations:
- to: DAT-01
  kind: many-to-one
  note: アカウント
consistency: 認証のモジュールだけが書く。セッションは一行で作り、ログアウト、パスワードの変更、期限で消す。設定の符号は条件付きの書き込みで一度だけ使え、出し直すと前の符号を無効にする（設定を済ませた後でも出し直せる。FR-48 AC6）。新しい符号でパスワードを決め直したら、同じトランザクションでそのアカウントのセッションをすべて消してから新しいセッションを作る（DEC-43）。符号の作成と出し直しは管理のモジュールが認証のモジュールの操作を呼び、管理の操作の記録（DAT-18）と同じトランザクションで書く。最初の役割のアカウントは「まだない」を条件にした一つのトランザクションで作る。ELM-05 は持ち主のモジュールを通して書く（DEC-53。期限を過ぎたセッションの削除）
retention: セッションは期限（DEC-43）か失効の後に毎日の処理が消す。パスキーと符号はアカウントと同じ
classification: personal
drivers:
- DRV-29
- DRV-25
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: 一度だけの符号を乗客とドライバーの両方に使い、使った時刻と出し直しで無効にした時刻を持つとした。決め直したらそのアカウントのセッションをすべて消してから新しいセッションを作ると書いた。期限を過ぎたセッションの削除は ELM-05 が持ち主のモジュールを通して行うと書いた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-01 版 3、FR-48 版 2）、DEC-43 版 2、FND-39'
