consistency: 認証のモジュールだけが書く。セッションは一行で作り、ログアウト、パスワードの変更、期限で消す。設定の符号は条件付きの書き込みで一度だけ使える。最初の役割のアカウントは「まだない」を条件にした一つのトランザクションで作る
retention: セッションは期限（DEC-43）か失効の後に毎日の処理が消す。パスキーと符号はアカウントと同じ
