id: DAT-06
title: 配車依頼
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。システムの取り消し（T_request_max は手配の時刻から数え、探し直しの依頼も同じ）は FR-08 版 2、到着予定を計算できなかったときに null を記録することは FR-10 AC3（FND-46）、確かめ中の降車場所の変更は DEC-52 版 2。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 配車依頼
owner: ELM-04
store: ELM-07
key_attributes:
- ride_id
- passenger_id、driver_id（今の担当）
- state（booking、hold_checking、not_booked、searching、accepted、arrived、in_progress、ended、cancelled、no_show。報告書の状態遷移図）と version
- pickup、dropoff（今の降車場所）
- fare_booked、fare_current
- eta_shown（手配のとき、三つの要素）
- pickup_eta_at_acceptance（許諾ごとに追記。計算できなかったときは null を追記する。FR-10 AC2・3）
- threshold_at_booking、threshold_current（FR-08 AC3）
- confirmation_code（担当ごと）と試した回数
- arrival（時刻、確かめたか、疑わしい印。FR-25、DEC-29）
- vehicle の写し（許諾のとき）
- payment_status（報告書の「依頼の支払いの状態」の 13 値）
- destination_change（確かめ中の降車場所の変更。destination_change_id（dch_）、見積もり、state（pending、applied、cancelled、abandoned））
- cancel_requested
- created_at（手配の時刻。T_request_max はここから数える）、ended_at
- test_account
