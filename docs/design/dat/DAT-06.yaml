  note: 経路の写し
consistency: 配車のモジュールだけが書く（DRV-31）。状態の変化は状態遷移表で許されるものだけを、version の条件付きの書き込みで行い、同じトランザクションで状態の履歴（DAT-07）を追記する。割り当ての条件（停止、迎車中でない、しきい値）は同じトランザクションで確かめ直す（DEC-09）。created_at から T_request_max を過ぎてまだ searching の依頼は、見回りが条件付きの書き込みで cancelled（cancelled_by は system、reason は request_timeout）にし、許諾と重なっても一方だけが効く（FR-08 AC5）。お金の操作は DEC-12 の三つのトランザクションに分け、依頼の状態はお金の結果を待たない（乗車の終わりは一つ目のトランザクションで書き、確かめ中の降車場所の変更はそこで abandoned にする。DEC-52）。支払いの状態は支払いのモジュールが配車のモジュールの操作を呼んで変える。ELM-05 は持ち主のモジュールを通して書く（DEC-53。サービスが消えた後に残った依頼のシステムの取り消しと、保存期間の匿名化）
retention: 個人に結び付く部分は、記録してから T_pii_retention（3 年）を過ぎると毎日の処理が消して匿名にする（FR-53）。残りはシステムを終えるときに消す（DEC-36）
