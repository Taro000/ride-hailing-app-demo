basis_note: 乗客が自分の乗車について苦情か返金の求めを寄せ、乗車と結び付けて受け付け、担当者が対応を終えるまでの状態を記録することは FR-37 と QR-41（入力）。担当者の対応を行った担当者とともに記録することは FR-50（入力）。保持期間は、苦情と返金を扱う間に取り出せる乗車の記録（QR-42）と同じにした推定
