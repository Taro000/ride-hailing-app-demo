consistency: 認証のモジュールだけが書く。作成と役割の付与は一つのトランザクション。ログインの失敗の数と一時の停止は同じ行への条件付きの書き込み（二つのインスタンスでも数がずれない）。ドライバーのアカウントは管理のモジュールが認証のモジュールの操作を呼んで作る（DAT-03 と同じトランザクション）。テスト用の印はエンジニアの API（IFC-07）だけが変え、変えた後の記録に写す
retention: メールアドレスとパスワードのハッシュは、最後に使ってから T_pii_retention（3 年）を過ぎると消して匿名にする（FR-53）。残りはシステムを終えるとき（DEC-36）
