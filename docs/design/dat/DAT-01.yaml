key_attributes:
- account_id
- roles（passenger、driver、operator、engineer の組）
- email（一意。大文字小文字を区別しない）
- password_hash
- status（active、invited、locked）
- failed_logins と locked_until（DEC-20）
- test_account（FR-01 AC5）
- created_at、last_used_at
