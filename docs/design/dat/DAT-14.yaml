id: DAT-14
title: 操作キーと最初の結果
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 操作キーと最初の結果
owner: ELM-04
store: ELM-07
key_attributes:
- account_id と idempotency_key（一意）
- route_id
- request_hash
- status（processing、pending、completed）
- response_status、response_body（設定の符号を示す操作では符号を入れず、示したことだけを残す。DEC-48）
- resource_id（依頼など）
- created_at、expires_at
relations:
- to: DAT-06
  kind: many-to-one
  note: 作った依頼
consistency: 冪等性のモジュールだけが書く。一つ目のトランザクションで一意の制約で書き（同時の二つ目は制約で落ちて 409 OPERATION_IN_PROGRESS）、最初の結果は状態を変えたのと同じトランザクションで書く。pending は結果が確定したとき、配車か支払いのモジュールが冪等性のモジュールの操作を呼んで completed にする。手配の押さえで Stripe が実行しなかったか届かなかったと分かったとき（503 PAYMENTS_UNAVAILABLE）は、二つ目のトランザクションでキーの行を消して放す（同じキーの送り直しは初めからやり直す。DEC-48 の例外、DEC-52）。ELM-05 は持ち主のモジュールを通して書く（DEC-53。T_idem_keep を過ぎたキーの削除と、確かめで定まった pending の確定）
retention: 7 日（仮。T_idem_keep。DEC-48）。毎日の処理が消す
classification: personal
drivers:
- DRV-04
- DRV-30
- DRV-01
as_is: new
