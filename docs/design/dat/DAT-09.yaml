id: DAT-09
title: 位置の受信の記録
status: draft
version: 2
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。サーバーが現在地を受けるたびに一行記録することは FR-17 版 2（AC2）、読める相手は第 2 段階の DEC-15 版 5、重複を送信の ID で捨てることは DEC-48 版 2 の例外。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 位置の受信の記録
owner: ELM-04
store: ELM-07
key_attributes:
- account_id
- client_send_id（IFC-04 の送信の ID clientSendId。アカウントと組で一つ）
- received_at
- measured_at
- lat、lng、accuracy_m
- speed_mps（サーバーが求めた）
- role_state（受付中、迎車中、乗車中）
- suspicious（DEC-29）
relations:
- to: DAT-01
  kind: many-to-one
  note: アカウント
consistency: 位置のモジュールが、サーバーで現在地を受けるたびに一行追記し（FR-17 AC2。同じ送信の ID の二度目は捨てる）、同じトランザクションで最後の位置（DAT-10）を更新する。読める相手は第 2 段階の DEC-15 のとおり（運営・サポート担当とエンジニアの役割、位置の確かめ、毎日の処理。位置の確かめと毎日の SLI-03 の確かめ直しには受けた時刻だけを返す）。ELM-05 は持ち主のモジュールを通して書く（DEC-53。T_log_retention を過ぎた行の削除）
retention: T_log_retention（28 日、仮。DEC-14）。毎日の処理が消す
classification: personal
drivers:
- DRV-03
- DRV-27
- DRV-29
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
- version: 2
  date: '2026-11-04'
  change: サーバーが現在地を受けるたびに一行書くこと（FR-17 AC2）、送信の ID で重複を捨てること、読める相手を書いた。T_log_retention を過ぎた行は ELM-05 が持ち主のモジュールを通して消すと書いた
  reason: '第 3 段階の再実行（2026-11-04）: 品質チェーンの再実行（FR-17 版 2、FR-45 版 2）、第 2 段階の DEC-15 版 5、FND-39・43'
