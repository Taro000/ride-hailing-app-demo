consistency: ELM-03 だけが書き、状態は今の状態を条件にした書き込みで変え、状態の変化と出来事（DAT-09）と届けと示した時刻の記録（DAT-20）を一つの取引で書く（DEC-06、DEC-08）。押さえの試み（DAT-11）は EXT-01 に送る前の取引で、結果は答えを受けた後の取引で書く（DEC-10）。乗客ごとに進んでいる依頼は一つ、ドライバーごとに迎車中か乗車中の依頼は一つ。確定額は見積もり（DAT-06）か承認した降りる場所の変更（DAT-08）からだけ変わる（FR-49 の 3）。確認コードはハッシュだけを持つ。乗る場所、降りる場所、位置は記録した日の鍵で暗号にする（DEC-16）。結果が分からないお金の試みが残る間と、要る押さえの解除と料金の請求（FR-54）がまだ済むか拒否で終わっていない間は、moneySettled は偽（処理されなかった解除と料金の請求は、期限の処理が新しい試みで続ける、DEC-45）。押さえが処理されなかった依頼は受け付けず、決済が処理されなかった依頼は到着したままドライバーのやり直しを待ち、結果が分からなかった決済が確かめで処理されなかったと分かった依頼も到着した状態に戻ってやり直しを待つ（DEC-45）。取引が変わらないまま処理されなかったとした決済の要求が今の押さえで後で効きうる間（その押さえを確定済みか取り消し済みと読むまで）は、依頼の支払い方法を変えず（IFC-03）、その間の決済のやり直しが押さえを取り消し済みと読まずにはっきり拒否されたら、押さえを解いて決まるまで payment_pending にとどまる（解けば payment_declined、解除が押さえの確定済みに退けられれば completed、DEC-45）。乗車は、迎車中（assigned）か迎車が着いた（pickup_arrived）依頼で確認コードが合えば始める（FR-27 の 1）。迎車の到着を位置で決める前に乗車を始めた依頼は pickupArrivedAt を持たず、迎車の到着の段階（DAT-09）、ride.pickup_arrived（IFC-11）、SLI-14 の迎車の到着の組（DAT-20）を作らない。乗車を始めた時刻と位置（boardedAt、boardingVehiclePosition）は、どちらから始めても書く。押さえ中のまま受けたインスタンスが止まった依頼は、同じキーの送り直しか期限の処理が受け付けなかったとする（DEC-45、DAT-11）。状態は報告の「要素をまたぐ状態」
retention: 乗車と料金を請求した依頼は N_ride_record_days の間取り出せ（QR-42）、記録してから 3 年を過ぎたら、状態の変化の種類と時刻を残して操作した人と位置を日々の処理が消す（FR-51、QR-59）。変えた後の行は消さない
classification: personal
drivers: [DRV-02, DRV-07, DRV-05, DRV-06, DRV-27, DRV-21]
sli_bindings:
  - sli: SLI-09
    events: 乗車を始めた依頼（boardedAt がある）一件ごと
    fields: [rideId, pickup, boardingVehiclePosition, boardedAt, testAccount, environment]
    method: 依頼の記録を乗車を始めた日（Asia/Tokyo）ごとに、本番の環境のデモの回の間のものに絞って問い合わせ、乗る場所の位置と乗車を始めた位置の大圏の距離を D_pickup_position_gap と比べる。二つの位置はどちらも WGS84 の緯度と経度で、そのまま比べられる（HND-02）。乗車を始めた位置は乗車の開始の要求（IFC-03）が持つドライバーの端末の測った位置で、ないときは記録されていないとして GOOD でない。試験用のアカウントの依頼は外す
  - sli: SLI-08
    events: 到着を確認した乗車のうち、乗車中に降りる場所を変えて乗客が承認したもの一件ごと
    fields: [rideId, destinationArrivedAt, lastApprovedEta, endReason, testAccount, environment]
    method: 依頼の記録と降りる場所の変更（DAT-08）を到着を確認した日ごとに問い合わせ、最後に承認した到着予定の時刻と到着を確認した時刻の差を T_arrival_estimate_gap と比べる。試験用のアカウントの乗車と、取り消しと不在で終えた依頼は外す
as_is: new
