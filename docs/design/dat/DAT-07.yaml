id: DAT-07
title: 状態の履歴
status: draft
version: 1
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: 配車依頼と乗車の状態の履歴
owner: ELM-04
store: ELM-07
key_attributes:
- seq（通し番号。配信のカーソル）
- change_id（ULID。表示の記録の鍵）
- ride_id
- type（requested、accepted、driver_cancelled、relisted、cancelled、arrived、started、no_show、ended、destination_changed、threshold_lowered、charged、charge_failed、refunded、hold_released、not_booked）
- recorded_at
- actor_kind（passenger、driver、operator、system）と actor_id
- position_ref（DAT-08）か no_position_reason
- details（額、理由）
- trace_id
- test_account
relations:
- to: DAT-06
  kind: many-to-one
  note: 依頼
- to: DAT-08
  kind: one-to-one
  note: 位置
consistency: 配車のモジュールが依頼の状態と同じトランザクションで追記するだけ（FR-39 AC2）。お金の結果（請求、返金）は DEC-12 の二つ目のトランザクションで追記する。座標を持たず位置の参照だけ（DEC-15、DRV-32）。保存期間の匿名化は ELM-05 が同じ配車のモジュールで行う（DEC-05）
retention: 変化の種類と時刻は残す。操作した人と位置の参照は T_pii_retention で消す（FR-53 AC1）。システムを終えるとき（DEC-36）
classification: personal
drivers:
- DRV-27
- DRV-31
- DRV-02
- DRV-32
as_is: new
changelog:
