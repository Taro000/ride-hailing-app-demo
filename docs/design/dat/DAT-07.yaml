id: DAT-07
title: 依頼と乗車
status: active
basis: inferred
basis_note: 依頼の状態と割り当てを ELM-03 だけが今の状態を条件にした書き込みで変え、状態の変化と出来事を一つの取引で書くことは DEC-06、DEC-08（入力）。お金の操作の試みを EXT-01 に送る前に書き、呼び出しをまたぐ取引を作らないことは DEC-10（入力）。確定額が見積もりか承認した料金からだけ変わることは CON-01、FR-49 の 3（入力）。乗車と料金を請求した依頼を N_ride_record_days の間取り出せ、3 年で個人を特定できない形に変えることは QR-42、QR-59、FR-51（入力）。乗車を始めた位置を乗車の開始の要求が持つドライバーの端末の位置から記録し、乗る場所の位置と同じ WGS84 の緯度と経度で比べられることを確かめて HND-02 を決めた（EXT-02 の場所の位置も端末の測った位置も WGS84）。EXT-02 が地図の製品（TC-12）であることに頼るため、TC-12 を前提に挙げたことは FND-32 を受けた。押さえ中のまま受けたインスタンスが止まった依頼の出口は、FND-22 を受けて DEC-45 に決めた。EXT-01 が実行の前に退けた（処理されなかった）押さえ、決済、押さえの解除、料金の請求の出口と、それに合わせた moneySettled の決まりは FND-45 を受けて DEC-45 に決めた。結果が分からなかった決済が確かめで処理されなかったと分かった依頼を到着した状態に戻すことは FND-55 を受けて DEC-45 に決めた。取引が変わらないまま処理されなかったとした決済の要求が今の押さえで後で効きうる間は依頼の支払い方法を変えず、その間の決済のやり直しがはっきり拒否されたら押さえを解いて決まるまで payment_pending にとどまることは、FND-58 を受けて DEC-45 に決めた。確認コードが合えば、迎車の到着を位置で決める前の依頼でも乗車を始め、その依頼には迎車の到着の時刻を持たないことは FR-27 の 1 と FR-12 の 2（入力。乗車の開始を迎車の到着で条件づけない）により、FND-56 を受けて決めた。属性、状態、整合の取り方は推定
premises: [CON-01, CON-06, TC-12]
entity: 依頼と乗車（依頼から決済とお金の精算までの一件）
owner: ELM-03
store: ELM-04
key_attributes: [rideId, passengerAccountId, driverAccountId, state, pickup, dropoff, confirmedFare, quoteId, etaAtRequest, confirmationCodeHash, requestedAt, acceptedAt, pickupArrivedAt, boardedAt, boardingVehiclePosition, destinationArrivedAt, arrivalConfirmedPosition, endedAt, endReason, endedBy, moneySettled, testAccount]
relations:
