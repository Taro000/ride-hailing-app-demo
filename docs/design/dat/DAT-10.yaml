id: DAT-10
title: 位置
status: active
basis: inferred
basis_note: サーバーが参加者ごとに最新の位置を端末が測った時刻と受けた時刻とともに持ち、受けた位置を記録に残すことは DEC-07（入力）。依頼の経過をたどる記録に現在地の受信の記録を含め N_trace_retention_days の間取り出せることは QR-37 と NFR-39（入力）。位置を記録した日の鍵で暗号にすることは DEC-16（入力）。端末の時刻を直すことは DEC-37。属性と整合の取り方は推定
premises: [CON-06]
entity: 参加者の位置（最新の位置と受けた位置の記録）
owner: ELM-03
store: ELM-04
key_attributes: [accountId, latitude, longitude, accuracyMeters, speedMps, measuredAtDevice, sentAtDevice, receivedAt, measuredAt]
relations:
  - {to: DAT-01, kind: many-to-one, note: 位置を送った参加者}
  - {to: DAT-21, kind: one-to-many, note: 1 分ごとの現在地の確かめ}
consistency: 参加者ごとの最新の位置は、測った時刻（DEC-37 で直した時刻）が新しいものだけで置き換え、受けた位置は記録に足す（DEC-07）。迎車の到着を決めた位置は、依頼の状態の変化と一つの取引で書く。緯度と経度は記録した日の鍵で暗号にする（DEC-16）
retention: 最新の位置は置き換え、依頼が終わるか受付をやめたら消す。受けた位置の記録は N_trace_retention_days（QR-37、NFR-39）を過ぎたら日々の処理が消す
classification: personal
drivers: [DRV-04, DRV-11, DRV-27, DRV-29]
sli_bindings: []
as_is: new
