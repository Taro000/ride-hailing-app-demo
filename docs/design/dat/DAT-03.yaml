consistency: 管理のモジュールだけが書く。登録はアカウント、ドライバー、車両、管理の操作の記録（DAT-18）を一つのトランザクションで書く。車両の変更は次の依頼から使う（依頼は許諾のときの車両の写しを持つ。FR-48 AC7、FR-09）。ELM-05 は持ち主のモジュールを通して書く（DEC-53。保存期間の匿名化）
retention: 個人に結び付く部分は、記録してから T_pii_retention（3 年）を過ぎると毎日の処理が消して匿名にする（FR-53）。残りはシステムを終えるときに消す（DEC-36）
