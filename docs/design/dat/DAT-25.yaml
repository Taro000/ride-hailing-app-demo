consistency: 毎日の処理だけが書く。数え直しは version を上げた新しい行にする。SLI-03 はサーバーの毎分の確かめ（DAT-21）ではなく、受信の記録（DAT-09。受けた時刻だけ）、受付（DAT-04）、状態の履歴（DAT-07）、前面と裏（DAT-19）、デモの回の開け閉め（DAT-26）から毎分 0 秒の時点を確かめ直した値を書く（SLI-03 版 2）。SLI-05 は、場所で行う四つの操作は位置か得られなかった印、ほかの変化は時刻と操作した人があればそろったと数え、取り消しにシステムの取り消しと手配をやめた依頼を含める（SLI-05 版 2）
