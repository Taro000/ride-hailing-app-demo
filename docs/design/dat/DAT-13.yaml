id: DAT-13
title: 照合の結果
status: active
basis: assumed
basis_note: 日々、期間の取引と返金を EXT-01 から読んで記録と突き合わせ、食い違いを見つけることは DEC-11（入力）。食い違いをエンジニアと担当者に知らせることは NFR-24（入力）。照合の時刻と読む期間と、処理を行った日の値をその 2 日後の実行で決めることを決めて HND-06 を IFC-15 とともに決めた（時刻と期間は DAS-12 による暫定の決定）。SLI-12 の突き合わせの時点は QAS-32 による品質チェーンの暫定の決定。取引が二つ以上ある依頼は、試みの記録の依頼の ID で一つにまとめる（HND-06）。処理されなかった後に新しい試みで続ける押さえの解除と料金の請求（DEC-45）を、試みがいくつあっても一つの処理として突き合わせることは FND-45 を受けた（SLI-12 の、同じ処理を指す記録を一つと数える規則のまま）
premises: [EXT-01, QAS-32, DAS-12]
entity: EXT-01 との照合の結果（処理ごと）
owner: ELM-03
store: ELM-04
key_attributes: [processingId, kind, attemptId, ext01ObjectId, rideId, processingDate, recordedAmount, recordedResult, ext01Amount, ext01Result, ext01FinalAt, comparedAt, matched, testAccount]
relations:
  - {to: DAT-11, kind: many-to-one, note: 突き合わせた試み（EXT-01 にしかない処理はない）}
consistency: 日々の処理（IFC-15）だけが書き、同じ処理の結果を上書きする。一つの依頼に取引が二つ以上あるとき（確定額か支払い方法が変わった依頼、決済が拒否された依頼）は、試みの記録の依頼の ID と metadata の attemptId で取引ごとに突き合わせ、依頼ごとにまとめて示す。食い違いは異常（DAT-22）として知らせる（NFR-24）
retention: 依頼と同じ（お金の記録の一部）
classification: payment
drivers: [DRV-07, DRV-27]
sli_bindings:
  - sli: SLI-12
    events: システムが記録したか EXT-01 が処理した一つの押さえ、押さえの解除、請求（確定額の決済、キャンセル料、不在の料金）。同じ処理を指す試みの記録と EXT-01 の処理は一つで、片方にしかない処理も一つ。処理されなかった後に新しい試みで続けた押さえの解除、請求、決済は、試みがいくつあっても一つの処理で、最後の試みの記録を比べる（DEC-45）。処理されなかった試みだけで終わった処理は EXT-01 の側になく、システムの記録だけにある処理になる
    fields: [processingId, kind, processingDate, recordedAmount, recordedResult, ext01Amount, ext01Result, ext01FinalAt, comparedAt, testAccount, environment]
    method: 日々の処理（IFC-15）が、EXT-01 の取引の一覧（IFC-17）と試みの記録（DAT-11）を metadata の attemptId と取引の ID で結び、処理を行った日（Asia/Tokyo）ごとに突き合わせる。EXT-01 が最終の結果を返した処理はその時点の EXT-01 の状態（取引の時刻で判断する）と比べ、返さない処理は行った日の翌日の終わりの状態と比べ、日 d の値は d の 2 日後の実行で決める（HND-06、QAS-32）。突き合わせの時点で EXT-01 が結果を返しているのに試みが結果が分からないままのものは GOOD でない。試験用のアカウントの依頼の処理は外し、返金は数えない（NFR-24 が扱う）
as_is: new
