id: DAT-13
title: お金の操作
status: draft
version: 1
basis: inferred
basis_note: 持ち主と置き場所は第 2 段階の情報のビューと DEC-05・08・15（入力）。主な属性と整合の取り方はこの段の推定。保持期間は品質チェーンの T_pii_retention・T_log_retention と第 2 段階の決定（DEC-14、16、22、28、36）から当てはめた
needs_agreement: false
approver_candidates: []
entity: お金の操作（押さえ、確定、押さえの取り消し、返金、未払いの支払い）
owner: ELM-04
store: ELM-07
key_attributes:
- money_op_id
- ride_id
- kind（hold、capture、cancel_hold、refund、unpaid_charge）
- seq（押さえの何番目か、未払いの支払いの何回目か）
- amount
- stripe_idempotency_key
- stripe_object_id
- status（processing、succeeded、failed、checking、not_happened）
- lease_until
- first_sent_at、last_checked_at
- error_code
- refund_request_id
relations:
- to: DAT-06
  kind: many-to-one
  note: 依頼
consistency: 支払いのモジュールだけが書く（ELM-05 は同じモジュールで確かめ中を片付ける。DEC-05）。DEC-12 の三つのトランザクション（キーと処理中、Stripe、結果と依頼と履歴）。処理中が T_op_stale（30 秒）を過ぎたら確かめ中にする。確かめ中を片付けるのは、lease_until を条件付きの書き込みで取った一つだけ（見回りと毎日の処理が重なっても一つ）。一つの依頼で同時に動くお金の操作は種類ごとに一つまで
retention: 額、種類、Stripe の ID は突き合わせのために残す。依頼の匿名化と一緒に個人への結び付きを消す。システムを終えるとき
classification: payment
drivers:
- DRV-04
- DRV-30
as_is: new
changelog:
- version: 1
  date: '2026-11-03'
  change: 作成
  reason: 第 3 段階（質問 1・2 の回答を反映。質問 3〜5 は回答なし）
