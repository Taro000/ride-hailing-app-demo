technology_constraints:
  - id: TC-01
    statement: TypeScript で書く
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-02
    statement: 画面は React で作る
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-03
    statement: サーバーは Hono で作る
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-04
    statement: 静的な検査は Oxlint、整形は Oxfmt を使う
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-05
    statement: テストは Vitest を使う
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-06
    statement: データベースは Turso。デモの環境で使い、データはデモとデモの間も残す。手元では同じ形（libSQL）で動かす
    kind: platform
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 2・9
    basis: confirmed
  - id: TC-07
    statement: 実行環境は GCP Cloud Run。サーバー（Cloud Run のサービス）は、デモの回と、確かめ（NFR-20、NFR-26）のための短い間だけ配備する。毎日の処理は Cloud Run のジョブとし、定時の起動（Cloud Scheduler）とともに、デモの期間だけ有効にする。デモの期間は、一つのデモの最初の回の日から、最後の回の翌朝の処理が終わるまで。ただし、その翌朝の処理のあとに、確かめ中のお金の操作、確定も解放もしていない押さえ、終わっていない依頼が残っていれば、毎日の処理がそれらをどれも 0 件と記録するまで延びる（第 2 段階の DEC-37。延びるのはそれらが残ったときだけ）。それ以外のときは Cloud Run で何も動かさない。手元でも同じ形で動かす
    kind: platform
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 1・2・9・12、第 2 段階の質問 1（FND-02）・質問 17（FND-18）、context.yaml の運用の事実（2026-11-03。品質チェーンへの回答の設計 1-1）
    basis: confirmed
  - id: TC-08
    statement: ふだんは手元の機械で開発する。サーバーを動かすのは、デモの回、確かめの短い間（TC-07）と開発のときだけで、常時は動かさない。デモの期間は、毎日の処理のジョブが動く（TC-07）
    kind: platform
    source: 利用者の入力（2026-11-02。ローカルだけで完結）、第 1 段階の質問 1・4、第 2 段階の質問 1（FND-02）
    basis: confirmed
  - id: TC-09
    statement: スマートフォンのブラウザの Web アプリだけで、ネイティブアプリは使わない。対象は iOS の Safari だけ。裏に回ると通知と現在地の更新が止まる制約を受け入れ、ドライバーは受付中に前面に開いておく
    kind: platform
    source: context.yaml の制約、QR-42、第 1 段階の質問 10
    basis: confirmed
  - id: TC-10
    statement: 決済は Stripe のテスト環境（サンドボックス）。誰も実際のお金を失わない。約束（SLA、上限）は入力にない
    kind: external-service
    source: context.yaml の制約（2026-11-03 に Stripe と書かれた。品質チェーンへの回答の設計 1-4）、第 1 段階の質問 6
    basis: confirmed
  - id: TC-11
    statement: 地図・経路・渋滞の情報は Google Maps Platform の API。使った分の料金と月ごとの無料の枠がある。約束（SLA、上限）は入力にない
    kind: external-service
    source: context.yaml のデータを作るシステム（2026-11-03 に Google Maps Platform と書かれた。品質チェーンへの回答の設計 1-4）、第 1 段階の質問 6
    basis: inferred
    basis_note: サービスの名前は質問 6 で確認済み。料金の形（使った分の料金と無料の枠）は推定
  - id: TC-12
    statement: 位置情報と画面の点灯のブラウザの機能は、安全な文脈（HTTPS か localhost）でしか使えない
    kind: platform
    source: ブラウザの仕様（入力にない）
    basis: inferred
  - id: TC-13
    statement: TC-01〜05 は必ず使う。足りないところ（画面の自動テストを動かすブラウザ、アクセシビリティの確認、依存の確かめ、入口の代理、地図の表示など）には、ほかの道具やライブラリを足してよい
    kind: mandated
    source: 第 1 段階の質問 3
    basis: confirmed
  - id: TC-14
    statement: CI は GitHub のホストされた CI を無料の枠で使う
    kind: platform
    source: 第 1 段階の質問 9、GitHub のリモート（Taro000/ride-hailing-app-demo）
    basis: confirmed
project_constraints:
  - id: PC-01
    kind: budget
    statement: 個人開発で払える程度。額は未定（C_budget_month）。無料の枠を優先する
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 5
    basis: confirmed
  - id: PC-02
    kind: deadline
    statement: 決まりなし
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: PC-03
    kind: team
    statement: 一人（個人開発）。サーバーからブラウザへのリアルタイムの送信は作ったことがある。決済の組み込みは初めて。実機は iPhone だけ
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 7
    basis: confirmed
  - id: PC-04
    kind: other
    statement: ログと監視の基盤は自前の最小構成（構造化ログを保存し、集計のスクリプトで数え、チャットなどに知らせる）
    source: context.yaml の運用の事実（2026-11-01 の回答）
    basis: stated
  - id: PC-05
    kind: other
    statement: 規模。デモは全体で 1〜2 回で終わる。参加者は 2 人（乗客 1 人とドライバー 1 人）。乗車はデモ 1 回で 2〜3 回（全体で 2〜6 回）。1 回のデモは 1〜2 日で、1 日に N_session_hours（3 時間）のデモの回が一つ（デモの回は全体で 1〜4 回、3〜12 時間）。乗客とドライバーが同時に動くので iPhone が 2 台要り、2 台ともそろう。アカウントは参加者にだけ作る（招待制。PC-06）ので、ログインして使うのは参加者 2 人とテスト用アカウントだけで、使う人の数の上限として使える
    source: 第 2 段階の質問 7 の回答（2026-11-03。FND-03）、context.yaml の運用の事実（N_session_hours）と制約（招待制。2026-11-03）、第 1 段階の質問 11・14、FND-27
    basis: inferred
    basis_note: デモの数、参加者、乗車の数、デモの日数は第 2 段階の質問 7 の回答（入力）。1 日に 3 時間の回が一つは質問 11、iPhone が 2 台そろうことは質問 14 で確認済み。招待制で上限として使えることは品質チェーンへの回答（設計 2-9 と「設計の連鎖が扱うもの」）の入力。「1 回の乗車は 2〜3 回」をデモ 1 回の乗車の数と読んだのは推定（質問 15 は回答なし）
  - id: PC-06
    kind: other
    statement: 公開。デモの URL（Cloud Run のサービスの URL）は、発表、ブログ、動画で、デモの回の最中や前にも示す。URL を知る人は参加者に限られない。アカウントは運営・サポート担当が参加者にだけ作り（招待制）、参加者でない人はログインより先に進めない
    source: context.yaml の制約（2026-11-03。品質チェーンへの回答の設計 2-9）、第 2 段階のレビュー（reviews/2026-11-03-architecture-2.md）の質問 1・2 の回答、FND-27
    basis: stated
