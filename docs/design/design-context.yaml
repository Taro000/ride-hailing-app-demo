# 第 1 段階（requirements-to-architecture-drivers）が書く。更新: 2026-11-02
read_from:
  quality_chain: docs/quality/
  other:
    - 利用者の入力（2026-11-02。技術制約、予算と納期、チームの構成、将来の変更）
    - 第 1 段階の質問 1〜10 の回答（2026-11-02）
    - Stripe の文書（Context7。押さえ、押さえより少ない額の請求、押さえの増額）
technology_constraints:
  - id: TC-01
    statement: TypeScript で書く
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-02
    statement: 画面は React で作る
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-03
    statement: サーバーは Hono で作る
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-04
    statement: 静的な検査は Oxlint、整形は Oxfmt を使う
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-05
    statement: テストは Vitest を使う
    kind: mandated
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: TC-06
    statement: データベースは Turso。デモの環境で使い、データはデモとデモの間も残す。手元では同じ形（libSQL）で動かす
    kind: platform
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 2・9
    basis: confirmed
  - id: TC-07
    statement: 実行環境は GCP Cloud Run。デモの回と、確かめ（NFR-20、NFR-26）のための短い間だけ配備する。手元でも同じ形で動かす
    kind: platform
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 1・2・9
    basis: confirmed
  - id: TC-08
    statement: ふだんは手元の機械で開発する。サーバーを動かすのはデモと開発のときだけで、常時は動かさない
    kind: platform
    source: 利用者の入力（2026-11-02。ローカルだけで完結）、第 1 段階の質問 1・4
    basis: confirmed
  - id: TC-09
    statement: スマートフォンのブラウザの Web アプリだけで、ネイティブアプリは使わない。対象は iOS の Safari だけ。裏に回ると通知と現在地の更新が止まる制約を受け入れ、ドライバーは受付中に前面に開いておく
    kind: platform
    source: context.yaml の制約、QR-42、第 1 段階の質問 10
    basis: confirmed
  - id: TC-10
    statement: 決済は Stripe のテスト環境（サンドボックス）。誰も実際のお金を失わない。約束（SLA、上限）は入力にない
    kind: external-service
    source: context.yaml の制約、第 1 段階の質問 6
    basis: confirmed
  - id: TC-11
    statement: 地図・経路・渋滞の情報は Google Maps Platform の API。使った分の料金と月ごとの無料の枠がある。約束（SLA、上限）は入力にない
    kind: external-service
    source: context.yaml のデータを作るシステム、第 1 段階の質問 6
    basis: inferred
    basis_note: サービスの名前は質問 6 で確認済み。料金の形（使った分の料金と無料の枠）は推定
  - id: TC-12
    statement: 位置情報と画面の点灯のブラウザの機能は、安全な文脈（HTTPS か localhost）でしか使えない
    kind: platform
    source: ブラウザの仕様（入力にない）
    basis: inferred
  - id: TC-13
    statement: TC-01〜05 は必ず使う。足りないところ（画面の自動テストを動かすブラウザ、アクセシビリティの確認、依存の確かめ、入口の代理、地図の表示など）には、ほかの道具やライブラリを足してよい
    kind: mandated
    source: 第 1 段階の質問 3
    basis: confirmed
  - id: TC-14
    statement: CI は GitHub のホストされた CI を無料の枠で使う
    kind: platform
    source: 第 1 段階の質問 9、GitHub のリモート（Taro000/ride-hailing-app-demo）
    basis: confirmed
project_constraints:
  - id: PC-01
    kind: budget
    statement: 個人開発で払える程度。額は未定（C_budget_month）。無料の枠を優先する
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 5
    basis: confirmed
  - id: PC-02
    kind: deadline
    statement: 決まりなし
    source: 利用者の入力（2026-11-02）
    basis: stated
  - id: PC-03
    kind: team
    statement: 一人（個人開発）。サーバーからブラウザへのリアルタイムの送信は作ったことがある。決済の組み込みは初めて。実機は iPhone だけ
    source: 利用者の入力（2026-11-02）、第 1 段階の質問 7
    basis: confirmed
  - id: PC-04
    kind: other
    statement: ログと監視の基盤は自前の最小構成（構造化ログを保存し、集計のスクリプトで数え、チャットなどに知らせる）
    source: context.yaml の運用の事実（2026-11-01 の回答）
    basis: stated
teams:
  - id: TEAM-01
    name: 開発者本人
    owns: すべて（乗客とドライバーの Web アプリ、管理の画面、エンジニアの画面、サーバー、データ、配備と運用）
    basis: stated
anticipated_changes: []   # 将来の変更はない（利用者の入力）。context.yaml の「仮のスタブを最初のデモの前にテスト環境へ差し替える」は、Stripe に決まった（質問 6）ので起きない
stakeholders:
  - id: STK-01
    role: 開発者本人（プロダクトオーナー、開発の責任者、運用を兼ねる）
    concerns:
      - 個人で払える費用（無料の枠を優先）
      - 一人で作り切って動かせること
      - 本物らしい製品として一通りの開発を通す実験になること
    source: 利用者の入力（個人開発、1 人）、context.yaml の目的（第 1 段階の質問 22）、品質チェーンの承認者の候補
    basis: inferred
as_is: null   # 製品のコードも基盤の定義もない。すべて新設
