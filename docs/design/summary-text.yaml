budgets:
  - id: NFR-02
    source: NFR-02
    title: 状態の変化を相手の画面に 5 秒（95%。SLI-02）
    chart:
      unit: 秒
      thresholds: [{v: 5, name: しきい値（5 秒）, tick: 5 秒}]
      axis: {max: 5.3, step: 1}
      rows:
        - label: A 依頼の状態の変化
          sub: 許諾、取り消し、探し直し、迎車の到着。和 3.45 秒、余り 1.55 秒
          segments:
            - {name: 次の追いかけまでの待ち（P_tail）, v: 1.00, k: wait}
            - {name: 追いかけの読み出し（Turso）, v: 0.20, k: own, note: 仮}
            - {name: 相手の選び分けと SSE への書き出し, v: 0.05, k: own, note: 仮}
            - {name: 携帯の回線で端末に届く, v: 2.00, k: ext, note: 入力にない仮の値。実機で測る}
            - {name: 受け取り、描画、表示の時刻の記録, v: 0.20, k: own, note: 仮}
        - label: B 新しい依頼が一覧に出る
          sub: 一覧を丸ごと送る（DEC-51）。和 3.65 秒、余り 1.35 秒
          segments:
            - {name: 次の追いかけまでの待ち（P_tail）, v: 1.00, k: wait}
            - {name: 追いかけの読み出し（Turso）, v: 0.20, k: own, note: 仮}
            - {name: そのドライバーに示してよい依頼の読み出し, v: 0.20, k: own, note: 仮}
            - {name: SSE への書き出し, v: 0.05, k: own, note: 仮}
            - {name: 携帯の回線で端末に届く, v: 2.00, k: ext, note: 入力にない仮の値}
            - {name: 描画と表示の時刻の記録, v: 0.20, k: own, note: 仮}
        - label: C 知らせだけ送り、画面が取り直す
          tag: 退けた案
          rejected: true
          sub: 和 4.70 秒、余り 0.30 秒
          segments:
            - {name: 次の追いかけまでの待ち（P_tail）, v: 1.00, k: wait}
            - {name: 追いかけの読み出し（Turso）, v: 0.20, k: own}
            - {name: SSE への書き出し, v: 0.05, k: own}
            - {name: 携帯の回線で知らせが届く, v: 2.00, k: ext}
            - {name: 一覧の要求の往復（携帯の回線）, v: 1.00, k: ext}
            - {name: 一覧の読み出し（ELM-04 と Turso）, v: 0.25, k: own}
            - {name: 描画と表示の時刻の記録, v: 0.20, k: own}
    text:
      - [測る区間, 状態の履歴の記録の時刻（サーバーの時計）から、ブラウザが示した時刻まで。示した時刻は、サーバーが受けた時刻を上限にする。]
      - [予算の置き方, 直列の区間ごとに、外れてよい 5% を区間の数で分けたパーセンタイルの予算を置く（5 区間なら 99 パーセンタイル）。予算はタイムアウトではない（タイムアウトは DEC-50）。]
      - [関門, 携帯の回線の値は入力になく仮の値。最初のデモの前に、iPhone 2 台と携帯の回線で SLI-02 を測ってから「満たす」と言う（DEC-51）。]
  - id: NFR-03
    source: NFR-03
    title: 最後に届いた位置が 30 秒以内（95%。SLI-03）
    chart:
      unit: 秒
      show_track: false
      thresholds: [{v: 30, name: T_loc_fresh（30 秒）, tick: 30 秒}]
      axis: {max: 42, step: 10}
      rows:
        - {label: 続けて 0 回届かない, sub: 新しい, track: 0, segments: [{name: 届いた位置の間, v: 10, k: ok}]}
        - {label: 続けて 1 回届かない, sub: 新しい, track: 0, segments: [{name: 届いた位置の間, v: 20, k: ok}]}
        - {label: 続けて 2 回届かない, sub: 境目。届くまでの時間の差の分だけ古くなる, track: 0, segments: [{name: 届いた位置の間, v: 30, k: edge}]}
        - {label: 続けて 3 回届かない, sub: 古い, track: 0, segments: [{name: 届いた位置の間, v: 40, k: stale}]}
    text:
      - [送り方, L_send（10 秒）ごとに送り、サーバーが受けた時刻で数える。続けて 1 回届かなくても新しい。]
      - [一回の送信の予算, 次の送信より前に届くこと。遅れた送信は、次の送信と重ならないよう捨てる（IFC-04）。]
      - [守り方, 位置の写しをほかに持たず、配信は 1 秒ごとに最後の位置を読む。]
  - id: NFR-24
    source: NFR-24
    title: 手配の画面の要求が 3 秒を超えるのは 1 時間に 5% まで（入口の時間）
    chart:
      unit: 秒
      thresholds: [{v: 3, name: しきい値（3 秒）, tick: 3 秒}]
      axis: {max: 3.15, step: 0.5}
      mark_name: タイムアウトまで待った最悪
      rows:
        - label: 場所の検索
          sub: 和 1.15 秒（97.5 パーセンタイル）
          segments:
            - {name: ELM-04 の処理（セッションの確かめを含む）, v: 0.15, k: own, note: 仮}
            - {name: Places の候補, v: 1.00, k: ext, note: 入力にない仮の値。タイムアウトは 2 秒}
          mark: {name: タイムアウトまで待った最悪, v: 2.15}
        - label: 場所の候補の位置
          sub: 和 1.15 秒（97.5 パーセンタイル）
          segments:
            - {name: ELM-04 の処理, v: 0.15, k: own, note: 仮}
            - {name: Places の位置と住所, v: 1.00, k: ext, note: 入力にない仮の値}
          mark: {name: タイムアウトまで待った最悪, v: 2.15}
        - label: 見積もり
          sub: 和 1.35 秒（98.33 パーセンタイル）
          segments:
            - {name: ELM-04 の処理（運賃の計算）, v: 0.15, k: own, note: 仮}
            - {name: Routes の経路, v: 1.00, k: ext, note: 入力にない仮の値。タイムアウトは 2 秒}
            - {name: 見積もりの書き込み（Turso）, v: 0.20, k: own, note: 仮}
          mark: {name: タイムアウトまで待った最悪, v: 2.35}
        - label: 手配の確定
          sub: 和 1.80 秒（98.33 パーセンタイル）
          segments:
            - {name: ELM-04 の処理とトランザクション 1, v: 0.20, k: own, note: 仮}
            - {name: Stripe の押さえ, v: 1.50, k: ext, note: 入力にない仮の値。タイムアウトは 2.5 秒}
            - {name: トランザクション 2, v: 0.10, k: own, note: 仮}
          mark: {name: タイムアウトまで待った最悪, v: 2.85}
    text:
      - [数える経路, passenger.places.search、passenger.places.resolve、passenger.estimates.create、passenger.rides.create（入口のログで測る）。]
      - [仮の値, Places、Routes、Stripe の値は入力にない。最初のデモの前の NFR-44 の確かめで測る。]
      - [最悪, タイムアウトまで待っても、どれも 3 秒の内（手配の確定で 2.85 秒）。]
  - id: NFR-25
    source: NFR-25
    title: 乗車の終了から請求の結果の記録まで、どの乗車も 10 秒以内
    chart:
      unit: 秒
      thresholds: [{v: 10, name: しきい値（10 秒）, tick: 10 秒}]
      axis: {max: 13.6, step: 2}
      rows:
        - label: ふだんの最悪
          sub: 9.2 秒（余り 0.8 秒）
          segments:
            - {name: トランザクション 1, v: 0.1, k: own}
            - {name: Stripe の確定（1 回目）, v: 2.5, k: ext, note: 1 回 2.5 秒で切る}
            - {name: 送り直しの待ち, v: 0.5, k: wait}
            - {name: Stripe の確定（2 回目）, v: 2.5, k: ext}
            - {name: 送り直しの待ち, v: 1.0, k: wait}
            - {name: Stripe の確定（3 回目）, v: 2.5, k: ext}
            - {name: トランザクション 2, v: 0.1, k: own}
        - label: Turso も遅いとき
          sub: 13.0 秒。超えるので NFR-25 が知らせる
          segments:
            - {name: トランザクション 1（T_db で止まる）, v: 2.0, k: own}
            - {name: Stripe の確定（1 回目）, v: 2.5, k: ext}
            - {name: 送り直しの待ち, v: 0.5, k: wait}
            - {name: Stripe の確定（2 回目）, v: 2.5, k: ext}
            - {name: 送り直しの待ち, v: 1.0, k: wait}
            - {name: Stripe の確定（3 回目）, v: 2.5, k: ext}
            - {name: トランザクション 2（T_db で止まる）, v: 2.0, k: own}
    text:
      - [見方, どの乗車もなので、パーセンタイルではなく最悪で見る。10 秒の内に結果のない乗車（確かめ中）も超えたと数える。]
      - [経路の上限, T_route_long（20 秒）は、要求の中の最悪 9.35 秒（Turso が遅いと 15.05 秒）より長い。ブラウザは 25 秒で切る。]
  - id: NFR-06
    source: NFR-06
    title: 前日分の突き合わせと履歴の確かめ（8:30 に終わっていなければ知らせる）
    chart:
      unit: 分
      thresholds:
        - {v: 150, name: 知らせの締め（8:30）, tick: "08:30"}
        - {v: 180, name: 終わりの締め（9:00）, tick: "09:00"}
      axis: {clock: "06:00", max: 186, step: 30, unit_label: 時刻}
      rows:
        - label: ジョブが落ちたとき
          sub: 遅くとも 07:35 ごろに知らせが届く（8:30 まで 55 分）
          segments:
            - {name: 一回目（上限 45 分）, v: 45, k: own}
            - {name: やり直し（上限 45 分）, v: 45, k: own}
            - {name: 指標が見えるまで（最大 3 分）, v: 3, k: wait}
            - {name: 知らせ, v: 2, k: wait}
        - label: 処理ごとの上限（一回の中）
          sub: 和 42 分で、一回の上限 45 分の内
          segments:
            - {name: 確かめ中の片付け, v: 5, k: own}
            - {name: Stripe との突き合わせ（FR-55）, v: 15, k: own}
            - {name: 履歴の確かめと毎日の監視, v: 5, k: own}
            - {name: SLI の集計, v: 10, k: own}
            - {name: 保存期間の処理（FR-53）, v: 5, k: own}
            - {name: 期間を終える条件の記録と知らせ, v: 2, k: own}
    text:
      - [ふだん, 乗車は全体で 2〜6 回なので数分で終わる。追いつく日が多いときは、日ごとに同じ順で続ける。]
  - id: NFR-33
    source: NFR-33
    title: 試験用のエラーから 5 分以内に知らせが届く
    chart:
      unit: 秒
      thresholds: [{v: 300, name: しきい値（300 秒）, tick: 300 秒}]
      axis: {max: 315, step: 60}
      rows:
        - label: サーバーのエラー
          sub: 最悪 87 秒
          segments:
            - {name: 1 分ごとにまとめる, v: 60, k: wait}
            - {name: チャットへの送信（5 秒 × 4 回と待ち 7 秒）, v: 27, k: ext}
        - label: ブラウザのエラー
          sub: 最悪 102 秒（通信があるとき）
          segments:
            - {name: 記録の送信（ブラウザのタイムアウト）, v: 15, k: ext}
            - {name: 1 分ごとにまとめる, v: 60, k: wait}
            - {name: チャットへの送信, v: 27, k: ext}

# 要素をまたぐ状態の図に添える注記（図だけでは読めない所だけ）
states:
  配車依頼:
    note:
      - 時刻で出られるのは searching だけ（手配から T_request_max）。accepted と arrived は参加者の操作でしか出ないので、デモを閉じる手順は count-open で止まる。
      - 手配できるかの判定（ACTIVE_RIDE_EXISTS）に数えるのは booking、hold_checking、searching、accepted、arrived、in_progress。
  依頼の支払いの状態:
    note:
      - paid、partially_refunded、unpaid は終わりにしない（まだお金が動きうる）。返金と押さえ直しを確かめている間は今の状態のままで、DAT-13 の操作で追う。
  お金の操作:
    note:
      - 5xx を受けた押さえは、同じキーで送り直しても同じ 5xx が返る。照らして PaymentIntent がなく T_op_stale を過ぎたら not_happened にし、試みの番号を進めた新しい操作で送る（T_hold_wait の内だけ）。
  ドライバーの受付:
    note:
      - 受付中でも、位置が 30 秒より古い間は受付中に数えない。迎車中と乗車中は依頼の状態から決まる（停止しても続く）。
  操作キー:
    note:
      - 処理中のまま止まった操作は、T_op_stale で確かめ中になり、確かめの結果で completed になる。
  設定の符号:
    note:
      - 使った・無効・期限切れの符号では 400 SETUP_CODE_INVALID。符号は設定の後も出し直せ、パスワードの再設定を兼ねる。
  デモの期間と回:
    note:
      - (A) 毎日の処理が片付けられる残り。確かめ中の操作、状態を取り出せる確定も解放もしていない押さえ、T_request_max を過ぎた許諾のない依頼。
      - (B) 許諾の後の終わっていない依頼とその押さえ。残れば待たずに知らせる。

walk_extra:
  groups:
    - after: CUJ-11〜13
      label: CUJ-11〜13 新しい機能の追加、既存の機能の修正、利用技術の版上げ（USR-03）
      rows:
        - [変更を出し、おかしければ戻す, FR-41、42, ELM-06、09、05、17, コミットごとに ELM-06 がゲート（NFR-08・10・11・13・16・22・27・30・31・32・35・37・39・40・42）を通したイメージを ELM-09 に置く。期間を始める手順が運用のジョブで Turso を確かめ、毎日の処理を一度動かす。デモを開く手順が、サービスと二つのジョブを同じイメージで配備し、運用のジョブで構造の変更（足すだけ）と配備の記録を行う。おかしければ前のイメージに戻す。版上げで変わるのは `adapters` の包みか端末のモジュールだけ（DRV-14）。本番に出すまでの時間は、main に入って CI が通るまでで測る。, なし]

# 図の向き（見やすい向きに替える。図の中身は変えない）。鍵は報告書の中の節の道筋
diagram_direction:
  ビュー > 外部との関係: TB
  ビュー > 配置: LR
  ビュー > 情報: TB
  データ: LR
  データ > データの品質の流れ: TB

