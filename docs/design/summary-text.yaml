structure:
  bullets:
    - サーバーは一つ（ELM-04、Node.js の上の Hono）。三つの Web アプリ（ELM-01〜03）の静的なファイル、API、SSE の配信を同じ入口から出す。
    - サーバーは Cloud Run の一つのサービスで、デモの回と確かめの間だけ置く（DEC-02、DEC-06）。
    - 状態は Turso の一つのデータベース（ELM-07）にだけ置き、インスタンスには持たない。
    - 毎日の処理（ELM-05）は同じイメージの別の入口で、Cloud Run のジョブとして動く。デモの期間だけ Cloud Scheduler が毎朝起動する（DEC-05）。
    - 配備は GitHub Actions の手順（ELM-06）だけで行う（DEC-27）。
    - 書き出し、保管からの戻し、システムを終えるときの削除は、開発者の手元の手順（ELM-22）で行う（DEC-28、DEC-36）。

code_rules:
  head: [対象, 規則]
  rows:
    - ["`domain`", 何にも依存しない（入出力を持たない）]
    - ["`application`", "`adapters` を読み込まない。外部サービス、時計、ID の生成の口はここに置き、`adapters` が実装し、`server` と `batch` が組み立てる"]
    - [配車依頼の状態, 書くのは `application` の配車のモジュールだけ（NFR-11）]
    - [座標を持つ表, 読み書きするのは `application` の位置のモジュールだけ（DEC-15）]
    - [Stripe、地図、チャットのライブラリ, 使うのは `adapters` の各包みだけ（NFR-42）]
    - [位置情報と画面の点灯, 使うのは `web-shared` の端末のモジュールだけ]
    - [Stripe の入力部品, 使うのは `web-shared` のカードの入力のモジュールだけ]
    - [Web アプリ, サーバーのコードを読み込まず、`contracts` だけを共有する]
    - ["`tools/maintenance`", 製品のコードを読み込まない（Turso の CLI と暗号化の道具を呼ぶだけ）]

# 各 DEC の中身。tables は節の中の表の順番（0 から）で、載せる表と並び。points は [見出し, 文]
decisions:
  DEC-01:
    tables: [0]
    points:
      - [選んだ理由, 上位の DRV-18（手元と同じ形）と DRV-26（一人・個人の費用）で、一つのサーバーの案が勝つ。]
      - [引き換え, DRV-01 だけは「関数の実行と外部のリアルタイムのサービス」が勝つ。一系統・少人数のデモなので、一つのサービスが一つの障害の単位になることを受け入れる。]
  DEC-02:
    tables: [0]
    points:
      - [得るもの, 版の切り替えと戻し、インスタンスの入れ替えがあっても、進行中の依頼を失わない。]
      - [失うもの, 状態を読み書きするたびにデータベースへ往復する。デモの間は 1 インスタンス分を払う（回 1 回で 10,800 インスタンス秒）。]
      - [最大 1, 参加者 2 人には一つで足りる。上限を一時的に超えて二つ並んでも、状態を持たないので害はない。]
      - [同時の要求の枠, 全体で 80。SSE は一本で最長 30 分枠を使うので、流れは 40 本までにして短い要求に 40 を残す（DEC-21）。]
      - [応答を左右する点, 最大のインスタンスの数、最小 1（立ち上がり）、SSE に使ってよい枠の数。]
  DEC-03:
    tables: [0]
    points:
      - [得るもの, 届かなかった変化はつなぎ直しで埋まる。配信のもとが状態の履歴なので、記録した変化は必ず配られる。送り続ける仕組みは作った経験がある。]
      - [出どころ, 状態の履歴とドライバーの受付の記録を通し番号で追い、迎車中・乗車中の相手の位置と到着予定は今の値を 1 秒ごとに読む（DEC-51）。]
      - [失うもの, インスタンスごとに 1 秒に 3 回読む（回 1 回で 32,400 回）。流れは 30 分ごとにつなぎ直す。]
      - [応答を左右する点, 追いかけの間隔 P_tail、生存確認の間隔、iOS の Safari で前面に戻ったときのつなぎ直し。]
      - [引き換え, 電池（生存確認の通信）、Turso の使用量、短い要求にも 3,600 秒の要求のタイムアウトがかかること（上限はサーバーの中に置く。DEC-33）。]
  DEC-04:
    tables: [0]
    points:
      - [得るもの, 見回りと操作が同時に同じ変化を起こしても一度だけ効く。時計を差し替えれば、実時間を待たずに確かめられる（DEC-25）。]
      - [失うもの, 見回りのためにインスタンス単位の課金が要る。見回りはサービスの中でしか動かないので、消す前に確かめ中を 0 件にし（DEC-37）、消した後の残りは毎日の処理が片付ける。]
      - [T_request_max, 手配から 30 分（仮）を過ぎた許諾のない依頼は、見回りがシステムの取り消しとして終え、押さえを解放し、料金を取らない。許諾とぶつかっても一方だけが効く。サービスが消えた後の分は翌朝の毎日の処理が取り消す。]
      - [T_hold_wait, 押さえの結果が分からない手配と降車場所の変更は、見回りが 60 秒まで Stripe の状態を確かめ、分からなければやめる（DEC-52）。]
  DEC-05:
    tables: [0]
    points:
      - [しくみ, サーバーと同じイメージを Cloud Run のジョブとして動かし、デモの期間だけ Cloud Scheduler が毎朝 06:00 に起動する。期間を始める手順は Turso が答えるかを確かめ、定時の起動を通して一度動かす。]
      - [続き, 日ごとの終わりの記録を持ち、終わっていない日をすべて続ける。終えたと記録できないときと知らせを送れないときは、失敗として終わる（DEC-17 の規則が拾う）。]
      - [期間の終わり, DEC-37 の条件を満たしたら、毎日の処理が自分で定時の起動と二つ目の規則を止める。]
      - [得るもの, 翌朝に突き合わせと知らせが終わり、NFR-06 の 8:30 まで 2 時間 30 分ある。ジョブが落ちても 07:35 ごろに知らせが届く。秘密とログを GCP の中に置ける。]
      - [失うもの, 期間の外は保存期間の処理（FR-53）と NFR-41 の監視も止まり、次の期間の最初の実行で追いつく。最後の期間の後は DEC-36。]
      - [持ち主の例外, 毎日の処理は、サーバーと同じモジュールのコードでサーバーの表（支払いの状態、履歴の匿名化）を書く。]
  DEC-06:
    tables: [0]
    points:
      - [失うもの, 回ごとに作って消す手順を動かす。回をまたぐ戻しはイメージを配備し直す。消し忘れると最小 1 のインスタンスが動き続ける（毎日の処理と期間を終える手順が知らせ、GCP の予算の知らせも置く）。]
      - [消す前の確かめ, 終わっていない依頼と確かめ中のお金の操作がないと確かめてから消す（DEC-37）。]
      - [前提, サービスの決まった形の URL は作り直しても変わらない。地図の鍵の参照元、パスキーの RP ID、クッキーがこれに頼る。]
  DEC-07:
    tables: [0]
    points:
      - [前提, Turso に東京の地域（AWS の ap-northeast-1）がある。]
  DEC-08:
    tables: [0]
    points:
      - [失うもの, Turso の障害でシステム全体が止まる（Turso の約束は入力にない）。]
      - [トランザクション, Turso は書き手が一つなので、外部の呼び出し（Stripe、地図、チャット）をまたがず短く書く。お金の操作は「キーと処理中を書く・Stripe を呼ぶ・結果と状態と履歴を書く」の三つに分ける（DEC-12）。]
      - [前提, 無料の枠では 10 日使われないデータベースが保管に回る。期間の間は毎日使うので回らない。期間を始める手順が答えるかを確かめ、回っていれば手元で戻す。]
  DEC-09:
    tables: [0]
    points:
      - [応答を左右する点, 割り当ての条件（しきい値、受ける条件、停止、迎車中・乗車中でないこと）を、書き込みと同じトランザクションで確かめ直すこと。]
  DEC-10:
    tables: [0]
    points:
      - [しくみ, 手配のときに確定した料金で押さえ、乗車の終わりに確定する。キャンセル料と不在の料金は押さえから 500 円だけを確定し、残りを解放する。無料の取り消し、システムの取り消し、手配や変更をやめたときの押さえは取り消す。Webhook は使わない。]
      - [Stripe に送るもの, 個人の情報は内部の ID だけ。顧客にはアカウントの ID、メタデータには依頼とお金の操作の ID だけを入れ、メールアドレスと名前は送らない。カードの入力部品も請求先の情報を集めない。]
      - [応答を左右する点, 押さえの期限（既定で 7 日）。確定はデモの最中に済ませ、残りは毎日の処理が確かめる。]
      - [前提, Stripe のアカウントは日本で、請求は円。]
  DEC-11:
    tables: [0]
    points:
      - [料金が下がるとき, 新しい額で押さえ直す。できなければ古い押さえのまま、下がった額だけを確定する。]
      - [結果が分からないとき, 降車場所を変えずに「確かめています」と示し、乗客は取り消せる。T_hold_wait までに押さえたと分かれば変え、分からなければ変えずに新しい押さえを解放する。古い押さえは残さない。]
      - [応答を左右する点, 押さえ直しで本人の確かめ（3D セキュア）を求められると失敗し、降車場所は変わらない（FR-12 AC4）。]
      - [先送り, 押さえの増額は、Stripe がこのアカウントで使えるようにしたときに考え直す。]
  DEC-12:
    tables: [0, 1]
    captions: {1: お金の操作ごとのキー}
    points:
      - [(a) 操作キー, お金を動かす操作はすべて画面がキーを作り、送り直しでも同じキーを使う。サーバーは処理中を書き、Stripe を呼んだ後に結果と最初の結果を書く。同じキーの二度目には、最初の結果か「処理中」を返す。]
      - [(b) Stripe へのキー, 一度だけ起きるべきお金の操作そのものから決め（上の表）、操作の ID をメタデータにも入れる。返金は返金の要求ごとなので、同じ依頼に何度返金しても重ならない。]
      - [(c) 応答がないとき, 要求の中では同じキーでだけ送り直し、やり直すのは降車のときの確定だけ。5xx は送り直さず確かめ中にする。処理中のまま T_op_stale（30 秒）を過ぎた操作も確かめ中にする。]
      - [(d) 確かめ中の片付け, 見回りと毎日の処理が Stripe の状態を取り出して照らす。起きていれば記録し、起きていなければ同じキーか、試みの番号を進めた新しいキーで送る。]
      - [失敗と分かった後, 未払いの払い直しと返金のやり直しは新しいキーで送る。結果が分からないときは同じキーのまま確かめる。]
      - [値, Stripe は 1 回 2.5 秒で切る（仮）。手配の確定は最悪 2.85 秒で NFR-24 の 3 秒の内。降車のときの確定は最悪 9.2 秒で NFR-25 の 10 秒の内（Turso も遅いと 13.0 秒になり、知らせが出る）。]
      - [応答を左右する点, Stripe のタイムアウトと正常なときの応答時間の差。正常でも遅い押さえを切ると、結果の分からない押さえが増える。]
  DEC-13:
    tables: [0]
    points:
      - [前提, 押さえ、確定、返金、未払いの支払いに依頼の ID をメタデータとして付け、一覧から依頼ごとに集める。]
      - [比べ方, 未払いの支払い（自動で確定する PaymentIntent）もその依頼の請求として数える。成功した支払いは一つで、失敗した試みは数えない。]
  DEC-14:
    tables: [0]
    points:
      - [失うもの, 参加者 1 人あたり 1 時間に 720 行を書く。]
      - [裏に回った時刻, 裏に回るときに送り、届かなければ前面に戻ったときに送り直す。後から届いた分は、アラートと毎日の SLI-03 の両方で除き直す。]
      - [最後の位置を消すとき, 乗客の分は示すのをやめるとき（乗車の開始か依頼の終わり）、ドライバーの分は受付を止めたとき。]
  DEC-15:
    tables: [0, 1]
    captions: {1: 座標を持つ表と読める相手}
    points:
      - [読み書きする所, 座標の表は位置のモジュールだけが読み書きし、依存の規則を CI で確かめる。役割と相手の確かめはそこで一度だけ行う。]
      - [位置を持つ変化, 場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）だけ。現在地を得られなかったときは、得られなかった印を持つ。]
      - [苦情の調べ, 位置の受信の記録を、T_log_retention の間、記録した位置として示す。]
  DEC-16:
    tables: [0]
    points:
      - [役目の分け方, ログの保存は Cloud Logging、数えるのと知らせるのは自前（DEC-05、DEC-17）。]
      - [SLI-01, テスト用アカウントは、入口のログとアプリのログをトレース ID で結んで除く。]
      - [アラートのための数え, サーバーが SLI-01 の六つの操作の応答を 1 分ごとに数え、SLI-03 の確かめを毎分 0 秒に行って Turso に書く。アラートだけに使い、毎日の SLI-01 は入口のログから数える。]
      - [毎日の SLI-03, 毎日の処理が受信、受付、状態、裏の記録から確かめ直す。サーバーが確かめられなかった間も、受信がなければ新しくないと数える。]
      - [URL の決まり, URL には位置、連絡先、名前、検索の語を入れない。入口のログは URL をそのまま残すので、守る手立てはこれしかない。]
      - [前提, Cloud Logging の既定の保持は 30 日で、T_log_retention（28 日、仮）より長い。]
  DEC-17:
    tables: [0]
    points:
      - [二つの規則, 一つ目はサーバーが数えられないもの（アプリが止まったとき、Turso に届かないか遅いとき、入口が返した 5xx と 429）を見る。入口とアプリは指標で分けられないので、まとめて数える。二つ目は毎日の処理のジョブの失敗を見る。]
      - [送る順, サーバーの知らせは送ってから記録を書く。記録を書けなくても送り、記録は構造化ログに残す。]
      - [ジョブは黙って成功しない, 終えたと記録できないときと知らせを送れないときは、失敗として終わる。起動した後の落ち方は、どれも二つ目の規則が拾う。]
      - [時間, ジョブの一回の上限は 45 分、やり直しは 1 回。遅くとも 07:30 に終わるか失敗し、知らせは 07:35 ごろ。NFR-06 の 8:30 まで 55 分ある。]
      - [拾えないもの, 定時の起動そのものが止められているとき（負債）。期間を始める手順が、定時の起動を通して一度動かして確かめる。]
  DEC-18:
    tables: [0]
    points:
      - [応答を左右する点, Cloud Run の入口の要求のログに同じトレース ID が残る見出しの形（DEC-44）。]
      - [先送り, OpenTelemetry は CUJ-10 を重視に上げるときに考える。]
  DEC-19:
    tables: [0]
    points:
      - [技術的負債, FR-40 AC1 の「履歴とログを時刻順に一つに示す」は、二つの画面に分かれる。]
  DEC-20:
    tables: [0, 1]
    captions: {1: ログインの止め方}
    points:
      - [アカウントの作り方, 運営・サポート担当が参加者にだけ作る（招待制）。本人は一度だけ使える設定の符号でパスワードを決める。符号は出し直せ、出し直すと前の符号は使えない。決め直すとほかのセッションを終える。]
      - [設定の符号, 推し量れない長さの乱数を、元に戻せない形で期限（24 時間）とともに持つ。入口に IP ごとの回数の制限を置く。]
      - [止める単位, アカウントと IP の組で止める（上の表）。本人を締め出させない代わりに、多くの IP からの総当たりは IP の数だけ試せる（残る危険）。管理とエンジニアの役割はパスキーも求める。]
      - [応答を左右する点, 失敗の上限、止める長さ、止める単位。クッキーは HttpOnly、Secure、SameSite にし、状態を変える要求では送り元も確かめる。]
      - [前提, パスキーとクッキーは、サービスの決まった形の URL に結び付く。名前かプロジェクトを変えると、パスキーは登録し直す。]
      - [候補, ライブラリは Better Auth（第 4 段階で決める）。]
  DEC-21:
    tables: [0]
    points:
      - [上限, デモの外はサービスがない。Cloud Run は最大 1。SSE はログインした人だけで、アカウントごと 2、IP ごと 6、全体 40。地図は API ごとに 1 日 1,000 回。サーバーの鍵は外に出さず、ブラウザの地図の鍵はログインした人にだけ渡す。回数の制限（値は DEC-55）、ログインの一時の停止、GCP の予算の知らせ。]
      - [選んだ理由, 招待制では参加者を先に通す仕組みが働く場面がないので外す（DRV-26）。多くの IP からの攻撃には Cloud Armor が勝つが、月の費用がかかる。]
      - [残る危険, 多くの IP から、ログインより前の入口に大量の要求が来て同時の要求の枠が埋まると、その回の間デモが止まる。費用は最大のインスタンスで縛られ、運用者はデモを閉じて止められる。]
  DEC-22:
    tables: [0]
    points:
      - [呼ぶ場面, 経路は見積もり、依頼の内容、許諾、運転の開始、降車場所の変更で一度ずつ。到着予定は 60 秒ごとにだけ取り直す。一覧、受ける条件、近くの数は直線の距離で判定する。回 1 回で多くて 198 回。]
      - [1 日の上限, Google Cloud の API ごとの割り当て（Q_maps_day）に任せ、達したら決まった扱いに移る。]
      - [値, 呼び出しは 2 秒で切り、要求の中ではやり直さない（NFR-24 の 3 秒に 0.9 秒の余り）。]
      - [前提, 内容をためておく規約は、経路と地点を依頼の間だけ持てば守れる（確かめは未解決）。]
  DEC-23:
    tables: [0]
    points:
      - [得るもの, 同じ入口から配るので、クッキーで認証でき、CORS が要らない。]
      - [エラーの記録, 入力欄の値を入れない（DRV-32）。]
  DEC-24:
    tables: [0]
    points:
      - [地図の操作の代わり, 場所の検索で選ぶ、ピンをボタンで少しずつ動かす、現在地を使う。]
      - [候補, 部品のライブラリは React Aria（第 4 段階で決める）。]
  DEC-25:
    tables: [0]
    points:
      - [CI の Stripe, デモとは別のサンドボックスにし、その制限付きの鍵だけを GitHub の秘密に置く。フォークからの pull request の手順には渡さない。]
      - [差し替える口, "`packages/application` に置き、偽物も本物の包みもそれを実装する（DEC-26）。"]
  DEC-26:
    tables: [0]
    points:
      - [依存の向き, "外部サービス、時計、ID の生成の口は `application` に置き、`adapters` が実装し、`server` と `batch` が組み立てる。`application` は `adapters` を読み込まない。"]
      - [閉じ込め, 座標を持つ表を読み書きするのは位置のモジュールだけ。手元の保守の手順は製品のコードを読み込まない。]
  DEC-27:
    tables: [0]
    points:
      - [手順, main への変更ごとにゲートを通ったイメージを作る。手順はデータベースの資格情報を持たず、データベースに触れる段（構造の変更、配備の記録、閉じる前と終える前の数え、Turso の確かめ）は運用のジョブで動かして、終わりの符号を読む。]
      - [開け閉め, 期間を始める、デモを開く、デモを閉じる、戻す、期間を強いて終える、システムを終える、の手順を持つ。デモを開くときに構造の変更を当て、サービスと二つのジョブを同じイメージにする。閉じるのは、終わっていない依頼と確かめ中が 0 件のときだけ。]
      - [同じイメージ, ジョブとサービスは同じ表を書くので、版を一緒に替える。配備の記録が指すイメージ（今と一つ前）は消さない。]
      - [構造の変更, 「足す、使う、古いものを外す」を二つの版に分け、一つ前の版のテストを新しい構造で動かす（NFR-35）。]
      - [連携, GCP へは鍵を置かない連携で入り、使えるのは main の枝の手順だけ。]
      - [残る危険, 配備できる者は、データを読むコードも配備できる。手順の外部のアクションはコミットで固定し、配備はゲートを通ったダイジェストだけにし、記録に残す。]
  DEC-28:
    tables: [0]
    points:
      - [書き出し, デモの回の終わりに、開発者が手元の手順で `.dump` を取り、その場でパスフレーズで暗号化して置く。平文は残さず、最新の二つまで。システムを終えるときにすべて消す。]
      - [復元, 書き出しを新しいデータベースに読み込み、接続先を替えて配備し直す。]
      - [機械をなくしたとき, 書き出しは暗号化されていて読めない。Turso の元のデータと 24 時間の復元は残る。]
      - [前提, 障害の多くはデモの最中か翌朝の毎日の処理で見つかり、24 時間の内に入る見込み。]
  DEC-29:
    tables: [0]
    points:
      - [確かめる点, あり得ない速さの飛び、誤差の不自然な値、到着の位置とそれまでの道筋の食い違い。]
      - [扱い, 疑わしい到着に印を付けるが、料金は規則どおり取る。運営・サポート担当が毎日の一覧（NFR-45）を見て、偽りなら返金する。自動で無料にすると、誤って印が付いたときにドライバーが正しい料金を失う。]
      - [残る危険, 一貫した偽りの道筋は見分けられない。担当が一覧を見落とすと返金されない（利用者が受け入れた）。]
  DEC-30:
    tables: [0]
    points:
      - [しくみ, 運転の開始は、担当のドライバーのアカウントであることと確認コードの一致を、書き込みと同じトランザクションで確かめる。乗客の画面はその記録を受けたときだけ乗車中にし、自分で先に変えない。]
      - [乗客への案内, 迎車中に、確認コードを伝えて画面が乗車中に変わってから乗るよう示す。]
      - [応答を左右する点, 迎車中の乗客の流れを前面にある間は保ち、切れたらつなぎ直して取り直すこと（切れていると、正しい車でも画面が変わらない）。]
      - [残る危険, 乗客が画面を確かめずに乗ると防げない（利用者が受け入れた）。]
  DEC-31:
    tables: [0]
  DEC-32:
    tables: [0]
    points:
      - [足す道具, 画面の組み立ては Vite、画面の自動テストは Playwright、アクセシビリティの確かめは axe、依存の確かめは dependency-cruiser（候補）。構造の変更と書き出しの暗号化の道具は第 4 段階で決める。]
  DEC-33:
    tables: [0, 1]
    captions: {1: 経路の上限の決め方}
    points:
      - [しくみ, SSE 以外の経路は、上限を過ぎたら 503 と決まった符号を返す。ふだんは T_route（10 秒）、乗車の終了と降車場所の変更の確定だけ T_route_long（20 秒）。Turso の呼び出しは 1 回 T_db（2 秒）で切る。]
      - [切った後, 進めていたお金の操作は止めない。結果は操作キーに残り、同じキーで送り直すと受け取れる。]
      - [値の決め方, どの経路も、要求の中で待つ最悪（Turso が遅いとき）より上限を長くする。T_route は Stripe を一度呼ぶ操作の最悪 8.55 秒より、T_route_long は乗車の終了の 15.05 秒より長い。]
      - [引き換え, 乗車の終了と降車場所の変更の確定は、待たされると最長 20 秒、同時の要求の枠を一つ使う。]
  DEC-34:
    tables: [0, 1]
    captions: {1: 使うものごとの資格情報}
    points:
      - [選んだ理由, 上位の DRV-18・26 は四つの案とも同じに満たし、DRV-29 で使うものごとに分ける案が勝つ。公開のリポジトリの CI に、データを読める資格情報がない。]
      - [Turso のトークン, 期限を付けない（期間の途中で切れるとジョブが落ちる）。一つずつは無効にできないので、漏れを疑ったらまとめて無効にし、三つとも作り直す。]
      - [残る危険, 配備できる者は、サービスアカウントで動くコード（データを読むコードも）を配備できる。]
  DEC-35:
    tables: [1, 0]
    captions: {0: この規模で見分けるか}
    points:
      - [作る理由, 第 1 段階の質問 13 で「NFR の量を受け入れ、品質チェーンは直さない」と決まったので、NFR-01〜03 のアラートを今の形のまま作る。]
      - [しくみ, サーバーが毎分 0 秒に SLI-03 の確かめを行い、SLI-01 の六つの操作の応答を 1 分ごとに数え、アラートの表（窓、バーンレート、N_alert_min）に従って燃える速さを数える。条件を満たしたら DEC-17 の道で送る（呼び出しは急ぐ印、チケットは急がない印）。]
      - [見分けるもの, この規模で見分けるのは位置の新しさ（NFR-03）だけ。NFR-01 はサーバーのエラー 1〜3 件で鳴り、FR-36 の知らせと重なる。NFR-02 はふつうの乗車だけなら鳴らない（下の表）。]
      - [数えられないもの, アプリが止まったとき、Turso に届かないとき、入口だけで起きた失敗は、DEC-17 の一つ目の規則が見る（最初の 503 から 4〜5 分）。]
      - [後から届いた裏の記録, 届いたときにその間の確かめを除き直し、条件が外れれば外れたと送る。]
      - [二つのインスタンス, 確かめとアラートは条件付きの書き込みで一度だけにする。]
      - [費用, 読み出しは回 1 回で多くて 1,080 回（追いかけの読み出しの 3%）。]
  DEC-36:
    tables: [0]
    points:
      - [しくみ, 最後の期間を終えるとき、配備の仕組みがジョブ、定時の起動、規則、秘密、地図の鍵を消し、開発者が手元の手順で Turso のデータベースと書き出しを消す。最後に Stripe のダッシュボードでデモと CI のサンドボックスを消す。]
      - [Stripe に残るもの, 送るのは内部の ID だけなので誰にも結び付かないが、要求の記録（IP アドレスなど）が残りうるので、サンドボックスごと消す。]
      - [扱い, 機能ではなく、インフラの片付けとして扱う（DEC-06 と同じ種類の手順）。]
      - [残る危険, 最後の期間を「最後」と決めずに終えると、この手順は動かず、個人情報が残る。気づかせる仕組みはない。]
  DEC-37:
    tables: [0]
    points:
      - [デモを閉じる, 運用のジョブで終わっていない依頼と確かめ中の操作を数え、あれば止まる。最後の回を閉じるときは「最後の回」と記録する。]
      - [期間の終わり, 毎日の処理が毎朝、残りを (A) と (B) に分けて記録する。最後の回が閉じられ、(A) も (B) も 0 件なら、自分で定時の起動と二つ目の規則を止める。]
      - [(A) 毎日の処理が片付けるもの, 確かめ中の操作、状態を取り出せる確定も解放もしていない押さえ、T_request_max を過ぎた許諾のない依頼（システムの取り消し）。残れば次の実行で続ける（延びるのは 1〜2 日）。]
      - [(B) 参加者でしか片付かないもの, 許諾の後の終わっていない依頼とその押さえ。残れば待たずに毎朝知らせる。残るのは、閉じる手順を強いて進めたときだけ。]
      - [残る危険, 強いて閉じた・終えたときに残った押さえは、次の期間がなければ誰も確かめない。]

viewpoints:
  items:
    - [並行性, 割り当ては条件付きの書き込みと一意の制約で一人だけにする（DEC-09）。二度の送信は操作キーで一つにする（DEC-12）。時刻で起きる変化も条件付きなので、見回りが重なっても一度だけ効く（DEC-04）。インスタンスは状態を持たない（DEC-02）。Turso は書き手が一つなので、トランザクションは外部の呼び出しをまたがず短くする（DEC-08）。経路を切った後も続く操作には、T_op_stale を過ぎるまで見回りが手を出さない（DEC-12）。]
    - [制御とイベント処理, 画面の操作は要求で動き、変化は状態の履歴の追いかけで配る（DEC-03）。期限は時刻で持ち、操作と 5 秒ごとの見回りで判定する（DEC-04）。毎日の処理はデモの期間だけ毎朝動き、動かなかった日を続ける（DEC-05）。遅れて届く・二度届く出来事は通し番号と操作キーで一度だけ扱い、予期しない出来事は状態遷移表で拒む（DEC-03、DEC-09、DEC-12）。閉じる前と期間を終える前に、終わっていない依頼と確かめ中を確かめる（DEC-37）。]
    - [データの永続化, Turso 一つに置き、一つのトランザクションで書き、履歴は追記だけ（DEC-08）。座標は三つの表に分け、位置のモジュールだけが読む（DEC-15）。24 時間の復元と、手元に暗号化した書き出し（DEC-28）。構造の変更は二つの版に分ける（DEC-27）。保存期間は毎日の処理と Cloud Logging の保持で守り、最後はシステムを終える手順で消す（DEC-05、DEC-16、DEC-36）。]
    - [分散, 東京に置く（DEC-07）。インスタンスの増減と入れ替えには、状態を持たないことで備える（DEC-02）。回線の切れには、つなぎ直しと最新の状態の取り直しで備える（DEC-03）。外部の呼び出し、Turso の呼び出し、経路ごとに上限を置く（DEC-12、DEC-22、DEC-33）。SSE の流れの本数を限り、短い要求の枠を残す（DEC-21）。]
    - [エラー処理と障害許容, 結果が分からないお金の操作は、要求の中では同じキーでだけ送り直し、要求の外で確かめてから送る（DEC-12）。待たされた要求は失敗として返す（DEC-33）。地図の失敗は決まった扱いに移る（DEC-22）。知らせはサーバーと Cloud Monitoring の二つの道で送る（DEC-17、DEC-35）。請求と返金は黙って失敗させず、未払いか確かめ中として残し、翌朝の突き合わせで拾う（DEC-13、DEC-37）。]
    - [統合と相互運用, Stripe は押さえ、確定、一覧の取り出しで使い、Webhook は使わない（DEC-10、DEC-13）。地図はサーバーの一つのモジュールから呼ぶ（DEC-22）。外部サービスの口は application に置き、adapters が実装する（DEC-26）。API の型は画面とサーバーで共有する（DEC-26）。URL に個人情報を入れない（DEC-16）。]
    - [保証・セキュリティ・安全, 「脅威のモデル」と DEC-10、15、16、20、21、23、29、30、31、34。安全では、走行中の操作の制限をドライバーの画面とサーバーの規則で行う（FR-21）。人に害が及びうるのはドライバーを装う人で、確認コードと乗客の画面の乗車中で備える（DEC-30）。乗客が画面を確かめずに乗る危険は受け入れた。]
    - [可変性, 標準のやり方で足りる。市場は日本と円、ブラウザは iOS の Safari だけで、テナントはない。環境の違いは設定で吸収し（DEC-32）、しきい値は一つの設定のモジュールに置く。]

threat:
  assets:
    - アカウントとセッション、設定の符号
    - 請求額と受取額
    - 他人の依頼と乗車
    - 位置情報と乗車の記録（個人情報）
    - データベースの書き出し（全員の個人情報）
    - 管理の操作
    - 料金の根拠になる到着と位置の記録
    - 乗客が手配した車を見分けること
    - 公開した入口とその費用
    - 秘密（Stripe の鍵、地図の鍵、Turso のトークンと開発者の Turso のログイン、チャットの Webhook の URL）
  kinds:
    - [なりすまし, ほかの人のふりをする]
    - [書き換え, 通信中か保存中のデータを変える]
    - [否認, した操作を後で否定する]
    - [漏えい, 見てはいけない人に見える]
    - [妨害, わざと止めるか遅くする]
    - [権限の奪取, 持つべきでない権限を得る]
    - [—, 当てはまらない（理由を括弧に添える）]
