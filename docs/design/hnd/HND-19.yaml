id: HND-19
title: ELM-03 の値のうち、時間のしきい値の SLO とお金の道にないもの
status: open
basis: inferred
basis_note: 時間のしきい値の SLO とお金の道にない値は、第 3 段階が枠だけを決め、値は第 4 段階の ELM-03 の実行が決める（DEC-46）。Web Push の配信が SLI-14 の数えから外れる画面に出ていない相手への知らせであることは IFC-21
premises: []
from: architecture-to-high-level-design
to: high-level-design-to-detailed-design
component: ELM-03
origin: [IFC-01, IFC-02, IFC-03, IFC-04, IFC-06, IFC-08, IFC-09, IFC-10, IFC-11, IFC-12, IFC-14, IFC-15, IFC-16, IFC-21]
what: 時間のしきい値の SLO とお金の道にない ELM-03 の値。IFC-01、IFC-02、IFC-03 の今の状態と乗車の開始と到着の確認と降りる場所の変更の見積もり、IFC-04 の受付の切り替えと一覧と依頼の選択、IFC-06、IFC-08、IFC-09 の履歴と苦情、IFC-10、IFC-12、IFC-14 の操作に ELM-03 が答える期限。Web Push を送る呼び出しのタイムアウト、送り直しの回数と間隔、TTL（IFC-21）。流れで送った出来事の示した時刻を待ってから Web Push でも知らせるまでの待ち（IFC-11）。Cloud Scheduler の日々の呼び出しの期限と再試行の回数と間隔（IFC-15）。生存確認のタイムアウト、間隔、知らせるまで続けて失敗する回数（IFC-16）
bounds: DEC-46（呼ぶ側のタイムアウトは呼ばれる側の最悪の待ちより長い）、DEC-13（EXT-02 のタイムアウトの順）、HND-07（EXT-02 の呼び出し）、HND-10（異常とみなす条件と監視の間隔、終えた記録を待つ時間）、各 IFC の timing の枠。流れの後の Web Push の待ちは、ふだんの示した時刻の報告が届くまでより長くする
trigger: 第 4 段階の ELM-03 の実行
resolution: null
