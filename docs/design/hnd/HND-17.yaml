id: HND-17
title: ELM-01 の呼び出しのうち、時間のしきい値の SLO とお金の道にないもののタイムアウト
status: open
basis: inferred
basis_note: 時間のしきい値の SLO とお金の道にない呼び出しは、第 3 段階が枠だけを決め、値は呼ぶ側のコンポーネントを設計する第 4 段階が決める（DEC-46）。ELM-01 の時間のしきい値の SLO とお金の道の上の呼び出しの値は、各 IFC の timing にある
premises: []
from: architecture-to-high-level-design
to: high-level-design-to-detailed-design
component: ELM-01
origin: [IFC-01, IFC-02, IFC-03, IFC-04, IFC-06, IFC-08, IFC-09, IFC-10, IFC-18, IFC-20, IFC-22, IFC-23]
what: ELM-01 が、ELM-03 の操作（IFC-01、IFC-02、IFC-03 の今の状態と乗車の開始と到着の確認と降りる場所の変更の見積もり、IFC-04 の受付の切り替えと一覧と依頼の選択、IFC-06、IFC-08、IFC-09 の過去の乗車と苦情、IFC-10）と、EXT-01 の入力部品（IFC-18）と、地図を描く部品（IFC-20）を待つタイムアウトの値。端末が報告（流れで受けた変化を示した時刻の報告を除く）をためる長さと送る間合い。画面の細部の時間（IFC-22、IFC-23）
bounds: DEC-46（呼ぶ側のタイムアウトは、呼ばれる側の答えの期限に通信の余裕を足したものより長い）、DEC-08（タイムアウトの順と、同じ冪等キーでの送り直し）、DEC-43（送り直しの別、X-Resend）、IFC-10（流れで受けた変化を示した時刻の報告はためずにすぐ送る）、HND-19（ELM-03 の答えの期限）、HND-07（EXT-02 の呼び出し）、各 IFC の timing の枠
trigger: 第 4 段階の ELM-01 の実行
resolution: null
