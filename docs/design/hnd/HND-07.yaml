id: HND-07
title: EXT-02 への呼び出しの時間切れとやり直し
status: open
basis: inferred
basis_note: DEC-13 の応答を左右する点。時間のしきい値の SLO とお金の道にないため、第 4 段階の ELM-03 の実行に送る
premises: [EXT-02]
from: architecture-drivers-to-architecture
to: implementation
component: ELM-03
origin: [DEC-13]
what: EXT-02 への場所の候補、住所、道と移動時間の呼び出しの時間切れと、やり直しの回数と間隔の値
bounds: DEC-13（時間切れの順、EXT-02 の失敗は確定した依頼と乗車を止めない）、QR-07 と NFR-17（T_quote_response）、NFR-09、QR-65
trigger: MOD-40（EXT-02 のつなぎ口）を実装するとき
resolution: "第 4 段階の ELM-03 の実行が実装に送った。EXT-02 の呼び出しは枠の深さの MOD-40 の中にあり、どれも読むだけで外部の状態を変えず、時間のしきい値の SLO とお金の道になく、値は運用の中で直せる（影響の広さと重大さはどちらも低）。この段階が足した枠は MOD-40 と MOD-20 にある。一つの操作の EXT-02 の呼び出しはやり直しを含めて 6 秒のうちに諦め（MOD-20 の EXT-02 を呼ぶ操作の答えの期限 8 秒に収める）、着く見込みを求め直す呼び出しは IFC-19 の 8.5 秒のうちに諦める（MOD-50）。どちらも呼ぶ側が渡す期限で切り、その後にやり直さない（MOD-40）"
