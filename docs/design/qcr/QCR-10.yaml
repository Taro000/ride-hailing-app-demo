id: QCR-10
title: 迎車の到着を決める前に乗車が始まった依頼を、迎車が乗車場所に到着した依頼として数えるか
status: open
stage: 3
targets: [QIU-01, QIU-03, QIU-08, QIU-09, QIU-15, KPI-01, KPI-02, KPI-03]
origin: [DAT-07, DAT-09, IFC-03]
issue: FR-27 の 1 と FR-12 の 2 は、確かめの手がかりが一致すれば乗車を始めるとし、迎車の到着を条件にしない。そのため設計は、迎車の到着を位置で決める前（迎車の位置が乗る場所から D_pickup_position_gap のうちに入ったことを ELM-03 が受ける前。位置の確からしさが悪いときや、乗る場所から少し離れて止めたとき）でも、確認コードが合えば乗車を始める（DAT-07、IFC-03）。そうした依頼には迎車の到着の時刻がなく、FR-10 の知らせも、FR-45 の記録の迎車の到着の段階もない（設計は起きていない段階と読み、QR-15 と NFR-14 の欠けには数えない、DAT-09）。QIU-01、QIU-03、QIU-08、QIU-09、QIU-15 の測定量と KPI-01〜KPI-03 は「迎車が乗車場所に到着した依頼」を数えるが、その前に乗車が始まった依頼をそれに含めるかと、時刻を使う QIU-03 と QIU-09 でどう扱うかを述べていない。設計は、どの依頼にも乗車を始めた時刻と位置を、迎車の到着を位置で決めた依頼にはその時刻を記録する
suggestion: 「迎車が乗車場所に到着した依頼」に、迎車の到着を決める前に乗車が始まった依頼を含める（乗客が乗ったので、迎車は乗る場所に来ていた）と書く。時刻を使う QIU-03 は、そうした依頼では迎車の到着の時刻に代えて乗車を始めた時刻を使い、QIU-09 はそうした依頼を分子と分母から外す。ほかの扱いを採るなら、それを書く
quality_stages: [1]
impact: low
impact_note: 設計はどの依頼にも乗車を始めた時刻と位置を、迎車の到着を位置で決めた依頼にはその時刻を記録するので、どの数え方でも同じ記録（DAT-07、DAT-09）から数えられ、答えでインタフェース、記録、状態は変わらない。答えが来るまで、設計は FR-27 のとおりに乗車を始める
answer: null
answered_in: null
