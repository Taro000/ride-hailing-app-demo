id: QCR-09
title: 模す運賃の定めの中身（料金を求める決まり）
status: open
stage: 4
targets: [QR-62, QR-61]
origin: [MOD-39]
issue: QR-62 は模擬の運賃表が「模す運賃の定め」に合うことを、QR-61 は料金をその運賃表に従って求めることを求めるが、どの定め（地域と車の区分）を模すかと、その定めの料金を求める決まり（初乗りと距離の加算、時間距離併用、迎車料金、割増、端数の扱い）を、どの品質チェーンの項目も述べていない（品質チェーンの第 3 段階と設計の第 1 段階の未解決の点）。料金を確定の深さで求める MOD-39 の判断表と、端数を丸める一度だけの決まり（DEC-38）と、模擬の運賃表（DAT-24）の決まりの形がそれに頼る
suggestion: QR-62 か共有する事実に、模す運賃の定め（どの地域のどの車の区分の運賃か）と、その料金を求める決まり（初乗りの距離と額、距離の加算の単位と額、時間距離併用の有無とその決まり、迎車料金、深夜などの割増、端数の扱い）を書く
quality_stages: [3]
impact: high
impact_note: MOD-39 はお金を動かす額（確定額）を決める確定の深さのモジュールで、その判断表と、見積もりが持たなければならない入力（依頼の時刻、道の区間ごとの速さ）が定めの中身で変わる。第 4 段階の ELM-03 の質問 1 で尋ねる。第 3 段階の IFC-19（computeRoutes で求める道の項目）と DAT-06（見積もりが持つ料金のもと）も、定めが道の長さと時間のほかのものを要すれば項目が加わるが、操作、誤りとその符号、状態、整合の取り方は変わらないため、第 3 段階にとっては低
answer: null
answered_in: null
