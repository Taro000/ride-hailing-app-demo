id: QCR-07
title: 応えを待たずに送り直して一つと数える操作のうち、ある要求にシステムが答えなかったか自身の誤りを返したものを GOOD に数えるか
status: open
stage: 3
targets: [SLI-01, SLI-02, SLI-03, SLI-04, SLI-05, SLI-06]
origin: [DEC-43, DAT-19, IFC-01, IFC-02, IFC-03, IFC-04, IFC-06]
issue: SLI-01〜SLI-06 の VALID の数え方の規則は、同じ利用者が同じ操作を応えを待たずに送り直したものを一つと数えるが、その一つの操作のある要求にシステムが答えなかった（受けたインスタンスが答える前に止まった）か自身の誤り（500）を返し、端末がその答えを受けずに送り直して結果を受けたとき、その操作を GOOD に数えるかを述べていない。GOOD の定義の「システムが応えなかったもの」「システム自身の誤りを返したもの」は、要求ごとに読めば GOOD でなく、操作が最後に受けた結果で読めば GOOD になる。設計は要求ごとの答えと、端末が答えを受ける前の送り直しか受けた後の送り直しか（DEC-43 の X-Resend）を境界の出来事（DAT-19）に残すため、どちらの読み方でも数えられる
suggestion: SLI-01〜SLI-06 の GOOD の数え方の規則に、応えを待たずに送り直して一つと数えた操作は、そのどれかの要求にシステムが答えなかったか自身の誤りを返したときは、後の送り直しが結果を受けても GOOD に数えない、と書く（設計は今この読み方で数えている）。違う読み方を採るなら、その読み方を書く
quality_stages: [4]
impact: low
impact_note: 境界の出来事は要求ごとに答えと送り直しの別を残すため、どちらの読み方でも同じ項目から数えられ、答えが違えば DEC-43 の一つの操作の数え方の一文と、IFC-01〜IFC-04、IFC-06 の出どころの方法の書き方を直すだけで、インタフェース、記録、ほかの設計の項目は変わらない。答えが来るまで、設計は GOOD の定義を要求ごとに読み、数えが良く見えない側で数える
answer: null
answered_in: null
