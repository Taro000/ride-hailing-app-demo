id: QCR-06
title: リリースの前に、状態の変化を相手に示す速さと現在地の新しさを実機で測るゲート
status: open
stage: 3
targets: [NFR-07, NFR-19]
origin: [DEC-46, IFC-05, IFC-11, IFC-17]
issue: NFR-07 と NFR-19 の遅延の予算（DEC-46）は、ELM-03 の自身の処理、ELM-04 の取引、EXT-01 の押さえ、端末への流れ、端末が示すまで、端末が位置を測って送る時間に暫定の値を置いており（DAS-10、DAS-11）、どれも測っていない。品質チェーンには、リリースの前にこの二つの流れの時間を確かめるゲートがなく（NFR-15 は受け入れの試験、NFR-38 は異常の知らせ）、技術方針にも負荷の層はない（POL-03）
suggestion: リリース前の確認のゲート（NFR）を加え、試験の環境（本物の外部サービスの設定）で実機の iPhone の ELM-01 を使い、依頼、許諾、取り消し、迎車の到着を相手の画面に示すまでの時間（SLI-14 と同じ区間）と、システムが持つ位置の古さ（SLI-10 と同じ確かめ）を測って、T_dispatch_propagation と T_vehicle_location_lag に照らすことを求める。何回測り、どの割合で収まればよいかは品質チェーンが決める
quality_stages: [4]
impact: low
impact_note: どの設計の項目も変えず、リリースの前の確かめを加えるだけ。答えが来るまで、設計は品質チェーンの今の要求のとおりに進める
answer: null
answered_in: null
