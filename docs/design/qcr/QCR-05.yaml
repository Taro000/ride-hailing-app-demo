id: QCR-05
title: 確定額は CON-08 の料金を下回らないか
status: answered
stage: 2
targets: [CON-08, FR-54, SLI-11, QR-61]
origin: [DEC-09]
issue: FR-54 は、許諾の後の乗客の取り消しと乗客の不在で、依頼のときに押さえた確定額から CON-08 の料金を請求させて残りを解くことを求め、SLI-11 は解いた押さえの額が押さえた額から請求した額を引いた額と等しいことを数える。押さえた額より多くは請求できないため、どちらも確定額が CON-08 の料金を下回らないことを前提にするが、それを述べる項目はなく、確定額のもとになる模擬の運賃表の中身と模す運賃の定めも決まっていない（QR-62、NFR-48）
suggestion: 確定額が CON-08 の料金を下回らないこと（たとえば、模擬の運賃表の最も安い料金が CON-08 の料金以上であること）を CON-08 か FR-54 に書く。下回る依頼がありうるなら、そのときの料金の請求の仕方（押さえを超える分を別に請求する、押さえる額を確定額と料金の大きい方にする、など）を FR-54 に書き、SLI-11 の数え方をそれに合わせる
quality_stages: [2]
impact: high
impact_note: 下回る依頼がありうるなら、DEC-09 の EXT-01 とのつなぎ方（第 2 段階が確定の深さで決めるもの）に押さえを超える請求か押さえる額の変更が加わり、主な設計を動かす要求の DRV-07 の応答も変わる。質問 5 で尋ねた
answer: 起こらない。模擬の運賃表の最も安い料金は 500 円以上で、料金は押さえから請求する（下書きどおり。試行の模擬回答）
answered_in: 設計の第 2 段階の質問 5
