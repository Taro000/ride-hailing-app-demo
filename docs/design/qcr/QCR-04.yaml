id: QCR-04
title: 迎車のために走っているドライバーとの連絡のメッセージ
status: answered
stage: 2
targets: [FR-11, FR-22, QIU-17]
origin: [DEC-27]
issue: FR-11 は、配車が確定してから乗車が始まるまで乗客とドライバーが互いに連絡できることを求め、その間のドライバーは迎車のために運転している。設計は連絡をアプリの中のメッセージで行う（DEC-27）。走っている間にドライバーがメッセージを読み書きすると、QIU-17 が依頼を選ぶ操作と許諾について挙げた危険（走りながら画面を見て操作し、前への注意がそれる）が連絡でも生じるが、QIU-17 の利用状況は乗客を乗せずに受付をしている間で、FR-22 と QR-28 が止めるのは依頼を選ぶ操作と許諾だけで、連絡を扱う項目はない。設計は、車が走っている間（FR-22 と同じ判断）はドライバーからは送らせず、届いた中身は止まってから示す案を下書きした（DEC-27）が、それは FR-11 の連絡できる場面を狭める
suggestion: FR-11 に、車が V_moving_lock 以上の速さで動いている間は、ドライバーからのメッセージを受け付けず、届いたメッセージの中身は止まってから示し、乗客にはドライバーが止まってから読むことを示す、という受け入れ基準を加え、健康・安全リスク緩和性の要求（QIU-17 など）に結び付ける。走っている間の読み書きを許すなら、そのリスクを受け入れることを FR-11 に書く
quality_stages: [2]
impact: low
impact_note: 答えが変えるのは DEC-27 の走っている間のドライバーの扱いだけで、第 2 段階が確定の深さで決める項目と主な設計を動かす要求は変わらない。安全のリスクを受け入れるかは事業の判断として質問 4 で尋ね、その答えをこの要求に記録した
answer: 走っている間はドライバーからは送れず、中身は止まってから示し、乗客にはそのことを示す（下書きどおり。試行の模擬回答）
answered_in: 設計の第 2 段階の質問 4
