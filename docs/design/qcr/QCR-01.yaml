id: QCR-01
title: ドライバーの現在地から乗車場所までの距離は、道のりか直線か
status: open
stage: 1
targets: [FR-19, FR-20, FR-32, QR-32]
origin: [DRV-08]
issue: FR-19、FR-20、FR-32 は、ドライバーの現在地から乗車場所までの距離が道のりか直線かを述べていない（品質チェーンの第 2 段階と第 3 段階も未解決の点に挙げている）。道のりなら、依頼を届ける相手を決めるたびに EXT-02 に道を求めることになり、DRV-08 の規則と EXT-02 とのつなぎ方が変わる
suggestion: FR-19 と FR-32 に、条件の距離が道のりか直線かを書き、FR-20 が示す距離も同じものにする。QR-32 の失敗のシナリオもそれに合わせる
quality_stages: [2]
impact: low
impact_note: DRV-08 は主な線の下にあり、どちらの距離でも EXT-02 は一つのつなぎ口の後ろに置ける。ドライバーは 1 人（OPF-03）で、道のりでも依頼ごとに一度求めるだけ。設計の第 3 段階の IFC-04、IFC-08、DAT-04 は直線の距離で書いており、道のりになれば、依頼の内容の距離と届けるときの判断に EXT-02 の道を加え、EXT-02 が答えないときの扱いを IFC-04 に足す。届けるときの道は押さえと並べて求めれば NFR-07 の予算に収まり、主な設計を動かす要求の応答は変わらない。答えが来るまで、設計は品質チェーンの今の要求のとおりに進める
answer: null
answered_in: null
