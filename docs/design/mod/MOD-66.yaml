basis_note: 各 SLI の数える単位の出来事、項目、方法は、IFC-01〜IFC-06、IFC-10、IFC-11、DAT-07、DAT-11、DAT-13、DAT-14、DAT-21 の sli_bindings、境界の SLI の一つの操作の作り方は DEC-43、本番の環境の記録だけを数え、試験用のアカウントを外すことは第 3 段階の報告の「SLI の出どころ」（どれも入力）。一つの操作のある要求にシステムが答えなかったときの数え方は QCR-07 で品質チェーンに確かめていて、答えが来るまで GOOD の定義を要求ごとに読む。デモの回の間は、想定の本番ではインスタンスが動いている間（DAS-02。第 3 段階のレビューの質問 2 の答えで確認済み）として、記録のある時を数える（推定）。迎車の到着の前に乗車が始まった依頼には SLI-14 の迎車の到着の組がないことは DAT-07 と第 3 段階の報告の SLI-14 の数え方（FND-56 を受けた第 3 段階の変更、入力）
