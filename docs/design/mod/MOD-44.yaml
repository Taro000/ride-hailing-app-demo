id: MOD-44
title: 照合
status: active
basis: assumed
basis_note: 日々、期間の取引と返金を EXT-01 から読んで記録と突き合わせることは DEC-11、日 D の実行で D の 2 日前の 00:00 から D の 00:00 までに作られたものを読み、処理を行った日 d の値を d の 2 日後の実行で決めることは IFC-15（DAS-12、QAS-32）、処理ごとに結果を上書きし、一つの依頼に取引が二つ以上あるときは試みの依頼の ID と metadata の attemptId で取引ごとに突き合わせ、食い違いを異常として知らせることは DAT-13、SLI-12 の数える単位（処理されなかった後に新しい試みで続けた処理は一つ）と比べる時点は DAT-13 の sli_bindings（どれも入力）。返金を照合して NFR-24 の食い違いを見ることは NFR-24 と DAT-13（返金は SLI-12 に数えない）。判断表の行の分け方は推定。一覧の 1 ページの件数は DAS-20 による暫定の決定
premises: [DAS-20]
component: ELM-03
name: 照合
depth: full
depth_reason: 試みの記録と EXT-01 の処理を突き合わせて、処理ごとに一致と食い違いを決める（SLI-12 と NFR-24 のもと）。どちらにある処理か、EXT-01 が最終の結果を返したか、突き合わせの時点、処理されなかった後の新しい試みの鎖の組で答えが決まる、いくつもの条件の規則
responsibility: EXT-01 の取引と返金の一覧を試みの記録と突き合わせ、処理ごとの照合の結果を残す
visibility: internal
interface:
  - operation: "reconcile(jobDate: LocalDate) -> ReconcileReport"
    pre: 呼ぶのは MOD-32 の照合の仕事だけ
    post: jobDate の 2 日前の 00:00 から jobDate の 00:00（Asia/Tokyo）までに作られた EXT-01 の取引と返金を 1 ページずつ読み（MOD-41 の list）、試み（MOD-42）と metadata の attemptId と取引の ID で結び、判断表 A で処理ごとの照合の結果（DAT-13）を上書きし、jobDate の 2 日前の処理の値を決めたものとして印を付ける。食い違いをたどる記録に failureOrigin EXT-01 か system で残す（MOD-67 が異常にする）
    errors: ["Ext01Unavailable: 一覧が読めない（仕事を失敗として MOD-32 に返し、次の呼び出しが初めからやり直す。上書きなので二度読んでも同じ）"]
  - operation: "results(rideId: RideId) -> ReconcileResult[]; dayValue(processingDate: LocalDate) -> SliDay"
    pre: null
    post: 依頼ごとにまとめた照合の結果と、処理を行った日の値（決めたか）を返す（MOD-61、MOD-66、MOD-67）
    errors: []
invariants:
  - 処理ごとに照合の結果は一行で、上書きされる
  - 処理されなかった後に新しい試みで続けた押さえの解除、請求、決済は、試みがいくつあっても一つの処理で、最後の試みを比べる
depends_on: [MOD-21, MOD-25, MOD-28, MOD-41, MOD-42]
functions: []
realizes: []
drivers: [DRV-07, DRV-27]
decisions: [DEC-11, DEC-45]
behaviour: "報告書の節: MOD-44 照合"
verification:
  - checks: 判断表 A の行ごと（両方にあって合う、額か結果が違う、システムにだけ、EXT-01 にだけ、最終の結果がない、処理されなかった試みだけ、新しい試みの鎖、返金）
    how: 単体の層
  - checks: EXT-01 の偽物の期間の読み出しで、照合の結果と日 d の値が d の 2 日後に決まり、二度読んでも同じになる
    how: 結合の層（EXT-01 の偽物、時計の偽物、日々の呼び出しの偽物）
  - checks: 食い違いと二度目の請求と超えた返金が異常になり、エンジニアと担当者に知らされる（NFR-24）
    how: 結合の層
parameters:
  - name: EXT-01 の一覧の 1 ページの件数
    value: 100（Stripe の一覧の最大）
    basis: IFC-17 の 1 ページのタイムアウト 10 秒のうちに読め、デモの量（OPF-02）なら 1 ページで足りる暫定の値（DAS-20）
as_is: new
