needs_agreement: false
approver_candidates: []
component: ELM-03
name: 画面の移り先
responsibility: 画面の移り先を、役割、版、未保存の入力に合わせて決める
visibility: internal
interface:
- operation: 'path(screen: ScreenId, params) -> Text'
  pre: params は ID のパターンに合う
  post: "/backoffice/ の下の URL を返す。ID のほかの値（名前、連絡先、位置、検索の条件）を入れない（DEC-16）"
  errors:
  - 'InvalidParam: プログラムの誤り（テストで捕まえる）'
- operation: 'RequireRole(session: SessionState, roles: Set<StaffRole>, children) -> 画面'
  pre: なし
  post: session が Active で roles のどれかがあれば children を示す。Anonymous ならログインの画面（戻り先の経路をメモリに持つ）。役割がなければ「この画面を使う権限がありません」
  errors: []
- operation: 'markUnsaved(id: Text, unsaved: Bool) -> Unit; hasUnsaved() -> Bool; hasBlocking() -> Bool'
  pre: なし
  post: 未保存の入力と、止める理由（送信中や結果が分からない run、表示中の設定の符号）を数える
  errors: []
- operation: confirmLeave() -> Bool
  pre: なし
  post: 未保存か止める理由があれば、移ってよいかを確かめる。ブラウザを閉じるときは beforeunload で確かめる
  errors: []
- operation: 'onVersionMismatch(serverVersion: Text) -> Unit; tryReload(trigger: navigation | banner) -> Unit'
  pre: なし
  post: 版の読み直しの判断表で、読み直すか待つかを決める
  errors: []
