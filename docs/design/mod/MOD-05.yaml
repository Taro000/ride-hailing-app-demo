id: MOD-05
title: 記録した位置の表示
status: draft
version: 1
basis: inferred
basis_note: 示すもの（FR-45 AC3・4）と地図が出ないときの扱い（IFC-16）は入力。表を主にし地図を補いにすることは推定
needs_agreement: false
approver_candidates: []
component: ELM-03
name: 記録した位置の表示
responsibility: 依頼の記録した位置を表と地図で示す
visibility: internal
interface:
- operation: 'RecordedPositionsView(positions: RecordedPositions, mapsKey: Text?) -> 画面の部品'
  pre: 座標が範囲の中
  post: 四つの操作の表（緯度と経度は小数点以下 6 桁）、受信の記録の表（空なら「位置の受信の記録はありません（保存期間を過ぎたか、受信がありませんでした）」。FR-45 AC4）、WS-MAP の地図を示す。座標は画面と WS-MAP にだけ渡し、記録やログに渡さない
  errors:
  - 地図が出ないとき（鍵がない、読み込めない、gm_authFailure）は「地図を表示できません。表で確かめてください」を示し、表はいつも示す（IFC-16）
- operation: 'fromEngineer(r: RidePositions) -> RecordedPositions'
  pre: なし
  post: 位置（changeType と position）を OpPosition に、受信を Receipt にする
  errors: []
invariants: []
depends_on: []
