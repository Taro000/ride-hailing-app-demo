    errors: []
  - operation: "randomBytes(n: integer) -> bytes"
    pre: null
    post: 暗号に使える乱数
    errors: []
  - operation: "correctDeviceTime(t: DeviceTime, receivedAt: Instant) -> Instant"
    pre: null
    post: 端末の時刻を DEC-37 の式でサーバーの時刻に直したもの
    errors: []
