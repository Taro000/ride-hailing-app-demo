id: MOD-21
title: 時計と ID
status: active
basis: inferred
basis_note: 時刻、乱数、ID のもとを src/platform/ の時計と ID の作り手だけが使い、ほかのコードは渡されたものを使うことは POL-02、テストがそれを替えることは POL-03、公開する ID を種類の接頭辞と ULID にし、サインインの ID を Crockford の Base32 の 8 文字にすることは DEC-36、端末の時刻の直し方と日で数える時間帯は DEC-37（どれも入力）
premises: []
component: ELM-03
name: 時計と ID
depth: bounds
