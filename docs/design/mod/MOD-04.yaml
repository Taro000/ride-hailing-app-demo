id: MOD-04
title: 苦情の調べ
status: draft
version: 1
basis: inferred
basis_note: 示すもの（FR-45、IFC-06・28）は入力。「未対応」で開くこと、取り置きの扱い、位置の突き合わせの方法は推定（前提の質問 5 は回答なし）
needs_agreement: false
approver_candidates: []
component: ELM-03
name: 苦情の調べ
responsibility: 苦情を絞り込んで開き、その乗車の記録を一つの画面に示す
visibility: public
interface:
- operation: 'listComplaints(f: ComplaintFilter, cursor: Cursor) -> Page<ComplaintListItem>'
  pre: f の値は列挙の中
  post: GET /api/v1/admin/complaints?status=&type=&cursor=&limit=20 を kind read で読む。新しい順。合うものがなければ空
  errors:
  - '共通: 答えがない（WS-API の送り直しを尽くした）、403、429。401 は MOD-02 がログインし直させる'
- operation: 'getComplaint(id: ComplaintId) -> ComplaintDetail'
  pre: id がパターンに合う
  post: GET /api/v1/admin/complaints/{id} を開くたびに読む
  errors:
  - 'NotFound: 404（「この苦情は見つかりません」と一覧へのリンク）'
  - '共通: 答えがない（WS-API の送り直しを尽くした）、403、429。401 は MOD-02 がログインし直させる'
- operation: 'toRecordedPositions(ride: ComplaintDetail.ride) -> RecordedPositions'
  pre: なし
  post: 履歴の四つの操作（arrived、started、no_show、ended）の行を positionId で positions に突き合わせる。位置のない行は noPositionReason を missingReason にし、receipts を Receipt にする
  errors:
  - 突き合わせられない positionId は「位置の記録が見つかりません」として missingReason にする
- operation: ComplaintListScreen、ComplaintDetailScreen(complaintId) -> 画面
  pre: operator の役割
  post: 報告書の「画面」の節のとおり。詳細は MOD-05、MOD-06、MOD-16 を埋め込み、請求の記録へのリンクを持つ
  errors:
  - '共通: 答えがない（WS-API の送り直しを尽くした）、403、429。401 は MOD-02 がログインし直させる'
invariants: []
