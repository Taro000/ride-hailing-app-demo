id: MOD-01
title: ELM-03 の呼び出し
status: active
basis: assumed
basis_note: 状態を変える利用者の一回の操作ごとに冪等キーを作り、答えを受けるまで同じキーで送り直すことは DEC-08 と DEC-42、ELM-03 がキーをそれを最初に受けたアカウントと操作に結び付け、ほかのアカウントか操作で受けたキーを行わずに 422 IDEMPOTENCY_KEY_REUSED で答え、利用側はそれを受け付けなかった答えとして今の状態を読み直し、し直すのは利用者が改めて操作したときに新しいキーで送ることは DEC-42、たどる ID と送り直しの別（X-Resend）は DEC-43、誤りの形と状態の組ごとの扱いは DEC-35（外部を呼ぶ操作が返す 503 はキーの答えで、同じキーで送り直さずに今の状態を読み直すことを含む）、知らない符号と項目を状態の組で扱うことは DEC-41、端末の時刻に添える往復の時間は DEC-37、本人の確かめの印が同じ origin のどの要求にも自動で付くクッキーだけで、ELM-01 と ELM-02 が同じ origin から配られることは DEC-40、サインインと設定の符号でパスワードを決める操作を本人の確かめなしで受け、合わないパスワードに 401 AUTH_FAILED を返すことと、GET /v1/me が本人のアカウントの ID を返すこと（FND-51 で第 3 段階が IFC-01 に加えた）は IFC-01 で、どれも入力。生成した型と openapi-fetch で呼ぶことと、外への呼び出しを src/platform/ にだけ置くことは POL-01 と POL-02（入力）。予期しない答えを原因をつけて投げることは POL-04（入力）。対応するブラウザ（DEC-03）がタブの間の知らせ（BroadcastChannel）を持つことは入力からの推定。読むだけの操作を送り直さないこと、同じ内容の定まっていない操作を一つにすること、返金の操作をタブの保存に持ってタブを読み直した後も同じキーで続けることは推定。サインインの前の操作を始める道と、AUTH_FAILED とサインインの前の操作への 401 を定まった答えにすることは FND-43 を、冪等キーのある操作の要求を出す直前にセッションのアカウントを GET /v1/me で確かめ、タブのアカウントの変化をほかのタブに知らせて受け、タブが前に出たときにも確かめることは FND-44 を、タブの保存の項目に形の版、効いたかもしれないかの種類（evidence）、最後の変える要求の答えの別、送っている途中かを持たせ、読めない項目を数えて返すことは FND-46 を受けた（推定）。evidence を答えを待つのを終えた変える要求だけから決め、答えを待っている要求がある操作を evidence によらず答えを受けていない要求があるものとして扱い、kept() が送っている途中の操作を捨てずにその状態で返し、捨てるのを送っている途中でない evidence が notDone の操作と持つ長さを過ぎた操作だけにし、discard の pre を冪等キーのあるサインインした後の操作で答えを受けていない変える要求があるものに限ったことは FND-52 を、send の failed に送る前の確かめの失敗の答えを書いたことは FND-53 を、functions に FR-50 を加えた（操作の記録の担当者を、操作を始めた担当者のセッションでだけ送ることで保つ、DRV-30）ことは FND-54 を受けた（推定）。FND-50 を受けた DEC-42 で一度だけ効くことを ELM-03 が守るようになった後も、冪等キーのある操作のどの要求の前にもアカウントを確かめるのは、ELM-03 がまだキーを受けていない要求（それまでの要求がどれも ELM-03 に届いていない操作の要求）がほかのアカウントのセッションで出ると、ELM-03 がそのアカウントにキーを結び付け、その操作をそのアカウントの操作として行って記録するため（FR-50 の 1、DRV-30）で、FND-50 の resolution が第 4 段階の ELM-02 の次の実行に任せた点を推定で決めた。422 IDEMPOTENCY_KEY_REUSED を定まった答え（refused）にして同じキーで送り直さないことは DEC-42 から、それを受けたらタブのアカウントを確かめること（MOD-01 は一つのキーをほかの操作と中身に使わないので、その答えはキーを受けたときか今のセッションのアカウントが操作のものと違ったことを示す）は推定。確かめの答えを受けてから要求を出すまでの間にほかのタブのサインインがクッキーを替え、ELM-03 がまだキーを受けていない要求がほかのアカウントの操作として行われる残りは、DEC-42 がそれを閉じないまま要求ごとの確かめを要しないとすることとともに FND-60 で第 3 段階に出した。タイムアウト、自動の送り直しの回数と間合い、409 OPERATION_IN_PROGRESS の後の送り直しの上限、持つ長さと数は HND-18 を決めたもので、DAS-16 による暫定の決定。タイムアウト 15 秒が前提にする ELM-03 の答えの期限 5 秒は、第 4 段階の ELM-03 の実行が HND-19 で決めた MOD-20 の値で、DAS-17 による暫定の決定。IFC-13 の呼び出しは IFC-13 の timing の 15 秒をそのまま使い、ここでは決めない。流れ（IFC-11）はここを通らない（MOD-03）
premises: [DAS-16, DAS-17, OPF-02, OPF-03]
component: ELM-02
name: ELM-03 の呼び出し
depth: full
depth_reason: ELM-02 から ELM-03 の状態を変えるどの呼び出しもここが送り、答えを失った操作を同じ冪等キーで送り直して一つの結果に定める（結果が分からない状態を確かめる）。担当者が認めた返金（お金を動かす操作）の送り直しもここを通る。同じ origin のどのタブも一つのセッションのクッキーを使い、ほかのタブのサインインと使い終えることがそれを替える中で、一つの操作のどの要求も、その操作を始めたアカウントのセッションで送る（同時に動く仕事と状態を分ける）
responsibility: ELM-03 の操作を呼び、状態を変える利用者の一回の操作を、始めたアカウントのセッションのまま、答えを受けるまで同じ冪等キーで送って一つの結果に定める
visibility: internal
interface:
  - operation: "useAccount(accountId: AccountId or none) -> none"
    pre: MOD-09 だけが、サインインした後と起動したときに GET /v1/me で分かったアカウントか、使い終えたときの none を渡す
    post: 渡したアカウントがタブのアカウントと違えば（none を含む）、それをタブのアカウントにし、そのアカウントのものでない操作とサインインの前の操作を、メモリとタブの保存からすべて捨てる（送っている要求は中止し、その後に届いた答えも捨て、待っている send は dropped の accountChanged を返す）。そのうえで、同じ origin の ELM-02 のほかのタブに新しいアカウントを知らせる（BroadcastChannel。アカウントの ID だけを送る）。同じなら何も捨てず、ほかのタブに知らせない。どちらでも onAccount の聞き手に知らせる
    errors: []
  - operation: "onAccount(listener: (accountId: AccountId or none) -> none) -> Unsubscribe"
    pre: null
    post: useAccount が呼ばれるたび（同じアカウントでも）と、ほかのタブの知らせ、送る前の確かめ、タブが前に出たときと 422 IDEMPOTENCY_KEY_REUSED を受けたときの確かめでタブのアカウントが変わったときに、タブのアカウントを知らせる。ほかのタブの知らせと確かめで変わったときは、知らせる前に useAccount と同じに捨て、ほかのタブには知らせない
    errors: []
  - operation: "read(operation: ReadOperationName, input: Input) -> ReadResult"
    pre: operation は読むだけの操作（GET と、DEC-42 が冪等キーを求めない探すだけの POST …/search）
    post: 新しいたどる ID を X-Trace-Id に付けて一つの要求を送り、タイムアウトのうちに答えがなければ noAnswer を返す。タイムアウトは IFC-13 の操作なら IFC-13 の 15 秒、ほかは parameters の値。2xx なら ok と本文を、ほかの答えは DEC-35 の本文を ApiError にして error を返し、401 で符号が AUTH_FAILED でなければ onNotSignedIn の聞き手にも知らせる。送り直さない（読み直すかどうかは呼ぶ側が決める）
    errors:
      - "UnexpectedAnswer: 答えの本文が生成した型に合わない。原因をつけて投げ、画面の境（MOD-10）が受ける"
  - operation: "begin(operation: ChangeOperationName, input: Input, keepAcrossReload: boolean) -> Operation"
    pre: 利用者の一回の操作につき一度だけ呼ぶ（同じ操作を送り直すときは send を呼び、begin を呼び直さない）。operation はサインインの前の操作でない（それは beginSignedOut で始める）。keepAcrossReload を真にする操作の本文は個人の情報を持たない
    post: 同じ操作の名前、経路の値、本文の、まだ定まっていない操作がこのタブにあれば、それを返す。なければ新しい操作を作り、DEC-42 が冪等キーを求める操作には新しい冪等キーを、どの操作にも新しいたどる ID を割り当て、タブのアカウントを写し、evidence を notDone にする。keepAcrossReload が真なら、送る前にタブの保存に書く
    errors:
      - "NotSignedIn: タブのアカウントがない。サインインを求める"
      - "TooManyOperations: 定まっていない操作が上限にある。呼ぶ側は先の操作を定めるよう示す"
  - operation: "beginSignedOut(operation: SignedOutOperationName, input: Input) -> Operation"
    pre: operation は ELM-03 が本人の確かめなしで受けるサインインの前の操作（IFC-01 の POST /v1/sessions と POST /v1/account-setups）。利用者の一回の操作につき一度だけ呼ぶ
    post: 同じ操作の名前と本文の、まだ定まっていないサインインの前の操作がこのタブにあればそれを返し、なければ新しい操作を作る。冪等キーは IFC-01 と DEC-42 が求める POST /v1/account-setups にだけ割り当て、どれにも新しいたどる ID を割り当てる。アカウントを持たず（accountId は none）、タブの保存に書かず、入力（サインインの ID、パスワード、設定の符号）は定まるか捨てられるまでメモリにだけ持つ。タブのアカウントがあってもなくても始められる
    errors:
      - "TooManyOperations: 定まっていない操作が上限にある"
  - operation: "send(operation: Operation) -> Outcome"
    pre: operation は begin か beginSignedOut が返したもので、まだ定まっておらず捨ててもいない
    post: 状態遷移図と判断表のとおりに送り、Outcome を返す。冪等キーのあるサインインした後の操作は、どの要求も、出す直前に GET /v1/me（新しいたどる ID）がその操作のアカウントと答えたときだけ出し、ほかのアカウントと答えれば出さずに操作を捨ててタブのアカウントを替え（dropped の accountChanged）、サインインしていなければ出さずにサインイン待ちにする（確かめの判断表）。done は 2xx（202 の PENDING を含む）。refused は 401 AUTH_FAILED、サインインの前の操作への 401、外部を呼ぶ操作（ELM-02 では IFC-13 の返金を作る操作とやり直し、DEC-42）への 503、401、409 OPERATION_IN_PROGRESS、429 のほかの 4xx。そのうち 422 IDEMPOTENCY_KEY_REUSED は、ELM-03 がそのキーをほかのアカウントか操作で受けていて、この要求を行わなかった答えで、操作の結果を示さない。同じキーで送り直さず（呼ぶ側が今の状態を読み直す、DEC-42）、タブが前に出たときと同じにタブのアカウントを確かめる。failed は、変える要求への上の 503 のほかの 5xx と 429 と、送る前の確かめの GET /v1/me が 5xx（503 を含む）、429、ほかの 4xx で答えたとき（確かめの ApiError を返し、変える要求を出さず、evidence を変えない）。notSignedIn は、サインインした後の操作への NOT_SIGNED_IN か知らない符号の 401 と、確かめでサインインしていないと分かったとき（操作の evidence を添える）。unanswered は、自動の送り直しを使い切っても答えがないときと、409 OPERATION_IN_PROGRESS の後の送り直しが上限に達したとき。dropped は、定まる前に呼ぶ側が捨てたとき（discarded）と、タブのアカウントが操作のものでなくなったとき（accountChanged）。一つの操作のどの要求も同じ冪等キー（キーを求める操作）と同じたどる ID を持ち、二つ目からの要求には前の要求の答えに合わせて X-Resend を付ける（DEC-43）。done と refused で操作は定まり、タブの保存から消す。failed、unanswered、notSignedIn では操作を持ち続け、呼ぶ側の send で同じキーで送る。送っている途中の操作（アカウントを確かめている、送っている、間を置く、動いているのを待つ）の send は新しい要求を出さず、同じ Outcome を待たせる
    errors:
      - "UnexpectedAnswer: 答えの本文が生成した型に合わない。原因をつけて投げ、操作は失敗の答えを受けたものとして持つ"
  - operation: "kept() -> KeptOperations"
    pre: null
    post: メモリとタブの保存にある、タブのアカウントの、まだ定まっていない keepAcrossReload の操作を、MOD-01 の状態と evidence とともに返す。送っている途中の操作（アカウントを確かめている、送っている、間を置く、動いているのを待つ）は、最初の変える要求の答えを待つもの（evidence は notDone のまま）を含めて、evidence によらず捨てずにその状態のまま返し、要求を中止しない（呼ぶ側は send でその Outcome を待つ。持つ長さは状態遷移図のとおりに見る）。タブを読み直したときに変える要求の答えを待っていた操作（タブの保存の inFlight が真）は、答えがない（evidence は unanswered）として返す。送っている途中でない操作のうち、evidence が notDone のもの（答えを待つのを終えたどの変える要求も効いておらず、答えを待つ要求もない）と、最初に送ってから持つ長さを過ぎたものは、捨てて返さない。タブの保存で読めなかった項目は消して、その数を unreadable で返す
    errors: []
  - operation: "discard(operation: Operation) -> none"
    pre: 呼ぶ側は、冪等キーのあるサインインした後の操作のうち、答えを受けていない変える要求があるもの（答えを待っている要求があるか、evidence が unanswered）を捨てない。捨てた操作と同じ利用者の操作を新しいキーで送るのは、一覧などで結果を確かめてからにする。キーのない操作とサインインの前の操作は、どの状態でも捨ててよい（送り直しても二度は効かない）
    post: 操作をメモリとタブの保存から消す。その後に届いたその操作の答えは捨て、待っている send は dropped の discarded を返す
    errors: []
  - operation: "onNotSignedIn(listener: () -> none) -> Unsubscribe"
    pre: null
    post: サインインした後の操作か読むだけの操作の要求が 401 NOT_SIGNED_IN か知らない符号の 401 を受けたときと、送る前、タブが前に出たとき、422 IDEMPOTENCY_KEY_REUSED を受けたときの確かめでサインインしていないと分かったときに、聞き手に知らせる。401 AUTH_FAILED とサインインの前の操作への 401 では知らせない
    errors: []
  - operation: "lastRoundTripMs() -> integer or none"
    pre: null
    post: 直前に答えを受けた ELM-03 への要求の往復の時間を返す（DEC-37 の報告に添える）。まだ答えを受けていなければ none
    errors: []
invariants:
  - 一つの操作のどの要求も、同じ冪等キー（DEC-42 がキーを求める操作）と同じたどる ID を持つ
  - 冪等キーのあるサインインした後の操作の要求は、出す直前に GET /v1/me がその操作のアカウントと答えたときだけ出す
  - 定まっていない操作の冪等キーは、操作が定まるか、捨てられるか、持つ長さを過ぎるまで変わらず、同じ内容の定まっていない操作に二つ目のキーを作らない
  - 答えを受けていない要求がある操作を、done とも refused とも返さない
  - 操作の evidence は、答えを待つのを終えた変える要求（答えを受けたか、タイムアウトかつながらずに待つのをやめたか、タブを読み直したときに送っている途中だった要求）だけから決まり、notDone、failed、unanswered の順に上がるだけで、下がらない
  - 答えを待っている変える要求がある操作は、その要求が終わるまで evidence によらず答えを受けていない要求があるものとして扱い、kept() で捨てない。MOD-01 が自らそれを捨てるのは、タブのアカウントが変わったときだけ（呼ぶ側の discard は pre のとおり）
  - タブのアカウントが変わったら、そのアカウントのものでない操作とサインインの前の操作を、メモリとタブの保存から捨て、その後に届いた答えも捨てる
  - サインインの前の操作の入力（サインインの ID、パスワード、設定の符号）は、定まるか捨てられるまでメモリにだけ持ち、タブの保存、ログ、ほかのタブへの知らせ、端末のエラーの報告に入れない
  - タブの保存には keepAcrossReload の操作だけを、形の版、アカウントの ID、操作の名前、経路の値、本文、冪等キー、たどる ID、最初に送った時刻、evidence、最後の変える要求の答えの別、送っている途中かだけで書き、変える要求を出す前に送っている途中と書く。個人の情報を書かない
  - タブの保存の項目は、一つ前のビルドがそのまま読める足し方だけで変え、項目の名前を変えず、消さない
depends_on: [MOD-07]
functions: [FR-40, FR-48, FR-50]
realizes: []
drivers: [DRV-24, DRV-28, DRV-30]
decisions: [DEC-03, DEC-08, DEC-33, DEC-35, DEC-36, DEC-37, DEC-40, DEC-41, DEC-42, DEC-43, DEC-46]
behaviour: "報告書の節: MOD-01 ELM-03 の呼び出し"
verification:
  - checks: 状態遷移図のどの遷移も（2xx、4xx、401 の三つの扱い、409 OPERATION_IN_PROGRESS、422 IDEMPOTENCY_KEY_REUSED、429、外部を呼ぶ操作の 503 とほかの 5xx、タイムアウト、つながらない、アカウントの確かめの各答え、持つ長さを過ぎる、discard、kept()、タブのアカウントが変わる）
    how: 単体の層（Vitest の Browser Mode、Chromium）。テストが渡す fetch の偽物で答えを落とし、遅らせ、各状態の組と GET /v1/me のアカウントを返し、時計の偽物（MOD-07）で時間を進める
  - checks: 答えの判断表、確かめの判断表、evidence と X-Resend の表の各行の Outcome と、送り直しの冪等キー、たどる ID、X-Resend の値（DEC-42、DEC-43）
    how: 単体の層。fetch の偽物が受けた要求のヘッダーと順を比べる。判断表から作る
  - checks: 冪等キーのあるサインインした後の操作は、どの要求の前にも GET /v1/me を読み、ほかのアカウントか 401 なら変える要求を出さない。キーのない操作とサインインの前の操作は確かめない
    how: 単体の層（fetch の偽物が受けた要求の順を調べる）
  - checks: サインインの前の操作をアカウントなしで始めて送り、401 AUTH_FAILED を refused で返して onNotSignedIn に知らせず、入力をタブの保存に書かず、タブのアカウントが決まると捨てる（FR-48 の 1、2）
    how: 単体の層（保存の中身と聞き手を調べる）
  - checks: useAccount で替えたアカウントをほかのタブに知らせ、ほかのタブの知らせ、送る前の確かめ、タブが前に出たときと 422 IDEMPOTENCY_KEY_REUSED を受けたときの確かめで替わったら、そのアカウントのものでない操作とタブの保存を捨てて onAccount に知らせ、ほかのタブに知らせ返さない
    how: 単体の層（同じページに作った BroadcastChannel をほかのタブとし、visibilitychange と pageshow を起こし、fetch の偽物が変える要求に 422 IDEMPOTENCY_KEY_REUSED を、その後の GET /v1/me にほかのアカウントを返す）
  - checks: 変える要求が 422 IDEMPOTENCY_KEY_REUSED を受けると、refused で返して同じキーで送り直さず、タブの保存から消す（DEC-42）
    how: 単体の層（fetch の偽物が受けた要求の数と、保存の中身を調べる）
  - checks: 同じ内容の定まっていない操作の二度目の begin が同じ操作を返し、送っている途中の操作の send が新しい要求を出さない（二度押し）
    how: 単体の層
  - checks: 最初の変える要求の答えを待つ間（evidence は notDone）と、アカウントを確かめている、間を置く、動いているのを待つ間の kept() が、keepAcrossReload の操作を捨てずにその状態のまま返し、要求を中止せず、その後の答えで操作が答えの判断表のとおりに定まる。kept() が捨てるのは、送っている途中でない evidence が notDone の操作と持つ長さを過ぎた操作だけ
    how: 単体の層。fetch の偽物が最初の変える要求の答えを止めておく間に kept() を呼び、その後に各答えを返す。判断表から作る
  - checks: keepAcrossReload の操作が、送っている途中の読み直しの後は答えがないとして同じキーで続き、送っている途中でなく evidence が notDone なら捨てられ、ほかのアカウントでは返らず、持つ長さを過ぎると捨てられ、タブの保存に決めた項目のほかを書かず、知らない項目を足した項目は読め、欠けた項目は消して unreadable に数える
    how: 単体の層（タブの保存を残したままモジュールを作り直し、保存の中身を調べる）
  - checks: DEC-35 の誤りの本文を ApiError に変え、知らない符号と項目を状態の組で扱う（DEC-41）。答えが生成した型に合わなければ投げる
    how: 単体の層
  - checks: 答えを失った返金と、最初の要求の答えを待つ間に画面を離れて戻った返金が、どちらも一度だけ行われる（FR-40 の 3、QR-45）。二つのタブで担当者を替えた後に、前の担当者の返金の操作が送られず、ほかの担当者の名で記録されない（FR-50 の 1、DRV-30）
    how: 端から端の層（試験の環境の偽物の設定）。報告書の「確かめ方」の答えを失った返金の場面、画面を離れて戻る返金の場面と、二つのタブでアカウントを替える場面
  - checks: 合わないパスワードで AUTH_FAILED を示してサインインの画面のまま入れ直させ、正しいパスワードでサインインできる（FR-48 の 1、2）
    how: 端から端の層。報告書の「確かめ方」のサインインの場面
parameters:
  - name: ELM-03 の操作を待つタイムアウト（IFC-01、IFC-10、IFC-12、IFC-14。送る前の確かめの GET /v1/me を含む）
    value: 15 秒
    basis: HND-18 の枠（DEC-46。ELM-03 の答えの期限と通信の余裕 5 秒の和より長い）。ELM-03 がこれらの操作に答える期限は 5 秒（HND-19 で MOD-20 が決めた暫定の値、DAS-17）で、その和の 10 秒より長く、返金の呼び出しの 15 秒（IFC-13）とそろえた暫定の値（DAS-16）
  - name: 答えがないときの自動の送り直し
    value: 3 回まで。前の要求をやめてから 1 秒、2 秒、4 秒置く
    basis: 担当者のコンピューターの短いつながりの切れを越える暫定の値（DAS-16）。一つの操作を自動で待つのは、確かめがすぐ答えれば最悪 67 秒と確かめの往復 4 回、確かめもタイムアウトの直前に答えれば最悪 127 秒（報告書の「設計上の値」の計算）。その後は画面が答えのないことを示し、担当者が同じキーで送り直す
  - name: 409 OPERATION_IN_PROGRESS の後の送り直しの上限
    value: 20 回（間は ELM-03 が返す Retry-After。DEC-42 では 1 秒）
    basis: 返金の答えの期限 8.8 秒（IFC-13）を Retry-After 1 秒で割った 8.8 回より多く、期限の後に ELM-03 が試みから答えるまで待てる暫定の値（DAS-16）
  - name: 答えのない操作をタブの保存に持つ長さ
    value: 最初に送ってから 23 時間
    basis: ELM-03 が冪等キーと最初の答えを持つ 24 時間（DEC-42）より 1 時間短くし、ELM-03 がキーを忘れた後に同じキーで送って新しい操作になることを避ける暫定の値（DAS-16）
  - name: 定まっていない操作の数の上限
    value: メモリに 50、タブの保存に 20
    basis: 担当者が一度に扱う操作は数件で（OPF-02、OPF-03）、タブの保存の大きさの限りに遠い暫定の値（DAS-16）
as_is: new
