id: MOD-26
title: 冪等キー
status: active
basis: inferred
basis_note: キーの範囲がアカウント、経路、キーの組であること、同じ範囲の同じ要求に最初の答えを X-Idempotent-Replayed とともに返し、中身の違う要求に 422 IDEMPOTENCY_KEY_REUSED を返すこと、外部を呼ばない操作は結果とキーと答えを一つの取引で書いて動いている印を書かないこと、外部を呼ぶ操作は呼ぶ前の取引でキーを答えの期限とともに動いているとして書き、期限のうちの送り直しに 409 OPERATION_IN_PROGRESS と Retry-After 1 秒、期限の後は試みの状態から DEC-45 の答えを書き、答えはキーが動いているときだけ書くこと、キーと最初の答えを 24 時間持つことは DEC-42 と DAT-26（入力）。結果が分からないと 202 で答えたお金の操作の送り直しにそのときの結果を答えて確かめを早めることは DEC-42 と DEC-45（入力）。答えの中の秘密（設定の符号、client secret）をキーの記録に書かず、送り直しのときに持ち主が作り直すことは、DAT-02 と IFC-07 の書かない決まりと DEC-42 の最初の答えを返す決まりをともに守る道として推定（MOD-36 は符号を作り直せ、MOD-43 は client secret を EXT-01 から読み直す）。期限の後の答えを経路ごとに持ち主に作らせることは推定
premises: []
component: ELM-03
name: 冪等キー
depth: full
depth_reason: 同じ冪等キーの要求が重なったとき、どれが効くかをキーの記録（DAT-26）が決め（同時に動く仕事と状態を分ける）、外部を呼ぶ操作のキーは答えの期限の後に試みの状態から答えを定める（結果が分からない状態の答え）
responsibility: 状態を変える要求を冪等キーの範囲ごとに一度だけ効かせ、送り直しに最初の答えを返す
visibility: internal
interface:
  - operation: "check(scope: KeyScope, requestHash: Digest, now: Instant) -> KeyCheck"
    pre: MOD-20 が、冪等キーの要る経路の操作を呼ぶ前に呼ぶ
    post: 判断表 A で、proceed（記録がないか 24 時間を過ぎた）、replay(answer)、replayPending(attemptId)（202 で答えたお金の操作）、reused、inProgress(retryAfter 1 秒)、overdue(attemptId) のどれかを返す。replay の答えに秘密の項目があれば、その経路の持ち主の rebuild で作り直してから返す
    errors: ["DatabaseUnavailable: 読めない（MOD-20 は 503 SERVICE_UNAVAILABLE にする）"]
  - operation: "recordAnswer(tx: Tx, scope: KeyScope, requestHash: Digest, answer: StoredAnswer) -> none"
    pre: 外部を呼ばない操作が、その操作の結果を書く同じ取引の中で、答えを決めた後に呼ぶ
    post: 範囲にキーと答えを answered として書く（秘密の項目は書かない）。同じ範囲の記録があれば KeyTaken で、呼ぶ側はその取引を止め、check からやり直してその答えを返す
    errors: ["KeyTaken: 同じ範囲の記録が先に確定した（一意の決まり）"]
  - operation: "startExternal(tx: Tx, scope: KeyScope, requestHash: Digest, attemptId: AttemptId, answerDueAt: Instant) -> none"
    pre: 外部を呼ぶ操作が、試みを書く取引 A の中で呼ぶ。answerDueAt はその経路の IFC の timing の答えの期限
    post: キーを in_progress として試みの ID と answerDueAt とともに書く
    errors: ["KeyTaken: 同じ範囲の記録が先に確定した（呼ぶ側は取引 A を止めて check からやり直す）"]
  - operation: "finishExternal(tx: Tx, scope: KeyScope, answer: StoredAnswer) -> written or alreadyAnswered(StoredAnswer)"
    pre: 結果を書く取引の中で呼ぶ
    post: キーがまだ in_progress のときだけ答えを書く。先に答えが書かれていれば alreadyAnswered と先の答えを返し、呼ぶ側はその答えで答える
    errors: []
  - operation: "answerOverdue(scope: KeyScope, attemptId: AttemptId) -> StoredAnswer"
    pre: check が overdue を返したとき
    post: その経路の持ち主が registerRoute で渡した答え方で試みの今の状態から答えを決め、キーがまだ in_progress のときだけ書き、書けた答えか先の答えを返す
    errors: ["DatabaseUnavailable"]
  - operation: "registerRoute(route: RouteName, owner: KeyOwner) -> none"
    pre: 起動のときだけ。外部を呼ぶ経路は overdueAnswer を、秘密を答える経路は rebuild を必ず渡す
    post: 経路ごとの、期限の後の答え方（DEC-45）と、秘密の項目の作り直し方を持つ
    errors: []
  - operation: "purgeBefore(at: Instant) -> integer"
    pre: 呼ぶのは MOD-68 だけ
    post: 最初に受けてから 24 時間を過ぎた記録を消し、消した数を返す
    errors: []
invariants:
  - 範囲（アカウント、経路、キー）ごとにキーの記録は一つ
  - 外部を呼ばない操作のキーは、その操作の結果と同じ取引で答えとともに書かれ、in_progress を持たない
  - 外部を呼ぶ操作のキーの答えは一度だけ書かれ、先に書かれた答えを置き換えない
  - キーの記録は秘密（設定の符号、client secret、パスワード）を持たない
depends_on: [MOD-21, MOD-23, MOD-25]
functions: [FR-30, FR-40]
realizes: []
drivers: [DRV-02, DRV-07, DRV-32]
decisions: [DEC-08, DEC-42, DEC-45]
behaviour: "報告書の節: MOD-26 冪等キー"
verification:
  - checks: 判断表 A の行ごと（記録なし、同じハッシュ、違うハッシュ、in_progress の期限の前と後、202 の答え、24 時間を過ぎた記録）
    how: 単体の層（時計の偽物）
  - checks: 同じキーの外部を呼ばない操作を重ね、一つだけが効き、ほかが同じ答えを X-Idempotent-Replayed で受ける
    how: 結合の層（依頼の状態を書くポートの差し込みで重ねる）
  - checks: 外部を呼ぶ操作の answerDueAt の前の 409 と、期限の後に試みの状態から DEC-45 の答えを受け、遅れた結果の取引が先の答えを置き換えない
    how: 結合の層（EXT-01 の偽物が答えない、遅れて答える。時計の偽物）
  - checks: 書き終えた後の応答を落とし、同じキーの送り直しが最初の答えを受ける（NFR-11）
    how: 結合の層（端末とのつながりの偽物）
  - checks: キーの記録に設定の符号と client secret が書かれず、送り直しに同じものが答えられる
    how: 結合の層
parameters: []
as_is: new
