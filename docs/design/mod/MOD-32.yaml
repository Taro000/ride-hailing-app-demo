id: MOD-32
title: 日々の処理
status: active
basis: assumed
basis_note: 毎日 04:00（Asia/Tokyo）に起こされてその日の処理を一度だけ行い、仕事を期限を過ぎた処理、照合、記録の変換と鍵を捨てること、保持期間を過ぎた記録を消すこと、確かめ、終えた記録の順に行うこと、その日を取ったことを止まったとみなす時刻とともに書いてから行い、その時刻を過ぎた呼び出しが取り直し、取り直された実行は書けずに止まること、仕事の一部が失敗したら失敗を書いて取ったことを外して 500 JOB_FAILED を返すこと、すべて済んだら終えた記録をログに書くことは IFC-15、DAT-27、DEC-18、DEC-20（入力）。終えた記録の項目は IFC-15 と POL-05（入力）。日々の処理の時間の上限、Cloud Scheduler とローカルの定期の呼び出しの期限と再試行は HND-19 を、想定の本番のアラートが終えた記録を待つ時間は HND-10 を決めたもので、DAS-20 による暫定の決定（infra/gcp/ と infra/local/ の設定にこの値を入れる）。期限の来た処理（MOD-31、jobs/）と同じディレクトリに置くと機能の間に import の循環ができるため、daily/ に置いたことは POL-02 の依存の規則（入力）に従うよう FND-69 を受けた。日々の呼び出しが通る想定の本番の Cloud Run のサービスの要求の時間の上限を、呼び出しの期限より長く parameters に置いたことは FND-70 を（既定が 300 秒で上限が 60 分であることは Cloud Run の公開の文書による）、期限を過ぎた処理を拾い続ける終わりを parameters と DAS-20 に置いたことは FND-71 を受けた
premises: [DAS-20]
component: ELM-03
name: 日々の処理
depth: full
depth_reason: その日の処理を一度だけ済ませ、取った実行が止まったら取り直す（同時に動く仕事と状態を分ける）。照合、記録の変換と鍵を捨てること、保持期間を過ぎた記録を消すことを、決まった順に一度ずつ行わせる
responsibility: 日々の呼び出しを受けて、その日の仕事を決まった順に一度だけ済ませる
visibility: public
interface:
  - operation: "runDaily(call: DailyCall) -> DailyAnswer"
    pre: MOD-20 が、想定の本番は Cloud Scheduler の OIDC の印を、ローカルは共有の秘密を確かめてから呼ぶ（IFC-15。確かめられなければ MOD-20 が 401 NOT_SIGNED_IN）
    post: 判断表 A で、その日（jobDate、Asia/Tokyo）を取り（実行の ID と staleAt を条件つきで書く）、終わっていない仕事を判断表 B の順に行い、仕事ごとの結果を取っているときだけ書き、すべて済んだら済んだとして書いてから終えた記録（daily_job_completed）をログに一行書き、200 を返す
    errors: ["alreadyCompleted: 200 でその日はすでに済んでいる", "JOB_IN_PROGRESS: 409。ほかの実行が取っていて staleAt を過ぎていない", "JOB_FAILED: 500。仕事の一部が失敗した（失敗を書いて取ったことを外す）"]
invariants:
  - 一つの jobDate に済んだ実行は一つ
  - 仕事の結果と終わりは、その実行がまだ取っているときだけ書かれる
  - 終えた記録は、その日のすべての仕事が済んだときだけ一度書かれる
depends_on: [MOD-21, MOD-23, MOD-24, MOD-25, MOD-28, MOD-31, MOD-44, MOD-67, MOD-68]
functions: [FR-51]
realizes:
  - IFC-15 POST /internal/jobs/daily
  - IFC-15 日々の処理を終えた記録
drivers: [DRV-21, DRV-23, DRV-24]
decisions: [DEC-17, DEC-18, DEC-20]
behaviour: "報告書の節: MOD-32 日々の処理"
verification:
  - checks: 判断表 A の行ごと（取っていない、済んだ、ほかが取っていて staleAt の前と後、失敗の後）と、取り直された実行が書けずに止まる
    how: 結合の層（日々の呼び出しの偽物が同じ形の要求で入口を呼ぶ、時計の偽物）
  - checks: 仕事の一部の失敗で 500 と取ったことを外し、次の呼び出しが終わっていない仕事から取り直す
    how: 結合の層（EXT-01 の偽物の一覧を失敗させる）
  - checks: 終えた記録の項目（個人の情報、依頼の ID、額を持たない、POL-05）
    how: 単体の層
  - checks: 止めて再開する予行で、日々の処理が取り直されて一度だけ済む（NFR-16）
    how: 運用の予行の層
parameters:
  - name: 日々の処理の時間の上限（取った時刻から staleAt まで、DAT-27）
    value: 20 分
    basis: HND-19。デモの量（OPF-02、OPF-03）での最悪の時間（照合の一覧の読み出し 1 ページ 10 秒を数ページ、結果が分からない試みの確かめ 4 秒を数件、記録の変換と削除）を数分と見込み、その数倍とした暫定の値（DAS-20）
  - name: Cloud Scheduler とローカルの定期の呼び出しの期限
    value: 25 分（Cloud Scheduler の HTTP の呼び出しの期限の上限 30 分のうち）
    basis: HND-19 の枠（呼び出しの期限は時間の上限より長い）（DAS-20）
  - name: 呼び出し手の再試行
    value: 失敗したら 5 回まで。間は 5 分から倍にして 15 分まで（最初の失敗から 5、15、30、45、60 分後）
    basis: HND-19 の枠（止まったとみなす時刻の後にも少なくとも一度届く）。止まった実行の staleAt は取った時刻の 20 分後で、3 回目以後の再試行（30 分以後）がその後に届く（DAS-20）
  - name: 想定の本番のアラートが終えた記録を待つ時間（infra/gcp/ の Cloud Monitoring のアラート）
    value: 予定の時刻（04:00）から 90 分
    basis: HND-10。最悪の正常な終わりは、最初の実行が上限の直前に止まって 30 分後の再試行が取り直し、上限の 20 分で終える 50 分ほどで、それより長い（DAS-20）
  - name: 期限を過ぎた処理を拾い続ける終わり（判断表 B の 1）
    value: 取った時刻と時間の上限の和の 5 分前（取ってから 15 分）
    basis: 後の仕事（照合、記録の変換と鍵を捨てること、保持期間を過ぎた記録を消すこと、確かめ）をデモの量（OPF-02、OPF-03）で数分と見込み、それを時間の上限のうちに残す暫定の値。拾い残した処理は期限のまま残り、インスタンスが動けば期限の来た処理が、次の日は次の実行が拾う（DAS-20）
  - name: 想定の本番の Cloud Run のサービスの要求の時間の上限（infra/gcp/ の Cloud Run のサービスの定義）
    value: 30 分
    basis: 日々の呼び出しは Cloud Run のサービスを通って届くので、呼び出しの期限 25 分より長くし、時間の上限 20 分、呼び出しの期限 25 分、要求の時間の上限 30 分の順にする（Cloud Run の上限 60 分のうち）。同じ上限は IFC-11 の流れを 30 分ごとに切るが、端末は IFC-11 のつなぎ直しで続きから受け直す（届け方は at-least-once）（DAS-20）
as_is: new
