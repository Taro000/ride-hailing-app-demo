  how: MSW の部品のテスト（201 で onRecorded、400 の文、対処済みの見出し）
- checks: 対処と確かめのダイアログの判断表 3 行
  how: 単体テスト
- checks: FR-47 AC1（対処の停止）
  how: Playwright（CUJ-14 の通し）
