id: MOD-02
title: 返金
status: active
basis: inferred
basis_note: 担当者が認めた額を返金し、拒否と答えのないことを示してやり直させ、決済が済んでいないものは受け付けず、料金を請求した依頼も返金できることは FR-39、合計を支払われた額までに限り、済んだ返金をもう一度行うと最初の結果を示し、答えのなかった返金のやり直しを一度だけ行い、別に認めた二つ目を行うことは FR-40、済まなかった返金も記録することは FR-50 の 3（入力）。操作、答え、符号（NOTHING_TO_REFUND、REFUND_EXCEEDS_PAID、REFUND_DECLINED、REFUND_PENDING、PAYMENT_SERVICE_UNAVAILABLE）と、やり直しが済んでいれば最初の結果を、分からなければ同じ試みを確かめた結果を答え、済まなかった返金（はっきり拒否されたか、決済サービスが処理しなかった）は返金できる残りの額を確かめ直して新しい試みを作ることは IFC-13、返金の状態は第 3 段階の報告の「要素をまたぐ状態」の返金（DAT-12）、結果が分からないときと処理されなかったときの答えは DEC-45、外部を呼ぶ操作の 503 を同じキーで送り直さずに今の状態を読み直すことは DEC-35、冪等キーは DEC-42、額の表し方は DEC-38、返金を試みごとに記録して拒否のやり直しを新しい試みにすることは DEC-10（どれも入力）。答えを失ったやり直しで二重に返金される失敗のシナリオは QR-45（入力）。画面の状態、判断表、一回の「返金する」を一つの操作にしてタブを読み直した後も同じキーで続けること、答えのない間に新しい返金を受け付けないこと、失敗の答えを済まなかったと示さないことは推定。額と返金できる残りの額を画面で求めないことは DRV-31 による。残した操作を MOD-01 の evidence で答えがないか失敗の答えに分け、効いていない操作を MOD-01 に捨てさせることは FND-46 を、読み込み中の一覧の読みの 429 とほかの 4xx の移り先は FND-47 を、タブのアカウントが変わると画面を終えることは FND-44 を受けた（推定）
premises: []
component: ELM-02
name: 返金
depth: full
depth_reason: 担当者が認めた額の返金を求め（お金を動かす）、答えのない返金の操作と結果が分からない返金（REFUND_PENDING）を、同じ返金のまま確かめて一つに定める（結果が分からない状態を確かめる）
responsibility: 一つの乗車か料金を請求した依頼の返金を示し、担当者が認めた返金とそのやり直しを、同じ返金を二度行わせずに送る
visibility: public
interface:
  - operation: "RideRefunds(rideId: RideId) -> 返金の画面"
    pre: rideId は、担当者が乗車の照会（MOD-12）で選んだ乗車か、料金を請求した依頼の ID。担当者がサインインしている
    post: GET /v1/console/rides/{rideId}/refunds を読み、その乗車の返金（認めた担当者、額、済んだ、済まなかったとその理由（はっきり拒否されたか、決済サービスが処理しなかったか）、分からない）と返金できる残りの額を、ELM-03 の値のまま示す。状態遷移図と判断表のとおりに、新しい返金（額を入れて確かめてから、POST /v1/console/rides/{rideId}/refunds を MOD-01 の一つの操作として送る）、確かめる（分からない返金の POST /v1/console/refunds/{refundId}/retry）、やり直す（済まなかった返金の同じ操作）を受け付け、答えを判断表のとおりに示してから一覧を読み直す。refund.settled（IFC-11）とつなぎ直し（MOD-03）でも読み直す。開いたとき、MOD-01 の kept() がこの乗車の返金の操作を返せば、新しい返金を受け付けず、送っている途中ならその答えを待ち、ほかは evidence のとおりに答えがないか失敗の答えとして、同じキーで送ることを受け付ける。kept() が読めなかった項目を数えれば、一覧で確かめてから返金するよう示す。タブのアカウントが変わると画面を終える（MOD-10 が新しいアカウントの画面に移す）
    errors:
      - "NOTHING_TO_REFUND（409）: 返金できないことを示し、返金しない（FR-39 の 4）"
      - "REFUND_EXCEEDS_PAID（422）: 返金しなかったことと、答えの返金できる残りの額を示す（FR-40 の 1。やり直しで残りが足りないときも）"
      - "REFUND_DECLINED（402）: 済んでいないことと理由を示し、やり直すを受け付ける（FR-39 の 2）"
      - "PAYMENT_SERVICE_UNAVAILABLE（503）: 済んでいないことと、決済サービスが処理しなかったことを示し、同じキーで送り直さずに一覧を読み直して、済まなかった返金のやり直しを受け付ける（FR-39 の 2、DEC-35、IFC-13）"
      - "ほかの符号の 503: 受け付けなかったことを示し、同じキーで送り直さずに一覧を読み直す（DEC-35）"
      - "REFUND_PENDING（202）: 済んだかどうか分からないことを示し、refund.settled を待ち、確かめるを受け付ける（FR-39 の 2、FR-40 の 3）"
      - "VALIDATION_FAILED（400）: 額の誤りを示す"
      - "NOT_FOUND（404）: 乗車か返金が見つからないことを示して読み直す"
      - "NOT_ALLOWED（403）: この機能を使えないことを示す（FR-49 の 1）"
      - "NOT_SIGNED_IN（401）: 使い始め（MOD-09）に移り、残した操作は同じアカウントがサインインし直した後に同じキーで送らせる"
      - "答えがない、503 でない 5xx、429: 済んだかどうか分からないことを示し、同じ返金として同じキーで送ることを受け付ける。済まなかったとは示さない"
      - "一覧の読みに答えがない、5xx、429、ほかの 4xx: 読めなかったことを示し（429 は待つ時間）、読み直させる"
invariants:
  - 担当者が額を確かめた一回の「返金する」は MOD-01 の一つの操作で、そのどの送りも同じ冪等キーで送る
  - この乗車に MOD-01 が残した返金の操作（kept() が返すもの）がある間は、新しい返金の操作を作らない
  - 一覧の返金の確かめとやり直しは、その返金の ID への POST /v1/console/refunds/{refundId}/retry だけで行い、POST /v1/console/rides/{rideId}/refunds を作らない
  - 返金の操作は MOD-01 の keepAcrossReload で始め、evidence が unanswered の間は、タブのアカウントが変わらない限り、タブを読み直しても同じキーで続き、担当者はやめられない
  - 結果が分からない返金（答えがない、503 でない 5xx、429、REFUND_PENDING）を、済まなかったとも済んだとも示さない。済まなかったと示すのは、REFUND_DECLINED と PAYMENT_SERVICE_UNAVAILABLE の答えと、一覧の refund_failed だけ
  - 503 を受けて定まった返金の操作を同じキーで送り直さない
  - 額と返金できる残りの額は ELM-03 が答えた値だけを示し、画面で求めない
depends_on: [MOD-01, MOD-03, MOD-08]
functions: [FR-39, FR-40, FR-50]
realizes:
  - IFC-24 返金
  - IFC-13 GET /v1/console/rides/{rideId}/refunds
  - IFC-13 POST /v1/console/rides/{rideId}/refunds
  - IFC-13 POST /v1/console/refunds/{refundId}/retry
  - IFC-11 refund.settled
drivers: [DRV-30]
decisions: [DEC-10, DEC-35, DEC-38, DEC-42, DEC-45]
behaviour: "報告書の節: MOD-02 返金"
verification:
  - checks: 判断表 A（返金の状態ごとに示すことと受け付ける操作）、新しい返金を受け付けるかの表、開いたときの残した操作の表
    how: 単体の層（Vitest の Browser Mode、Chromium）。MOD-01 の偽物（呼び出しの部品の偽物、POL-03）が返金の一覧と残した操作を返す。判断表から作る
  - checks: 判断表 B（定まった答え）と判断表 C（定まらない答えと evidence）のどの行も（新しい返金とやり直しのそれぞれ。503 PAYMENT_SERVICE_UNAVAILABLE とほかの符号の 503、dropped を含む）
    how: 単体の層。MOD-01 の偽物が各答えと evidence を返す。判断表から作る
  - checks: 状態遷移図のどの遷移と、どの状態での出来事の表（二度押し、送っている間の refund.settled、一覧の読みの各答え、画面を離れる、タブを読み直す、タブのアカウントが変わる）
    how: 単体の層。MOD-01 と MOD-03 の偽物（流れの部品の偽物）と時計の偽物
  - checks: 額の確かめの表の文（空、整数でない、1 より小さい、示した残りを超える）と、読めなかった残した操作の知らせ
    how: 単体の層
  - checks: 返金が済む、拒否されてやり直しで済む、決済サービスが処理しなかった返金を済まなかったと示してやり直しで済ませる、答えがなく分からないと示してから refund.settled で済んだと示す、残りを超える、決済が済んでいない、二つ目に認めた返金（CUJ-15、FR-39、FR-40、FR-50 の 3）
    how: 端から端の層（試験の環境の偽物の設定。EXT-01 の偽物が拒否し、実行の前に退け、答えず、後で済んでいたと見せる、POL-03）
  - checks: 答えを失った返金と、答えのない間にタブを読み直した返金が、どちらも一度だけ行われる（FR-40 の 3、QR-45）
    how: 端から端の層。Playwright が要求を ELM-03 に通してから答えを落とし、送り直しとタブの読み直しの後に、その乗車の返金が一つで済んだことを確かめる
  - checks: 答えのない返金を残したタブのほかのタブで担当者を替えると、返金の画面が終わって前の担当者の操作が送られず、その乗車の返金が一つのまま（FR-40 の 3、DRV-30）
    how: 端から端の層。報告書の「確かめ方」の二つのタブでアカウントを替える場面
parameters: []
as_is: new
