id: MOD-02
title: 返金
status: active
basis: inferred
basis_note: 担当者が認めた額を返金し、拒否と答えのないことを示してやり直させ、決済が済んでいないものは受け付けず、料金を請求した依頼も返金できることは FR-39、合計を支払われた額までに限り、済んだ返金をもう一度行うと最初の結果を示し、答えのなかった返金のやり直しを一度だけ行い、別に認めた二つ目を行うことは FR-40（入力）。操作、答え、符号（NOTHING_TO_REFUND、REFUND_EXCEEDS_PAID、REFUND_DECLINED、REFUND_PENDING）と、やり直しが済んでいれば最初の結果を、分からなければ同じ試みを確かめた結果を、拒否なら新しい試みを答えることは IFC-13、返金の状態は第 3 段階の報告の「要素をまたぐ状態」の返金（DAT-12）、結果が分からないときの答えは DEC-45、冪等キーは DEC-42、額の表し方は DEC-38、返金を試みごとに記録して拒否のやり直しを新しい試みにすることは DEC-10（どれも入力）。答えを失ったやり直しで二重に返金される失敗のシナリオは QR-45（入力）。画面の状態、判断表、一回の「返金する」を一つの操作にしてタブを読み直した後も同じキーで続けること、答えのない間に新しい返金を受け付けないこと、失敗の答えを済まなかったと示さないことは推定。額と返金できる残りの額を画面で求めないことは DRV-31 による
premises: []
component: ELM-02
name: 返金
depth: full
depth_reason: 担当者が認めた額の返金を求め（お金を動かす）、答えのない返金の操作と結果が分からない返金（REFUND_PENDING）を、同じ返金のまま確かめて一つに定める（結果が分からない状態を確かめる）
responsibility: 一つの乗車か料金を請求した依頼の返金を示し、担当者が認めた返金とそのやり直しを、同じ返金を二度行わせずに送る
visibility: public
interface:
  - operation: "RideRefunds(rideId: RideId) -> 返金の画面"
    pre: rideId は、担当者が乗車の照会（MOD-12）で選んだ乗車か、料金を請求した依頼の ID。担当者がサインインしている
    post: GET /v1/console/rides/{rideId}/refunds を読み、その乗車の返金（認めた担当者、額、済んだ、済まなかったと理由、分からない）と返金できる残りの額を、ELM-03 の値のまま示す。状態遷移図と判断表のとおりに、新しい返金（額を入れて確かめてから、POST /v1/console/rides/{rideId}/refunds を MOD-01 の一つの操作として送る）、確かめる（分からない返金の POST /v1/console/refunds/{refundId}/retry）、やり直す（済まなかった返金の同じ操作）を受け付け、答えを判断表のとおりに示してから一覧を読み直す。refund.settled（IFC-11）とつなぎ直し（MOD-03）でも読み直す。開いたとき、この乗車の答えのないか失敗の答えを受けた返金の操作が MOD-01 に残っていれば、新しい返金を受け付けず、その操作を同じキーで送ることだけを受け付ける。401 だけを受けた操作は何もしていないため捨てる
    errors:
      - "NOTHING_TO_REFUND（409）: 返金できないことを示し、返金しない（FR-39 の 4）"
      - "REFUND_EXCEEDS_PAID（422）: 返金しなかったことと、答えの返金できる残りの額を示す（FR-40 の 1）"
      - "REFUND_DECLINED（402）: 済んでいないことと理由を示し、やり直すを受け付ける（FR-39 の 2）"
      - "REFUND_PENDING（202）: 済んだかどうか分からないことを示し、refund.settled を待ち、確かめるを受け付ける（FR-39 の 2、FR-40 の 3）"
      - "VALIDATION_FAILED（400）: 額の誤りを示す"
      - "NOT_FOUND（404）: 乗車か返金が見つからないことを示して読み直す"
      - "NOT_ALLOWED（403）: この機能を使えないことを示す（FR-49 の 1）"
      - "NOT_SIGNED_IN（401）: 使い始め（MOD-09）に移り、答えのない操作は同じアカウントがサインインし直した後に同じキーで送らせる"
      - "答えがない、5xx、429: 済んだかどうか分からないことを示し、同じ返金として同じキーで送ることを受け付ける。済まなかったとは示さない"
invariants:
  - 担当者が額を確かめた一回の「返金する」は MOD-01 の一つの操作で、そのどの送りも同じ冪等キーで送る
  - この乗車に、答えを受けていないか失敗の答えを受けた返金の操作がこのタブにある間は、新しい返金の操作を作らない
  - 一覧の返金の確かめとやり直しは、その返金の ID への POST /v1/console/refunds/{refundId}/retry だけで行い、POST /v1/console/rides/{rideId}/refunds を作らない
  - 返金の操作は MOD-01 の keepAcrossReload で始め、答えのない間はタブを読み直しても同じキーで続く
  - 結果が分からない返金（答えがない、5xx、429、REFUND_PENDING）を、済まなかったとも済んだとも示さない
  - 額と返金できる残りの額は ELM-03 が答えた値だけを示し、画面で求めない
depends_on: [MOD-01, MOD-03, MOD-08]
functions: [FR-39, FR-40, FR-50]
realizes:
  - IFC-24 返金
  - IFC-13 GET /v1/console/rides/{rideId}/refunds
  - IFC-13 POST /v1/console/rides/{rideId}/refunds
  - IFC-13 POST /v1/console/refunds/{refundId}/retry
  - IFC-11 refund.settled
drivers: [DRV-30]
decisions: [DEC-10, DEC-35, DEC-38, DEC-42, DEC-45]
behaviour: "報告書の節: MOD-02 返金"
verification:
  - checks: 判断表 A（返金の状態ごとに示すことと受け付ける操作）と、新しい返金を受け付けるかの表
    how: 単体の層（Vitest の Browser Mode、Chromium）。MOD-01 の偽物（呼び出しの部品の偽物、POL-03）が返金の一覧を返す。判断表から作る
  - checks: 判断表 B のどの行も（新しい返金とやり直しのそれぞれの答え）
    how: 単体の層。MOD-01 の偽物が各答えと、答えがない、失敗の答え、401 の前の答えを返す。判断表から作る
  - checks: 状態遷移図のどの遷移と、どの状態での出来事の表（二度押し、送っている間の refund.settled、画面を離れる、タブを読み直す）
    how: 単体の層。MOD-01 と MOD-03 の偽物（流れの部品の偽物）と時計の偽物
  - checks: 額の確かめの表の文（空、整数でない、1 より小さい、示した残りを超える）
    how: 単体の層
  - checks: 返金が済む、拒否されてやり直しで済む、答えがなく分からないと示してから refund.settled で済んだと示す、残りを超える、決済が済んでいない、二つ目に認めた返金（CUJ-15、FR-39、FR-40）
    how: 端から端の層（試験の環境の偽物の設定。EXT-01 の偽物が拒否し、答えず、後で済んでいたと見せる、POL-03）
  - checks: 答えを失った返金と、答えのない間にタブを読み直した返金が、どちらも一度だけ行われる（FR-40 の 3、QR-45）
    how: 端から端の層。Playwright が要求を ELM-03 に通してから答えを落とし、送り直しとタブの読み直しの後に、その乗車の返金が一つで済んだことを確かめる
parameters: []
as_is: new
