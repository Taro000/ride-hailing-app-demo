id: DRV-04
title: お金は確定した額で一度だけ動き、Stripe の記録と一致する
status: draft
version: 1
basis: inferred
basis_note: シナリオは QR-09・QR-32・QR-17・QR-04・QR-49 と NFR-04・06・07・08・25・44 から（入力）。Stripe は質問 6 で確認済み。押さえの増額の条件は Stripe の文書から。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 押さえ、押さえ直し、請求（運賃、キャンセル料、不在の料金）、返金は、サーバーが確定した額で一度だけ起き、Stripe の記録と一致する
sources: [QR-09, QR-32, QR-17, QR-04, QR-49, QR-07, NFR-04, NFR-06, NFR-07, NFR-08, NFR-25, NFR-44, NFR-45, SLI-04, FR-04, FR-05, FR-07, FR-12, FR-27, FR-29, FR-30, FR-31, FR-49, FR-50, FR-55, TC-10]
concern_of: [USR-01, USR-02, USR-04]
scenario:
  source: 乗客・ドライバー・運営・サポート担当の操作、Stripe、突き合わせの処理
  stimulus: 押さえ、押さえ直し、請求、返金の操作が届く。同じ操作が二度届く。Stripe が失敗するか応答しない。一日が終わる
  artifact: お金の動き（FR-05、FR-07、FR-12、FR-27、FR-29、FR-30、FR-31、FR-50）と記録（FR-49、FR-55）
  environment: デモの回。決済は Stripe のテスト環境（TC-10）。押さえの増額はカードが対応するときだけ使える。携帯の回線でのやり直しがある
  response: どのお金の動きも、サーバーが確定した額で一度だけ起きる。応答のない請求は失敗と扱わず同じキーで確かめ、乗客は待たずに降りられ「請求を確かめています」と示す。失敗は未払いにする。迎車が遅れて無料になる取り消しと、位置を確かめられなかった到着には料金を取らない。押さえ・請求・返金が Stripe の記録と一致し、ずれは知らされる
  measure: 誤りと二重の請求の検出 0 件（NFR-07）。決済・請求・返金の CI のゲートがすべて通る（NFR-08）。乗車の終了から請求の結果の記録まで 10 秒以内（NFR-25）。直近 28 日で突き合わせた乗車の 99% が一致（NFR-04、SLI-04）。前日分の突き合わせの締め（NFR-06。動かす時間の前提は品質チェーンへの課題 1）。デモの前にテスト環境への接続を確かめる（NFR-44）
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: QR-09、QR-32 が重視（CUJ-03、08、16）
  difficulty: high
  difficulty_reason: Stripe に頼り、決済の組み込みは初めて（PC-03）。結果が分からない請求、押さえからの一部の請求、押さえの増額（カードが対応するときだけ）、記録の取り出しと突き合わせ。作った後に戻しにくい
  rank: 3
primary: true
conflicts:
  - with: DRV-26
    note: 決済の組み込みは初めて。押さえの増額（FR-12）はカードが対応するときだけ使え、対応しないときの扱いを決める必要がある（第 2 段階）
  - with: DRV-11
    note: 品質チェーンで解き済み。Stripe を待つ時間とやり直しが 10 秒（NFR-25）に入るが、乗客は待たずに降り「請求を確かめています」と示す（FR-29）
  - with: DRV-08
    note: 品質チェーンで解き済み。D_arrival は誤差を見込み、誤差が大きいときは受け付けて印を付け、料金を取らない（FR-25、FR-27）
  - with: DRV-06
    note: 品質チェーンで解き済み。キャンセル料の判定に使う許諾のときの到着予定を記録する（FR-10）。精度は DRV-06
placeholders:
  - name: T_cancel_grace
    meaning: 許諾のときに示した到着予定から、迎車が何分遅れたらキャンセル料をかけないか
    from: FR-07
  - name: D_arrival
    meaning: 乗る場所から何メートル以内なら到着を受け付けるか（50 m を提案）
    from: FR-25、NFR-14
  - name: T_noshow_wait
    meaning: 乗車場所に着いてから何分待てば不在として終えられるか
    from: FR-27
