id: DRV-04
title: お金は確定した額で一度だけ動き、使わなくなった押さえは残らず、Stripe の記録と一致する
status: draft
version: 4
basis: inferred
basis_note: シナリオは QR-09・QR-32・QR-17・QR-04・QR-49・QR-07 と NFR-04・06・07・08・25・44 から（入力）。Stripe は質問 6 で確認済み。押さえの増額の条件は Stripe の文書から。押さえの結果が分からないときの扱い（FR-05・12）、システムの取り消し（FR-08）、失敗と分かった後の新しいキー（FR-30・50）、疑わしい到着の扱い（QR-49）は品質チェーンの再実行（2026-11-03）の入力。T_hold_wait の値は設計が決める。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 押さえ、押さえ直し、請求（運賃、キャンセル料、不在の料金）、返金は、サーバーが確定した額で一度だけ起き、使わなくなった押さえは残らず、Stripe の記録と一致する
sources: [QR-09, QR-32, QR-17, QR-04, QR-49, QR-07, NFR-04, NFR-06, NFR-07, NFR-08, NFR-25, NFR-44, NFR-45, SLI-04, FR-04, FR-05, FR-07, FR-08, FR-12, FR-27, FR-29, FR-30, FR-31, FR-49, FR-50, FR-55, TC-07, TC-10]
concern_of: [USR-01, USR-02, USR-04]
scenario:
  source: 乗客・ドライバー・運営・サポート担当の操作、Stripe、時刻、突き合わせの処理
  stimulus: 押さえ、押さえ直し、請求、返金の操作が届く。同じ操作が二度届く。Stripe が失敗するか応答せず、押さえや請求の結果が分からない。失敗と分かった請求や返金をやり直す。手配から T_request_max を過ぎて許諾のない依頼が取り消される。一日が終わる
  artifact: お金の動き（FR-05、FR-07、FR-08、FR-12、FR-27、FR-29、FR-30、FR-31、FR-50）と記録（FR-49、FR-55）
  environment: デモの回。決済は Stripe のテスト環境（TC-10）。押さえの増額はカードが対応するときだけ使える。携帯の回線でのやり直しがある
  response: どのお金の動きも、サーバーが確定した額で一度だけ起きる。結果が分からない押さえは、依頼を示さず（降車場所の変更では降車場所を変えず）確かめ、T_hold_wait までに分からなければ手配（変更）をやめ、押さえが残っていれば解放する。「押さえていない」と示すのは Stripe が答えたときだけ。押さえ直しの後に古い押さえを残さない。システムが取り消した依頼は押さえをすべて解放し、料金を取らない。応答のない請求は失敗と扱わず同じキーで確かめ、乗客は待たずに降りられ「請求を確かめています」と示す。失敗は未払いにし、失敗と分かった後の払い直しと返金のやり直しは新しいキーで行う。迎車が遅れて無料になる取り消しと、位置を確かめられなかった到着には料金を取らない。疑わしい印の付いた到着にも規則どおりに請求し、運営・サポート担当が毎日の一覧で見て偽りなら返金する。押さえ・請求・返金が Stripe の記録と一致し、ずれは知らされる
  measure: 誤りと二重の請求の検出 0 件（NFR-07。押さえ直しの後に残る古い押さえ、取り消した依頼や手配をやめた依頼に残る押さえ、システムが取り消した依頼へのキャンセル料を含む）。決済・請求・返金の CI のゲートがすべて通る（NFR-08）。乗車の終了から請求の結果（成功か失敗）の記録まで 10 秒以内で、10 秒の内に結果のないもの（確かめ中）も超えたと数える（NFR-25）。直近 28 日で突き合わせた乗車の 99% が一致（NFR-04、SLI-04）。前日分の突き合わせの締め（NFR-06。デモの期間の中は毎日の処理が毎朝動く。TC-07）。最初のデモの前に、Stripe のテスト環境への接続と FR-55 の突き合わせを確かめる（NFR-44）
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: QR-09、QR-32 が重視（CUJ-03、08、16）
  difficulty: high
  difficulty_reason: Stripe に頼り、決済の組み込みは初めて（PC-03）。結果が分からない押さえと請求、押さえからの一部の請求、押さえの増額（カードが対応するときだけ）と古い押さえの取り消し、失敗の後の新しいキー、記録の取り出しと突き合わせ。作った後に戻しにくい
  rank: 3
primary: true
conflicts:
  - with: DRV-26
    note: 決済の組み込みは初めて。押さえの増額（FR-12）はカードが対応するときだけ使え、対応しないときの扱いを決める必要がある（第 2 段階）
  - with: DRV-11
    note: 品質チェーンで解き済み。Stripe を待つ時間とやり直しが 10 秒（NFR-25）に入るが、乗客は待たずに降り「請求を確かめています」と示す（FR-29）
  - with: DRV-08
    note: 品質チェーンで解き済み。D_arrival は誤差を見込み、誤差が大きいときは受け付けて印を付け、料金を取らない（FR-25、FR-27）
  - with: DRV-06
    note: 品質チェーンで解き済み。キャンセル料の判定に使う許諾のときの到着予定を記録する（FR-10）。精度は DRV-06
  - with: DRV-18
    note: 解いた（FND-18）。デモの期間の終わりに、確かめ中のお金の操作や確定も解放もしていない押さえが残ったまま期間を終えると、確かめる実行がなくなり、押さえは Stripe の側で 7 日で取り消される。残ったときだけ期間を延ばす（TC-07。第 2 段階の DEC-37、第 2 段階の質問 17）
placeholders:
  - name: T_cancel_grace
    meaning: 許諾のときに示した到着予定から、迎車が何分遅れたらキャンセル料をかけないか
    from: FR-07
  - name: D_arrival
    meaning: 乗る場所から何メートル以内なら到着を受け付けるか（50 m を提案）
    from: FR-25、NFR-14
  - name: T_noshow_wait
    meaning: 乗車場所に着いてから何分待てば不在として終えられるか
    from: FR-27
  - name: T_hold_wait
    meaning: 押さえの結果が分からないときに、確かめ続ける上限。値は設計が決める（今は第 3 段階の DEC-52 の 60 秒）
    from: FR-05、FR-12
  - name: T_request_max
    meaning: 手配から許諾がないまま何分過ぎたら、システムが依頼を取り消すか（仮に 30 分。T_match_wait より長い。品質チェーンで要合意）
    from: FR-08
