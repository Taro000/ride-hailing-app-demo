id: DRV-24
title: エンジニアは一件の依頼を、端末から外部のサービスとのやり取りまでたどれる
status: active
basis: assumed
basis_note: QR-41（重視）と QR-33、QR-53、QR-37（最低限守る線）から、障害を調べる人が一件の依頼を端から端までたどる観測の要求として書いた（推定）。何をどこに記録しどう集めるかは第 2 段階から決める。T_alert_delay の値は QAS-37 による。順位は質問 6 で確認済み
premises: [OPF-01, QAS-37]
kind: observability
statement: エンジニアは、知らされた異常からその依頼を探し、乗客とドライバーの端末で起きたエラー、システムの各部分が行ったこと、EXT-01 と EXT-02 とのやり取り、保存した状態の変化を、欠けた段階なく時刻の順にたどり、異常が起きた部分を見つけられる。異常は漏れなく知らされる
sources: [QR-41, QR-33, QR-53, QR-37, FR-33, FR-34, FR-52, NFR-38, NFR-14, NFR-37, NFR-39]
concern_of: [USR-03, USR-04]
scenario:
  source: 異常の知らせを受けたエンジニア（USR-03）
  stimulus: 配車の手配、乗車、決済などの機能で、異常やエラーが起きる（乗客とドライバーの端末の中で起きたものを含む）
  artifact: 異常の知らせ（FR-33）、一件の依頼の経過（FR-34）、端末で起きたエラーの記録（FR-52）
  environment: デモの回の間（OPF-01）と、その後 N_trace_retention_days の間。端末はつながらない間があり、個人の情報は隠れている（DRV-29）
  response: 異常は漏れなく知らされ、エンジニアはその依頼でシステムと端末に起きたことを欠けなくたどって、異常が起きた部分を見つける
  measure: NFR-38 のゲート、NFR-14 の監視、NFR-37 のゲート、NFR-39 の監視
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: QR-41 は CUJ-10、CUJ-14、CUJ-15 の組で重視
  difficulty: medium
  difficulty_reason: 端末のエラーをつながらない間も失わずに後から受け、システムの各部分と外部のサービスとのやり取りを依頼に結び付け、隠した個人の情報のままでたどれるようにする
  rank: 11
primary: true
conflicts:
  - with: DRV-29
    note: 個人の情報を隠しても、同じ乗客と同じドライバーの依頼であることは分かり（FR-35）、たどることを妨げない（品質チェーンが QR-33 と QR-34 に書いた扱い）
  - with: DRV-21
    note: 依頼の経過をたどる記録を取り出せる日数は、保存期間を超えない（品質チェーンが QR-37 と QR-59 に書いた扱い）
placeholders:
  - name: N_trace_retention_days
    meaning: 依頼の経過をたどる記録を、その依頼から取り出せる日数
    from: QR-37
