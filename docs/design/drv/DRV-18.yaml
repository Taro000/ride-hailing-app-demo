id: DRV-18
title: デモの回と期間だけ Cloud Run を使い、ふだんは手元で同じ形で開発する
status: draft
version: 4
basis: inferred
basis_note: 実行の場所は質問 1・2・4・9 で確認済み（利用者の入力の「ローカルだけで完結」を質問 1 で直した）。毎日の処理のジョブをデモの期間だけ有効にすることは第 2 段階の質問 1、デモの期間の読み方は質問 12、期間の終わりの延長（お金の操作が残ったとき）は第 2 段階の質問 17（FND-18）で確認済み。交渉できないことは質問 9 で確認済み（足した部分も交渉できないことは推定。質問 15 は回答なし）。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: constraint
statement: サーバーはデモの回（と確かめのための短い間）だけ Cloud Run に出し、毎日の処理のジョブと定時の起動はデモの期間だけ有効にする。デモの期間は、最後の回の翌朝の処理のあとに、確かめ中のお金の操作、確定も解放もしていない押さえ、終わっていない依頼が残っていれば、それらが片付くまで延びる（TC-07）。それ以外のときは Cloud Run で何も動かさず、手元の機械で同じ形で開発する。Turso のデータはデモとデモの間も残す
sources: [TC-06, TC-07, TC-08]
concern_of: [STK-01]
scenario: null
negotiable: false
derived_from: []
priority:
  business: high
  business_reason: 交渉できない制約（TC-06〜08）
  difficulty: high
  difficulty_reason: Cloud Run はインスタンスが増減し、要求の外では CPU が割り当てられず、サーバーはデモの回にしか動かない（毎日の処理はデモの期間の朝だけ）。送り続ける接続（DRV-02、03）と時刻で動く処理（DRV-33）とぶつかる。手元と Cloud Run・Turso で同じ形を保つ。置き場所は作った後に替えにくい
  rank: 1
primary: true
conflicts:
  - with: DRV-02
    note: Cloud Run ではつなぎっぱなしの接続がインスタンスに縛られ、Turso には変化の知らせがない（第 2 段階）
  - with: DRV-03
    note: Cloud Run のインスタンスの増減の上で現在地を受け続ける（第 2 段階）
  - with: DRV-33
    note: サーバーはデモの回にしか動かず、Cloud Run では要求の外で CPU が割り当てられないのが既定。第 2 段階が DEC-05 で解いた（毎日の処理をデモの期間だけジョブで毎朝動かし、動かなかった分を次の実行で続ける）
  - with: DRV-04
    note: 解いた（FND-18）。デモの期間の終わりに、確かめ中のお金の操作や確定も解放もしていない押さえが残ったまま期間を終えると、確かめる実行がなくなり、押さえは Stripe の側で 7 日で取り消される。残ったときだけ期間を延ばす（TC-07。第 2 段階の DEC-37、第 2 段階の質問 17）
  - with: DRV-01
    note: 解いた（品質チェーンへの課題 1、回答の設計 1-1）。品質チェーンが NFR の条件を「サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く」に直し、デモの回の外のアラートの扱いを外した
  - with: DRV-16
    note: 解いた（品質チェーンへの課題 1、回答の設計 1-1）。本番に出すまでの時間を、次のデモの回を待たず、main に入って CI が通るまでで測る（QIU-28〜30 版 3）
  - with: DRV-13
    note: 障害の直前まで戻すには、Turso の復元の機能に頼るか、別の場所へ写し続ける（第 2 段階）
  - with: DRV-20
    note: 解いた。位置情報と画面の点灯に要る HTTPS の入口は、デモの回の Cloud Run が持つ（質問 1・9）
  - with: DRV-07
    note: 解いた。iOS の Safari で位置情報と画面の点灯を使う HTTPS の入口は、デモの回の Cloud Run が持つ（質問 1・9）
  - with: DRV-02
    note: 解いた。動き回る端末から届く HTTPS の入口は、デモの回の Cloud Run が持つ（質問 1・9）
  - with: DRV-03
    note: 解いた。動き回る端末から届く HTTPS の入口は、デモの回の Cloud Run が持つ（質問 1・9）
