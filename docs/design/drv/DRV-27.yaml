needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: observability
statement: SLI-01〜05 を二人が数えて同じ値になるだけの記録（入口のアクセスログ、状態の履歴、画面に示した時刻、現在地を受けた時刻、突き合わせの結果、時刻で動く処理の終わり、裏にあった時間）を、テスト用の印とともに欠けずに残す
sources: [QR-33, SLI-01, SLI-02, SLI-03, SLI-04, SLI-05, NFR-05, NFR-06, FR-01, FR-17, FR-38, FR-39, FR-43, FR-54, FR-55, PC-04, PC-05, TC-07]
concern_of: [USR-03, USR-04]
scenario:
  source: 参加者の操作、時刻で動く処理
  stimulus: 要求が入口に届く。状態が変わる。変化が相手の画面に示される。現在地が届く。突き合わせと履歴の確かめが動く
  artifact: 入口のアクセスログ（SLI-01）、状態の履歴（FR-39）、表示の記録（FR-54）、現在地の受信の記録（SLI-03）、突き合わせの結果（FR-55）、処理の終わりの記録（NFR-06）、裏にあった時間（FR-17）
  environment: デモの回は Cloud Run、毎日の処理はデモの期間だけ Cloud Run のジョブ（TC-07）。参加者 2 人、全体で乗車 2〜6 回（PC-05）。携帯の回線（表示の記録とブラウザのエラーは、切れている間ブラウザに残す）。テスト用アカウントが混じる。ログと監視は自前の最小構成（PC-04）
  response: どの出来事も測定点で、SLI が要る項目（request_id、trace_id、操作の名前、status、elapsed、アカウントの種類、変化の ID、時刻、相手、操作した人、位置）とともに残り、依頼とドライバーに結び付き、テスト用の印を持つ。位置は DRV-32 のとおり、履歴の記録には書かず、権限のある役割だけが読める形で持って変化に結び付ける
  measure: 直近 28 日で、終わった依頼の 99% の状態の履歴がそろう（NFR-05、SLI-05。全体で乗車 2〜6 回なので 1 件の欠けで割る。「どの変化にも位置」は第 2 段階の品質チェーンへの課題 5）。履歴の確かめの締め（NFR-06。デモの期間の中は毎日の処理が毎朝動く。TC-07）。ログの欠けは 0.1% 未満（SLI-01 の仮定）
