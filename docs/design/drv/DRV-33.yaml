    note: 毎日の処理はデモの期間だけ毎朝動き、期間の外では動かない（TC-07）。期間の中は品質チェーンの締めの時刻（NFR-06）に間に合う見込み（第 2 段階の DEC-05）。NFR の条件の「常時稼働し」は品質チェーンへの課題 1
