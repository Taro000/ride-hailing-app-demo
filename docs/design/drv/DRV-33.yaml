id: DRV-33
title: 時刻で動く処理は動かなかった間の分を続ける
status: draft
version: 2
basis: inferred
basis_note: FR-53・FR-55（受け入れ基準の「次の処理で残りを続ける」）と、サーバーがデモの回にしか動かず、毎日の処理がデモの期間だけ動くこと（質問 4・12、第 2 段階の質問 1）から導いた原則
needs_agreement: false
approver_candidates: []
kind: principle
statement: 時刻で動く処理（突き合わせ、履歴の確かめ、保存期間の処理、毎日の監視）は、動かなかった間（デモの期間の外、実行の失敗）の分を、次の実行で抜けなく続ける
sources: [FR-53, FR-55, NFR-06, TC-07, TC-08]
concern_of: [USR-03, USR-04]
scenario: null
negotiable: false
derived_from: [DRV-04, DRV-21, DRV-27, DRV-18]
priority: null
primary: false
conflicts:
