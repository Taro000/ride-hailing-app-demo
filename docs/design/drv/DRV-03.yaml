    note: 現在地を細かく送るほど、画面を点け続けるほど電池が減る（QR-27 と QR-06）。送る間隔は 10 秒を上限にし、最新性の求めより細かくしない
  - with: DRV-21
    note: 品質チェーンで解き済み。乗客の現在地は迎車中だけ、乗客が許可したときだけドライバーに見せる（FR-24）
  - with: DRV-18
    note: Cloud Run のインスタンスの増減の上で現在地を受け続ける（第 2 段階）
  - with: DRV-18
    note: 解いた。動き回る端末から届く HTTPS の入口は、デモの回の Cloud Run が持つ（質問 1・9）
