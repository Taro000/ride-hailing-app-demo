  difficulty: high
  difficulty_reason: 動く端末から携帯の回線で現在地を受け続ける。ブラウザは裏に回ると止まる。電池（DRV-12）と個人情報（DRV-21）と引き換えになる
  rank: 4
primary: true
conflicts:
