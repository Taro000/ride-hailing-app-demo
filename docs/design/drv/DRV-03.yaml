  response: 示す現在地と受付中の数が実際に追いつき、古いときはその古さを示す。裏に回ったドライバーは受付中に数えない
  measure: 直近 28 日で、使用中の参加者を毎分確かめたうちの 95% で、最後に届いた現在地が 30 秒（T_loc_fresh）以内（NFR-03、SLI-03）。送る間隔は 10 秒以下（NFR-03 の根拠にある仮の値）
