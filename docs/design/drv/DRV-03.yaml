id: DRV-03
title: 依頼、許諾、取り消し、迎車の到着が相手の画面にすぐ示される
status: active
basis: assumed
basis_note: シナリオは QR-06（重視）と NFR-07 の SLO（入力）から。T_dispatch_propagation の値と目標は QAS-25、着いたとみなす範囲の読みは QAS-52、相手の画面に示した時刻で数えること（FR-53 を今期作ること）は QAS-54 による（どれも品質チェーンの未確認の仮定。この段階では尋ねず、報告の「未確認の仮定」で評価し直した）。どこで時間がかかるか（QR-06 の basis_note が設計に確かめを求める点）は、第 3 段階が NFR-07 の遅延の予算で確かめる。アプリが前に出ていない間の扱いは、質問 2 で、乗客とドライバーが迎車を待つ間、迎車中、乗車中にアプリを画面に出したままにすると決まった。受付をしているドライバーの一覧（FR-18）のために、ドライバーが受付をしている間も出したままにすることは、設計の第 2 段階の質問 2 で確認済み（TC-18）。QCR-02 と QCR-03 は回答済みで、品質チェーンが反映するまで前提に残す。順位は質問 6 で確認済み
premises: [OPF-01, TC-13, TC-18, QAS-25, QAS-52, QAS-54, QCR-02, QCR-03]
kind: quality
statement: 乗客の依頼と取り消し、ドライバーの許諾と取り消し、ほかのドライバーの許諾、迎車が乗る場所に着いたことは、相手の画面、一覧、知らせに T_dispatch_propagation のうちに示され、迎車が着く前に着いたとは示されない
sources: [QR-06, NFR-07, SLI-14, FR-06, FR-07, FR-10, FR-18, FR-21, FR-23, FR-26]
concern_of: [USR-01, USR-02]
scenario:
  source: 乗客（USR-01）、ドライバー（USR-02）、乗る場所に着いた迎車
  stimulus: 乗客が依頼か取り消しをし、ドライバーが許諾か取り消しをする。迎車が乗る場所から D_pickup_position_gap のうちに着く
  artifact: 相手の画面、一覧、知らせ（FR-06、FR-07、FR-10、FR-18、FR-21、FR-23、FR-26）
  environment: デモの回の間（OPF-01）、相手の端末がつながっている間（つながっていない間の扱いは DRV-02）。端末は iOS の Safari で使う Web アプリ（TC-13）で、乗客とドライバーは迎車を待つ間、迎車中、乗車中に（質問 2）、ドライバーは受付をしている間も（TC-18）アプリを画面に出したままにする
  response: 変化は相手の画面、一覧、知らせに示され、迎車が着く前に着いたとは示されない
  measure: NFR-07 の SLO（SLI-14 で数える）
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: QR-06 は CUJ-01、CUJ-02、CUJ-06 の組で重視
  difficulty: high
  difficulty_reason: 二つの端末のあいだで変化をすぐ届け、相手の画面に示した時刻まで数える。iOS の Safari の Web アプリは前に出ていない間に処理が止まり、知らせはホーム画面に加えた Web アプリでしか届かない（DRV-14）。途切れたときの扱いで DRV-02 とも競合する
  rank: 5
primary: true
conflicts:
  - with: DRV-02
    note: 途切れた操作を確かめ直すと、相手に示すまでの時間が延びうる。つながっているときはすぐ示し、途切れたときは失わないことを先にする（品質チェーンが QR-02 と QR-06 に書いた扱い）
  - with: DRV-14
    note: アプリが前に出ていない間、ページは変化を受けて示せず、知らせはホーム画面に加えた Web アプリでしか届かない
placeholders:
  - name: T_dispatch_propagation
    meaning: 依頼、許諾、取り消しの操作や迎車の実際の到着から、相手の画面、一覧、知らせに示されるまでの時間
    from: QR-06
  - name: D_pickup_position_gap
    meaning: 迎車が乗る場所に着いたとみなす、乗る場所からの距離
    from: QR-06
