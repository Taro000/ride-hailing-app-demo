id: DRV-03
title: 現在地と受付の状態を新しく保つ
status: draft
version: 1
basis: inferred
basis_note: シナリオは QR-27・NFR-03・SLI-03 から（入力）。送る間隔 10 秒は第 4 段階の仮の値。対象のブラウザは質問 10 で確認済み。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
