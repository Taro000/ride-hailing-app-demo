id: DRV-30
title: 担当者とエンジニアの特別な操作と、料金にかかわる操作を一人ずつたどれる
status: active
basis: inferred
basis_note: 守る資産（返金、登録、停止の操作と、隠した個人の情報）と脅威（誰が行ったか分からない誤った登録、共用のアカウントでの閲覧、承認や不在をめぐる言い分の食い違い）は、QR-44（重視）と QR-35、QR-12（最低限守る線）の失敗のシナリオ（入力）から。セキュリティのリスク分析は品質要求のほかに脅威を挙げていない（質問 5 で確認済み）。順位は質問 6 で確認済み
premises: [CON-08]
kind: security
statement: 担当者による苦情の対応の記録、返金、アカウントの作成と訂正、試験用の区別の変更、ドライバーと車両の登録と訂正、停止と再開と、エンジニアが隠した個人の情報を見た操作は、誰が、いつ、何を（エンジニアは理由も）行ったかまで、一人ずつ、後から書き換えられない形でたどれる。乗客が料金を確かめて依頼、承認、取り消ししたことと、ドライバーが乗客の不在として終えたことと到着を確認したことも、後から否定できない形で示せる
sources: [QR-44, QR-35, QR-12, FR-35, FR-50, NFR-32, NFR-43]
concern_of: [USR-01, USR-03, USR-04]
scenario:
  source: 運営・サポートの担当者（USR-04）、エンジニア（USR-03）、苦情を寄せる乗客（USR-01）
  stimulus: 返金、登録、停止などの操作や、隠した個人の情報を見る操作をする。乗客が、承認していない、乗る場所で待っていた、と苦情を寄せる
  artifact: 担当者とエンジニアの操作の記録（FR-35、FR-50）と、料金の確かめ、取り消し、不在、到着の確認の記録
  environment: デモの回の間とその後
  response: どの操作も、誰が、いつ、何をしたかまで一人ずつたどれ、後から書き換えられない
  measure: NFR-32 のゲート、NFR-43 の監視
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: QR-44 は CUJ-14、CUJ-15、CUJ-16、CUJ-17、CUJ-18 の組で重視
  difficulty: low
  difficulty_reason: 操作ごとに誰が、いつ、何をしたかを書き換えられない記録に残すことは、どの妥当な作りでもできる
  rank: 21
