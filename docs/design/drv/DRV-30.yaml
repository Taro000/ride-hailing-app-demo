id: DRV-30
title: お金の操作は繰り返しても一度だけ
status: draft
version: 2
basis: inferred
basis_note: QR-09・17・21 と FR-05・12・30・31・50 から導いた原則。失敗と分かった後のやり直しを新しい操作とすることは FR-30 版 4・FR-50 版 4（入力）
needs_agreement: false
approver_candidates: []
kind: principle
statement: お金を動かす操作（押さえ、請求、返金）は、何度繰り返しても一度しか動かない。結果が分からないときのやり直しは同じ操作として扱い（同じキー）、失敗と分かった後のやり直し（別の支払い手段での払い直し、返金のやり直し）は新しい操作として扱う（新しいキー）。額はサーバーが確定した料金と額だけから求め、ブラウザから送られた額は使わない
sources: [QR-09, QR-17, QR-21, FR-05, FR-12, FR-30, FR-31, FR-50]
