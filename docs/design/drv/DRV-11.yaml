id: DRV-11
title: 外部サービスの失敗と遅れで画面を待たせない
status: draft
version: 1
basis: inferred
basis_note: シナリオは QR-07・QR-03 と NFR-24・27・28 から（入力）。サービスの名前は質問 6、無料の枠を優先することは質問 5 で確認済み。料金の形は推定。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 外部サービス（Google Maps Platform、Stripe）が失敗したり、応答しなかったり、遅れたりしても、画面を待たせ続けずに決まった扱いへ移り、サービスが戻れば続ける
sources: [QR-07, QR-03, NFR-24, NFR-27, NFR-28, FR-02, FR-03, FR-05, FR-12, FR-23, FR-29, TC-10, TC-11, PC-01]
concern_of: [USR-01, USR-02]
scenario:
  source: Google Maps Platform、Stripe
  stimulus: 失敗する、応答しない、遅い、利用の上限に達する
  artifact: 手配（FR-02、FR-03、FR-05）、経路（FR-23）、降車場所の変更（FR-12）、請求（FR-29）
  environment: デモの回。どちらも約束（SLA、上限）は入力にない（TC-10、TC-11）。Google Maps Platform は使った分の料金がかかり、無料の枠を優先する（PC-01）
  response: 画面を待たせ続けず決まった扱いに移り（FR-03 は値を示さず理由を示す、FR-23 はピンだけを示す、FR-29 は確かめ中と示す）、サービスが戻れば続ける
  measure: 手配の画面の要求で 3 秒を超えたものが 1 時間に 5% 以下（NFR-24）。外部の呼び出しの失敗と無応答が 1 時間に 5% を超えたら知らせる（NFR-28）。失敗・無応答・戻った後の扱いの CI のゲートが通る（NFR-27）
negotiable: null
derived_from: []
priority:
  business: medium
  business_reason: QR-07、QR-03 は最低限守る線
  difficulty: high
  difficulty_reason: 自分で決められない外部のサービスに頼る。Google Maps Platform は使った分の料金がかかり、無料の枠に収める工夫が要る。手配と降車の待ち時間と競合する
  rank: 14
primary: false
conflicts:
