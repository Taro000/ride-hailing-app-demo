    note: Google Maps Platform は使った分の料金がかかり、呼び出しの無駄が費用になる。無料の枠を優先する（第 2 段階で呼び出しを減らし上限を置く）
  - with: DRV-04
    note: 品質チェーンで解き済み。Stripe を待つ時間とやり直しが降車の 10 秒（NFR-25）に入るが、乗客は待たずに降りる（FR-29）
  - with: DRV-08
    note: 品質チェーンで解き済み。ピンで確かめさせるのは誤差が D_pickup_accuracy を超えるときだけ（FR-02）
