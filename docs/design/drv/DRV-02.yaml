  source: 乗客（USR-01）とドライバー（USR-02）の端末
  stimulus: 乗客の取り消しとドライバーの許諾をほぼ同時に送る。依頼、許諾、取り消し、乗車の開始、到着の確認を送る途中で通信が途切れ、つながり直して送り直す。その途中でシステムが止まって再開する
  artifact: 依頼の状態と割り当て（FR-04、FR-07、FR-21、FR-23、FR-27、FR-28）
  environment: デモの回の間（OPF-01）。走っている車の中と屋外の乗る場所の、途切れやすい通信
  response: 依頼の状態と割り当てたドライバーは一つに定まり、どの操作も失われも二重にもならず、確定した依頼と乗車中の乗車は再開の後も残り、つながり直した乗客とドライバーの画面は依頼の今の状態を示す
  measure: NFR-10 の監視、NFR-11 のゲート、NFR-16 の監査
