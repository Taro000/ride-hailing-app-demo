statement: 一つの配車依頼の状態と割り当てたドライバーは、乗客とドライバーの操作が重なっても、端末との通信が途切れても、システムが止まって再開しても一つに定まり、どの操作も失われも二重にもならず、つながり直した乗客とドライバーの画面は依頼の今の状態を示す
sources: [QR-03, QR-02, QR-17, NFR-10, NFR-11, NFR-16, FR-04, FR-07, FR-21, FR-23, FR-27, FR-28]
concern_of: [USR-01, USR-02]
