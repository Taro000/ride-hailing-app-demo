id: DRV-02
title: 一つの依頼の状態と割り当ては一つに定まり、失われも二重にもならない
status: active
basis: inferred
basis_note: QR-03（重視）、QR-02 と QR-17（最低限守る線）は、操作が重なる、通信が途切れる、システムが止まるという刺激に対して同じ応答（依頼の状態が一つに定まり、失われない）を求めるため、一つのシナリオにまとめた（入力から推定）。QR-02 は最低限守る線だが、途切れた操作をどう扱うかで作りが分かれ、QR-06 とも競合するため含めた。試験での再現（QR-51）は DRV-33 にある。順位は質問 6 で確認済み
