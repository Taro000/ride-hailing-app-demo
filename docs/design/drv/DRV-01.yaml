id: DRV-01
title: 配車の手配から決済までの流れが、使いたいときに使える
status: active
basis: inferred
basis_note: シナリオは QR-01（重視）と NFR-01〜NFR-06 の SLO（入力）から。外部のサービスの失敗も悪いイベントに数えることは SLI-01〜SLI-06 の数え方の規則による。どの部分の停止が配車の流れを止めるか（QR-01 の basis_note が設計に確かめを求める点）は、第 2 段階がこの要求に照らして確かめる。本番は Cloud Run と Turso を想定して設計し、実際に作って動かすのはローカルだけとすることは質問 1 で確認済み。順位は質問 6 で確認済み
