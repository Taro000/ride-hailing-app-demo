id: DRV-19
title: 相手と本人を確かめる符号は、人が手で渡す
status: active
basis: confirmed
basis_note: 制約は DIN-02 と DIN-07（入力）、確認コードがその依頼にだけ合い推し量れないことは QR-18（最低限守る線）。交渉できないことは質問 4 で確認済み。順位は質問 6 で確認済み
premises: [TC-14, TC-16, OPF-03]
kind: constraint
statement: 乗客とドライバーが同じ依頼の相手であることは、乗客が伝えた確認コードをドライバーが入れて確かめ、一致したときだけ乗車を始める。確認コードはその依頼にだけ合い、ほかの人が推し量れない。参加者のアカウントの設定の符号は、運営・サポートの担当者が参加者に直接渡す
sources: [TC-14, TC-16, DIN-02, DIN-07, QR-18, NFR-21, FR-12, FR-27, FR-41, FR-48]
