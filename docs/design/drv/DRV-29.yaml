id: DRV-29
title: アカウント、額、他人のデータ、位置の記録、公開した入口を守る
status: draft
version: 2
basis: inferred
basis_note: QR にある脅威は QR-20・21・22・38・47・49 から（入力。QR-20・22・47 は版 2 で設定の符号と参加者でない人を含む）。インターネットからの攻撃、位置の偽り、ドライバーを装う人を扱うことは質問 8 で確認済み。URL の公開と招待制（PC-06）は入力。確認コードでのドライバーの確かめ（FR-26 版 2）と疑わしい到着の扱い（QR-49 版 3）は品質チェーンの再実行の入力で、その残る危険を受け入れたことは品質チェーンへの回答（設計 1-5、2-2）と質問 16 で確認済み。シナリオの組み立て、難しさ、順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: security
statement: 守るものは、アカウント（設定の符号を含む）、請求額と受取額、他人の依頼と乗車、位置情報（現在地の受信の記録を含む）と乗車の記録、管理の操作、料金の根拠になる到着と現在地の記録、乗客が手配した車を見分けること、公開した入口とその費用。入力にある脅威（漏れた資格情報でのログイン、設定の符号の横取り、参加者でない人の利用、ブラウザからの額の書き換えと他人の依頼の操作、乗車後や関係のない人による位置と記録の閲覧、役割のないアカウントでの管理の操作、誰がしたか分からない管理の操作）と、質問 8 で加えた脅威（インターネットからの攻撃、ドライバーによる位置の偽り、ドライバーを装う人）から守る
sources: [QR-20, QR-21, QR-22, QR-38, QR-47, QR-49, QIU-05, NFR-16, NFR-17, NFR-18, NFR-30, NFR-31, NFR-45, FR-01, FR-09, FR-17, FR-24, FR-25, FR-26, FR-45, FR-46, FR-48, FR-50, PC-06]
concern_of: [USR-01, USR-02, USR-04, STK-01]
scenario:
  source: 漏れた資格情報や設定の符号を手に入れた人、デモの URL を見た参加者でない人（USR-08）とインターネットの攻撃者、ブラウザから要求を書き換える参加者、位置を偽るドライバー、ドライバーを装う人、役割のない参加者や担当
  stimulus: 他人の資格情報でログインする。盗み見たか推し量った設定の符号で、本人より先にパスワードを決める。アカウントを持たずにログインより先の画面や API を使おうとする。ログインや設定の符号を総当たりする、大量の要求を送る。額や他人の依頼の ID を書き換えて送る。迎車中でないのに乗客の位置を求める。偽の位置で到着を知らせる。手配したドライバーを装って乗客を乗せようとする。役割のないアカウントで管理とエンジニアの画面を使う
  artifact: ログインと設定の符号（FR-01、FR-48）、お金の操作（FR-05、07、12、20、27、29、32）、位置と記録（FR-17、24、25、40、44、45）、車とドライバーの表示と運転の開始（FR-09、FR-26）、管理の操作（FR-46〜48、50）、公開した入口
  environment: デモの回は Cloud Run の入口がインターネットに開く。デモの URL は発表、ブログ、動画で、デモの回の最中や前にも示す（PC-06）ので、入口を知る人が参加者の外に広がり、攻撃が起きやすい。アカウントは運営・サポート担当が参加者にだけ作る（招待制）
  response: 本人だけがログインできる。設定の符号は本人だけが使え、一度使うか出し直すと使えなくなる。参加者でない人はログインより先に進めない。総当たりと大量の要求を抑え、費用が予算を超えない。ブラウザから送られた額は使わない。他人の依頼・記録・位置は拒む。乗客の位置は迎車中の担当のドライバーにだけ、乗客が許可したときだけ見せる。疑わしい位置での到着を見分けて印を付け、運営・サポート担当が毎日の一覧で見て偽りなら返金する。乗客は、確認コードをドライバーに伝え、自分の画面が乗車中に変わったことで手配したドライバーだと確かめられる（違うコードでは変わらない）。管理とエンジニアの画面は役割のアカウントだけが使える。管理の操作はすべて担当とともに残る
  measure: CI のゲートで、ログインしていない要求、ほかの役割の要求、額を書き換えた要求、他人の ID の要求、使った・出し直す前の・正しくない設定の符号がすべて拒まれる（NFR-16、NFR-31）。違うコードでは運転が始まらず、乗客の画面も乗車中に変わらない（NFR-30）。すべての管理の操作（参加者のアカウントの作成と設定の符号の出し直しを含む）に担当の記録が残る（NFR-18）。深刻な脆弱性は 7 日、高いものは 30 日以内に直し、最初のデモの前に確かめる（NFR-17）。料金を取った依頼を、到着の位置と疑わしい印とともに毎日一覧にする（NFR-45）。大量の要求を受けても費用は C_budget_month を超えない（未定の値）
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: 重視の QR-20、22、入口の QR-38、47、大量の要求で損なわれる重視の QR-01 に仕える
  difficulty: medium
  difficulty_reason: 多くは解き方が知られている。招待制でアカウントの作成を外に開かない。位置の偽りはブラウザでは防ぎ切れず、見分けて返金で直すまで。ドライバーを装う人には確認コードで備えるが、乗客が画面を確かめずに乗ると防げない（受け入れ済み）。URL を公開するので、入口への攻撃は起きる前提で備える
  rank: 10
primary: true
conflicts:
  - with: DRV-26
    note: 公開した入口への大量の要求が Cloud Run と Google Maps Platform の費用になる（第 2 段階）。招待制なので、ログインの後の操作（地図の検索と見積もりを含む）は参加者に限られ、残るのはログインより前の入口
  - with: DRV-20
    note: ブラウザの Web アプリでは端末を確かめる手段がなく、位置の偽りを防ぎ切れない。料金は規則どおり取り、担当が毎日の一覧で見て偽りなら返金する（QR-49 版 3）。残る危険（担当の見落とし）は利用者が受け入れた（品質チェーンへの回答の設計 2-2）
placeholders:
  - name: C_budget_month
    meaning: 月の費用の上限（個人で払える額。未定。無料の枠を優先）
    from: DRV-26
changelog:
  - {version: 1, date: 2026-11-02, change: 作成, reason: 第 1 段階の下書き（質問 1〜10 の回答を反映。質問 8 で脅威を三つ加えた）}
  - version: 2
    date: 2026-11-03
    change: 環境に URL の公開と招待制（PC-06）を、守るものと脅威に設定の符号、参加者でない人の利用、現在地の受信の記録を、応答に参加者でない人はログインより先に進めないこと、設定の符号の扱い、確認コードでのドライバーの確かめ、疑わしい到着の返金を、測定量に NFR-16・18・30・45 の版 2 の中身を書いた。ドライバーを装う人は測れないとした注（品質チェーンへの課題 5）を外し、難しさの理由と DRV-20・26 との競合を直した
    reason: FND-27 を受け入れた。品質チェーンの再実行（FR-01 版 3、FR-26 版 2、FR-48 版 2、QR-20・22・47 版 2、QR-49 版 3。回答の設計 1-5、2-2、2-9）に追随した（第 1 段階の再実行、3 回目）
