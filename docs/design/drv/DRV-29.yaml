id: DRV-29
title: 乗客とドライバーの個人の情報は、許された人のほかには見えない
status: active
basis: inferred
basis_note: 守る資産（名前、連絡先、位置情報、乗る場所と降りる場所）と脅威（調査の画面、知らせ、ログを通した漏れ、乗車の後の場所の閲覧、写しの持ち出し）は、QR-34、QR-36（最低限守る線）と法令から来た QR-57、QR-58 の失敗のシナリオ（入力）から。法令から来た要求に仕えるため、事業の優先度を高とした。セキュリティのリスク分析は品質要求のほかに脅威を挙げていない（質問 5 で確認済み）。順位は質問 6 で確認済み
premises: [CON-06]
kind: security
statement: 乗客とドライバーの名前、連絡先、位置情報、乗る場所と降りる場所は、見ることを許された人だけが見られる。エンジニアが見る調査の画面、異常の知らせ、ログ、端末のエラーの記録では隠れているか伏せてあり、エンジニアが理由を示したときだけ、その依頼の分を見られる。記録が写されても、許された人のほかには読めない
sources: [QR-34, QR-36, QR-57, QR-58, FR-35, FR-49, NFR-27, NFR-28, NFR-45]
concern_of: [USR-01, USR-02, USR-03, STK-02]
scenario:
  source: エンジニア（USR-03）、ドライバー（USR-02）、記録の写しを手にした人
  stimulus: 異常の知らせ、ログ、調査の画面を開く。乗車が終わった後に過去の乗客の場所を見ようとする。記録を写して持ち出す
  artifact: 調査の画面と異常の知らせ（FR-33、FR-34、FR-35）、ログと端末のエラーの記録（FR-52）、保存した記録とその写し、乗客とドライバーの画面
  environment: デモの回の間とその後。参加者は実在の人で、位置情報も本物（CON-06）
  response: 個人の情報は隠れているか伏せてあり、理由を示したエンジニアにその依頼の分だけが示され、乗車の後のドライバーには示されず、写しは許された人のほかには読めない
  measure: NFR-27 のゲート、NFR-28 の監査、NFR-45 の監視
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: 法令から来た QR-57 と QR-58 に仕える
  difficulty: medium
  difficulty_reason: 画面、知らせ、ログ、写しのどこでも同じ隠し方を通し、理由を示したときだけその依頼の分を示し、写しを読めなくする。たどりやすさ（DRV-24）と競合する
  rank: 9
primary: true
conflicts:
  - with: DRV-24
    note: 個人の情報を隠しても、同じ乗客と同じドライバーの依頼であることは分かり（FR-35）、たどることを妨げない（品質チェーンが QR-33 と QR-34 に書いた扱い）
placeholders: []
