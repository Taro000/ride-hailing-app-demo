id: DRV-29
title: アカウント、額、他人のデータ、位置の記録、公開した入口を守る
status: draft
version: 1
basis: inferred
basis_note: QR にある脅威は QR-20・21・22・38・47 から（入力）。インターネットからの攻撃、位置の偽り、ドライバーを装う人を扱うことは質問 8 で確認済み。シナリオの組み立て、難しさ、順位は推定で要合意。ドライバーを装う人は今の機能では防げない
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: security
statement: 守るものは、アカウント、請求額と受取額、他人の依頼と乗車、位置情報と乗車の記録、管理の操作、料金の根拠になる到着と現在地の記録、乗客が手配した車を見分けること、公開した入口とその費用。入力にある脅威（漏れた資格情報でのログイン、ブラウザからの額の書き換えと他人の依頼の操作、乗車後や関係のない人による位置と記録の閲覧、役割のないアカウントでの管理の操作、誰がしたか分からない管理の操作）と、質問 8 で加えた脅威（インターネットからの攻撃、ドライバーによる位置の偽り、ドライバーを装う人）から守る
sources: [QR-20, QR-21, QR-22, QR-38, QR-47, QR-49, QIU-05, NFR-16, NFR-17, NFR-18, NFR-31, NFR-45, FR-01, FR-09, FR-24, FR-25, FR-26, FR-46, FR-48]
concern_of: [USR-01, USR-02, USR-04, STK-01]
scenario:
  source: 漏れた資格情報を持つ人、インターネットの攻撃者、ブラウザから要求を書き換える参加者、位置を偽るドライバー、ドライバーを装う人、役割のない参加者や担当
  stimulus: 他人の資格情報でログインする。ログインを総当たりする、大量の要求を送る。額や他人の依頼の ID を書き換えて送る。迎車中でないのに乗客の位置を求める。偽の位置で到着を知らせる。手配したドライバーを装って乗客を乗せる。役割のないアカウントで管理とエンジニアの画面を使う
  artifact: ログイン（FR-01、FR-48）、お金の操作（FR-05、07、12、20、27、29、32）、位置と記録（FR-24、25、40、44、45）、車とドライバーの表示（FR-09）、管理の操作（FR-46〜48、50）、公開した入口
  environment: デモの回は Cloud Run の入口がインターネットに開く
  response: 本人だけがログインできる。総当たりと大量の要求を抑え、費用が予算を超えない。ブラウザから送られた額は使わない。他人の依頼・記録・位置は拒む。乗客の位置は迎車中の担当のドライバーにだけ、乗客が許可したときだけ見せる。疑わしい位置での到着を見分ける。乗客が手配した車とドライバーを見分けられる。管理とエンジニアの画面は役割のアカウントだけが使える。管理の操作はすべて担当とともに残る
  measure: CI のゲートで、ログインしていない要求、ほかの役割の要求、額を書き換えた要求、他人の ID の要求がすべて拒まれる（NFR-16、NFR-31）。すべての管理の操作に担当の記録が残る（NFR-18）。深刻な脆弱性は 7 日、高いものは 30 日以内に直し、最初のデモの前に確かめる（NFR-17）。料金を取った依頼を到着の位置とともに毎日一覧にする（NFR-45）。大量の要求を受けても費用は C_budget_month を超えない（未定の値）。ドライバーを装う人への備えは、乗客がドライバーを確かめる機能がなく測れない（品質チェーンへの課題 5）
negotiable: null
derived_from: []
priority:
  business: high
  business_reason: 重視の QR-20、22、入口の QR-38、47、大量の要求で損なわれる重視の QR-01 に仕える
  difficulty: medium
  difficulty_reason: 多くは解き方が知られている。位置の偽りはブラウザでは防ぎ切れず、見分けて後から見つけるまで。ドライバーを装う人は今の機能では防げない
  rank: 10
primary: true
conflicts:
  - with: DRV-26
    note: 公開した入口への大量の要求が Cloud Run と Google Maps Platform の費用になる（第 2 段階）
  - with: DRV-20
    note: ブラウザの Web アプリでは端末を確かめる手段がなく、位置の偽りを防ぎ切れない。残る危険は要合意
placeholders:
  - name: C_budget_month
    meaning: 月の費用の上限（個人で払える額。未定。無料の枠を優先）
    from: DRV-26
changelog:
