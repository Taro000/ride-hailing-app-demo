id: DRV-05
title: 配車の規則がどの経路でも守られる
status: draft
version: 1
basis: inferred
basis_note: シナリオは QR-10・11・12・16 と NFR-09・10 から（入力）。難しさと順位は推定で要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
kind: quality
statement: 割り当ての一意性、しきい値、受ける条件、停止の規則を、どの経路の許諾と示し方でも同じに守る
sources: [QR-10, QR-11, QR-12, QR-16, NFR-09, NFR-10, FR-08, FR-14, FR-15, FR-16, FR-18, FR-20, FR-22, FR-33, FR-34, FR-47, FR-51]
concern_of: [USR-01, USR-02, USR-04]
scenario:
  source: ドライバー、乗客、運営・サポート担当、評価の更新、ドライバーの移動
  stimulus: 二人のドライバーがほぼ同時に同じ依頼を許諾する。乗客が探している途中でしきい値を下げる。評価の更新で条件を満たすかが変わる。一覧を開いたままのドライバーが停止される。ドライバーが動いて乗車場所までの距離が変わる
  artifact: 依頼を示す相手と割り当て（FR-08、FR-14〜16、FR-18、FR-20、FR-22、FR-33、FR-34、FR-47、FR-51）
  environment: デモの回、少人数。ほぼ同時の操作
  response: 条件を満たすドライバーだけに依頼を示し、条件を満たす一人だけに割り当てる。取り消された依頼と、迎車中・乗車中・停止中のドライバーには割り当てない。条件の変化は一覧に反映される（届く速さは DRV-02）
  measure: 規則に反する割り当ての検出が 0 件（NFR-09）。境目を含む割り当てと絞り込みの CI のゲートがすべて通る（NFR-10）
