id: DRV-21
title: 個人の情報の扱いに関する法令に従う
status: active
basis: inferred
basis_note: 個人の情報の扱いに関する法令から来た QR-57、QR-58、QR-59（入力）。法令は交渉できない。エンジニアの調査で隠すことと、写しを読めなくすることは DRV-29 が受け持つ。品質チェーンが QR-59 と QR-37、QR-15、QR-17 の競合に書いた扱い（保存期間のうちで取り出せる日数と記録の欠けのなさが成り立ち、保存期間を過ぎた記録には状態の変化の種類と時刻だけが残る）を引き継ぐ。順位は質問 6 で確認済み
premises: [CON-06]
kind: constraint
statement: 乗客とドライバーの位置情報と乗車の記録は、見ることを許された人だけが見られる。ログの中の個人の情報は伏せてある。記録してから QR-59 の保存期間を過ぎた記録とデータは、状態の変化の種類と時刻を残し、操作した人と位置を消して、個人を特定できない形になっている
sources: [QR-57, QR-58, QR-59, NFR-27, NFR-28, NFR-45, NFR-46, FR-49, FR-51]
concern_of: [USR-01, USR-02, STK-02]
scenario: null
negotiable: false
derived_from: []
priority:
  business: high
  business_reason: 法令から来た、入口のある要求
  difficulty: low
  difficulty_reason: 見せる決まりと伏せる決まりを一か所に置けば（DRV-34）、どの妥当な作りでも満たせる。保存期間を過ぎた記録は、誰がとどこでを消せばよい
  rank: 18
primary: false
conflicts:
  - with: DRV-02
    note: 止まった後に戻すために残すものにも、保存期間を過ぎた個人の情報は残さない（品質チェーンが QR-17 と QR-59 に書いた扱い）
  - with: DRV-07
    note: 止まった後に戻すために残す決済と返金の結果にも、保存期間を過ぎた個人の情報は残さない（品質チェーンが QR-17 と QR-59 に書いた扱い）
  - with: DRV-24
    note: 依頼の経過をたどる記録を取り出せる日数は、保存期間を超えない（品質チェーンが QR-37 と QR-59 に書いた扱い）
  - with: DRV-27
    note: 配車の経過の記録が欠けないことは保存期間のうちの記録について成り立ち、過ぎた記録には状態の変化の種類と時刻だけが残る（品質チェーンが QR-15 と QR-59 に書いた扱い）
placeholders: []
