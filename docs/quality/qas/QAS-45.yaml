id: QAS-45
title: D_dropoff_gap の最初の値
status: overturned
stage: 4
kind: decision
statement: D_dropoff_gap を 50 m とする。
why_unsure: 入力に数値も基準となる値もない。50 m は、乗客が決めた降りる場所の前に車を止められないときも歩いてすぐ着ける距離として置いた最初の値。
breadth: medium
severity: low
rating_note: QIU-11、FR-13、FR-28、FR-47 が依存する。第 1 段階と第 2 段階が次の実行で書く値で、変えるのは容易
answer: 誤り。降りる場所の距離の許容は 30 m。50 m は乗る場所の到着を受け付ける範囲だけに使う
answered_in: "第 4 段階、決めたこと #14"
