id: QAS-17
title: CUJ-14 と CUJ-16 の重視は QR-41、QR-49、QR-46、QR-44
status: overturned
stage: 3
kind: decision
statement: CUJ-14 苦情への対応の重視の組を QR-41（苦情と報告の完全性、質問 2 と質問 4）と QR-49（停止がすぐ効く機能正確性）、CUJ-16 アカウントの作成の重視の組を QR-46（アカウントの内容の正確性）と QR-44（担当者の操作の責任追跡性、質問 2 と質問 4）とする。QR-42 は CUJ-15 の上限のため最低限守る線（質問 4）。QR-10 と QR-11 は QIU-07 を CUJ-14 に置いた（質問 4）ため CUJ-14 で数えるが、最低限守る線とする。
why_unsure: QR-49 と QR-46 を入れ、QR-10 と QR-11 を最低限守る線にすることは点から下書きした。QR-10 を重視にすると CUJ-15 が 4 を超える。
breadth: medium
severity: medium
rating_note: QR-46、QR-49 の扱いが依存する。違っていても最低限守る線の QR は監視が残る
answer: 一部が誤り。アカウントの内容が本人と参加の仕方に一致することは品質要求にしない（担当者が設定の符号を直接渡すため、名前や連絡先の誤りは CUJ を損なわない）。苦情への対応の CUJ の重視（報告を含む記録が欠けないこと、停止した時から新しい依頼を示さないこと、管理の操作を担当者ごとにたどれること）は正しい
answered_in: 第 3 段階、#15（未確認の仮定の一覧への訂正）
