id: QAS-13
title: CUJ-08 降車（ドライバー）の重視は QR-01、QR-04、QR-29
status: retired
stage: 3
kind: decision
statement: CUJ-08 の重視の組を QR-01（可用性）、QR-04（請求する額の機能正確性）、QR-29（EXT-01 との相互運用性）とする。ほかの候補は最低限守る線とする。
why_unsure: QR-01 と QR-29 の扱いは質問 2 と質問 4 で決まっているが、QR-04 を入れることは点から下書きした。
breadth: low
severity: medium
rating_note: QR-04 の扱いが依存する。実際のお金は動かず（CON-03）、最低限守る線でも監視は残る。決めたこと 18 と 15 で、この組の QR（QR-04、QR-49）はほかの CUJ の組として重視に決まり、扱いがこの仮定によらなくなったため廃止した
answer: null
answered_in: null
