id: QAS-05
title: 評価がまだないドライバーは、閾値を設定した乗客の依頼を受け取らない
status: confirmed
stage: 2
kind: judgment
statement: 乗客が評価の閾値を設定しているとき、評価がまだ一つもないドライバーには、その乗客の依頼を届けない。
why_unsure: 入力は評価が一定以上のドライバーとだけマッチするとだけ述べ、評価がまだないドライバーの扱いを書いていない。
breadth: high
severity: low
rating_note: FR-05 と第 3 段階の QR-16 が依存し、第 4 段階では NFR-35 と NFR-36 が直接に、NFR-34 が QR-16 を通して依存する。違っていても届ける相手の決まりを一つ変えるだけで、閾値を設定していない乗客には関わらない
answer: 当たる。評価がまだないドライバーには届けない。加えて、評価の件数が下限に満たないドライバーにも届けない（下限の値はまだ決まっていない。FRP-12、第 4 段階の質問 10）
answered_in: "第 4 段階、質問 7"
