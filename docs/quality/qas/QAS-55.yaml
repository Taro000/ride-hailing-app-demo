id: QAS-55
title: 個人を特定できない形に変わったアカウントは使えなくなり、使い続けるには新しいアカウントを作る
status: open
stage: 2
kind: judgment
statement: 記録してから 3 年を過ぎて個人を特定できない形に変わったアカウントでは、使い続けられない。その参加者が使い続けるには、担当者が新しいアカウントを作成する（FR-41）。
why_unsure: 第 3 段階の質問 7 の回答は、使い続けている参加者のアカウントの情報も 3 年で消えるとしたが、その後にどう使い続けるかは第 2 段階に残した（FRP-05）。消える前に知らせる、情報を入れ直させるなどのやり方もありうる。
breadth: low
severity: low
rating_note: FR-51 だけが依存する。デモは全体で 1〜4 回で数日のうちに終わる（OPF-01）ため、3 年を過ぎて使い続ける参加者は見込まれず、違っていても後から容易に変えられる
answer: null
answered_in: null
