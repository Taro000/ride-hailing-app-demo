id: QAS-30
title: 乗る前の画面の使いやすさの評価の参加者と基準
status: overturned
stage: 4
kind: decision
statement: 乗客の迎車中の画面を変えるリリースのたびに、乗客の役の参加者 5 人以上で評価し、全員が乗ってはいけない間と確かめの手がかりを読み取れることを基準とする。
why_unsure: 入力に評価のやり方はない。5 人は、使いやすさの問題の多くが少人数の評価で見つかるという通例から置いた最初の値。
breadth: low
severity: low
rating_note: NFR-20 だけが依存する。評価のやり方は後から変えやすい
answer: 誤り。乗る前の画面の使いやすさは品質要求にしない。乗客が画面を確かめずに乗る危険は受け入れた。参加者は顔の分かる 2 人なので、装う人はいない
answered_in: "第 4 段階、決めたこと #20"
