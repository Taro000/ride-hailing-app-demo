id: QAS-03
title: 事業は KPI-01 と KPI-02 を全体で数える
status: overturned
stage: 1
kind: judgment
statement: 事業は、下書きした二つの KPI（成立した依頼の割合と、成立した配車の乗車率）を、すべての利用者とすべての利用状況で数える。
why_unsure: 入力も回答も KPI を挙げていない。中間成果を直接数える式なので下書きしたが、事業が全体で数えるかは事業の事実で、入力からは分からない。
breadth: medium
severity: low
rating_note: KPI の二つと、それを指す QIU の二つが関わる。違っていれば KPI を直せばよく、利用者への害はない
answer: 誤り。事業が全体で数える式は 3 つで、配車の成立率（迎車が乗車場所に到着した配車依頼 ÷ 乗客が手配した配車依頼）、許諾後の成立率（迎車が乗車場所に到着した依頼 ÷ ドライバーが許諾した依頼）、合流の成功率（乗車が始まった依頼 ÷ 迎車が乗車場所に到着した依頼）
answered_in: 第 1 段階、質問 6（仮定の一覧への訂正）
