id: QAS-10
title: CUJ-04 ドライバーの評価の重視は QR-25、QR-26
status: overturned
stage: 3
kind: decision
statement: CUJ-04 ドライバーの評価の重視の組を QR-25（評価の完全性）と QR-26（評価の最新性）とする。ほかの候補は最低限守る線とする。
why_unsure: 点から下書きした優先の順で、点はどれも 6 と低い。事業が評価をどれほど重く見るかは入力にない。CUJ-05 の組は質問 2 で決まった。
breadth: medium
severity: medium
rating_note: 2 つの QR の扱いが依存する。違っていても最低限守る線の QR は監視が残る
answer: 誤り。ドライバーの評価の CUJ の重視は、降車後に少ない操作で評価を送れることだけ（事業の決め）。評価が欠けずに記録されることは品質要求にしない。新しい評価を評価の値に反映することは、閾値による絞り込みの正しさに含め、CUJ-05 で扱う
answered_in: 第 3 段階、#14（未確認の仮定の一覧への訂正）
