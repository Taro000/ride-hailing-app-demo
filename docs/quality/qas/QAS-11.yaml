id: QAS-11
title: CUJ-06 配車受付の重視は QR-01、QR-03、QR-06、QR-28
status: overturned
stage: 3
kind: decision
statement: CUJ-06 の重視の組を QR-01、QR-03、QR-06（どれも CUJ-01 の組、質問 2）と QR-28（走っている間の操作の機能正確性）とする。QR-02 は CUJ-01 の上限のため最低限守る線（質問 4）。ほかの候補は最低限守る線とする。
why_unsure: QR-28 を入れることは点と安全（QIU-17）から下書きした。事業がどの品質を重く見るかは入力にない。
breadth: low
severity: medium
rating_note: QR-28 の扱いが依存する。違っていても最低限守る線として監視は残る
answer: 誤り。走っている間は依頼を選ぶ操作と許諾を受け付けないこと（速さの判定の正しさ）は最低限守る線。配車受付の CUJ の 4 つ目の重視は、乗る場所の正確さ
answered_in: 第 3 段階、#17（未確認の仮定の一覧への訂正）
