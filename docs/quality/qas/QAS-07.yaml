id: QAS-07
title: 乗車中に降りる場所を変える機能は今回加えない
status: overturned
stage: 2
kind: decision
statement: 乗客は乗車中に降りる場所を変えられない。別の場所へ行きたいときは、降りてから依頼し直す。
why_unsure: CUJ に降りる場所を変える手順はないが、QIU-11 の測定量は乗車中に降りる場所を変えた乗車の数え方を決めている。変えられるようにするには、確定額（CON-01）をどう扱うかの決まりも要る。
breadth: medium
severity: low
rating_note: QIU-11 に対応する FR-13、FR-24、FR-28 が依存する。後から加えてもほかの FR を壊さず、乗客にお金の害は生じない
answer: 誤り。乗車中に降りる場所を変える機能を加える。変えたときの料金と到着予定の時刻を示し、乗客が承認したら、ドライバーに新しい降りる場所を示して、確定した料金を更新する
answered_in: 第 2 段階、質問 7（仮定の一覧への訂正）
