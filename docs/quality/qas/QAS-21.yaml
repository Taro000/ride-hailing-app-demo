id: QAS-21
title: 個人の情報の法令の QR は QR-57、QR-58 を重視、QR-59 を最低限守る線
status: overturned
stage: 3
kind: decision
statement: 個人の情報の扱いに関する法令から来る QR のうち、位置情報と乗車の記録を見られる人を限ること（QR-57）とログの個人の情報を伏せること（QR-58）を重視、保存期間を過ぎた個人の情報を残さないこと（QR-59）を最低限守る線とする。
why_unsure: 点から決めた。QR-59 はデモが 3 年を超えて動く見込みが入力にないため起こりやすさを低くみたが、事業がこれをどれほど重く見るかは入力にない。
breadth: medium
severity: medium
rating_note: 3 つの QR の扱いが依存する。どれも法令から来るため対象から外さず、最低限守る線でも監視は残る
answer: 誤り。個人情報保護法から来る三つ（位置情報と乗車の記録を見られる人を限る、ログの個人の情報を伏せる、保存期間を過ぎた記録とデータを個人を特定できない形にする）は、すべて最低限守る線
answered_in: 第 3 段階、#11（未確認の仮定の一覧への訂正）
