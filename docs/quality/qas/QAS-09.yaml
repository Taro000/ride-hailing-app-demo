id: QAS-09
title: CUJ-03 降車（乗客）の重視は QR-01、QR-04、QR-29
status: overturned
stage: 3
kind: decision
statement: CUJ-03 の重視の組を QR-01（可用性）、QR-04（請求する額の機能正確性）、QR-29（EXT-01 との相互運用性）とする。QIU-04 を CUJ-03 に置くこと（質問 4）で、QR-04 が CUJ-03 で数えられる。ほかの候補は最低限守る線とする。
why_unsure: QR-01 と QR-29 の扱いは質問 2 と質問 4 で決まっているが、QR-04 を CUJ-03 の組に入れることは点から下書きした。
breadth: low
severity: medium
rating_note: QR-04 の扱いが依存する（CUJ-08 の QAS-13 と同じ QR）。違っていても最低限守る線として監視は残る
answer: 誤り。降車（乗客）の CUJ の重視は、請求の正しさ（確定額を一度だけ請求する）、場所の取り違えを防ぐこと（同じ名前の候補を住所などで区別し、位置を示す）、本人だけがログインできること、押さえ・請求・返金の記録が決済サービスの記録と一致すること、の 4 つ
answered_in: 第 3 段階、#18（未確認の仮定の一覧への訂正）
