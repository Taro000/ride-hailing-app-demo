id: QAS-01
title: ドライバーは乗客を乗せずに走っている間にも依頼を受け取る
status: confirmed
stage: 1
kind: judgment
statement: ドライバーは、乗客を乗せずに走っている間にも配車依頼を受け取り、受けるかどうかを決める。
why_unsure: 入力は配車受付の手順を挙げているが、ドライバーが止まっているときだけ依頼を受けるのか、走っている間にも受けるのかを書いていない。
breadth: medium
severity: high
rating_note: QIU-17 と FR-22 が依存する。走っている間に依頼をどう受けるかは運転中の安全に関わるため、第 2 段階の質問 3 で尋ねた
answer: 正しい。乗客を乗せずに走っている間にも依頼は届く。ただし画面を使わずに答える手段は設けず、一定の速さ以上で動いている間は依頼を選ぶ操作も許諾も受け付けず、止まってから操作するよう示す
answered_in: 第 2 段階、質問 3
