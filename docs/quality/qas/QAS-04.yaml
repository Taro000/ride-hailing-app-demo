id: QAS-04
title: 取り消された依頼は、乗客が依頼し直さなくてもほかのドライバーに届け直す
status: overturned
stage: 2
kind: judgment
statement: ドライバーが許諾の後に依頼を取り消したときや、担当者がドライバーを停止して許諾済みの依頼を外したとき、システムは同じ乗る場所、降りる場所、料金のまま、その依頼をほかのドライバーに届け直す。乗客は依頼し直さなくてよい。
why_unsure: 入力は許諾後の取り消しを減らしたい（OUT-02）とだけ述べ、取り消された依頼をどうするかを書いていない。乗客に依頼し直してもらうやり方もありうる。
breadth: medium
severity: low
rating_note: FR-23 と FR-44 が依存する。届け直さなくても乗客は依頼し直せるので害は小さい。KPI-01 の数え方（取り消された依頼が成立しないものとして残るか）に関わるため、第 3 段階の前に直せばよい
answer: 一部が誤り。ドライバーが取り消した依頼を、乗客が依頼し直さなくてもほかのドライバーに示し直すのは正しい。ドライバーを停止しても依頼は外れず、停止したドライバーの迎車中と乗車中の依頼は終わるまで続けられる。停止中は受付を始めさせず、新しい依頼も示さない
answered_in: 第 2 段階、質問 6（仮定の一覧への訂正）
