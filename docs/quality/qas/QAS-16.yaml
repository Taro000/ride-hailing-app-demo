id: QAS-16
title: CUJ-11〜CUJ-13 の重視は QR-38、QR-39
status: overturned
stage: 3
kind: decision
statement: CUJ-11 新しい機能の追加、CUJ-12 既存の機能の修正、CUJ-13 利用技術のバージョンアップへの対応の重視の組を、どれも QR-38（変えなかった機能が以前どおりに動く修正性）と QR-39（止めずに入れて戻せる設置性）とする。ほかの候補は最低限守る線とする。
why_unsure: 点から下書きした優先の順で、事業がどの品質を重く見るかは入力にない。
breadth: medium
severity: medium
rating_note: 2 つの QR の扱いが依存する。違っていても内部品質と最低限守る線の QR が残る
answer: 誤り。機能の追加・修正・版上げの CUJ の重視は 0 件。前の版に戻すと元の振る舞いに戻り、進んでいる依頼と記録を使い続けられることと、配備を自動の手順で終えることは最低限守る線。配車を止めずに新しい版を入れる要求はなく、配備はデモの回を開くときに行う
answered_in: 第 3 段階、#13（未確認の仮定の一覧への訂正）
