id: QAS-06
title: 苦情と返金の求めはシステムの中で受け付ける
status: overturned
stage: 2
kind: decision
statement: 乗客とドライバーは、乗車についての苦情や返金の求め（危険な運転や加害の報告を含む）をシステムの中で寄せ、担当者はシステムの中でそれを受けて、対応を終えるまでを記録する。
why_unsure: 苦情と返金への対応の手順は決まっていない（第 1 段階、質問 2）。電話やメールなどシステムの外で受けるやり方もありうる。
breadth: high
severity: medium
rating_note: FR-37、第 3 段階の QR-41、第 4 段階の NFR-14 と NFR-37、第 1 段階の QIU-27（受けた苦情を数えられるか）の 5 項目が依存する。違っていれば FR-37 と QR-41 を外し、NFR-14 と NFR-37 から苦情の記録を外し、QIU-27 は observable を false にする。システムの外で受けても対応はできるので、利用者への害は増えない。影響の広さが高くなったため第 1 段階の質問 7 で尋ねた
answer: 一部が誤り。システムの中で受け付け、担当者は対応を終えるまでをシステムに記録する。ただし苦情と返金の求めを寄せるのは乗客だけで、自分の乗車について寄せる。ドライバーは寄せない
answered_in: 第 1 段階、質問 7
