id: QAS-54
title: 状態の変化を相手の画面に示した時刻の記録（FRP-11）を今期作る
status: open
stage: 2
kind: decision
statement: FRP-11 を受け入れ、依頼、許諾、取り消し、迎車の到着を相手の画面に示した時刻を記録する機能（FR-53）を今期作る。
why_unsure: FRP-11 は QR-06 を測るための機能で、QR-06 そのものはこの機能がなくても満たせる。デモの配車は全体で 2〜6 回（OPF-02）で、作る手間に見合うかは入力から決められない。
breadth: medium
severity: low
rating_note: FR-53 と、第 3 段階の QR-06、第 4 段階の NFR-07、SLI-07 が依存する。違っていれば FR-53 を廃止し、SLI-07 はシステムの中の区間だけを数える（今の第 4 段階の書き方）。利用者への害はない
