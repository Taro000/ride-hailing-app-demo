id: QAS-15
title: CUJ-10 障害の原因の特定の重視は QR-33、QR-34
status: overturned
stage: 3
kind: decision
statement: CUJ-10 の重視の組を QR-33（知らせとたどりの解析性）と QR-34（調査で個人の情報を隠す機密性）とする。ほかの候補は最低限守る線とする。
why_unsure: 点から下書きした優先の順で、事業がどの品質を重く見るかは入力にない。
breadth: medium
severity: medium
rating_note: 2 つの QR の扱いが依存する。個人の情報の写しと残す期間（QR-36, QR-37）は最低限守る線として監視が残る
answer: 誤り。エンジニアの CUJ だけにたどる品質要求は今期は重視にしない（事業の決め）。障害の原因の特定の CUJ で重視なのは、状態の履歴、端末のエラー、乗客の報告の記録が欠けないことだけ（苦情への対応の CUJ にもたどるため）。異常の通知の速さ、依頼を最初から最後までたどれること、ログの個人の情報を伏せることは最低限守る線
answered_in: 第 3 段階、#12（未確認の仮定の一覧への訂正）
