id: QAS-12
title: CUJ-07 乗車（ドライバー）の重視は QR-01、QR-46
status: overturned
stage: 3
kind: decision
statement: CUJ-07 の重視の組を QR-01（可用性）と QR-46（アカウントの内容の正確性）とする。QR-02 は CUJ-01 の上限、QR-18 は CUJ-02 の上限のため最低限守る線（質問 4）。
why_unsure: QR-46 は CUJ-16 の組から来る。QR-18（同じ依頼の相手の確かめ）を CUJ-07 で重視にするかは、CUJ-02 の残りの枠（質問 9）による。
breadth: low
severity: medium
rating_note: QR-46 の扱いが依存する。違っていても最低限守る線として監視は残る
answer: 誤り。乗車（ドライバー）の CUJ の重視は、可用性、現在地の最新性、乗る場所の正確さ（乗る場所が乗客が実際に待つ場所を表すこと）。アカウントの内容の正確さは品質要求にしない。確認コードの正しさと、到着の記録の正確さは最低限守る線
answered_in: 第 3 段階、#16（未確認の仮定の一覧への訂正）
