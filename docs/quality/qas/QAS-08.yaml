id: QAS-08
title: 乗車中の危険を今回扱わないことは、乗車中の通報と共有を加えないことを指す
status: overturned
stage: 2
kind: judgment
statement: 質問 2 の回答の「乗車中の危険は今回は扱わない」は、乗車中に起きている危険への対応（通報、経過の共有）を加えないことを指す。QIU-07 は引き続き対象で、危険な運転や加害の報告（FR-37）とドライバーの停止（FR-44）で守る。
why_unsure: 回答はこの言葉を通報と共有を加えない理由として述べている。一方、QIU-07 は乗車中の危険な運転や加害そのものを扱う要求なので、QIU-07 全体を今回の対象から外す意味にも読める。
breadth: medium
severity: medium
rating_note: QIU-07、FR-37、FR-44 と、第 3 段階の QR-41、QR-49 が関わる（QIU-07 へのたどり）。違っていれば FR-37 の報告の区分、FR-44 と QR-41、QR-49 の QIU-07 へのたどりを外し、第 1 段階で QIU-07 を見直す。今の読みは守りを残す側なので、違っていても利用者への害はない
answer: 誤り（読みが狭い）。乗車中の危険（危険な運転や犯罪）は、当てはまる CUJ がないため利用時の品質要求の対象にしない。通報と共有を加えないだけでなく、乗車中の危険を減らす利用時の品質要求も置かない（手配した車以外に乗らないことは対象）。ドライバーの振る舞いは、評価と閾値による満足と、苦情への対処で扱う
answered_in: 第 3 段階、#19（未確認の仮定の一覧への訂正）
