id: FRP-09
title: 許諾のときに示した迎車の到着予定を記録する
status: accepted
version: 2
basis: inferred
basis_note: FR-07 版 2 から推定。提案することは質問 17〜19（2026-11-01）の前提の確認
needs_agreement: false
