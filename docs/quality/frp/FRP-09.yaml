- QR-08
- QR-09
changes: FR-10
reason: FR-07 は、許諾のときに示した乗車場所への到着予定時刻から T_cancel_grace を過ぎたかでキャンセル料をかけるかを決めるが、その値を記録する FR がない。FR-10 は到着予定を示すだけで、記録しない。記録がないと、取り消しの後に判定を確かめられず、苦情（FR-45）でも根拠を示せない。
suggested_statement: システムは、依頼が許諾されたとき、乗客に最初に示した乗車場所への到着予定時刻を依頼に記録する。ドライバーが替わったときは、新しいドライバーの許諾のときの値を記録する。
