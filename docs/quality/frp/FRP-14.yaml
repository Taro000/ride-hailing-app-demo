id: FRP-14
title: 依頼のときに示した到着予定時刻に含めた、乗車を始めてから目的地に着くまでの見込みの時間を記録する（FR-45 の変更）
status: proposed
basis: inferred
basis_note: 手配のときに示す到着予定時刻は、ドライバーが見つかるまでと迎車の時間を含むもの（FR-03）になり、乗車を始めてから目的地に着くまでの見込みは示されず、FR-45 も記録しない。システムの見込みのうち乗車を始めてからの部分を確かめること（第 4 段階の質問 22 の回答）は、この記録がないとできない（推定）
premises: []
proposed_by: product-quality-to-slo
origin: [QR-08]
changes: FR-45
reason: QR-08 は、手配のときに示す目的地への到着予定時刻が実際に着いた時刻から外れないことを求める。外れは、ドライバーが見つかるまでの時間、迎車の時間、乗車を始めてからの移動の時間のどれの見込み違いからも生じるが、FR-45 は示した到着予定時刻しか記録しないため、乗車を始めてからの移動の見込みがどれだけ外れたかが分からない。
suggested_statement: システムは、依頼のときに示した目的地への到着予定時刻のうち、乗車を始めてから目的地に着くまでの見込みの時間を、その依頼とともに記録する。
affects: [NFR-08, SLI-08]
placeholders: []
resolution: null
