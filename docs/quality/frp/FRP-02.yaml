reason: FR-29 は請求に失敗すると FR-31（別の支払い手段での支払い）に移るが、決済のサービスが応答しないときを分けていない。失敗と扱えば、実は成功していた請求に加えて別の支払い手段でも払わせ、二重に請求する。
suggested_statement: システムは、降車時の請求に決済のサービスが応答しないとき、失敗と扱わず、同じキー（FR-30）で結果を確かめ、失敗と分かったときだけ未払いの扱い（FR-31）に移り、確かめている間は乗客を降ろして「請求を確かめています」と示す。
