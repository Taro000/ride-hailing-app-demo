id: FRP-05
title: 審査の結果と免許の期限を記録し、期限切れのドライバーの受付を止める
status: rejected
version: 2
basis: inferred
basis_note: 記録することは質問 5 で確認済み。期限切れの扱い（受付を止める）は推定
needs_agreement: true
approver_candidates: [プロダクトオーナー]
proposed_by: functional-requirements-to-product-quality
origin: [QR-37]
changes: null
reason: FR-48 は審査を通ったドライバーを登録するが、審査の結果も免許の期限も記録しない。期限が切れたドライバーが受付を続けられる。
suggested_statement: システムは、運営・サポート担当がドライバーを登録するとき審査を通った日と免許の期限を記録できるようにし、免許の期限を過ぎたドライバーには受付を開始させない。
affects: [QR-37]
placeholders: []
resolution: 受け入れない。本物らしく作る範囲を「データとお金の扱い（個人情報、カード情報、決済と返金の正しさ）は本物どおり、運送の業務の手続き（審査、免許、運賃の認可）は模擬」と決めた（第 2 段階の質問 11）。免許の期限の記録は手続きの側に入る。QR-37 にはこれを支える機能がない
