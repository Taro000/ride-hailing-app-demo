id: QIU-17
title: ドライバーが運転しながら端末を操作せずに、止まってから依頼を受けられる
status: active
basis: inferred
basis_note: ニーズは入力。乗客を乗せずに走っている間にも依頼が届くこと（QAS-01）と、画面を使わずに答える手段は設けず、止まってから依頼を選んで許諾することは第 2 段階の質問 3 で確認済み。測定量と利用状況は推定。走っているかどうかをどこで確かめるかは設計で確認する
premises: [QAS-01, CON-05]
user: USR-02
cuj: CUJ-06
outcomes: [OUT-02]
need: 出来るだけ多くの依頼を受けたい。配車受付までの手間を省きたい
context_of_use:
  device: スマートフォン（対応する端末、CON-05）
  network: 問わない
  user_type: 登録したドライバー
  task: 配車依頼の受付
  environment: 車内。乗客を乗せずに走っている間
  other: null
characteristic: freedom from risk > health and safety risk mitigation
statement: 乗客を乗せずに走っている間に依頼が届いたドライバーは、運転しながら端末を見て操作することなく、止まってから受けたい依頼を選んで許諾できる。
failure_scenario: 良い依頼を逃したくないドライバーが、走りながら依頼の内容を見て許諾の操作をし、前への注意がそれて事故を起こす。受けた依頼も取り消しになる。
measure:
  numerator: 車が走っている間に端末の操作で許諾された依頼
  denominator: ドライバーが許諾した依頼
  narrowed_to: 登録したドライバー。乗客を乗せずに走っている間に届いた依頼。試験用のアカウントを除く
  denominator_needed_only: 許諾された依頼だけを数える
  contribution: 依頼の受け方そのものにプロダクトが効く
  observable: true
  compared_with: null
  scale: ratio
kpi: null
target: null
target_status: undecided
