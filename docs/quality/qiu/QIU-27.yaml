basis_note: CUJ は質問 2 の回答。苦情をシステムの中で受け付け、担当者が対応を終えるまでをシステムに記録すること（observable）と、苦情を寄せるのは自分の乗車についての乗客だけであることは質問 7 で確認済み（QAS-06）。ニーズ、測定量、利用状況は推定
