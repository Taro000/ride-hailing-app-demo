  denominator_needed_only: 迎車が乗車場所に到着したものだけを数え、到着しなかった依頼は QIU-01 で数える
  contribution: どのドライバーとマッチさせるかが効くが、近くにいるドライバーの数や道路の混み具合にも左右されるため、同じ地域・時間帯の中で比べる
