id: QIU-04
title: 乗客が手配時に確認した料金を超えて請求されない
status: active
basis: inferred
basis_note: ニーズ（出来るだけ安く移動したい）と料金の確認は入力。確認した料金がそのまま支払う額になることは質問 1 で確認済み（CON-01）。測定量と利用状況は推定
premises: [CON-01]
user: USR-01
cuj: CUJ-01
outcomes: [OUT-01]
need: 出来るだけ安く目的地に移動したい
context_of_use:
  device: スマートフォン
  network: 問わない
  user_type: 登録した乗客
  task: 配車の手配
  environment: null
  other: null
characteristic: freedom from risk > economic risk mitigation
statement: スマートフォンで配車を手配した乗客は、手配時に確認した料金を超える額や、同じ乗車への二重の額を請求されない。
failure_scenario: 降りた後に、手配時に確かめた料金より高い額や二重の額が請求され、乗客は問い合わせて返金を求め、サービスを使わなくなる。
measure:
  numerator: 手配時に確認した料金を超える額を請求された乗車（二重の請求を含む）
  denominator: 決済された乗車
  narrowed_to: スマートフォンで依頼した登録した乗客。試験用のアカウントを除く
  denominator_needed_only: 決済まで進んだ乗車だけを数える
  contribution: 請求額は料金の計算と決済というプロダクトの振る舞いで決まる
  observable: true
  compared_with: null
  scale: ratio
kpi: null
target: null
target_status: undecided
