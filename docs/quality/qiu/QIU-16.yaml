id: QIU-16
title: ドライバーが手間をかけずに短い時間で依頼を受けられる
status: active
basis: inferred
basis_note: ニーズ（配車受付までの手間を省きたい）は入力。手間を時間で測ることと利用状況は推定
premises: []
user: USR-02
cuj: CUJ-06
outcomes: [OUT-01]
need: 配車受付までの手間を省きたい（乗客の検索・交渉）
context_of_use:
  device: 携帯端末
  network: 問わない
  user_type: 登録したドライバー
  task: 配車依頼の受付
  environment: 車内
  other: null
characteristic: efficiency
statement: 配車依頼を受け付けるドライバーは、乗客を探したり料金を交渉したりせずに、依頼を選んでから短い時間で許諾を終えられる。
failure_scenario: 依頼の金額や乗る場所を確かめるのに手間取り、許諾が遅れる間に乗客が待ちきれずに依頼を取り消し、ドライバーは自分で乗客を探すやり方に戻る。
measure:
