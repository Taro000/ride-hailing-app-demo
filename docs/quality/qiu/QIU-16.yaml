  denominator: ドライバーが許諾した依頼
  narrowed_to: 登録したドライバー。試験用のアカウントを除く
  denominator_needed_only: 許諾まで進んだ依頼だけを数える
  contribution: 依頼の内容の示し方と許諾の手順にプロダクトが直接効く
  observable: true
  compared_with: null
  scale: ratio
kpi: null
