id: EBP-01
title: 配車サービスのエラーバジェット方針
status: active
basis: confirmed
basis_note: 最初の 5 つの規則は質問 2 で下書きのとおり採った。最後の規則は質問 9 と質問 11 の回答で、悪いイベント 1 件で予算を使い切るときは、公開を修正だけに絞る規則（3 つ目）を働かせず、ほかの規則は働かせる
premises: [OPF-01, OPF-02]
applies_to: [NFR-01, NFR-02, NFR-03, NFR-04, NFR-05, NFR-06, NFR-07, NFR-08, NFR-12, NFR-19, NFR-23, NFR-26, NFR-34]
rules:
  - {when: 残りの予算が 50% を下回る, action: 次の作業の区切りでは信頼性を高める作業を先にする}
  - {when: 一つの障害が予算の 20% 以上を使う, action: 振り返りを必ず行い、根本の原因を直す作業を少なくとも一つ先にする}
  - {when: 予算を使い切る（悪いイベント 1 件で使い切るときを除く）, action: ウィンドウの残りの間、公開するのは不具合の修正とセキュリティの修正だけにする}
  - {when: どのウィンドウの終わりにも 50% 以上が残る, action: SLO を厳しくするか、余りを公開の速さと試みに使う}
  - {when: 額の一致（NFR-23）か決済の記録の一致（NFR-26）の予算を使い切る, action: 原因の修正と、すでに記録した誤った額と結果の訂正（運営・サポートの担当者による乗客への対応を含む）の両方をチケットにする}
  - {when: 件数が少なく、悪いイベント 1 件で予算を使い切る, action: 予算の残りで公開を止めるのではなく、悪いイベントを 1 件ずつ振り返る。ほかの規則（公開を修正だけに絞る規則を除く）は働かせる}
