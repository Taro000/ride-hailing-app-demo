id: FR-22
title: 走っている間は依頼を選ぶ操作と許諾を受け付けない
status: active
basis: inferred
basis_note: "走っている間にも依頼が届くこと（QAS-01）、画面を使わずに答える手段は設けないこと、一定の速さ以上で動いている間は依頼を選ぶ操作も許諾も受け付けず、止まってから操作するよう示すことは質問 3 で確認済み。許諾したときの速さの記録は推定で、QIU-17 の測定量のデータになる。車の速さをどう確かめるかは設計で決める。新規であることは質問 4 で確認済み。V_moving_lock の値（時速 5 km）は第 4 段階の決めたこと #4"
premises: [QAS-01]
statement: システムは、乗客を乗せずに走っているドライバーにも依頼を届け、車が V_moving_lock（時速 5 km）以上の速さで動いている間は、依頼を選ぶ操作と許諾の操作を受け付けず、止まってから操作するよう示す。
origin: quality-in-use
cuj: CUJ-06
cuj_step: 依頼を許諾する
traces_to: [QIU-17]
proposal: null
existing: false
extends: null
interface: ["通知: ドライバー", "画面: ドライバーの配車受付"]
acceptance_criteria:
  - 乗客を乗せずに走っているドライバーにも、システムは依頼を届け、届いたことを知らせる。
  - 車が V_moving_lock（時速 5 km）以上の速さで動いている間にドライバーが依頼を選ぶ操作か許諾の操作をすると、システムは受け付けず、止まってから操作するよう示す。
  - 車の速さが V_moving_lock（時速 5 km）を下回ると、システムは依頼を選ぶ操作と許諾の操作を受け付ける。
  - システムは、依頼が許諾されたときの車の速さが V_moving_lock（時速 5 km）を下回っていたかどうかを記録する。
quality_hints:
  - 健康・安全リスク緩和性 (QIU-17) - 走っている間に画面の操作で許諾される依頼がない
