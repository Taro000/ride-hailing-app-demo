id: FR-38
title: 乗車の記録を照会する
status: active
basis: inferred
basis_note: QIU-27 のステートメント（苦情に関わる乗車の記録を確かめる）と、返金の前に支払われた額を確かめる必要（QIU-28, QIU-29）からの推定。キャンセル料か不在の料金（CON-08、質問 8）を請求した依頼も示すことは推定。新規であることは質問 4 で確認済み
premises: [CON-08]
statement: システムは、担当者が乗客、ドライバー、日時から乗車を探し、その乗車の記録を確かめられるようにする。
origin: quality-in-use
cuj: CUJ-14
cuj_step: null
traces_to: [QIU-27, QIU-28, QIU-29]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 担当者が乗客、ドライバー、日時で探すと、システムは当てはまる乗車を示す。
  - 担当者が乗車を選ぶと、システムはその乗車の乗る場所と降りる場所、到着を確認した場所、各段階の時刻、ドライバーと車、料金、決済と返金の額、評価、取り消しの有無と誰が取り消したかを示す。
  - 担当者が探すと、システムはキャンセル料か不在の料金を請求した依頼も示し、選ぶと請求した額とその種類、返金の額、誰がどの段階で依頼を終えたかを示す。
  - 当てはまる乗車がないとき、システムは見つからないことを示す。
quality_hints:
  - 有効性 (QIU-27) - 苦情に関わる乗車の記録を確かめられる
  - 経済リスク緩和性 (QIU-29) - 返金の前に、支払われた額と返金済みの額を確かめられる
