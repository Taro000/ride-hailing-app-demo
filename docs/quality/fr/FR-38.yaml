id: FR-38
title: ブラウザで起きたエラーの記録
status: draft
version: 1
basis: inferred
basis_note: QIU-18・19 から導いた（ブラウザで起きることはサーバーからは見えないため）。受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、乗客とドライバーのブラウザで起きたエラー（画面の処理の失敗、サーバーへの要求の失敗、位置情報の取得の失敗）を、トレース ID と利用者の役割と依頼 ID とともにサーバーに送って記録する。
origin: quality-in-use
cuj: CUJ-10
cuj_step: ログやデータを調査する
traces_to: [QIU-18, QIU-19]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ"
  - "画面: ドライバーの Web アプリ"
  - "API: ブラウザのエラーの受け取り"
acceptance_criteria:
  - 乗客かドライバーのブラウザでエラー（画面の処理の失敗、サーバーへの要求の失敗、位置情報の取得の失敗）が起きると、その内容、時刻、ブラウザの種類、利用者の役割、トレース ID、依頼 ID をサーバーに送って記録する。
  - 通信が切れていて送れないとき、ブラウザに保持し、通信が戻ったら送る。
quality_hints:
  - 有効性 (QIU-18) - ブラウザでだけ起きる障害（位置情報が取れないなど）も、原因をたどれる
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
