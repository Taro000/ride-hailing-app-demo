id: FR-15
title: ドライバーを評価する
status: active
basis: assumed
basis_note: 機能は CUJ-04 の手順（入力）。評価に車の状態を含むことは QAS-02 による仮定。評価を 1〜5 の 5 段階で付け、ドライバーの評価をそのドライバーが受けたすべての評価の平均とすることは質問 9 で確認済み。新規であることは質問 4 で確認済み
premises: [QAS-02]
statement: システムは、乗り終えた乗客が乗ったドライバーを評価できるようにし、その評価をドライバーの評価に加える。
origin: cuj-step
cuj: CUJ-04
cuj_step: ドライバーを評価する
traces_to: [QIU-13, QIU-06]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の乗車後"]
acceptance_criteria:
  - 乗車が終わった乗客が評価を付けると、システムはその乗車の評価として記録し、そのドライバーの評価に加える。
  - 乗客は、評価にドライバーの振る舞いと車の状態（清潔さなど）を含められる。
  - 乗客は評価を 1〜5 の 5 段階で付ける。システムは、ドライバーの評価を、そのドライバーが受けたすべての評価の平均とする。
  - 乗車が始まらなかった依頼（取り消しや乗客の不在で終わったもの）について、システムは評価を受け付けない。
  - すでに評価した乗車に乗客がもう一度評価を付けようとすると、システムは一つの乗車に評価を二つ記録しない。
quality_hints:
  - 有効性 (QIU-13) - 付けた評価が欠けずに記録され、ドライバーの評価に加わる
  - 実用性 (QIU-06) - 評価が、変なドライバーや汚い車を避ける手がかりになる
