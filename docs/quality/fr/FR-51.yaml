id: FR-51
title: 記録してから 3 年を過ぎた記録とデータを、個人を特定できない形に変える
status: active
basis: assumed
basis_note: FRP-05 を受け入れたもの（第 3 段階の QR-59。保存期間 3 年は個人の情報の扱いに関する法令による、第 3 段階の質問 1。記録した日から数えることと残すものは第 3 段階の質問 7）。個人を特定できない形に変わったアカウントでは使い続けられず、使い続けるには担当者が新しいアカウントを作成することは QAS-55 による仮定。どう変えるかは設計で決める
premises: [CON-06, QAS-55]
statement: システムは、位置情報や個人の情報を含む記録とデータを、記録してから 3 年を過ぎると、状態の変化の種類と時刻を残したまま、操作した人と位置を消し、個人を特定できない形に変える。使い続けている参加者のアカウントの情報も同じように扱う。
origin: proposal
cuj: null
cuj_step: null
traces_to: []
proposal: FRP-05
existing: false
extends: null
interface: []
acceptance_criteria:
  - 記録してから 3 年を過ぎた乗車の記録、依頼の経過の記録、位置情報、アカウントの情報について、システムは状態の変化の種類と時刻を残し、操作した人と位置を消して、誰のものか分からない形にする。
  - 個人を特定できない形に変えた記録を、担当者もエンジニアも、誰のものか分かる形では見られない。
  - 記録してから 3 年を過ぎていない記録とデータを、システムは変えない。
  - 使い続けている参加者のアカウントの情報も、記録してから 3 年を過ぎると同じように変わり、そのアカウントでは使えなくなる。その参加者が使い続けるには、担当者が新しいアカウントを作成する（FR-41）。
quality_hints:
  - QR-59 - 記録してから 3 年を過ぎた記録とデータは、個人を特定できない形になっている
