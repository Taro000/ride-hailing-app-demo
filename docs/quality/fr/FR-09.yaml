id: FR-09
title: 手配した車とドライバーを見分ける手がかりを示す
status: active
basis: inferred
basis_note: "機能は CUJ-02 の手順（入力）。手がかりが担当者の登録による内容であることは第 1 段階の報告から。示す項目は推定。新規であることは質問 4 で確認済み。T_boarding の値（1 分）は第 4 段階の決めたこと #13（QAS-44 への訂正）"
premises: [QAS-44]
statement: システムは、配車が確定してから乗車が始まるまで、登録された内容のうち乗客が手配した車とドライバーを見分ける手がかり（車のナンバー、車種、色、ドライバーの名前）を乗客に示す。
origin: cuj-step
cuj: CUJ-02
cuj_step: 手配した車かどうかを確認する
traces_to: [QIU-08, QIU-09, QIU-10]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配"]
acceptance_criteria:
  - 配車が確定すると、システムは許諾したドライバーと車について、登録された車のナンバー、車種、色、ドライバーの名前を示す。
  - 乗車が始まるまで、乗客はいつでもその手がかりを見られる。
  - 担当者が登録を訂正したとき（FR-43）、システムは訂正した後の内容を示す。
quality_hints:
  - 健康・安全リスク緩和性 (QIU-10) - 示す手がかりが、乗車場所に来た実際の車とドライバーに一致する
  - 効率性 (QIU-09) - 迎車が着いてから T_boarding（1 分）以内に乗車が始まる
