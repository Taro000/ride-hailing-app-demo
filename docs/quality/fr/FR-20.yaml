id: FR-20
title: 依頼の内容を示す
status: active
basis: assumed
basis_note: 機能は CUJ-06 の手順（入力）。示す項目は、条件の中身（CUJ-09）と QIU-16 の失敗のシナリオ（金額や乗る場所を確かめるのに手間取る）からの推定。新規であることは質問 4 で確認済み。移動時間の見込みと距離のもとになる道のデータは EXT-02 が作る（第 3 段階の質問 3）。T_accept の値（30 秒）は第 4 段階が提案した仮の値で、QAS-47 による仮定
premises: [CON-01, EXT-02, QAS-47]
statement: システムは、ドライバーが選んだ依頼の内容（金額、乗車場所、現在地から乗車場所までの距離、降りる場所、移動時間の見込み）を示す。
origin: cuj-step
cuj: CUJ-06
cuj_step: 依頼内容を確認する
traces_to: [QIU-16, QIU-15]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの配車受付", EXT-02]
acceptance_criteria:
  - ドライバーが依頼を選ぶと、システムはその依頼の金額、乗車場所、現在地から乗車場所までの距離、降りる場所、移動時間の見込みを示す。
  - 示す金額は、乗客が手配時に確認した料金と同じである。
  - 内容を見ている間に乗客が取り消すかほかのドライバーが許諾すると、システムはその依頼がもう受けられないことを示す。
quality_hints:
  - 効率性 (QIU-16) - 内容を確かめて、依頼を選んでから T_accept（30 秒）以内に許諾を終えられる
  - 有効性 (QIU-15) - ドライバーが内容を確かめたうえで許諾し、許諾の後に取り消さずに済む
