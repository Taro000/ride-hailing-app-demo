id: FR-19
title: 条件に合う依頼だけを届ける
status: active
basis: inferred
basis_note: QIU-20 からの推定。条件の中身（金額・現在地から乗車場所までの距離）は入力。新規であることは質問 4 で確認済み
premises: []
statement: システムは、依頼を受ける条件を設定したドライバーに、金額と現在地から乗車場所までの距離がその条件に合う依頼だけを届ける。
origin: quality-in-use
cuj: CUJ-06
cuj_step: 配車依頼を選ぶ
traces_to: [QIU-20]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの配車受付"]
acceptance_criteria:
  - 金額が条件の最低の金額を下回る依頼を、システムはそのドライバーに届けない。
  - ドライバーの現在地から乗車場所までの距離が条件の距離を超える依頼を、システムはそのドライバーに届けない。
  - 条件を設定していないドライバーには、システムは金額と距離によって依頼を除かない。
  - ドライバーの現在地が分からないとき、システムは距離の条件を確かめられない依頼を届けず、現在地が分からないことをドライバーに示す。
quality_hints:
  - 有効性 (QIU-20) - 条件を設定したドライバーに届く依頼が、いつも条件に合っている
