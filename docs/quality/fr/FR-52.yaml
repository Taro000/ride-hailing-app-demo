id: FR-52
title: 乗客とドライバーの端末で起きたエラーを依頼と結び付けて記録する
status: active
basis: inferred
basis_note: "FRP-09 を受け入れたもの（第 3 段階の QR-41。端末で起きたエラーの記録が欠けないことは第 3 段階の決めたこと #12 で重視に決まった）。どう記録しどう集めるかは設計で決める。受け入れ基準は推定"
premises: []
statement: システムは、乗客とドライバーの端末で起きたエラーを、どの依頼のどの画面で起きたかとともに記録し、エンジニアが依頼の経過（FR-34）と合わせてたどれるようにする。
origin: proposal
cuj: CUJ-10
cuj_step: ログやデータの調査
traces_to: [QIU-21, QIU-27, QIU-28]
proposal: FRP-09
existing: false
extends: null
interface: ["画面: エンジニアの調査"]
acceptance_criteria:
  - 乗客かドライバーの端末でエラーが起きると、システムはそのエラーを、起きた時刻、画面、関わる依頼とともに記録する。
  - エンジニアが依頼の経過をたどると（FR-34）、システムはその依頼で端末に起きたエラーを、システムが行ったことと時刻の順に合わせて示す。
  - 依頼に関わらない画面（依頼の前の設定など）で起きたエラーは、システムはどの利用者のどの画面で起きたかとともに記録する。
  - 端末がシステムとつながらない間に起きたエラーは、つながった後に記録される。
  - エンジニアが見るエラーの記録でも、システムは個人の情報を FR-35 のとおり隠す。
quality_hints:
  - QR-41 - 端末で起きたエラーの記録が一件も欠けず、関わる依頼と結び付いている
