id: FR-45
title: 苦情の一覧と詳細
status: draft
version: 2
basis: inferred
basis_note: QIU-23・24 から導いた。CUJ-14 の手順は入力にない。示す項目は推定。「経路」を記録した位置で示すこと、地図のサービスの経路を持たないこと、保存期間を変えないことは 2026-11-03 の回答（設計 2-3）で確認済み（デモは 1 回が 1〜2 日で、苦情はデモの期間の中で扱うので、T_log_retention の今の提案の 28 日で足りる）。受信の記録が残っていないときの示し方は推定
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当に、受け付けた苦情の一覧を状態と受付の時刻とともに示し、苦情を開くと、報告の内容、その乗車の記録（状態の履歴、記録した位置、料金と請求）、ドライバーと車の情報、そのドライバーの評価値と過去の苦情を示す。
origin: quality-in-use
cuj: CUJ-14
cuj_step: null
traces_to: [QIU-23, QIU-24]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（苦情）"
acceptance_criteria:
  - 受け付けた苦情を、状態（未対応・対処済み）、種類、受付の時刻とともに一覧で示し、状態と種類で絞り込める。
  - 苦情を開くと、報告の内容、その乗車の記録（状態の履歴、記録した位置、料金と請求）、ドライバーと車の情報、そのドライバーの評価値と過去の苦情を一つの画面に示す。
  - 記録した位置は、状態の履歴に残る位置（迎車の到着、乗車の開始、不在、乗車の終了。FR-39）と、T_log_retention の間はドライバーの現在地の受信の記録（FR-17）で示す。地図のサービスの経路は持たない。
  - 受信の記録が T_log_retention を過ぎて残っていないときは、状態の履歴の位置だけを示し、受信の記録がないことを示す。
quality_hints:
  - 効率性 (QIU-24) - 受け付けてから T_complaint 時間以内に対処を決められる
