id: FR-45
title: 配車の経過を記録する
status: active
basis: inferred
basis_note: "QIU と KPI の測定量のデータの出どころが入力にないため加えた（推定）。一つの手順ではなく配車の全体で働くため、cuj と cuj_step は空にした。手配時に示した目的地への到着予定時刻を記録するのは、QIU-05 を記録から数えるため（第 4 段階の決めたこと #21）。どの段階をどう記録するかは設計で決める。新規であることは質問 4 で確認済み"
premises: []
statement: システムは、配車依頼ごとに、乗客が乗る場所を決め始めてから決済と評価が済むまでの各段階が起きたことを、その時刻とともに記録する。
origin: quality-in-use
cuj: null
cuj_step: null
traces_to: [QIU-01, QIU-02, QIU-03, QIU-04, QIU-05, QIU-08, QIU-09, QIU-11, QIU-12, QIU-13, QIU-14, QIU-15, QIU-16, QIU-19, QIU-20, QIU-33, KPI-01, KPI-02, KPI-03]
proposal: null
existing: false
extends: null
interface: []
acceptance_criteria:
  - システムは、乗客が乗る場所を決め始めたこと、依頼したこと（そのときの料金と、示した目的地への到着予定時刻）、迎車が乗車場所に着いたこと、乗車が始まったこと、乗客が乗車中に降りる場所を変えたこと（新しい降りる場所と承認した料金）、到着を確認したこと（その場所）、決済が済んだこと（その額）を、それぞれの時刻とともに記録する。
  - システムは、依頼をどのドライバーに届けたかと、そのときそのドライバーが条件に合っていたか、停止されていたかを記録する。
  - システムは、ドライバーが依頼を選んだことと許諾したこと（どのドライバーが、そのときのドライバーの評価と乗客の閾値）を記録する。
  - システムは、乗客が評価を始めたことと評価を記録したことを記録する。
  - 取り消された依頼、乗客の不在で終わった依頼、許諾されずに終わった依頼についても、システムはそこまでの段階と、誰がどの段階で終えたかを記録する。
quality_hints:
  - 有効性 (QIU-01) - どの依頼についても、測定量が数える段階が欠けずに記録される
