id: FR-39
title: 配車依頼と乗車の状態の履歴
status: draft
version: 2
basis: inferred
basis_note: KPI-01〜03 と多くの QIU の測定量が数える出来事と、QIU-18・19 の調査から導いた。受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、配車依頼と乗車の状態の変化（手配、許諾、取り消し、迎車の到着、乗車の開始、不在、乗車の終了、降車場所の変更、請求、返金）を、時刻、操作した人、位置とともに記録する。
origin: quality-in-use
cuj: CUJ-10
cuj_step: ログやデータを調査する
traces_to: [KPI-01, KPI-02, KPI-03, QIU-01, QIU-02, QIU-04, QIU-06, QIU-07, QIU-11, QIU-13, QIU-15, QIU-16, QIU-18, QIU-19, QIU-23]
proposal: null
existing: false
extends: null
interface:
  - サーバーの処理（状態の記録）
acceptance_criteria:
  - 配車依頼と乗車の状態が変わるたびに（手配、許諾、取り消し、迎車の到着、乗車の開始、不在、乗車の終了、降車場所の変更、請求、返金）、変化の種類、時刻、操作した人（乗客・ドライバー・運営・サポート担当・システム）、そのときの位置を一件ずつ記録する。
  - 記録は書き換えず、追記だけする。ただし、保存期間を過ぎた記録から操作した人と位置を消すとき（FR-53）は除く。
  - テスト用アカウント（FR-01）の依頼の記録には、テスト用の印を残す。
quality_hints:
  - 有効性 (QIU-18) - 依頼の流れを、後から欠けなくたどれる
