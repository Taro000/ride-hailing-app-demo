id: FR-39
title: 配車依頼と乗車の状態の履歴
status: draft
version: 3
basis: inferred
basis_note: KPI-01〜03 と多くの QIU の測定量が数える出来事と、QIU-18・19 の調査から導いた。受け入れ基準は推定。位置を記録するのをドライバーが場所で行う四つの操作に限り、現在地を得られなかったときは得られなかった印を記録することは 2026-11-03 の回答（設計 2-5）で確認済み
needs_agreement: false
approver_candidates: []
statement: システムは、配車依頼と乗車の状態の変化（手配、許諾、取り消し、迎車の到着、乗車の開始、不在、乗車の終了、降車場所の変更、請求、返金）を、時刻と操作した人とともに記録し、ドライバーが場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）では、そのときの位置も記録する。
origin: quality-in-use
cuj: CUJ-10
cuj_step: ログやデータを調査する
traces_to: [KPI-01, KPI-02, KPI-03, QIU-01, QIU-02, QIU-04, QIU-06, QIU-07, QIU-11, QIU-13, QIU-15, QIU-16, QIU-18, QIU-19, QIU-23]
proposal: null
existing: false
extends: null
interface:
  - サーバーの処理（状態の記録）
acceptance_criteria:
  - 配車依頼と乗車の状態が変わるたびに（手配、許諾、取り消し、迎車の到着、乗車の開始、不在、乗車の終了、降車場所の変更、請求、返金）、変化の種類、時刻、操作した人（乗客・ドライバー・運営・サポート担当・システム）を一件ずつ記録する。
  - ドライバーが場所で行う四つの操作（迎車の到着 FR-25、乗車の開始 FR-26、不在 FR-27、乗車の終了 FR-28）では、そのときの位置も記録する。現在地を得られなかったときは、得られなかった印を記録する（迎車の到着では FR-25 の「位置を確かめられなかった」印）。ほかの変化（手配、許諾、取り消し、降車場所の変更、請求、返金、システムが起こす変化）には位置を求めない。
  - 記録は書き換えず、追記だけする。ただし、保存期間を過ぎた記録から操作した人と位置を消すとき（FR-53）は除く。
  - テスト用アカウント（FR-01）の依頼の記録には、テスト用の印を残す。
quality_hints:
  - 有効性 (QIU-18) - 依頼の流れを、後から欠けなくたどれる
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
  - version: 2
    date: 2026-10-31
    change: 追記だけで残す受け入れ基準に、FR-53 で個人情報を消すときの例外を加えた
    reason: FRP-06 を受け入れた（第 2 段階の質問 12）
  - version: 3
    date: '2026-11-03'
    change: 位置を記録する変化を、ドライバーが場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）に限った。四つで現在地を得られなかったときは、得られなかった印を記録する。ほかの変化には位置を求めない
    reason: 設計の連鎖が返した課題（位置のない変化）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-5）。位置のない変化（システムが起こす変化、位置を許可していない乗客の手配、現在地を得られない到着）が正しく起きるのに、もとの AC1 はすべての変化に位置を求めていた
