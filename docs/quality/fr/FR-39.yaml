id: FR-39
title: 返金する
status: active
basis: inferred
basis_note: QIU-28 からの推定。返金を認めるかどうかは担当者の判断（報告書の範囲外）。返金が外部の決済サービスのテスト環境を通ることは CON-03（質問 1 で確認済み）。返金の記録は QIU-28 と QIU-29 の測定量のデータになる。キャンセル料か不在の料金（CON-08、質問 8）を請求した依頼も同じように返金できることは推定。新規であることは質問 4 で確認済み
premises: [CON-03, CON-08, EXT-01]
statement: システムは、担当者が返金を認めた乗車について、認めた額をその乗車の支払いをした乗客に EXT-01 を通して返金できるようにし、返金したことを乗客に知らせる。
origin: quality-in-use
cuj: CUJ-15
cuj_step: null
traces_to: [QIU-28, QIU-29]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者", "通知: 乗客", EXT-01]
acceptance_criteria:
  - 担当者が乗車と返金する額を決めて返金すると、システムはその額の返金を、その乗車の支払いに対して EXT-01 に処理させ、済むと乗客に知らせる。
  - EXT-01 が返金を受け付けなかったか答えなかったとき、システムは済んでいないか済んだかどうかが分からないことを担当者に示し、担当者が返金をやり直せるようにする（FR-40）。
  - キャンセル料か不在の料金を請求した依頼も、システムは乗車と同じように、担当者が認めた額を返金できるようにする。
  - 決済が済んでいない乗車を返金しようとすると、システムは受け付けない。
  - システムは、担当者が認めた返金ごとに、乗車、額、済んだかどうかを記録する。
quality_hints:
  - 有効性 (QIU-28) - 担当者が認めた返金が済む
