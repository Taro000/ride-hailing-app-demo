id: FR-34
title: 一件の依頼の経過をたどる
status: active
basis: inferred
basis_note: "機能は CUJ-10 の手順（入力）。受け入れ基準は推定。どの段階をどう記録するかは設計で決める。新規であることは質問 4 で確認済み。T_cause_found の値（30 分）は第 4 段階の決めたこと #16（QAS-48 への訂正）"
premises: [QAS-48]
statement: システムは、エンジニアが異常やエラーの起きた依頼を探し、その依頼でシステムが行ったことを依頼から決済まで順にたどれるようにする。
origin: cuj-step
cuj: CUJ-10
cuj_step: ログやデータの調査
traces_to: [QIU-21, QIU-22]
proposal: null
existing: false
extends: null
interface: ["画面: エンジニアの調査"]
acceptance_criteria:
  - エンジニアが依頼を探すと、システムはその依頼でシステムが行ったことと、それぞれの結果を順に示す。
  - 知らされた異常やエラー（FR-33）から、エンジニアはそれが起きた依頼をたどれる。
  - たどった結果から、異常やエラーがシステムのどの部分で起きたかが分かる。
  - 存在しない依頼を探すと、システムは見つからないことを示す。
quality_hints:
  - 有効性 (QIU-21) - 異常やエラーが起きたどの依頼も、欠けた段階なくたどれる
  - 効率性 (QIU-22) - 通知から T_cause_found（30 分）以内に原因を特定できる
