id: FR-50
title: 担当者の操作を、行った担当者とともに記録する
status: active
basis: inferred
basis_note: "FRP-03 を受け入れたもの（第 3 段階の QR-44。管理の操作を担当者ごとにたどれることは第 3 段階の決めたこと #15 で重視に決まり、管理の画面の操作の記録はセキュリティのリスク分析の分類にある、第 3 段階の質問 1）。記録する操作は QR-44 が挙げるもの。誰がこの記録を見られるかは FR-49 による。受け入れ基準は推定"
premises: []
statement: システムは、担当者による苦情の対応の記録、返金、アカウントの作成と訂正、試験用の区別の変更、ドライバーと車両の登録と訂正、ドライバーの停止と再開を、行った担当者、時刻、内容とともに記録し、後から探せるようにする。
origin: proposal
cuj: null
cuj_step: null
traces_to: [QIU-27, QIU-29, QIU-30, QIU-31, QIU-32, QIU-33]
proposal: FRP-03
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 担当者が苦情の対応を記録するか、返金、アカウントの作成か訂正、試験用の区別の変更、ドライバーと車両の登録か訂正、ドライバーの停止か再開を行うと、システムは行った担当者、時刻、操作の種類、対象と内容を記録する。
  - 担当者、期間、操作の種類、対象の乗車やアカウントで探すと、システムは当てはまる操作の記録を示す。当てはまるものがないときは、見つからないことを示す。
  - 済まなかった操作（EXT-01 が受け付けなかった返金など）も、システムは済まなかったこととともに記録する。
quality_hints:
  - QR-44 - 返金、登録、訂正、停止の操作を、担当者一人ずつまでたどれる
