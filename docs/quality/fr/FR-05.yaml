id: FR-05
title: 閾値以上のドライバーにだけ依頼を届ける
status: active
basis: inferred
basis_note: "QIU-14 からの推定。評価がまだないドライバーと、評価の件数が N_rating_count_min に満たないドライバーには、閾値を設定した乗客の依頼を届けないことは、FRP-12 を受け入れたもの（第 4 段階の質問 7 で QAS-05 は確認済み）。N_rating_count_min の値（2 件）は第 4 段階の決めたこと #10。T_no_accept の値（30 分）は第 4 段階の決めたこと #19（QAS-50 への訂正）。比べるドライバーの評価は、受けたすべての評価の平均（FR-15、質問 9 で確認済み）。新規であることは質問 4 で確認済み"
premises: [QAS-05, QAS-50]
statement: システムは、評価の閾値を設定した乗客の依頼を、評価の件数が N_rating_count_min（2 件）以上で、評価がその閾値以上のドライバーにだけ届ける。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-14, QIU-06]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの配車受付"]
acceptance_criteria:
  - 乗客が閾値を設定しているとき、システムは評価（FR-15）が閾値を下回るドライバーにその乗客の依頼を届けない。
  - 乗客が閾値を設定していないとき、システムは評価によってドライバーを除かない。
  - 評価がまだないドライバーと、評価の件数が N_rating_count_min（2 件）に満たないドライバーには、システムは閾値を設定した乗客の依頼を届けない。
  - 閾値を満たすどのドライバーも T_no_accept（30 分）の間に許諾しないとき、システムは閾値を満たすドライバーが見つからなかったことを乗客に伝え、閾値を変えて依頼し直せるようにする。
quality_hints:
  - 有効性 (QIU-14) - 閾値を設定した乗客の依頼を許諾するドライバーの評価が、いつも閾値以上である
  - 実用性 (QIU-06) - 閾値を設定した乗客が、変なドライバーや汚い車に当たらない
