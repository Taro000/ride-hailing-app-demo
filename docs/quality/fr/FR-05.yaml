id: FR-05
title: 閾値以上のドライバーにだけ依頼を届ける
status: active
basis: assumed
basis_note: QIU-14 からの推定。評価がまだないドライバーの扱いは QAS-05 による仮定。ドライバーの評価を乗客の評価からどうまとめるかは入力にない（報告書の未解決の点）。新規であることは質問 4 で確認済み
premises: [QAS-05]
statement: システムは、評価の閾値を設定した乗客の依頼を、評価がその閾値以上のドライバーにだけ届ける。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-14, QIU-06]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの配車受付"]
acceptance_criteria:
  - 乗客が閾値を設定しているとき、システムは評価が閾値を下回るドライバーにその乗客の依頼を届けない。
  - 乗客が閾値を設定していないとき、システムは評価によってドライバーを除かない。
  - 評価がまだないドライバーには、システムは閾値を設定した乗客の依頼を届けない。
  - 閾値以上のどのドライバーも T_no_accept の間に許諾しないとき、システムは閾値を満たすドライバーが見つからなかったことを乗客に伝え、閾値を変えて依頼し直せるようにする。
quality_hints:
  - 有効性 (QIU-14) - 閾値を設定した乗客の依頼を許諾するドライバーの評価が、いつも閾値以上である
  - 実用性 (QIU-06) - 乗客が変なドライバーや汚い車に当たらない
