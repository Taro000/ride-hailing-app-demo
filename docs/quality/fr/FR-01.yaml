id: FR-01
title: 乗る場所と降りる場所を決める
status: active
basis: inferred
basis_note: 機能は CUJ-01 の手順（入力）。受け入れ基準は推定。新規であることは質問 4 で確認済み
premises: []
statement: システムは、乗客が配車を手配するときに、乗る場所と降りる場所を決められるようにする。
origin: cuj-step
cuj: CUJ-01
cuj_step: 乗る場所・降りる場所を決める
traces_to: [QIU-01, QIU-02]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配"]
acceptance_criteria:
  - 乗客が場所の名前や住所を入れるか、示された場所から選ぶと、システムはそれを乗る場所または降りる場所として示す。
  - 乗る場所と降りる場所の両方が決まるまで、システムは移動時間と料金の確認に進ませない。
  - 入れた場所が見つからないとき、システムは見つからないことを示してほかの場所を求め、決めてあったもう一方の場所はそのまま残す。
  - 乗る場所と降りる場所が同じとき、システムはそのことを示し、どちらかを変えるよう求める。
quality_hints:
  - 有効性 (QIU-01) - 乗客が決めたとおりの場所が依頼に入る
  - 効率性 (QIU-02) - 乗る場所を決め始めてから T_request_entry 以内に依頼を出し終えられる
