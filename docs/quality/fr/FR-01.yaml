id: FR-01
title: ログインと最初のパスワードの設定
status: draft
version: 3
basis: inferred
basis_note: CUJ-01 の手配に乗客の特定が要ることから推定。テスト用の印は QIU と KPI の測定量の絞り込みから。新規であることは運用の事実（第 1 段階の質問 17）。乗客が自分でアカウントを作らず、運営・サポート担当が作ったアカウント（FR-48）に一度だけ使える設定の符号でパスワードを決めてからログインすること（ドライバーと同じ）は 2026-11-03 の回答（設計 2-9）で確認済み。符号の出し直しを頼むよう示すことは推定。ログインの方式と役割ごとの権限は第 3 段階
needs_agreement: false
approver_candidates: []
statement: システムは、乗客・ドライバー・運営・サポート担当が、それぞれのアカウントでログインして、自分の役割の画面を使えるようにする。乗客とドライバーは、運営・サポート担当が作ったアカウント（FR-48）に、一度だけ使える設定の符号で最初のパスワードを決めてからログインする。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-08, QIU-11, KPI-01, KPI-02, KPI-03]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（ログイン、設定の符号でパスワードを決める）"
  - "画面: ドライバーの Web アプリ（ログイン、設定の符号でパスワードを決める）"
  - "画面: 管理の画面（ログイン）"
acceptance_criteria:
  - 乗客とドライバーが、運営・サポート担当から受け取った設定の符号（FR-48）でパスワードを決めると、その符号は使えなくなり、そのアカウントでログインして自分の役割の画面（乗客は手配、ドライバーは受付）を使える。
  - 一度使った設定の符号、出し直す前の古い符号、または正しくない符号でパスワードを決めようとしたとき、パスワードを決めさせず、運営・サポート担当に符号の出し直しを頼むよう示す。
  - 乗客が自分でアカウントを作る手段はない。ログインしていない人には、ログインと、設定の符号でパスワードを決める画面だけを示す。
  - 運営・サポート担当は、あらかじめ用意されたアカウントでログインし、管理の画面を使う。
  - 誤った資格情報でログインしようとしたとき、ログインさせずその旨を示す。
  - アカウントにテスト用の印を付けられ、そのアカウントの出来事の記録（FR-39）にも印が残る（測定量からテスト用アカウントを除くため）。
quality_hints:
  - 有効性 (QIU-08) - 他人のアカウントで手配され、請求されることがない
