    change: 迎車中の乗客に、確認コードを伝えて画面が乗車中に変わってから乗るよう示し、変わらなければ手配した車ではないと案内する受け入れ基準を足した（確認コードを両方向の確かめに使う）
    reason: 設計の連鎖が返した課題（乗客がドライバーを確かめる）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-5）。新しい機能は足さない
