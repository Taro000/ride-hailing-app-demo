id: FR-26
title: 乗車場所での乗客の不在を扱う
status: active
basis: assumed
basis_note: "QIU-08 の失敗のシナリオ（ドライバーが待ちきれずに乗客の不在として去る）と、KPI-02 の残り（乗車場所での乗客の不在）からの推定。乗客の不在で終わった依頼に不在の料金がかかることは質問 8 で確認済み（CON-08）。新規であることは質問 4 で確認済み。T_noshow_wait の値（5 分）は第 4 段階が提案した仮の値で、QAS-51 による仮定。迎車が着いたとみなす範囲を D_pickup_position_gap（50 m、第 4 段階の決めたこと #3）とすることは、第 4 段階の QAS-52 による仮定"
premises: [CON-08, QAS-51, QAS-52]
statement: システムは、迎車が乗車場所に着いて T_noshow_wait（5 分）待っても乗車が始まらないとき、ドライバーが乗客の不在として依頼を終えられるようにし、そのことと不在の料金（CON-08）を請求したことを乗客に知らせる。
origin: quality-in-use
cuj: CUJ-07
cuj_step: 依頼主かどうかを確認する
traces_to: [QIU-08, KPI-02]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの迎車", "通知: 乗客"]
acceptance_criteria:
  - 迎車が乗車場所から D_pickup_position_gap（50 m）以内に着いてから T_noshow_wait（5 分）が過ぎても乗車が始まっていないとき、ドライバーは乗客の不在として依頼を終えられ、システムは乗客にそのことと、不在の料金を請求したこと（FR-54）を知らせる。
  - 迎車が着いてから T_noshow_wait（5 分）が過ぎる前にドライバーが乗客の不在として終えようとすると、システムは受け付けず、待つ残りの時間を示す。
  - 迎車が乗車場所に着く前は、システムは乗客の不在として終えさせない（取り消しは FR-23）。
quality_hints:
  - 有効性 (QIU-08) - 乗客が乗車場所に来る前にドライバーが去らない
