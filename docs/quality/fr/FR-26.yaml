id: FR-26
title: 依頼主の確認と運転の開始
status: draft
version: 2
basis: inferred
basis_note: 手順は入力。確認コードを使うことは質問 8 で確認済み。受け入れ基準の細部は推定。確認コードを両方向の確かめに使うこと（コードは手配したドライバーのアプリでしか通らないので、乗客の画面が乗車中に変わることが、乗客にとってドライバーの確かめになる）は 2026-11-03 の回答（設計 1-5）で確認済み。乗客が画面を確かめずに乗ると防げない危険は受け入れる（要合意）
needs_agreement: true
approver_candidates: [プロダクトオーナー]
statement: システムは、ドライバーが乗客から聞いた確認コードを入れ、手配の確認コードと一致したときだけ運転を開始し、乗客とドライバーの画面を乗車中に変える。迎車中の乗客には、確認コードをドライバーに伝え、画面が乗車中に変わってから乗るよう示す。
origin: cuj-step
cuj: CUJ-07
cuj_step: 依頼主かどうかを確認する
traces_to: [QIU-05, QIU-15, KPI-03]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（迎車中）"
  - "画面: 乗客の Web アプリ（迎車中、乗車中）"
acceptance_criteria:
  - ドライバーが乗客から聞いた確認コードを入れ、手配の確認コードと一致すると、乗車の開始の時刻と位置を記録し、乗客とドライバーの画面を乗車中に変える。
  - 確認コードが一致しないとき、運転を開始させず、依頼主かどうか確かめるよう示す。
  - 迎車中の乗客の画面に、乗る前に確認コードをドライバーに伝え、画面が乗車中に変わってから乗るよう示す。変わらなければ手配した車ではないと案内する。
quality_hints:
  - 健康・安全リスク緩和性 (QIU-05) - 手配した車以外に乗らない
  - 効率性 (QIU-04) - 確認の手間で、乗車の開始が T_board 分を超えて遅れない
changelog:
