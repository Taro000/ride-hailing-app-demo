id: FR-44
title: ドライバーを停止・再開する
status: active
basis: inferred
basis_note: "QIU-33 からの推定。停止しても依頼は外れず、迎車中と乗車中の依頼は終わるまで続けられること、停止中は受付を始めさせず新しい依頼を示さないことは質問 6 で確認済み。停止の前にそのドライバーの一覧に届いていた、まだ許諾していない依頼も除いて許諾させないことは、FRP-04 を受け入れたもの（第 3 段階の QR-49）。乗車中の危険は利用時の品質要求の対象にしない（第 3 段階の決めたこと #19、QAS-08）ため、たどる先は QIU-33 だけ。新規であることは質問 4 で確認済み"
premises: [QAS-08]
statement: システムは、担当者がドライバーを停止できるようにし、停止した時からそのドライバーに受付を始めさせず、停止の前に届いていた依頼を含めてまだ許諾していない依頼を示さず許諾させないようにし、停止を解いて再開できるようにする。
origin: quality-in-use
cuj: CUJ-18
cuj_step: null
traces_to: [QIU-33]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者", "通知: ドライバー"]
acceptance_criteria:
  - 担当者がドライバーを停止すると、システムはその時からそのドライバーに新しい依頼を示さず、停止の前にそのドライバーの一覧に届いていたまだ許諾していない依頼も一覧から除き、ドライバーに停止されたことを示す。
  - 停止されたドライバーが、停止の前に開いていた依頼を許諾しようとすると、システムは受け付けず、停止されていることを示す。
  - 停止している間、システムはそのドライバーに受付を始めさせない（FR-17）。
  - 停止したドライバーが許諾していた迎車中の依頼と進んでいる乗車は、システムは外さず、終わるまで続けさせる。
  - 停止したドライバーに迎車中か乗車中の依頼があるとき、システムはそのことを担当者に示す。
  - すでに停止しているドライバーを停止しようとすると、システムは停止していることを示す。
  - 担当者が停止を解くと、システムはそのドライバーが再び受付を始められるようにする。
quality_hints:
  - 有効性 (QIU-33) - 停止した後、そのドライバーに新しい依頼が一件も届かない
