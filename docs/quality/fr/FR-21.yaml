id: FR-21
title: 依頼を許諾する
status: active
basis: assumed
basis_note: 機能は CUJ-06 の手順（入力）。最初に許諾したドライバーに割り当てることは、依頼を選んで許諾する手順からの推定。新規であることは質問 4 で確認済み。T_accept の値（30 秒）は第 4 段階が提案した仮の値で、QAS-47 による仮定
premises: [QAS-47]
statement: システムは、ドライバーが依頼を許諾できるようにし、最初に許諾したドライバーにその依頼を割り当てる。
origin: cuj-step
cuj: CUJ-06
cuj_step: 依頼を許諾する
traces_to: [QIU-15, QIU-16, KPI-03]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの配車受付"]
acceptance_criteria:
  - ドライバーが依頼を許諾すると、システムはその依頼をそのドライバーに割り当て、ほかのドライバーには届けない。
  - 二人のドライバーがほぼ同時に同じ依頼を許諾すると、システムは一人だけに割り当て、もう一人にはその依頼がもう受けられないことを示す。
  - 乗客が取り消した依頼をドライバーが許諾しようとすると、システムは取り消されたことを示し、割り当てない。
quality_hints:
  - 有効性 (QIU-15) - 許諾した依頼で、取り消しにならずに乗車場所に着ける
  - 効率性 (QIU-16) - 依頼を選んでから T_accept（30 秒）以内に許諾を終えられる
