id: FR-35
title: 調査で個人の情報を隠す
status: active
basis: inferred
basis_note: QIU-23（原因の特定に要らない個人の情報を見ない）からの推定。誰がどの情報を見たかの記録は、QIU-23 の測定量のデータになる。新規であることは質問 4 で確認済み
premises: []
statement: システムは、エンジニアが調査で見る内容から乗客とドライバーの個人の情報を隠し、原因の特定に要るときだけ依頼ごとに理由を示して見られるようにし、誰がいつどの依頼の個人の情報を見たかを記録する。
origin: quality-in-use
cuj: CUJ-10
cuj_step: ログやデータの調査
traces_to: [QIU-23]
proposal: null
existing: false
extends: null
interface: ["画面: エンジニアの調査"]
acceptance_criteria:
  - エンジニアが依頼をたどると、システムは乗客とドライバーの名前、連絡先、乗る場所と降りる場所を隠して示す。
  - 隠したままでも、同じ乗客や同じドライバーの依頼であることは分かる。
  - エンジニアが理由を示して個人の情報を見ると、システムはその依頼の隠した情報を示し、誰が、いつ、どの依頼の、どの情報を、どの理由で見たかを記録する。
  - 理由を示さずに見ようとすると、システムは隠した情報を示さない。
quality_hints:
  - 経済リスク緩和性 (QIU-23) - 原因の特定に要らない個人の情報が、調査で見られない
