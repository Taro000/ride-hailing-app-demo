id: FR-02
title: 現在地を乗る場所として示す
status: active
basis: inferred
basis_note: "QIU-02 の失敗のシナリオ（屋外で場所を入れるのに手間取る）からの推定。新規であることは質問 4 で確認済み。T_request_entry の値（30 秒）は第 4 段階の決めたこと #12（QAS-40 への訂正）"
premises: [QAS-40]
statement: システムは、乗客が配車の手配を始めると、乗客の現在地を乗る場所として示し、乗客が別の場所に変えられるようにする。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 乗る場所・降りる場所を決める
traces_to: [QIU-02]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配"]
acceptance_criteria:
  - 乗客が配車の手配を始めると、システムは乗客の現在地を乗る場所として示す。
  - 乗客が別の場所を乗る場所に決めると、システムは現在地の代わりにその場所を乗る場所とする。
  - 乗客の現在地が分からないとき、システムは現在地を示せないことを伝え、乗る場所を入れるよう求める。
quality_hints:
  - 効率性 (QIU-02) - 乗る場所を決め始めてから T_request_entry（30 秒）以内に依頼を出し終えられる
