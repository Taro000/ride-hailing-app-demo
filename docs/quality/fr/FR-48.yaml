id: FR-48
title: 本人であることを確かめて使い始める
status: active
basis: inferred
basis_note: "FRP-01 を受け入れたもの（第 3 段階の QR-10。本人だけがログインできることは第 3 段階の決めたこと #18 で重視に決まり、ログインの方式はセキュリティのリスク分析の分類にある、第 3 段階の質問 1）。どう確かめるかは設計で決める。担当者が参加者に設定の符号を直接渡すこと（DIN-07）は設計への申し送りで、この FR には書かない。受け入れ基準は推定"
premises: []
statement: システムは、乗客、ドライバー、運営・サポートの担当者、エンジニアが、そのアカウントの本人であることを確かめてから、そのアカウントで機能を使わせる。
origin: proposal
cuj: null
cuj_step: null
traces_to: [QIU-04, QIU-23, QIU-29]
proposal: FRP-01
existing: false
extends: null
interface: ["画面: 乗客", "画面: ドライバー", "画面: 運営・サポートの担当者", "画面: エンジニア"]
acceptance_criteria:
  - 本人であることが確かめられた利用者に、システムはそのアカウントで機能を使わせる。
  - 本人であることを確かめられないとき、システムはそのアカウントでどの機能も使わせず、確かめられなかったことを示す。
  - 本人であることを確かめていない利用者が依頼、許諾、乗車の開始、決済、返金、登録、停止、調査の機能を使おうとすると、システムは使わせず、本人であることを確かめるよう求める。
  - 利用者が使い終える操作をすると、システムはその後、本人であることを確かめ直すまでそのアカウントで機能を使わせない。
quality_hints:
  - QR-10 - 本人であることを確かめた人だけがアカウントを使える
