id: FR-16
title: マッチするドライバーの評価の閾値を設定する
status: active
basis: inferred
basis_note: 機能は CUJ-05 の手順（入力）。受け入れ基準は推定。評価の段階（1〜5）は FR-15 と同じで、質問 9 で確認済み。新規であることは質問 4 で確認済み
premises: []
statement: システムは、乗客がマッチするドライバーの評価の閾値を設定、変更、解除できるようにする。
origin: cuj-step
cuj: CUJ-05
cuj_step: 評価が一定以上のドライバーのみマッチするように閾値を設定する
traces_to: [QIU-14]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の設定"]
acceptance_criteria:
  - 乗客が閾値を設定するか変えると、システムはその後の依頼にその閾値を使う（FR-05）。
  - 乗客が閾値を解除すると、システムはその後の依頼で評価によってドライバーを除かない。
  - 乗客は閾値を評価の段階（1〜5）の値で設定する。その範囲にない値を設定しようとすると、システムは受け付けず、設定できる範囲を示す。
quality_hints:
  - 有効性 (QIU-14) - 設定した閾値が、その後のどの依頼にも使われる
