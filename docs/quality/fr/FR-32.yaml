acceptance_criteria:
  - ドライバーが条件を設定するか変えると、システムはその後に届ける依頼にその条件を使う（FR-19）。
  - ドライバーが条件を解除すると、システムは金額と距離によって依頼を除かない。
  - 金額や距離に 0 より小さい値や数でない値を入れると、システムは受け付けず、正しい値を求める。
