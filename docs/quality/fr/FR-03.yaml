id: FR-03
title: 移動時間と料金を示す
status: active
basis: inferred
basis_note: 機能は CUJ-01 の手順（入力）。示す料金が支払う額になることは CON-01（第 1 段階の質問 1 と、この段階の質問 7 で確認済み）。受け入れ基準は推定。新規であることは質問 4 で確認済み
premises: [CON-01]
statement: システムは、乗る場所と降りる場所が決まると、依頼する前に、その間の移動時間の見込みと乗客が支払う料金を示す。
origin: cuj-step
cuj: CUJ-01
cuj_step: 移動時間と料金を確認する
traces_to: [QIU-04, QIU-05]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配"]
acceptance_criteria:
  - 乗る場所と降りる場所が決まると、システムは依頼する前に、その間の移動時間の見込みと料金を示す。
  - システムは、示す料金が依頼すると確定し、乗車中に降りる場所を変えて新しい料金を承認しない限り、そのまま支払う額（確定額）になることを乗客に示す。
  - 乗客が乗る場所か降りる場所を変えると、システムは新しい場所の間の移動時間の見込みと料金を示し直す。
  - 二つの場所の間を車で行く道が見つからないとき、システムは移動時間と料金を示せないことを伝え、依頼させない。
quality_hints:
  - 経済リスク緩和性 (QIU-04) - 示した料金と、その依頼で請求する額が一致する
  - 信用性 (QIU-05) - 示した移動時間の見込みが、実際の移動時間から大きく外れない
