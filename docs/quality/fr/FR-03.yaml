id: FR-03
title: 所要時間・到着予定時刻・料金の提示
status: draft
version: 1
basis: inferred
basis_note: 手順は入力。料金を手配時に確定することは第 1 段階の質問 5 で確認済み。示した値を依頼に記録すること（QIU-02・08 の測定量）は推定
needs_agreement: false
approver_candidates: []
statement: システムは、指定された乗る場所と降りる場所から、外部の地図・経路・渋滞の情報を使って、目的地への到着予定時刻、所要時間、確定する料金を計算し、手配の前に乗客に示す。
origin: cuj-step
cuj: CUJ-01
cuj_step: 移動時間と料金を確認する
traces_to: [QIU-02, QIU-03, QIU-08]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配）"
  - "外部: 地図・経路・渋滞の情報のサービス"
acceptance_criteria:
  - 乗る場所と降りる場所が決まると、目的地への到着予定時刻、所要時間、料金を示す。
  - 乗る場所か降りる場所を変えると、示す値を計算し直す。
  - 外部のサービスから経路や渋滞の情報を得られないとき、値を示さず、手配に進めないことと理由を示す。
  - 手配したとき、そのとき示していた到着予定時刻と料金を依頼に記録する（QIU-02 と QIU-08 の比較に使う）。
quality_hints:
  - 効率性 (QIU-02) - 示す到着予定時刻が、実際の到着から T_late 分を超えて外れない
  - 経済リスク緩和性 (QIU-08) - 示した料金と請求する額が一致する
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
