id: FR-47
title: 乗車中に降りる場所を変える
status: active
basis: inferred
basis_note: "加えること、変えたときの料金と到着予定の時刻を示すこと、乗客が承認するとドライバーに新しい降りる場所を示して確定した料金を更新することは質問 7 で確認済み（CON-01）。承認しないときと異常系は推定。場所の名前・住所と位置、道と移動時間の見込みのもとになるデータは EXT-02 が作る（第 3 段階の質問 3）。D_dropoff_gap の値（30 m）は第 4 段階の決めたこと #14（QAS-45 への訂正）。新規であることは質問 4 で確認済み"
premises: [CON-01, EXT-02, QAS-45]
statement: システムは、乗車中に乗客が降りる場所を変えられるようにし、変えたときの料金と到着予定の時刻を示し、乗客が承認すると、ドライバーに新しい降りる場所を示して、確定した料金をその料金に更新する。
origin: quality-in-use
cuj: CUJ-03
cuj_step: 正しい場所に到着したかを確認する
traces_to: [QIU-11, QIU-04]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の乗車中", "画面: ドライバーの乗車中", "通知: ドライバー", EXT-02]
acceptance_criteria:
  - 乗車中に乗客が新しい降りる場所を決めると、システムはそこまで行くときの料金と到着予定の時刻を示し、乗客の承認を求める。
  - 乗客が承認すると、システムはドライバーに新しい降りる場所を示し（FR-24）、確定した料金を承認された料金に更新する。
  - 乗客が承認しないとき、システムは降りる場所と確定した料金を変えない。
  - 新しい降りる場所が見つからないか、そこまで車で行く道が見つからないとき、システムは料金と到着予定の時刻を示せないことを伝え、降りる場所を変えない。
  - EXT-02 が答えないとき、システムは料金と到着予定の時刻を示せないことを伝え、降りる場所を変えない。
  - ドライバーが到着を確認した後に乗客が降りる場所を変えようとすると、システムは受け付けない。
quality_hints:
  - 有効性 (QIU-11) - 変えた後の降りる場所から D_dropoff_gap（30 m）以内で降りられる
  - 経済リスク緩和性 (QIU-04) - 乗客が承認した料金を超えて請求しない
