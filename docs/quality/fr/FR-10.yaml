id: FR-10
title: 迎車の到着を乗客に知らせる
status: active
basis: assumed
basis_note: "機能は CUJ-02 の手順（入力）。受け入れ基準は推定。迎車が着いたことをどう知るかは設計で決める。新規であることは質問 4 で確認済み。T_boarding の値（1 分）は第 4 段階の決めたこと #13（QAS-44 への訂正）。迎車が着いたとみなす範囲を D_pickup_position_gap（50 m、第 4 段階の決めたこと #3）とすることは、第 4 段階の QAS-52 による仮定"
premises: [QAS-44, QAS-52]
statement: システムは、迎車が乗車場所に着くと、そのことを乗客に知らせる。
origin: cuj-step
cuj: CUJ-02
cuj_step: 手配した車かどうかを確認する
traces_to: [QIU-08, QIU-09, KPI-02]
proposal: null
existing: false
extends: null
interface: ["通知: 乗客"]
acceptance_criteria:
  - 迎車が乗車場所から D_pickup_position_gap（50 m）以内に着くと、システムは迎車が着いたことを乗客に知らせる。
  - 乗車が始まるまで、システムは迎車が着いていることを乗客の画面に示し続ける。
quality_hints:
  - 有効性 (QIU-08) - 迎車が着いたことを乗客が知り、行き違わずに合流できる
  - 効率性 (QIU-09) - 迎車が着いてから T_boarding（1 分）以内に乗車が始まる
