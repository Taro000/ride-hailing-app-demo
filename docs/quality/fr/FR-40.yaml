id: FR-40
title: 支払われた額を超えて返金しない
status: active
basis: inferred
basis_note: QIU-29（誤った額や二重の返金をしない）からの推定。同じ返金をどう見分けるかは設計で決める。キャンセル料か不在の料金を請求した依頼（CON-08）にも同じ限りを当てることは推定。新規であることは質問 4 で確認済み
premises: [CON-08, EXT-01]
statement: システムは、一つの乗車、またはキャンセル料か不在の料金を請求した一つの依頼への返金を、合わせてそれに支払われた額までに限り、同じ返金を二度行わない。
origin: quality-in-use
cuj: CUJ-15
cuj_step: null
traces_to: [QIU-29]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者", EXT-01]
acceptance_criteria:
  - 返金する額とその乗車にすでに返金した額の合計が支払われた額を超えるとき、システムは返金せず、返金できる残りの額を示す。
  - 済んだ返金について担当者がもう一度返金を行うと、システムは最初の結果を示し、二度目の返金をしない。
  - EXT-01 が答えず結果が担当者に示されなかった返金を担当者がやり直すと、システムはその返金を一度だけ行い、済んだかどうかを示す。
  - 同じ乗車について別に認めた二つ目の返金は、合計が支払われた額を超えない限り行う。
quality_hints:
  - 経済リスク緩和性 (QIU-29) - 誤った額や二重の返金がない。EXT-01 が答えないときも同じ
