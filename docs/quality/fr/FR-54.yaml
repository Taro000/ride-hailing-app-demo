id: FR-54
title: 依頼のときに確定額を押さえる
status: active
basis: inferred
basis_note: 依頼のときに確定額を押さえ、決済ではその押さえから請求すること、許諾の後に乗客が取り消した依頼と乗客の不在で終わった依頼では押さえからキャンセル料か不在の料金（CON-08）を請求して残りを解き、許諾の前に取り消した依頼では押さえを全部解くことは質問 8 で確認済み。押さえと請求は EXT-01 が処理し、実際のお金は動かない（CON-03）。ドライバーが取り消してほかのドライバーに届け直している間に乗客が取り消した依頼を許諾の前の取り消しと同じに扱うこと、乗車中に上がった確定額を押さえ直せないときに降りる場所を変えないこと、EXT-01 が答えないときの扱いは推定。新規であることは質問 4 で確認済み
premises: [CON-01, CON-03, CON-08, EXT-01]
statement: システムは、乗客が配車を依頼すると、確定額を乗客が登録した支払い方法で EXT-01 に押さえさせ、決済ではその押さえから確定額を、許諾の後の乗客の取り消しと乗客の不在ではキャンセル料か不在の料金（CON-08）を請求させ、残りの押さえを解く。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-19, QIU-04]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配", EXT-01]
acceptance_criteria:
  - 乗客が依頼すると、システムは確定額を乗客の支払い方法で EXT-01 に押さえさせ、押さえられたときに依頼を受け付ける（FR-04）。
  - EXT-01 が押さえを受け付けなかったとき、システムは依頼を受け付けず、理由を示して支払い方法を変えるよう求める（FR-46）。
  - EXT-01 が答えなかったとき、システムは依頼を受け付けず、押さえが済んでいたと後で分かればそれを解く。
  - 乗車中に降りる場所を変えて確定額が上がるとき（FR-47）、システムは上がった確定額を押さえ直させ、押さえ直せないときは降りる場所を変えず、そのことを乗客に示す。
  - 決済（FR-29）では、システムは押さえから確定額を請求させ、残った押さえを解く。
  - ドライバーが許諾した後に乗客が依頼を取り消すと（FR-07）、システムは押さえからキャンセル料（CON-08）を請求させ、残りの押さえを解く。
  - 乗客の不在で依頼が終わると（FR-26）、システムは押さえから不在の料金（CON-08）を請求させ、残りの押さえを解く。
  - どのドライバーも許諾していない間に乗客が依頼を取り消したとき（ドライバーが取り消して届け直している間を含む）と、許諾のないまま依頼が終わったとき、システムは何も請求せず、押さえを全部解く。
  - 一つの依頼に、システムはキャンセル料か不在の料金を一度だけ請求する。
  - システムは、依頼ごとに、押さえた額、請求した額とその種類（確定額、キャンセル料、不在の料金）、解いた額を記録する。
quality_hints:
  - 有効性 (QIU-19) - 押さえた依頼の決済が、支払い方法で払えないために済まないことがない
  - 経済リスク緩和性 (QIU-04) - 押さえと請求が確定額を超えず、キャンセル料と不在の料金は CON-08 の額で、一つの依頼に一度だけ請求される
