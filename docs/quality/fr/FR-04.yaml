id: FR-04
title: 配車を依頼する
status: active
basis: inferred
basis_note: 機能は CUJ-01 の手順（入力）。許諾されない依頼を終えること、進んでいる依頼があるときに二つ目を受け付けないこと、支払い方法のない依頼を受け付けないこと（CON-03）は推定。新規であることは質問 4 で確認済み
premises: [CON-01, CON-03]
statement: システムは、乗客が示された移動時間と料金で配車を依頼すると、依頼を受け付けてドライバーに届け、ドライバーを探していることを乗客に示す。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-03, KPI-01]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配"]
acceptance_criteria:
  - 移動時間と料金が示されているとき、乗客が依頼すると、システムは示したとおりの乗る場所、降りる場所、料金で依頼を受け付け、ドライバーを探していることを示す。
  - 依頼してから T_no_accept の間どのドライバーも許諾しないとき、システムは依頼を終え、ドライバーが見つからなかったことを乗客に伝える。
  - 乗客にまだ終わっていない依頼があるとき、乗客がもう一度依頼すると、システムは依頼が進んでいることを示し、二つ目の依頼を受け付けない。
  - 使える支払い方法を登録していない乗客が依頼しようとすると、システムは支払い方法の登録（FR-46）を求め、依頼を受け付けない。
quality_hints:
  - 有効性 (QIU-01) - 依頼した配車で、迎車が乗車場所まで来る
  - 効率性 (QIU-03) - 依頼してから T_pickup_wait 以内に迎車が乗車場所に着く
