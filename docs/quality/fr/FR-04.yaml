id: FR-04
title: 支払い手段の登録
status: draft
version: 2
basis: inferred
basis_note: アプリ内の決済は第 1 段階の質問 5 で確認済み。登録の機能と受け入れ基準は推定。カード情報の扱い（PCI DSS）は第 3 段階
needs_agreement: false
approver_candidates: []
statement: システムは、乗客がカードなどの支払い手段を決済の外部サービスに登録し、変更・削除できるようにする。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-07, QIU-16]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（支払い手段）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 乗客が支払い手段を登録すると、手配のときにその支払い手段を使う。
  - 決済のサービスが受け付けない支払い手段（期限切れ、番号の誤りなど）は、登録せず理由を示す。
  - 進行中の依頼で使っている支払い手段を削除しようとしたとき、削除せずその旨を示す。
quality_hints:
  - 効率性 (QIU-07) - 降車時に乗客が支払いの操作をせずに済む
  - 有効性 (QIU-16) - 登録した支払い手段で決済できない乗車を減らす
changelog:
  - version: 1
    date: 2026-10-28
    change: 作成
    reason: 第 2 段階の下書き（質問 1〜10 の回答を反映）
  - version: 2
    date: 2026-10-31
    change: 品質のヒントの特性を経済リスク緩和性から有効性に直した
    reason: 第 1 段階の再実行で、たどる QIU が版 2（有効性）になった
