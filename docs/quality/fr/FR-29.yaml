id: FR-29
title: 決済する
status: active
basis: inferred
basis_note: "機能は CUJ-08 の手順（入力）。額が確定した料金であることは CON-01（第 1 段階の質問 1 と、この段階の質問 7 で確認済み）、決済が外部の決済サービスのテスト環境を通り実際のお金が動かないことは CON-03（質問 1 で確認済み）。受け入れ基準は推定。新規であることは質問 4 で確認済み。T_alighting の値（30 秒）は第 4 段階の決めたこと #15（QAS-46 への訂正）"
premises: [CON-01, CON-03, EXT-01, QAS-46]
statement: システムは、到着を確認した乗車でドライバーが決済を行うと、確定した料金（手配時に乗客が確認した料金。乗車中に降りる場所を変えたときは乗客が承認した料金）の支払いを、乗客が登録した支払い方法で EXT-01 に処理させ、結果をドライバーと乗客に示す。
origin: cuj-step
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-19, QIU-04, QIU-12]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの乗車中", EXT-01]
acceptance_criteria:
  - 到着を確認した乗車でドライバーが決済を行うと、システムは確定した料金の支払いを EXT-01 に処理させ、済んだことと額をドライバーに示す。
  - 実際の移動時間や道のりが見込みと違っても、システムは確定した料金で決済する。
  - 乗客は、決済のためにドライバーにお金を渡したり、操作したりしなくてよい。
  - EXT-01 が支払いを受け付けなかったとき、システムは済んでいないことと理由をドライバーと乗客に示し、乗客が支払い方法を変えた後に（FR-46）ドライバーが決済をやり直せるようにする。
  - EXT-01 が答えなかったとき、システムは済んだかどうかが分からないことをドライバーと乗客に示し、結果が分かるとそれを示す。
quality_hints:
  - 有効性 (QIU-19) - 乗車ごとに正しい額で決済が済む
  - 経済リスク緩和性 (QIU-04) - 確定した料金を超えて請求しない
  - 効率性 (QIU-12) - 降りる場所に着いてから T_alighting（30 秒）以内に降車を終えられる
