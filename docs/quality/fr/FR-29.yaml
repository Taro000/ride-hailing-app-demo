id: FR-29
title: 降車時の決済
status: draft
version: 2
basis: inferred
basis_note: 手順は入力。料金を手配時に確定しアプリ内で決済することは第 1 段階の質問 5、手配時に押さえて降車時に請求することは質問 9 で確認済み
needs_agreement: false
approver_candidates: []
statement: システムは、乗車が終わると、乗客の操作なしに、確定した料金を押さえていた支払い手段で請求し、結果を乗客とドライバーに示す。決済のサービスが応答しないときは失敗と扱わず、同じキー（FR-30）で結果を確かめる。
origin: cuj-step
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-07, QIU-08, QIU-16]
proposal: null
existing: false
extends: null
interface:
  - "外部: 決済のサービス"
  - "画面: 乗客の Web アプリ（乗車中）"
  - "画面: ドライバーの Web アプリ（乗車中）"
acceptance_criteria:
  - 乗車が終わると、乗客の操作なしに、確定した料金（降車場所を変えたときは変更後の料金）を押さえていた支払い手段で請求し、両方の画面に支払いの完了を示す。
  - 決済のサービスが請求の失敗を返したとき、FR-31 の扱いに移る。
  - 決済のサービスが応答しないとき、失敗と扱わず、同じキー（FR-30）で請求の結果を確かめる。確かめている間は乗客を降ろし、両方の画面に「請求を確かめています」と示す。
  - 確かめた結果が成功なら支払いの完了を示し、失敗なら FR-31 の扱いに移る。
  - 請求した額と時刻を乗車の記録に残す。
quality_hints:
  - QR-09 - 応答のない請求のあとも、一つの乗車に一度だけ請求する
  - 効率性 (QIU-07) - 到着から T_alight 秒以内に決済が終わる
  - 有効性 (QIU-08) - 確定した料金どおりに請求する
