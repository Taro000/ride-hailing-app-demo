id: FR-41
title: 参加者のアカウントを作成・訂正する
status: active
basis: inferred
basis_note: QIU-30 からの推定（データを入れる人の入力と確かめ）。参加者を乗客とドライバーと読むことは第 1 段階の推定。訂正の記録は QIU-30 の測定量のデータになる。入れる項目と、同じ人をどう見分けるかは設計で決める。新規であることは質問 4 で確認済み
premises: []
statement: システムは、担当者が乗客かドライバーかを選んで参加者のアカウントを作成し、作成した後に内容を訂正できるようにし、訂正したことを記録する。
origin: quality-in-use
cuj: CUJ-16
cuj_step: null
traces_to: [QIU-30]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 担当者が乗客かドライバーかを選んで必要な項目を入れると、システムは作成する前に入れた内容を示し、担当者が確かめるとアカウントを作成する。
  - 必要な項目が欠けているか形の正しくない項目があると、システムはどの項目かを示し、作成しない。
  - すでにアカウントのある人のアカウントをもう一つ作成しようとすると、システムはそのことを示し、作成しない。
  - 担当者がアカウントの内容を訂正すると、システムは訂正したことと、いつ何を訂正したかを記録する。
quality_hints:
  - 有効性 (QIU-30) - 作り直しや訂正の要らないアカウントを作成できる
