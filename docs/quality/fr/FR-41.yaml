id: FR-41
title: 本番への配備と配備の記録
status: draft
version: 1
basis: inferred
basis_note: QIU-20〜22・28〜30 から導いた。CUJ-11〜13 にまたがり、どれも手順がないので cuj は空。障害の記録を製品の外に残すことは質問 6 で確認済み。テストの範囲と合否の基準は第 3・4 段階
needs_agreement: false
approver_candidates: []
statement: システムは、エンジニアが変更を一つの操作で本番に配備できるようにし、配備の前に自動のテストを実行して、配備ごとに版、時刻、含まれる変更とその種類（新しい機能・修正・版上げ）、各変更の最初のコミットの時刻を記録する。
origin: quality-in-use
cuj: null
cuj_step: null
traces_to: [QIU-20, QIU-21, QIU-22, QIU-28, QIU-29, QIU-30]
proposal: null
existing: false
extends: null
interface:
  - 配備の仕組み（種類のみ）
acceptance_criteria:
  - エンジニアが配備を始めると、自動のテストを実行し、通ったときだけ本番を新しい版に替える。
  - 配備ごとに、版、時刻、含まれる変更、変更の種類（新しい機能・修正・版上げ）、各変更の最初のコミットの時刻を記録する（QIU-20〜22・28〜30 の測定に使う）。
  - テストに通らないとき、配備せず、どのテストが失敗したかを示す。
  - 配備の途中で失敗したとき、本番は前の版のまま動き、失敗を記録してエンジニアに通知する。
quality_hints:
  - 有効性 (QIU-20, QIU-21, QIU-22) - 本番に出してから T_regression_window 日以内に既存の機能を壊さない
  - 効率性 (QIU-28, QIU-29, QIU-30) - 最初のコミットから T_lead 以内に本番に出せる
