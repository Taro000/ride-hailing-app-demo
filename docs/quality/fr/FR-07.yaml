id: FR-07
title: 乗客が依頼を取り消す
status: active
basis: inferred
basis_note: 作業を取り消せることは有効性からの推定。OUT-02 と KPI-03 が許諾後の取り消しを数えるため、取り消しを機能として持つ。新規であることは質問 4 で確認済み
premises: []
statement: システムは、乗車が始まるまで乗客が依頼を取り消せるようにし、許諾したドライバーがいればそのドライバーに取り消しを知らせる。
origin: quality-in-use
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-15, KPI-03]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配", "通知: ドライバー"]
acceptance_criteria:
  - まだ許諾されていない依頼を乗客が取り消すと、システムはその依頼をドライバーに届けるのをやめる。
  - 許諾された依頼を乗客が取り消すと、システムは許諾したドライバーに取り消されたことを知らせ、そのドライバーの迎車を終える。
  - 乗車が始まった依頼を乗客が取り消そうとすると、システムは乗車が始まっていることを示し、取り消さない。
quality_hints:
  - 有効性 (QIU-15) - 許諾したドライバーが、取り消された依頼の乗車場所へ向かい続けない
