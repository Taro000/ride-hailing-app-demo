id: FR-07
title: 乗客による取り消し
status: draft
version: 3
basis: inferred
basis_note: 乗客の取り消しは第 1 段階の QIU-01 と KPI-02 の測定量が前提にしている。受け入れ基準は推定。キャンセル料の額（500 円）と、許諾の後の取り消しにかかることはcontext.yaml の制約（2026-11-01）。迎車が遅れているときに請求しないこと、受取額はドライバーに入ることは第 2 段階の質問 14〜17（2026-11-01）。T_cancel_grace は要合意
needs_agreement: true
approver_candidates: [プロダクトオーナー]
statement: システムは、乗客が乗車の始まる前に配車依頼を取り消せるようにし、許諾していたドライバーに知らせる。許諾の後の取り消しには、迎車が遅れているときを除き、キャンセル料を請求する。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-13, QIU-16, KPI-01, KPI-02]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配の状況）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 許諾の前に乗客が取り消すと、依頼をドライバーの一覧から消し、押さえた額をすべて解放する。キャンセル料は請求しない。
  - 許諾の後に乗客が取り消そうとすると、取り消す前にキャンセル料（500 円）がかかることを示し、乗客が確かめたときだけ取り消す。取り消すと、押さえた額からキャンセル料を請求し（キーは FR-30）、残りを解放し、ドライバーの画面と音で知らせる。
  - 許諾したときに示した乗車場所への到着予定時刻（FR-10 が記録した値）から T_cancel_grace を過ぎても迎車が乗車場所に着いていないとき（到着が「位置を確かめられなかった」と記録されているときも着いていないと扱う）、キャンセル料がかからないことを示し、取り消すと押さえた額をすべて解放する。
  - 許諾のときの到着予定が記録されていないとき、キャンセル料をかけずに取り消す。
  - キャンセル料の請求に失敗すると、未払いとして扱う（FR-31）。
  - 乗車が始まった依頼を取り消そうとしたとき、取り消さず、降車場所の変更（FR-12）を案内する。
  - 誰がいつ取り消したか、キャンセル料を請求したかどうかとその額を記録する（FR-39）。
quality_hints:
  - 有効性 (QIU-13) - 取り消しがすぐにドライバーに届き、無駄な迎車を続けさせない
