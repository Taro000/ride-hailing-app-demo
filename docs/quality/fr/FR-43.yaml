statement: システムは、乗客が自分の乗車について、種類（手配した車と違う車に乗った、ドライバーの振る舞い、車の清潔さ、運転、請求の誤り、その他）と内容を報告できるようにし、その乗車とドライバーに結び付けて受け付ける。
