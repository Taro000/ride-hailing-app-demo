id: FR-43
title: 審査を通ったドライバーと車両を登録・訂正する
status: active
basis: inferred
basis_note: QIU-31 と QIU-32 からの推定。審査はシステムの外の手続き（第 1 段階の範囲外）。審査を通ったことを登録とともに記録することで、後から審査の記録と突き合わせられる（QIU-31, QIU-32 の測定量のデータ）。新規であることは質問 4 で確認済み
premises: []
statement: システムは、担当者が審査を通ったドライバーと車両を審査を通ったこととともに登録し、登録した内容を訂正できるようにする。審査を通ったことが入っていない登録は受け付けない。
origin: quality-in-use
cuj: CUJ-17
cuj_step: null
traces_to: [QIU-31, QIU-32]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 担当者がドライバーと車両の内容（ドライバーの名前、車のナンバー、車種、色）と、審査を通ったこと（審査の日付と、審査の記録を探す手がかり）を入れると、システムは登録する前に内容を示し、担当者が確かめると登録する。
  - 審査を通ったことが入っていないとき、システムは登録しない。
  - 必要な項目が欠けているとき、またはほかのドライバーにすでに登録されている車のナンバーを入れたとき、システムはそのことを示し、登録しない。
  - 担当者が登録を訂正すると、システムは訂正したことといつ何を訂正したかを記録し、乗客に示す手がかり（FR-09）を訂正した内容にする。
  - 登録が済むまで、システムはそのドライバーに依頼を届けない。
quality_hints:
  - 有効性 (QIU-31) - 登録した内容が、審査を通った内容と一致する
  - 健康・安全リスク緩和性 (QIU-32) - 審査を通っていないドライバーや車両が登録されない
