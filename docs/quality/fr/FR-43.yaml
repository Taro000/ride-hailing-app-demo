id: FR-43
title: 審査を通ったドライバーと車両を登録・訂正する
status: active
basis: inferred
basis_note: QIU-31 と QIU-32 からの推定。審査はシステムの外の手続き（第 1 段階の範囲外）。審査の結果（審査の日付と審査の記録を探す手がかりを含む）を記録せず（CON-07）、登録で入れる項目を名前、顔写真、連絡先、車種、色、車のナンバーとすることは、FRP-07 を受け入れたもの（第 3 段階の質問 5）。審査を通ったことは、担当者が登録することそのもので表す。QIU-31 と QIU-32 の測定量は、登録をシステムの外の審査の記録と突き合わせて得る。新規であることは質問 4 で確認済み
premises: [CON-07]
statement: システムは、担当者が審査を通ったドライバーと車両を、ドライバーの名前、顔写真、連絡先と、車の車種、色、ナンバーで登録し、登録した内容を訂正できるようにする。審査の日付や審査の記録を探す手がかりは入れさせず、記録しない。
origin: quality-in-use
cuj: CUJ-17
cuj_step: null
traces_to: [QIU-31, QIU-32]
proposal: null
existing: false
extends: null
interface: ["画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 担当者がドライバーの名前、顔写真、連絡先と、車の車種、色、ナンバーを入れると、システムは登録する前に内容を示し、担当者が確かめると登録する。
  - システムは、審査の日付や審査の記録を探す手がかりを入れさせず、記録しない。
  - 必要な項目が欠けているとき、またはほかのドライバーにすでに登録されている車のナンバーを入れたとき、システムはそのことを示し、登録しない。
  - 担当者が登録を訂正すると、システムは訂正したことといつ何を訂正したかを記録し、乗客に示す手がかり（FR-09）を訂正した内容にする。
  - 登録が済むまで、システムはそのドライバーに依頼を届けない。
quality_hints:
  - 有効性 (QIU-31) - 登録した内容が、審査を通ったドライバーと車両の内容と一致する
  - 健康・安全リスク緩和性 (QIU-32) - 登録されていないドライバーには依頼が届かない
