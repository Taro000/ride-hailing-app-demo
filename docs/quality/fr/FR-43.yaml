interface:
  - "画面: 乗客の Web アプリ（乗車の履歴、迎車中、乗車中）"
acceptance_criteria:
  - 乗客が乗車の履歴（FR-44）から乗車を選び、種類と内容を入れて報告すると、その乗車とドライバーに結び付けて受付の時刻とともに記録し、苦情の一覧（FR-45）に加える。
  - 迎車中と乗車中の画面からも「手配した車と違う車に乗った」を報告できる（QIU-05 の分子に使う）。
  - 種類が選ばれていないとき、受け付けず、選ぶよう示す。
quality_hints:
