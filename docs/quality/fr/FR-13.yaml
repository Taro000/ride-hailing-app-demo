id: FR-13
title: 乗車中に降りる場所と今いる場所を示し、到着を知らせる
status: active
basis: inferred
basis_note: "機能は CUJ-03 の手順（入力）。受け入れ基準は推定。乗車中に降りる場所を変えたときは、変えた後の場所を示す（FR-47）。新規であることは質問 4 で確認済み。D_dropoff_gap の値（30 m）は第 4 段階の決めたこと #14（QAS-45 への訂正）、T_alighting の値（30 秒）は決めたこと #15（QAS-46 への訂正）"
premises: [QAS-45, QAS-46]
statement: システムは、乗車中、乗客が決めた降りる場所と車の今いる場所を乗客に示し、ドライバーが到着を確認するとそのことを乗客に知らせる。
origin: cuj-step
cuj: CUJ-03
cuj_step: 正しい場所に到着したかを確認する
traces_to: [QIU-11, QIU-12]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の乗車中", "通知: 乗客"]
acceptance_criteria:
  - 乗車が始まると、システムは乗客が決めた降りる場所と、車の今いる場所を示す。
  - ドライバーが到着を確認すると（FR-28）、システムは到着したことと、到着を確認した場所を乗客に示す。
  - 車の今いる場所が分からなくなったとき、システムは最後に分かった場所とその時刻を示し、今の場所が分からないことを伝える。
quality_hints:
  - 有効性 (QIU-11) - 乗客が決めた降りる場所から D_dropoff_gap（30 m）以内で降りられる
  - 効率性 (QIU-12) - 降りる場所に着いてから T_alighting（30 秒）以内に降車を終えられる
