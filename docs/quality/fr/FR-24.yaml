id: FR-24
title: 行き先をドライバーに示す
status: active
basis: inferred
basis_note: 運転を始める手順（入力）と QIU-11 の失敗のシナリオ（別の入口や似た名前の場所で降ろされる）からの推定。乗車中に変えた降りる場所を示すことは質問 7 で確認済み。新規であることは質問 4 で確認済み
premises: []
statement: システムは、ドライバーに、許諾してから乗車が始まるまでは乗客が決めた乗車場所を、乗車が始まってからは乗客が決めた降りる場所を示す。
origin: cuj-step
cuj: CUJ-07
cuj_step: 運転を始める
traces_to: [QIU-11, QIU-15]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの迎車", "画面: ドライバーの乗車中"]
acceptance_criteria:
  - ドライバーが依頼を許諾すると、システムは乗客が決めた乗車場所を示す。
  - 乗車が始まると、システムは乗客が決めた降りる場所を示す。
  - 乗客が乗車中に降りる場所を変えて承認すると（FR-47）、システムは新しい降りる場所をドライバーに示す。
  - 乗車が始まる前に乗客が依頼を取り消すと、システムは乗車場所を示すのをやめ、取り消されたことを示す。
quality_hints:
  - 有効性 (QIU-11) - ドライバーに示す降りる場所が、乗客の決めた場所と一致する
  - 有効性 (QIU-15) - ドライバーが許諾した依頼の乗車場所に迷わず着ける
