id: FR-24
title: 行き先と迎車中の乗客の現在地をドライバーに示す
status: active
basis: inferred
basis_note: "運転を始める手順（入力）と QIU-11 の失敗のシナリオ（別の入口や似た名前の場所で降ろされる）からの推定。乗車中に変えた降りる場所を示すことは質問 7 で確認済み。許諾してから乗車が始まるまで乗客の現在地をドライバーに示すことは、FRP-10 を受け入れたもの（第 3 段階の決めたこと #20）。乗客の現在地を見せるのを許諾したドライバーに乗車が始まるまでに限ることは、個人の情報の扱いに関する法令（CON-06、第 3 段階の QR-57）による。新規であることは質問 4 で確認済み"
premises: [CON-06]
statement: システムは、ドライバーに、許諾してから乗車が始まるまでは乗客が決めた乗車場所と乗客の現在地を、乗車が始まってからは乗客が決めた降りる場所を示す。
origin: cuj-step
cuj: CUJ-07
cuj_step: 運転を始める
traces_to: [QIU-11, QIU-15, QIU-08]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの迎車", "画面: ドライバーの乗車中"]
acceptance_criteria:
  - ドライバーが依頼を許諾すると、システムは乗客が決めた乗車場所と、乗客の現在地を示す。
  - 乗客の現在地が分からなくなったとき、システムは最後に分かった現在地とその時刻を示し、今の現在地が分からないことを伝える。
  - 乗車が始まると、システムは乗客の現在地を示すのをやめ、乗客が決めた降りる場所を示す。
  - 乗客が乗車中に降りる場所を変えて承認すると（FR-47）、システムは新しい降りる場所をドライバーに示す。
  - 乗車が始まる前に乗客かドライバーが依頼を取り消すと、システムは乗車場所と乗客の現在地を示すのをやめ、取り消されたことを示す。
quality_hints:
  - 有効性 (QIU-11) - ドライバーに示す降りる場所が、乗客の決めた場所と一致する
  - 有効性 (QIU-15) - ドライバーが許諾した依頼の乗車場所に迷わず着ける
  - 有効性 (QIU-08) - 迎車中のドライバーに示す乗客の現在地が今の位置から遅れず、乗車場所で互いを見つけられる
