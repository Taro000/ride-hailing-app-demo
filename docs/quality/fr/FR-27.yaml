id: FR-27
title: 乗客の不在の記録
status: draft
version: 3
basis: inferred
basis_note: 乗客の不在は KPI-03・QIU-15 の失敗にある。待つ時間を置くことは推定。T_noshow_wait は要合意。不在で終えたときにキャンセル料と同じ 500 円を請求し、ドライバーの受取額に入れることは第 2 段階の質問 14〜17（2026-11-01）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 運営の責任者]
statement: システムは、乗車場所に到着してから T_noshow_wait が過ぎても乗客が現れないとき、ドライバーが不在として依頼を終えられるようにし、乗客に知らせて、キャンセル料と同じ額を請求する。
origin: cuj-step
cuj: CUJ-07
cuj_step: 依頼主かどうかを確認する
traces_to: [QIU-15, QIU-16, KPI-03]
proposal: null
existing: false
extends: null
interface:
  - "画面: ドライバーの Web アプリ（迎車中）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 乗車場所への到着から T_noshow_wait が過ぎると、ドライバーは依頼を不在として終えられる。終えると、乗客に不在で終えたことと料金（500 円）を知らせ、押さえた額から請求し（キーは FR-30）、残りを解放し、時刻を記録する（FR-39）。
  - 到着から T_noshow_wait が過ぎる前に不在として終えようとしたとき、受け付けず、あとどれだけ待つかを示す。
  - 到着が「位置を確かめられなかった」と記録されている依頼（FR-25）を不在で終えたとき、不在の料金は請求せず、押さえた額をすべて解放する。
  - 不在の料金の請求に失敗すると、未払いとして扱う（FR-31）。
quality_hints:
  - 有効性 (QIU-15) - ドライバーが待つべき時間を待たずに乗客を置いていかない
