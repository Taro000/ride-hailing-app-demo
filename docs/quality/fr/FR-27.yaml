id: FR-27
title: 乗車を始める
status: active
basis: inferred
basis_note: 機能は CUJ-07 の手順（入力）。確かめの手がかりが一致したときだけ乗車を始め、乗客とドライバーの画面を乗車中に変えることは質問 2 で確認済み。取り消された依頼の扱いは推定。新規であることは質問 4 で確認済み
premises: []
statement: システムは、同じ依頼の相手であることが確かめられると（FR-12）乗車を始め、乗客とドライバーの画面を乗車中に変える。
origin: cuj-step
cuj: CUJ-07
cuj_step: 運転を始める
traces_to: [QIU-18, QIU-10, KPI-02]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの迎車", "画面: 乗客の乗車中"]
acceptance_criteria:
  - ドライバーが入れた確かめの手がかりがその依頼のものと一致すると、システムは乗車を始め、乗客とドライバーの画面を乗車中に変える。
  - 確かめの手がかりが一致していない依頼では、システムはほかのどの操作でも乗車を始めさせない。
  - 乗客が取り消した依頼でドライバーが手がかりを入れると、システムは取り消されたことを示し、乗車を始めない。
quality_hints:
  - 有効性 (QIU-18) - 依頼主本人を乗せた乗車だけが始まる
  - 健康・安全リスク緩和性 (QIU-10) - 乗客の画面が乗車中に変わるのは、手配した車に乗るときだけである
