id: FR-30
title: 同じ乗車への二重の請求の防止
status: draft
version: 4
basis: inferred
basis_note: QIU-08 から導いた。受け入れ基準は推定。請求に失敗したと分かった後のやり直し（FR-31）を新しいキーにすることは、返金のキーの回答（2026-11-03、設計 3-2。同じキーで送り直すと決済のサービスは同じ失敗を返す）と同じ理由で、第 2 段階の質問 21 で確認済み。設計は未払いの支払いのキーを依頼と何回目かにしている（設計の FND-29）
needs_agreement: false
approver_candidates: []
statement: システムは、請求の要求に一意のキーを付け、依頼と請求の種類（運賃、キャンセル料、不在の料金）の組ごとに、成功する請求を一度だけにする。請求に失敗したと分かった後に別の支払い手段で払うとき（FR-31）は、新しいキーの請求にする。
origin: quality-in-use
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-08, QIU-16]
proposal: null
existing: false
extends: null
interface:
  - "外部: 決済のサービス"
acceptance_criteria:
  - 請求済みの依頼と種類の組について請求が届くと、最初の結果を返し、二度目の請求はしない。
  - 決済のサービスから応答がなく請求をやり直すとき、同じキーを使う。
  - 請求に失敗したと分かった後、乗客が別の支払い手段で払うとき（FR-31）は、新しいキーで請求する。
  - 依頼か請求の種類が違えば、それぞれのキーで請求する。
quality_hints:
  - 有効性 (QIU-08) - 決済のサービスが応答しないときも二重に請求しない
