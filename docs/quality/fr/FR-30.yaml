    change: 成功する請求を依頼と種類の組ごとに一度だけにすると書き直し、請求に失敗したと分かった後に別の支払い手段で払うとき（FR-31）は新しいキーにすると足した。前の文の「同じ組への二度目の請求を受け付けない」は、FR-31 AC2 の払い直しと食い違っていた
    reason: 返金のキーの回答（docs/quality-chain-answers.md の設計 3-2）と同じ理由（同じキーで送り直すと、決済のサービスは同じ失敗を返す）。設計の課題 3-2 は品質チェーンの項目に FR-30 も挙げていた
