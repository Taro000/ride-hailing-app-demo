id: FR-23
title: ドライバーが許諾した依頼を取り消す
status: active
basis: assumed
basis_note: "取り消せることは有効性からの推定（OUT-02 と KPI-03 が許諾後の取り消しを数える）。取り消された依頼を、乗客が依頼し直さなくてもほかのドライバーに届け直すことは質問 6 で確認済み。届け直した依頼にも、T_wait_prompt に乗客に知らせて待ち続けるか取り消すかを選ばせるのは、FRP-13 を受け入れた FR-04 と同じ扱いにしたもの（推定）。T_no_accept の値（30 分）は第 4 段階の決めたこと #19（QAS-50 への訂正）。T_wait_prompt の値（5 分）は第 4 段階が提案した仮の値で、QAS-53 による仮定。新規であることは質問 4 で確認済み"
premises: [QAS-50, QAS-53]
statement: システムは、乗車が始まるまでドライバーが許諾した依頼を取り消せるようにし、取り消しを乗客に知らせて、その依頼をほかのドライバーに届け直す。
origin: quality-in-use
cuj: CUJ-06
cuj_step: 依頼を許諾する
traces_to: [QIU-01, QIU-15, KPI-03]
proposal: null
existing: false
extends: null
interface: ["画面: ドライバーの迎車", "通知: 乗客"]
acceptance_criteria:
  - ドライバーが許諾した依頼を取り消すと、システムは乗客に取り消されたことを知らせ、同じ乗る場所、降りる場所、料金のまま、その依頼をほかのドライバーに届け直す。乗客は依頼し直さなくてよい。
  - 届け直してから T_wait_prompt（5 分）の間どのドライバーも許諾しないとき、システムは乗客に知らせ、待ち続けるか依頼を取り消すかを選べるようにする。乗客が取り消すとシステムは依頼を終え、乗客が待ち続けるか選ばないときは依頼を続ける。
  - 届け直した依頼を T_no_accept（30 分）の間どのドライバーも許諾しないとき、システムは依頼を終え、ドライバーが見つからなかったことを乗客に伝える。
  - 乗車が始まった後にドライバーが取り消そうとすると、システムは取り消さない。
quality_hints:
  - 有効性 (QIU-01) - ドライバーが取り消しても、乗客が迎車に来てもらえる
