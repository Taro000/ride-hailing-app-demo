id: FR-36
title: 変えた振る舞いを止める
status: active
basis: assumed
basis_note: 保守する人の機能（新しい振る舞いを直すまで止める）からの推定。追加と修正そのものはエンジニアの開発の作業。どう切り替えるかは設計で決める。新規であることは質問 4 で確認済み。N_regression_days の値（14 日）は第 4 段階が提案した仮の値で、QAS-49 による仮定
premises: [QAS-49]
statement: システムは、エンジニアが追加や修正で変えた振る舞いを、システムを動かしたまま止めて変える前の振る舞いに戻し、また有効にできるようにする。
origin: quality-in-use
cuj: CUJ-11
cuj_step: 新しい機能を追加
traces_to: [QIU-24, QIU-25]
proposal: null
existing: false
extends: null
interface: ["画面: エンジニアの運用"]
acceptance_criteria:
  - エンジニアが追加や修正で変えた振る舞いを止めると、システムはその時から変える前の振る舞いに戻り、進んでいる依頼や乗車は途中で失われない。
  - エンジニアが止めた振る舞いを有効にすると、システムは再びその振る舞いをする。
  - 変える前の振る舞いがない追加（まったく新しい機能）を止めると、システムはその機能を利用者に示さなくなる。
quality_hints:
  - 有効性 (QIU-24) - 公開から N_regression_days（14 日）以内に既存の機能を壊した追加を、直すまで止められる
  - 有効性 (QIU-25) - 公開から N_regression_days（14 日）以内にほかの機能を壊した修正を、直すまで止められる
