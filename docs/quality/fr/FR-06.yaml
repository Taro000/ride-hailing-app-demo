id: FR-06
title: 手配後の状況の通知
status: draft
version: 1
basis: inferred
basis_note: 手配の後の状況を示すことは CUJ-01・02 から推定。ブラウザが裏にある間は知らせられないことは第 1 段階の質問 15 で受け入れた制約
needs_agreement: false
approver_candidates: []
statement: システムは、手配した乗客に依頼の状況（ドライバーを探している、許諾された、迎車が乗車場所に着いた）を画面に示し、状況が変わったときに画面と音で知らせる。
origin: cuj-step
cuj: CUJ-01
cuj_step: 配車を手配する
traces_to: [QIU-01, QIU-04, QIU-15]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（手配の状況）"
acceptance_criteria:
  - ドライバーが許諾すると、乗客の画面を迎車中に変え、ドライバーと車の情報（FR-09）を示し、音で知らせる。
  - 迎車が乗車場所に着くと（FR-25）、乗客の画面と音で知らせる。
  - ブラウザが裏に回っていた間に状況が変わったとき、前面に戻ったら最新の状況を示す。
  - 許諾したドライバーが取り消して探し直しているとき（FR-22）、その旨を示す。
quality_hints:
  - 効率性 (QIU-04) - 迎車の到着を、乗客がすぐに知る
