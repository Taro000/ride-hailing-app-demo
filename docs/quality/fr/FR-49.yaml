id: FR-49
title: 利用者の種類ごとに使える機能を分ける
status: active
basis: inferred
basis_note: FRP-02 を受け入れたもの（第 3 段階の QR-13、QR-34、QR-57。位置情報と乗車の記録を見られる人を限ることは個人の情報の扱いに関する法令による、CON-06、第 3 段階の質問 1。役割ごとの権限はセキュリティのリスク分析の分類にある）。どの種類の利用者にどの機能を許すかは、各 CUJ の利用者と QR-57 による。受け入れ基準は推定
premises: [CON-06]
statement: システムは、乗客、ドライバー、運営・サポートの担当者、エンジニアのそれぞれに、その種類の利用者に許した機能だけを使わせる。
origin: proposal
cuj: null
cuj_step: null
traces_to: [QIU-04, QIU-06, QIU-14, QIU-23]
proposal: FRP-02
existing: false
extends: null
interface: ["画面: 乗客", "画面: ドライバー", "画面: 運営・サポートの担当者", "画面: エンジニア"]
acceptance_criteria:
  - 利用者がその種類に許していない機能を使おうとすると、システムは使わせず、その機能を使えないことを示す。
  - 乗客とドライバーが、自分の依頼と乗車にかかわらない依頼、乗車、位置を見ようとすると、システムは示さない。
  - 確定額とドライバーの評価は、それを決める機能（依頼、乗車中の降りる場所の変更、評価）を通してだけ変わり、乗客やドライバーがほかのやり方で変えようとしても、システムは受け付けない。
  - エンジニアは、隠した個人の情報を FR-35 のやり方でだけ見られる。
quality_hints:
  - QR-57 - 位置情報と乗車の記録は、見ることを許された人だけが見られる
  - QR-13 - 確定額、評価、依頼の状態は、許された操作のほかでは変わらない
  - QR-34 - 調査で見る内容では個人の情報が隠れ、理由を示したときだけ見える
