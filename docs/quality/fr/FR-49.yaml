id: FR-49
title: 請求の記録の表示
status: draft
version: 3
basis: inferred
basis_note: QIU-26 から導いた。CUJ-16 の手順は入力にない。示す項目は推定
needs_agreement: false
approver_candidates: []
statement: システムは、運営・サポート担当に、依頼ごとの手配時に示した料金、降車場所の変更による料金の変化、請求額（運賃、キャンセル料、不在の料金）、決済の状態、行った返金、返金できる残りの額を示す。
origin: quality-in-use
cuj: CUJ-16
cuj_step: null
traces_to: [QIU-26]
proposal: null
existing: false
extends: null
interface:
  - "画面: 管理の画面（請求と返金）"
acceptance_criteria:
  - 依頼を開くと、手配時に示した料金、降車場所の変更による料金の変化、請求の種類と額、決済の状態、行った返金、返金できる残りの額を示す。
  - 請求額と確定した料金が違うとき、その差を示す。
  - 決済のサービスの記録と一致しなかった依頼（FR-55）には、一致しなかった項目を示す。
  - 苦情（FR-45）から、その依頼の請求の記録を開ける。
quality_hints:
  - 有効性 (QIU-26) - 誤った請求かどうかを、記録から確かめられる
