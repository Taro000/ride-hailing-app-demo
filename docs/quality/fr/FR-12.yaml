id: FR-12
title: 乗車の前に同じ依頼の相手であることを確かめ合う
status: active
basis: inferred
basis_note: "加えること、ドライバーが乗客から伝えられたものを入れて一致したときだけ乗車を始めること、乗客に画面が乗車中に変わってから乗るよう示すことは質問 2 で確認済み。確かめた記録は推定で、プロダクトから見えない QIU-10 と QIU-18 の測定量の一部のデータになる。確かめ方の設計は DIN-02。新規であることは質問 4 で確認済み。T_boarding の値（1 分）は第 4 段階の決めたこと #13（QAS-44 への訂正）"
premises: [QAS-44]
statement: システムは、乗車を始める前に、ドライバーが乗客から伝えられた確かめの手がかりを入れられるようにし、それがその依頼のものと一致したときだけ乗車を始めさせる。乗客には、画面が乗車中に変わってから乗るよう示す。
origin: quality-in-use
cuj: CUJ-02
cuj_step: 手配した車かどうかを確認する
traces_to: [QIU-10, QIU-18, QIU-09]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の配車手配", "画面: ドライバーの迎車"]
acceptance_criteria:
  - 配車が確定すると、システムは乗客に、ドライバーに伝える確かめの手がかりと、画面が乗車中に変わってから乗るようにという案内を示す。
  - ドライバーが入れた手がかりがその依頼のものと一致すると、システムは乗車を始める（FR-27）。
  - ドライバーが入れた手がかりがその依頼のものと一致しないとき、システムは一致しないことをドライバーに示し、乗車を始めない。乗客の画面は乗車中に変わらない。
  - システムは、一致したことと、一致しなかった試みを記録する。
quality_hints:
  - 健康・安全リスク緩和性 (QIU-10) - 乗客が手配した車以外に乗らない
  - 有効性 (QIU-18) - ドライバーが依頼主本人を乗せて運転を始める
  - 効率性 (QIU-09) - 確かめを含めても、迎車が着いてから T_boarding（1 分）以内に乗車が始まる
