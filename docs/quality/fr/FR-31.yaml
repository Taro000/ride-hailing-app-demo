statement: システムは、降車時の請求に失敗すると、乗客に別の支払い手段での支払いを求め、支払われるまでその乗車を未払いとして記録する。
origin: quality-in-use
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-16]
proposal: null
existing: false
