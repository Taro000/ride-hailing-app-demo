id: FR-31
title: 決済に失敗したときの扱い
status: draft
version: 3
basis: inferred
basis_note: QIU-16 から導いた。未払いの乗客が次の手配をできないことは質問 9 で確認済み。ほかの受け入れ基準は推定
needs_agreement: false
approver_candidates: []
statement: システムは、降車時の請求、キャンセル料、不在の料金の請求に失敗すると、乗客に別の支払い手段での支払いを求め、支払われるまでその依頼を未払いとして記録する。
origin: quality-in-use
cuj: CUJ-08
cuj_step: 決済を行う
traces_to: [QIU-16]
proposal: null
existing: false
extends: null
interface:
  - "画面: 乗客の Web アプリ（支払い）"
  - "画面: ドライバーの Web アプリ（乗車中）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 請求に失敗すると、乗客の画面に理由と、別の支払い手段を選んで払う手段を示し、ドライバーの画面にその依頼が未払いであることを示す。
  - 乗客が別の支払い手段で払うと、未払いを解消し、両方の画面に示す。
  - 未払いの依頼がある乗客の新しい手配は受け付けない（FR-05）。
quality_hints:
  - 有効性 (QIU-16) - 運んだ乗車の決済が終わり、ドライバーの受取額に入る
