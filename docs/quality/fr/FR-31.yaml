interface:
  - "画面: 乗客の Web アプリ（支払い）"
  - "画面: ドライバーの Web アプリ（乗車中）"
  - "外部: 決済のサービス"
acceptance_criteria:
  - 請求に失敗すると、乗客の画面に理由と、別の支払い手段を選んで払う手段を示し、ドライバーの画面にその乗車が未払いであることを示す。
  - 乗客が別の支払い手段で払うと、未払いを解消し、両方の画面に示す。
  - 未払いの乗車がある乗客の新しい手配は受け付けない（FR-05）。
