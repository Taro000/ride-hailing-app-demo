id: FR-37
title: 苦情と返金の求めを受け付ける
status: active
basis: inferred
basis_note: "QIU-27 からの推定。苦情と返金の求めをシステムの中で受け付け、担当者が対応を終えるまでをシステムに記録すること、寄せるのは自分の乗車についての乗客だけでドライバーは寄せないことは、第 1 段階の質問 7 で確認済み（QAS-06）。乗車中の危険は利用時の品質要求の対象にしない（第 3 段階の決めたこと #19、QAS-08）ため、危険な運転や加害の報告をほかの苦情と分けず、ドライバーの振る舞いについての苦情もほかの苦情と同じに扱う。受けた苦情と終えた苦情の記録は QIU-27 の測定量のデータになる。新規であることは質問 4 で確認済み"
premises: [QAS-06, QAS-08]
statement: システムは、乗客が自分の乗車についての苦情や返金の求めを寄せられるようにし、担当者がそれを受けて、対応を終えるまでの状態を記録できるようにする。
origin: quality-in-use
cuj: CUJ-14
cuj_step: null
traces_to: [QIU-27, QIU-28]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の乗車の履歴", "画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 乗客が自分の乗車を選んで苦情や返金の求めを寄せると、システムはその乗車と結び付けて受け付け、担当者に示す。
  - 担当者が対応を終えると、システムはその苦情を終えたものとして記録し、受けた苦情と終えた苦情を分けて示す。
  - 乗客が自分の乗っていない乗車について寄せようとすると、システムは受け付けない。
quality_hints:
  - 有効性 (QIU-27) - 受けた苦情が漏れなく担当者に届き、対応を終えられる
  - 有効性 (QIU-28) - 寄せられた返金の求めが漏れなく担当者に届く
