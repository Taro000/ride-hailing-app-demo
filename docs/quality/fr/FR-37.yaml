id: FR-37
title: 苦情と返金の求めを受け付ける
status: active
basis: assumed
basis_note: QIU-27 と QIU-07 からの推定。苦情と返金の求めをシステムの中で受け付けることは QAS-06 による暫定の決定（対応の手順は決まっていない、第 1 段階の質問 2）。受けた苦情と終えた苦情の記録は QIU-27 の、危険な運転や加害の報告は QIU-07 の測定量のデータになる。危険な運転や加害の報告を受けて QIU-07 を守ることは QAS-08 による仮定。新規であることは質問 4 で確認済み
premises: [QAS-06, QAS-08]
statement: システムは、乗客とドライバーが乗車についての苦情や返金の求め（危険な運転や加害の報告を含む）を寄せられるようにし、担当者がそれを受けて、対応を終えるまでの状態を記録できるようにする。
origin: quality-in-use
cuj: CUJ-14
cuj_step: null
traces_to: [QIU-27, QIU-28, QIU-07]
proposal: null
existing: false
extends: null
interface: ["画面: 乗客の乗車の履歴", "画面: ドライバー", "画面: 運営・サポートの担当者"]
acceptance_criteria:
  - 乗客かドライバーが乗車を選んで苦情や返金の求めを寄せると、システムはその乗車と結び付けて受け付け、担当者に示す。
  - システムは、危険な運転や加害の報告を、ほかの苦情と分けて担当者に示す。
  - 担当者が対応を終えると、システムはその苦情を終えたものとして記録し、受けた苦情と終えた苦情を分けて示す。
  - 本人が関わっていない乗車について寄せようとすると、システムは受け付けない。
quality_hints:
  - 有効性 (QIU-27) - 受けた苦情が漏れなく担当者に届き、対応を終えられる
  - 健康・安全リスク緩和性 (QIU-07) - 危険な運転や加害の報告が、漏れなく担当者に届く
