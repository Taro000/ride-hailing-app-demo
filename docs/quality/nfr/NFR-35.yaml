id: NFR-35
title: 依頼を届ける先の誤りの監視
status: active
basis: inferred
basis_note: 届ける先の規則は一件の誤りも認めないため、一件ごとに知らせる監視にした（推定）。評価がまだないドライバーと、評価の件数が N_rating_count_min に満たないドライバーを誤りに数えるのは質問 7 の回答（QAS-05）。評価の件数の下限は FR-05（FRP-12 の受け入れ）、停止の前に届いていた依頼も許諾させないことは FR-44（FRP-04 の受け入れ）、登録で入れる項目は FR-43（FRP-07 の受け入れ。審査の結果は記録しない、CON-07）。評価のまとめ方（1〜5 の 5 段階の、受けたすべての評価の平均）は FR-15（第 2 段階の質問 9）。N_rating_count_min の 2 件は質問 10 の回答
premises: [QAS-05, CON-07]
from: [QR-16, QR-66, QR-32, QR-49, QR-63]
kind: monitor
cuj: CUJ-06
statement: 閾値を設定した乗客の依頼を届ける時点の評価が閾値に満たないドライバー、評価がまだないドライバー、評価の件数が N_rating_count_min（2 件）に満たないドライバーに届けたこと、ドライバーが設定した条件に合わない依頼を届けたこと、停止したドライバーに停止の後で許諾していない依頼を示したか許諾させたこと、登録されていないドライバーに依頼を届けたこと、マッチに使う評価が付けられた評価から FR-15 のまとめ方（すべての評価の平均）で求め直した値と食い違うことを、見つけるたびにエンジニアに知らせる。
conditions:
  workload: null
  users: 登録した乗客とドライバー。試験用のアカウントを含む（届ける先の誤りは試験用でも起きてはならない）
  transactions: 依頼を届けること、依頼を示すこと、許諾
slo: null
gate: null
audit: null
monitor:
  signal: 依頼を届けた記録ごとの、届けた時点のドライバーの評価とその件数と乗客の閾値、ドライバーの条件、停止の有無と時刻、登録の有無。ドライバーごとの、マッチに使う評価と求め直した値
  threshold: 一件でもあれば知らせる
  notifies: エンジニア
