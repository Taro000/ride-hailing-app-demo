id: NFR-14
title: 配車の経過と苦情の記録の欠けの監視
status: active
basis: assumed
basis_note: QR-15 と QR-41 は記録の欠けを一件も認めないため、一件ごとに知らせる監視にした（推定）。苦情と返金の求めをシステムの中で受け付けることは QAS-06 による。端末で起きたエラーの記録は、記録されなかったものを本番では見つけられないため、完成の定義（NFR-37）で確かめる。乗り終えた乗客への問いの回答は、乗客に尋ねないこと（決めたこと #21）になったため確かめない
premises: [QAS-06]
from: [QR-41, QR-15]
kind: monitor
cuj: CUJ-01
statement: 終わった依頼（完了、取り消し、乗客の不在）ごとに、起きた段階、その時刻、取り消しや不在で終えた人のどれかが欠けていれば、また苦情、返金の求め、報告のうち、関わる依頼や乗車と結び付いていないものや終えるまでの状態がないものがあれば、見つけるたびにエンジニアに知らせる。
conditions:
  workload: null
  users: 登録した乗客とドライバー。試験用のアカウントを含む
  transactions: すべての依頼と、苦情、返金の求め、報告
slo: null
gate: null
audit: null
monitor:
  signal: 依頼が終わったときの、その依頼の経過の記録に欠けた段階、時刻、終えた人があるか。苦情、返金の求め、報告ごとの、依頼や乗車との結び付きと状態
  threshold: 一件でもあれば知らせる
  notifies: エンジニア
