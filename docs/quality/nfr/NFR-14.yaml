id: NFR-14
title: 迎車の到着の位置と乗る場所のずれ
status: draft
version: 3
basis: inferred
basis_note: 50 m（D_pickup_match）は提案で、到着を受け付ける範囲 D_arrival（FR-25）と同じ値にする（第 4 段階の質問 7〜9（2026-11-01））。FR-25 が D_arrival より離れた到着を受け付けないので、到着の位置では乗る場所のずれが見えない。乗客が実際に乗った位置（運転の開始、FR-26）で見る。悪いイベントに、乗客が指定した場所の誤りが入り、チームが減らせない分を含むので、SLO ではなく監視にした（推定。質問 5 は未回答）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-28
kind: monitor
cuj: CUJ-07
statement: 運転を始めた位置（FR-26）が、依頼の乗る場所から 50 m を超えて離れていた乗車を毎日数え、プロダクトオーナーに知らせる。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate: null
audit: null
monitor:
  signal: 運転を始めた位置（FR-26）と、依頼の乗る場所の距離
  threshold: 50 m を超えた乗車が 1 件でもあれば、翌日にまとめて知らせる
  notifies: プロダクトオーナー
changelog:
