id: NFR-14
title: 配車の経過と苦情の記録の欠けの監視
status: active
basis: inferred
basis_note: QR-15 と QR-41 は記録の欠けを一件も認めないため、一件ごとに知らせる監視にした（推定）。苦情と返金の求めをシステムの中で受け付け、寄せるのは乗客が自分の乗車について寄せるものだけであることは、第 1 段階の質問 7 の回答（QAS-06 の一部が覆った）。端末で起きたエラーの記録（FR-52）は、記録されなかったものを本番では見つけられないため、完成の定義（NFR-37）で確かめる。手配のときに示した到着予定時刻は、QIU-05 を数えるもとになるため、依頼の段階とともに確かめる
premises: [QAS-06]
from: [QR-41, QR-15]
kind: monitor
cuj: CUJ-01
statement: 終わった依頼（完了、取り消し、乗客の不在、許諾のないまま終わったもの）ごとに、起きた段階、その時刻、依頼のときに示した目的地への到着予定時刻、取り消しや不在で終えた人のどれかが欠けていれば、また乗客が寄せた苦情と返金の求めのうち、関わる依頼や乗車と結び付いていないものや終えるまでの状態がないものがあれば、見つけるたびにエンジニアに知らせる。
conditions:
  workload: null
  users: 登録した乗客とドライバー。試験用のアカウントを含む
  transactions: すべての依頼と、乗客が寄せた苦情と返金の求め
slo: null
gate: null
audit: null
monitor:
  signal: 依頼が終わったときの、その依頼の経過の記録に欠けた段階、時刻、示した到着予定時刻、終えた人があるか。苦情と返金の求めごとの、依頼や乗車との結び付きと状態
  threshold: 一件でもあれば知らせる
  notifies: エンジニア
