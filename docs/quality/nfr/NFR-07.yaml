id: NFR-07
title: 依頼の状態の変化を相手に示す速さの SLO
status: active
basis: assumed
basis_note: 目標値 95% としきい値 T_dispatch_propagation（5 秒）は暫定の決定（QAS-25）。SLO として置くことと方針は質問 9 の回答。相手の画面に示した時刻は FR-53 が記録し、FR-53 を今期作ることは第 2 段階の暫定の決定（QAS-54）。QAS-54 が覆れば、システムが相手に向けて送るまでの区間を数える SLI に戻す。アラートの予算の消費は、使う時間がウィンドウの 3〜12 時間（OPF-01）に集まるものとして計算した。どの規則も予算を使い切った後に鳴るため、悪いイベントのたびのチケットを加えた
premises: [OPF-01, OPF-02, OPF-03, QAS-25, QAS-54]
from: [QR-06]
kind: slo
cuj: CUJ-01
statement: 直近 28 日で、依頼の状態の変化（依頼、許諾、取り消し、迎車の到着）の 95% が、システムが受けてから T_dispatch_propagation（5 秒）以内に相手の画面、一覧、通知に示される。
conditions:
  workload: デモの回の間（OPF-01）。参加者と依頼の量は OPF-02 と OPF-03
  users: 登録した乗客とドライバー。試験用のアカウントを除く。相手の端末がつながっていない間の変化は QR-02 の扱いで、ここには含めない
  transactions: 依頼、乗客とドライバーの取り消し、許諾、迎車の到着。CUJ-02 と CUJ-06 の相手に示すものも含む
slo:
  sli: SLI-14
  target: 95%
  target_status: provisional
  target_rationale: 入力の数値も基準となる値もなく、機能はまだない。T_dispatch_propagation（5 秒）は、依頼を届けてから許諾し、許諾を乗客に知らせる流れで、相手が操作の結果を待っていると感じない長さとして置いた最初の値。95% は最初のデモで数えることを優先した控えめな値（QAS-25）。相手の画面までの区間は通信と端末の時間を含むが、しきい値は相手が感じる待ちに合わせたもので変えない。KPI と KGI からは導いていない
  window: 直近 28 日
  error_budget: 状態の変化と相手の組の 5% まで、T_dispatch_propagation（5 秒）を超えて示されてよい
  error_budget_volume: 許される遅れはウィンドウの状態の変化と相手の組の数 × 5% 件。28 日に入るのは乗車 2〜6 回（OPF-01、OPF-02）で、有効なイベントが 20 件に届かない限り 1 件に満たない
  policy: EBP-01
  alerts:
    - {notify: page, long_window: 1h, short_window: 5m, burn_rate: 14.4, budget_spent_at_alert: 120〜480%, condition: 長いウィンドウの有効なイベントが 20 件以上のときだけ}
    - {notify: page, long_window: 6h, short_window: 30m, burn_rate: 6, budget_spent_at_alert: 150〜600%, condition: 長いウィンドウの有効なイベントが 20 件以上のときだけ}
    - {notify: ticket, long_window: 3d, short_window: 6h, burn_rate: 1, budget_spent_at_alert: 50〜100%, condition: null}
    - {notify: ticket, long_window: null, short_window: null, burn_rate: null, budget_spent_at_alert: 1 件で 100% 以上, condition: ウィンドウに許される失敗が 1 件に満たない間は、悪いイベントのたびに（EBP-01 の最後の規則）}
gate: null
audit: null
monitor: null
