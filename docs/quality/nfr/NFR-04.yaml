  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
- version: 2
  date: '2026-11-01'
  change: 突き合わせを FR-55 にし、キャンセル料と不在の料金を加え、仮の決済スタブの間は数えないことにした
  reason: 第 4 段階の再実行（第 2 段階 7d0cb6d・08c3ee0、第 3 段階 156240c・9c28917）
- version: 3
  date: '2026-11-03'
  change: conditions.workload の「常時稼働し、使うのはデモの回だけ」を「サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く」に直した。basis_note の差し替えの記述を直した。対象の取引に FR-12 の押さえ直しを足した
  reason: 設計の連鎖が返した課題（常時稼働の前提）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-1）。設計の連鎖が返した課題（古い記述（仮のスタブ））への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-4）と、第 3 段階の再実行（2026-11-03）の QR-32 版 3 への追随
