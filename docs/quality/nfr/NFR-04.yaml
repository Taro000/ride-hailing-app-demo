id: NFR-04
title: 請求と返金の記録の一致の SLO
status: draft
version: 3
basis: inferred
basis_note: 目標値 99% は提案。突き合わせは FR-55（FRP-08 を受け入れた）。決済は Stripe のテスト環境で、最初のデモの回の日から数える（2026-11-03 の回答、設計 1-4。SLI-04）。毎日の突き合わせで判定するので、締め切りの型にする
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-32
kind: slo
cuj: CUJ-08
statement: 直近 28 日で、突き合わせた依頼の 99% で、押さえ・請求（運賃、キャンセル料、不在の料金）・返金の記録が決済のサービスの記録と一致する。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: 押さえ（FR-05、FR-12）、請求（FR-29、FR-30、FR-31）、キャンセル料（FR-07）、不在の料金（FR-27）、返金（FR-50）、突き合わせ（FR-55）
slo:
  sli: SLI-04
  target: 99%
  target_status: provisional
  target_rationale: 提案。運用実績がないので保守的にした。お金の誤りは 1 件ごとに NFR-07 で知らせるので、この SLO は傾向を見るためのもの。KPI から導いていない
  window: 28-day rolling
  error_budget: 突き合わせた乗車の 1% まで、記録が一致しなくてよい
  error_budget_volume: 28 日の突き合わせた乗車の件数 × 0.01（件数は未定）
  policy: EBP-01
  bad_run_budget_share: 1 ÷（28 日の突き合わせた乗車の件数 × 0.01）。28 日の乗車が 100 件に満たないと、1 件の不一致でバジェットを使い切る
  progress_alert: NFR-06（毎朝 8:30 に突き合わせが終わっていなければ知らせる）
  after_miss: ticket
gate: null
audit: null
monitor: null
changelog:
