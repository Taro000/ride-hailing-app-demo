id: NFR-09
title: 到着予定時刻と料金の決まりを地図のサービスを使わずに試すゲート
status: active
basis: inferred
basis_note: 試験の中身は QR-67、QR-65、QR-61 からの推定。手配のときの到着予定時刻がドライバーが見つかるまでと迎車の時間を含むこと（FR-03）と、EXT-02 が失敗または無応答のときに迎車の着く見込みと依頼の内容のうち EXT-02 によるものを示せないと示すこと（FR-06、FR-08、FR-20）を試験の対象に含めた
premises: [EXT-02]
from: [QR-67, QR-65, QR-61]
kind: gate
cuj: CUJ-01
statement: 変更のたびに、目的地への到着予定時刻（ドライバーが見つかるまでと迎車の時間を含む）と料金を求める決まりを EXT-02 を使わずに自動で試験して、料金が模擬の運賃表に従って求めた額であることを確かめ、EXT-02 が失敗する場合と答えない場合に、到着予定時刻と料金を示せないことを乗客に伝えて依頼させず、迎車の着く見込みと依頼の内容のうち EXT-02 によるものを示せないことを示し、確定した依頼と進んでいる乗車が続くことを確かめる。
conditions:
  workload: null
  users: null
  transactions: 依頼の前に示す到着予定時刻と料金、迎車の着く見込み、ドライバーに示す依頼の内容、乗車中に降りる場所を変えるときの到着予定と料金
slo: null
gate:
  where: CI
  check: 到着予定時刻と料金を求める決まりの試験（EXT-02 の正常な応え、失敗、無応答を模したもの、ドライバーが見つかるまでと迎車の時間の見込み、運賃表の各区分の境目を含む）と、EXT-02 が失敗または無応答のときに依頼させず、EXT-02 によるものを示せないことを示し、進んでいる乗車を続ける試験
  threshold: すべての試験が通ること。通らない変更は公開しない
