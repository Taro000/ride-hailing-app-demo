id: NFR-27
title: 本人の確かめと見られる範囲を試すゲート
status: active
basis: inferred
basis_note: 試験の中身は QR-10、QR-13、QR-34、QR-56、QR-57 からの推定。本人であることを確かめる機能は FR-48（FRP-01 の受け入れ）、利用者の種類ごとの機能の区別は FR-49（FRP-02 の受け入れ）
premises: [CON-06]
from: [QR-10, QR-13, QR-57, QR-34, QR-56]
kind: gate
cuj: null
statement: 変更のたびに、本人であることを確かめていないアカウントと使い終える操作をした後のアカウントでは依頼、許諾、乗車の開始、決済、返金、登録、停止、調査の機能を使えないこと、利用者の種類ごとに決めた機能のほかは使えないこと、端末から送る値を書き換えても確定額、評価、依頼の状態が変わらないこと、位置情報と乗車の記録は QR-57 が決める人だけが見られること、エンジニアの調査では理由を示したその依頼の分のほかは個人の情報が隠れることを、自動で試験する。
conditions:
  workload: null
  users: 乗客、ドライバー、運営・サポートの担当者、エンジニア
  transactions: QR-10 と QR-57 が挙げる機能と記録
slo: null
gate:
  where: CI
  check: 利用者の種類と本人の確かめの有無の組ごとに、使える機能と見られる記録を確かめる試験と、端末から送る値を書き換える試験。新しい機能、記録、知らせを加えたときは、その試験を加えるまで完成としない
  threshold: すべての試験が通ること。通らない変更は公開しない
audit: null
monitor: null
