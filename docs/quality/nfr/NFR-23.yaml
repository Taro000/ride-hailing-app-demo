id: NFR-23
title: 示す額と請求する額の確定額との一致の SLO
status: active
basis: assumed
basis_note: 目標値 99.5% は暫定の決定（QAS-31）。SLO として置くことと方針は質問 9 の回答。アラートの予算の消費は、使う時間がウィンドウの 3〜12 時間（OPF-01）に集まるものとして計算した。どの規則も予算を使い切った後に鳴るため、悪いイベントのたびのチケットを加えた
premises: [OPF-01, OPF-02, OPF-03, CON-01, CON-03, QAS-31]
from: [QR-04]
kind: slo
cuj: CUJ-03
statement: 直近 28 日で、ドライバーが決済を行った乗車の 99.5% で、乗客とドライバーに示した額、請求した額、乗客に示した支払った額がどれも確定額と等しい。
conditions:
  workload: デモの回の間（OPF-01）。参加者と依頼の量は OPF-02 と OPF-03
  users: 登録した乗客とドライバー。試験用のアカウントを除く
  transactions: すべての乗車の決済。乗車中に降りる場所を変えた乗車を含む
slo:
  sli: SLI-11
  target: 99.5%
  target_status: provisional
  target_rationale: 入力の数値も基準となる値もなく、機能はまだない。額の食い違いは乗客の信用を直接損なうため可用性より高くしたが、実際のお金は動かず（CON-03）、最初のウィンドウで数えることを優先して 99.9% より緩めた（QAS-31）。KPI と KGI からは導いていない
  window: 直近 28 日
  error_budget: 決済を行った乗車の 0.5% まで、確定額と食い違う額があってよい
  error_budget_volume: 許される食い違いは、28 日に入る乗車 2〜6 回（OPF-01、OPF-02）の 0.5% で 0.01〜0.03 件。1 件で予算を使い切る
  policy: EBP-01
  alerts:
    - {notify: page, long_window: 1h, short_window: 5m, burn_rate: 14.4, budget_spent_at_alert: 120〜480%, condition: 長いウィンドウの有効なイベントが 20 件以上のときだけ}
    - {notify: page, long_window: 6h, short_window: 30m, burn_rate: 6, budget_spent_at_alert: 150〜600%, condition: 長いウィンドウの有効なイベントが 20 件以上のときだけ}
    - {notify: ticket, long_window: 3d, short_window: 6h, burn_rate: 1, budget_spent_at_alert: 50〜100%, condition: null}
    - {notify: ticket, long_window: null, short_window: null, burn_rate: null, budget_spent_at_alert: 1 件で 100% 以上, condition: ウィンドウに許される失敗が 1 件に満たない間は、悪いイベントのたびに（EBP-01 の最後の規則）}
gate: null
audit: null
monitor: null
