id: NFR-24
title: 二重の請求と返金の誤りの監視
status: active
basis: inferred
basis_note: 一度だけの請求、キャンセル料と不在の料金を決まりに当たる依頼にだけ請求すること、一度だけの返金、支払われた額までの返金は一件の誤りも認めないため、エラーバジェットを持つ SLO ではなく、一件ごとに知らせる監視にした（推定）。キャンセル料と不在の料金（CON-08）と、それを請求した依頼への返金を含めたのは、QR-04 と QR-45 に含まれたことによる。返金は件数が少ないため、EXT-01 との食い違いもここで一件ごとに知らせる
premises: [EXT-01, CON-03, CON-08]
from: [QR-04, QR-45, QR-30]
kind: monitor
cuj: CUJ-08
statement: 一つの乗車への二度目の請求、一つの依頼へのキャンセル料か不在の料金の二度目の請求、許諾の前に取り消された依頼と許諾のないまま終わった依頼への請求、一つの返金の二度目の実行、乗車や依頼に支払われた額を超える返金の合計、EXT-01 の処理と額か結果が食い違う返金の記録を、見つけるたびにエンジニアと運営・サポートの担当者に知らせる。
conditions:
  workload: null
  users: 登録した乗客。試験用のアカウントを除く
  transactions: 乗車の決済（請求）、キャンセル料と不在の料金の請求、返金
slo: null
gate: null
audit: null
monitor:
  signal: システムの記録と EXT-01 の処理を突き合わせて見つかる、乗車ごとと依頼ごとの請求の数と種類、許諾の前に終わった依頼への請求、返金ごとの実行の数、乗車や依頼ごとの返金の合計と支払われた額、返金の額と結果の食い違い
  threshold: 一件でもあれば知らせる
  notifies: エンジニアと運営・サポートの担当者
