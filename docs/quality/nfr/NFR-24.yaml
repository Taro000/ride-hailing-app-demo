id: NFR-24
title: 二重の請求と返金の誤りの監視
status: active
basis: inferred
basis_note: 一度だけの請求と返金、支払われた額までの返金は一件の誤りも認めないため、エラーバジェットを持つ SLO ではなく、一件ごとに知らせる監視にした（推定）。返金は件数が少ないため、EXT-01 との食い違いもここで一件ごとに知らせる
premises: [EXT-01, CON-03]
from: [QR-04, QR-45, QR-30]
kind: monitor
cuj: CUJ-08
statement: 一つの乗車への二度目の請求、一つの返金の二度目の実行、乗車に支払われた額を超える返金の合計、EXT-01 の処理と額か結果が食い違う返金の記録を、見つけるたびにエンジニアと運営・サポートの担当者に知らせる。
conditions:
  workload: null
  users: 登録した乗客。試験用のアカウントを除く
  transactions: 乗車の決済（請求）と返金
slo: null
gate: null
audit: null
monitor:
  signal: システムの記録と EXT-01 の処理を突き合わせて見つかる、乗車ごとの請求の数、返金ごとの実行の数、乗車ごとの返金の合計と支払われた額、返金の額と結果の食い違い
  threshold: 一件でもあれば知らせる
  notifies: エンジニアと運営・サポートの担当者
