id: NFR-32
title: 操作を誰がいつ行ったかを残す完成の定義
status: active
basis: inferred
basis_note: 記録が残ることは公開の前に試験で確かめられるため、完成の定義にした（推定）。担当者の操作の記録は FR-50（FRP-03 の受け入れ）。許諾の後の取り消しと乗客の不在で終えることを含めたのは、QR-12 に含まれたことによる（CON-08）
premises: [CON-08]
from: [QR-12, QR-35, QR-44]
kind: gate
cuj: null
statement: 乗客が料金を確かめて依頼すること、乗車中に新しい降りる場所と料金を承認すること、許諾の後にキャンセル料がかかることを確かめて取り消すこと、ドライバーが乗客の不在として依頼を終えること、ドライバーが到着を確認すること、エンジニアが隠した個人の情報を見ること、担当者による苦情の対応の記録、返金、アカウントの作成と訂正、試験用の区別の変更、ドライバーと車両の登録と訂正、停止と再開を加えるか変える機能は、誰が、いつ、何を（エンジニアが見たときは理由も）行ったかを、後から書き換えられない形で残すことを試験で確かめるまで完成としない。
conditions:
  workload: null
  users: 乗客、ドライバー、エンジニア、運営・サポートの担当者
  transactions: QR-12、QR-35、QR-44 が挙げる操作
slo: null
gate:
  where: definition-of-done
  check: 挙げた操作ごとに、操作した人、時刻、中身（エンジニアは理由）が残り、後から書き換えられないことを確かめる試験
  threshold: 挙げた操作のすべてに試験があり、通ること
audit: null
monitor: null
