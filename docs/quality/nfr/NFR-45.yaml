id: NFR-45
title: 不在の料金とキャンセル料の根拠の見直し
status: draft
version: 2
basis: inferred
basis_note: QR-49 は最低限守る線なので、軽い監視にした。件数の多いドライバーを見つける値は置かず、料金を取った依頼をすべて一覧にする（デモの規模で読める件数の見込み。推定）。D_arrival の値は NFR-14 の 50 m と同じにする。疑わしい印を一覧に足し、ドライバーごとに数えることは 2026-11-03 の回答（設計 2-2）で確認済み。印を付ける規則は設計が決める（DEC-29）。料金の規則は変えない
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-49
kind: monitor
cuj: CUJ-07
statement: 毎日、前日に不在の料金かキャンセル料を請求した依頼を、到着の位置と乗る場所の距離、到着から不在で終えるまでの時間、ドライバー、位置の列から偽りが疑われる印とともに一覧にし、運営・サポート担当に知らせる。あわせて「位置を確かめられなかった」到着の件数と、疑わしい印の付いた到着の件数をドライバーごとに数える。運営・サポート担当は一覧を見て、偽りと判断した到着の料金を返金する（FR-50）。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate: null
audit: null
monitor:
  signal: 状態の履歴（FR-39）の到着（FR-25 の位置と印）、不在（FR-27）、取り消し（FR-07）とキャンセル料・不在の料金の請求。疑わしい印（設計の DEC-29 が、現在地の受信の記録（FR-17）の位置の列から付ける）
  threshold: 請求した依頼が 1 件でもあれば翌日に一覧を知らせる
  notifies: 運営・サポート担当（翌日にチャット）。偽りと判断した到着の料金は返金する（FR-50）
changelog:
- version: 1
  date: '2026-11-01'
  change: 作成
  reason: 第 4 段階の再実行（第 2 段階 7d0cb6d・08c3ee0、第 3 段階 156240c・9c28917）
- version: 2
  date: '2026-11-03'
  change: conditions.workload の「常時稼働し、使うのはデモの回だけ」を「サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く」に直した。一覧に疑わしい印を足し、疑わしい到着の件数もドライバーごとに数えると書いた。偽りと判断したら返金する
  reason: 設計の連鎖が返した課題（常時稼働の前提）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-1）。設計の連鎖が返した課題（疑わしい到着の料金）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-2）
