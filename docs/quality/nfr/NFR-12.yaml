id: NFR-12
title: 到着予定時刻の誤差を要素ごとに見直す
status: draft
version: 3
basis: inferred
basis_note: 自然な SLI は QIU-02 の測定量と同じイベントを数えるので、SLO にしなかった（推定。質問 5 は未回答）。T_late は第 1 段階で 5 分に決まった（QIU-02）。この NFR はその値で遅れた乗車を選ぶ
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-08
kind: audit
cuj: CUJ-01
statement: デモの期間ごとに、完了した乗車について、到着予定時刻の三つの要素（ドライバーが見つかるまで、迎車、走行）の見込みと実際を比べ、T_late を超えて遅れた乗車の誤差がどの要素から来たかを報告する。あわせて、許諾のときに示した迎車の到着予定（FR-10 が記録）と位置を確かめた到着（FR-25）を比べ、迎車の遅れで無料になった取り消しの件数を報告する。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate: null
audit:
  mechanism: 示した到着予定時刻と要素ごとの見込み（FR-03 で依頼に記録）、許諾のときの迎車の到着予定（FR-10 で記録）と、状態の履歴（FR-39）の時刻の比較
  criterion: 誤差が最も大きい要素に、見込み方を直す作業を一件作る
  cadence_or_deadline: デモの期間ごと
monitor: null
