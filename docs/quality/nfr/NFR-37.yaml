id: NFR-37
title: 状態の変化、端末のエラー、苦情を記録する完成の定義
status: active
basis: assumed
basis_note: 記録が欠けないことは、記録されなかったものを本番で見つけられない部分があるため、完成の定義で確かめる（推定）。端末で起きたエラーの記録は FRP-09 を待つ。苦情と返金の求めをシステムの中で受け付けることは QAS-06 による
premises: [QAS-06]
from: [QR-41]
kind: gate
cuj: CUJ-10
statement: 依頼の状態を変える機能、乗客とドライバーの端末で動く機能、苦情、返金の求め、報告を受け付ける機能を加えるか変えるときは、状態の変化、端末で起きたエラー、苦情と返金の求めと報告が、関わる依頼や乗車と結び付いて記録され、苦情と報告は終えるまでの状態とともに担当者に示されることを、試験で確かめるまで完成としない。
conditions:
  workload: null
  users: 乗客、ドライバー、運営・サポートの担当者、エンジニア
  transactions: 依頼の状態の変化、端末で起きたエラー、苦情、返金の求め、報告
slo: null
gate:
  where: definition-of-done
  check: 加えるか変える機能ごとに、記録が依頼や乗車と結び付いて残ることと、苦情と報告の状態が担当者に示されることを確かめる試験（端末のエラーは、端末で起こしたエラーが記録に残ることを確かめる）
  threshold: 挙げた機能のすべてに試験があり、通ること
audit: null
monitor: null
