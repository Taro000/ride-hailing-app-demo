id: NFR-08
title: 決済・請求・返金の自動テストで配備を止める
status: draft
version: 2
basis: inferred
basis_note: 配備を止めるゲートにすることは質問 2 で確認済み。確かめる場合の一覧は推定。押さえ直し、結果の分からない押さえ、システムの取り消し、失敗の後の新しいキーを確かめる場合に足したことは、QR-09 版 5・QR-17 版 3 への追随（推定）
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-09
- QR-17
- QR-32
- QR-43
kind: gate
cuj: CUJ-08
statement: 配備（FR-41）の前に、決済・請求・返金の流れの自動テストを実行し、一つでも落ちたら配備を止める。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate:
  where: CI
  check: 決済のサービスの代わりとテスト環境を使い、押さえの額が確定した料金と同じこと、応答のない請求を同じキーで確かめて二度請求しないこと（FR-29、FR-30）、降車場所の変更後の料金で請求すること（FR-12）、請求の失敗で未払いになること（FR-31）、返金が残りの額を超えず二度行われないこと（FR-50）、押さえ直しの後に古い押さえを残さないこと（FR-12）、押さえの結果が分からないとき T_hold_wait の後に押さえを残さず手配をやめること（FR-05、FR-12）、システムが取り消した依頼にキャンセル料をかけないこと（FR-08）、失敗と分かった後の払い直しと返金のやり直しが新しいキーで行われること（FR-30、FR-50）を確かめる
  threshold: すべて通る。一つでも落ちたら配備を止める
audit: null
monitor: null
