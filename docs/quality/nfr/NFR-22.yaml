id: NFR-22
title: 登録の訂正を乗客に示す手がかりに反映する受け入れの試験
status: active
basis: inferred
basis_note: 登録した内容が実際の車とドライバーに一致することは担当者の手続きで守る（範囲外）。ソフトウェアは訂正が手がかりに反映されることを受け持つ（推定）。登録で入れる項目は FR-43（FRP-07 の受け入れ）の名前、顔写真、連絡先、車種、色、ナンバーで、審査の結果は記録しない（CON-07）
