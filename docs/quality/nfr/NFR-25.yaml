status: draft
version: 2
basis: inferred
basis_note: 10 秒は提案。T_alight（降車場所に着いてから支払いを終えるまで）は第 1 段階で 30 秒に決まった（QIU-07）。30 秒をシステムだけで使い切らないよう、3 分の 1 にして残りを乗客が結果を見て降りる時間にした（第 4 段階の質問 7〜9（2026-11-01））
