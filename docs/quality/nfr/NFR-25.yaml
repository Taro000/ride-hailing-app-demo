id: NFR-25
title: 降車時の請求の結果が出るまでの時間
status: draft
version: 3
basis: inferred
basis_note: 10 秒は提案。T_alight（降車場所に着いてから支払いを終えるまで）は第 1 段階で 30 秒に決まった（QIU-07）。30 秒をシステムだけで使い切らないよう、3 分の 1 にして残りを乗客が結果を見て降りる時間にした（第 4 段階の質問 7〜9（2026-11-01））。請求に失敗した乗車と、10 秒の内に結果のない乗車（確かめ中）も数えることは 2026-11-03 の回答（レビュー 3-1）で確認済み
needs_agreement: true
approver_candidates:
- プロダクトオーナー
- 開発の責任者
from:
- QR-04
kind: monitor
cuj: CUJ-08
statement: 乗車の終了（FR-28）から請求の結果（成功か失敗）の記録（FR-29）までが 10 秒を超えた乗車を毎日数え、1 件でもあればエンジニアに知らせる。10 秒の内に結果のない乗車（確かめ中）も、超えたと数える。
conditions:
  workload: 少人数の参加者のデモ。件数は未定（運用の事実）。サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く（2026-11-03 の回答、設計 1-1）
  users: デモの参加者（乗客、ドライバー、運営・サポート担当）。エンジニアのテスト用アカウント、合成の監視、負荷試験は除く
  transactions: null
slo: null
gate: null
audit: null
monitor:
  signal: 乗車の終了と、請求の結果（成功か失敗）の記録の時刻の差。10 秒以内に結果がないもの（確かめ中）も、超えたと数える
  threshold: 10 秒を超えた乗車が 1 件でも
  notifies: エンジニア（翌日にチケット）
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
- version: 2
  date: '2026-11-01'
  change: しきい値を 30 秒から 10 秒に下げた
  reason: 第 4 段階の再実行（第 2 段階 7d0cb6d・08c3ee0、第 3 段階 156240c・9c28917）
- version: 3
  date: '2026-11-03'
  change: conditions.workload の「常時稼働し、使うのはデモの回だけ」を「サーバーはデモの回だけ、毎日の処理はデモの期間だけ動く」に直した。signal を、乗車の終了と請求の結果（成功か失敗）の記録の時刻の差にし、10 秒の内に結果のないもの（確かめ中）も超えたと数えると書いた
  reason: 設計の連鎖が返した課題（常時稼働の前提）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 1-1）。設計の連鎖が返した課題（NFR-25 の数え方）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md のレビュー 3-1）
