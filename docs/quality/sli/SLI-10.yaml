id: SLI-10
title: 車とドライバーの現在地の新しさ
status: active
basis: inferred
basis_note: しきい値 30 秒（T_vehicle_location_lag）と 1 分ごとの確かめは決めたこと #17 の訂正（しきい値は利用者が仮とした）。迎車中のドライバーに示す乗客の現在地は FRP-10 を待ち、受け入れられたら確かめる対象に加える
premises: [OPF-01, QAS-29]
function: GOOD ÷ VALID
refs: [QR-19, NFR-19]
reshaped: 規則 2（位置が届くたびではなく、使われている間の確かめごとに数えた。位置が届かなくなった間も古さとして数えられる）
target_entity: 乗客に示す迎車と乗車中の車の位置（FR-08, FR-13）と、依頼を届けるかを決めるときに使うドライバーの現在地（FR-19）として、システムが持っているドライバーの位置
purpose: 乗客に示す車の位置と、依頼を届けるときに使うドライバーの現在地が、実際の位置から遅れていることがどれだけあるか
unit_event: 受付をしている、迎車中、または乗車中の一人のドライバーについての、1 分ごとの一回の確かめ
vantage: data
vantage_reason: 位置の遅れは、システムが持つ位置を端末が測った時刻と比べて初めて分かる。位置が届かなくなったことは利用者の操作の応えに現れないため、使われている間をデータとして確かめる
existing_source: null
elements:
  VALID:
    definition: 受付をしている、迎車中、または乗車中のドライバーについて、1 分ごとに行う確かめ
    exclusions: 試験用のアカウントのドライバー、模擬の利用による確かめ、負荷試験
    unit: 確かめ
    counting_rule: ドライバーごとに 1 分に一回と数える。一人のドライバーが受付をしながら迎車中でも一回と数える。確かめは行った時刻の日に数える
  GOOD:
    definition: VALID のうち、その時点でシステムが持つそのドライバーの位置が、端末がその位置を測ってから 30 秒（T_vehicle_location_lag）以内のもの
    unit: 確かめ
    counting_rule: VALID と同じ。システムがそのドライバーの位置を一つも持っていないときは GOOD に数えない
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の受付、迎車、乗車
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う
blind_spots: システムが持つ位置が乗客の画面に示されるまでの通信と端末の時間は見えない。端末が測る位置そのもののずれも見えない
