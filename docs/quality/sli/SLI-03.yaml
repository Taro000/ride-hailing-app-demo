id: SLI-03
title: 現在地の最新性
status: draft
version: 2
basis: inferred
basis_note: 受信の時刻で測ることと、裏の時間を除くことは推定（質問 5 は未回答）。単位を毎分 0 秒の時点にし、毎日の処理が受信と受付・状態の記録から確かめ直して数えること、サーバーが確かめられなかった分も数えること、見えないものの二つは 2026-11-03 の回答（設計 2-8。設計の DEC-16 の版 4、設計の第 2 段階の質問 24）で確認済み。デモの回が開いていた間は、FR-41 版 4 の回の開け閉めの記録で知る（FRP-11 を第 2 段階の質問 23 で受け入れた）
needs_agreement: true
approver_candidates:
- 開発の責任者
- プロダクトオーナー
function: FRESH ÷ CHECKS
refs:
- QR-27
- NFR-03
reshaped: 規則 2（データが新しかった時間の割合ではなく、毎分の確かめの回数で数える）
target_entity: 画面に示すドライバーの現在地と迎車中の乗客の現在地、受付中として数えるドライバー
purpose: 相手の画面に古い現在地が示される頻度
unit_event: 使用中の参加者 1 人の、毎分 0 秒の時点 1 回。使用中の区間は受付と状態の記録で決め、デモの回が開いていた間に限る
method: 受信の時刻法（毎分 0 秒の時点と、その時点より前に最後に受けた現在地の時刻の差）
elements:
  CHECKS:
    definition: 毎分 0 秒の時点に、受付中・迎車中・乗車中だったドライバーと、迎車中で位置情報の利用を許可していた乗客（受付と状態の記録でその区間にいた参加者。デモの回が開いていた間に限る）
    exclusions: ドライバーのブラウザが裏にあった時間（FR-17 の記録）。受付を始めてから最初の 30 秒。エンジニアのテスト用アカウント
    inputs: '現在地の受信の記録（FR-17）: アカウント、受けた時刻。受付と状態の記録（FR-17、FR-39）。裏にあった時間の記録（FR-17）。デモの回を開いた時刻と閉じた時刻（FR-41 版 4 の配備の記録）'
    unit: checks
    counting_rule: 毎分 0 秒の時点ごとに、使用中の参加者 1 人を 1 件と数える。毎日の処理が、受信と受付・状態の記録から同じ規則で確かめ直して数える。サーバーが確かめられなかった分（サーバーが止まった間、サーバーがデータベースに届かなかった間）も、同じ規則で確かめ直して数え、受信がなければ新しくないと数える。後から届いた裏の記録の区間も除く
  FRESH:
    definition: CHECKS のうち、その時点より前に最後に受けた現在地の時刻が、その時点から 30 秒（T_loc_fresh）以内のもの
    inputs: CHECKS と同じ
    unit: checks
    counting_rule: CHECKS と同じ
scale: ratio
applicability: 本番
lifecycle: 本番で測る。値は、デモの期間の毎朝、毎日の処理が前日分を確かめ直して出す。アラート（NFR-03）は、サーバーの毎分の確かめで出す
blind_spots: 端末が位置を測ってから送るまでの遅れは見えない。乗客のブラウザが裏にあるかは記録がないので、乗客の分は実際より悪く見えうる。サーバーが止まっていた間は、最後の状態のまま使用中とみなして数えるので、実際より悪く見えうる。アラート（サーバーの毎分の確かめ）と毎日の値はずれうる。ずれるのは、サーバーが確かめられなかった分と、後から届いた裏の記録
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: 単位を「使用中の参加者 1 人の、毎分 0 秒の時点 1 回」（デモの回が開いていた間に限る）にし、方法、CHECKS と FRESH の定義と数え方（サーバーが確かめられなかった分も受信と受付・状態の記録から確かめ直して数える）、lifecycle、見えないもの二つを書き直した。除くものは変えない
  reason: 設計の連鎖が返した課題（SLI-03 の確かめられなかった分）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-8）。counting_rule に一文足すだけでは、サーバーが確かめる 1 回という単位と食い違うため、単位から直した
