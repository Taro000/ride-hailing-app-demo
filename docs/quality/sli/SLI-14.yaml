id: SLI-14
title: 依頼の状態の変化を相手の画面に示す速さ（利用者の側）
status: active
basis: assumed
basis_note: しきい値 T_dispatch_propagation（5 秒）は暫定の決定（QAS-25）。迎車が乗る場所に着いたとみなす範囲を D_pickup_position_gap（50 m）とするのは第 4 段階の質問 3 の回答の読み（QAS-52）。相手の画面に示した時刻は FR-53 が記録し、FR-53 を今期作ることは第 2 段階の暫定の決定（QAS-54）。相手の端末がつながっていなかった変化を数えないのは、途切れていないときは T_dispatch_propagation 以内に示し、途切れたときは失わないことを先にするという QR-06 と QR-02 の競合の扱いによる。どのインタフェースが数えるイベントを出すかは設計が決める
premises: [OPF-01, QAS-25, QAS-52, QAS-54]
function: GOOD ÷ VALID
refs: [QR-06, NFR-07]
reshaped: 規則 1（平均の時間ではなく、T_dispatch_propagation 以内に示した割合にした）。規則 3（見る位置を、システムが相手に向けて送るまでではなく、相手の画面に示されるまでにした）。規則 4（数える区間の始まりと終わりを書いた）
target_entity: 一つの配車依頼の状態の変化（乗客の依頼と取り消し、ドライバーの許諾と取り消し、ほかのドライバーの許諾、迎車の乗車場所への到着）が、相手（依頼を届けたドライバー、依頼の乗客、依頼を見ているほかのドライバー）の画面、一覧、通知に示されること（FR-04, FR-06, FR-07, FR-10, FR-18, FR-21, FR-23。示した時刻は FR-53 が記録する）
purpose: 依頼、許諾、取り消し、迎車の到着が、相手の画面に遅れて示されることがどれだけあるか
unit_event: 一つの状態の変化が、一人の相手の画面、一覧、通知に示されること
vantage: user-side
vantage_reason: QR-06 が求めるのは相手の画面に示されるまでの時間で、相手の画面に示された時刻が最も近い。システムが相手に向けて送るまでの区間だけでは、送ってから示されるまでの通信と端末の時間が見えない
existing_source: null
elements:
  VALID:
    definition: 状態の変化のうち、システムが受けた乗客とドライバーの操作（依頼、取り消し、許諾）によるものと、迎車の位置が乗る場所から D_pickup_position_gap（50 m）以内に入ったことによるものを、示すべき相手ごとに数えたもの
    exclusions: 試験用のアカウントの依頼、模擬の利用による確かめ、負荷試験。相手の端末がつながっていなかったために示せなかったと記録された変化（FR-53）。途切れた間に失わないことは NFR-11 が確かめる
    unit: 状態の変化と相手の組
    counting_rule: 同じ変化を同じ相手に何度示しても一つと数え、最初に示した時刻を使う。一つの依頼を 5 人のドライバーに届けたときは 5 と数える。区間は、操作による変化ではシステムがその操作を受けた時刻から、到着ではシステムが乗る場所から 50 m 以内の迎車の位置を受けた時刻から始まり、相手の画面、一覧、通知に示した時刻で終わる。変化はシステムが受けた時刻の日に数える
  GOOD:
    definition: VALID のうち、区間が T_dispatch_propagation（5 秒）以内のもの
    unit: 状態の変化と相手の組
    counting_rule: VALID と同じ。示した時刻も示せなかったことも記録されていない変化は GOOD に数えない
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の依頼
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う。試験の環境と負荷試験の値は見積もりで、別に扱う
blind_spots: 操作した人の端末で操作してからシステムが受けるまでの時間は見えない。迎車が実際に着いてから、その位置をシステムが受けるまでの遅れも見えない（位置の遅れは SLI-10 が数える）。相手の端末がつながっていなかった間の変化は数えない
