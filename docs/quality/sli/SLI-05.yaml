id: SLI-05
title: 状態の履歴の完全性
status: draft
version: 2
basis: inferred
basis_note: そろうべき変化の組は推定。位置を求めるのはドライバーが場所で行う四つの操作だけで、位置か得られなかった印があればそろったと数え、ほかの変化は時刻と操作した人があればそろったと数えることは 2026-11-03 の回答（設計 2-5）で確認済み。取り消しにシステムの取り消し（FR-08）と押さえの結果が分からないまま手配をやめた依頼（FR-05）を含めることは第 4 段階の質問 11 で確認済み
needs_agreement: true
approver_candidates:
- 開発の責任者
- プロダクトオーナー
function: COMPLETE ÷ ENDED
refs:
- QR-33
- NFR-05
reshaped: null
target_entity: 配車依頼と乗車の状態の履歴（FR-39）
purpose: 苦情の調べや障害の解析で、履歴が欠けている頻度
unit_event: 前日に終わった依頼 1 件
method: 履歴の確かめ法（毎日の処理で、依頼ごとに履歴を調べる）
elements:
  ENDED:
    definition: 前日（日本時間）に、乗車の終了、取り消し、不在のどれかで終わった依頼
    exclusions: エンジニアのテスト用アカウントの依頼
    inputs: '状態の履歴: 依頼の ID、変化の種類、時刻、操作した人、位置、位置を得られなかった印、ドライバーの ID'
    unit: requests
    counting_rule: 依頼の ID ごとに 1 件。取り消しには、乗客とドライバーの取り消しのほか、システムの取り消し（T_request_max を過ぎた依頼、FR-08）と、押さえの結果が分からないまま手配をやめた依頼（FR-05）を含む
  COMPLETE:
    definition: VALID のうち、終わり方ごとに決めた変化がそろうもの。乗車の終了なら手配、許諾、迎車の到着、乗車の開始、乗車の終了、請求。取り消しなら手配と取り消し（許諾の後なら許諾も）。不在なら手配、許諾、迎車の到着、不在。どの変化にも時刻と操作した人があり、ドライバーが場所で行う四つの操作（迎車の到着、乗車の開始、不在、乗車の終了）には位置か、位置を得られなかった印がある。許諾の後はドライバーの ID がある。ほかの変化（手配、許諾、取り消し、降車場所の変更、請求、返金、システムが起こす変化）には位置を求めない
    inputs: VALID と同じ
    unit: requests
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番
lifecycle: 本番で毎日測る
blind_spots: ブラウザのエラーの記録（FR-38）と乗客の報告（FR-43）の欠けは見えない。記録されなかった依頼そのものは数えられない
changelog:
- version: 1
  date: '2026-10-31'
  change: 作成
  reason: 第 4 段階の下書き（質問 1〜4 の回答を反映）
- version: 2
  date: '2026-11-03'
  change: COMPLETE を、四つの操作は位置か得られなかった印、ほかの変化は時刻と操作した人があればそろったと数える形に直した。取り消しにシステムの取り消しと手配をやめた依頼を含めると書いた
  reason: 設計の連鎖が返した課題（位置のない変化）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-5）と、第 2 段階の再実行（2026-11-03）の FR-05・08 への追随
