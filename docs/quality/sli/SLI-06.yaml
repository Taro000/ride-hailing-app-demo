id: SLI-06
title: 到着の確認と決済の可用性
status: active
basis: inferred
basis_note: 何を失敗と数えるかは QR-01 と FR の受け入れ基準からの推定。どのインタフェースが数えるイベントを出すかは設計が決める
premises: [OPF-01]
function: GOOD ÷ VALID
refs: [QR-01, NFR-06]
reshaped: 規則 2（使える時間の割合ではなく、操作ごとの成功の割合にした。一部の機能や一部の利用者だけに起きる失敗も数えられる）
target_entity: CUJ-08 でドライバーが乗車中の画面で行う操作（到着を確認する、決済を行う）を、システムが受けて応えること
purpose: ドライバーが到着を確かめて決済を終えようとしたときに、システムが応えられないことがどれだけあるか
unit_event: ドライバーが乗車中の画面で行った一つの操作（FR-28, FR-29。決済は依頼のときの押さえからの請求を含む、FR-54）
vantage: system-boundary
vantage_reason: システムが失敗したかどうかはチームが変えられるもので、システムに届いた操作はすべて見える。利用者の側から見ると届く前の失敗も見えるが、端末と通信の状態が混ざるため、可用性はシステムの境界で数える
existing_source: null
elements:
  VALID:
    definition: ドライバーの操作のうち、システムに届いたもの
    exclusions: 試験用のアカウントの操作、模擬の利用による確かめ、負荷試験
    unit: 操作
    counting_rule: 同じドライバーが同じ操作を応えを待たずに送り直したものは一つと数える。操作はシステムが受けた時刻の日に数える
  GOOD:
    definition: VALID のうち、システムが自身の誤りを返さずに、その操作の結果（受け付けない入力への知らせ、ドライバーが見つからなかった知らせ、決済サービスが支払いを受け付けなかった知らせを含む）を応えたもの。システムが応えなかったもの、システム自身の誤りを返したもの、外部のサービス（EXT-01, EXT-02）の失敗や無応答のために操作を終えられなかったものは、GOOD に数えない
    unit: 操作
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の操作。模擬の利用による確かめは別に数える
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う。試験の環境と負荷試験の値は見積もりで、別に扱う
blind_spots: 端末に通信がなくシステムに届かなかった操作と、端末の中で起きた失敗は見えない。端末の中で起きたエラーは FR-52 が依頼と結び付けて記録するが、利用者の側の見る位置になるため、この SLI には数えない
