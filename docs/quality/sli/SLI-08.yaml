id: SLI-08
title: 乗車してからの到着の見込みの当たり
status: active
basis: assumed
basis_note: しきい値 T_arrival_estimate_gap（5 分）は暫定の決定（QAS-26）。手配のときの到着予定時刻の当たりは QIU-05 が数えるため、この SLI はシステムの見込みのうち乗車を始めてからの部分に絞る（第 4 段階の質問 22 の回答）。手配のときの到着予定時刻がドライバーが見つかるまでと迎車の時間を含むもの（FR-03）になり、乗車を始めてからの見込みの時間は記録されないため、それを記録する機能を FRP-14 で提案した。FRP-14 が受け入れられるまでは、乗車中に降りる場所を変えて乗客が承認した到着予定の時刻だけを数える（QIU-05 はその乗車を数えない）。受け入れられたら、降りる場所を変えなかった乗車を、乗車を始めた時刻に記録した見込みの時間を足した時刻と比べて加える
premises: [OPF-01, QAS-26, EXT-02]
function: GOOD ÷ VALID
refs: [QR-08, NFR-08]
reshaped: 規則 1（外れの平均ではなく、T_arrival_estimate_gap 以内に着いた乗車の割合にした）。QIU-05 の測定量と同じイベントを数えないよう、手配のときの到着予定時刻ではなく、乗車してからの見込みに絞った
target_entity: 乗車中に降りる場所を変えたときに乗客が承認した到着予定の時刻（FR-47）
purpose: 乗車してからシステムが示す到着の見込みどおりに着かないことがどれだけあるか
unit_event: 乗車中に降りる場所を変え、到着を確認した一つの乗車（FR-47, FR-28）
vantage: data
vantage_reason: 見込みの当たりは、示した見込みと実際に着いた時刻を突き合わせて初めて分かる。どの利用者の操作の応えにも現れないため、データで比べる
existing_source: null
elements:
  VALID:
    definition: ドライバーが到着を確認した乗車のうち、乗車中に降りる場所を変えて、乗客が新しい降りる場所と到着予定の時刻を承認したもの
    exclusions: 試験用のアカウントの乗車、取り消しと乗客の不在で終えた依頼
    unit: 乗車
    counting_rule: 一つの乗車は一つと数える。降りる場所を何度変えた乗車も、比べる時刻は最後に乗客が承認した到着予定の時刻とする。乗車は到着を確認した日に数える
  GOOD:
    definition: VALID のうち、ドライバーが到着を確認した時刻が、比べる時刻の前後 T_arrival_estimate_gap（5 分）以内のもの
    unit: 乗車
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の乗車
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う
blind_spots: 降りる場所を変えなかった乗車の、乗車を始めてからの見込みの外れは数えない（FRP-14 を待つ。手配のときの到着予定時刻の外れ全体は QIU-05 が数え、見込みの決まりは NFR-09 が試す）。ドライバーが着いてから到着を確認するまでの遅れは、外れに混ざる
