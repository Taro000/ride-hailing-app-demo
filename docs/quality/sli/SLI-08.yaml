id: SLI-08
title: 降りる場所までの移動時間の見込みの当たり
status: active
basis: assumed
basis_note: しきい値 5 分（T_arrival_estimate_gap）は暫定の決定（QAS-26）。決めたこと #21 で、QIU-05 は依頼の前に示した到着予定時刻（ドライバーが見つかるまでと迎車の時間を含む）どおりに降りた乗車の割合を記録から数えることになり、もとの SLI と同じイベントを数える。そのため、この SLI はシステムの見込みのうち乗車を始めてからの移動の部分に絞った（質問 22 の回答）
premises: [OPF-01, QAS-26, EXT-02]
function: GOOD ÷ VALID
refs: [QR-08, NFR-08]
reshaped: 規則 1（外れの平均ではなく、T_arrival_estimate_gap 以内に着いた乗車の割合にした）。QIU-05 の測定量と同じイベントを数えないよう、ドライバーが見つかるまでと迎車の時間を除き、乗車を始めてからの移動の見込みに絞った
target_entity: 依頼の前に乗客に示した降りる場所までの移動時間の見込み（FR-03）と、乗車中に降りる場所を変えたときに乗客が承認した到着予定の時刻（FR-47）
purpose: システムが示す移動時間の見込みどおりに着かないことがどれだけあるか
unit_event: 到着を確認した一つの乗車（FR-28）
vantage: data
vantage_reason: 見込みの当たりは、示した見込みと実際に着いた時刻を突き合わせて初めて分かる。どの利用者の操作の応えにも現れないため、データで比べる
existing_source: null
elements:
  VALID:
    definition: ドライバーが到着を確認した乗車のうち、依頼の前に移動時間の見込みを示したもの
    exclusions: 試験用のアカウントの乗車、取り消しと乗客の不在で終えた依頼
    unit: 乗車
    counting_rule: 一つの乗車は一つと数える。比べる時刻は、乗車を始めた時刻に依頼の前に示した移動時間を足した時刻とし、降りる場所を変えた乗車は最後に乗客が承認した到着予定の時刻とする。乗車は到着を確認した日に数える
  GOOD:
    definition: VALID のうち、ドライバーが到着を確認した時刻が、比べる時刻の前後 5 分（T_arrival_estimate_gap）以内のもの
    unit: 乗車
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の乗車
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う
blind_spots: ドライバーが見つかるまでと迎車の時間の見込みの外れは数えない（QIU-05 が数え、NFR-09 が決まりを試す）。ドライバーが着いてから到着を確認するまでの遅れは、外れに混ざる
