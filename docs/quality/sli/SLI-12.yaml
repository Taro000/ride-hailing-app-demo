id: SLI-12
title: 決済の記録と決済サービスの処理の一致
status: active
basis: assumed
basis_note: 結果を返さない決済を翌日の終わりに突き合わせることは暫定の決定（QAS-32）。返金の食い違いは件数が少なく一件ごとに知らせるため、監視（NFR-24）が受け持つ
premises: [OPF-01, EXT-01, CON-03, QAS-32]
function: GOOD ÷ VALID
refs: [QR-30, QR-29, NFR-26]
reshaped: null
target_entity: システムが乗車ごとに記録する決済の額と結果（済んだ、済まなかった、済んだかどうか分からない）と、EXT-01 が実際に処理した額と結果（FR-29, FR-31, FR-38）
purpose: システムが記録した決済が、EXT-01 の処理と食い違うことや、EXT-01 が返した結果が乗車に結び付いていないことがどれだけあるか
unit_event: システムが記録したか EXT-01 が処理した一つの決済（請求）
vantage: data
vantage_reason: 記録と EXT-01 の処理の食い違いは、両方を突き合わせて初めて分かる。システムだけを見ても、EXT-01 だけが処理した決済は見えない
existing_source: null
elements:
  VALID:
    definition: システムが記録した決済と、EXT-01 が処理した決済を合わせたもの
    exclusions: 試験用のアカウントの決済
    unit: 決済
    counting_rule: システムの記録と EXT-01 の処理が同じ決済を指すものは一つと数える。片方にしかない決済も一つと数える。EXT-01 が最終の結果を返した時点で突き合わせ、返さない決済は決済を行った日の翌日の終わりに突き合わせる。決済を行った日に数える
  GOOD:
    definition: VALID のうち、システムの記録と EXT-01 の処理の両方にあり、額と結果が等しいもの
    unit: 決済
    counting_rule: VALID と同じ。突き合わせの時点で EXT-01 が結果を返しているのにシステムが済んだかどうか分からないと記録しているものは GOOD に数えない
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の決済。EXT-01 はテスト環境（CON-03）
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う
blind_spots: 突き合わせの後に EXT-01 の側で変わった結果は、その日の値に入らない。返金は数えない（NFR-24）
