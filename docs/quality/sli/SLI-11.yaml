id: SLI-11
title: 押さえる額、示す額、請求する額の確定額と決まりの料金との一致
status: active
basis: inferred
basis_note: 突き合わせる額は QR-04、CON-01、CON-08 と FR-54 の受け入れ基準からの推定。一度だけの請求と、許諾の前の取り消しに何も請求しないことは一件も認めないため、この SLI ではなく監視（NFR-24）が数える
premises: [OPF-01, CON-01, CON-08]
function: GOOD ÷ VALID
refs: [QR-04, NFR-23]
reshaped: null
target_entity: 一つの依頼の確定額（CON-01）またはキャンセル料と不在の料金（CON-08）と、依頼のときと降りる場所を変えたときに押さえた額、乗客に示した料金、ドライバーに示した金額、EXT-01 に請求した額、解いた押さえの額、乗客に示した請求した額とその種類（FR-03, FR-07, FR-20, FR-26, FR-29, FR-30, FR-31, FR-47, FR-54）
purpose: 押さえる額、示す額や請求する額が、確定額や決まりの料金と食い違うことがどれだけあるか
unit_event: 押さえを行い、決済、取り消し、乗客の不在、または許諾のないまま終わった一つの依頼
vantage: data
vantage_reason: 額の食い違いは、依頼ごとに記録した額どうしを突き合わせて初めて分かる。どの応えにも誤りとして現れないため、データで比べる
existing_source: null
elements:
  VALID:
    definition: 押さえを行った依頼のうち、ドライバーが決済を行ったもの、乗客が取り消したもの、乗客の不在で終わったもの、許諾のないまま終わったもの
    exclusions: 試験用のアカウントの依頼。押さえられなかったために受け付けなかった依頼（FR-54）
    unit: 依頼
    counting_rule: 一つの依頼は、決済や請求を何度行っても一つと数える。依頼は、決済を最初に行った日、または取り消し、不在、許諾のないまま終わった日に数える
  GOOD:
    definition: VALID のうち、次のどれもが成り立つもの。押さえた額が確定額と等しい（乗車中に乗客が新しい料金を承認した依頼は、押さえ直した額が承認した料金と等しい）。決済した乗車では、乗客に示した料金、ドライバーに示した金額、EXT-01 に請求した額、乗客に示した支払った額（支払いが済んだときだけ）が確定額と等しい。許諾の後に乗客が取り消した依頼と乗客の不在で終わった依頼では、請求した額が CON-08 の額と等しく、乗客に示した請求した額と種類がそれと一致する。どの場合も、解いた押さえの額が押さえた額から請求した額を引いた額と等しい
    unit: 依頼
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の依頼
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う
blind_spots: 確定額そのものが運賃表どおりかは見えない（NFR-09 と NFR-48 が受け持つ）。EXT-01 が実際に処理した額との食い違いは SLI-12 が数える。許諾の前の取り消しへの請求と二度目の請求は、一件ごとに NFR-24 が知らせる
