id: SLI-01
title: 配車手配の可用性
status: active
basis: inferred
basis_note: 何を失敗と数えるかは QR-01 と FR の受け入れ基準からの推定。本人であることを確かめる操作（FR-48）と依頼のときの押さえ（FR-54）は、QR-01 の対象の機能に加わったため数える。押さえを EXT-01 が受け付けなかった知らせは GOOD、EXT-01 が答えなかったために依頼を受け付けられなかったものは GOOD でない。どのインタフェースが数えるイベントを出すかは設計が決める
premises: [OPF-01]
function: GOOD ÷ VALID
refs: [QR-01, NFR-01]
reshaped: 規則 2（使える時間の割合ではなく、操作ごとの成功の割合にした。一部の機能や一部の利用者だけに起きる失敗も数えられる）
target_entity: CUJ-01 で乗客が配車手配の画面で行う操作（本人であることを確かめて使い始める、場所の候補を求める、現在地を乗る場所として求める、到着予定時刻と料金を求める、配車を依頼する（確定額の押さえを含む）、依頼を取り消す）と、配車の確定の知らせを、システムが受けて応えること
purpose: 乗客が配車を手配しようとしたときに、システムが応えられないことがどれだけあるか
unit_event: 乗客が配車手配の画面で行った一つの操作（FR-48, FR-01, FR-02, FR-03, FR-04 と FR-54, FR-07）、またはシステムが乗客に送る一つの配車の確定の知らせ（FR-06）
vantage: system-boundary
vantage_reason: システムが失敗したかどうかはチームが変えられるもので、システムに届いた操作はすべて見える。利用者の側から見ると届く前の失敗も見えるが、端末と通信の状態が混ざるため、可用性はシステムの境界で数える
existing_source: null
elements:
  VALID:
    definition: 乗客の操作のうち、システムに届いたもの
    exclusions: 試験用のアカウントの操作、模擬の利用による確かめ、負荷試験
    unit: 操作
    counting_rule: 同じ乗客が同じ操作を応えを待たずに送り直したものは一つと数える。操作はシステムが受けた時刻の日に数える
  GOOD:
    definition: VALID のうち、システムが自身の誤りを返さずに、その操作の結果（受け付けない入力への知らせ、本人であることを確かめられなかった知らせ、ドライバーが見つからなかった知らせ、決済サービスが押さえや支払いを受け付けなかった知らせを含む）を応えたもの。システムが応えなかったもの、システム自身の誤りを返したもの、外部のサービス（EXT-01, EXT-02）の失敗や無応答のために操作を終えられなかったものは、GOOD に数えない
    unit: 操作
    counting_rule: VALID と同じ
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の操作。模擬の利用による確かめは別に数える
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う。試験の環境と負荷試験の値は見積もりで、別に扱う
blind_spots: 端末に通信がなくシステムに届かなかった操作と、端末の中で起きた失敗は見えない。端末の中で起きたエラーは FR-52 が依頼と結び付けて記録するが、利用者の側の見る位置になるため、この SLI には数えない
