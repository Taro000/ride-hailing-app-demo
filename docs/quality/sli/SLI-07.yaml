id: SLI-07
title: 依頼の状態の変化を相手に届ける速さ（システムの境界）
status: retired
basis: assumed
basis_note: FRP-11 が FR-53 として受け入れられ、相手の画面に示した時刻を数えられるようになったため、NFR-07 は利用者の側の SLI-14 で数える。この SLI を使う項目はなくなった。しきい値 T_dispatch_propagation（5 秒）は暫定の決定（QAS-25）、迎車が着いたとみなす範囲は QAS-52 による
premises: [OPF-01, QAS-25, QAS-52]
function: GOOD ÷ VALID
refs: [QR-06]
reshaped: 規則 1（平均の時間ではなく、T_dispatch_propagation 以内に届けた割合にした）。規則 4（数える区間を、システムが操作を受けてから相手の端末に向けて送るまでと書いた）
target_entity: 一つの配車依頼の状態の変化（乗客の依頼と取り消し、ドライバーの許諾と取り消し、迎車の乗車場所への到着）を、システムが相手（依頼を届けたドライバー、依頼の乗客、依頼を見ているほかのドライバー）の画面と通知に届けること（FR-04, FR-06, FR-07, FR-10, FR-18, FR-21, FR-23）
purpose: 依頼、許諾、取り消し、迎車の到着が、相手に遅れて届くことがどれだけあるか
unit_event: 一つの状態の変化を、一人の相手に届けること
vantage: system-boundary
vantage_reason: QR-06 が求めるのは相手の画面に示されるまでの時間で、利用者の側が最も近い。システムは相手の画面に示した時刻をまだ記録しないため（FRP-11）、それまではチームが変えられるシステムの中の区間を数える。利用者の側の SLI ができたら、端末と通信の区間も含めて数えられる
existing_source: null
elements:
  VALID:
    definition: 状態の変化のうち、システムが受けた乗客とドライバーの操作（依頼、取り消し、許諾）によるものと、迎車の位置が乗る場所から D_pickup_position_gap（50 m）以内に入ったことによるものを、届けるべき相手ごとに数えたもの
    exclusions: 試験用のアカウントの依頼、模擬の利用による確かめ、負荷試験
    unit: 状態の変化と相手の組
    counting_rule: 同じ変化を同じ相手に何度送っても一つと数える。一つの依頼を 5 人のドライバーに届けたときは 5 と数える。区間は、操作による変化ではシステムがその操作を受けた時刻から、到着ではシステムが乗る場所から 50 m 以内の迎車の位置を受けた時刻から始まり、システムがその変化を相手の端末に向けて送った時刻で終わる。変化はシステムが受けた時刻の日に数える
  GOOD:
    definition: VALID のうち、区間が T_dispatch_propagation（5 秒）以内のもの
    unit: 状態の変化と相手の組
    counting_rule: VALID と同じ。相手の端末に向けて一度も送らなかったものは GOOD に数えない
scale: ratio
applicability: 本番の環境で、デモの回の間（OPF-01）の、利用者の実際の依頼
lifecycle: 本番で測る。デモの回ごとに値をまとめ、振り返りに使う。試験の環境と負荷試験の値は見積もりで、別に扱う
blind_spots: 送ってから相手の画面に示されるまでの通信と端末の時間、相手の端末に通信がなく届かなかったことは見えない。迎車が実際に着いてから、その位置をシステムが受けるまでの遅れも見えない（位置の遅れは SLI-10 が数える）
