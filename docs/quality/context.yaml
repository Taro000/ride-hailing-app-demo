system:
  name: 配車サービス
  boundary: 乗客が乗る場所と降りる場所を決めて配車を手配し、手配した車に乗り、目的地で降り、ドライバーを評価し、マッチするドライバーの評価の閾値を設定するところ。ドライバーが配車依頼を受ける条件を設定し、依頼を選んで許諾し、依頼主を乗せて運転を始め、到着を確かめて決済するところ。運営・サポートの担当者が苦情と返金に対応し、参加者のアカウントを作成し、審査を通ったドライバーと車両を登録し、ドライバーを停止するところ。エンジニアが障害の原因を調べ、機能を追加・修正し、利用技術のバージョンアップに対応するところ。ドライバーと車両の審査そのものと、車の運転そのものは含まない。
  purpose: 乗客とドライバーを結び付け、乗客が配車を手配して目的地まで移動でき、ドライバーが手間なく配車依頼を受けて乗客を運べるようにする
  basis: inferred
constraints:
  - id: CON-01
    statement: 乗客が手配時に確認した料金が、そのまま支払う額になる（確定額）。決済はこのシステムの中で行う
    source: 質問 1 の回答
    basis: confirmed
  - id: CON-02
    statement: このサービスは事業化しないデモである
    source: 質問 4 の回答
    basis: confirmed
