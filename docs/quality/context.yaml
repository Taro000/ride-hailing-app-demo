system:
  name: 配車サービス
  boundary: 乗客が乗る場所と降りる場所を決めて配車を手配し、手配した車に乗り、目的地で降り、ドライバーを評価し、マッチするドライバーの評価の閾値を設定するところ。ドライバーが配車依頼を受ける条件を設定し、依頼を選んで許諾し、依頼主を乗せて運転を始め、到着を確かめて決済するところ。運営・サポートの担当者が苦情と返金に対応し、参加者のアカウントを作成し、審査を通ったドライバーと車両を登録し、ドライバーを停止するところ。エンジニアが障害の原因を調べ、機能を追加・修正し、利用技術のバージョンアップに対応するところ。ドライバーと車両の審査そのものと、車の運転そのものは含まない。
  purpose: 乗客とドライバーを結び付け、乗客が配車を手配して目的地まで移動でき、ドライバーが手間なく配車依頼を受けて乗客を運べるようにする
  basis: inferred
constraints:
  - id: CON-01
    statement: 乗客が確認した料金が、そのまま支払う額になる（確定額）。確定額は手配時に乗客が確認した料金で、乗車中に降りる場所を変えて乗客が新しい料金を承認したときは、その料金に更新される。決済はこのシステムの中で行う
    source: 質問 1 の回答。確定額の更新は第 2 段階の質問 7 の回答
    basis: confirmed
  - id: CON-02
    statement: このサービスは事業化しないデモである
    source: 質問 4 の回答
    basis: confirmed
  - id: CON-03
    statement: 決済と返金は外部の決済サービス（EXT-01）のテスト環境を通して行い、実際のお金は動かない
    source: 第 2 段階の質問 1 の回答
    basis: confirmed
  - id: CON-04
    statement: カードの情報は、このシステムのサーバー、ログ、データを通らず、保存されない。カードの情報は外部の決済サービス（EXT-01）が受け取る
    source: 第 3 段階の質問 1 の回答（カードの情報の扱いの標準を模す開発方針）
    basis: confirmed
  - id: CON-05
    statement: 乗客とドライバーは、開発方針で決めた一種類のスマートフォンのブラウザでこのサービスを使う。ほかの端末とブラウザには対応しない
    source: 第 3 段階の質問 1 の回答（開発方針）
    basis: confirmed
  - id: CON-06
    statement: 参加者は実在の人で、システムが扱う位置情報も本物である。個人の情報の扱いに関する法令に従う
    source: 第 3 段階の質問 1 の回答
    basis: confirmed
  - id: CON-07
    statement: ドライバーと車両の審査の結果（審査の日付と、審査の記録を探す手がかりを含む）と免許の期限は、このシステムに記録しない。審査を通ったかどうかはシステムの外の記録にだけある
    source: 第 3 段階の質問 1 の回答（旅客運送の法令を模す開発方針）と質問 5 の回答
    basis: confirmed
  - id: CON-08
    statement: ドライバーが許諾した後に乗客が依頼を取り消したときはキャンセル料を、乗客の不在で依頼が終わったときは不在の料金を、どちらも 500 円請求する。許諾の前に乗客が取り消したときは無料
    source: 第 2 段階の質問 8 の回答
    basis: confirmed
external_systems:
  - id: EXT-01
    role: 外部の決済サービス（テスト環境で、乗客の支払いと返金を処理する）
    creates_data: true
    basis: confirmed
  - id: EXT-02
    role: 外部の地図のサービス（場所の名前・住所と位置、道と移動時間の見込みのもとになるデータを作る）
    creates_data: true
    source: 第 3 段階の質問 3 の回答
    basis: confirmed
design_inputs:
  - id: DIN-01
    statement: 決済と返金には Stripe のテスト環境（サンドボックス）を使う。システムの中で記録するだけの仮の仕組みは使わない
    source: 第 2 段階の質問 1 の回答
    basis: confirmed
  - id: DIN-02
    statement: 乗客とドライバーが同じ依頼の相手であることは確認コードで確かめる。乗客が伝えたコードをドライバーが入れる
    source: 第 2 段階の質問 2 の回答
    basis: confirmed
  - id: DIN-03
    statement: カードの情報は、決済のサービスが用意する入力部品で入れる
    source: 第 3 段階の質問 1 の回答（カードの情報の扱いの標準を模す開発方針）
    basis: confirmed
  - id: DIN-04
    statement: ネイティブアプリを使わず、スマートフォンのブラウザで使う Web アプリとする。対象は iOS の Safari だけ
    source: 第 3 段階の質問 1 の回答（開発方針）
    basis: confirmed
  - id: DIN-05
    statement: 外部の地図のサービス（EXT-02）は Google Maps Platform を使う
    source: 第 3 段階の質問 3 の回答
    basis: confirmed
  - id: DIN-06
    statement: 新しい版の配備はデモの回を開くときに行う。配車を止めずに新しい版を入れることは求めない
    source: "第 3 段階の未確認の仮定の一覧への訂正（決めたこと #13）"
    basis: confirmed
  - id: DIN-07
    statement: 担当者は参加者に、アカウントの設定の符号を直接渡す
    source: "第 3 段階の未確認の仮定の一覧への訂正（決めたこと #15）"
    basis: confirmed
kgis:
  - id: KGI-01
    name: 流通総額
    measure: 完了した乗車の運賃の総額
    target: null
    basis: confirmed
outcomes:
  - id: OUT-01
    statement: 配車が成立する依頼を増やす
    verb: increase
    kgis: [KGI-01]
    basis: confirmed
  - id: OUT-02
    statement: 許諾後の取り消しと、乗車場所での乗客の不在を減らす
    verb: decrease
    kgis: [KGI-01]
    basis: confirmed
