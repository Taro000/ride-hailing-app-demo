id: QR-62
title: 模擬の運賃表が、模す運賃の定めに合う
status: active
basis: inferred
basis_note: 模擬の運賃表が模す運賃の定めに合うことは質問 1 で確認済み。定めの中身は誰もまだ確かめていない（質問 1 の回答）ため、合っているかを確かめる手立ては未解決の点に挙げた。運賃表はエンジニアが開発の作業として入れる（質問 6）。エンジニアがデータを作る人でもあることは第 1 段階が反映した（USR-03）。最低限守る線とすることは第 4 段階の質問 8 で確認済み（QAS-23）
premises: [QAS-23]
model: data
layer: data-inherent
characteristic: compliance
statement: システムが料金を求めるのに使う模擬の運賃表は、模す運賃の定めに合っている。
