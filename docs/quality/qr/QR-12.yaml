id: QR-12
title: 料金を確かめて依頼、承認、取り消ししたことと、不在として終えたことを後から示せる
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。依頼したときの料金と承認した料金を記録することは FR-45 の受け入れ基準。キャンセル料と不在の料金（CON-08）は第 2 段階の質問 8 の回答で加わり、取り消す前に料金を確かめさせること（FR-07）と乗客の不在として終えること（FR-26）も、後から否定されて困る操作として加えた
premises: [CON-01, CON-08]
model: product
layer: external
characteristic: security > non-repudiation
statement: システムは、乗客がある料金を確かめて依頼したこと、乗車中に新しい降りる場所と料金を承認したこと、許諾の後にキャンセル料がかかることを確かめて取り消したこと、ドライバーが乗客の不在として依頼を終えたこと、ドライバーが到着を確認したことを、誰がいつ行ったかとともに、後から否定できない形で示せる。
applies_to: [FR-04, FR-07, FR-26, FR-28, FR-45, FR-47]
traces_to: [QIU-04, QIU-27]
entry_point: null
stakeholders: [USR-01, USR-02, USR-04]
failure_scenario: 乗客が「新しい料金を承認していない」と苦情を寄せ、担当者は乗客が承認したことを示せず、乗客とドライバーのどちらの言い分が正しいか決められない。乗客が「乗る場所で待っていた」と不在の料金に苦情を寄せ、ドライバーが不在として終えた時刻と場所を示せない。
score: {impact: 3, likelihood: 2}
handling: minimum-line
