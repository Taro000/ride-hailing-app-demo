id: QR-03
title: 一つの依頼の状態と割り当てたドライバーは一つに定まる
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。許諾と取り消しが重なる場面は FR-07、FR-21、FR-23 の受け入れ基準にあり、乗客 1 人とドライバー 1 人で配車は全体で数回のデモ（CON-02、OPF-02、OPF-03）では、重なりはまれとみた。ドライバーが 1 人のため二人のドライバーが同じ依頼を許諾する重なりはデモでは起きず、乗客の取り消しとドライバーの許諾の重なりが残る。扱い（重視）は質問 2 で確認済み（CUJ-01 の組）
premises: [CON-02, OPF-02, OPF-03]
model: data
layer: data-inherent
characteristic: consistency
statement: 一つの配車依頼の状態（ドライバーを探している、許諾された、取り消された、乗車中、終わった）と割り当てたドライバーは、許諾や取り消しの操作が重なっても一つに定まり、乗客とドライバーに示すものと食い違わない。
applies_to: [FR-04, FR-07, FR-18, FR-21, FR-23, FR-26, FR-27]
