id: QR-30
title: 記録した決済と返金の額と結果が EXT-01 の処理と食い違わない
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。EXT-01 が答えなかった決済と返金（FR-29, FR-39）が食い違いの起きやすい場面とみた。返金できる残りの額（FR-40）はこの記録から求まる。照らし合わせて示す機能は第 2 段階で加えないと決めた（第 2 段階の検討して加えなかった機能）。決めたこと 18 の回答の押さえは、第 2 段階の質問 8 の回答で FR-54 になり、押さえ、解除、キャンセル料と不在の料金（CON-08）の記録もこの QR に加えた。扱い（重視）は決めたこと 18、20、23 で確認済み（CUJ-03 の組）。CUJ-15 の組でもある（質問 24）
premises: [CON-03, CON-08, EXT-01]
model: data
layer: data-inherent
characteristic: consistency
statement: システムが依頼と乗車ごとに記録する押さえとその解除、決済、キャンセル料と不在の料金の請求、返金の額と結果（済んだ、済まなかった）は、EXT-01 が実際に処理した額と結果と食い違わない。
