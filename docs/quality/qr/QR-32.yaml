id: QR-32
title: 請求と返金の記録が決済のサービスと一致する
status: draft
version: 3
basis: inferred
basis_note: 決済はテスト環境（質問 1）なので影響を 4 から 3 に下げた。突き合わせ（FR-55）を対象に加えたことは質問 17〜19（2026-11-01）の前提の確認。決済のサービスは Stripe のテスト環境で、仮のスタブは使わない（2026-11-03 の回答、設計 1-4）。押さえを作る FR-05・12 を対象に足したことは、押さえの結果が分からないときの扱い（FR-05 版 3・FR-12 版 4）への追随で推定。点と扱いは推定（変えない）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 運営の責任者]
model: data
layer: data-inherent
characteristic: consistency
statement: 依頼ごとの押さえ、請求（運賃、キャンセル料、不在の料金）、返金の記録は決済のサービスの記録と一致し、示した料金・請求額・返金額が互いに矛盾しない。
applies_to: [FR-05, FR-07, FR-12, FR-27, FR-29, FR-30, FR-31, FR-44, FR-49, FR-50, FR-55]
