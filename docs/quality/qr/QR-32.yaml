entry_point: null
stakeholders: [USR-01, USR-02, USR-04, 決済の外部サービス]
failure_scenario: 応答のなかった請求が実は成功していたのに未払いと記録され、乗客は二重に払い、担当はその記録を見て誤った額を返金する。毎日の突き合わせ（FR-55）が黙って止まり、ずれが見つからないまま残る。押さえの結果が分からないまま手配をやめ、決済のサービスには押さえが残っているのに、記録では押さえがないことになる。
