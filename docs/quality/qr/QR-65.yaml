id: QR-65
title: 地図のサービスが失敗しても答えなくても、そのことを示し、進んでいる配車は続く
status: active
basis: inferred
basis_note: 場所と道のデータを EXT-02 が作ることは質問 3 で確認済み。最低限守る線とすることは質問 2 で確認済み（外部のサービスの失敗と無応答の扱い）。失敗のシナリオと点は推定。新しく作るシステムで、外部のサービスが失敗する場面は年に一度程度とみた。第 2 段階が EXT-02 をインタフェースに加えた FR-06、FR-08、FR-20 も対象の機能に加え、迎車の着く見込み（QIU-08、QIU-15）と依頼の内容（QIU-16）にもたどる
