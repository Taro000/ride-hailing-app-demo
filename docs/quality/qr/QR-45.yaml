basis_note: 返金が EXT-01 のテスト環境を通ることは CON-03。失敗のシナリオと点は推定。EXT-01 が答えなかった返金のやり直し（FR-39, FR-40）と、一つの乗車への二つ目の返金が誤りの起きやすい場面とみた。キャンセル料か不在の料金（CON-08）を請求した依頼への返金も、第 2 段階の質問 8 の回答で同じに扱う（FR-39、FR-40）。扱い（最低限守る線）は質問 22 で確認済み（返金の正しさは最低限守る線とする事業の決め）
