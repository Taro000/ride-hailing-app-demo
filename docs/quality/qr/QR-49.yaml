id: QR-49
title: 到着の記録が実際の到着を表す
status: draft
version: 1
basis: inferred
basis_note: キャンセル料と不在の料金がドライバーの受取額に入る（第 2 段階の質問 15・16）ことから推定。機能の提案（FRP-10）を出し、最低限守る線にすることは質問 17〜19（2026-11-01）。点は推定
needs_agreement: true
approver_candidates: [プロダクトオーナー]
model: data
layer: data-inherent
characteristic: accuracy
statement: ドライバーが知らせた乗車場所への到着の記録（時刻と位置）は、ドライバーが実際に乗車場所に着いたことを表す。不在の料金とキャンセル料は、この記録をもとに請求する。
applies_to: [FR-07, FR-25, FR-27]
traces_to: [QIU-01, QIU-15]
entry_point: null
stakeholders: [USR-01, USR-02]
failure_scenario: ドライバーが乗車場所に着く前に到着を知らせ、T_noshow_wait の後に不在で終えて 500 円を受け取る。乗客は乗車場所に向かっている途中で置いていかれ、不在の料金を請求される。到着を早く知らせると、迎車の遅れで無料になるはずの取り消しにもキャンセル料がかかる。FR-25 は到着の位置を記録するが、確かめずに受け付ける。
score: {impact: 3, likelihood: 2}
handling: minimum-line
handling_reason: デモの参加者で、お金はテストの額なので起こりやすさは低い。ずれは到着の位置と乗る場所のずれの監視（NFR-14）で気づける。支える機能は FRP-10 で提案した（質問 17〜19（2026-11-01））
implies_internal: []
conflicts:
  - with: QR-28
    note: 建物の近くなど現在地の誤差が大きいと、乗車場所にいても離れていると判定され、正しい到着を受け付けられない。D_arrival は現在地の誤差を見込んで決める（FRP-10）
stated_numbers: []
