    change: 疑わしい印の付いた到着の料金は、運営・サポート担当が毎日の一覧で見て、偽りなら返金することを要求に加えた。FR-50 を対象に、運営・サポート担当を利害関係者に足した
    reason: 設計の連鎖が返した課題（疑わしい到着の料金）への 2026-11-03 の利用者の回答（docs/quality-chain-answers.md の設計 2-2）
