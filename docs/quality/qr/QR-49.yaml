id: QR-49
title: 到着の記録が実際の到着を表す
status: draft
version: 3
basis: inferred
basis_note: キャンセル料と不在の料金がドライバーの受取額に入る（第 2 段階の質問 15・16）ことから推定。機能の提案（FRP-10）を出し、最低限守る線にすることは質問 17〜19（2026-11-01）。FRP-10 は FR-25 版 2 として受け入れられた。起こりやすさを 2 から 1 に下げたことは推定（質問 20（2026-11-01、回答なし。推定のまま））。点は推定。位置の列から偽りが疑われる到着（設計の DEC-29 が印を付ける）にも今の規則どおりに料金をかけ、運営・サポート担当が毎日の一覧で見て偽りなら返金することは 2026-11-03 の回答（設計 2-2）で確認済み。点は変えない
needs_agreement: true
approver_candidates: [プロダクトオーナー]
model: data
layer: data-inherent
characteristic: accuracy
statement: ドライバーが知らせた乗車場所への到着の記録（時刻と位置）は、ドライバーが実際に乗車場所に着いたことを表し、位置を確かめられなかった到着にはその印が残る。不在の料金とキャンセル料は、位置を確かめた到着の記録だけをもとに請求する。位置の列から偽りが疑われる到着（疑わしい印の付いた到着）にも今の規則どおりに請求し、運営・サポート担当が毎日の一覧で見て、偽りと判断したら返金する（FR-50）。
applies_to: [FR-07, FR-25, FR-27, FR-50]
traces_to: [QIU-01, QIU-15]
entry_point: null
stakeholders: [USR-01, USR-02, USR-04]
failure_scenario: ドライバーが乗車場所に着く前に到着を知らせ、T_noshow_wait の後に不在で終えて 500 円を受け取る。乗客は乗車場所に向かっている途中で置いていかれ、不在の料金を請求される。到着を早く知らせると、迎車の遅れで無料になるはずの取り消しにもキャンセル料がかかる。FR-25 版 2 で乗る場所から D_arrival より離れた到着は受け付けず、確かめられない到着には印を付けて料金を取らない（FR-27 版 3、FR-07 版 3）。残る失敗は、D_arrival が大きすぎて手前からの到着が通ること、端末の位置を偽ること、印が記録から落ちること。位置を偽った到着は受け付けられて料金がかかり、疑わしい印が毎日の一覧に出ても（NFR-45）、担当が見落とすと返金されない。
score: {impact: 3, likelihood: 1}
handling: minimum-line
handling_reason: デモの参加者で、お金はテストの額なので起こりやすさは低い。ずれは到着の位置と乗る場所のずれの監視（NFR-14）で気づける。支える機能は FR-25 版 2（FRP-10）。扱いは質問 17（2026-11-01）。疑わしい印の付いた到着の料金は自動で止めず、担当が一覧で見て偽りなら返金する（2026-11-03 の回答、設計 2-2）。自動で無料にすると、位置の誤差で誤って印が付いたとき、ドライバーが正しい料金を失い、取り戻す手段がない
implies_internal: []
conflicts:
  - with: QR-28
    note: 建物の近くなど現在地の誤差が大きいと、乗車場所にいても離れていると判定され、正しい到着を受け付けられない。D_arrival は現在地の誤差を見込んで決める。誤差が D_arrival より大きいときは受け付けて印を付ける（FR-25 版 2）。D_arrival と NFR-14 の D_pickup_match は第 4 段階でそろえる
stated_numbers: []
placeholders:
  - name: D_arrival
    meaning: 乗る場所から何メートル以内なら到着を受け付けるか
    from: FR-25
  - name: T_noshow_wait
    meaning: 乗車場所に着いてから何分待てば不在として終えられるか
    from: FR-27
changelog:
