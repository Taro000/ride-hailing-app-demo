id: QR-09
title: 示した料金どおりに一度だけ請求する
status: draft
version: 5
basis: inferred
basis_note: 決済はテスト環境（質問 1）なので影響を 5 から 3 に下げた。たどる QIU-08 は版 2 で有効性になった（誰も実際のお金を失わない）が、示した額どおりに一度だけ決済されることは変わらないので点は変えない。FRP-02 は FR-29 版 2 として受け入れられた。キャンセル料と不在の料金をここで扱うことは質問 17〜19（2026-11-01）の前提の確認。取り消しの公正さを扱う QIU はなく、たどる先は QIU-08 のまま。規則が増えたが点は変えない。FR-10・25 を対象に加えたことは推定（質問 20（2026-11-01、回答なし。推定のまま））。料金が上がる降車場所の変更での押さえ直し（設計の DEC-11）を二重の押さえから除くことは 2026-11-03 の回答（設計 2-6）で確認済み。押さえの結果が分からないときの扱い（FR-05 版 3・FR-12 版 4）、システムによる取り消し（FR-08 版 2）、払い直しの新しいキー（FR-30 版 4）への追随は推定。点と扱いは推定（変えない）
needs_agreement: true
approver_candidates: [プロダクトオーナー, 開発の責任者]
model: product
layer: external
characteristic: functional suitability > functional correctness
statement: システムは、乗車ごとに、手配時に確定した料金（降車場所を変えたときは乗客が承認した変更後の料金）だけを一度だけ請求し、二重の依頼、二重の押さえ、二重の請求を起こさない。料金が上がる降車場所の変更での押さえ直しは二重の押さえに数えないが、押さえ直しの後に古い押さえを残さず、同じ押さえ直しで二つ目の押さえを作らない。許諾の後の取り消しと不在には、決まった額のキャンセル料か不在の料金を一度だけ請求し、迎車が遅れて無料になる取り消しと、システムが取り消した依頼（FR-08）には請求しない。
applies_to: [FR-03, FR-05, FR-07, FR-08, FR-10, FR-12, FR-25, FR-27, FR-29, FR-30, FR-31]
traces_to: [QIU-08]
entry_point: null
stakeholders: [USR-01, 決済の外部サービス]
failure_scenario: 降車場所を変えた後も古い料金で請求する。決済のサービスが応答しない請求を確かめる処理（FR-29）が誤り、別の支払い手段でも払わせて二重に請求する。迎車が到着予定から T_cancel_grace を過ぎていたのにキャンセル料を請求する。取り消しの操作が二度届き、キャンセル料を二度請求する。「位置を確かめられなかった」到着（FR-25）を着いたと扱い、不在の料金や、無料になるはずのキャンセル料を請求する。押さえ直しの後に古い押さえを取り消し忘れ、同じ乗車に押さえが二つ残る。押さえの結果が分からないまま手配をやめ（FR-05）、残っていた押さえを解放しない。T_request_max でシステムが取り消した依頼（許諾したドライバーが取り消して探し直していた依頼を含む）に、許諾の後の取り消しとしてキャンセル料を請求する。
score: {impact: 3, likelihood: 3}
