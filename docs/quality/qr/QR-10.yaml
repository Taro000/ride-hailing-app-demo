id: QR-10
title: 本人であることを確かめた人だけがアカウントを使える
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。本人を確かめて使い始める機能は FR-48（FRP-01 を第 2 段階が受け入れたもの）。どう確かめるかは設計で決める。セキュリティのリスク分析の分類（ログインの方式）にも当たるが、その中身は確かめていない（質問 1）。扱い（重視）は決めたこと 18、20 で確認済み（CUJ-03 の組）
premises: []
model: product
layer: external
characteristic: security > authenticity
statement: システムは、乗客、ドライバー、運営・サポートの担当者、エンジニアが、そのアカウントの本人であることを確かめられてからでなければ、そのアカウントで依頼、許諾、乗車の開始、決済、返金、登録、停止、調査の機能を使わせない。
applies_to: [FR-04, FR-21, FR-27, FR-29, FR-34, FR-35, FR-39, FR-41, FR-43, FR-44, FR-48]
traces_to: [QIU-04, QIU-23, QIU-29]
entry_point: null
stakeholders: [USR-01, USR-02, USR-03, USR-04]
failure_scenario: 乗客のアカウントを他人が使って配車を依頼し、乗客の支払い方法に請求される。担当者のアカウントを他人が使って返金を行う。
