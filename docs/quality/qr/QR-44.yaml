id: QR-44
title: 返金、登録、訂正、停止の操作を、担当者一人ずつまでたどれる
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。訂正したことの記録は FR-41、FR-43 の受け入れ基準、返金の記録は FR-39 の受け入れ基準にあるが、誰が行ったかを記録することは FR-50（FRP-03 を第 2 段階が受け入れたもの）。担当者が本人であることは QR-10。セキュリティのリスク分析の分類（管理の画面の操作の記録）にも当たる（質問 1）。扱い（重視）は決めたこと 15 で確認済み（CUJ-14、CUJ-16 の組）。CUJ-15 の組（質問 24）、CUJ-17 の組（決めたこと 9）、CUJ-18 の組（質問 22）でもある
premises: []
model: product
layer: external
characteristic: security > accountability
statement: 担当者による苦情の対応の記録、返金、アカウントの作成と訂正、試験用の区別の変更、ドライバーと車両の登録と訂正、ドライバーの停止と再開は、どの担当者が、いつ、何を行ったかまで、一人ずつたどれる。
