id: QR-04
title: 押さえる額、請求する額と示す額が確定額や決まりの料金と一致し、一度だけ請求する
status: active
basis: assumed
basis_note: 確定額の決まりは CON-01、決済が EXT-01 のテスト環境を通ることは CON-03。依頼のときに確定額を押さえ、決済ではその押さえから請求すること、許諾の後の乗客の取り消しと乗客の不在ではキャンセル料と不在の料金（CON-08）を請求することは第 2 段階の質問 8（FR-54）。キャンセル料と不在の料金の正しさをこの QR に含めて重視とすることは質問 21 と質問 23 で確認済み。失敗のシナリオと点は推定。乗車中の料金の更新と押さえ直し（FR-47、FR-54）、EXT-01 が答えないときのやり直し（FR-29, FR-30）、許諾の前と後の境目（ドライバーが取り消して届け直している間の乗客の取り消しは無料、FR-54）が誤りの起きやすい場面とみた。扱い（重視）は決めたこと 18、23 で確認済み（CUJ-03 の組。CUJ-08 の組でもある、決めたこと 21）。競合の T_payment_response の値（10 秒）は第 4 段階が提案した仮の値で、QAS-33 による仮定
premises: [CON-01, CON-03, CON-08, EXT-01, QAS-33]
model: product
layer: external
characteristic: functional suitability > functional correctness
statement: システムは、一つの乗車について、確定額（CON-01）を乗客に一度だけ請求し、依頼のときに押さえる額、乗客に示す料金、ドライバーに示す金額、請求する額、乗客に示す支払った額をどれも確定額と一致させる。乗車中に乗客が新しい料金を承認したときは、承認した料金で同じことが成り立つ。キャンセル料と不在の料金（CON-08）は、ドライバーが許諾した後に乗客が取り消した依頼と乗客の不在で終わった依頼にだけ、CON-08 の額で一つの依頼に一度だけ請求し、どのドライバーも許諾していない間に取り消された依頼と許諾のないまま終わった依頼には何も請求しない。どの場合も、請求の後に押さえの残りを解き、乗客に示す請求した額とその種類は請求した額と一致する。
applies_to: [FR-03, FR-07, FR-20, FR-23, FR-26, FR-29, FR-30, FR-31, FR-47, FR-54]
traces_to: [QIU-04, QIU-19]
entry_point: null
stakeholders: [USR-01, USR-02, EXT-01]
failure_scenario: 乗車中に降りる場所を変えて承認した料金が押さえ直されず決済に使われずに元の料金で請求される、または EXT-01 が答えなかった決済をドライバーがやり直して二重に請求される。ドライバーが取り消して届け直している間に乗客が取り消したのに、許諾の後の取り消しとしてキャンセル料が請求される。乗客は確認していない額を請求される。
score: {impact: 5, likelihood: 3}
handling: emphasized
handling_reason: null
implies_internal: [QR-50]
conflicts:
