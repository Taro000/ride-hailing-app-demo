statement: システムは、一つの乗車について、確定額（CON-01）を乗客に一度だけ請求し、乗客に示す料金、ドライバーに示す金額、請求する額、乗客に示す支払った額をどれも確定額と一致させる。乗車中に乗客が新しい料金を承認したときは、承認した料金で同じことが成り立つ。
