basis_note: 確定額の決まりは CON-01、決済が EXT-01 のテスト環境を通ることは CON-03。失敗のシナリオと点は推定。乗車中の料金の更新（FR-47）と、EXT-01 が答えないときのやり直し（FR-29, FR-30）が誤りの起きやすい場面とみた。扱い（重視）は #18 で確認済み（CUJ-03 の組。CUJ-08 でもたどる）
