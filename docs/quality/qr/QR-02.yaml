id: QR-02
title: 端末との通信が途切れても、進んでいる配車が失われない
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。QIU-01 の利用状況（通信は問わない）と、乗客とドライバーが屋外や走る車の中でスマートフォンを使うことから、通信の途切れは毎週起きるとみた。扱い（最低限守る線）は質問 4 で確認済み（CUJ-01 の QIU にたどり、CUJ-01 の組の外に置く）
