id: QR-01
title: 配車の依頼から決済まで、使いたいときに使える
status: active
basis: inferred
basis_note: 失敗のシナリオと点は推定。まだ作っておらず（第 2 段階の質問 4）止まった記録はないため、起こりやすさは新しく作るシステムとして見積もった。どの部分の停止が配車の流れを止めるかは設計が確かめる。本人であることを確かめて使い始めること（FR-48）と依頼のときの押さえ（FR-54）は、止まると依頼から先に進めないため対象の機能に入れた。扱い（重視）は質問 2 で確認済み（CUJ-01 の組）。CUJ-02、CUJ-08 の組（質問 21）、CUJ-06、CUJ-07 の組（決めたこと 17、16）でもある
premises: []
model: product
layer: external
characteristic: reliability > availability
statement: システムは、乗客が配車を依頼し、ドライバーが依頼を受けて迎えに行き、乗車を始め、到着を確認して決済を終えるまでの一連の機能を、乗客とドライバーが使おうとしたときに使える状態に保つ。
