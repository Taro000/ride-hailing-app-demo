status: active
basis: assumed
basis_note: 記録が欠けないことを障害の原因の特定と苦情への対応の両方で重視することは #12 と #15 で確認済み。苦情と返金の求めをシステムの中で受け付けることは QAS-06 による暫定の決定。端末で起きたエラーを記録する機能はどの FR にもなく、FRP-09 で提案した。失敗のシナリオと点は推定
