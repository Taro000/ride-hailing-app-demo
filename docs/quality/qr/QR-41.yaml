id: QR-41
title: 依頼の状態の履歴、端末で起きたエラー、寄せられた苦情と報告の記録が欠けない
status: active
basis: inferred
basis_note: 記録が欠けないことを障害の原因の特定と苦情への対応の両方で重視することは決めたこと 12 と 15 で確認済み（CUJ-10、CUJ-14 の組）。CUJ-15 の組でもある（質問 24）。苦情と返金の求めをシステムの中で受け付け、寄せるのは自分の乗車についての乗客だけであることは、第 1 段階の質問 7 の回答（QAS-06 への訂正、FR-37）。乗車中の危険の報告は、QIU-07 の廃止（決めたこと 19）とともに FR-37 から外れた。端末で起きたエラーの記録は FR-52（FRP-09 を第 2 段階が受け入れたもの）。失敗のシナリオと点は推定
premises: [QAS-06]
model: data
layer: data-inherent
characteristic: completeness
statement: 依頼ごとの状態の変化の履歴、乗客とドライバーの端末で起きたエラー、乗客が自分の乗車について寄せた苦情と返金の求めは、一件も欠けずに関わる依頼や乗車と結び付いて記録され、苦情と返金の求めは終えるまでの状態とともに担当者に示されている。
