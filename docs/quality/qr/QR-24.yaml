id: QR-24
title: 到着を確認してから決済の結果を示すまで、乗客を待たせない
status: active
basis: assumed
basis_note: 失敗のシナリオと点は推定。決済の処理は EXT-01 が行う（CON-03）。EXT-01 のテスト環境の応答の速さは入力になく、設計が確かめる。乗客の作業の時間 T_alighting は QIU-12 に残す。T_payment_response の値（10 秒）は第 4 段階が提案した仮の値で、QAS-33 による仮定
premises: [CON-03, EXT-01, QAS-33]
model: product
layer: external
characteristic: performance efficiency > time behaviour
statement: システムは、ドライバーが到着を確認して決済を行ってから、済んだか済まなかったか、または済んだかどうか分からないことを、T_payment_response（10 秒）以内にドライバーと乗客に示す。
applies_to: [FR-28, FR-29, FR-31]
traces_to: [QIU-12, QIU-19]
entry_point: null
stakeholders: [USR-01, USR-02, EXT-01]
failure_scenario: 着いてからドライバーが決済を行っても結果がなかなか示されず、乗客は降りてよいか分からずに車内で待ち、ドライバーは次の依頼を受けられない。
